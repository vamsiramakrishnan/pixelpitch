# Pattern manifest — slidify Tier-0 recipes.
#
# Each entry has:
#   id          unique pattern identifier (logged in telemetry)
#   priority    integer, lower = evaluated first
#   match       conjunctive predicate over the unit (every clause must hold)
#   emit        decision spec to produce on hit
#   tag         "decision" (default) or "structural" (observe-only, no decision override)
#
# Predicate vocabulary lives in slidify/patterns/matcher.py — every clause
# below maps to a registered handler. Adding a new clause means extending
# the handler table once; subsequent patterns are pure data.
#
# Style note: prefer multiple narrow patterns over one wide pattern. False
# positives at this layer demote tier-1's accuracy, so we'd rather miss
# (defer to tier 1) than over-claim.

patterns:
  # =========================================================================
  # MUST-RASTER — short-circuit before any other recipe.
  # =========================================================================

  - id: rasterize-only-class
    priority: 1
    match:
      classes_any_rasterize_only: true
    emit:
      kind: Raster
      confidence: 0.99
      metadata: { recipe: rasterize_only_class }

  - id: filter-active
    priority: 2
    match:
      filter: any
    emit:
      kind: Raster
      confidence: 0.95
      metadata: { recipe: filter_active }

  - id: pptx-unsupported-blend-mode
    priority: 3
    match:
      mix_blend_mode: any
    emit:
      kind: Raster
      confidence: 0.95
      metadata: { recipe: pptx_unsupported_blend_mode }

  - id: pptx-unsupported-backdrop-filter
    priority: 4
    match:
      backdrop_filter: any
    emit:
      kind: Raster
      confidence: 0.95
      metadata: { recipe: pptx_unsupported_backdrop_filter }

  - id: pptx-unsupported-text-image-mask
    priority: 5
    match:
      text_image_mask: any
    emit:
      kind: Raster
      confidence: 0.95
      metadata: { recipe: pptx_unsupported_text_image_mask }

  - id: pptx-unsupported-bg-image-url
    priority: 6
    match:
      bg_image_url: any
    emit:
      kind: Raster
      confidence: 0.9
      metadata: { recipe: pptx_unsupported_bg_image_url }

  # =========================================================================
  # TYPOGRAPHY  — leaf or text-container units that classify as NativeText
  # with a known role/size/weight.
  # =========================================================================

  - id: kicker-tailwind
    priority: 10
    match:
      children: none
      own_text: true
      font_size_px_max: 14
      classes_any:
        - tracking-wide
        - tracking-wider
        - tracking-widest
        - uppercase
    emit:
      kind: NativeText
      confidence: 0.95
      metadata: { recipe: kicker, role: kicker }

  - id: kicker-from-css
    priority: 11
    match:
      children: none
      own_text: true
      font_size_px_max: 14
      font_weight_min: 600
      text_length_max: 60
    emit:
      kind: NativeText
      confidence: 0.85
      metadata: { recipe: kicker_from_css, role: kicker }

  - id: title-h1
    priority: 12
    match:
      anchor.tag_in: [H1]
      own_text: true
    emit:
      kind: NativeText
      confidence: 0.95
      metadata: { recipe: title_h1, role: title }

  - id: title-h2
    priority: 13
    match:
      anchor.tag_in: [H2]
      own_text: true
    emit:
      kind: NativeText
      confidence: 0.95
      metadata: { recipe: title_h2, role: heading }

  - id: title-large-class
    priority: 14
    match:
      children: none
      own_text: true
      classes_any:
        - text-5xl
        - text-6xl
        - text-7xl
        - text-8xl
        - text-9xl
      font_weight_min: 600
    emit:
      kind: NativeText
      confidence: 0.95
      metadata: { recipe: title_large, role: title }

  - id: subtitle
    priority: 15
    match:
      anchor.tag_in: [H3, H4]
      own_text: true
    emit:
      kind: NativeText
      confidence: 0.92
      metadata: { recipe: subtitle, role: subheading }

  - id: caption-italic
    priority: 16
    match:
      children: none
      own_text: true
      font_size_px_max: 14
      classes_any: [italic]
    emit:
      kind: NativeText
      confidence: 0.9
      metadata: { recipe: caption, role: caption }

  - id: footer-text
    priority: 17
    match:
      children: none
      own_text: true
      bbox.bottom_min: 660
      font_size_px_max: 16
      text_length_max: 200
    emit:
      kind: NativeText
      confidence: 0.85
      metadata: { recipe: footer_text, role: footer }

  - id: body-paragraph
    priority: 19
    match:
      children: none
      own_text: true
      font_size_px_min: 14
      font_size_px_max: 22
      font_weight_max: 500
      text_length_min: 24
    emit:
      kind: NativeText
      confidence: 0.9
      metadata: { recipe: body_paragraph, role: body }

  - id: short-label
    priority: 20
    match:
      anchor.tag_in: [DIV, P, SPAN]
      children: none
      own_text: true
      font_size_px_min: 12
      font_size_px_max: 18
      text_length_max: 80
    emit:
      kind: NativeText
      confidence: 0.85
      metadata: { recipe: short_label, role: label }

  - id: long-paragraph
    priority: 21
    match:
      anchor.tag_in: [P, DIV]
      children: none
      own_text: true
      font_size_px_min: 14
      font_size_px_max: 28
      text_length_min: 80
    emit:
      kind: NativeText
      confidence: 0.92
      metadata: { recipe: long_paragraph, role: body }

  - id: page-number
    priority: 18
    match:
      children: none
      own_text: true
      text_length_max: 16
      bbox.bottom_min: 640
      bbox.w_max: 200
      font_size_px_max: 16
    emit:
      kind: NativeText
      confidence: 0.85
      metadata: { recipe: page_number, role: page_number }

  # ---- Caption / micro-label classes (sub, src, chart-sub, byline, caption,
  # legend-item, meta) — small text under 14px that the existing short-label
  # recipe (font_size_px_min:12) misses for sub-12px sizes. Surfaced by the
  # 15-slide harvester as the highest-frequency unmatched-signature cluster.
  - id: caption-text-known-class
    priority: 22
    match:
      anchor.tag_in: [DIV, P, SPAN]
      children: none
      own_text: true
      classes_any:
        - src
        - chart-sub
        - byline
        - caption
      font_size_px_max: 14
      bbox.h_max: 40
      text_length_max: 140
    emit:
      kind: NativeText
      confidence: 0.9
      metadata: { recipe: caption_text, role: caption }

  - id: small-subtitle-class
    priority: 23
    match:
      anchor.tag_in: [DIV, SPAN]
      children: none
      own_text: true
      classes_any: [sub]
      font_size_px_max: 14
      bbox.h_max: 40
      text_length_max: 80
    emit:
      kind: NativeText
      confidence: 0.88
      metadata: { recipe: small_subtitle, role: subheading }

  - id: legend-item-text
    priority: 24
    match:
      anchor.tag_in: [SPAN, DIV]
      children: none
      own_text: true
      classes_any: [legend-item]
      font_size_px_max: 16
      bbox.h_max: 40
      text_length_max: 60
    emit:
      kind: NativeText
      confidence: 0.9
      metadata: { recipe: legend_item, role: legend }

  - id: badge-text-no-decoration
    priority: 25
    match:
      anchor.tag_in: [DIV, SPAN]
      children: none
      own_text: true
      classes_any: [badge]
      has_visible_decoration: false
      font_size_px_max: 14
      bbox.h_max: 32
      bbox.w_max: 240
      text_length_max: 40
    emit:
      kind: NativeText
      confidence: 0.88
      metadata: { recipe: badge_text, role: label }

  - id: meta-byline-leaf
    priority: 26
    match:
      anchor.tag_in: [DIV, SPAN, P]
      children: none
      own_text: true
      classes_any: [meta]
      font_size_px_max: 16
      bbox.h_max: 40
      text_length_max: 80
    emit:
      kind: NativeText
      confidence: 0.85
      metadata: { recipe: meta_byline, role: caption }

  - id: micro-text-tiny
    priority: 27
    match:
      anchor.tag_in: [DIV, SPAN, P]
      children: none
      own_text: true
      font_size_px_min: 9
      font_size_px_max: 11
      bbox.h_max: 24
      text_length_min: 4
      text_length_max: 80
    emit:
      kind: NativeText
      confidence: 0.8
      metadata: { recipe: micro_text, role: caption }

  # =========================================================================
  # STAT NUMBERS — large display digits (KPI emphasis).
  # =========================================================================

  - id: stat-number-tailwind
    priority: 30
    match:
      children: none
      own_text: true
      classes_any:
        - text-5xl
        - text-6xl
        - text-7xl
        - text-8xl
        - text-9xl
      font_weight_min: 600
      text_length_max: 12
    emit:
      kind: NativeText
      confidence: 0.95
      metadata: { recipe: stat_number, role: stat }

  - id: stat-number-from-css
    priority: 31
    match:
      children: none
      own_text: true
      font_size_px_min: 56
      font_weight_min: 600
      text_length_max: 12
    emit:
      kind: NativeText
      confidence: 0.92
      metadata: { recipe: stat_number_from_css, role: stat }

  - id: stat-number-with-runs
    priority: 32
    match:
      anchor.tag_in: [DIV, SPAN, P]
      font_size_px_min: 48
      font_weight_min: 600
      text_length_max: 12
    emit:
      kind: NativeText
      confidence: 0.88
      metadata: { recipe: stat_number_runs, role: stat }

  # =========================================================================
  # PILLS / BADGES / CHIPS — small rounded containers with text.
  # =========================================================================

  - id: pill-tailwind
    priority: 5
    match:
      children: none
      own_text: true
      classes_any: [rounded-full]
      bbox.h_max: 64
      bbox.w_max: 320
      text_length_max: 60
    emit:
      kind: NativeText
      confidence: 0.95
      metadata: { recipe: pill }

  - id: pill-from-css
    priority: 6
    match:
      children: none
      own_text: true
      border_radius_px_min: 100
      bbox.h_max: 64
      bbox.w_max: 320
      text_length_max: 60
    emit:
      kind: NativeText
      confidence: 0.9
      metadata: { recipe: pill_from_css }

  - id: badge-rounded-md
    priority: 7
    match:
      children: none
      own_text: true
      classes_any: [rounded, rounded-md, rounded-lg]
      bbox.h_max: 40
      bbox.w_max: 240
      font_size_px_max: 14
      font_weight_min: 600
      text_length_max: 30
    emit:
      kind: NativeText
      confidence: 0.9
      metadata: { recipe: badge }

  # =========================================================================
  # BUTTONS — solid, outline, ghost.
  # =========================================================================

  - id: button-solid-tailwind
    priority: 50
    match:
      children: none
      own_text: true
      classes_any: [rounded-md, rounded-lg, rounded-xl, rounded-2xl, rounded-full]
      classes_glob_any: ["bg-*"]
      classes_none: [text-xs]
      bbox.h_max: 80
      bbox.w_max: 480
      font_size_px_max: 24
      text_length_max: 60
    emit:
      kind: NativeText
      confidence: 0.92
      metadata: { recipe: button_solid, role: cta }

  - id: button-outline-tailwind
    priority: 51
    match:
      children: none
      own_text: true
      classes_any: [rounded-md, rounded-lg, rounded-xl, rounded-2xl, rounded-full]
      classes_glob_any: ["border-*"]
      bbox.h_max: 80
      bbox.w_max: 480
      font_size_px_max: 24
      text_length_max: 60
    emit:
      kind: NativeText
      confidence: 0.9
      metadata: { recipe: button_outline, role: cta }

  # =========================================================================
  # DIVIDERS — hairline horizontals/verticals.
  # =========================================================================

  - id: hairline-divider
    priority: 60
    match:
      children: none
      own_text: false
      bbox.aspect_min: 32
      has_visible_decoration: true
    emit:
      kind: NativeShape
      confidence: 0.95
      metadata: { recipe: hairline }

  # =========================================================================
  # CARDS — gradient, solid, decoration.
  # =========================================================================

  - id: gradient-card-no-text
    priority: 70
    match:
      children: none
      own_text: false
      bg_image_kind: gradient
    emit:
      kind: NativeShape
      confidence: 0.95
      metadata: { recipe: gradient_card }

  - id: gradient-card-with-text
    priority: 71
    match:
      children: none
      own_text: true
      bg_image_kind: gradient
    emit:
      kind: NativeText
      confidence: 0.92
      metadata: { recipe: gradient_text_card }

  - id: decoration-card
    priority: 72
    match:
      children: none
      own_text: false
      has_visible_decoration: true
      transform: none
      filter: none
      bg_image_kind: none
    emit:
      kind: NativeShape
      confidence: 0.92
      metadata: { recipe: decoration_card }

  - id: shadcn-card-dark
    priority: 100
    tag: structural
    match:
      anchor.tag_in: [DIV, SECTION, ARTICLE]
      classes_any: [rounded-xl, rounded-2xl]
      anchor.bg_dark: true
      children: any
    emit:
      kind: observe
      confidence: 1.0
      metadata: { recipe: shadcn_card_dark }

  - id: shadcn-card-light
    priority: 101
    tag: structural
    match:
      anchor.tag_in: [DIV, SECTION, ARTICLE]
      classes_any: [rounded-xl, rounded-2xl]
      anchor.bg_light: true
      children: any
    emit:
      kind: observe
      confidence: 1.0
      metadata: { recipe: shadcn_card_light }

  # =========================================================================
  # COMPOSITE CARDS — parents whose children are all text-bearing. We promote
  # the parent to NativeShape (the decoration). Children classify themselves.
  # Surfaced by harvester runs against the showcase deck (stat blocks, feature
  # cards with title + body text).
  # =========================================================================

  - id: stat-card-composite
    priority: 75
    match:
      children: any
      n_children_min: 2
      children_only_text: true
      children_text_count_min: 2
      bg_image_kind: gradient
    emit:
      kind: NativeShape
      confidence: 0.92
      metadata: { recipe: stat_card_composite }

  - id: text-card-composite
    priority: 76
    match:
      children: any
      n_children_min: 2
      n_children_max: 6
      children_only_text: true
      children_text_count_min: 2
      has_visible_decoration: true
      transform: none
      filter: none
      bg_image_kind: none
    emit:
      kind: NativeShape
      confidence: 0.9
      metadata: { recipe: text_card_composite }

  - id: feature-card-with-icon
    priority: 77
    match:
      children: any
      n_children_min: 2
      n_children_max: 6
      has_visible_decoration: true
      children_with_gradient_count_min: 1
      transform: none
      filter: none
    emit:
      kind: NativeShape
      confidence: 0.9
      metadata: { recipe: feature_card_with_icon }

  # =========================================================================
  # SECTION HEADERS — kicker + title pair near top of slide.
  # =========================================================================

  - id: section-marker-large-number
    priority: 80
    match:
      children: none
      own_text: true
      font_size_px_min: 96
      text_length_max: 4
    emit:
      kind: NativeText
      confidence: 0.95
      metadata: { recipe: section_marker, role: section_number }

  # =========================================================================
  # MEDIA — single <img> filling its container, captions.
  # =========================================================================

  - id: image-fills-unit
    priority: 90
    match:
      children: none
      anchor.is_img: true
    emit:
      kind: NativePicture
      confidence: 0.98
      metadata: { recipe: image_fills_unit }

  # =========================================================================
  # CHARTS — canvas always rasters at tier 0 too (so we count it correctly).
  # =========================================================================

  - id: canvas-chart
    priority: 95
    match:
      anchor.is_canvas: true
    emit:
      kind: Raster
      confidence: 1.0
      metadata: { recipe: canvas_chart, role: chart }

  # =========================================================================
  # CODE BLOCKS — monospace + dark bg.
  # =========================================================================

  - id: code-block-tailwind
    priority: 110
    match:
      anchor.tag_in: [PRE, CODE]
      own_text: true
      anchor.bg_dark: true
    emit:
      kind: NativeText
      confidence: 0.92
      metadata: { recipe: code_block, role: code }

  # =========================================================================
  # AVATAR / ICON CONTAINER — circular small element with no text.
  # =========================================================================

  - id: avatar-circle
    priority: 120
    match:
      children: none
      own_text: false
      classes_any: [rounded-full]
      bbox.h_max: 96
      bbox.w_max: 96
      bbox.aspect_max: 1.2
    emit:
      kind: NativeShape
      confidence: 0.92
      metadata: { recipe: avatar }

  - id: icon-square
    priority: 121
    match:
      children: none
      own_text: false
      classes_any: [rounded-md, rounded-lg, rounded-xl]
      bbox.h_max: 80
      bbox.w_max: 80
      bbox.aspect_max: 1.2
      has_visible_decoration: true
    emit:
      kind: NativeShape
      confidence: 0.9
      metadata: { recipe: icon_square }

  # =========================================================================
  # TIMELINE / PROCESS STEPS — repeated sibling items often hit tier 1's
  # ListItem path; we add high-confidence step number emit.
  # =========================================================================

  - id: step-number
    priority: 130
    match:
      children: none
      own_text: true
      font_weight_min: 700
      bbox.w_max: 120
      bbox.h_max: 48
      text_length_max: 4
    emit:
      kind: NativeText
      confidence: 0.85
      metadata: { recipe: step_number, role: step }

  # =========================================================================
  # FORMS / SEARCH BARS (rarely on slides, but we tag them).
  # =========================================================================

  - id: input-field
    priority: 140
    match:
      anchor.tag_in: [INPUT, TEXTAREA]
    emit:
      kind: Raster
      confidence: 0.85
      metadata: { recipe: input_raster }

  # =========================================================================
  # BACKGROUND DECORATIONS that we know we can fully translate.
  # Slide-sized gradient background with no text content of its own.
  # Lets the body unit emit as a native gradient shape; children emit on top.
  # =========================================================================

  - id: slide-gradient-bg
    priority: 200
    match:
      anchor.tag_in: [BODY, HTML]
      bg_image_kind: gradient
      children: any
    emit:
      kind: NativeShape
      confidence: 0.85
      metadata: { recipe: slide_gradient_bg }

  - id: slide-solid-bg
    priority: 201
    match:
      anchor.tag_in: [BODY, HTML]
      bg_image_kind: none
      children: any
    emit:
      kind: NativeShape
      confidence: 0.85
      metadata: { recipe: slide_solid_bg }
