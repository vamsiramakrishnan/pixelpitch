# Atom catalog — recipes keyed off the `data-atom` author hint.
#
# When an HTML element carries `data-atom="bg.mesh"`, the matcher's
# `anchor.data_atom_id` predicate fires and routes the unit to the recipe
# below. This bypasses signature inference entirely: the deck author is
# declaring "this cluster is exactly this atom — emit it natively." The
# trade-off the author opts into is that the recipe assumes the markup
# matches the atom's canonical structure (see `examples/landing/atoms.html`
# for the reference shapes).
#
# Atoms are organised by axis (10 total):
#   comp.*    composition gestures        (centered, split, golden, …)
#   bg.*      background fields           (mesh, conic, halftone, …)
#   surf.*    surfaces                    (glass, hero, sticker, …)
#   type.*    type treatments             (gfill, stroke, echo, …)
#   mask.*    media masks                 (disc, arch, hex, …)
#   dec.*     decorative tokens           (brackets, registration, …)
#   data.*    data primitives             (ring, gauge, sparkline, …)
#   motion.*  motion implication          (echo, marquee, particles, …)
#   ui.*      UI mocks                    (browser, toolbar, toast, …)
#   anno.*    annotation primitives       (leader, dimension, reticle, …)
#
# Priority sits in the 50–80 band — *after* the must-raster gates (1–9)
# and the typography/decoration tier-0 rules (10–48), so authoring an
# atom doesn't override a hard constraint, but *before* the generic
# fall-through patterns (priority ≥ 100) so the atom recipe wins by
# declaration.
#
# Every recipe routes to a native emit kind:
#   - bg.*, surf.*, mask.*    → NativeShape (gradient/clip-path → custGeom)
#   - type.*                  → NativeText  (per-run font/weight/color)
#   - data.*, dec.*, anno.*   → NativeSvg   (primitives stay as shapes)
#   - ui.*                    → NativeShape composite (cluster of shapes)
#   - comp.*                  → observe-only (layout hint, not an emit)
#
# Authors compose recipes in `examples/landing/recipes.html` by stacking
# atoms across axes. The matcher resolves each `data-atom`-tagged anchor
# independently — the composition emerges from z-ordered stacking, not
# from a meta-recipe.

patterns:

  # ── composition gestures: structural-only (no decision override) ────────
  - id: atom-comp-any
    priority: 50
    match:
      anchor.data_atom_namespace: comp
    tag: structural
    emit:
      kind: observe
      metadata: { recipe: atom_comp, namespace: comp }

