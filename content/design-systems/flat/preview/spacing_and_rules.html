<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Spacing &amp; Rules — Flat</title>
  <link rel="stylesheet" href="../colors_and_type.css">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: var(--font-body, system-ui, sans-serif);
      background: var(--paper, #ffffff);
      color: var(--ink, #111111);
      line-height: 1.6;
    }

    .page {
      max-width: 1100px;
      margin: 0 auto;
      padding: 96px 64px;
    }

    /* Header / Stage head */
    .header {
      margin-bottom: 96px;
      position: relative;
    }

    .header__kicker {
      font-family: var(--font-mono, ui-monospace, monospace);
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--slate, #666666);
      margin-bottom: 16px;
    }

    .header__title {
      font-family: var(--font-display, system-ui, sans-serif);
      font-size: 64px;
      font-weight: 700;
      line-height: 1.1;
      letter-spacing: -0.02em;
      color: var(--ink, #111111);
      margin-bottom: 12px;
      max-width: 90%;
    }

    .header__subtitle {
      font-family: var(--font-body, system-ui, sans-serif);
      font-size: 18px;
      font-weight: 400;
      line-height: 1.6;
      color: var(--slate, #666666);
      max-width: 75%;
      margin-bottom: 32px;
    }

    .header__rule {
      display: block;
      width: 80px;
      height: 4px;
      background: var(--signal, #3b82f6);
      border: none;
      margin-top: 28px;
      border-radius: 2px;
    }

    /* Section */
    .section {
      margin-bottom: 96px;
    }

    .section__label {
      font-family: var(--font-mono, ui-monospace, monospace);
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--slate, #666666);
      margin-bottom: 48px;
      padding-bottom: 16px;
      border-bottom: 1px solid var(--border, #e5e5e5);
    }

    /* Spacing scale */
    .spacing-row {
      display: grid;
      grid-template-columns: 120px 1fr 100px;
      gap: 24px;
      align-items: center;
      padding: 20px 0;
      border-bottom: 1px solid var(--border, #e5e5e5);
    }

    .spacing-row:last-child {
      border-bottom: none;
    }

    .spacing-row__name {
      font-family: var(--font-mono, ui-monospace, monospace);
      font-size: 13px;
      font-weight: 600;
      color: var(--ink, #111111);
    }

    .spacing-row__label {
      font-family: var(--font-body, system-ui, sans-serif);
      font-size: 12px;
      color: var(--slate, #666666);
      margin-top: 4px;
    }

    .spacing-row__bar-wrap {
      height: 32px;
      display: flex;
      align-items: center;
    }

    .spacing-row__bar {
      height: 3px;
      background: var(--signal, #3b82f6);
      min-width: 3px;
      border-radius: 1.5px;
      transition: opacity 0.2s ease;
    }

    .spacing-row:hover .spacing-row__bar {
      opacity: 0.7;
    }

    .spacing-row__value {
      font-family: var(--font-mono, ui-monospace, monospace);
      font-size: 13px;
      font-weight: 600;
      color: var(--ink, #111111);
      text-align: right;
    }

    /* Depth levels */
    .depth-demo {
      padding: 32px 0;
      border-bottom: 1px solid var(--border, #e5e5e5);
    }

    .depth-demo:last-child {
      border-bottom: none;
    }

    .depth-demo__header {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      margin-bottom: 20px;
    }

    .depth-demo__name {
      font-family: var(--font-mono, ui-monospace, monospace);
      font-size: 13px;
      font-weight: 600;
      color: var(--ink, #111111);
    }

    .depth-demo__label {
      font-family: var(--font-body, system-ui, sans-serif);
      font-size: 12px;
      color: var(--slate, #666666);
    }

    .depth-demo__spec {
      font-family: var(--font-mono, ui-monospace, monospace);
      font-size: 12px;
      color: var(--slate, #666666);
    }

    .depth-demo__container {
      width: 100%;
      padding: 40px 0;
      display: flex;
      align-items: center;
      background: var(--bone, #f5f5f5);
      border-radius: 8px;
    }

    .depth-demo__box {
      width: 240px;
      height: 120px;
      margin: 0 auto;
      background: var(--paper, #ffffff);
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: var(--font-body, system-ui, sans-serif);
      font-size: 14px;
      color: var(--slate, #666666);
    }

    /* Border radius */
    .radius-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 64px;
      margin-bottom: 48px;
    }

    .radius-item {
      display: grid;
      grid-template-columns: 160px 1fr;
      gap: 32px;
      align-items: center;
    }

    .radius-item__demo {
      display: flex;
      gap: 16px;
      align-items: center;
    }

    .radius-item__box {
      width: 120px;
      height: 120px;
      background: var(--paper, #ffffff);
      border: 2px solid var(--signal, #3b82f6);
      flex-shrink: 0;
    }

    .radius-item__info {
      flex: 1;
    }

    .radius-item__name {
      font-family: var(--font-mono, ui-monospace, monospace);
      font-size: 13px;
      font-weight: 600;
      color: var(--ink, #111111);
      margin-bottom: 6px;
    }

    .radius-item__value {
      font-family: var(--font-mono, ui-monospace, monospace);
      font-size: 12px;
      color: var(--slate, #666666);
      margin-bottom: 12px;
    }

    .radius-item__description {
      font-family: var(--font-body, system-ui, sans-serif);
      font-size: 13px;
      line-height: 1.6;
      color: var(--slate, #666666);
    }

    /* Philosophy block */
    .philosophy {
      background: var(--bone, #f5f5f5);
      padding: 48px;
      border: 1px solid var(--border, #e5e5e5);
      border-radius: 8px;
      margin-bottom: 64px;
    }

    .philosophy__title {
      font-family: var(--font-mono, ui-monospace, monospace);
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--slate, #666666);
      margin-bottom: 16px;
    }

    .philosophy__text {
      font-family: var(--font-body, system-ui, sans-serif);
      font-size: 16px;
      line-height: 1.7;
      color: var(--ink, #111111);
    }

    .philosophy__text strong {
      font-weight: 600;
      color: var(--ink, #111111);
    }

    .philosophy__text em {
      font-style: italic;
    }

    .philosophy__text code {
      font-family: var(--font-mono, ui-monospace, monospace);
      background: rgba(59, 130, 246, 0.1);
      padding: 3px 8px;
      font-size: 0.95em;
      border-radius: 4px;
      color: var(--signal, #3b82f6);
    }

    /* Grid demo */
    .grid-demo {
      background: var(--bone, #f5f5f5);
      padding: 48px;
      border: 1px solid var(--border, #e5e5e5);
      border-radius: 8px;
      margin-bottom: 64px;
    }

    .grid-demo__title {
      font-family: var(--font-mono, ui-monospace, monospace);
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--slate, #666666);
      margin-bottom: 24px;
    }

    .grid-demo__visual {
      width: 100%;
      height: 220px;
      display: grid;
      grid-template-columns: repeat(12, 1fr);
      gap: 12px;
      padding: 24px;
      border: 2px dashed var(--border, #e5e5e5);
      border-radius: 8px;
      background: var(--paper, #ffffff);
    }

    .grid-demo__column {
      background: rgba(59, 130, 246, 0.08);
      border: 1px solid var(--signal, #3b82f6);
      border-radius: 4px;
      font-family: var(--font-mono, ui-monospace, monospace);
      font-size: 11px;
      font-weight: 600;
      color: var(--signal, #3b82f6);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .grid-demo__info {
      margin-top: 24px;
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 32px;
    }

    .grid-demo__stat {
      font-family: var(--font-body, system-ui, sans-serif);
      font-size: 14px;
      color: var(--ink, #111111);
    }

    .grid-demo__stat-label {
      font-family: var(--font-mono, ui-monospace, monospace);
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--slate, #666666);
      margin-bottom: 6px;
    }

    /* Loading */
    .loading {
      text-align: center;
      padding: 80px 24px;
      color: var(--slate, #666666);
      font-size: 16px;
    }

    .loading::after {
      content: '';
      display: block;
      width: 32px;
      height: 32px;
      margin: 16px auto 0;
      border: 2px solid rgba(59, 130, 246, 0.2);
      border-top-color: var(--signal, #3b82f6);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    @media (max-width: 900px) {
      .page {
        padding: 64px 32px;
      }

      .header {
        margin-bottom: 64px;
      }

      .header__title {
        font-size: 48px;
      }

      .section {
        margin-bottom: 64px;
      }

      .spacing-row {
        grid-template-columns: 100px 1fr 80px;
        gap: 16px;
      }

      .radius-grid {
        grid-template-columns: 1fr;
        gap: 32px;
      }

      .radius-item {
        grid-template-columns: 120px 1fr;
      }

      .grid-demo__info {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <div class="page" id="app">
    <div class="loading">Loading design tokens…</div>
  </div>

  <script>
    const DEFAULT_SPACING = {
      's-1': { value: '4px', label: 'xs' },
      's-2': { value: '8px', label: 'sm' },
      's-3': { value: '16px', label: 'md' },
      's-4': { value: '24px', label: 'lg' },
      's-5': { value: '32px', label: 'xl' },
      's-6': { value: '48px', label: '2xl' },
      's-7': { value: '64px', label: '3xl' },
      's-8': { value: '96px', label: '4xl' }
    };

    const DEFAULT_DEPTH = {
      'flat': { name: 'Flat', treatment: 'none', use: 'Default canvas, body backgrounds' },
      'border': { name: 'Border', treatment: '1px solid var(--border)', use: 'Cards, input fields, section dividers' },
      'elevated': { name: 'Elevated', treatment: '0 2px 8px rgba(0,0,0,0.08)', use: 'Modal overlays, floating actions, dropdowns' }
    };

    const DEFAULT_RADIUS = {
      'none': { value: '0', use: 'Reserved for utility. Rarely used in system.' },
      'sm': { value: '4px', use: 'Small UI elements: small badges, micro-interactions.' },
      'md': { value: '8px', use: 'Primary radius. Buttons, inputs, cards, containers.' },
      'lg': { value: '16px', use: 'Large cards, modals, featured content blocks.' },
      'full': { value: '999px', use: 'Circular elements, avatars, badges with rounded edges.' }
    };

    ( window.__DESIGN_TOKENS__ ? Promise.resolve({ ok: true, json: () => Promise.resolve(window.__DESIGN_TOKENS__) }) : fetch('../tokens.json') )
      .then(r => {
        if (!r.ok) throw new Error('tokens.json not found (' + r.status + ')');
        return r.json();
      })
      .then(render)
      .catch(err => {
        document.getElementById('app').innerHTML =
          '<div class="loading" style="color:#ef4444">' +
          'Could not load tokens.json — ' + err.message + '</div>';
      });

    function render(tokens) {
      const app = document.getElementById('app');

      const spacing = {};
      if (tokens.spacing?.scale) {
        Object.entries(tokens.spacing.scale).forEach(([k, v]) => {
          spacing[k] = { value: v, label: k };
        });
      } else {
        Object.assign(spacing, DEFAULT_SPACING);
      }

      const depth = DEFAULT_DEPTH;
      const radius = DEFAULT_RADIUS;

      let html = '';

      /* Header / Stage head */
      html += '<header class="header">';
      html += '  <div class="header__kicker">Spacing &amp; Rules</div>';
      html += '  <h1 class="header__title">Clean spacing.<br>Clear hierarchy.</h1>';
      html += '  <p class="header__subtitle">Flat uses consistent, predictable spacing and minimal depth to create fast, user-friendly interfaces. Whitespace is intentional. Rules are subtle. Clarity comes first.</p>';
      html += '  <hr class="header__rule">';
      html += '</header>';

      /* Philosophy block */
      html += '<div class="philosophy">';
      html += '  <div class="philosophy__title">Spacing Philosophy</div>';
      html += '  <div class="philosophy__text">';
      html += '    Flat is built on an <strong>8-pixel base scale</strong> that scales predictably from 4px micro-spacing to 96px block separation. <strong>Whitespace is structural</strong>: we use generous gutters, padding, and margins to organize content into logical groups. <strong>Borders before shadows</strong>: subtle 1px borders create definition without visual noise. When depth is needed, a light shadow supports focus states and floating content. Every spacing decision supports <em>scannability and speed</em>.';
      html += '  </div>';
      html += '</div>';

      /* Spacing scale */
      html += '<div class="section">';
      html += '  <div class="section__label">Spacing Scale</div>';

      const spacingEntries = Object.entries(spacing);
      const maxPx = Math.max(...spacingEntries.map(([, o]) => parseFloat(o.value) || 0), 1);

      spacingEntries.forEach(([key, obj]) => {
        const px = parseFloat(obj.value) || 0;
        const pct = Math.max((px / maxPx) * 100, 2);
        const label = obj.label || key;
        
        html += '<div class="spacing-row">';
        html += '  <div>';
        html += '    <div class="spacing-row__name">' + esc(key) + '</div>';
        html += '    <div class="spacing-row__label">' + esc(label) + '</div>';
        html += '  </div>';
        html += '  <div class="spacing-row__bar-wrap">';
        html += '    <div class="spacing-row__bar" style="width:' + pct + '%"></div>';
        html += '  </div>';
        html += '  <div class="spacing-row__value">' + esc(obj.value) + '</div>';
        html += '</div>';
      });

      html += '</div>';

      /* Grid visualization */
      html += '<div class="section">';
      html += '  <div class="section__label">Layout Grid</div>';
      html += '  <div class="grid-demo">';
      html += '    <div class="grid-demo__title">12-Column Responsive Grid</div>';
      html += '    <div class="grid-demo__visual">';
      for (let i = 1; i <= 12; i++) {
        html += '      <div class="grid-demo__column">' + i + '</div>';
      }
      html += '    </div>';
      html += '    <div class="grid-demo__info">';
      html += '      <div>';
      html += '        <div class="grid-demo__stat-label">Gutter &amp; Margins</div>';
      html += '        <div class="grid-demo__stat">16px gutters (desktop), 8px (mobile). Responsive margins scale with viewport.</div>';
      html += '      </div>';
      html += '      <div>';
      html += '        <div class="grid-demo__stat-label">Body Copy Measure</div>';
      html += '        <div class="grid-demo__stat">6–8 columns, capped at 65 characters for optimal readability.</div>';
      html += '      </div>';
      html += '      <div>';
      html += '        <div class="grid-demo__stat-label">Vertical Rhythm</div>';
      html += '        <div class="grid-demo__stat">24px line height baseline. Section breaks at 48–96px intervals.</div>';
      html += '      </div>';
      html += '      <div>';
      html += '        <div class="grid-demo__stat-label">Breakpoints</div>';
      html += '        <div class="grid-demo__stat">Mobile: 320px. Tablet: 768px. Desktop: 1024px+.</div>';
      html += '      </div>';
      html += '    </div>';
      html += '  </div>';
      html += '</div>';

      /* Depth levels */
      html += '<div class="section">';
      html += '  <div class="section__label">Depth Levels</div>';

      Object.entries(depth).forEach(([key, rule]) => {
        const treatment = rule.treatment;

        html += '<div class="depth-demo">';
        html += '  <div class="depth-demo__header">';
        html += '    <div>';
        html += '      <div class="depth-demo__name">' + esc(rule.name) + '</div>';
        html += '      <div class="depth-demo__label">' + esc(rule.use) + '</div>';
        html += '    </div>';
        html += '    <div class="depth-demo__spec">' + esc(treatment) + '</div>';
        html += '  </div>';
        
        html += '  <div class="depth-demo__container">';
        
        if (treatment === 'none') {
          html += '    <div class="depth-demo__box" style="background: var(--paper); border: none;">Default</div>';
        } else if (treatment === '1px solid var(--border)') {
          html += '    <div class="depth-demo__box" style="border: 1px solid var(--border);">Bordered</div>';
        } else if (treatment.includes('rgba(0,0,0,0.08)')) {
          html += '    <div class="depth-demo__box" style="box-shadow: 0 2px 8px rgba(0,0,0,0.08);">Elevated</div>';
        } else {
          html += '    <div class="depth-demo__box">' + esc(treatment) + '</div>';
        }
        
        html += '  </div>';
        html += '</div>';
      });

      html += '</div>';

      /* Border radius */
      html += '<div class="section">';
      html += '  <div class="section__label">Border Radius</div>';

      const radiusEntries = Object.entries(radius);
      
      for (let i = 0; i < radiusEntries.length; i += 2) {
        html += '<div class="radius-grid">';
        
        for (let j = 0; j < 2 && i + j < radiusEntries.length; j++) {
          const [key, obj] = radiusEntries[i + j];
          const radiusValue = obj.value;

          html += '<div class="radius-item">';
          html += '  <div class="radius-item__demo">';
          html += '    <div class="radius-item__box" style="border-radius: ' + esc(radiusValue) + '"></div>';
          html += '  </div>';
          html += '  <div class="radius-item__info">';
          html += '    <div class="radius-item__name">--radius-' + esc(key) + '</div>';
          html += '    <div class="radius-item__value">' + esc(radiusValue) + '</div>';
          html += '    <div class="radius-item__description">' + esc(obj.use) + '</div>';
          html += '  </div>';
          html += '</div>';
        }
        
        html += '</div>';
      }

      html += '</div>';

      /* Composition philosophy */
      html += '<div class="philosophy" style="margin-top: 96px; margin-bottom: 0;">';
      html += '  <div class="philosophy__title">Composition Principles</div>';
      html += '  <div class="philosophy__text">';
      html += '    <strong>Clarity through whitespace:</strong> Use spacing to separate concerns. Content blocks breathe with padding (16–24px) and margin between sections (32–48px). <strong>Minimal elevation:</strong> Subtle 1px borders create distinct zones. Shadows are light and sparse—reserved only for modals and floating actions. <strong>Predictable padding:</strong> Buttons use 10px vertical, 20px horizontal. Cards use consistent 16–24px internal padding. <strong>Scale with intent:</strong> Small spacing (4–8px) for micro-interactions. Medium spacing (16–24px) for content separation. Large spacing (48–96px) for major section breaks.';
      html += '  </div>';
      html += '</div>';

      app.innerHTML = html;
    }

    function esc(s) {
      const d = document.createElement('div');
      d.textContent = String(s);
      return d.innerHTML;
    }
  </script>
</body>
</html>
