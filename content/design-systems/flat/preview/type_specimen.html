<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Type Specimen — Flat</title>
  <link rel="stylesheet" href="../colors_and_type.css">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: var(--font-body, system-ui, -apple-system, sans-serif);
      background: var(--paper, #ffffff);
      color: var(--ink, #111111);
      line-height: 1.6;
    }

    .page {
      max-width: 1100px;
      margin: 0 auto;
      padding: 96px 48px;
    }

    @media (max-width: 768px) {
      .page {
        padding: 64px 32px;
      }
    }

    @media (max-width: 480px) {
      .page {
        padding: 48px 24px;
      }
    }

    /* Header */
    .header {
      margin-bottom: 96px;
    }

    .header__kicker {
      font-family: var(--font-mono, ui-monospace, monospace);
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--slate, #666666);
      margin-bottom: 24px;
    }

    .header__title {
      font-family: var(--font-display, system-ui, sans-serif);
      font-size: 84px;
      font-weight: 700;
      line-height: 0.98;
      letter-spacing: -0.015em;
      color: var(--ink, #111111);
      margin-bottom: 24px;
    }

    .header__subtitle {
      font-family: var(--font-body, system-ui, sans-serif);
      font-size: 20px;
      font-weight: 400;
      line-height: 1.6;
      color: var(--slate, #666666);
      max-width: 700px;
      margin-bottom: 32px;
    }

    .header__rule {
      display: block;
      width: 80px;
      height: 2px;
      background: var(--signal, #3b82f6);
      border: none;
      margin: 0;
    }

    /* Font families section */
    .font-families {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      gap: 24px;
      margin-bottom: 96px;
      margin-top: 64px;
    }

    .font-card {
      background: var(--bone, #f5f5f5);
      border: 1px solid var(--border, #e5e5e5);
      border-radius: 8px;
      padding: 32px;
    }

    .font-card__label {
      font-family: var(--font-mono, ui-monospace, monospace);
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--slate, #666666);
      margin-bottom: 12px;
    }

    .font-card__name {
      font-family: var(--font-display, system-ui, sans-serif);
      font-size: 32px;
      font-weight: 700;
      line-height: 1.1;
      color: var(--ink, #111111);
      margin-bottom: 8px;
    }

    .font-card__fallback {
      font-family: var(--font-mono, ui-monospace, monospace);
      font-size: 11px;
      color: var(--slate, #666666);
      word-break: break-word;
      font-weight: 400;
    }

    /* Character set block */
    .charmap-block {
      background: transparent;
      border: 1px solid var(--border, #e5e5e5);
      border-radius: 8px;
      padding: 48px;
      margin-bottom: 96px;
    }

    .charmap-block__label {
      font-family: var(--font-mono, ui-monospace, monospace);
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--slate, #666666);
      margin-bottom: 24px;
    }

    .charmap-block__chars {
      font-family: var(--font-display, system-ui, sans-serif);
      font-size: 28px;
      font-weight: 500;
      line-height: 1.8;
      letter-spacing: 0.02em;
      color: var(--ink, #111111);
      word-break: break-word;
    }

    /* Section label */
    .section-label {
      font-family: var(--font-mono, ui-monospace, monospace);
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--slate, #666666);
      margin-bottom: 32px;
      padding-bottom: 16px;
      border-bottom: 2px solid var(--signal, #3b82f6);
    }

    /* Ramp row */
    .ramp-row {
      display: grid;
      grid-template-columns: 260px 1fr;
      gap: 48px;
      align-items: baseline;
      padding: 40px 0;
      border-bottom: 1px solid var(--border, #e5e5e5);
    }

    .ramp-row:last-child {
      border-bottom: none;
    }

    @media (max-width: 900px) {
      .ramp-row {
        grid-template-columns: 1fr;
        gap: 20px;
      }
    }

    /* Left meta column */
    .ramp-meta__role {
      font-family: var(--font-display, system-ui, sans-serif);
      font-size: 18px;
      font-weight: 700;
      color: var(--ink, #111111);
      margin-bottom: 12px;
    }

    .ramp-meta__detail {
      font-family: var(--font-mono, ui-monospace, monospace);
      font-size: 10px;
      font-weight: 500;
      line-height: 1.9;
      color: var(--slate, #666666);
      letter-spacing: 0.04em;
      white-space: pre;
    }

    /* Right sample column */
    .ramp-sample {
      color: var(--ink, #111111);
      overflow-wrap: break-word;
      word-spacing: 0.1em;
    }

    /* Ramp section */
    .ramp-section {
      margin-bottom: 96px;
    }

    /* Weight showcase */
    .weights-section {
      margin-bottom: 96px;
    }

    .weights-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
      gap: 24px;
    }

    .weight-card {
      background: var(--bone, #f5f5f5);
      border: 1px solid var(--border, #e5e5e5);
      border-radius: 8px;
      padding: 32px;
    }

    .weight-card__label {
      font-family: var(--font-mono, ui-monospace, monospace);
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--slate, #666666);
      margin-bottom: 16px;
    }

    .weight-card__sample {
      font-family: var(--font-display, system-ui, sans-serif);
      font-size: 28px;
      line-height: 1.3;
      color: var(--ink, #111111);
    }

    /* Loading */
    .loading {
      text-align: center;
      padding: 160px 48px;
      color: var(--slate, #666666);
      font-family: var(--font-body, system-ui, sans-serif);
      font-size: 16px;
    }

    .loading::after {
      content: '';
      display: block;
      width: 32px;
      height: 32px;
      margin: 24px auto 0;
      border: 2px solid var(--border, #e5e5e5);
      border-top-color: var(--signal, #3b82f6);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div class="page" id="app">
    <div class="loading">Loading design tokens&hellip;</div>
  </div>

  <script>
    const EDITORIAL_SAMPLES = [
      'Minimalism optimizes clarity.',
      'Every pixel earns its place.',
      'Vibrant colors, clean lines, zero depth.',
      'Enterprise can feel alive.',
      'Flat design is fast design.',
      'Typography carries the message without noise.',
      'Four spacing scales, infinite combinations.',
      'Signals work hardest at full saturation.',
      'System first, details second.',
      'Interface speed comes from reduction.',
    ];

    const WEIGHT_SAMPLES = [
      { weight: 100, label: 'Thin' },
      { weight: 200, label: 'Extra Light' },
      { weight: 300, label: 'Light' },
      { weight: 400, label: 'Regular' },
      { weight: 500, label: 'Medium' },
      { weight: 600, label: 'Semibold' },
      { weight: 700, label: 'Bold' },
      { weight: 800, label: 'Extra Bold' },
      { weight: 900, label: 'Black' }
    ];

    const DROPCAP_TEXT = 'Flat design eliminates unnecessary decoration. In modern interfaces, every element must justify its presence through clarity and usability. This system embraces two-dimensionality completely—no gradients, no shadows, no skeuomorphism. Instead, it relies on bold typography, vibrant signal colors, and generous whitespace. Inter as both display and body font ensures consistent readability across all scales. The JetBrains Mono monospace brings precision to labels, metadata, and code. Four-level spacing scale and three-tier depth system provide structural order without visual complexity. Cards use flat backgrounds with delicate borders, never drop shadows. Buttons feel pressable through color saturation and weight, not 3D affordances. Success and warning states rely on color naming, not icons alone. This is efficient design for enterprise velocity. Fast interfaces serve users faster. When a system removes the unnecessary, it reveals the essential. That is Flat.';

    fetch('../tokens.json')
      .then(r => {
        if (!r.ok) throw new Error('tokens.json not found (' + r.status + ')');
        return r.json();
      })
      .then(render)
      .catch(err => {
        document.getElementById('app').innerHTML =
          '<div class="loading" style="color:#3b82f6">' +
          'Could not load tokens.json — ' + err.message + '</div>';
      });

    function render(tokens) {
      const app = document.getElementById('app');
      const title = tokens.meta?.title || 'Design System';
      const summary = tokens.meta?.summary || '';

      const ramp = tokens.typography?.ramp || [];

      let html = '';

      /* Header */
      html += '<header class="header">';
      html += '  <div class="header__kicker">Type Specimen</div>';
      html += '  <h1 class="header__title">' + esc(title) + '</h1>';
      html += '  <p class="header__subtitle">' + esc(summary) + '</p>';
      html += '  <hr class="header__rule">';
      html += '</header>';

      /* Font families */
      const families = [
        { label: 'Display', name: 'Inter', fallback: 'system-ui, -apple-system, Helvetica Neue, sans-serif', note: 'All weights, 12–84px' },
        { label: 'Body', name: 'Inter', fallback: 'system-ui, -apple-system, Helvetica Neue, sans-serif', note: 'Regular & medium, optimized 14–20px' },
        { label: 'Monospace', name: 'JetBrains Mono', fallback: 'ui-monospace, Menlo, IBM Plex Mono, monospace', note: 'Labels & metadata, all-caps' }
      ];

      html += '<div class="font-families">';
      families.forEach(f => {
        html += '<div class="font-card">';
        html += '  <div class="font-card__label">' + esc(f.label) + '</div>';
        html += '  <div class="font-card__name">' + esc(f.name) + '</div>';
        html += '  <div class="font-card__fallback">' + esc(f.fallback) + '</div>';
        html += '</div>';
      });
      html += '</div>';

      /* Character set */
      html += '<div class="charmap-block">';
      html += '  <div class="charmap-block__label">Character Set · Inter</div>';
      html += '  <div class="charmap-block__chars" style="font-family:Inter,system-ui,sans-serif;font-weight:500">';
      html += '    AaBbCcDdEeFfGgHhIiJjKkLlMmNnOoPpQqRrSsTtUuVvWwXxYyZz<br>';
      html += '    0123456789 !@#$%&amp;*()&ndash;&mdash;&lsquo;&rsquo;&ldquo;&rdquo;.,:;?';
      html += '  </div>';
      html += '</div>';

      /* Weight showcase */
      html += '<div class="weights-section">';
      html += '<div class="section-label">Weight Range · Inter</div>';
      html += '<div class="weights-grid">';
      WEIGHT_SAMPLES.forEach(w => {
        html += '<div class="weight-card">';
        html += '  <div class="weight-card__label">' + esc(w.label) + ' / ' + w.weight + '</div>';
        html += '  <div class="weight-card__sample" style="font-family:Inter,system-ui,sans-serif;font-weight:' + w.weight + '">Minimize</div>';
        html += '</div>';
      });
      html += '</div>';
      html += '</div>';

      /* Scale showcase */
      html += '<div class="ramp-section">';
      html += '<div class="section-label">Type Scale</div>';

      const scales = [
        { role: 'Small Label', size: '12px', weight: 600, sample: 'Small Label' },
        { role: 'Body Small', size: '14px', weight: 400, sample: 'Fast interfaces serve users faster.' },
        { role: 'Body Base', size: '16px', weight: 400, sample: 'Design eliminates unnecessary decoration.' },
        { role: 'Body Large', size: '20px', weight: 400, sample: 'Clarity through reduction.' },
        { role: 'Heading 4', size: '24px', weight: 700, sample: 'Minimize' },
        { role: 'Heading 3', size: '32px', weight: 700, sample: 'Enterprise.' },
        { role: 'Heading 2', size: '48px', weight: 700, sample: 'Flat Design' },
        { role: 'Heading 1', size: '64px', weight: 700, sample: 'Zero Depth' }
      ];

      scales.forEach((scale, i) => {
        html += rampRow(scale);
      });

      html += '</div>';

      /* Drop cap demo */
      html += '<div class="ramp-section">';
      html += '<div class="section-label">In Practice</div>';
      html += '<div style="background:var(--bone,#f5f5f5);border:1px solid var(--border,#e5e5e5);border-radius:8px;padding:48px;">';
      html += '<p style="font-family:var(--font-body,system-ui,sans-serif);font-size:18px;font-weight:400;line-height:1.7;color:var(--ink,#111111);max-width:680px;">';
      html += esc(DROPCAP_TEXT);
      html += '</p>';
      html += '</div>';
      html += '</div>';

      app.innerHTML = html;
    }

    function rampRow(entry) {
      const role = entry.role || 'Scale';
      const size = entry.size || '16px';
      const weight = entry.weight || 400;

      const sizeNum = parseFloat(size);
      let sample = entry.sample || 'Sample text';

      let fontStyle = 'font-size:' + size + ';font-weight:' + weight + ';';
      fontStyle += 'font-family:Inter,system-ui,sans-serif;';

      let meta = esc(size) + ' / ' + esc(String(weight));
      meta += '\nInter';

      return '' +
        '<div class="ramp-row">' +
        '  <div class="ramp-meta">' +
        '    <div class="ramp-meta__role">' + esc(role) + '</div>' +
        '    <pre class="ramp-meta__detail">' + meta + '</pre>' +
        '  </div>' +
        '  <div class="ramp-sample" style="' + fontStyle + '">' + esc(sample) + '</div>' +
        '</div>';
    }

    function esc(s) {
      const d = document.createElement('div');
      d.textContent = String(s);
      return d.innerHTML;
    }
  </script>
</body>
</html>
