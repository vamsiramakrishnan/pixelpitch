<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Spacing &amp; Rules – Airbnb</title>
  <link rel="stylesheet" href="../colors_and_type.css">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: var(--font-body, system-ui, sans-serif);
      background: var(--paper, #ffffff);
      color: var(--color-ink-black, #222222);
      line-height: 1.6;
    }

    .page {
      max-width: 1280px;
      margin: 0 auto;
      padding: 64px 32px;
    }

    /* Header / Stage head */
    .header {
      margin-bottom: 72px;
    }
    .header__title {
      font-family: var(--font-display, system-ui, sans-serif);
      font-size: 48px;
      font-weight: 700;
      line-height: 1.15;
      letter-spacing: -0.02em;
      color: var(--color-ink-black, #222222);
      margin-bottom: 12px;
    }
    .header__subtitle {
      font-size: 18px;
      color: var(--color-ash-gray, #6a6a6a);
      font-weight: 400;
      margin-bottom: 32px;
    }
    .header__accent-line {
      display: block;
      width: 80px;
      height: 4px;
      background: var(--signal, #ff385c);
      border: none;
      border-radius: 2px;
    }

    /* Section */
    .section {
      margin-bottom: 72px;
    }
    .section__label {
      font-family: var(--font-display, system-ui, sans-serif);
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--color-mute-gray, #929292);
      margin-bottom: 28px;
      padding-bottom: 16px;
      border-bottom: 1px solid var(--border, #dddddd);
    }

    /* Spacing scale */
    .spacing-row {
      display: grid;
      grid-template-columns: 100px 1fr 90px;
      gap: 20px;
      align-items: center;
      padding: 16px 0;
      border-bottom: 1px solid var(--bone, #f7f7f7);
    }
    .spacing-row:last-child {
      border-bottom: none;
    }

    .spacing-row__name {
      font-family: var(--font-mono, ui-monospace, monospace);
      font-size: 14px;
      color: var(--color-ink-black, #222222);
      font-weight: 600;
      letter-spacing: 0.02em;
    }

    .spacing-row__bar-wrap {
      height: 32px;
      display: flex;
      align-items: center;
      background: var(--bone, #f7f7f7);
      border-radius: 6px;
      padding: 0 12px;
      position: relative;
    }
    .spacing-row__bar {
      height: 3px;
      background: var(--signal, #ff385c);
      border-radius: 2px;
      min-width: 2px;
      transition: all 0.2s ease;
    }
    .spacing-row:hover .spacing-row__bar {
      height: 4px;
      background: var(--color-deep-rausch, #e00b41);
    }

    .spacing-row__value {
      font-family: var(--font-mono, ui-monospace, monospace);
      font-size: 14px;
      color: var(--color-ash-gray, #6a6a6a);
      text-align: right;
      font-weight: 500;
    }

    .spacing-row__label {
      font-family: var(--font-body, system-ui, sans-serif);
      font-size: 13px;
      color: var(--color-mute-gray, #929292);
      margin-top: 4px;
      margin-left: 100px;
      margin-right: 20px;
      font-weight: 400;
    }

    /* Rule weights */
    .rule-demo {
      padding: 28px 0;
      border-bottom: 1px solid var(--bone, #f7f7f7);
    }
    .rule-demo:last-child {
      border-bottom: none;
    }
    .rule-demo__header {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      margin-bottom: 16px;
    }
    .rule-demo__name {
      font-family: var(--font-mono, ui-monospace, monospace);
      font-size: 14px;
      font-weight: 600;
      color: var(--color-ink-black, #222222);
      letter-spacing: 0.02em;
    }
    .rule-demo__spec {
      font-family: var(--font-mono, ui-monospace, monospace);
      font-size: 12px;
      color: var(--color-mute-gray, #929292);
      font-weight: 400;
    }
    .rule-demo__line {
      width: 100%;
      border: none;
      border-radius: 1px;
      display: block;
    }
    .rule-demo__note {
      font-family: var(--font-body, system-ui, sans-serif);
      font-size: 13px;
      color: var(--color-ash-gray, #6a6a6a);
      margin-top: 8px;
      font-weight: 400;
    }

    /* Border radius */
    .radius-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
      gap: 32px;
    }
    .radius-item {
      text-align: center;
    }
    .radius-item__box {
      width: 100%;
      aspect-ratio: 1 / 1;
      max-width: 140px;
      margin: 0 auto 16px;
      background: var(--paper, #ffffff);
      border: 2px solid var(--signal, #ff385c);
      opacity: 0.5;
      transition: all 0.2s ease;
    }
    .radius-item:hover .radius-item__box {
      opacity: 1;
      transform: scale(1.02);
      box-shadow: rgba(0, 0, 0, 0.08) 0 4px 12px;
    }
    .radius-item__name {
      font-family: var(--font-mono, ui-monospace, monospace);
      font-size: 14px;
      font-weight: 600;
      color: var(--color-ink-black, #222222);
      margin-bottom: 4px;
      letter-spacing: 0.02em;
    }
    .radius-item__value {
      font-family: var(--font-mono, ui-monospace, monospace);
      font-size: 12px;
      color: var(--color-mute-gray, #929292);
      font-weight: 400;
    }
    .radius-item__use {
      font-family: var(--font-body, system-ui, sans-serif);
      font-size: 12px;
      color: var(--color-ash-gray, #6a6a6a);
      margin-top: 6px;
      line-height: 1.4;
      font-weight: 400;
    }

    /* Depth / Elevation demos */
    .depth-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
      gap: 28px;
    }
    .depth-item {
      padding: 28px 24px;
      background: var(--paper, #ffffff);
      border-radius: 16px;
      text-align: center;
      border: 1px solid var(--bone, #f7f7f7);
      transition: all 0.2s ease;
      min-height: 200px;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }
    .depth-item:hover {
      border-color: var(--border, #dddddd);
      transform: translateY(-4px);
    }
    .depth-item__name {
      font-family: var(--font-mono, ui-monospace, monospace);
      font-size: 14px;
      font-weight: 600;
      color: var(--color-ink-black, #222222);
      margin-bottom: 8px;
      letter-spacing: 0.02em;
    }
    .depth-item__spec {
      font-family: var(--font-mono, ui-monospace, monospace);
      font-size: 11px;
      color: var(--color-ash-gray, #6a6a6a);
      word-break: break-all;
      line-height: 1.5;
      font-weight: 400;
    }
    .depth-item__visual {
      width: 80px;
      height: 80px;
      margin: 16px auto;
      border-radius: 12px;
      background: var(--bone, #f7f7f7);
      border: 1px solid var(--border, #dddddd);
    }

    /* Grid visualization */
    .grid-section {
      margin-bottom: 72px;
    }
    .grid-demo {
      display: grid;
      grid-template-columns: repeat(6, 1fr);
      gap: 24px;
      margin-top: 28px;
    }
    .grid-item {
      aspect-ratio: 4 / 3;
      background: var(--bone, #f7f7f7);
      border-radius: 16px;
      border: 1px solid var(--border, #dddddd);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 12px;
      color: var(--color-mute-gray, #929292);
      font-weight: 500;
    }

    @media (max-width: 1280px) {
      .grid-demo {
        grid-template-columns: repeat(5, 1fr);
      }
    }
    @media (max-width: 1024px) {
      .grid-demo {
        grid-template-columns: repeat(4, 1fr);
      }
    }
    @media (max-width: 768px) {
      .grid-demo {
        grid-template-columns: repeat(3, 1fr);
      }
      .spacing-row {
        grid-template-columns: 80px 1fr 70px;
        gap: 12px;
      }
      .page {
        padding: 48px 24px;
      }
      .header__title {
        font-size: 36px;
      }
      .radius-grid {
        grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
        gap: 24px;
      }
      .depth-grid {
        grid-template-columns: 1fr;
      }
    }
    @media (max-width: 600px) {
      .page {
        padding: 40px 16px;
      }
      .header {
        margin-bottom: 56px;
      }
      .header__title {
        font-size: 32px;
      }
      .section {
        margin-bottom: 56px;
      }
      .grid-demo {
        grid-template-columns: repeat(2, 1fr);
      }
      .spacing-row {
        grid-template-columns: 70px 1fr 60px;
        gap: 8px;
        padding: 12px 0;
      }
      .spacing-row__label {
        margin-left: 70px;
      }
    }

    .loading {
      text-align: center;
      padding: 120px 24px;
      color: var(--color-ash-gray, #6a6a6a);
      font-size: 16px;
    }
    .loading::after {
      content: '';
      display: block;
      width: 40px;
      height: 40px;
      margin: 20px auto 0;
      border: 3px solid var(--bone, #f7f7f7);
      border-top-color: var(--signal, #ff385c);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div class="page" id="app">
    <div class="loading">Loading design tokens&hellip;</div>
  </div>

  <script>
    const DEFAULT_SPACING = {
      's-1': '4px',
      's-2': '8px',
      's-3': '16px',
      's-4': '24px',
      's-5': '32px',
      's-6': '48px',
      's-7': '64px',
      's-8': '96px',
    };

    const SPACING_ROLES = {
      's-1': 'Micro spacing',
      's-2': 'Component padding, gaps',
      's-3': 'Card padding, gutters',
      's-4': 'Section spacing, booking panel padding',
      's-5': 'Large spacing, section margins',
      's-6': 'Desktop section padding',
      's-7': 'Major spacing, hero padding',
      's-8': 'Extra-large spacing',
    };

    const DEFAULT_RADII = {
      'none': '0',
      'sm': '32px',
      'md': '800px',
      'lg': '16px',
      'full': '999px',
    };

    const RADIUS_ROLES = {
      'none': 'No rounding',
      'sm': 'Pill buttons',
      'md': 'Circular buttons, avatars',
      'lg': 'Listing cards, containers',
      'full': 'Perfect circle (icon buttons, hearts)',
    };

    (window.__DESIGN_TOKENS__ ? Promise.resolve({ ok: true, json: () => Promise.resolve(window.__DESIGN_TOKENS__) }) : fetch('../tokens.json'))
      .then(r => {
        if (!r.ok) throw new Error('tokens.json not found (' + r.status + ')');
        return r.json();
      })
      .then(render)
      .catch(err => {
        document.getElementById('app').innerHTML =
          '<div class="loading" style="color:#c13515">' +
          'Could not load tokens.json &mdash; ' + err.message + '</div>';
      });

    function render(tokens) {
      const app = document.getElementById('app');
      const name = tokens.meta?.title || tokens.name || 'Design System';

      const spacing = tokens.spacing?.scale || DEFAULT_SPACING;
      const radii = tokens.radii || DEFAULT_RADII;
      const depth = tokens.depth || [];

      let html = '';

      /* Header */
      html += '<header class="header">';
      html += '  <h1 class="header__title">Spacing &amp; Rules</h1>';
      html += '  <p class="header__subtitle">The grid, breathing room, and depth that bring Airbnb to life.</p>';
      html += '  <hr class="header__accent-line">';
      html += '</header>';

      /* ---- Spacing scale ---- */
      html += '<div class="section">';
      html += '  <div class="section__label">Spacing Scale</div>';

      const spacingEntries = Object.entries(spacing);
      const maxPx = Math.max(...spacingEntries.map(([, v]) => parseFloat(v) || 0), 1);

      spacingEntries.forEach(([key, value]) => {
        const px = parseFloat(value) || 0;
        const pct = Math.max((px / maxPx) * 100, 3);
        const role = SPACING_ROLES[key] || '';
        html += '<div class="spacing-row">';
        html += '  <div class="spacing-row__name">' + esc(key) + '</div>';
        html += '  <div class="spacing-row__bar-wrap">';
        html += '    <div class="spacing-row__bar" style="width:' + pct + '%"></div>';
        html += '  </div>';
        html += '  <div class="spacing-row__value">' + esc(value) + '</div>';
        html += '</div>';
        if (role) {
          html += '  <div class="spacing-row__label">' + esc(role) + '</div>';
        }
      });

      html += '</div>';

      /* ---- Border radius ---- */
      html += '<div class="section">';
      html += '  <div class="section__label">Border Radius</div>';
      html += '  <div class="radius-grid">';

      Object.entries(radii).forEach(([key, value]) => {
        const use = RADIUS_ROLES[key] || '';
        html += '<div class="radius-item">';
        html += '  <div class="radius-item__box" style="border-radius:' + esc(value) + '"></div>';
        html += '  <div class="radius-item__name">' + esc(key) + '</div>';
        html += '  <div class="radius-item__value">' + esc(value) + '</div>';
        if (use) {
          html += '  <div class="radius-item__use">' + esc(use) + '</div>';
        }
        html += '</div>';
      });

      html += '  </div>';
      html += '</div>';

      /* ---- Rule weights / Depth ---- */
      if (depth && depth.length > 0) {
        html += '<div class="section">';
        html += '  <div class="section__label">Depth &amp; Elevation</div>';

        depth.forEach(d => {
          const treatment = d.treatment || '';
          html += '<div class="rule-demo">';
          html += '  <div class="rule-demo__header">';
          html += '    <span class="rule-demo__name">' + esc(d.name) + '</span>';
          html += '    <span class="rule-demo__spec">Level ' + d.level + '</span>';
          html += '  </div>';
          
          if (d.level === 0) {
            html += '  <div class="rule-demo__line" style="height:2px;background:var(--bone, #f7f7f7);margin:12px 0;border-radius:1px"></div>';
            html += '  <div class="rule-demo__note">No elevation applied</div>';
          } else if (d.level === 3) {
            html += '  <div class="rule-demo__line" style="height:2px;background:#222222;margin:12px 0;border-radius:1px;box-shadow:0 0 0 2px #222222;opacity:0.6"></div>';
            html += '  <div class="rule-demo__note">Focus ring: ' + esc(treatment) + '</div>';
          } else if (d.level === 4) {
            html += '  <div style="width:40px;height:40px;margin:12px auto;border-radius:50%;background:var(--bone, #f7f7f7);border:2px solid var(--signal, #ff385c);box-shadow:' + treatment + '"></div>';
            html += '  <div class="rule-demo__note">White ring separator on photos</div>';
          } else {
            html += '  <div class="rule-demo__note">' + esc(treatment) + '</div>';
          }
          
          html += '</div>';
        });

        html += '</div>';
      }

      /* ---- Grid visualization ---- */
      html += '<div class="grid-section">';
      html += '  <div class="section__label">Responsive Grid System</div>';
      html += '  <p style="font-size:14px;color:var(--color-ash-gray, #6a6a6a);margin-bottom:20px;font-weight:400">6 columns at ≥1760px, 5 at ≥1440px, 4 at ≥1128px, 3 at ≥800px, 2 at ≥550px, 1 below. 24px gutter on desktop, 16px on mobile.</p>';
      html += '  <div class="grid-demo">';
      for (let i = 1; i <= 6; i++) {
        html += '<div class="grid-item">Listing ' + i + '</div>';
      }
      html += '  </div>';
      html += '</div>';

      app.innerHTML = html;
    }

    function esc(s) {
      const d = document.createElement('div');
      d.textContent = String(s);
      return d.innerHTML;
    }
  </script>
</body>
</html>
