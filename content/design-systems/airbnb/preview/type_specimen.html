<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Airbnb — Type Specimen</title>
  <link rel="stylesheet" href="../colors_and_type.css">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: var(--font-body);
      background: var(--paper);
      color: var(--color-ink-black);
      line-height: 1.6;
    }

    .page {
      max-width: 1200px;
      margin: 0 auto;
      padding: 64px 40px;
    }

    /* ── Header ── */
    .header {
      margin-bottom: 72px;
    }

    .header__title {
      font-family: var(--font-display);
      font-size: 48px;
      font-weight: 700;
      line-height: 1.15;
      letter-spacing: -0.02em;
      color: var(--color-ink-black);
      margin-bottom: 16px;
    }

    .header__title span {
      display: block;
      font-size: 48px;
    }

    .header__subtitle {
      font-size: 18px;
      font-weight: 500;
      color: var(--slate);
      max-width: 650px;
      margin-bottom: 24px;
    }

    .header__rule {
      display: block;
      width: 80px;
      height: 3px;
      background: var(--signal);
      border: none;
      border-radius: 2px;
    }

    /* ── Font Families ── */
    .font-families {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
      gap: 28px;
      margin-bottom: 64px;
    }

    .font-card {
      background: var(--bone);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 32px 28px;
    }

    .font-card__label {
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--slate);
      margin-bottom: 12px;
    }

    .font-card__name {
      font-size: 26px;
      font-weight: 600;
      line-height: 1.3;
      color: var(--color-ink-black);
      margin-bottom: 8px;
    }

    .font-card__detail {
      font-family: var(--font-mono);
      font-size: 12px;
      line-height: 1.6;
      color: var(--slate);
      word-break: break-all;
    }

    /* ── Character Set Block ── */
    .charset-block {
      background: var(--bone);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 48px 40px;
      margin-bottom: 64px;
    }

    .charset-block__label {
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--slate);
      margin-bottom: 20px;
    }

    .charset-block__chars {
      font-size: 32px;
      font-weight: 600;
      line-height: 1.6;
      letter-spacing: 0.02em;
      color: var(--color-ink-black);
      word-break: break-all;
    }

    /* ── Section Label ── */
    .section-label {
      font-family: var(--font-display);
      font-size: 14px;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--slate);
      margin-bottom: 32px;
      padding-bottom: 16px;
      border-bottom: 2px solid var(--border);
    }

    /* ── Ramp Row ── */
    .ramp-row {
      display: grid;
      grid-template-columns: 280px 1fr;
      gap: 40px;
      align-items: baseline;
      padding: 32px 0;
      border-bottom: 1px solid var(--border);
    }

    .ramp-row:last-child {
      border-bottom: none;
    }

    @media (max-width: 768px) {
      .ramp-row {
        grid-template-columns: 1fr;
        gap: 16px;
      }
    }

    /* ── Left Meta Column ── */
    .ramp-meta__role {
      font-family: var(--font-display);
      font-size: 16px;
      font-weight: 600;
      color: var(--color-ink-black);
      margin-bottom: 12px;
    }

    .ramp-meta__detail {
      font-family: var(--font-mono);
      font-size: 12px;
      line-height: 1.8;
      color: var(--slate);
      font-weight: 500;
    }

    /* ── Right Sample Column ── */
    .ramp-sample {
      color: var(--color-ink-black);
      overflow-wrap: break-word;
    }

    /* ── Ramp Section ── */
    .ramp-section {
      margin-bottom: 56px;
    }

    /* ── Loading State ── */
    .loading {
      text-align: center;
      padding: 120px 40px;
      color: var(--slate);
      font-size: 16px;
    }

    .loading::after {
      content: '';
      display: block;
      width: 40px;
      height: 40px;
      margin: 20px auto 0;
      border: 3px solid var(--border);
      border-top-color: var(--signal);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div class="page" id="app">
    <div class="loading">Loading design tokens…</div>
  </div>

  <script>
    const EDITORIAL_SAMPLES = [
      'Inspiration for your next getaway awaits.',
      'Discover homes and experiences that matter.',
      'See how the world connects when we share.',
      'Every stay tells a story worth remembering.',
      'Find the perfect place to belong.',
      'Experience travel like a local, anywhere.',
      'Create moments that last a lifetime.',
      'Wander wisely, stay intentionally.',
      'The world is waiting for your arrival.',
      'Belong anywhere, explore everywhere.',
      'Where journeys become home.',
      'Travel beyond the ordinary.',
    ];

    (window.__DESIGN_TOKENS__ ? Promise.resolve({ ok: true, json: () => Promise.resolve(window.__DESIGN_TOKENS__) }) : fetch('../tokens.json'))
      .then(r => {
        if (!r.ok) throw new Error('tokens.json not found (' + r.status + ')');
        return r.json();
      })
      .then(render)
      .catch(err => {
        document.getElementById('app').innerHTML =
          '<div class="loading" style="color:#c13515">' +
          'Could not load tokens.json — ' + err.message + '</div>';
      });

    function render(tokens) {
      const app = document.getElementById('app');
      const name = tokens.meta?.title || tokens.meta?.name || tokens.name || 'Design System';
      const ramp = tokens.typography?.ramp || tokens.typeRamp || [];

      let html = '';

      /* Header */
      html += '<header class="header">';
      html += '  <h1 class="header__title">One family.<span>Every voice.</span></h1>';
      html += '  <p class="header__subtitle">Airbnb Cereal VF carries every interaction in the platform—from 8px legal disclaimers to 28px page headings. A single variable typeface, intelligently weighted.</p>';
      html += '  <hr class="header__rule">';
      html += '</header>';

      /* Font Families */
      html += '<div class="font-families">';
      html += '  <div class="font-card">';
      html += '    <div class="font-card__label">Primary & Only</div>';
      html += '    <div class="font-card__name">Airbnb Cereal VF</div>';
      html += '    <div class="font-card__detail">Proprietary variable-weight sans-serif<br>Weights: 400, 500, 600, 700<br>Fallback: Circular, -apple-system, Roboto, sans-serif</div>';
      html += '  </div>';
      html += '</div>';

      /* Character Set */
      html += '<div class="charset-block">';
      html += '  <div class="charset-block__label">Character Set</div>';
      html += '  <div class="charset-block__chars">AaBbCcDdEeFfGgHhIiJjKkLlMmNnOoPpQqRrSsTtUuVvWwXxYyZz<br>0123456789 !@#$%&amp;*()–—''""<br>€¥£©®™ ½ ¼ ¾ … · •</div>';
      html += '</div>';

      /* Type Ramp */
      if (ramp.length) {
        html += '<div class="ramp-section">';
        html += '<div class="section-label">Type Ramp</div>';
        ramp.forEach((entry, i) => {
          html += rampRow(entry, i);
        });
        html += '</div>';
      }

      app.innerHTML = html;
    }

    function rampRow(entry, idx) {
      const role = entry.role || 'Role ' + (idx + 1);
      const size = entry.size || entry.fontSize || '16px';
      const weight = entry.weight || entry.fontWeight || '500';
      const lh = entry.lineHeight || '1.5';
      const ls = entry.letterSpacing || '0';
      
      const sampleIdx = idx % EDITORIAL_SAMPLES.length;
      const sample = EDITORIAL_SAMPLES[sampleIdx];

      const sizeNum = parseFloat(size);
      /* Truncate very large samples */
      const displaySample = sizeNum >= 22
        ? sample.split(' ').slice(0, 4).join(' ') + (sizeNum >= 28 ? '.' : '')
        : sample;

      let fontStyle = 'font-size:' + size + ';font-weight:' + weight + ';line-height:' + lh + ';';
      if (ls !== '0' && ls !== 'normal') fontStyle += 'letter-spacing:' + ls + ';';

      let meta = '';
      meta += esc(size) + ' / ' + esc(String(weight));
      meta += '\nLine Height: ' + esc(String(lh));
      if (ls !== '0' && ls !== 'normal') meta += '\nLetter Spacing: ' + esc(ls);

      return '' +
        '<div class="ramp-row">' +
        '  <div class="ramp-meta">' +
        '    <div class="ramp-meta__role">' + esc(role) + '</div>' +
        '    <pre class="ramp-meta__detail">' + meta + '</pre>' +
        '  </div>' +
        '  <div class="ramp-sample" style="' + fontStyle + '">' + esc(displaySample) + '</div>' +
        '</div>';
    }

    function esc(s) {
      const d = document.createElement('div');
      d.textContent = String(s);
      return d.innerHTML;
    }
  </script>
</body>
</html>
