<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Brand Motifs — Agentic</title>
  <link rel="stylesheet" href="../colors_and_type.css">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: var(--font-body, system-ui, sans-serif);
      background: var(--paper, #ffffff);
      color: var(--ink, #111111);
      line-height: 1.6;
    }

    .page {
      max-width: 1100px;
      margin: 0 auto;
      padding: 64px 32px;
    }

    /* Header */
    .header {
      margin-bottom: 64px;
    }
    .header__title {
      font-family: var(--font-display, system-ui, sans-serif);
      font-size: 48px;
      font-weight: 700;
      line-height: 1.15;
      letter-spacing: -0.02em;
      color: var(--ink, #111111);
      margin-bottom: 12px;
    }
    .header__subtitle {
      font-size: 18px;
      color: var(--slate, #666666);
      max-width: 600px;
      font-weight: 400;
    }
    .header__rule {
      display: block;
      width: 64px;
      height: 3px;
      background: var(--signal, #3b82f6);
      border: none;
      margin-top: 24px;
      border-radius: 2px;
    }

    /* Section */
    .section {
      margin-bottom: 56px;
    }
    .section__label {
      font-family: var(--font-display, system-ui, sans-serif);
      font-size: 14px;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--slate, #666666);
      margin-bottom: 24px;
      padding-bottom: 12px;
      border-bottom: 1px solid var(--border, #e5e5e5);
    }

    /* Key characteristics */
    .traits-list {
      list-style: none;
      padding: 0;
    }
    .traits-list li {
      position: relative;
      padding: 12px 0 12px 28px;
      font-size: 15px;
      line-height: 1.6;
      color: var(--ink, #111111);
      border-bottom: 1px solid var(--border, #e5e5e5);
    }
    .traits-list li:last-child {
      border-bottom: none;
    }
    .traits-list li::before {
      content: '';
      position: absolute;
      left: 0;
      top: 18px;
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--signal, #3b82f6);
      opacity: 0.6;
    }

    /* Do's and Don'ts */
    .dd-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 24px;
    }
    @media (max-width: 640px) {
      .dd-grid {
        grid-template-columns: 1fr;
      }
    }
    .dd-card {
      background: var(--paper, #ffffff);
      border: 1px solid var(--border, #e5e5e5);
      border-radius: 12px;
      padding: 24px;
      overflow: hidden;
    }
    .dd-card__heading {
      font-family: var(--font-display, system-ui, sans-serif);
      font-size: 18px;
      font-weight: 600;
      margin-bottom: 16px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .dd-card__heading--do { color: #166534; }
    .dd-card__heading--dont { color: #991b1b; }

    .dd-card__icon {
      width: 22px;
      height: 22px;
      border-radius: 50%;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      font-size: 14px;
      flex-shrink: 0;
    }
    .dd-card__icon--do {
      background: #dcfce7;
      color: #166534;
    }
    .dd-card__icon--dont {
      background: #fee2e2;
      color: #991b1b;
    }

    .dd-list {
      list-style: none;
      padding: 0;
    }
    .dd-list li {
      font-size: 14px;
      line-height: 1.6;
      color: var(--ink, #111111);
      padding: 6px 0;
      border-bottom: 1px solid var(--border, #e5e5e5);
    }
    .dd-list li:last-child {
      border-bottom: none;
    }

    /* Color harmony strip */
    .harmony-strip {
      display: flex;
      border-radius: 12px;
      overflow: hidden;
      height: 80px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.06);
    }
    .harmony-strip__swatch {
      flex: 1;
      position: relative;
      transition: flex 0.3s ease;
      cursor: default;
    }
    .harmony-strip__swatch:hover {
      flex: 1.8;
    }
    .harmony-strip__label {
      position: absolute;
      bottom: 8px;
      left: 50%;
      transform: translateX(-50%);
      font-family: var(--font-mono, ui-monospace, monospace);
      font-size: 10px;
      font-weight: 600;
      padding: 2px 6px;
      border-radius: 3px;
      white-space: nowrap;
      opacity: 0;
      transition: opacity 0.2s ease;
    }
    .harmony-strip__swatch:hover .harmony-strip__label {
      opacity: 1;
    }

    /* Type pairing demo */
    .type-pairing {
      background: var(--bone, #f5f5f5);
      border: 1px solid var(--border, #e5e5e5);
      border-radius: 12px;
      padding: 40px 32px;
    }
    .type-pairing__display {
      font-family: var(--font-display, system-ui, sans-serif);
      font-size: 36px;
      font-weight: 700;
      line-height: 1.2;
      letter-spacing: -0.01em;
      color: var(--ink, #111111);
      margin-bottom: 16px;
    }
    .type-pairing__body {
      font-family: var(--font-body, system-ui, sans-serif);
      font-size: 16px;
      font-weight: 400;
      line-height: 1.65;
      color: var(--slate, #666666);
      max-width: 640px;
    }
    .type-pairing__meta {
      display: flex;
      gap: 24px;
      margin-top: 20px;
      padding-top: 16px;
      border-top: 1px solid var(--border, #e5e5e5);
    }
    .type-pairing__meta-item {
      font-family: var(--font-mono, ui-monospace, monospace);
      font-size: 12px;
      color: var(--slate, #666666);
    }
    .type-pairing__meta-label {
      font-weight: 600;
      color: var(--ink, #111111);
    }

    /* Atmosphere card */
    .atmosphere-card {
      background: var(--paper, #ffffff);
      border: 1px solid var(--border, #e5e5e5);
      border-radius: 12px;
      padding: 28px 24px;
    }
    .atmosphere-card p {
      font-size: 15px;
      line-height: 1.7;
      color: var(--ink, #111111);
    }

    /* Loading */
    .loading {
      text-align: center;
      padding: 80px 24px;
      color: var(--slate, #666666);
      font-size: 16px;
    }
    .loading::after {
      content: '';
      display: block;
      width: 32px;
      height: 32px;
      margin: 16px auto 0;
      border: 3px solid var(--border, #e5e5e5);
      border-top-color: var(--signal, #3b82f6);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div class="page" id="app">
    <div class="loading">Loading design tokens&hellip;</div>
  </div>

  <script>
    const CORE_COLOR_KEYS = ['paper', 'ink', 'slate', 'signal', 'bone', 'border', 'surface'];

    (window.__DESIGN_TOKENS__ ? Promise.resolve({ ok: true, json: () => Promise.resolve(window.__DESIGN_TOKENS__) }) : fetch('../tokens.json'))
      .then(r => {
        if (!r.ok) throw new Error('tokens.json not found (' + r.status + ')');
        return r.json();
      })
      .then(render)
      .catch(err => {
        document.getElementById('app').innerHTML =
          '<div class="loading" style="color:#dc2626">' +
          'Could not load tokens.json &mdash; ' + err.message + '</div>';
      });

    function render(tokens) {
      const app = document.getElementById('app');
      const name = tokens.meta?.title || tokens.title || 'Agentic';
      const colors = tokens.colors || {};
      const typography = tokens.typography || {};
      const meta = tokens.meta || {};

      const keyCharacteristics = [
        'Conversational first—minimize UI chrome and maximize dialogue clarity',
        'Delegate with confidence—clear delegation markers and task outcomes',
        'Minimal controls—every button earns its place through high intent',
        'Strong visual signal—use primary accent to highlight agent actions',
        'Surface-driven color—subtle layers guide focus without distraction',
        'Predictable interaction—150–250ms transitions on all state changes'
      ];

      const dos = [
        'Use the primary signal color (#3b82f6) for agent-initiated actions',
        'Keep conversation transcripts scannable with clear speaker attribution',
        'Show task delegation with confirmation and rollback affordances',
        'Apply subtle transitions to emphasize state and outcome changes',
        'Maintain ample whitespace to reduce cognitive load in long workflows'
      ];

      const donts = [
        'Don\'t bury delegated tasks—use clear, persistent outcome displays',
        'Don\'t over-animate; reserve motion for semantic state changes only',
        'Don\'t mix signal colors; primary accent must remain authoritative',
        'Don\'t clutter the interface with toggles and settings; use smart defaults',
        'Don\'t break the conversational rhythm with modal interruptions'
      ];

      let html = '';

      /* Header */
      html += '<header class="header">';
      html += '  <h1 class="header__title">Agentic</h1>';
      html += '  <p class="header__subtitle">Brand motifs, personality, and guidelines for conversational AI-first interfaces.</p>';
      html += '  <hr class="header__rule">';
      html += '</header>';

      /* Atmosphere */
      html += '<div class="section">';
      html += '  <div class="section__label">System Atmosphere</div>';
      html += '  <div class="atmosphere-card">';
      html += '    <p>Agentic is built for interfaces where users delegate tasks to AI agents. The design philosophy emphasizes clarity of intent, visibility of task outcomes, and minimal friction in the delegation loop. Color, spacing, and motion work together to make agent actions unmistakable while keeping the interface calm and focused on the conversation.</p>';
      html += '  </div>';
      html += '</div>';

      /* Key Characteristics */
      html += '<div class="section">';
      html += '  <div class="section__label">Key Characteristics</div>';
      html += '  <ul class="traits-list">';
      keyCharacteristics.forEach(trait => {
        html += '<li>' + esc(trait) + '</li>';
      });
      html += '  </ul>';
      html += '</div>';

      /* Do's and Don'ts */
      html += '<div class="section">';
      html += '  <div class="section__label">Do\'s and Don\'ts</div>';
      html += '  <div class="dd-grid">';

      html += '<div class="dd-card">';
      html += '  <div class="dd-card__heading dd-card__heading--do">';
      html += '    <span class="dd-card__icon dd-card__icon--do">&#10003;</span> Do';
      html += '  </div>';
      html += '  <ul class="dd-list">';
      dos.forEach(d => { html += '<li>' + esc(d) + '</li>'; });
      html += '  </ul>';
      html += '</div>';

      html += '<div class="dd-card">';
      html += '  <div class="dd-card__heading dd-card__heading--dont">';
      html += '    <span class="dd-card__icon dd-card__icon--dont">&#10007;</span> Don\'t';
      html += '  </div>';
      html += '  <ul class="dd-list">';
      donts.forEach(d => { html += '<li>' + esc(d) + '</li>'; });
      html += '  </ul>';
      html += '</div>';

      html += '  </div>';
      html += '</div>';

      /* Color Harmony Strip */
      const harmonyKeys = CORE_COLOR_KEYS.filter(k => colors[k]);
      if (harmonyKeys.length) {
        html += '<div class="section">';
        html += '  <div class="section__label">Color Harmony</div>';
        html += '  <div class="harmony-strip">';

        harmonyKeys.forEach(key => {
          const hex = colors[key];
          const lum = relativeLuminance(hex);
          const labelColor = lum > 0.4 ? '#111111' : '#ffffff';
          const labelBg = lum > 0.4 ? 'rgba(0,0,0,0.06)' : 'rgba(0,0,0,0.24)';
          html += '<div class="harmony-strip__swatch" style="background:' + esc(hex) + '">';
          html += '  <span class="harmony-strip__label" style="color:' + labelColor + ';background:' + labelBg + '">' + esc(key) + '</span>';
          html += '</div>';
        });

        html += '  </div>';
        html += '</div>';
      }

      /* Typography Pairing Demo */
      html += '<div class="section">';
      html += '  <div class="section__label">Typography Pairing</div>';
      html += '  <div class="type-pairing">';

      html += '    <div class="type-pairing__display">Delegate tasks with clarity and confidence</div>';

      html += '    <div class="type-pairing__body">In agentic workflows, typography carries the voice of both user and agent. Display faces set intention and hierarchy; body faces sustain readability across task transcripts and outcomes. Mono weights carry system messages and delegation confirmations. Together, they create a conversational cadence that feels both modern and trustworthy.</div>';

      html += '    <div class="type-pairing__meta">';
      html += '      <div class="type-pairing__meta-item"><span class="type-pairing__meta-label">Display:</span> system-ui, sans-serif (700 weight)</div>';
      html += '      <div class="type-pairing__meta-item"><span class="type-pairing__meta-label">Body:</span> system-ui, sans-serif (400 weight)</div>';
      html += '    </div>';
      html += '  </div>';
      html += '</div>';

      app.innerHTML = html;
    }

    /* Utilities */
    function esc(s) {
      const d = document.createElement('div');
      d.textContent = String(s);
      return d.innerHTML;
    }

    function hexToRgb(hex) {
      hex = hex.replace(/^#/, '');
      if (hex.length === 3) hex = hex.split('').map(c => c + c).join('');
      const n = parseInt(hex, 16);
      return [(n >> 16) & 255, (n >> 8) & 255, n & 255];
    }

    function relativeLuminance(hex) {
      try {
        const [r, g, b] = hexToRgb(hex).map(c => {
          c /= 255;
          return c <= 0.03928 ? c / 12.92 : Math.pow((c + 0.055) / 1.055, 2.4);
        });
        return 0.2126 * r + 0.7152 * g + 0.0722 * b;
      } catch { return 0.5; }
    }
  </script>
</body>
</html>
