<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Agentic — Type Specimen</title>
  <link rel="stylesheet" href="../colors_and_type.css">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: var(--font-body, 'Inter', system-ui, sans-serif);
      background: var(--paper, #ffffff);
      color: var(--ink, #111111);
      line-height: 1.6;
    }

    .page {
      max-width: 1100px;
      margin: 0 auto;
      padding: 64px 32px;
    }

    /* Header */
    .header {
      margin-bottom: 64px;
    }
    .header__title {
      font-family: var(--font-display, system-ui, sans-serif);
      font-size: 56px;
      font-weight: 700;
      line-height: 1.1;
      letter-spacing: -0.02em;
      color: var(--ink, #111111);
      margin-bottom: 12px;
    }
    .header__subtitle {
      font-size: 18px;
      color: var(--slate, #666666);
      max-width: 700px;
      font-weight: 400;
      line-height: 1.6;
    }
    .header__rule {
      display: block;
      width: 80px;
      height: 3px;
      background: var(--signal, #3b82f6);
      border: none;
      margin-top: 28px;
      border-radius: 2px;
    }

    /* Font family summary */
    .font-families {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 24px;
      margin-bottom: 56px;
    }
    .font-card {
      background: var(--paper, #ffffff);
      border: 1px solid var(--border, #e5e5e5);
      border-radius: 12px;
      padding: 28px 24px;
    }
    .font-card__label {
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--slate, #666666);
      margin-bottom: 8px;
    }
    .font-card__name {
      font-size: 24px;
      font-weight: 500;
      line-height: 1.3;
      margin-bottom: 4px;
      color: var(--ink, #111111);
    }
    .font-card__fallback {
      font-family: var(--font-mono, 'JetBrains Mono', ui-monospace, monospace);
      font-size: 12px;
      color: var(--slate, #666666);
      word-break: break-all;
    }

    /* Section label */
    .section-label {
      font-family: var(--font-display, system-ui, sans-serif);
      font-size: 14px;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--slate, #666666);
      margin-bottom: 24px;
      padding-bottom: 12px;
      border-bottom: 1px solid var(--border, #e5e5e5);
    }

    /* Ramp row */
    .ramp-row {
      display: grid;
      grid-template-columns: 280px 1fr;
      gap: 32px;
      align-items: baseline;
      padding: 28px 0;
      border-bottom: 1px solid var(--border, #e5e5e5);
    }
    .ramp-row:last-child {
      border-bottom: none;
    }

    @media (max-width: 720px) {
      .ramp-row {
        grid-template-columns: 1fr;
        gap: 12px;
      }
    }

    /* Left meta column */
    .ramp-meta__role {
      font-family: var(--font-display, system-ui, sans-serif);
      font-size: 16px;
      font-weight: 600;
      color: var(--ink, #111111);
      margin-bottom: 8px;
    }
    .ramp-meta__detail {
      font-family: var(--font-mono, 'JetBrains Mono', ui-monospace, monospace);
      font-size: 12px;
      line-height: 1.7;
      color: var(--slate, #666666);
    }

    /* Right sample column */
    .ramp-sample {
      color: var(--ink, #111111);
      overflow-wrap: break-word;
      word-break: break-word;
    }

    /* Ramp section container */
    .ramp-section {
      margin-bottom: 56px;
    }

    /* Character set block */
    .charset-block {
      background: var(--bone, #f5f5f5);
      border: 1px solid var(--border, #e5e5e5);
      border-radius: 12px;
      padding: 40px 32px;
      margin-bottom: 56px;
    }
    .charset-block__label {
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--slate, #666666);
      margin-bottom: 16px;
    }
    .charset-block__chars {
      font-size: 28px;
      line-height: 1.6;
      letter-spacing: 0.02em;
      color: var(--ink, #111111);
      word-break: break-all;
      font-weight: 400;
    }

    /* Loading */
    .loading {
      text-align: center;
      padding: 80px 24px;
      color: var(--slate, #666666);
      font-size: 16px;
    }
    .loading::after {
      content: '';
      display: block;
      width: 32px;
      height: 32px;
      margin: 16px auto 0;
      border: 3px solid var(--border, #e5e5e5);
      border-top-color: var(--signal, #3b82f6);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* Drop cap demo */
    .dropcap-demo {
      background: var(--bone, #f5f5f5);
      border: 1px solid var(--border, #e5e5e5);
      border-radius: 12px;
      padding: 40px 32px;
      margin-bottom: 56px;
      font-size: 16px;
      line-height: 1.7;
      color: var(--ink, #111111);
    }
    .dropcap-demo__label {
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--slate, #666666);
      margin-bottom: 16px;
    }
    .dropcap-demo__text {
      max-width: 600px;
    }
    .dropcap-demo__drop {
      font-size: 56px;
      font-weight: 700;
      line-height: 0.9;
      float: left;
      margin-right: 8px;
      margin-bottom: -4px;
      color: var(--signal, #3b82f6);
    }
  </style>
</head>
<body>
  <div class="page" id="app">
    <div class="loading">Loading design tokens&hellip;</div>
  </div>

  <script>
    const EDITORIAL_SAMPLES = [
      'Agentic systems delegate tasks with clarity, reducing cognitive load while maintaining control.',
      'Conversational interfaces should feel natural and anticipatory, never overwhelming.',
      'The best delegation requires minimal instruction and maximum clarity of outcome.',
      'Surface-level interactions reveal depth when you need it most.',
      'Bold typography signals confidence in what the agent will do for you.',
      'Modern design means knowing when to disappear and when to speak.',
      'Every control should feel earned, every output should feel intentional.',
      'Scanability and contrast define trust in conversational systems.',
    ];

    ( window.__DESIGN_TOKENS__ ? Promise.resolve({ ok: true, json: () => Promise.resolve(window.__DESIGN_TOKENS__) }) : fetch('../tokens.json') )
      .then(r => {
        if (!r.ok) throw new Error('tokens.json not found (' + r.status + ')');
        return r.json();
      })
      .then(render)
      .catch(err => {
        document.getElementById('app').innerHTML =
          '<div class="loading" style="color:#dc2626">' +
          'Could not load tokens.json &mdash; ' + err.message + '</div>';
      });

    function render(tokens) {
      const app = document.getElementById('app');
      const title = tokens.meta?.title || 'Agentic';
      const summary = tokens.meta?.summary || 'Conversational AI-first interface design system.';

      /* Load Google Fonts if present */
      if (tokens.googleFontsUrl) {
        const link = document.createElement('link');
        link.rel = 'stylesheet';
        link.href = tokens.googleFontsUrl;
        document.head.appendChild(link);
      }

      const ramp = tokens.typography?.ramp || tokens.typeRamp || [];
      
      /* Build ramp from scale if available */
      let rampEntries = [];
      if (Array.isArray(ramp) && ramp.length > 0) {
        rampEntries = ramp.map((entry, idx) => 
          typeof entry === 'object' ? { role: entry.role || entry.name || 'Role ' + (idx + 1), ...entry } : entry
        );
      } else {
        /* Fallback: use common scale from design brief */
        rampEntries = [
          { role: 'Hero', size: '40px', weight: 700, lineHeight: '1.1' },
          { role: 'Display · Large', size: '32px', weight: 700, lineHeight: '1.15' },
          { role: 'Heading 1', size: '24px', weight: 600, lineHeight: '1.25' },
          { role: 'Heading 2', size: '18px', weight: 600, lineHeight: '1.3' },
          { role: 'Body · Regular', size: '16px', weight: 400, lineHeight: '1.6' },
          { role: 'Body · Small', size: '14px', weight: 400, lineHeight: '1.6' },
        ];
      }

      let html = '';

      /* Header */
      html += '<header class="header">';
      html += '  <h1 class="header__title">' + esc(title) + '</h1>';
      html += '  <p class="header__subtitle">' + esc(summary) + '</p>';
      html += '  <hr class="header__rule">';
      html += '</header>';

      /* Font family info */
      const displayFont = tokens.typography?.fontDisplay || tokens.meta?.displayFont || 'Playfair Display';
      const bodyFont = tokens.typography?.fontBody || tokens.meta?.bodyFont || 'System';
      const monoFont = tokens.typography?.fontMono || 'JetBrains Mono';

      html += '<div class="font-families">';
      html += '  <div class="font-card">';
      html += '    <div class="font-card__label">Display</div>';
      html += '    <div class="font-card__name">' + esc(displayFont) + '</div>';
      html += '    <div class="font-card__fallback">700, 600, 400 weights</div>';
      html += '  </div>';
      html += '  <div class="font-card">';
      html += '    <div class="font-card__label">Body</div>';
      html += '    <div class="font-card__name">' + esc(bodyFont) + '</div>';
      html += '    <div class="font-card__fallback">400 weight for readability</div>';
      html += '  </div>';
      html += '  <div class="font-card">';
      html += '    <div class="font-card__label">Monospace</div>';
      html += '    <div class="font-card__name">' + esc(monoFont) + '</div>';
      html += '    <div class="font-card__fallback">code, metadata, details</div>';
      html += '  </div>';
      html += '</div>';

      /* Character set */
      html += '<div class="charset-block">';
      html += '  <div class="charset-block__label">Character Set</div>';
      html += '  <div class="charset-block__chars">AaBbCcDdEeFfGgHhIiJjKkLlMmNnOoPpQqRrSsTtUuVvWwXxYyZz<br>0123456789 !@#$%&amp;*()&ndash;&mdash;&lsquo;&rsquo;&ldquo;&rdquo;</div>';
      html += '</div>';

      /* Type ramp */
      if (rampEntries.length) {
        html += '<div class="ramp-section">';
        html += '<div class="section-label">Type Ramp</div>';
        rampEntries.forEach((entry, i) => {
          html += rampRow(entry, i);
        });
        html += '</div>';
      }

      /* Drop cap demo */
      html += '<div class="dropcap-demo">';
      html += '  <div class="dropcap-demo__label">Display Font with Drop Cap</div>';
      html += '  <div class="dropcap-demo__text">';
      html += '    <span class="dropcap-demo__drop">A</span>';
      html += '    gentic systems thrive on clarity and intent. When a user delegates a task to an agent, they expect transparent outcomes and minimal friction. Typography should feel confident and modern—bold enough to signal capability, refined enough to maintain trust.';
      html += '  </div>';
      html += '</div>';

      app.innerHTML = html;
    }

    function rampRow(entry, idx) {
      const role = entry.role || entry.name || 'Role ' + (idx + 1);
      const size = entry.size || entry.fontSize || '16px';
      const weight = entry.weight || entry.fontWeight || '400';
      const lh = entry.lineHeight || entry.lh || '1.5';
      const ls = entry.letterSpacing || entry.ls || 'normal';
      const family = entry.font || entry.fontFamily || '';
      const sampleIdx = idx % EDITORIAL_SAMPLES.length;
      const sample = EDITORIAL_SAMPLES[sampleIdx];

      const sizeNum = parseFloat(size);
      const displaySample = sizeNum >= 32
        ? sample.split('.')[0] + '.'
        : sample;

      let fontStyle = 'font-size:' + size + ';font-weight:' + weight + ';line-height:' + lh + ';';
      if (ls !== 'normal') fontStyle += 'letter-spacing:' + ls + ';';
      if (family) fontStyle += 'font-family:\'' + esc(family) + '\',var(--font-body,sans-serif);';

      let meta = '';
      meta += esc(size) + ' / ' + esc(weight);
      if (family) meta += '\n' + esc(family);
      meta += '\nline-height: ' + esc(String(lh));
      if (ls !== 'normal') meta += '\nletter-spacing: ' + esc(ls);

      return '' +
        '<div class="ramp-row">' +
        '  <div class="ramp-meta">' +
        '    <div class="ramp-meta__role">' + esc(role) + '</div>' +
        '    <pre class="ramp-meta__detail">' + meta + '</pre>' +
        '  </div>' +
        '  <div class="ramp-sample" style="' + fontStyle + '">' + esc(displaySample) + '</div>' +
        '</div>';
    }

    function esc(s) {
      const d = document.createElement('div');
      d.textContent = String(s);
      return d.innerHTML;
    }
  </script>
</body>
</html>
