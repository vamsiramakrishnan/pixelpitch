<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Spacing &amp; Rules — Energetic</title>
  <link rel="stylesheet" href="../colors_and_type.css">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: var(--font-body, system-ui, sans-serif);
      background: var(--paper, #ffffff);
      color: var(--ink, #111111);
      line-height: 1.6;
    }

    .page {
      max-width: 1200px;
      margin: 0 auto;
      padding: 96px 64px;
    }

    /* Header / Stage head */
    .header {
      margin-bottom: 96px;
      position: relative;
    }

    .header__kicker {
      font-family: var(--font-mono, ui-monospace, monospace);
      font-size: 14px;
      font-weight: 700;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--signal, #3b82f6);
      margin-bottom: 12px;
    }

    .header__title {
      font-family: var(--font-display, system-ui, sans-serif);
      font-size: 72px;
      font-weight: 900;
      line-height: 0.95;
      letter-spacing: -0.02em;
      color: var(--ink, #111111);
      margin-bottom: 8px;
      max-width: 90%;
    }

    .header__subtitle {
      font-family: var(--font-body, system-ui, sans-serif);
      font-size: 22px;
      font-weight: 400;
      line-height: 1.55;
      color: var(--slate, #666666);
      max-width: 75%;
      margin-bottom: 32px;
    }

    .header__rule {
      display: block;
      width: 120px;
      height: 6px;
      background: var(--signal, #3b82f6);
      border: none;
      margin-top: 24px;
    }

    /* Section */
    .section {
      margin-bottom: 96px;
    }

    .section__label {
      font-family: var(--font-mono, ui-monospace, monospace);
      font-size: 14px;
      font-weight: 700;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--ink, #111111);
      margin-bottom: 48px;
      padding-bottom: 16px;
      border-bottom: 3px solid var(--signal, #3b82f6);
    }

    /* Spacing scale */
    .spacing-row {
      display: grid;
      grid-template-columns: 120px 1fr 100px;
      gap: 24px;
      align-items: center;
      padding: 24px 0;
      border-bottom: 2px solid var(--border, #e5e5e5);
    }

    .spacing-row:last-child {
      border-bottom: none;
    }

    .spacing-row__name {
      font-family: var(--font-mono, ui-monospace, monospace);
      font-size: 14px;
      font-weight: 700;
      color: var(--ink, #111111);
    }

    .spacing-row__label {
      font-family: var(--font-body, system-ui, sans-serif);
      font-size: 13px;
      color: var(--slate, #666666);
      margin-top: 4px;
    }

    .spacing-row__bar-wrap {
      height: 32px;
      display: flex;
      align-items: center;
      background: var(--bone, #f5f5f5);
      padding: 0 12px;
      border-radius: 4px;
      border: 2px solid var(--border, #e5e5e5);
    }

    .spacing-row__bar {
      height: 4px;
      background: var(--signal, #3b82f6);
      min-width: 4px;
      border-radius: 2px;
    }

    .spacing-row:hover .spacing-row__bar {
      background: var(--ink, #111111);
    }

    .spacing-row__value {
      font-family: var(--font-mono, ui-monospace, monospace);
      font-size: 14px;
      font-weight: 700;
      color: var(--ink, #111111);
      text-align: right;
    }

    /* Rule weights */
    .rule-demo {
      padding: 32px 0;
      border-bottom: 2px solid var(--border, #e5e5e5);
    }

    .rule-demo:last-child {
      border-bottom: none;
    }

    .rule-demo__header {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      margin-bottom: 16px;
    }

    .rule-demo__name {
      font-family: var(--font-mono, ui-monospace, monospace);
      font-size: 14px;
      font-weight: 700;
      color: var(--ink, #111111);
    }

    .rule-demo__label {
      font-family: var(--font-body, system-ui, sans-serif);
      font-size: 13px;
      color: var(--slate, #666666);
    }

    .rule-demo__spec {
      font-family: var(--font-mono, ui-monospace, monospace);
      font-size: 13px;
      font-weight: 600;
      color: var(--signal, #3b82f6);
    }

    .rule-demo__container {
      width: 100%;
      height: 64px;
      display: flex;
      align-items: center;
      padding: 0;
      background: var(--bone, #f5f5f5);
      border-radius: 4px;
    }

    .rule-demo__line {
      width: 100%;
      border: none;
      border-radius: 0;
      margin: 0;
    }

    /* Border radius */
    .radius-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 64px;
      margin-bottom: 48px;
    }

    .radius-item {
      display: grid;
      grid-template-columns: 160px 1fr;
      gap: 32px;
      align-items: center;
    }

    .radius-item__demo {
      display: flex;
      gap: 16px;
      align-items: center;
    }

    .radius-item__box {
      width: 120px;
      height: 120px;
      background: var(--surface, #f5f5f5);
      border: 3px solid var(--signal, #3b82f6);
      flex-shrink: 0;
    }

    .radius-item__info {
      flex: 1;
    }

    .radius-item__name {
      font-family: var(--font-mono, ui-monospace, monospace);
      font-size: 14px;
      font-weight: 700;
      color: var(--ink, #111111);
      margin-bottom: 4px;
    }

    .radius-item__value {
      font-family: var(--font-mono, ui-monospace, monospace);
      font-size: 13px;
      color: var(--signal, #3b82f6);
      margin-bottom: 12px;
      font-weight: 600;
    }

    .radius-item__description {
      font-family: var(--font-body, system-ui, sans-serif);
      font-size: 13px;
      line-height: 1.55;
      color: var(--slate, #666666);
    }

    /* Philosophy block */
    .philosophy {
      background: var(--bone, #f5f5f5);
      padding: 48px;
      border: 3px solid var(--signal, #3b82f6);
      margin-bottom: 64px;
      border-radius: 8px;
    }

    .philosophy__title {
      font-family: var(--font-mono, ui-monospace, monospace);
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--signal, #3b82f6);
      margin-bottom: 16px;
    }

    .philosophy__text {
      font-family: var(--font-body, system-ui, sans-serif);
      font-size: 18px;
      line-height: 1.65;
      color: var(--ink, #111111);
    }

    .philosophy__text strong {
      font-weight: 700;
    }

    .philosophy__text em {
      font-style: italic;
    }

    code {
      font-family: var(--font-mono, ui-monospace, monospace);
      background: rgba(59, 130, 246, 0.08);
      padding: 2px 6px;
      border-radius: 4px;
      font-weight: 600;
      color: var(--signal, #3b82f6);
    }

    /* Grid demo */
    .grid-demo {
      background: var(--bone, #f5f5f5);
      padding: 48px;
      border: 3px solid var(--signal, #3b82f6);
      margin-bottom: 64px;
      border-radius: 8px;
    }

    .grid-demo__title {
      font-family: var(--font-mono, ui-monospace, monospace);
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--signal, #3b82f6);
      margin-bottom: 24px;
    }

    .grid-demo__visual {
      width: 100%;
      height: 200px;
      display: grid;
      grid-template-columns: repeat(12, 1fr);
      gap: 16px;
      padding: 24px;
      border: 3px dashed var(--signal, #3b82f6);
      background: var(--paper, #ffffff);
      border-radius: 4px;
    }

    .grid-demo__column {
      background: rgba(59, 130, 246, 0.1);
      border: 2px solid var(--signal, #3b82f6);
      font-family: var(--font-mono, ui-monospace, monospace);
      font-size: 11px;
      font-weight: 700;
      color: var(--signal, #3b82f6);
      display: flex;
      align-items: flex-end;
      justify-content: center;
      padding-bottom: 8px;
      border-radius: 4px;
    }

    .grid-demo__info {
      margin-top: 24px;
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 24px;
    }

    .grid-demo__stat {
      font-family: var(--font-body, system-ui, sans-serif);
      font-size: 13px;
      color: var(--ink, #111111);
      font-weight: 600;
    }

    .grid-demo__stat-label {
      font-family: var(--font-mono, ui-monospace, monospace);
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--signal, #3b82f6);
      margin-bottom: 8px;
    }

    /* Depth philosophy */
    .depth-demo {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 24px;
      margin-bottom: 48px;
    }

    .depth-item {
      padding: 32px;
      border-radius: 8px;
      text-align: center;
    }

    .depth-item--flat {
      background: var(--paper, #ffffff);
      border: 2px solid var(--border, #e5e5e5);
    }

    .depth-item--border {
      background: var(--paper, #ffffff);
      border: 2px solid var(--signal, #3b82f6);
    }

    .depth-item--elevated {
      background: var(--paper, #ffffff);
      border: 2px solid var(--signal, #3b82f6);
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
    }

    .depth-item__name {
      font-family: var(--font-mono, ui-monospace, monospace);
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--signal, #3b82f6);
      margin-bottom: 8px;
    }

    .depth-item__spec {
      font-family: var(--font-mono, ui-monospace, monospace);
      font-size: 12px;
      color: var(--slate, #666666);
    }

    .depth-item__use {
      font-family: var(--font-body, system-ui, sans-serif);
      font-size: 13px;
      color: var(--slate, #666666);
      margin-top: 12px;
      line-height: 1.5;
    }

    /* Loading */
    .loading {
      text-align: center;
      padding: 80px 24px;
      color: var(--slate, #666666);
      font-size: 16px;
    }

    .loading::after {
      content: '';
      display: block;
      width: 32px;
      height: 32px;
      margin: 16px auto 0;
      border: 3px solid rgba(59, 130, 246, 0.2);
      border-top-color: var(--signal, #3b82f6);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    @media (max-width: 900px) {
      .page {
        padding: 64px 32px;
      }

      .header {
        margin-bottom: 64px;
      }

      .header__title {
        font-size: 54px;
      }

      .header__subtitle {
        max-width: 100%;
      }

      .section {
        margin-bottom: 64px;
      }

      .spacing-row {
        grid-template-columns: 100px 1fr 80px;
        gap: 16px;
      }

      .radius-grid {
        grid-template-columns: 1fr;
        gap: 32px;
      }

      .radius-item {
        grid-template-columns: 120px 1fr;
      }

      .depth-demo {
        grid-template-columns: 1fr;
      }

      .grid-demo__info {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <div class="page" id="app">
    <div class="loading">Loading design tokens…</div>
  </div>

  <script>
    const DEFAULT_SPACING = {
      's-1': { value: '4px', label: 'xs' },
      's-2': { value: '8px', label: 'sm' },
      's-3': { value: '16px', label: 'md' },
      's-4': { value: '24px', label: 'lg' },
      's-5': { value: '32px', label: 'xl' },
      's-6': { value: '48px', label: '2xl' },
      's-7': { value: '64px', label: '3xl' },
      's-8': { value: '96px', label: '4xl' }
    };

    const DEFAULT_DEPTHS = [
      {
        name: 'Flat',
        spec: 'none',
        use: 'Default canvas, body containers'
      },
      {
        name: 'Border',
        spec: '1px solid var(--border)',
        use: 'Content cards, dividers'
      },
      {
        name: 'Elevated',
        spec: '0 2px 8px rgba(0,0,0,0.08)',
        use: 'Modals, popovers, highlights'
      }
    ];

    const DEFAULT_RADII = {
      'none': { value: '0px', use: 'Rarely used; reserved for strict geometric layouts' },
      'sm': { value: '4px', use: 'Small UI details, input focus states' },
      'md': { value: '8px', use: 'Buttons, input fields, cards (default)' },
      'lg': { value: '16px', use: 'Large panels, modals, card containers' },
      'full': { value: '999px', use: 'Badges, pills, avatar containers' }
    };

    ( window.__DESIGN_TOKENS__ ? Promise.resolve({ ok: true, json: () => Promise.resolve(window.__DESIGN_TOKENS__) }) : fetch('../tokens.json') )
      .then(r => {
        if (!r.ok) throw new Error('tokens.json not found (' + r.status + ')');
        return r.json();
      })
      .then(render)
      .catch(err => {
        document.getElementById('app').innerHTML =
          '<div class="loading" style="color:#dc2626">' +
          'Could not load tokens.json — ' + err.message + '</div>';
      });

    function render(tokens) {
      const app = document.getElementById('app');

      const spacing = {};
      if (tokens.spacing?.scale) {
        Object.entries(tokens.spacing.scale).forEach(([k, v]) => {
          spacing[k] = { value: v, label: k };
        });
      } else {
        Object.assign(spacing, DEFAULT_SPACING);
      }

      const depths = tokens.depth || DEFAULT_DEPTHS;
      const radii = tokens.radii || DEFAULT_RADII;

      let html = '';

      /* Header / Stage head */
      html += '<header class="header">';
      html += '  <div class="header__kicker">Spacing &amp; Depth</div>';
      html += '  <h1 class="header__title">Bold Grid.<br>Strong Rhythm.</h1>';
      html += '  <p class="header__subtitle">The spacing and depth system for Energetic — vibrant rhythm with thick borders, decisive contrast, and high-impact visual depth that commands attention.</p>';
      html += '  <hr class="header__rule">';
      html += '</header>';

      /* Philosophy block */
      html += '<div class="philosophy">';
      html += '  <div class="philosophy__title">Spacing Philosophy</div>';
      html += '  <div class="philosophy__text">';
      html += '    Built on an <strong>8px base unit</strong> that scales predictably across all dimensions. The spacing scale is intentionally bold — from tight 4px micro-interactions to generous 96px section breaks. <strong>Density meets breathing room</strong>: Content blocks are compact and information-rich, surrounded by decisive whitespace that creates visual rhythm and hierarchy. Every gap is intentional. <strong>Thick borders + strong contrast</strong>: Depth is communicated through 2–3px borders in signal blue (<code>#3b82f6</code>) combined with carefully applied shadows. This creates the vibrant, energetic feel that defines the system.';
      html += '  </div>';
      html += '</div>';

      /* Spacing scale */
      html += '<div class="section">';
      html += '  <div class="section__label">Spacing Scale</div>';

      const spacingEntries = Object.entries(spacing);
      const maxPx = Math.max(...spacingEntries.map(([, o]) => parseFloat(o.value) || 0), 1);

      spacingEntries.forEach(([key, obj]) => {
        const px = parseFloat(obj.value) || 0;
        const pct = Math.max((px / maxPx) * 100, 5);
        const label = obj.label || key;
        
        html += '<div class="spacing-row">';
        html += '  <div>';
        html += '    <div class="spacing-row__name">' + esc(key) + '</div>';
        html += '    <div class="spacing-row__label">' + esc(label) + '</div>';
        html += '  </div>';
        html += '  <div class="spacing-row__bar-wrap">';
        html += '    <div class="spacing-row__bar" style="width:' + pct + '%"></div>';
        html += '  </div>';
        html += '  <div class="spacing-row__value">' + esc(obj.value) + '</div>';
        html += '</div>';
      });

      html += '</div>';

      /* Depth / Elevation */
      html += '<div class="section">';
      html += '  <div class="section__label">Depth Levels</div>';

      html += '  <div class="depth-demo">';
      depths.forEach((depth, idx) => {
        const className = idx === 0 ? 'depth-item--flat' : (idx === 1 ? 'depth-item--border' : 'depth-item--elevated');
        html += '    <div class="depth-item ' + className + '">';
        html += '      <div class="depth-item__name">' + esc(depth.name) + '</div>';
        html += '      <div class="depth-item__spec">' + esc(depth.treatment || depth.spec) + '</div>';
        html += '      <div class="depth-item__use">' + esc(depth.use) + '</div>';
        html += '    </div>';
      });
      html += '  </div>';

      html += '</div>';

      /* Rule weights */
      html += '<div class="section">';
      html += '  <div class="section__label">Border & Rule Weights</div>';

      const rules = [
        { name: 'Hairline', weight: '1px', color: 'rgba(102, 102, 102, 0.3)', use: 'Subtle dividers, optional separators' },
        { name: 'Standard', weight: '2px', color: '#111111', use: 'Primary borders, cards, structure' },
        { name: 'Bold', weight: '3px', color: '#3b82f6', use: 'Sections, emphasis, headers, signal' }
      ];

      rules.forEach((rule) => {
        const weightNum = parseFloat(rule.weight) || 1;

        html += '<div class="rule-demo">';
        html += '  <div class="rule-demo__header">';
        html += '    <div>';
        html += '      <div class="rule-demo__name">' + esc(rule.name) + '</div>';
        html += '      <div class="rule-demo__label">' + esc(rule.use) + '</div>';
        html += '    </div>';
        html += '    <div class="rule-demo__spec">' + esc(rule.weight) + '</div>';
        html += '  </div>';
        html += '  <div class="rule-demo__container">';
        html += '    <div class="rule-demo__line" style="height:' + weightNum + 'px; background:' + rule.color + '"></div>';
        html += '  </div>';
        html += '</div>';
      });

      html += '</div>';

      /* Border radius */
      html += '<div class="section">';
      html += '  <div class="section__label">Border Radius</div>';

      html += '  <div class="radius-grid">';
      Object.entries(radii).forEach(([key, obj]) => {
        const radiusValue = obj.value;

        html += '    <div class="radius-item">';
        html += '      <div class="radius-item__demo">';
        html += '        <div class="radius-item__box" style="border-radius: ' + esc(radiusValue) + '"></div>';
        html += '      </div>';
        html += '      <div class="radius-item__info">';
        html += '        <div class="radius-item__name">--radius-' + esc(key) + '</div>';
        html += '        <div class="radius-item__value">' + esc(radiusValue) + '</div>';
        html += '        <div class="radius-item__description">' + esc(obj.use) + '</div>';
        html += '      </div>';
        html += '    </div>';
      });
      html += '  </div>';

      html += '</div>';

      /* Grid visualization */
      html += '<div class="section">';
      html += '  <div class="section__label">12-Column Grid Layout</div>';
      html += '  <div class="grid-demo">';
      html += '    <div class="grid-demo__title">Base Layout Grid</div>';
      html += '    <div class="grid-demo__visual">';
      for (let i = 1; i <= 12; i++) {
        html += '      <div class="grid-demo__column">Col ' + i + '</div>';
      }
      html += '    </div>';
      html += '    <div class="grid-demo__info">';
      html += '      <div>';
      html += '        <div class="grid-demo__stat-label">Column Gap</div>';
      html += '        <div class="grid-demo__stat">16px gutters between columns</div>';
      html += '      </div>';
      html += '      <div>';
      html += '        <div class="grid-demo__stat-label">Section Spacing</div>';
      html += '        <div class="grid-demo__stat">48–96px vertical between major blocks</div>';
      html += '      </div>';
      html += '      <div>';
      html += '        <div class="grid-demo__stat-label">Component Padding</div>';
      html += '        <div class="grid-demo__stat">16–32px internal spacing in containers</div>';
      html += '      </div>';
      html += '      <div>';
      html += '        <div class="grid-demo__stat-label">Edge Margins</div>';
      html += '        <div class="grid-demo__stat">64px outer margins on desktop</div>';
      html += '      </div>';
      html += '    </div>';
      html += '  </div>';
      html += '</div>';

      /* Whitespace philosophy */
      html += '<div class="philosophy" style="margin-top: 96px; margin-bottom: 0;">';
      html += '  <div class="philosophy__title">Composition Strategy</div>';
      html += '  <div class="philosophy__text">';
      html += '    <strong>Decisive contrast</strong>: Juxtapose dense content blocks with large void areas. A headline followed by 48px of whitespace commands attention through pure spatial contrast. <strong>Thick borders create rhythm</strong>: Use 2–3px borders in signal blue to separate sections and create visual movement. These are <em>not</em> decorative — they structure the page and guide the eye. <strong>Padding hierarchy</strong>: Cards and containers use 16px (tight), 24px (standard), or 32px (generous) internal padding depending on importance and density. External spacing is always larger than internal spacing. <strong>No soft edges</strong>: 8px or 16px radii on cards and buttons; everything else is square. Rounded corners are used strategically to soften the boldness of borders.';
      html += '  </div>';
      html += '</div>';

      app.innerHTML = html;
    }

    function esc(s) {
      const d = document.createElement('div');
      d.textContent = String(s);
      return d.innerHTML;
    }
  </script>
</body>
</html>
