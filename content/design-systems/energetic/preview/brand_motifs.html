<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Brand Motifs — Energetic</title>
  <link rel="stylesheet" href="../colors_and_type.css">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: var(--font-body, system-ui, sans-serif);
      background: var(--paper, #ffffff);
      color: var(--ink, #111111);
      line-height: 1.6;
    }

    .page {
      max-width: 1100px;
      margin: 0 auto;
      padding: 64px 32px;
    }

    /* ──── Header ──── */
    .header {
      margin-bottom: 80px;
    }

    .header__kicker {
      font-family: var(--font-mono, ui-monospace, monospace);
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--signal, #3b82f6);
      margin-bottom: 12px;
    }

    .header__title {
      font-family: var(--font-display, system-ui, sans-serif);
      font-size: 72px;
      font-weight: 700;
      line-height: 0.95;
      letter-spacing: -0.02em;
      color: var(--ink, #111111);
      margin-bottom: 16px;
    }

    .header__title span {
      color: var(--signal, #3b82f6);
    }

    .header__subtitle {
      font-family: var(--font-body, system-ui, sans-serif);
      font-size: 20px;
      font-weight: 400;
      line-height: 1.55;
      color: var(--slate, #666666);
      max-width: 680px;
      margin-bottom: 24px;
    }

    .header__rule {
      display: block;
      width: 80px;
      height: 4px;
      background: var(--signal, #3b82f6);
      border: none;
      margin-top: 32px;
      border-radius: var(--radius-sm, 4px);
    }

    /* ──── Section ──── */
    .section {
      margin-bottom: 80px;
    }

    .section__label {
      font-family: var(--font-mono, ui-monospace, monospace);
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--signal, #3b82f6);
      margin-bottom: 28px;
      padding-bottom: 12px;
      border-bottom: 3px solid var(--signal, #3b82f6);
    }

    /* ──── Key Characteristics ──── */
    .traits-list {
      list-style: none;
      padding: 0;
    }

    .traits-list li {
      position: relative;
      padding: 16px 0 16px 28px;
      font-family: var(--font-body, system-ui, sans-serif);
      font-size: 18px;
      font-weight: 500;
      line-height: 1.55;
      color: var(--ink, #111111);
      border-bottom: 2px solid var(--border, #e5e5e5);
    }

    .traits-list li:last-child {
      border-bottom: none;
    }

    .traits-list li::before {
      content: '';
      position: absolute;
      left: 0;
      top: 24px;
      width: 8px;
      height: 8px;
      border-radius: 0;
      background: var(--signal, #3b82f6);
    }

    /* ──── Do's and Don'ts ──── */
    .dd-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 32px;
    }

    @media (max-width: 768px) {
      .dd-grid {
        grid-template-columns: 1fr;
      }
    }

    .dd-card {
      background: var(--paper, #ffffff);
      border: 3px solid var(--signal, #3b82f6);
      border-radius: var(--radius-md, 8px);
      padding: 32px;
    }

    .dd-card__heading {
      font-family: var(--font-mono, ui-monospace, monospace);
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      margin-bottom: 20px;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .dd-card__heading--do {
      color: var(--signal, #3b82f6);
    }

    .dd-card__heading--dont {
      color: var(--ink, #111111);
    }

    .dd-card__icon {
      width: 20px;
      height: 20px;
      border-radius: 0;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      font-size: 12px;
      flex-shrink: 0;
      border: 2px solid currentColor;
    }

    .dd-card__icon--do {
      color: var(--signal, #3b82f6);
    }

    .dd-card__icon--dont {
      color: var(--ink, #111111);
    }

    .dd-list {
      list-style: none;
      padding: 0;
    }

    .dd-list li {
      font-family: var(--font-body, system-ui, sans-serif);
      font-size: 16px;
      font-weight: 400;
      line-height: 1.55;
      color: var(--ink, #111111);
      padding: 12px 0;
      border-bottom: 1px solid var(--border, #e5e5e5);
    }

    .dd-list li:last-child {
      border-bottom: none;
    }

    /* ──── Color Harmony Strip ──── */
    .harmony-strip {
      display: flex;
      border-radius: var(--radius-md, 8px);
      overflow: hidden;
      height: 120px;
      border: 3px solid var(--signal, #3b82f6);
    }

    .harmony-strip__swatch {
      flex: 1;
      position: relative;
      transition: flex 0.3s ease;
      cursor: default;
      display: flex;
      align-items: flex-end;
      justify-content: center;
      padding-bottom: 12px;
    }

    .harmony-strip__swatch:hover {
      flex: 1.4;
    }

    .harmony-strip__label {
      font-family: var(--font-mono, ui-monospace, monospace);
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      padding: 4px 8px;
      white-space: nowrap;
      opacity: 0.7;
      transition: opacity 0.2s ease;
      color: var(--ink, #111111);
    }

    .harmony-strip__swatch:hover .harmony-strip__label {
      opacity: 1;
    }

    /* ──── Type Pairing Demo ──── */
    .type-pairing {
      background: var(--bone, #f5f5f5);
      border: 3px solid var(--signal, #3b82f6);
      border-radius: var(--radius-md, 8px);
      padding: 48px 40px;
    }

    .type-pairing__kicker {
      font-family: var(--font-mono, ui-monospace, monospace);
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--signal, #3b82f6);
      margin-bottom: 12px;
    }

    .type-pairing__display {
      font-family: var(--font-display, system-ui, sans-serif);
      font-size: 54px;
      font-weight: 700;
      line-height: 1.1;
      letter-spacing: -0.02em;
      color: var(--ink, #111111);
      margin-bottom: 20px;
    }

    .type-pairing__display span {
      color: var(--signal, #3b82f6);
    }

    .type-pairing__body {
      font-family: var(--font-body, system-ui, sans-serif);
      font-size: 18px;
      font-weight: 400;
      line-height: 1.65;
      color: var(--ink, #111111);
      max-width: 720px;
      margin-bottom: 28px;
    }

    .type-pairing__meta {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 24px;
      padding-top: 16px;
      border-top: 2px solid var(--signal, #3b82f6);
    }

    @media (max-width: 640px) {
      .type-pairing__meta {
        grid-template-columns: 1fr;
      }
    }

    .type-pairing__meta-item {
      font-family: var(--font-mono, ui-monospace, monospace);
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 0.06em;
      color: var(--slate, #666666);
    }

    .type-pairing__meta-label {
      font-weight: 700;
      color: var(--signal, #3b82f6);
      display: block;
      margin-bottom: 4px;
    }

    /* ──── Atmosphere Card ──── */
    .atmosphere-card {
      background: var(--bone, #f5f5f5);
      border: 3px solid var(--signal, #3b82f6);
      border-radius: var(--radius-md, 8px);
      padding: 32px;
      max-width: 840px;
    }

    .atmosphere-card p {
      font-family: var(--font-body, system-ui, sans-serif);
      font-size: 18px;
      font-weight: 400;
      line-height: 1.65;
      color: var(--ink, #111111);
    }

    /* ──── Primary Signal Visual ──── */
    .signal-visual {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 32px;
      margin-top: 24px;
    }

    @media (max-width: 768px) {
      .signal-visual {
        grid-template-columns: 1fr;
      }
    }

    .signal-demo {
      border: 3px solid var(--signal, #3b82f6);
      border-radius: var(--radius-md, 8px);
      aspect-ratio: 16 / 10;
      padding: 40px;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      background: var(--paper, #ffffff);
    }

    .signal-demo__kicker {
      font-family: var(--font-mono, ui-monospace, monospace);
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--signal, #3b82f6);
      margin-bottom: 12px;
    }

    .signal-demo__headline {
      font-family: var(--font-display, system-ui, sans-serif);
      font-size: 40px;
      font-weight: 700;
      line-height: 1.1;
      letter-spacing: -0.02em;
      color: var(--ink, #111111);
      margin-bottom: 0;
    }

    .signal-demo__accent {
      color: var(--signal, #3b82f6);
    }

    .signal-demo__label {
      font-family: var(--font-mono, ui-monospace, monospace);
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--slate, #666666);
      margin-top: 24px;
      padding-top: 16px;
      border-top: 2px solid var(--signal, #3b82f6);
    }

    /* ──── Accent Bar Visual ──── */
    .accent-bar {
      height: 8px;
      background: var(--signal, #3b82f6);
      border-radius: var(--radius-sm, 4px);
      margin: 16px 0;
    }

    /* ──── Motion Demo ──── */
    .motion-demo {
      border: 3px solid var(--signal, #3b82f6);
      border-radius: var(--radius-md, 8px);
      padding: 32px;
      background: var(--bone, #f5f5f5);
    }

    .motion-demo__button {
      display: inline-block;
      padding: var(--button-py, 10px) var(--button-px, 20px);
      background: var(--signal, #3b82f6);
      color: var(--paper, #ffffff);
      border: none;
      border-radius: var(--button-radius, 8px);
      font-family: var(--font-body, system-ui, sans-serif);
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: all 200ms cubic-bezier(0.34, 1.56, 0.64, 1);
      transform: scale(1);
    }

    .motion-demo__button:hover {
      transform: scale(1.08);
      box-shadow: 0 4px 16px rgba(59, 130, 246, 0.3);
    }

    .motion-demo__button:active {
      transform: scale(0.96);
    }

    .motion-demo__description {
      font-family: var(--font-body, system-ui, sans-serif);
      font-size: 16px;
      font-weight: 400;
      line-height: 1.6;
      color: var(--slate, #666666);
      margin-top: 16px;
    }

    /* ──── Loading ──── */
    .loading {
      text-align: center;
      padding: 120px 24px;
      color: var(--slate, #666666);
      font-size: 18px;
      font-family: var(--font-body, system-ui, sans-serif);
    }

    .loading::after {
      content: '';
      display: block;
      width: 32px;
      height: 32px;
      margin: 20px auto 0;
      border: 3px solid var(--border, #e5e5e5);
      border-top-color: var(--signal, #3b82f6);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div class="page" id="app">
    <div class="loading">Loading design tokens…</div>
  </div>

  <script>
    const CORE_COLOR_KEYS = ['paper', 'ink', 'slate', 'signal', 'bone'];

    (window.__DESIGN_TOKENS__ ? Promise.resolve({ ok: true, json: () => Promise.resolve(window.__DESIGN_TOKENS__) }) : fetch('../tokens.json'))
      .then(r => {
        if (!r.ok) throw new Error('tokens.json not found (' + r.status + ')');
        return r.json();
      })
      .then(render)
      .catch(err => {
        document.getElementById('app').innerHTML =
          '<div class="loading" style="color:#3b82f6">' +
          'Could not load tokens.json — ' + err.message + '</div>';
      });

    function render(tokens) {
      const app = document.getElementById('app');
      const colors = tokens.colors || {};
      const meta = tokens.meta || {};

      let html = '';

      /* ──── Header ──── */
      html += '<header class="header">';
      html += '  <div class="header__kicker">Brand Identity</div>';
      html += '  <h1 class="header__title">The <span>Energy</span> of Motion</h1>';
      html += '  <p class="header__subtitle">Bold geometry, thick borders, and vibrant primary blue. A system built for speed and impact, where every element signals interaction.</p>';
      html += '  <hr class="header__rule">';
      html += '</header>';

      /* ──── Atmosphere ──── */
      html += '<div class="section">';
      html += '  <div class="section__label">Atmosphere</div>';
      html += '  <div class="atmosphere-card">';
      html += '    <p>Energetic is graphic. It moves. Thick borders frame everything. Primary blue (#3B82F6) is the hero accent and interaction signal. Components use geometric shapes with rounded corners (8px default). Typography is bold and confident—sans-serif weights push 600–700 across headline and label roles. Motion is purposeful: 150–250ms transitions with spring easing. Hover states scale and glow. Everything breathes with 3px strokes and generous padding. This is a system that says "tap me."</p>';
      html += '  </div>';
      html += '</div>';

      /* ──── Key Characteristics ──── */
      html += '<div class="section">';
      html += '  <div class="section__label">Key Characteristics</div>';
      html += '  <ul class="traits-list">';
      html += '    <li>Primary blue accent (#3B82F6) signals all interaction and emphasis</li>';
      html += '    <li>Thick 3px borders on cards, inputs, and framed content</li>';
      html += '    <li>Bold sans-serif typography: 600–700 weight in headlines and labels</li>';
      html += '    <li>Rounded corners (8px default) give geometric, modern feel</li>';
      html += '    <li>High-contrast color pairing: white paper, dark ink, bright accent</li>';
      html += '    <li>Subtle shadows (2px, 8px blur) for floating elevation</li>';
      html += '    <li>Motion with spring easing: 150–250ms transitions on hover/active</li>';
      html += '    <li>Generous internal padding and spacing (16–32px minimum)</li>';
      html += '    <li>Visual weight comes from borders and scale, not color saturation</li>';
      html += '  </ul>';
      html += '</div>';

      /* ──── Do's and Don'ts ──── */
      html += '<div class="section">';
      html += '  <div class="section__label">Do\'s and Don\'ts</div>';
      html += '  <div class="dd-grid">';

      html += '  <div class="dd-card">';
      html += '    <div class="dd-card__heading dd-card__heading--do">';
      html += '      <span class="dd-card__icon dd-card__icon--do">✓</span> Do';
      html += '    </div>';
      html += '    <ul class="dd-list">';
      html += '      <li>Use 3px borders on cards, modals, and framing elements</li>';
      html += '      <li>Make primary blue (#3B82F6) the hover and active state color</li>';
      html += '      <li>Apply 8px border-radius as the default corner treatment</li>';
      html += '      <li>Use bold weights (600–700) for headlines and call-to-action text</li>';
      html += '      <li>Implement spring easing on interactive transitions (150–250ms)</li>';
      html += '      <li>Scale buttons up on hover (scale: 1.08) with glow shadow</li>';
      html += '      <li>Build hierarchy with size and weight, not color variation</li>';
      html += '      <li>Use geometric shapes: squares, circles, rounded rectangles</li>';
      html += '      <li>Add top borders in accent blue to section headers</li>';
      html += '    </ul>';
      html += '  </div>';

      html += '  <div class="dd-card">';
      html += '    <div class="dd-card__heading dd-card__heading--dont">';
      html += '      <span class="dd-card__icon dd-card__icon--dont">✕</span> Don\'t';
      html += '    </div>';
      html += '    <ul class="dd-list">';
      html += '      <li>Use thin borders (1px) except on subtle dividers</li>';
      html += '      <li>Apply more than one accent color on the same view</li>';
      html += '      <li>Round corners beyond 16px—keep the modern geometry tight</li>';
      html += '      <li>Use light gray text on light gray backgrounds</li>';
      html += '      <li>Add drop shadows without clear elevation purpose</li>';
      html += '      <li>Mix serif and sans-serif in the same headline</li>';
      html += '      <li>Apply motion to every interaction—be selective and purposeful</li>';
      html += '      <li>Use subtle pastels or muted tones—contrast drives recognition</li>';
      html += '      <li>Leave interactive elements without hover or focus indication</li>';
      html += '    </ul>';
      html += '  </div>';

      html += '  </div>';
      html += '</div>';

      /* ──── Primary Signal Visual ──── */
      html += '<div class="section">';
      html += '  <div class="section__label">Primary Signal Color</div>';
      html += '  <p style="font-family: var(--font-body); font-size: 16px; line-height: 1.65; color: var(--slate); margin-bottom: 24px; max-width: 840px;">Blue (#3B82F6) is the interaction hero. It appears on buttons, links, focus states, hover effects, section dividers, and accent bars. One primary signal keeps the visual language coherent and interaction intent crystal clear.</p>';
      html += '  <div class="signal-visual">';

      html += '    <div class="signal-demo">';
      html += '      <div class="signal-demo__kicker">Primary Usage</div>';
      html += '      <div class="signal-demo__headline">Tap the <span class="signal-demo__accent">primary</span> action</div>';
      html += '      <div class="signal-demo__label">Hover: Scale 1.08 + glow shadow</div>';
      html += '    </div>';

      html += '    <div class="signal-demo">';
      html += '      <div style="display: flex; gap: 12px; margin-bottom: 20px;">';
      html += '        <div style="width: 40px; height: 40px; background: var(--signal); border-radius: 8px; border: 3px solid var(--signal);"></div>';
      html += '        <div style="flex: 1;">';
      html += '          <div style="font-family: var(--font-mono); font-size: 11px; font-weight: 600; color: var(--signal); letter-spacing: 0.08em; text-transform: uppercase; margin-bottom: 4px;">Signal Token</div>';
      html += '          <div style="font-family: var(--font-body); font-size: 16px; font-weight: 600; color: var(--ink);">#3B82F6</div>';
      html += '        </div>';
      html += '      </div>';
      html += '      <div class="signal-demo__label">Used on: Buttons, borders, focus rings, hover states</div>';
      html += '    </div>';

      html += '  </div>';
      html += '</div>';

      /* ──── Color Harmony Strip ──── */
      const harmonyKeys = CORE_COLOR_KEYS.filter(k => colors[k]);
      if (harmonyKeys.length) {
        html += '<div class="section">';
        html += '  <div class="section__label">Color Harmony</div>';
        html += '  <div class="harmony-strip">';

        harmonyKeys.forEach(key => {
          const hex = colors[key];
          const lum = relativeLuminance(hex);
          const labelColor = lum > 0.5 ? '#111111' : '#ffffff';
          html += '<div class="harmony-strip__swatch" style="background:' + esc(hex) + '">';
          html += '  <span class="harmony-strip__label" style="color:' + labelColor + '">' + esc(key.toUpperCase()) + '</span>';
          html += '</div>';
        });

        html += '  </div>';
        html += '</div>';
      }

      /* ──── Typography Pairing ──── */
      html += '<div class="section">';
      html += '  <div class="section__label">Typography Pairing</div>';
      html += '  <div class="type-pairing">';

      html += '    <div class="type-pairing__kicker">Display + Body</div>';
      html += '    <div class="type-pairing__display">Bold <span>sans-serif</span> drives every message</div>';

      html += '    <div class="type-pairing__body">Typography sets the energetic pace. Display uses 700-weight sans-serif at large scales (54–72px) with tight line-height. Body text runs 400-weight at 18px for readable paragraphs. Labels and kickers stay 600–700 weight to maintain visual prominence. The weight contrast between body and accent text creates graphic clarity. All typefaces are system sans-serif—modern, fast-loading, universally available.</div>';

      html += '    <div class="type-pairing__meta">';
      html += '      <div class="type-pairing__meta-item">';
      html += '        <span class="type-pairing__meta-label">Display Font</span>';
      html += '        System UI, 700 weight';
      html += '      </div>';
      html += '      <div class="type-pairing__meta-item">';
      html += '        <span class="type-pairing__meta-label">Body Font</span>';
      html += '        System UI, 400 weight';
      html += '      </div>';
      html += '      <div class="type-pairing__meta-item">';
      html += '        <span class="type-pairing__meta-label">Mono Font</span>';
      html += '        UI Monospace, 600 weight';
      html += '      </div>';
      html += '    </div>';
      html += '  </div>';
      html += '</div>';

      /* ──── Motion & Interaction ──── */
      html += '<div class="section">';
      html += '  <div class="section__label">Motion & Interaction</div>';
      html += '  <div class="motion-demo">';
      html += '    <div style="font-family: var(--font-mono); font-size: 13px; font-weight: 600; letter-spacing: 0.14em; text-transform: uppercase; color: var(--signal); margin-bottom: 16px;">Try hovering below</div>';
      html += '    <button class="motion-demo__button">Interact Here</button>';
      html += '    <div class="motion-demo__description">150–250ms spring easing on all transitions. Hover state: scale(1.08) + glow shadow. Active state: scale(0.96) for tactile feedback. All focus indicators use 3px signal-blue borders.</div>';
      html += '  </div>';
      html += '</div>';

      /* ──── Type Ramp Section ──── */
      html += '<div class="section">';
      html += '  <div class="section__label">Type Ramp & Roles</div>';
      html += '  <div style="border: 3px solid var(--signal); border-radius: 8px; padding: 32px; background: var(--paper);">';

      const ramp = [
        { role: 'Hero', size: '96px', weight: '700', lineHeight: '0.95', example: 'Bold statement headline' },
        { role: 'Display', size: '72px', weight: '700', lineHeight: '0.95', example: 'Major headline' },
        { role: 'Headline', size: '54px', weight: '700', lineHeight: '1.10', example: 'Section heading' },
        { role: 'Subhead', size: '36px', weight: '700', lineHeight: '1.10', example: 'Subsection title' },
        { role: 'Lead', size: '28px', weight: '600', lineHeight: '1.35', example: 'Intro paragraph' },
        { role: 'Body', size: '18px', weight: '400', lineHeight: '1.65', example: 'Main paragraph text for reading flow' },
        { role: 'Label', size: '16px', weight: '600', lineHeight: '1.35', example: 'Button text and field labels' },
