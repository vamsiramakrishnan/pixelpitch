<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Color Palette — Cursor</title>
  <link rel="stylesheet" href="../colors_and_type.css">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: var(--font-body, system-ui, sans-serif);
      background: var(--paper, #f2f1ed);
      color: var(--ink, #26251e);
      line-height: 1.6;
      padding: 0;
    }

    .page {
      max-width: 1200px;
      margin: 0 auto;
      padding: 64px 32px;
    }

    /* Header / Stage head */
    .header {
      margin-bottom: 72px;
      border-bottom: 1px solid var(--ink, #26251e);
      padding-bottom: 32px;
    }

    .header__kicker {
      font-family: var(--font-mono, ui-monospace, monospace);
      font-size: 12px;
      font-weight: 500;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--slate, #666666);
      margin-bottom: 16px;
    }

    .header__title {
      font-family: var(--font-display, system-ui, sans-serif);
      font-size: 72px;
      font-weight: 400;
      line-height: 0.95;
      letter-spacing: -2.16px;
      color: var(--ink, #26251e);
      margin-bottom: 12px;
    }

    .header__subtitle {
      font-family: var(--font-body, system-ui, sans-serif);
      font-size: 19.2px;
      line-height: 1.5;
      color: var(--slate, #666666);
      max-width: 720px;
      margin-bottom: 20px;
    }

    .header__meta {
      font-family: var(--font-mono, ui-monospace, monospace);
      font-size: 11px;
      font-weight: 500;
      letter-spacing: 0.06em;
      color: var(--slate, #666666);
      text-transform: uppercase;
    }

    /* Section labels */
    .section-label {
      font-family: var(--font-mono, ui-monospace, monospace);
      font-size: 11px;
      font-weight: 500;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--slate, #666666);
      margin-bottom: 28px;
      padding-bottom: 12px;
      border-bottom: 1px solid rgba(38, 37, 30, 0.1);
    }

    /* Swatch grid */
    .swatch-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
      gap: 20px;
      margin-bottom: 64px;
    }

    .swatch {
      background: var(--paper, #f2f1ed);
      border: 1px solid rgba(38, 37, 30, 0.1);
      border-radius: var(--radius-md, 8px);
      overflow: hidden;
      transition: border-color 0.2s ease, box-shadow 0.2s ease;
    }

    .swatch:hover {
      border-color: var(--signal, #f54e00);
      box-shadow: 0 4px 16px rgba(245, 78, 0, 0.12);
    }

    .swatch__chip {
      width: 100%;
      aspect-ratio: 4 / 3;
      position: relative;
    }

    .swatch__chip-contrast {
      position: absolute;
      bottom: 10px;
      right: 12px;
      font-family: var(--font-mono, ui-monospace, monospace);
      font-size: 10px;
      font-weight: 600;
      padding: 3px 10px;
      border-radius: var(--radius-full, 9999px);
      line-height: 1.4;
      text-transform: uppercase;
    }

    .swatch__meta {
      padding: 18px 18px 20px;
    }

    .swatch__var {
      font-family: var(--font-mono, ui-monospace, monospace);
      font-size: 11px;
      font-weight: 500;
      color: var(--ink, #26251e);
      word-break: break-all;
      margin-bottom: 6px;
      letter-spacing: 0.02em;
    }

    .swatch__hex {
      font-family: var(--font-mono, ui-monospace, monospace);
      font-size: 10px;
      color: var(--slate, #666666);
      margin-bottom: 8px;
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }

    .swatch__role {
      font-family: var(--font-body, system-ui, sans-serif);
      font-size: 14px;
      line-height: 1.4;
      color: var(--ink, #26251e);
      margin-bottom: 8px;
    }

    .swatch__contrast-label {
      font-family: var(--font-mono, ui-monospace, monospace);
      font-size: 10px;
      font-weight: 500;
      margin-top: 8px;
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }

    .contrast-pass { color: #1f8a65; }
    .contrast-fail { color: #cf2d56; }
    .contrast-aa-large { color: #c08532; }

    /* Chip contrast badge styling */
    .chip-badge {
      border-radius: var(--radius-full, 9999px);
      font-weight: 600;
      display: inline-block;
    }

    /* Timeline / Feature Colors Section */
    .timeline-section {
      margin-bottom: 64px;
      padding: 40px;
      background: rgba(230, 229, 224, 0.5);
      border: 1px solid rgba(38, 37, 30, 0.1);
      border-radius: var(--radius-md, 8px);
    }

    .timeline-section h2 {
      font-family: var(--font-display, system-ui, sans-serif);
      font-size: 36px;
      font-weight: 400;
      line-height: 1.2;
      letter-spacing: -0.72px;
      color: var(--ink, #26251e);
      margin-bottom: 16px;
    }

    .timeline-section p {
      font-family: var(--font-body, system-ui, sans-serif);
      font-size: 16px;
      line-height: 1.5;
      color: var(--ink, #26251e);
      margin-bottom: 24px;
      max-width: 720px;
    }

    .timeline-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 16px;
      margin-top: 24px;
    }

    .timeline-card {
      padding: 16px;
      background: var(--paper, #f2f1ed);
      border: 1px solid rgba(38, 37, 30, 0.1);
      border-radius: var(--radius-md, 8px);
      text-align: center;
    }

    .timeline-card__swatch {
      width: 100%;
      height: 60px;
      border-radius: var(--radius-sm, 2px);
      margin-bottom: 12px;
    }

    .timeline-card__label {
      font-family: var(--font-body, system-ui, sans-serif);
      font-size: 13px;
      font-weight: 500;
      color: var(--ink, #26251e);
      margin-bottom: 4px;
    }

    .timeline-card__hex {
      font-family: var(--font-mono, ui-monospace, monospace);
      font-size: 10px;
      color: var(--slate, #666666);
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }

    /* Usage pattern section */
    .usage-section {
      margin-bottom: 64px;
      padding: 40px;
      background: rgba(230, 229, 224, 0.5);
      border: 1px solid rgba(38, 37, 30, 0.1);
      border-radius: var(--radius-md, 8px);
    }

    .usage-section h2 {
      font-family: var(--font-display, system-ui, sans-serif);
      font-size: 36px;
      font-weight: 400;
      line-height: 1.2;
      letter-spacing: -0.72px;
      color: var(--ink, #26251e);
      margin-bottom: 16px;
    }

    .usage-section p {
      font-family: var(--font-body, system-ui, sans-serif);
      font-size: 16px;
      line-height: 1.5;
      color: var(--ink, #26251e);
      margin-bottom: 24px;
      max-width: 720px;
    }

    .rule-of-one {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 32px;
      margin-top: 32px;
      align-items: start;
    }

    .rule-example {
      padding: 24px;
      background: var(--paper, #f2f1ed);
      border: 2px solid rgba(38, 37, 30, 0.1);
      border-radius: var(--radius-md, 8px);
    }

    .rule-example h3 {
      font-family: var(--font-display, system-ui, sans-serif);
      font-size: 22px;
      font-weight: 400;
      line-height: 1.3;
      letter-spacing: -0.11px;
      color: var(--ink, #26251e);
      margin-bottom: 12px;
    }

    .rule-example p {
      font-family: var(--font-body, system-ui, sans-serif);
      font-size: 14px;
      line-height: 1.6;
      color: var(--slate, #666666);
      margin-bottom: 0;
    }

    .correct {
      border: 2px solid #1f8a65 !important;
    }

    .correct::before {
      content: '✓ CORRECT';
      display: block;
      font-family: var(--font-mono, ui-monospace, monospace);
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 0.12em;
      color: #1f8a65;
      text-transform: uppercase;
      margin-bottom: 12px;
      padding-bottom: 12px;
      border-bottom: 1px solid #1f8a65;
    }

    .incorrect {
      border: 2px solid #cf2d56 !important;
    }

    .incorrect::before {
      content: '✗ INCORRECT';
      display: block;
      font-family: var(--font-mono, ui-monospace, monospace);
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 0.12em;
      color: #cf2d56;
      text-transform: uppercase;
      margin-bottom: 12px;
      padding-bottom: 12px;
      border-bottom: 1px solid #cf2d56;
    }

    .signal-demo {
      font-size: 16px;
      line-height: 1.6;
    }

    .signal-demo .drop-cap {
      font-family: var(--font-display, system-ui, sans-serif);
      font-size: 64px;
      font-weight: 400;
      color: var(--signal, #f54e00);
      float: left;
      line-height: 0.75;
      padding-right: 8px;
      margin-top: 2px;
      letter-spacing: -2.16px;
    }

    .signal-demo em {
      color: var(--signal, #f54e00);
      font-style: italic;
    }

    /* Surface Scale Section */
    .surface-section {
      margin-bottom: 64px;
      padding: 40px;
      background: rgba(230, 229, 224, 0.5);
      border: 1px solid rgba(38, 37, 30, 0.1);
      border-radius: var(--radius-md, 8px);
    }

    .surface-section h2 {
      font-family: var(--font-display, system-ui, sans-serif);
      font-size: 36px;
      font-weight: 400;
      line-height: 1.2;
      letter-spacing: -0.72px;
      color: var(--ink, #26251e);
      margin-bottom: 16px;
    }

    .surface-section p {
      font-family: var(--font-body, system-ui, sans-serif);
      font-size: 16px;
      line-height: 1.5;
      color: var(--ink, #26251e);
      margin-bottom: 24px;
      max-width: 720px;
    }

    .surface-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 16px;
    }

    .surface-demo {
      padding: 24px;
      border-radius: var(--radius-md, 8px);
      border: 1px solid rgba(38, 37, 30, 0.1);
    }

    .surface-demo__label {
      font-family: var(--font-mono, ui-monospace, monospace);
      font-size: 11px;
      font-weight: 500;
      text-transform: uppercase;
      color: var(--slate, #666666);
      margin-bottom: 8px;
      letter-spacing: 0.04em;
    }

    .surface-demo__hex {
      font-family: var(--font-mono, ui-monospace, monospace);
      font-size: 10px;
      color: var(--slate, #666666);
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }

    /* WCAG summary */
    .wcag-summary {
      margin-top: 64px;
      padding: 40px;
      background: rgba(230, 229, 224, 0.5);
      border: 1px solid rgba(38, 37, 30, 0.1);
      border-radius: var(--radius-md, 8px);
    }

    .wcag-summary h2 {
      font-family: var(--font-display, system-ui, sans-serif);
      font-size: 36px;
      font-weight: 400;
      line-height: 1.2;
      letter-spacing: -0.72px;
      margin-bottom: 16px;
      color: var(--ink, #26251e);
    }

    .wcag-summary p {
      font-family: var(--font-body, system-ui, sans-serif);
      font-size: 16px;
      line-height: 1.5;
      color: var(--slate, #666666);
      margin-bottom: 24px;
    }

    .wcag-row {
      display: flex;
      align-items: center;
      gap: 16px;
      padding: 12px 0;
      border-bottom: 1px solid rgba(38, 37, 30, 0.1);
      font-family: var(--font-body, system-ui, sans-serif);
      font-size: 14px;
    }

    .wcag-row:last-child { border-bottom: none; }

    .wcag-badge {
      display: inline-block;
      padding: 4px 12px;
      border-radius: var(--radius-full, 9999px);
      font-family: var(--font-mono, ui-monospace, monospace);
      font-size: 10px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      min-width: 80px;
      text-align: center;
    }

    .wcag-badge--pass { background: #1f8a65; color: white; }
    .wcag-badge--fail { background: #cf2d56; color: white; }
    .wcag-badge--aa-large { background: #c08532; color: white; }

    /* Loading state */
    .loading {
      text-align: center;
      padding: 80px 24px;
      color: var(--slate, #666666);
      font-family: var(--font-body, system-ui, sans-serif);
      font-size: 16px;
    }

    .loading::after {
      content: '';
      display: block;
      width: 32px;
      height: 32px;
      margin: 24px auto 0;
      border: 2px solid var(--slate, #666666);
      border-top-color: var(--signal, #f54e00);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    /* Responsive */
    @media (max-width: 768px) {
      .page { padding: 48px 20px; }
      .header { padding-bottom: 24px; margin-bottom: 48px; }
      .header__title { font-size: 48px; letter-spacing: -1.44px; }
      .swatch-grid { grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 12px; }
      .rule-of-one { grid-template-columns: 1fr; gap: 16px; }
      .usage-section { padding: 24px; }
      .timeline-section { padding: 24px; }
      .surface-section { padding: 24px; }
    }
  </style>
</head>
<body>
  <div class="page" id="app">
    <div class="loading">Loading design tokens&hellip;</div>
  </div>

  <script>
    /* ───────────────────────────────────────────────────────────── */
    /* Contrast ratio calculation (WCAG 2.1 relative luminance)      */
    /* ───────────────────────────────────────────────────────────── */
    function hexToRgb(hex) {
      hex = hex.replace(/^#/, '');
      if (hex.length === 3) hex = hex.split('').map(c => c + c).join('');
      const n = parseInt(hex, 16);
      return [(n >> 16) & 255, (n >> 8) & 255, n & 255];
    }

    function luminance([r, g, b]) {
      const [rs, gs, bs] = [r, g, b].map(c => {
        c /= 255;
        return c <= 0.03928 ? c / 12.92 : Math.pow((c + 0.055) / 1.055, 2.4);
      });
      return 0.2126 * rs + 0.7152 * gs + 0.0722 * bs;
    }

    function contrastRatio(hex1, hex2) {
      const l1 = luminance(hexToRgb(hex1));
      const l2 = luminance(hexToRgb(hex2));
      const lighter = Math.max(l1, l2);
      const darker = Math.min(l1, l2);
      return (lighter + 0.05) / (darker + 0.05);
    }

    function wcagLevel(ratio) {
      if (ratio >= 7) return { label: 'AAA', cls: 'pass' };
      if (ratio >= 4.5) return { label: 'AA', cls: 'pass' };
      if (ratio >= 3) return { label: 'AA Large', cls: 'aa-large' };
      return { label: 'Fail', cls: 'fail' };
    }

    /* ───────────────────────────────────────────────────────────── */
    /* Core color roles and descriptions                             */
    /* ───────────────────────────────────────────────────────────── */
    const CORE_ROLES = {
      paper:  'Page background. Warm off-white cream tone.',
      ink:    'Primary text and headings. Warm near-black with yellow undertone.',
      slate:  'Secondary text, captions, muted UI elements.',
      signal: 'Brand accent. Vibrant red-orange for CTAs and highlights.',
      bone:   'Secondary surface. Slightly warmer card backgrounds.',
    };

    const EXTENDED_ROLES = {
      'pure-white': 'Pure white. Minimal use for maximum contrast.',
      'true-black': 'True black. Code and console contexts only.',
      'gold': 'Warm gold. Premium or highlighted secondary accent.',
      'error': 'Error state. Warm crimson-rose.',
      'success': 'Success state. Muted teal-green.',
    };

    const SURFACE_ROLES = {
      'surface-100': 'Lightest button surface. Barely tinted.',
      'surface-300': 'Button default background. Subtle emphasis.',
      'surface-500': 'Tertiary surface. Deeper emphasis.',
    };

    const TIMELINE_ROLES = {
      'thinking': 'AI thinking state. Warm peach tone.',
      'grep': 'Search/grep operations. Soft sage green.',
      'read': 'File reading state. Soft blue tone.',
      'edit': 'Editing operations. Soft lavender.',
    };

    /* ───────────────────────────────────────────────────────────── */
    /* Render from tokens.json                                       */
    /* ───────────────────────────────────────────────────────────── */
    (window.__DESIGN_TOKENS__ 
      ? Promise.resolve({ ok: true, json: () => Promise.resolve(window.__DESIGN_TOKENS__) }) 
      : fetch('../tokens.json'))
      .then(r => {
        if (!r.ok) throw new Error('tokens.json not found (' + r.status + ')');
        return r.json();
      })
      .then(render)
      .catch(err => {
        document.getElementById('app').innerHTML =
          '<div class="loading" style="color:var(--signal,#f54e00)">' +
          'Could not load tokens.json — ' + err.message + '</div>';
      });

    function render(tokens) {
      const app = document.getElementById('app');
      const title = tokens.meta?.title || 'Design System';
      const summary = tokens.meta?.summary || '';
      const rawColors = tokens.colors || {};
      const paperHex = rawColors.paper || '#f2f1ed';

      /* Flatten nested color structure */
      const colors = {};
      for (const [k, v] of Object.entries(rawColors)) {
        if (typeof v === 'string') {
          colors[k] = v;
        } else if (v && typeof v === 'object') {
          for (const [sk, sv] of Object.entries(v)) {
            if (typeof sv === 'string') colors[k + '-' + sk] = sv;
          }
        }
      }

      /* Split core, extended, surface, and timeline */
      const coreKeys = Object.keys(CORE_ROLES).filter(k => colors[k]);
      const extendedKeys = Object.keys(EXTENDED_ROLES).filter(k => colors[k]);
      const surfaceKeys = Object.keys(SURFACE_ROLES).filter(k => colors[k]);
      const timelineKeys = Object.keys(TIMELINE_ROLES).filter(k => colors[k]);

      let html = '';

      /* ─ Stage head header ─ */
      html += '<header class="header">';
      html += '  <div class="header__kicker">Design System</div>';
      html += '  <h1 class="header__title">' + esc(title) + '</h1>';
      html += '  <p class="header__subtitle">' + esc(summary) + '</p>';
      html += '  <div class="header__meta">Color Palette &mdash; ' + (coreKeys.length + extendedKeys.length + surfaceKeys.length + timelineKeys.length) + ' Tokens</div>';
      html += '</header>';

      /* ─ Core Palette ─ */
      if (coreKeys.length) {
        html += '<div class="section-label">Core Palette</div>';
        html += '<div class="swatch-grid">';
        coreKeys.forEach(key => {
          html += swatchCard(key, colors[key], paperHex, CORE_ROLES[key]);
        });
        html += '</div>';
      }

      /* ─ Extended Palette ─ */
      if (extendedKeys.length) {
        html += '<div class="section-label">Extended Palette</div>';
        html += '<div class="swatch-grid">';
        extendedKeys.forEach(key => {
          html += swatchCard(key, colors[key], paperHex, EXTENDED_ROLES[key]);
        });
        html += '</div>';
      }

      /* ─ Surface Scale ─ */
      if (surfaceKeys.length) {
        html += surfaceScaleSection(colors, surfaceKeys, SURFACE_ROLES);
      }

      /* ─ Timeline / Feature Colors ─ */
      if (timelineKeys.length) {
        html += timelineSection(colors, timelineKeys, TIMELINE_ROLES);
      }

      /* ─ Rule of One ─ */
      html += ruleOfOneSection(paperHex);

      /* ─ WCAG Summary ─ */
      html += wcagSummary(colors, paperHex);

      app.innerHTML = html;
    }

    /* ───────────────────────────────────────────────────────────── */
    /* Swatch card builder                                           */
    /* ───────────────────────────────────────────────────────────── */
    function swatchCard(key, hex, paperHex, role) {
      const ratio = contrastRatio(hex, paperHex);
      const level = wcagLevel(ratio);
      const lum = luminance(hexToRgb(hex));
      const chipTextColor = lum > 0.4 ? '#26251e' : '#f2f1ed';
      const chipBadgeBg = lum > 0.4 ? 'rgba(38, 37, 30, 0.15)' : 'rgba(242, 241, 237, 0.25)';

      return '' +
        '<div class="swatch">' +
        '  <div class="swatch__chip" style="background:' + hex + '">' +
        '    <span class="swatch__chip-contrast chip-badge" style="color:' + chipTextColor +
             ';background:' + chipBadgeBg + '">' + ratio.toFixed(2) + ':1</span>' +
        '  </div>' +
        '  <div class="swatch__meta">' +
        '    <div class="swatch__var">--' + esc(key) + '</div>' +
        '    <div class="swatch__hex">' + esc(hex.toUpperCase()) + '</div>' +
        '    <div class="swatch__role">' + esc(role) + '</div>' +
        '    <div class="swatch__contrast-label contrast-' + level.cls + '">' +
             'WCAG ' + level.label + '</div>' +
        '  </div>' +
        '</div>';
    }

    /* ───────────────────────────────────────────────────────────── */
    /* Surface scale section                                         */
    /* ───────────────────────────────────────────────────────────── */
    function surfaceScaleSection(colors, keys, roles) {
      let html = '<section class="surface-section">';
      html += '<h2>Surface Scale</h2>';
      html += '<p>A carefully calibrated progression from lightest to darkest surfaces. Used for buttons, cards, and panel backgrounds to create hierarchy and visual breathing room.</p>';
      html += '<div class="surface-grid">';
      
      keys.forEach(key => {
        const hex = colors[key];
        html += '<div class="surface-demo" style="background:' + hex + '">';
        html += '  <div class="surface-demo__label">' + esc(key) + '</div>';
        html += '  <div class="surface-demo__hex">' + esc(hex.toUpperCase()) + '</div>';
        html += '</div>';
      });
      
      html += '</div>';
      html += '</section>';
      return html;
    }

    /* ───────────────────────────────────────────────────────────── */
    /* Timeline / Feature Colors section                             */
    /* ───────────────────────────────────────────────────────────── */
    function timelineSection(colors, keys, roles) {
      let html = '<section class="timeline-section">';
      html += '<h2>AI Timeline & Operations</h2>';
      html += '<p>Semantic colors for AI state indicators and operation types. Each tone conveys its function: thinking (warm peach), searching (sage), reading (cool blue), editing (soft lavender).</p>';
      html += '<div class="timeline-grid">';
      
      keys.forEach(key => {
        const hex = colors[key];
        html += '<div class="timeline-card">';
        html += '  <div class="timeline-card__swatch" style="background:' + hex + '"></div>';
        html += '  <div class="timeline-card__label">' + esc(key.charAt(0).toUpperCase() + key.slice(1)) + '</div>';
