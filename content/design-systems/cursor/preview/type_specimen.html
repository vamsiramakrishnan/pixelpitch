<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Type Specimen — Cursor</title>
  <link rel="stylesheet" href="../colors_and_type.css">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: var(--font-body, 'system-ui', sans-serif);
      background: var(--paper, #f2f1ed);
      color: var(--ink, #26251e);
      line-height: 1.6;
    }

    .page {
      max-width: 1100px;
      margin: 0 auto;
      padding: 96px 48px;
    }

    @media (max-width: 768px) {
      .page {
        padding: 64px 32px;
      }
    }

    @media (max-width: 480px) {
      .page {
        padding: 48px 24px;
      }
    }

    /* Header */
    .header {
      margin-bottom: 96px;
    }

    .header__kicker {
      font-family: var(--font-mono, 'ui-monospace', monospace);
      font-size: 12px;
      font-weight: 500;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--slate, #666666);
      margin-bottom: 16px;
    }

    .header__title {
      font-family: var(--font-body, 'system-ui', sans-serif);
      font-size: 72px;
      font-weight: 400;
      line-height: 1.10;
      letter-spacing: -2.16px;
      color: var(--ink, #26251e);
      margin-bottom: 24px;
    }

    .header__subtitle {
      font-family: var(--font-body, 'system-ui', sans-serif);
      font-size: 19.2px;
      font-weight: 500;
      line-height: 1.50;
      color: var(--ink, #26251e);
      max-width: 680px;
      margin-bottom: 32px;
    }

    .header__rule {
      display: block;
      width: 96px;
      height: 1px;
      background: var(--ink, #26251e);
      border: none;
      margin: 0;
    }

    /* Font families section */
    .font-families {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 32px;
      margin-bottom: 96px;
      margin-top: 64px;
    }

    .font-card {
      background: transparent;
      border: 1px solid var(--border, #e5e5e5);
      border-radius: 0;
      padding: 32px;
    }

    .font-card__label {
      font-family: var(--font-mono, 'ui-monospace', monospace);
      font-size: 11px;
      font-weight: 500;
      letter-spacing: 0.048px;
      text-transform: uppercase;
      color: var(--slate, #666666);
      margin-bottom: 12px;
    }

    .font-card__name {
      font-family: var(--font-body, 'system-ui', sans-serif);
      font-size: 26px;
      font-weight: 400;
      line-height: 1.25;
      letter-spacing: -0.325px;
      color: var(--ink, #26251e);
      margin-bottom: 8px;
    }

    .font-card__fallback {
      font-family: var(--font-mono, 'ui-monospace', monospace);
      font-size: 11px;
      color: var(--slate, #666666);
      word-break: break-word;
    }

    /* Character set block */
    .charmap-block {
      background: transparent;
      border: 1px solid var(--border, #e5e5e5);
      border-radius: 0;
      padding: 48px;
      margin-bottom: 96px;
    }

    .charmap-block__label {
      font-family: var(--font-mono, 'ui-monospace', monospace);
      font-size: 11px;
      font-weight: 500;
      letter-spacing: 0.048px;
      text-transform: uppercase;
      color: var(--slate, #666666);
      margin-bottom: 24px;
    }

    .charmap-block__chars {
      font-family: var(--font-body, 'system-ui', sans-serif);
      font-size: 26px;
      font-weight: 400;
      line-height: 1.80;
      letter-spacing: -0.325px;
      color: var(--ink, #26251e);
      word-break: break-word;
    }

    /* Section label */
    .section-label {
      font-family: var(--font-mono, 'ui-monospace', monospace);
      font-size: 11px;
      font-weight: 500;
      letter-spacing: 0.048px;
      text-transform: uppercase;
      color: var(--slate, #666666);
      margin-bottom: 32px;
      padding-bottom: 16px;
      border-bottom: 1px solid var(--ink, #26251e);
    }

    /* Ramp row */
    .ramp-row {
      display: grid;
      grid-template-columns: 280px 1fr;
      gap: 48px;
      align-items: baseline;
      padding: 32px 0;
      border-bottom: 1px solid var(--border, #e5e5e5);
    }

    .ramp-row:last-child {
      border-bottom: none;
    }

    @media (max-width: 800px) {
      .ramp-row {
        grid-template-columns: 1fr;
        gap: 16px;
      }
    }

    /* Left meta column */
    .ramp-meta__role {
      font-family: var(--font-body, 'system-ui', sans-serif);
      font-size: 16px;
      font-weight: 400;
      color: var(--ink, #26251e);
      margin-bottom: 8px;
    }

    .ramp-meta__detail {
      font-family: var(--font-mono, 'ui-monospace', monospace);
      font-size: 11px;
      font-weight: 400;
      line-height: 1.67;
      color: var(--slate, #666666);
      letter-spacing: 0;
      white-space: pre-wrap;
      word-break: break-word;
    }

    /* Right sample column */
    .ramp-sample {
      color: var(--ink, #26251e);
      overflow-wrap: break-word;
      word-spacing: 0.1em;
    }

    /* Ramp section */
    .ramp-section {
      margin-bottom: 96px;
    }

    /* Drop cap demo */
    .dropcap-demo {
      margin-bottom: 96px;
    }

    .dropcap-demo__label {
      font-family: var(--font-mono, 'ui-monospace', monospace);
      font-size: 11px;
      font-weight: 500;
      letter-spacing: 0.048px;
      text-transform: uppercase;
      color: var(--slate, #666666);
      margin-bottom: 32px;
      padding-bottom: 16px;
      border-bottom: 1px solid var(--ink, #26251e);
    }

    .dropcap-container {
      background: transparent;
      border: 1px solid var(--border, #e5e5e5);
      border-radius: 0;
      padding: 48px;
      max-width: 680px;
    }

    .dropcap-para {
      font-family: var(--font-body, 'system-ui', sans-serif);
      font-size: 19.2px;
      font-weight: 500;
      line-height: 1.50;
      color: var(--ink, #26251e);
      margin: 0;
      text-align: left;
    }

    .dropcap {
      float: left;
      font-family: var(--font-body, 'system-ui', sans-serif);
      font-size: 128px;
      font-weight: 400;
      line-height: 0.85;
      letter-spacing: -2.16px;
      color: var(--signal, #f54e00);
      margin-right: 12px;
      margin-top: -8px;
    }

    /* Loading */
    .loading {
      text-align: center;
      padding: 160px 48px;
      color: var(--slate, #666666);
      font-family: var(--font-body, 'system-ui', sans-serif);
      font-size: 16px;
    }

    .loading::after {
      content: '';
      display: block;
      width: 32px;
      height: 32px;
      margin: 24px auto 0;
      border: 2px solid var(--border, #e5e5e5);
      border-top-color: var(--signal, #f54e00);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div class="page" id="app">
    <div class="loading">Loading design tokens&hellip;</div>
  </div>

  <script>
    const EDITORIAL_SAMPLES = [
      'Cursor is the AI code editor that rewrites with you.',
      'AI-native tools demand precise, compressed typography.',
      'Every keystroke counts. Every character speaks.',
      'The editor is the interface. The interface is the medium.',
      'Speed and clarity converge in compressed gothic letterforms.',
      'Whitespace is processing power. Design is ruthless.',
      'Code editors think in layers. So does our typography.',
      'Machine learning needs human-readable design systems.',
      'The future of coding is collaborative and augmented.',
      'Precision engineering meets editorial warmth.',
    ];

    const DROPCAP_TEXT = 'Cursor\'s typographic system is engineered for developers and AI collaborators. Three distinct voices—compressed gothic for display precision, warm serif for editorial passages, monospace for code—work in concert across marketing sites, product interfaces, and documentation. The display font CursorGothic uses aggressive negative letter-spacing at large sizes (-2.16px at 72px, -0.72px at 36px) to create a sense of engineered compression, as if the letterforms are under tension. jjannon serif provides literary counterpoint, especially when paired with contextual swash alternates. berkeleyMono grounds the system in code editor identity. This is not decorative typography. Every font choice, every tracking value, every weight serves a precise communicative purpose. The warm off-white canvas (#f2f1ed) and near-black ink (#26251e) create an atmosphere of craft and precision, befitting a tool built for the most demanding users.';

    fetch('../tokens.json')
      .then(r => {
        if (!r.ok) throw new Error('tokens.json not found (' + r.status + ')');
        return r.json();
      })
      .then(render)
      .catch(err => {
        document.getElementById('app').innerHTML =
          '<div class="loading" style="color:#f54e00">' +
          'Could not load tokens.json — ' + err.message + '</div>';
      });

    function render(tokens) {
      const app = document.getElementById('app');
      const title = tokens.meta?.title || 'Design System';
      const summary = tokens.meta?.summary || '';

      const ramp = tokens.typography?.ramp || [];

      let html = '';

      /* Header */
      html += '<header class="header">';
      html += '  <div class="header__kicker">Type Specimen</div>';
      html += '  <h1 class="header__title">' + esc(title) + '</h1>';
      html += '  <p class="header__subtitle">' + esc(summary) + '</p>';
      html += '  <hr class="header__rule">';
      html += '</header>';

      /* Font families */
      const families = [
        { label: 'Display', name: 'CursorGothic', fallback: 'system-ui, -apple-system, Helvetica Neue, Arial' },
        { label: 'Body', name: 'jjannon', fallback: 'Iowan Old Style, Palatino Linotype, Georgia, Times New Roman' },
        { label: 'Monospace', name: 'berkeleyMono', fallback: 'ui-monospace, Menlo, Monaco, Consolas' },
        { label: 'System UI', name: 'system-ui', fallback: '-apple-system, Segoe UI, Helvetica Neue, Arial' }
      ];

      html += '<div class="font-families">';
      families.forEach(f => {
        html += '<div class="font-card">';
        html += '  <div class="font-card__label">' + esc(f.label) + '</div>';
        html += '  <div class="font-card__name">' + esc(f.name) + '</div>';
        html += '  <div class="font-card__fallback">' + esc(f.fallback) + '</div>';
        html += '</div>';
      });
      html += '</div>';

      /* Character set */
      html += '<div class="charmap-block">';
      html += '  <div class="charmap-block__label">Character Set</div>';
      html += '  <div class="charmap-block__chars">';
      html += '    AaBbCcDdEeFfGgHhIiJjKkLlMmNnOoPpQqRrSsTtUuVvWwXxYyZz<br>';
      html += '    0123456789 !@#$%&amp;*()&ndash;&mdash;&lsquo;&rsquo;&ldquo;&rdquo;';
      html += '  </div>';
      html += '</div>';

      /* Type ramp */
      if (ramp.length) {
        html += '<div class="ramp-section">';
        html += '<div class="section-label">Type Ramp</div>';
        ramp.forEach((entry, i) => {
          html += rampRow(entry, i);
        });
        html += '</div>';
      }

      /* Drop cap demo */
      html += '<div class="dropcap-demo">';
      html += '<div class="dropcap-demo__label">Drop Cap — CursorGothic Display with Signal Orange</div>';
      html += '<div class="dropcap-container">';
      const firstChar = DROPCAP_TEXT.charAt(0);
      const restText = DROPCAP_TEXT.substring(1);
      html += '<p class="dropcap-para">';
      html += '<span class="dropcap">' + esc(firstChar) + '</span>';
      html += esc(restText);
      html += '</p>';
      html += '</div>';
      html += '</div>';

      app.innerHTML = html;
    }

    function rampRow(entry, idx) {
      const role = entry.role || 'Role ' + (idx + 1);
      const size = entry.size || '16px';
      const weight = entry.weight || 400;
      const lh = entry.lineHeight || '1.5';
      const ls = entry.letterSpacing || '0';

      let fontFamily = 'var(--font-body)';
      if (entry.fontKey === 'display') fontFamily = 'var(--font-display)';
      else if (entry.fontKey === 'mono') fontFamily = 'var(--font-mono)';

      const sizeNum = parseFloat(size);
      const sampleIdx = idx % EDITORIAL_SAMPLES.length;
      let sample = EDITORIAL_SAMPLES[sampleIdx];

      /* Truncate very large samples */
      if (sizeNum >= 72) {
        sample = sample.split('.')[0].slice(0, 40);
        if (!sample.endsWith('.')) sample += '.';
      }

      let fontStyle = 'font-size:' + size + ';font-weight:' + weight + ';line-height:' + lh + ';';
      fontStyle += 'font-family:' + fontFamily + ';';
      if (ls && ls !== '0' && ls !== 'normal') fontStyle += 'letter-spacing:' + ls + ';';

      let meta = esc(size) + ' / ' + esc(String(weight));
      meta += '\n' + fontFamilyLabel(entry.fontKey);
      meta += '\nline-height: ' + esc(String(lh));
      if (ls && ls !== '0' && ls !== 'normal') meta += '\nletter-spacing: ' + esc(ls);

      return '' +
        '<div class="ramp-row">' +
        '  <div class="ramp-meta">' +
        '    <div class="ramp-meta__role">' + esc(role) + '</div>' +
        '    <pre class="ramp-meta__detail">' + meta + '</pre>' +
        '  </div>' +
        '  <div class="ramp-sample" style="' + fontStyle + '">' + esc(sample) + '</div>' +
        '</div>';
    }

    function fontFamilyLabel(key) {
      const map = {
        'display': 'system-ui',
        'body': 'system-ui',
        'mono': 'ui-monospace'
      };
      return map[key] || 'Unknown';
    }

    function esc(s) {
      const d = document.createElement('div');
      d.textContent = String(s);
      return d.innerHTML;
    }
  </script>
</body>
</html>
