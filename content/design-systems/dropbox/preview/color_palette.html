<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Color Palette — Dropbox</title>
  <link rel="stylesheet" href="../colors_and_type.css">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: var(--font-body, 'Sharp Grotesk', sans-serif);
      background: var(--paper, #ffffff);
      color: var(--ink, #0061ff);
      line-height: 1.6;
      padding: 0;
    }

    .page {
      max-width: 1400px;
      margin: 0 auto;
      padding: 80px 48px;
    }

    /* Header / Stage head */
    .header {
      margin-bottom: 96px;
      border-bottom: 1px solid var(--color-border-default, #e2e0de);
      padding-bottom: 48px;
    }

    .header__kicker {
      font-family: var(--font-body, 'Sharp Grotesk', sans-serif);
      font-size: 12px;
      font-weight: 500;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--slate, #8c8c8c);
      margin-bottom: 16px;
    }

    .header__title {
      font-family: var(--font-display, 'Sharp Grotesk', sans-serif);
      font-size: 64px;
      font-weight: 600;
      line-height: 1.1;
      letter-spacing: -0.7px;
      color: var(--color-black, #1e1919);
      margin-bottom: 12px;
    }

    .header__subtitle {
      font-family: var(--font-body, 'Sharp Grotesk', sans-serif);
      font-size: 20px;
      line-height: 1.5;
      color: var(--color-dark-gray, #3d3b39);
      max-width: 800px;
      margin-bottom: 24px;
    }

    .header__meta {
      font-family: var(--font-body, 'Sharp Grotesk', sans-serif);
      font-size: 12px;
      font-weight: 400;
      letter-spacing: 0.04em;
      color: var(--slate, #8c8c8c);
      text-transform: uppercase;
    }

    /* Section labels */
    .section-label {
      font-family: var(--font-body, 'Sharp Grotesk', sans-serif);
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--color-dark-gray, #3d3b39);
      margin-bottom: 40px;
      padding-bottom: 16px;
      border-bottom: 1px solid var(--color-border-subtle, #ebebeb);
    }

    /* Swatch grid */
    .swatch-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 32px;
      margin-bottom: 96px;
    }

    .swatch {
      background: var(--paper, #ffffff);
      border: 1px solid var(--color-border-subtle, #ebebeb);
      border-radius: 8px;
      overflow: hidden;
      transition: border-color 0.2s ease, box-shadow 0.2s ease;
    }

    .swatch:hover {
      border-color: var(--ink, #0061ff);
      box-shadow: 0 2px 12px rgba(0, 97, 255, 0.1);
    }

    .swatch__chip {
      width: 100%;
      aspect-ratio: 5 / 3;
      position: relative;
    }

    .swatch__chip-contrast {
      position: absolute;
      bottom: 12px;
      right: 12px;
      font-family: var(--font-body, 'Sharp Grotesk', sans-serif);
      font-size: 10px;
      font-weight: 600;
      padding: 4px 12px;
      border-radius: 4px;
      line-height: 1.4;
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }

    .swatch__meta {
      padding: 24px;
    }

    .swatch__var {
      font-family: var(--font-mono, 'SFMono-Regular', monospace);
      font-size: 11px;
      font-weight: 500;
      color: var(--color-black, #1e1919);
      word-break: break-all;
      margin-bottom: 6px;
      letter-spacing: 0.02em;
    }

    .swatch__hex {
      font-family: var(--font-mono, 'SFMono-Regular', monospace);
      font-size: 10px;
      color: var(--slate, #8c8c8c);
      margin-bottom: 8px;
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }

    .swatch__role {
      font-family: var(--font-body, 'Sharp Grotesk', sans-serif);
      font-size: 14px;
      line-height: 1.5;
      color: var(--color-mid-gray, #637282);
      margin-bottom: 12px;
    }

    .swatch__contrast-label {
      font-family: var(--font-body, 'Sharp Grotesk', sans-serif);
      font-size: 10px;
      font-weight: 600;
      margin-top: 8px;
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }

    .contrast-pass { color: var(--color-success-green, #0d7d3b); }
    .contrast-fail { color: var(--color-error-red, #d93025); }
    .contrast-aa-large { color: var(--color-warning-amber, #e5a000); }

    /* Chip contrast badge styling */
    .chip-badge {
      border-radius: 4px;
      font-weight: 600;
      display: inline-block;
    }

    /* Usage pattern section */
    .usage-section {
      margin-bottom: 96px;
      padding: 48px;
      background: var(--color-surface-hover, #f0edea);
      border: 1px solid var(--color-border-default, #e2e0de);
      border-radius: 8px;
    }

    .usage-section h2 {
      font-family: var(--font-display, 'Sharp Grotesk', sans-serif);
      font-size: 44px;
      font-weight: 600;
      line-height: 1.1;
      letter-spacing: -0.6px;
      color: var(--color-black, #1e1919);
      margin-bottom: 24px;
    }

    .usage-section p {
      font-family: var(--font-body, 'Sharp Grotesk', sans-serif);
      font-size: 16px;
      line-height: 1.6;
      color: var(--color-dark-gray, #3d3b39);
      margin-bottom: 32px;
      max-width: 800px;
    }

    .rule-of-one {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 32px;
      margin-top: 40px;
      align-items: start;
    }

    .rule-example {
      padding: 32px;
      background: var(--paper, #ffffff);
      border: 1px solid var(--color-border-subtle, #ebebeb);
      border-radius: 8px;
    }

    .rule-example h3 {
      font-family: var(--font-display, 'Sharp Grotesk', sans-serif);
      font-size: 24px;
      font-weight: 600;
      line-height: 1.3;
      color: var(--color-black, #1e1919);
      margin-bottom: 16px;
    }

    .rule-example p {
      font-family: var(--font-body, 'Sharp Grotesk', sans-serif);
      font-size: 14px;
      line-height: 1.6;
      color: var(--color-mid-gray, #637282);
      margin-bottom: 0;
    }

    .correct {
      border: 2px solid var(--color-success-green, #0d7d3b) !important;
    }

    .correct::before {
      content: '✓ CORRECT';
      display: block;
      font-family: var(--font-body, 'Sharp Grotesk', sans-serif);
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 0.08em;
      color: var(--color-success-green, #0d7d3b);
      text-transform: uppercase;
      margin-bottom: 16px;
      padding-bottom: 12px;
      border-bottom: 1px solid var(--color-success-green, #0d7d3b);
    }

    .incorrect {
      border: 2px solid var(--color-error-red, #d93025) !important;
    }

    .incorrect::before {
      content: '✗ AVOID';
      display: block;
      font-family: var(--font-body, 'Sharp Grotesk', sans-serif);
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 0.08em;
      color: var(--color-error-red, #d93025);
      text-transform: uppercase;
      margin-bottom: 16px;
      padding-bottom: 12px;
      border-bottom: 1px solid var(--color-error-red, #d93025);
    }

    .signal-demo {
      font-size: 16px;
      line-height: 1.6;
    }

    .signal-demo .drop-cap {
      font-family: var(--font-display, 'Sharp Grotesk', sans-serif);
      font-size: 72px;
      font-weight: 600;
      color: var(--signal, #ff7e6b);
      float: left;
      line-height: 0.7;
      padding-right: 8px;
      margin-top: 2px;
    }

    .signal-demo em {
      color: var(--signal, #ff7e6b);
      font-style: normal;
      font-weight: 600;
    }

    /* Illustration palette showcase */
    .illustration-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
      gap: 16px;
      margin-top: 32px;
    }

    .illustration-swatch {
      aspect-ratio: 1;
      border-radius: 8px;
      border: 1px solid var(--color-border-subtle, #ebebeb);
      display: flex;
      align-items: flex-end;
      justify-content: center;
      padding: 12px;
      font-family: var(--font-mono, 'SFMono-Regular', monospace);
      font-size: 9px;
      font-weight: 500;
      color: var(--slate, #8c8c8c);
      text-transform: uppercase;
      letter-spacing: 0.04em;
      text-align: center;
      overflow: hidden;
    }

    /* WCAG summary */
    .wcag-summary {
      margin-top: 96px;
      padding: 48px;
      background: var(--color-surface-hover, #f0edea);
      border: 1px solid var(--color-border-default, #e2e0de);
      border-radius: 8px;
    }

    .wcag-summary h2 {
      font-family: var(--font-display, 'Sharp Grotesk', sans-serif);
      font-size: 44px;
      font-weight: 600;
      line-height: 1.1;
      letter-spacing: -0.6px;
      margin-bottom: 24px;
      color: var(--color-black, #1e1919);
    }

    .wcag-summary p {
      font-family: var(--font-body, 'Sharp Grotesk', sans-serif);
      font-size: 14px;
      line-height: 1.6;
      color: var(--color-dark-gray, #3d3b39);
      margin-bottom: 32px;
    }

    .wcag-row {
      display: flex;
      align-items: center;
      gap: 16px;
      padding: 16px 0;
      border-bottom: 1px solid var(--color-border-subtle, #ebebeb);
      font-family: var(--font-body, 'Sharp Grotesk', sans-serif);
      font-size: 14px;
    }

    .wcag-row:last-child { border-bottom: none; }

    .wcag-badge {
      display: inline-block;
      padding: 6px 16px;
      border-radius: 4px;
      font-family: var(--font-body, 'Sharp Grotesk', sans-serif);
      font-size: 10px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      min-width: 90px;
      text-align: center;
      flex-shrink: 0;
    }

    .wcag-badge--pass { background: var(--color-success-light, #e6f4ea); color: var(--color-success-green, #0d7d3b); }
    .wcag-badge--fail { background: var(--color-error-light, #fce8e6); color: var(--color-error-red, #d93025); }
    .wcag-badge--aa-large { background: var(--color-warning-light, #fff3cd); color: var(--color-warning-amber, #e5a000); }

    /* Loading state */
    .loading {
      text-align: center;
      padding: 120px 24px;
      color: var(--slate, #8c8c8c);
      font-family: var(--font-body, 'Sharp Grotesk', sans-serif);
      font-size: 16px;
    }

    .loading::after {
      content: '';
      display: block;
      width: 40px;
      height: 40px;
      margin: 32px auto 0;
      border: 2px solid var(--slate, #8c8c8c);
      border-top-color: var(--ink, #0061ff);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    /* Responsive */
    @media (max-width: 1024px) {
      .page { padding: 64px 32px; }
      .header { padding-bottom: 32px; margin-bottom: 64px; }
      .header__title { font-size: 48px; }
      .swatch-grid { grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 24px; }
      .rule-of-one { grid-template-columns: 1fr; gap: 24px; }
    }

    @media (max-width: 640px) {
      .page { padding: 48px 20px; }
      .header { padding-bottom: 20px; margin-bottom: 40px; }
      .header__title { font-size: 36px; }
      .header__subtitle { font-size: 16px; }
      .swatch-grid { grid-template-columns: 1fr; gap: 16px; }
      .usage-section { padding: 24px; }
      .wcag-summary { padding: 24px; }
    }
  </style>
</head>
<body>
  <div class="page" id="app">
    <div class="loading">Loading design tokens…</div>
  </div>

  <script>
    /* ───────────────────────────────────────────────────────────── */
    /* Contrast ratio calculation (WCAG 2.1 relative luminance)      */
    /* ───────────────────────────────────────────────────────────── */
    function hexToRgb(hex) {
      hex = hex.replace(/^#/, '');
      if (hex.length === 3) hex = hex.split('').map(c => c + c).join('');
      const n = parseInt(hex, 16);
      return [(n >> 16) & 255, (n >> 8) & 255, n & 255];
    }

    function luminance([r, g, b]) {
      const [rs, gs, bs] = [r, g, b].map(c => {
        c /= 255;
        return c <= 0.03928 ? c / 12.92 : Math.pow((c + 0.055) / 1.055, 2.4);
      });
      return 0.2126 * rs + 0.7152 * gs + 0.0722 * bs;
    }

    function contrastRatio(hex1, hex2) {
      const l1 = luminance(hexToRgb(hex1));
      const l2 = luminance(hexToRgb(hex2));
      const lighter = Math.max(l1, l2);
      const darker = Math.min(l1, l2);
      return (lighter + 0.05) / (darker + 0.05);
    }

    function wcagLevel(ratio) {
      if (ratio >= 7) return { label: 'AAA', cls: 'pass' };
      if (ratio >= 4.5) return { label: 'AA', cls: 'pass' };
      if (ratio >= 3) return { label: 'AA Large', cls: 'aa-large' };
      return { label: 'Fail', cls: 'fail' };
    }

    /* ───────────────────────────────────────────────────────────── */
    /* Core color roles and descriptions                             */
    /* ───────────────────────────────────────────────────────────── */
    const CORE_ROLES = {
      paper:  'Dominant canvas. Clean, expansive white for breathing room.',
      ink:    'Primary interactive color. Dropbox Blue — CTAs, links, selected states.',
      slate:  'Tertiary text. Timestamps, metadata, de-emphasized labels.',
      signal: 'Illustration accent. Warm coral for onboarding, marketing, playful moments.',
      bone:   'Alternate surface. Same as paper for consistency in this light theme.',
    };

    const EXTENDED_ROLES = {
      'blue-hover':     'Darker blue for pressed and hover states on primary actions.',
      'blue-light':     'Light blue tint for selected rows, active nav, and notification badges.',
      'black':          'Primary heading text. Warm near-black with subtle brown undertone.',
      'dark-gray':      'Secondary headings and strong labels. One step lighter than black.',
      'mid-gray':       'Body text. Default reading color for paragraphs and descriptions.',
      'muted':          'Placeholder text, disabled states, and inactive icons.',
      'surface-hover':  'Hover state for list items, file rows, and interactive surfaces.',
      'border-default': 'Standard card borders, dividers, input fields, and containers.',
      'border-subtle':  'Light borders for internal dividers and table lines.',
      'success-green':  'Synced status, successful uploads, completion indicators.',
      'success-light':  'Success badge backgrounds and synced state surfaces.',
      'warning-amber':  'Sync conflicts, storage warnings, and attention states.',
      'warning-light':  'Warning badge backgrounds and alert surfaces.',
      'error-red':      'Upload failures, permission errors, and destructive action warnings.',
      'error-light':    'Error badge backgrounds and failed state surfaces.',
      'yellow':         'Bright illustration accent for feature highlights and playful moments.',
      'purple':         'Deep illustration accent for branding moments and category coding.',
      'teal':           'Cool illustration accent for variety and semantic categorization.',
    };

    /* ───────────────────────────────────────────────────────────── */
    /* Render from tokens.json                                       */
    /* ───────────────────────────────────────────────────────────── */
    (window.__DESIGN_TOKENS__ 
      ? Promise.resolve({ ok: true, json: () => Promise.resolve(window.__DESIGN_TOKENS__) }) 
      : fetch('../tokens.json'))
      .then(r => {
        if (!r.ok) throw new Error('tokens.json not found (' + r.status + ')');
        return r.json();
      })
      .then(render)
      .catch(err => {
        document.getElementById('app').innerHTML =
          '<div class="loading" style="color:var(--signal,#ff7e6b)">' +
          'Could not load tokens.json — ' + err.message + '</div>';
      });

    function render(tokens) {
      const app = document.getElementById('app');
      const rawColors = tokens.colors || {};
      const paperHex = rawColors.paper || '#ffffff';

      /* Flatten nested color structure */
      const colors = {};
      for (const [k, v] of Object.entries(rawColors)) {
        if (typeof v === 'string') {
          colors[k] = v;
        } else if (v && typeof v === 'object') {
          for (const [sk, sv] of Object.entries(v)) {
            if (typeof sv === 'string') colors[k + '-' + sk] = sv;
          }
        }
      }

      /* Split core and extended */
      const coreKeys = Object.keys(CORE_ROLES).filter(k => colors[k]);
      const extendedKeys = Object.keys(colors)
        .filter(k => !CORE_ROLES[k] && EXTENDED_ROLES[k] && typeof colors[k] === 'string');

      let html = '';

      /* ─ Stage head header ─ */
      html += '<header class="header">';
      html += '  <div class="header__kicker">Color System</div>';
      html += '  <h1 class="header__title">Dropbox Blue<br>Palette</h1>';
      html += '  <p class="header__subtitle">A refined palette built on confident blue, warm neutrals, and illustration-forward accents. Spacious and clean — color serves clarity.</p>';
      html += '  <div class="header__meta">Core + Extended + Semantic • ' + (coreKeys.length + extendedKeys.length) + ' Tokens</div>';
      html += '</header>';

      /* ─ Core Palette ─ */
      if (coreKeys.length) {
        html += '<div class="section-label">Core Palette</div>';
        html += '<div class="swatch-grid">';
        coreKeys.forEach(key => {
          html += swatchCard(key, colors[key], paperHex, CORE_ROLES[key]);
        });
        html += '</div>';
      }

      /* ─ Extended Palette ─ */
      if (extendedKeys.length) {
        html += '<div class="section-label">Extended Palette</div>';
        html += '<div class="swatch-grid">';
        extendedKeys.forEach(key => {
          html += swatchCard(key, colors[key], paperHex, EXTENDED_ROLES[key]);
        });
        html += '</div>';
      }

      /* ─ Illustration Palette ─ */
      html += illustrationSection(colors, paperHex);

      /* ─ Rule of One ─ */
      html += ruleOfOneSection(paperHex);

      /* ─ WCAG Summary ─ */
      html += wcagSummary(colors, paperHex);

      app.innerHTML = html;
    }

    /* ───────────────────────────────────────────────────────────── */
    /* Swatch card builder                                           */
    /* ───────────────────────────────────────────────────────────── */
    function swatchCard(key, hex, paperHex, role) {
      const ratio = contrastRatio(hex, paperHex);
      const level = wcagLevel(ratio);
      const lum = luminance(hexToRgb(hex));
      const chipTextColor = lum > 0.5 ? '#1e1919' : '#ffffff';
      const chipBadgeBg = lum > 0.5 ? 'rgba(30,25,25,0.1)' : 'rgba(255,255,255,0.25)';

      return '' +
        '<div class="swatch">' +
        '  <div class="swatch__chip" style="background:' + hex + '">' +
        '    <span class="swatch__chip-contrast chip-badge" style="color:' + chipTextColor +
             ';background:' + chipBadgeBg + '">' + ratio.toFixed(2) + ':1</span>' +
        '  </div>' +
        '  <div class="swatch__meta">' +
        '    <div class="swatch__var">--' + esc(key) + '</div>' +
        '    <div class="swatch__hex">' + esc(hex.toUpperCase()) + '</div>' +
        '    <div class="swatch__role">' + esc(role) + '</div>' +
        '    <div class="swatch__contrast-label contrast-' + level.cls + '">' +
             'WCAG ' + level.label + '</div>' +
        '  </div>' +
        '</div>';
    }

    /* ───────────────────────────────────────────────────────────── */
    /* Illustration palette showcase                                 */
    /* ───────────────────────────────────────────────────────────── */
    function illustrationSection(colors, paperHex) {
      const illustColors = ['yellow', 'purple', 'teal', 'signal'];
      const illustData = {
        yellow: { role: 'Bright accent for feature highlights', hex: colors['color-yellow'] || '#ffd830' },
        purple: { role: 'Deep accent for branding moments', hex: colors['color-purple'] || '#7b68ee' },
        teal: { role: 'Cool accent for variety and categorization', hex: colors['color-teal'] || '#17bebb' },
        signal: { role: 'Warm coral for onboarding and playful moments', hex: colors.signal || '#ff7e6b' },
      };

      let html = '<div class="section-label">Illustration Palette</div>';
      html += '<p style="font-family:var(--font-body);font-size:14px;color:var(--color-mid-gray,#637282);margin-bottom:32px;max-width:800px;">Illustration colors inject warmth and personality into feature explanations, empty states, and onboarding flows. Applied at display scales for visual impact.</p>';
      html += '<div class="illustration-grid">';

      illustColors.forEach(key => {
        const data = illustData[key];
        const ratio = contrastRatio(data.hex, paperHex);
        const level = wcagLevel(ratio);
        const lum = luminance(hexToRgb(data.hex));
        const textColor = lum > 0.5 ? '#1e1919' : '#ffffff';

        html += '<div class="illustration-swatch" style="background:' + data.hex + ';">' +
                '<div style="color:' + textColor + ';text-align:center;">' +
                '<div style="font-weight:600;margin-bottom:4px;">--' + esc(key) + '</div>' +
                '<div style="font-size:8px;opacity:0.7;">' + esc(data.hex.toUpperCase()) + '</div>' +
                '</div>' +
                '</div>';
      });

      html += '</div>';
      return html;
    }

    /* ───────────────────────────────────────────────────────────── */
    /* Rule of One usage pattern                                     */
    /* ───────────────────────────────────────────────────────────── */
    function ruleOfOneSection(paperHex) {
      let html = '<section class="usage-section">';
      html += '<h2>Signal Accent Strategy</h2>';
      html += '<p>Dropbox Blue (#0061ff) is the primary interactive color — it lives in buttons, links, selected states, and focus rings throughout the interface. This is the workhorse accent. The coral signal color (#ff7e6b) is reserved for illustration moments: hand-drawn characters in onboarding, playful accent shapes in empty states, and feature highlight callouts. Use restraint. Too many colors compete; one color commands.</p>';

      html += '<div class="rule-of-one">';

      /* Correct example */
      html += '<div class="rule-example correct">';
      html += '<h3>Focused Color Hierarchy</h3>';
      html += '<p class="signal-demo">';
      html += '<span class="drop-cap">B</span>';
      html += 'lue drives interactive behavior: buttons, links, focus states. Coral appears only in illustration moments—the hand-drawn character in your onboarding flow, the playful shape in the empty state. Hierarchy through purpose, not quantity. Every color earns its place through function.';
      html += '</p>';
      html += '</div>';

      /* Incorrect example */
      html += '<div class="rule-example incorrect">';
      html += '<h3>Color Inflation</h3>';
      html += '<p>';
      html += 'Sprinkling accent colors throughout the interface—a blue badge here, a coral button there, teal text somewhere else—fragments attention. Multiple competing accents dilute the sense of a unified, intentional system. Restraint strengthens perception. Let your colors do one job each, and do it well.';
      html += '</p>';
      html += '</div>';

      html += '</div>';
      html += '</section>';
      return html;
    }

    /* ───────────────────────────────────────────────────────────── */
    /* WCAG compliance summary                                       */
    /* ───────────────────────────────────────────────────────────── */
    function wcagSummary(colors, paperHex) {
      const keys = Object.keys(colors);
      let passAAA = 0, passAA = 0, passAALarge = 0, fail = 0;

      keys.forEach(k => {
        const ratio = contrastRatio(colors[k], paperHex);
