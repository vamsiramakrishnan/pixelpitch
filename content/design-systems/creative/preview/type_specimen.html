<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Type Specimen — Creative</title>
  <link rel="stylesheet" href="../colors_and_type.css">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: var(--font-body, system-ui, sans-serif);
      background: var(--paper, #ffffff);
      color: var(--ink, #111111);
      line-height: 1.6;
    }

    .page {
      max-width: 1100px;
      margin: 0 auto;
      padding: 96px 48px;
    }

    @media (max-width: 768px) {
      .page {
        padding: 64px 32px;
      }
    }

    @media (max-width: 480px) {
      .page {
        padding: 48px 24px;
      }
    }

    /* Header */
    .header {
      margin-bottom: 96px;
    }

    .header__kicker {
      font-family: var(--font-mono, ui-monospace, monospace);
      font-size: 14px;
      font-weight: 500;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--slate, #666666);
      margin-bottom: 16px;
    }

    .header__title {
      font-family: var(--font-display, system-ui, sans-serif);
      font-size: 96px;
      font-weight: 700;
      line-height: 0.95;
      letter-spacing: -0.02em;
      color: var(--ink, #111111);
      margin-bottom: 24px;
    }

    .header__subtitle {
      font-family: var(--font-body, system-ui, sans-serif);
      font-size: 22px;
      font-weight: 400;
      line-height: 1.55;
      color: var(--slate, #666666);
      max-width: 680px;
      margin-bottom: 32px;
    }

    .header__rule {
      display: block;
      width: 96px;
      height: 1px;
      background: var(--ink, #111111);
      border: none;
      margin: 0;
    }

    /* Font families section */
    .font-families {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 32px;
      margin-bottom: 96px;
      margin-top: 64px;
    }

    .font-card {
      background: transparent;
      border: 1px solid var(--border, #e5e5e5);
      border-radius: var(--radius-md, 8px);
      padding: 32px;
    }

    .font-card__label {
      font-family: var(--font-mono, ui-monospace, monospace);
      font-size: 12px;
      font-weight: 500;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--slate, #666666);
      margin-bottom: 12px;
    }

    .font-card__name {
      font-family: var(--font-display, system-ui, sans-serif);
      font-size: 36px;
      font-weight: 700;
      line-height: 1.1;
      color: var(--ink, #111111);
      margin-bottom: 8px;
    }

    .font-card__fallback {
      font-family: var(--font-mono, ui-monospace, monospace);
      font-size: 12px;
      color: var(--slate, #666666);
      word-break: break-word;
    }

    /* Character set block */
    .charmap-block {
      background: transparent;
      border: 1px solid var(--border, #e5e5e5);
      border-radius: var(--radius-md, 8px);
      padding: 48px;
      margin-bottom: 96px;
    }

    .charmap-block__label {
      font-family: var(--font-mono, ui-monospace, monospace);
      font-size: 12px;
      font-weight: 500;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--slate, #666666);
      margin-bottom: 24px;
    }

    .charmap-block__chars {
      font-family: var(--font-display, system-ui, sans-serif);
      font-size: 32px;
      font-weight: 700;
      line-height: 1.8;
      letter-spacing: 0.02em;
      color: var(--ink, #111111);
      word-break: break-word;
    }

    /* Section label */
    .section-label {
      font-family: var(--font-mono, ui-monospace, monospace);
      font-size: 12px;
      font-weight: 500;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--slate, #666666);
      margin-bottom: 32px;
      padding-bottom: 16px;
      border-bottom: 1px solid var(--ink, #111111);
    }

    /* Ramp row */
    .ramp-row {
      display: grid;
      grid-template-columns: 280px 1fr;
      gap: 48px;
      align-items: baseline;
      padding: 32px 0;
      border-bottom: 1px solid var(--border, #e5e5e5);
    }

    .ramp-row:last-child {
      border-bottom: none;
    }

    @media (max-width: 800px) {
      .ramp-row {
        grid-template-columns: 1fr;
        gap: 16px;
      }
    }

    /* Left meta column */
    .ramp-meta__role {
      font-family: var(--font-display, system-ui, sans-serif);
      font-size: 18px;
      font-weight: 700;
      color: var(--ink, #111111);
      margin-bottom: 8px;
    }

    .ramp-meta__detail {
      font-family: var(--font-mono, ui-monospace, monospace);
      font-size: 11px;
      font-weight: 400;
      line-height: 1.8;
      color: var(--slate, #666666);
      letter-spacing: 0.02em;
    }

    /* Right sample column */
    .ramp-sample {
      color: var(--ink, #111111);
      overflow-wrap: break-word;
      word-spacing: 0.1em;
    }

    /* Ramp section */
    .ramp-section {
      margin-bottom: 96px;
    }

    /* Drop cap demo */
    .dropcap-demo {
      margin-bottom: 96px;
    }

    .dropcap-demo__label {
      font-family: var(--font-mono, ui-monospace, monospace);
      font-size: 12px;
      font-weight: 500;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--slate, #666666);
      margin-bottom: 32px;
      padding-bottom: 16px;
      border-bottom: 1px solid var(--ink, #111111);
    }

    .dropcap-container {
      background: transparent;
      border: 1px solid var(--border, #e5e5e5);
      border-radius: var(--radius-md, 8px);
      padding: 48px;
      max-width: 680px;
    }

    .dropcap-para {
      font-family: var(--font-body, system-ui, sans-serif);
      font-size: 22px;
      font-weight: 400;
      line-height: 1.55;
      color: var(--ink, #111111);
      margin: 0;
      text-align: left;
    }

    .dropcap {
      float: left;
      font-family: var(--font-display, system-ui, sans-serif);
      font-size: 128px;
      font-weight: 700;
      line-height: 0.85;
      color: var(--signal, #3b82f6);
      margin-right: 8px;
      margin-top: -8px;
    }

    /* Loading */
    .loading {
      text-align: center;
      padding: 160px 48px;
      color: var(--slate, #666666);
      font-family: var(--font-body, system-ui, sans-serif);
      font-size: 18px;
    }

    .loading::after {
      content: '';
      display: block;
      width: 32px;
      height: 32px;
      margin: 24px auto 0;
      border: 2px solid var(--border, #e5e5e5);
      border-top-color: var(--signal, #3b82f6);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div class="page" id="app">
    <div class="loading">Loading design tokens&hellip;</div>
  </div>

  <script>
    const EDITORIAL_SAMPLES = [
      'Playful design brings joy to every interaction.',
      'Character-driven typography makes brands memorable.',
      'Bold graphics grab attention and spark curiosity.',
      'Creative systems scale without losing personality.',
      'Every pixel tells a story in a playful voice.',
      'Expressiveness paired with clarity wins readers.',
      'Art and commerce merge in creative projects.',
      'Personality prevents design from feeling sterile.',
      'Visual playfulness needs structural discipline.',
      'Creative thinking requires brave constraints.',
    ];

    const DROPCAP_TEXT = 'Creative design speaks the language of joy. It breaks free from convention while respecting readability and usability. In a world of minimalist monospace systems, playful typography reminds us that design can dance. The Bangers font carries personality through every headline, every call-to-action, every moment of interaction. But playfulness without clarity becomes noise. This system pairs expressive display faces with measured neutrals, ensuring that personality amplifies message rather than obscuring it. Creative projects demand bold graphics and character-driven typography. Yet these tools require discipline. The type ramp, the color palette, the spacing system—these guardrails let designers be wildly creative within guardrails. Consistency enables freedom.';

    fetch('../tokens.json')
      .then(r => {
        if (!r.ok) throw new Error('tokens.json not found (' + r.status + ')');
        return r.json();
      })
      .then(render)
      .catch(err => {
        document.getElementById('app').innerHTML =
          '<div class="loading" style="color:#3b82f6">' +
          'Could not load tokens.json — ' + err.message + '</div>';
      });

    function render(tokens) {
      const app = document.getElementById('app');
      const title = tokens.meta?.title || 'Design System';
      const summary = tokens.meta?.summary || '';

      const fonts = tokens.typography || {};
      const ramp = tokens.typography?.ramp || [];

      let html = '';

      /* Header */
      html += '<header class="header">';
      html += '  <div class="header__kicker">Type Specimen</div>';
      html += '  <h1 class="header__title">' + esc(title) + '</h1>';
      html += '  <p class="header__subtitle">' + esc(summary) + '</p>';
      html += '  <hr class="header__rule">';
      html += '</header>';

      /* Font families */
      const families = [
        { label: 'Display', name: 'Bangers', fallback: 'system-ui, sans-serif' },
        { label: 'Body', name: 'System UI', fallback: 'system-ui, -apple-system, Helvetica Neue, sans-serif' },
        { label: 'Monospace', name: 'IBM Plex Mono', fallback: 'ui-monospace, Menlo, monospace' }
      ];

      html += '<div class="font-families">';
      families.forEach(f => {
        html += '<div class="font-card">';
        html += '  <div class="font-card__label">' + esc(f.label) + '</div>';
        html += '  <div class="font-card__name">' + esc(f.name) + '</div>';
        html += '  <div class="font-card__fallback">' + esc(f.fallback) + '</div>';
        html += '</div>';
      });
      html += '</div>';

      /* Character set */
      html += '<div class="charmap-block">';
      html += '  <div class="charmap-block__label">Character Set</div>';
      html += '  <div class="charmap-block__chars" style="font-family:Bangers,cursive">';
      html += '    AaBbCcDdEeFfGgHhIiJjKkLlMmNnOoPpQqRrSsTtUuVvWwXxYyZz<br>';
      html += '    0123456789 !@#$%&amp;*()&ndash;&mdash;&lsquo;&rsquo;&ldquo;&rdquo;';
      html += '  </div>';
      html += '</div>';

      /* Generate ramp */
      const generatedRamp = [
        { role: 'Page Title', size: '64px', weight: 700, lineHeight: '0.95', fontKey: 'display', letterSpacing: '-0.02em' },
        { role: 'Section Head', size: '48px', weight: 700, lineHeight: '1.0', fontKey: 'display', letterSpacing: '-0.01em' },
        { role: 'Subhead', size: '32px', weight: 700, lineHeight: '1.15', fontKey: 'display', letterSpacing: '0' },
        { role: 'Large Body', size: '24px', weight: 400, lineHeight: '1.5', fontKey: 'body', letterSpacing: '0' },
        { role: 'Body', size: '20px', weight: 400, lineHeight: '1.6', fontKey: 'body', letterSpacing: '0' },
        { role: 'Small Body', size: '16px', weight: 400, lineHeight: '1.6', fontKey: 'body', letterSpacing: '0' },
        { role: 'Caption', size: '14px', weight: 500, lineHeight: '1.5', fontKey: 'body', letterSpacing: '0.02em' },
        { role: 'Meta', size: '12px', weight: 500, lineHeight: '1.6', fontKey: 'mono', letterSpacing: '0.04em' }
      ];

      /* Type ramp */
      if (generatedRamp.length) {
        html += '<div class="ramp-section">';
        html += '<div class="section-label">Type Ramp</div>';
        generatedRamp.forEach((entry, i) => {
          html += rampRow(entry, i);
        });
        html += '</div>';
      }

      /* Drop cap demo */
      html += '<div class="dropcap-demo">';
      html += '<div class="dropcap-demo__label">Drop Cap — Bangers Bold, Signal Blue</div>';
      html += '<div class="dropcap-container">';
      const firstChar = DROPCAP_TEXT.charAt(0);
      const restText = DROPCAP_TEXT.substring(1);
      html += '<p class="dropcap-para">';
      html += '<span class="dropcap">' + esc(firstChar) + '</span>';
      html += esc(restText);
      html += '</p>';
      html += '</div>';
      html += '</div>';

      app.innerHTML = html;
    }

    function rampRow(entry, idx) {
      const role = entry.role || 'Role ' + (idx + 1);
      const size = entry.size || '16px';
      const weight = entry.weight || 400;
      const lh = entry.lineHeight || '1.5';
      const ls = entry.letterSpacing || '0';

      let fontFamily = 'var(--font-body)';
      if (entry.fontKey === 'display') fontFamily = 'var(--font-display)';
      else if (entry.fontKey === 'mono') fontFamily = 'var(--font-mono)';

      const sizeNum = parseFloat(size);
      const sampleIdx = idx % EDITORIAL_SAMPLES.length;
      let sample = EDITORIAL_SAMPLES[sampleIdx];

      /* Truncate very large samples */
      if (sizeNum >= 48) {
        sample = sample.split('.')[0].slice(0, 40);
        if (!sample.endsWith('.')) sample += '.';
      }

      let fontStyle = 'font-size:' + size + ';font-weight:' + weight + ';line-height:' + lh + ';';
      fontStyle += 'font-family:' + fontFamily + ';';
      if (ls && ls !== '0' && ls !== 'normal') fontStyle += 'letter-spacing:' + ls + ';';

      let meta = esc(size) + ' / ' + esc(String(weight));
      meta += '\n' + fontFamilyLabel(entry.fontKey);
      meta += '\nline-height: ' + esc(String(lh));
      if (ls && ls !== '0' && ls !== 'normal') meta += '\nletter-spacing: ' + esc(ls);

      return '' +
        '<div class="ramp-row">' +
        '  <div class="ramp-meta">' +
        '    <div class="ramp-meta__role">' + esc(role) + '</div>' +
        '    <pre class="ramp-meta__detail">' + meta + '</pre>' +
        '  </div>' +
        '  <div class="ramp-sample" style="' + fontStyle + '">' + esc(sample) + '</div>' +
        '</div>';
    }

    function fontFamilyLabel(key) {
      const map = {
        'display': 'Bangers',
        'body': 'System UI',
        'mono': 'IBM Plex Mono'
      };
      return map[key] || 'Unknown';
    }

    function esc(s) {
      const d = document.createElement('div');
      d.textContent = String(s);
      return d.innerHTML;
    }
  </script>
</body>
</html>
