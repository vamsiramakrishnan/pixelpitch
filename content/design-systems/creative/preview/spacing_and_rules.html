<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Spacing &amp; Rules — Creative</title>
  <link rel="stylesheet" href="../colors_and_type.css">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: var(--font-body, 'system-ui, sans-serif');
      background: var(--paper, #ffffff);
      color: var(--ink, #111111);
      line-height: 1.6;
    }

    .page {
      max-width: 1100px;
      margin: 0 auto;
      padding: 96px 64px;
    }

    /* Header / Stage head */
    .header {
      margin-bottom: 96px;
      position: relative;
    }

    .header__kicker {
      font-family: var(--font-mono, 'ui-monospace, monospace');
      font-size: 14px;
      font-weight: 600;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--slate, #666666);
      margin-bottom: 12px;
    }

    .header__title {
      font-family: var(--font-display, 'system-ui, sans-serif');
      font-size: 72px;
      font-weight: 700;
      line-height: 0.95;
      letter-spacing: -0.02em;
      color: var(--ink, #111111);
      margin-bottom: 8px;
      max-width: 90%;
    }

    .header__subtitle {
      font-family: var(--font-body, 'system-ui, sans-serif');
      font-size: 22px;
      font-weight: 400;
      line-height: 1.55;
      color: var(--slate, #666666);
      max-width: 70%;
      margin-bottom: 32px;
    }

    .header__rule {
      display: block;
      width: 96px;
      height: 3px;
      background: var(--signal, #3b82f6);
      border: none;
      margin-top: 24px;
    }

    /* Section */
    .section {
      margin-bottom: 96px;
    }

    .section__label {
      font-family: var(--font-mono, 'ui-monospace, monospace');
      font-size: 14px;
      font-weight: 600;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--slate, #666666);
      margin-bottom: 48px;
      padding-bottom: 16px;
      border-bottom: 1px solid var(--border, #e5e5e5);
    }

    /* Spacing scale */
    .spacing-row {
      display: grid;
      grid-template-columns: 120px 1fr 100px;
      gap: 24px;
      align-items: center;
      padding: 24px 0;
      border-bottom: 1px solid var(--border, #e5e5e5);
    }

    .spacing-row:last-child {
      border-bottom: none;
    }

    .spacing-row__name {
      font-family: var(--font-mono, 'ui-monospace, monospace');
      font-size: 14px;
      font-weight: 600;
      color: var(--ink, #111111);
    }

    .spacing-row__label {
      font-family: var(--font-body, 'system-ui, sans-serif');
      font-size: 13px;
      color: var(--slate, #666666);
      margin-top: 4px;
    }

    .spacing-row__bar-wrap {
      height: 32px;
      display: flex;
      align-items: center;
    }

    .spacing-row__bar {
      height: 2px;
      background: var(--signal, #3b82f6);
      min-width: 2px;
      transition: opacity 0.2s ease;
    }

    .spacing-row:hover .spacing-row__bar {
      opacity: 0.6;
    }

    .spacing-row__value {
      font-family: var(--font-mono, 'ui-monospace, monospace');
      font-size: 14px;
      font-weight: 600;
      color: var(--ink, #111111);
      text-align: right;
    }

    /* Rule weights */
    .rule-demo {
      padding: 32px 0;
      border-bottom: 1px solid var(--border, #e5e5e5);
    }

    .rule-demo:last-child {
      border-bottom: none;
    }

    .rule-demo__header {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      margin-bottom: 16px;
    }

    .rule-demo__name {
      font-family: var(--font-mono, 'ui-monospace, monospace');
      font-size: 14px;
      font-weight: 600;
      color: var(--ink, #111111);
    }

    .rule-demo__label {
      font-family: var(--font-body, 'system-ui, sans-serif');
      font-size: 13px;
      color: var(--slate, #666666);
    }

    .rule-demo__spec {
      font-family: var(--font-mono, 'ui-monospace, monospace');
      font-size: 13px;
      color: var(--slate, #666666);
    }

    .rule-demo__container {
      width: 100%;
      height: 48px;
      display: flex;
      align-items: center;
      padding: 0;
      background: var(--bone, #f5f5f5);
      border-radius: 4px;
    }

    .rule-demo__line {
      width: 100%;
      border: none;
      border-radius: 0;
      margin: 0;
    }

    /* Border radius */
    .radius-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 64px;
      margin-bottom: 48px;
    }

    .radius-item {
      display: grid;
      grid-template-columns: 160px 1fr;
      gap: 32px;
      align-items: center;
    }

    .radius-item__demo {
      display: flex;
      gap: 16px;
      align-items: center;
    }

    .radius-item__box {
      width: 120px;
      height: 120px;
      background: var(--bone, #f5f5f5);
      border: 2px solid var(--signal, #3b82f6);
      flex-shrink: 0;
    }

    .radius-item__info {
      flex: 1;
    }

    .radius-item__name {
      font-family: var(--font-mono, 'ui-monospace, monospace');
      font-size: 14px;
      font-weight: 600;
      color: var(--ink, #111111);
      margin-bottom: 4px;
    }

    .radius-item__value {
      font-family: var(--font-mono, 'ui-monospace, monospace');
      font-size: 13px;
      color: var(--slate, #666666);
      margin-bottom: 12px;
    }

    .radius-item__description {
      font-family: var(--font-body, 'system-ui, sans-serif');
      font-size: 13px;
      line-height: 1.55;
      color: var(--slate, #666666);
    }

    /* Philosophy block */
    .philosophy {
      background: var(--bone, #f5f5f5);
      padding: 48px;
      border: 1px solid var(--border, #e5e5e5);
      border-radius: 8px;
      margin-bottom: 64px;
    }

    .philosophy__title {
      font-family: var(--font-mono, 'ui-monospace, monospace');
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--slate, #666666);
      margin-bottom: 16px;
    }

    .philosophy__text {
      font-family: var(--font-body, 'system-ui, sans-serif');
      font-size: 18px;
      line-height: 1.55;
      color: var(--ink, #111111);
    }

    .philosophy__text strong {
      font-weight: 600;
    }

    .philosophy__text em {
      font-style: italic;
    }

    /* Grid demo */
    .grid-demo {
      background: var(--bone, #f5f5f5);
      padding: 48px;
      border: 1px solid var(--border, #e5e5e5);
      border-radius: 8px;
      margin-bottom: 64px;
    }

    .grid-demo__title {
      font-family: var(--font-mono, 'ui-monospace, monospace');
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--slate, #666666);
      margin-bottom: 24px;
    }

    .grid-demo__visual {
      width: 100%;
      height: 200px;
      display: grid;
      grid-template-columns: repeat(12, 1fr);
      gap: 16px;
      background-image: linear-gradient(90deg, rgba(59, 130, 246, 0.08) 1px, transparent 1px);
      background-size: calc(100% / 12) 100%;
      padding: 24px;
      border: 1px dashed var(--border, #e5e5e5);
      border-radius: 4px;
    }

    .grid-demo__column {
      background: rgba(59, 130, 246, 0.12);
      border: 1px solid rgba(59, 130, 246, 0.25);
      font-family: var(--font-mono, 'ui-monospace, monospace');
      font-size: 11px;
      font-weight: 600;
      color: var(--signal, #3b82f6);
      display: flex;
      align-items: flex-end;
      justify-content: center;
      padding-bottom: 8px;
    }

    .grid-demo__info {
      margin-top: 16px;
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 24px;
    }

    .grid-demo__stat {
      font-family: var(--font-body, 'system-ui, sans-serif');
      font-size: 13px;
      color: var(--slate, #666666);
    }

    .grid-demo__stat-label {
      font-family: var(--font-mono, 'ui-monospace, monospace');
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--slate, #666666);
      margin-bottom: 4px;
    }

    /* Loading */
    .loading {
      text-align: center;
      padding: 80px 24px;
      color: var(--slate, #666666);
      font-size: 16px;
    }

    .loading::after {
      content: '';
      display: block;
      width: 32px;
      height: 32px;
      margin: 16px auto 0;
      border: 2px solid rgba(59, 130, 246, 0.2);
      border-top-color: var(--signal, #3b82f6);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    @media (max-width: 900px) {
      .page {
        padding: 64px 32px;
      }

      .header {
        margin-bottom: 64px;
      }

      .header__title {
        font-size: 54px;
      }

      .section {
        margin-bottom: 64px;
      }

      .spacing-row {
        grid-template-columns: 100px 1fr 80px;
        gap: 16px;
      }

      .radius-grid {
        grid-template-columns: 1fr;
        gap: 32px;
      }

      .radius-item {
        grid-template-columns: 120px 1fr;
      }
    }
  </style>
</head>
<body>
  <div class="page" id="app">
    <div class="loading">Loading design tokens…</div>
  </div>

  <script>
    const DEFAULT_SPACING = {
      's-1': { value: '4px', label: 'xs' },
      's-2': { value: '8px', label: 'sm' },
      's-3': { value: '16px', label: 'md' },
      's-4': { value: '24px', label: 'lg' },
      's-5': { value: '32px', label: 'xl' },
      's-6': { value: '48px', label: '2xl' },
      's-7': { value: '64px', label: '3xl' },
      's-8': { value: '96px', label: '4xl' }
    };

    const DEFAULT_RULES = {
      'flat': { name: 'Flat', weight: 'none', color: 'transparent', use: 'Default canvas, no border' },
      'border': { name: 'Border', weight: '1px', color: '#e5e5e5', use: 'Cards, inputs, dividers' },
      'elevated': { name: 'Elevated', weight: 'shadow', color: 'rgba(0,0,0,0.08)', use: 'Modals, dropdowns, popovers' }
    };

    const DEFAULT_RADIUS = {
      'none': { value: '0', use: 'Rarely used — not the Creative style' },
      'sm': { value: '4px', use: 'Small input fields, subtle containers' },
      'md': { value: '8px', use: 'Primary card and button radius' },
      'lg': { value: '16px', use: 'Large cards, hero sections' },
      'full': { value: '999px', use: 'Circular badges, pills, avatars' }
    };

    ( window.__DESIGN_TOKENS__ ? Promise.resolve({ ok: true, json: () => Promise.resolve(window.__DESIGN_TOKENS__) }) : fetch('../tokens.json') )
      .then(r => {
        if (!r.ok) throw new Error('tokens.json not found (' + r.status + ')');
        return r.json();
      })
      .then(render)
      .catch(err => {
        document.getElementById('app').innerHTML =
          '<div class="loading" style="color:#dc2626">' +
          'Could not load tokens.json — ' + err.message + '</div>';
      });

    function render(tokens) {
      const app = document.getElementById('app');
      
      const spacing = {};
      if (tokens.spacing?.scale) {
        Object.entries(tokens.spacing.scale).forEach(([k, v]) => {
          spacing[k] = { value: v, label: k };
        });
      } else {
        Object.assign(spacing, DEFAULT_SPACING);
      }

      const rules = DEFAULT_RULES;
      const radius = DEFAULT_RADIUS;

      let html = '';

      /* Header / Stage head */
      html += '<header class="header">';
      html += '  <div class="header__kicker">Spacing &amp; Rules</div>';
      html += '  <h1 class="header__title">Eight pixels.<br>Infinite playfulness.</h1>';
      html += '  <p class="header__subtitle">A modular spacing scale and depth system designed for playful, character-driven creative work. Built on clear blocks, consistent padding, and subtle elevation.</p>';
      html += '  <hr class="header__rule">';
      html += '</header>';

      /* Philosophy block */
      html += '<div class="philosophy">';
      html += '  <div class="philosophy__title">Spacing Philosophy</div>';
      html += '  <div class="philosophy__text">';
      html += '    <strong>Content clarity comes first.</strong> Each piece of information lives in its own breathing room. We use the 8px base unit to build predictable, generous spacing that makes scanning effortless. Whitespace isn\'t empty — it\'s <em>part of the design</em>. Headlines push down 48px from supporting text. Cards separate from each other with 32px gutters. This isn\'t minimalism; it\'s <strong>intentional rhythm</strong>, like a well-paced narrative. Every 4px increment earns its place.';
      html += '  </div>';
      html += '</div>';

      /* Spacing scale */
      html += '<div class="section">';
      html += '  <div class="section__label">Spacing Scale</div>';

      const spacingEntries = Object.entries(spacing);
      const maxPx = Math.max(...spacingEntries.map(([, o]) => parseFloat(o.value) || 0), 1);

      spacingEntries.forEach(([key, obj]) => {
        const px = parseFloat(obj.value) || 0;
        const pct = Math.max((px / maxPx) * 100, 2);
        const label = obj.label || key;
        
        html += '<div class="spacing-row">';
        html += '  <div>';
        html += '    <div class="spacing-row__name">' + esc(key) + '</div>';
        html += '    <div class="spacing-row__label">' + esc(label) + '</div>';
        html += '  </div>';
        html += '  <div class="spacing-row__bar-wrap">';
        html += '    <div class="spacing-row__bar" style="width:' + pct + '%"></div>';
        html += '  </div>';
        html += '  <div class="spacing-row__value">' + esc(obj.value) + '</div>';
        html += '</div>';
      });

      html += '</div>';

      /* Rule weights */
      html += '<div class="section">';
      html += '  <div class="section__label">Depth Levels</div>';

      Object.entries(rules).forEach(([key, rule]) => {
        const weight = rule.weight;
        const color = rule.color;
        const weightNum = parseFloat(weight) || 0;

        html += '<div class="rule-demo">';
        html += '  <div class="rule-demo__header">';
        html += '    <div>';
        html += '      <div class="rule-demo__name">' + esc(rule.name) + '</div>';
        html += '      <div class="rule-demo__label">' + esc(rule.use) + '</div>';
        html += '    </div>';
        html += '    <div class="rule-demo__spec">' + esc(weight) + '</div>';
        html += '  </div>';
        
        if (weight === 'none') {
          html += '  <div class="rule-demo__container" style="background: var(--paper); border: 1px dashed var(--border);">';
          html += '    <div style="font-family: var(--font-mono); font-size: 12px; color: var(--slate);">No border or shadow</div>';
          html += '  </div>';
        } else if (weight === 'shadow') {
          html += '  <div class="rule-demo__container" style="box-shadow: 0 2px 8px rgba(0,0,0,0.08); border: none;">';
          html += '  </div>';
        } else {
          html += '  <div class="rule-demo__container" style="border: ' + weight + ' solid ' + color + '; box-shadow: none;">';
          html += '  </div>';
        }
        
        html += '</div>';
      });

      html += '</div>';

      /* Border radius */
      html += '<div class="section">';
      html += '  <div class="section__label">Border Radius</div>';
      html += '  <p style="font-family: var(--font-body); font-size: 18px; color: var(--slate); line-height: 1.55; margin-bottom: 48px;">Rounded corners bring softness and friendliness to playful designs. The Creative system uses a <strong>4px default</strong> (buttons, inputs, small cards) up to <strong>16px</strong> for larger, hero-scale containers.</p>';

      Object.entries(radius).forEach(([key, obj]) => {
        const radiusValue = obj.value;

        html += '<div class="radius-item">';
        html += '  <div class="radius-item__demo">';
        html += '    <div class="radius-item__box" style="border-radius: ' + esc(radiusValue) + '"></div>';
        html += '  </div>';
        html += '  <div class="radius-item__info">';
        html += '    <div class="radius-item__name">--radius-' + esc(key) + '</div>';
        html += '    <div class="radius-item__value">' + esc(radiusValue) + '</div>';
        html += '    <div class="radius-item__description">' + esc(obj.use) + '</div>';
        html += '  </div>';
        html += '</div>';
      });

      html += '</div>';

      /* Grid visualization */
      html += '<div class="section">';
      html += '  <div class="section__label">Content Grid</div>';
      html += '  <div class="grid-demo">';
      html += '    <div class="grid-demo__title">12-Column Responsive Grid</div>';
      html += '    <div class="grid-demo__visual">';
      for (let i = 1; i <= 12; i++) {
        html += '      <div class="grid-demo__column">' + i + '</div>';
      }
      html += '    </div>';
      html += '    <div class="grid-demo__info">';
      html += '      <div>';
      html += '        <div class="grid-demo__stat-label">Base Unit</div>';
      html += '        <div class="grid-demo__stat">8px — all spacing derives from this</div>';
      html += '      </div>';
      html += '      <div>';
      html += '        <div class="grid-demo__stat-label">Gutter Width</div>';
      html += '        <div class="grid-demo__stat">16px (s-3) between columns</div>';
      html += '      </div>';
      html += '      <div>';
      html += '        <div class="grid-demo__stat-label">Max Content Width</div>';
      html += '        <div class="grid-demo__stat">1100px with 64px outer margins</div>';
      html += '      </div>';
      html += '      <div>';
      html += '        <div class="grid-demo__stat-label">Responsive Breakpoints</div>';
      html += '        <div class="grid-demo__stat">Reflow at 768px and 480px</div>';
      html += '      </div>';
      html += '    </div>';
      html += '  </div>';
      html += '</div>';

      /* Whitespace philosophy */
      html += '<div class="philosophy" style="margin-top: 96px; margin-bottom: 0;">';
      html += '  <div class="philosophy__title">Layout Principles</div>';
      html += '  <div class="philosophy__text">';
      html += '    <strong>Clear content blocks.</strong> Every major section—header, card, form, feature—is a distinct block with consistent internal padding (16–32px). <strong>Obvious hierarchy.</strong> Headline dominates, supporting text is muted, primary action pops in blue (#3B82F6). <strong>Whitespace before borders.</strong> Use padding and gaps to separate concerns first; only add a 1px border when whitespace alone isn\'t enough. <strong>Rounded softness.</strong> The default 8px radius on buttons and cards makes the system feel approachable and friendly. <strong>Subtle elevation.</strong> A 2px 8px shadow adds depth only where it\'s needed—modals, dropdowns, overlays.';
      html += '  </div>';
      html += '</div>';

      app.innerHTML = html;
    }

    function esc(s) {
      const d = document.createElement('div');
      d.textContent = String(s);
      return d.innerHTML;
    }
  </script>
</body>
</html>
