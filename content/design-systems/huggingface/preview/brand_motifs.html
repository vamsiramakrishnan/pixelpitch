<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Brand Motifs — Hugging Face</title>
  <link rel="stylesheet" href="../colors_and_type.css">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: var(--font-body, system-ui, sans-serif);
      background: var(--bone, #fafafa);
      color: var(--ink, #374151);
      line-height: 1.6;
    }

    .page {
      max-width: 1200px;
      margin: 0 auto;
      padding: 64px 32px;
    }

    /* ──── Header ──── */
    .header {
      margin-bottom: 80px;
    }

    .header__kicker {
      font-family: var(--font-mono, ui-monospace, monospace);
      font-size: 13px;
      font-weight: 500;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--slate, #666666);
      margin-bottom: 12px;
    }

    .header__title {
      font-family: var(--font-mono, ui-monospace, monospace);
      font-size: 64px;
      font-weight: 600;
      line-height: 1.0;
      letter-spacing: -0.01em;
      color: var(--ink, #374151);
      margin-bottom: 16px;
    }

    .header__title span {
      color: var(--signal, #ffd21e);
    }

    .header__subtitle {
      font-family: var(--font-body, system-ui, sans-serif);
      font-size: 18px;
      font-weight: 400;
      line-height: 1.6;
      color: var(--slate, #666666);
      max-width: 720px;
      margin-bottom: 24px;
    }

    .header__rule {
      display: block;
      width: 60px;
      height: 1px;
      background: var(--ink, #374151);
      border: none;
      margin-top: 32px;
    }

    /* ──── Section ──── */
    .section {
      margin-bottom: 80px;
    }

    .section__label {
      font-family: var(--font-mono, ui-monospace, monospace);
      font-size: 13px;
      font-weight: 500;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--slate, #666666);
      margin-bottom: 28px;
      padding-bottom: 12px;
      border-bottom: 1px solid var(--border, #e5e7eb);
    }

    /* ──── Key Characteristics ──── */
    .traits-list {
      list-style: none;
      padding: 0;
    }

    .traits-list li {
      position: relative;
      padding: 16px 0 16px 28px;
      font-family: var(--font-body, system-ui, sans-serif);
      font-size: 16px;
      font-weight: 400;
      line-height: 1.55;
      color: var(--ink, #374151);
      border-bottom: 1px solid var(--border, #e5e7eb);
    }

    .traits-list li:last-child {
      border-bottom: none;
    }

    .traits-list li::before {
      content: '🤗';
      position: absolute;
      left: 0;
      top: 16px;
      font-size: 18px;
    }

    /* ──── Do's and Don'ts ──── */
    .dd-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 32px;
    }

    @media (max-width: 768px) {
      .dd-grid {
        grid-template-columns: 1fr;
      }
    }

    .dd-card {
      background: var(--paper, #ffffff);
      border: 1px solid var(--border, #e5e7eb);
      border-radius: 8px;
      padding: 32px;
    }

    .dd-card__heading {
      font-family: var(--font-mono, ui-monospace, monospace);
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      margin-bottom: 20px;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .dd-card__heading--do {
      color: var(--ink, #374151);
    }

    .dd-card__heading--dont {
      color: var(--signal, #ffd21e);
    }

    .dd-card__icon {
      width: 20px;
      height: 20px;
      border-radius: 50%;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      font-size: 12px;
      flex-shrink: 0;
      border: 2px solid currentColor;
    }

    .dd-card__icon--do {
      color: var(--ink, #374151);
    }

    .dd-card__icon--dont {
      color: var(--signal, #ffd21e);
    }

    .dd-list {
      list-style: none;
      padding: 0;
    }

    .dd-list li {
      font-family: var(--font-body, system-ui, sans-serif);
      font-size: 15px;
      font-weight: 400;
      line-height: 1.55;
      color: var(--ink, #374151);
      padding: 12px 0;
      border-bottom: 1px solid var(--border, #e5e7eb);
    }

    .dd-list li:last-child {
      border-bottom: none;
    }

    /* ──── Color Harmony Strip ──── */
    .harmony-strip {
      display: flex;
      border-radius: 8px;
      overflow: hidden;
      height: 140px;
      border: 1px solid var(--border, #e5e7eb);
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    }

    .harmony-strip__swatch {
      flex: 1;
      position: relative;
      transition: flex 0.3s ease;
      cursor: default;
      display: flex;
      align-items: flex-end;
      justify-content: center;
      padding-bottom: 12px;
    }

    .harmony-strip__swatch:hover {
      flex: 1.4;
    }

    .harmony-strip__label {
      font-family: var(--font-mono, ui-monospace, monospace);
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      padding: 4px 8px;
      white-space: nowrap;
      opacity: 0.7;
      transition: opacity 0.2s ease;
    }

    .harmony-strip__swatch:hover .harmony-strip__label {
      opacity: 1;
    }

    /* ──── Type Pairing Demo ──── */
    .type-pairing {
      background: var(--paper, #ffffff);
      border: 1px solid var(--border, #e5e7eb);
      border-radius: 8px;
      padding: 48px 40px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    }

    .type-pairing__kicker {
      font-family: var(--font-mono, ui-monospace, monospace);
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--slate, #666666);
      margin-bottom: 12px;
    }

    .type-pairing__display {
      font-family: var(--font-mono, ui-monospace, monospace);
      font-size: 48px;
      font-weight: 600;
      line-height: 1.1;
      letter-spacing: -0.01em;
      color: var(--ink, #374151);
      margin-bottom: 20px;
    }

    .type-pairing__display span {
      color: var(--signal, #ffd21e);
    }

    .type-pairing__body {
      font-family: var(--font-body, system-ui, sans-serif);
      font-size: 16px;
      font-weight: 400;
      line-height: 1.6;
      color: var(--ink, #374151);
      max-width: 720px;
      margin-bottom: 28px;
    }

    .type-pairing__meta {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 24px;
      padding-top: 16px;
      border-top: 1px solid var(--border, #e5e7eb);
    }

    @media (max-width: 640px) {
      .type-pairing__meta {
        grid-template-columns: 1fr;
      }
    }

    .type-pairing__meta-item {
      font-family: var(--font-mono, ui-monospace, monospace);
      font-size: 12px;
      font-weight: 500;
      letter-spacing: 0.06em;
      color: var(--slate, #666666);
    }

    .type-pairing__meta-label {
      font-weight: 600;
      color: var(--ink, #374151);
      display: block;
      margin-bottom: 4px;
    }

    /* ──── Atmosphere Card ──── */
    .atmosphere-card {
      background: var(--paper, #ffffff);
      border: 1px solid var(--border, #e5e7eb);
      border-radius: 8px;
      padding: 32px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    }

    .atmosphere-card p {
      font-family: var(--font-body, system-ui, sans-serif);
      font-size: 16px;
      font-weight: 400;
      line-height: 1.6;
      color: var(--ink, #374151);
    }

    /* ──── Yellow Accent Rules ──── */
    .accent-rules {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 32px;
      margin-top: 24px;
    }

    @media (max-width: 768px) {
      .accent-rules {
        grid-template-columns: 1fr;
      }
    }

    .rule-slide {
      border: 2px solid var(--border, #e5e7eb);
      border-radius: 8px;
      aspect-ratio: 16 / 10;
      padding: 40px;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
    }

    .rule-slide--correct {
      background: var(--bone, #fafafa);
    }

    .rule-slide--incorrect {
      background: var(--bone, #fafafa);
    }

    .rule-slide__kicker {
      font-family: var(--font-mono, ui-monospace, monospace);
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--slate, #666666);
      margin-bottom: 12px;
    }

    .rule-slide__headline {
      font-family: var(--font-mono, ui-monospace, monospace);
      font-size: 36px;
      font-weight: 600;
      line-height: 1.1;
      letter-spacing: -0.01em;
      color: var(--ink, #374151);
      margin-bottom: 0;
    }

    .rule-slide__accent {
      color: var(--signal, #ffd21e);
    }

    .rule-slide__label {
      font-family: var(--font-mono, ui-monospace, monospace);
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--slate, #666666);
      margin-top: 24px;
      padding-top: 16px;
      border-top: 1px solid var(--border, #e5e7eb);
    }

    /* ──── Category Colors Demo ──── */
    .category-strip {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 16px;
      margin-top: 24px;
    }

    @media (max-width: 768px) {
      .category-strip {
        grid-template-columns: repeat(2, 1fr);
      }
    }

    .category-card {
      background: var(--paper, #ffffff);
      border: 1px solid var(--border, #e5e7eb);
      border-radius: 8px;
      padding: 20px;
      text-align: center;
    }

    .category-card__swatch {
      width: 100%;
      height: 60px;
      border-radius: 4px;
      margin-bottom: 12px;
      border: 1px solid rgba(0,0,0,0.1);
    }

    .category-card__label {
      font-family: var(--font-mono, ui-monospace, monospace);
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--ink, #374151);
    }

    /* ──── Loading ──── */
    .loading {
      text-align: center;
      padding: 120px 24px;
      color: var(--slate, #666666);
      font-size: 18px;
      font-family: var(--font-body, system-ui, sans-serif);
    }

    .loading::after {
      content: '';
      display: block;
      width: 32px;
      height: 32px;
      margin: 20px auto 0;
      border: 2px solid var(--border, #e5e7eb);
      border-top-color: var(--signal, #ffd21e);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div class="page" id="app">
    <div class="loading">Loading design tokens…</div>
  </div>

  <script>
    const CORE_COLOR_KEYS = ['paper', 'bone', 'ink', 'slate', 'signal', 'border'];
    const CATEGORY_COLORS = {
      'NLP Blue': '#2563eb',
      'Vision Green': '#16a34a',
      'Audio Purple': '#9333ea',
      'Multimodal Pink': '#db2777',
      'Tabular Orange': '#ea580c'
    };

    (window.__DESIGN_TOKENS__ ? Promise.resolve({ ok: true, json: () => Promise.resolve(window.__DESIGN_TOKENS__) }) : fetch('../tokens.json'))
      .then(r => {
        if (!r.ok) throw new Error('tokens.json not found (' + r.status + ')');
        return r.json();
      })
      .then(render)
      .catch(err => {
        document.getElementById('app').innerHTML =
          '<div class="loading" style="color:#dc2626">' +
          'Could not load tokens.json — ' + err.message + '</div>';
      });

    function render(tokens) {
      const app = document.getElementById('app');
      const colors = tokens.colors || {};
      const meta = tokens.meta || {};

      let html = '';

      /* ──── Header ──── */
      html += '<header class="header">';
      html += '  <div class="header__kicker">Brand Identity</div>';
      html += '  <h1 class="header__title">The <span>🤗</span> DNA</h1>';
      html += '  <p class="header__subtitle">Sunshine yellow, monospace-forward, unapologetically dense. A design system for a community platform built on git and open science.</p>';
      html += '  <hr class="header__rule">';
      html += '</header>';

      /* ──── Atmosphere ──── */
      html += '<div class="section">';
      html += '  <div class="section__label">Atmosphere</div>';
      html += '  <div class="atmosphere-card">';
      html += '    <p>Hugging Face refuses the serious-ML-lab aesthetic. Instead: sunshine yellow (#ffd21e) as punctuation, IBM Plex Mono in headings and tags, Source Sans Pro in body. The 🤗 emoji is a first-class citizen — it marks accomplishments, tags, errors, and navigation. Off-white canvas (#fafafa) with crisp 1px borders (#e5e7eb) and 4–8px radii. Tables are dense, row-hover in pale gray (#f3f4f6). Model categories carry their own hue (NLP = blue, Vision = green, Audio = purple). This is a brand for power users, not casual visitors. Config-file-as-README vibes: serious data, playful presentation.</p>';
      html += '  </div>';
      html += '</div>';

      /* ──── Key Characteristics ──── */
      html += '<div class="section">';
      html += '  <div class="section__label">Key Characteristics</div>';
      html += '  <ul class="traits-list">';
      html += '    <li>Sunshine yellow (#ffd21e) as the lone saturated accent — never as a surface</li>';
      html += '    <li>IBM Plex Mono for headings, tags, and kickers (config-file energy)</li>';
      html += '    <li>Source Sans Pro (or Inter) for body text, dense and readable</li>';
      html += '    <li>Off-white canvas (#fafafa) with crisp 1px borders and 4–8px radii</li>';
      html += '    <li>Hugging-face emoji 🤗 used unironically as a system glyph</li>';
      html += '    <li>Five semantic category colors: NLP blue, Vision green, Audio purple, Multimodal pink, Tabular orange</li>';
      html += '    <li>Dense tables with row-hover in pale gray (#f3f4f6), power-user design</li>';
      html += '    <li>Accessible HF Gold (#917300) for yellow text on light backgrounds (WCAG AA)</li>';
      html += '    <li>Subtle elevation via 0 2px 8px rgba(0,0,0,0.08), never hard shadows</li>';
      html += '  </ul>';
      html += '</div>';

      /* ──── Do's and Don'ts ──── */
      html += '<div class="section">';
      html += '  <div class="section__label">Do\'s and Don\'ts</div>';
      html += '  <div class="dd-grid">';

      html += '  <div class="dd-card">';
      html += '    <div class="dd-card__heading dd-card__heading--do">';
      html += '      <span class="dd-card__icon dd-card__icon--do">✓</span> Do';
      html += '    </div>';
      html += '    <ul class="dd-list">';
      html += '      <li>Use yellow (#ffd21e) as highlights, accents, and badges</li>';
      html += '      <li>Use Accessible HF Gold (#917300) for yellow text on white</li>';
      html += '      <li>Use emoji 🤗 in chips, errors, success states, and celebrations</li>';
      html += '      <li>Pair monospace headings with sans-serif body for clarity</li>';
      html += '      <li>Use category colors (NLP, Vision, Audio, etc.) to tag model types</li>';
      html += '      <li>Build dense tables with 1px borders and row-hover states</li>';
      html += '      <li>Apply subtle elevation (0 2px 8px) to cards and modals</li>';
      html += '      <li>Use 4–8px radii for buttons and card corners</li>';
      html += '      <li>Write for power users: concise, technical, unadorned</li>';
      html += '    </ul>';
      html += '  </div>';

      html += '  <div class="dd-card">';
      html += '    <div class="dd-card__heading dd-card__heading--dont">';
      html += '      <span class="dd-card__icon dd-card__icon--dont">✕</span> Don\'t';
      html += '    </div>';
      html += '    <ul class="dd-list">';
      html += '      <li>Use yellow (#ffd21e) as text on white — it fails WCAG AA</li>';
      html += '      <li>Apply yellow as an entire surface or large background</li>';
      html += '      <li>Overuse emoji — one per element at most</li>';
      html += '      <li>Use rounded corners (border-radius > 8px) on core UI</li>';
      html += '      <li>Mix serif and sans-serif fonts in the same hierarchy level</li>';
      html += '      <li>Apply hard shadows or glassmorphism effects</li>';
      html += '      <li>Use colors outside the semantic palette (no random gradients)</li>';
      html += '      <li>Write marketing copy — keep it technical and direct</li>';
      html += '      <li>Create extra whitespace — this is a community hub, not a gallery</li>';
      html += '    </ul>';
      html += '  </div>';

      html += '  </div>';
      html += '</div>';

      /* ──── Color Harmony Strip ──── */
      const harmonyKeys = CORE_COLOR_KEYS.filter(k => colors[k]);
      if (harmonyKeys.length) {
        html += '<div class="section">';
        html += '  <div class="section__label">Color Harmony</div>';
        html += '  <div class="harmony-strip">';

        harmonyKeys.forEach(key => {
          const hex = colors[key];
          const lum = relativeLuminance(hex);
          const labelColor = lum > 0.5 ? '#374151' : '#f9fafb';
          html += '<div class="harmony-strip__swatch" style="background:' + esc(hex) + '">';
          html += '  <span class="harmony-strip__label" style="color:' + labelColor + '">' + esc(key.toUpperCase()) + '</span>';
          html += '</div>';
        });

        html += '  </div>';
        html += '</div>';
      }

      /* ──── Category Colors ──── */
      html += '<div class="section">';
      html += '  <div class="section__label">Semantic Category Colors</div>';
      html += '  <p style="font-family: var(--font-body); font-size: 15px; line-height: 1.6; color: var(--slate); margin-bottom: 24px; max-width: 840px;">Model types and tasks carry their own hue. NLP = blue, Vision = green, Audio = purple, Multimodal = pink, Tabular = orange. These semantic colors appear in tags, badges, and row accents.</p>';
      html += '  <div class="category-strip">';

      Object.entries(CATEGORY_COLORS).forEach(([label, hex]) => {
        html += '<div class="category-card">';
        html += '  <div class="category-card__swatch" style="background:' + esc(hex) + '"></div>';
        html += '  <div class="category-card__label">' + esc(label) + '</div>';
        html += '  <div style="font-family: var(--font-mono); font-size: 11px; color: var(--slate); margin-top: 4px;">' + esc(hex) + '</div>';
        html += '</div>';
      });

      html += '  </div>';
      html += '</div>';

      /* ──── Typography Pairing ──── */
      html += '<div class="section">';
      html += '  <div class="section__label">Typography Pairing</div>';
      html += '  <div class="type-pairing">';

      html += '    <div class="type-pairing__kicker">Mono + Sans</div>';
      html += '    <div class="type-pairing__display">Mono headings + <span>sans body</span></div>';

      html += '    <div class="type-pairing__body">IBM Plex Mono drives headlines and tags — it reads like a config file, fitting for a platform built on git. Source Sans Pro carries body paragraphs, dense and purposeful. The contrast between rigid monospace and smooth sans gives every page a technical-yet-approachable feel. Headings lock at 600 weight. Body breathing at 1.6 line height. This pairing is the visual signature of the community platform.</div>';

      html += '    <div class="type-pairing__meta">';
      html += '      <div class="type-pairing__meta-item">';
      html += '        <span class="type-pairing__meta-label">Display Font</span>';
      html += '        IBM Plex Mono, 600 weight';
      html += '      </div>';
      html += '      <div class="type-pairing__meta-item">';
      html += '        <span class="type-pairing__meta-label">Body Font</span>';
      html += '        Source Sans Pro, 400 weight';
      html += '      </div>';
      html += '      <div class="type-pairing__meta-item">';
      html += '        <span class="type-pairing__meta-label">Use Case</span>';
      html += '        Community hub for power users';
      html += '      </div>';
      html += '    </div>';
      html += '  </div>';
      html += '</div>';

      /* ──── The Yellow Accent Rule ──── */
      html += '<div class="section">';
      html += '  <div class="section__label">The Yellow Accent Rule</div>';
      html += '  <p style="font-family: var(--font-body); font-size: 15px; line-height: 1.6; color: var(--slate); margin-bottom: 24px; max-width: 840px;">Yellow (#ffd21e) appears as punctuation: a badge, a highlight, a tag border, an icon background. Never as a large surface or primary CTA button. Use Accessible HF Gold (#917300) when yellow text must appear on white.</p>';
      html += '  <div class="accent-rules">';

      html += '    <div class="rule-slide rule-slide--correct">';
      html += '      <div class="rule-slide__kicker">Correct</div>';
      html += '      <div class="rule-slide__headline">Yellow as <span class="rule-slide__accent">punctuation</span></div>';
      html += '      <div class="rule-slide__label">Badges, highlights, accents. Precise and purposeful.</div>';
      html += '    </div>';

      html += '    <div class="rule-slide rule-slide--incorrect">';
      html += '      <div class="rule-slide__kicker">Incorrect</div>';
      html += '      <div style="font-size: 20px; font-family: var(--font-mono); color: var(--signal); margin-bottom: 12px; font-weight: 600;">Large yellow background</div>';
      html += '      <div class="rule-slide__headline">Overwhelms the <span class="rule-slide__accent">hierarchy</span></div>';
      html += '      <div class="rule-slide__label">Yellow only as punctuation, never as a large surface.</div>';
      html += '    </div>';

      html += '  </div>';
      html += '</div>';

      /* ──── Type Ramp Section ──── */
      html += '<div class="section">';
      html += '  <div class="section__label">Type Ramp & Roles</div>';
      html += '  <div style="border: 1px solid var(--border); border-radius: 8px; padding: 32px; background: var(--paper); box-shadow: 0 2px 8px rgba(0,0,0,0.08);">';

      const ramp = [
        { role: 'Display', size: '48px', weight: '600', lineHeight: '1.1', font: 'IBM Plex Mono', example: 'Platform hero headline' },
        { role: 'H1', size: '32px', weight: '600', lineHeight: '1.2', font: 'IBM Plex Mono', example: 'Main page heading' },
        { role: 'H2', size: '24px', weight: '600', lineHeight: '1.25', font: 'IBM Plex Mono', example: 'Section title' },
        { role: 'H3', size: '18px', weight: '600', lineHeight: '1.3', font: 'IBM Plex Mono', example: 'Subsection heading' },
