<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Color Palette — IBM</title>
  <link rel="stylesheet" href="../colors_and_type.css">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: var(--font-body, 'system-ui', sans-serif);
      background: var(--paper, #ffffff);
      color: var(--ink, #161616);
      line-height: 1.6;
      padding: 0;
    }

    .page {
      max-width: 1200px;
      margin: 0 auto;
      padding: 64px 32px;
    }

    /* Header / Stage head */
    .header {
      margin-bottom: 72px;
      border-bottom: 2px solid var(--ink, #161616);
      padding-bottom: 32px;
    }

    .header__kicker {
      font-family: var(--font-mono, 'IBM Plex Mono', monospace);
      font-size: 12px;
      font-weight: 500;
      letter-spacing: 0.32px;
      text-transform: uppercase;
      color: var(--slate, #525252);
      margin-bottom: 12px;
    }

    .header__title {
      font-family: var(--font-display, 'system-ui', sans-serif);
      font-size: 72px;
      font-weight: 300;
      line-height: 0.95;
      letter-spacing: -0.01em;
      color: var(--ink, #161616);
      margin-bottom: 8px;
    }

    .header__subtitle {
      font-family: var(--font-body, 'system-ui', sans-serif);
      font-size: 18px;
      line-height: 1.55;
      color: var(--slate, #525252);
      max-width: 720px;
      margin-bottom: 16px;
    }

    .header__meta {
      font-family: var(--font-mono, 'IBM Plex Mono', monospace);
      font-size: 12px;
      font-weight: 400;
      letter-spacing: 0.16px;
      color: var(--slate, #525252);
      text-transform: uppercase;
    }

    /* Section labels */
    .section-label {
      font-family: var(--font-mono, 'IBM Plex Mono', monospace);
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 0.32px;
      text-transform: uppercase;
      color: var(--slate, #525252);
      margin-bottom: 32px;
      padding-bottom: 16px;
      border-bottom: 1px solid var(--border, #c6c6c6);
    }

    /* Swatch grid */
    .swatch-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 24px;
      margin-bottom: 64px;
    }

    .swatch {
      background: var(--paper, #ffffff);
      border: 1px solid var(--border, #c6c6c6);
      border-radius: 0;
      overflow: hidden;
      transition: border-color 0.2s ease;
    }

    .swatch:hover {
      border-color: var(--signal, #0f62fe);
    }

    .swatch__chip {
      width: 100%;
      aspect-ratio: 4 / 3;
      position: relative;
    }

    .swatch__chip-contrast {
      position: absolute;
      bottom: 10px;
      right: 12px;
      font-family: var(--font-mono, 'IBM Plex Mono', monospace);
      font-size: 11px;
      font-weight: 600;
      padding: 4px 12px;
      border-radius: 0;
      line-height: 1.4;
      text-transform: uppercase;
    }

    .swatch__meta {
      padding: 18px 20px 20px;
    }

    .swatch__var {
      font-family: var(--font-mono, 'IBM Plex Mono', monospace);
      font-size: 12px;
      font-weight: 500;
      color: var(--ink, #161616);
      word-break: break-all;
      margin-bottom: 6px;
      letter-spacing: 0.16px;
    }

    .swatch__hex {
      font-family: var(--font-mono, 'IBM Plex Mono', monospace);
      font-size: 11px;
      color: var(--slate, #525252);
      margin-bottom: 8px;
      text-transform: uppercase;
      letter-spacing: 0.16px;
    }

    .swatch__role {
      font-family: var(--font-body, 'system-ui', sans-serif);
      font-size: 14px;
      line-height: 1.43;
      color: var(--ink, #161616);
      margin-bottom: 8px;
    }

    .swatch__contrast-label {
      font-family: var(--font-mono, 'IBM Plex Mono', monospace);
      font-size: 11px;
      font-weight: 600;
      margin-top: 8px;
      letter-spacing: 0.16px;
      text-transform: uppercase;
    }

    .contrast-pass { color: #24a148; }
    .contrast-fail { color: #da1e28; }
    .contrast-aa-large { color: #f1c21b; }

    /* Chip contrast badge styling */
    .chip-badge {
      border-radius: 0;
      font-weight: 600;
      display: inline-block;
    }

    /* Usage pattern section */
    .usage-section {
      margin-bottom: 64px;
      padding: 40px;
      background: var(--bone, #f4f4f4);
      border: 1px solid var(--border, #c6c6c6);
      border-radius: 0;
    }

    .usage-section h2 {
      font-family: var(--font-display, 'system-ui', sans-serif);
      font-size: 48px;
      font-weight: 300;
      line-height: 1.17;
      letter-spacing: 0;
      color: var(--ink, #161616);
      margin-bottom: 24px;
    }

    .usage-section p {
      font-family: var(--font-body, 'system-ui', sans-serif);
      font-size: 16px;
      line-height: 1.5;
      color: var(--ink, #161616);
      margin-bottom: 24px;
      max-width: 720px;
    }

    .rule-of-one {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 32px;
      margin-top: 32px;
      align-items: start;
    }

    .rule-example {
      padding: 24px;
      background: var(--paper, #ffffff);
      border: 1px solid var(--border, #c6c6c6);
      border-radius: 0;
    }

    .rule-example h3 {
      font-family: var(--font-display, 'system-ui', sans-serif);
      font-size: 28px;
      font-weight: 400;
      line-height: 1.33;
      color: var(--ink, #161616);
      margin-bottom: 12px;
    }

    .rule-example p {
      font-family: var(--font-body, 'system-ui', sans-serif);
      font-size: 14px;
      line-height: 1.43;
      color: var(--slate, #525252);
      margin-bottom: 0;
      letter-spacing: 0.16px;
    }

    .correct {
      border: 2px solid #24a148;
    }

    .correct::before {
      content: '✓ CORRECT';
      display: block;
      font-family: var(--font-mono, 'IBM Plex Mono', monospace);
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.32px;
      color: #24a148;
      text-transform: uppercase;
      margin-bottom: 12px;
      padding-bottom: 12px;
      border-bottom: 1px solid #24a148;
    }

    .incorrect {
      border: 2px solid #da1e28;
    }

    .incorrect::before {
      content: '✗ INCORRECT';
      display: block;
      font-family: var(--font-mono, 'IBM Plex Mono', monospace);
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.32px;
      color: #da1e28;
      text-transform: uppercase;
      margin-bottom: 12px;
      padding-bottom: 12px;
      border-bottom: 1px solid #da1e28;
    }

    .signal-demo {
      font-size: 16px;
      line-height: 1.5;
    }

    .signal-demo .drop-cap {
      font-family: var(--font-display, 'system-ui', sans-serif);
      font-size: 72px;
      font-weight: 300;
      color: var(--signal, #0f62fe);
      float: left;
      line-height: 0.75;
      padding-right: 8px;
      margin-top: 2px;
    }

    .signal-demo em {
      color: var(--signal, #0f62fe);
      font-style: italic;
    }

    /* WCAG summary */
    .wcag-summary {
      margin-top: 64px;
      padding: 40px;
      background: var(--bone, #f4f4f4);
      border: 1px solid var(--border, #c6c6c6);
      border-radius: 0;
    }

    .wcag-summary h2 {
      font-family: var(--font-display, 'system-ui', sans-serif);
      font-size: 48px;
      font-weight: 300;
      line-height: 1.17;
      letter-spacing: 0;
      margin-bottom: 24px;
      color: var(--ink, #161616);
    }

    .wcag-summary p {
      font-family: var(--font-body, 'system-ui', sans-serif);
      font-size: 14px;
      line-height: 1.43;
      color: var(--slate, #525252);
      margin-bottom: 24px;
      letter-spacing: 0.16px;
    }

    .wcag-row {
      display: flex;
      align-items: center;
      gap: 16px;
      padding: 12px 0;
      border-bottom: 1px solid var(--border, #c6c6c6);
      font-family: var(--font-body, 'system-ui', sans-serif);
      font-size: 14px;
      letter-spacing: 0.16px;
    }

    .wcag-row:last-child { border-bottom: none; }

    .wcag-badge {
      display: inline-block;
      padding: 6px 12px;
      border-radius: 0;
      font-family: var(--font-mono, 'IBM Plex Mono', monospace);
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.16px;
      min-width: 80px;
      text-align: center;
    }

    .wcag-badge--pass { background: var(--paper, #ffffff); color: #24a148; border: 1px solid #24a148; }
    .wcag-badge--fail { background: var(--paper, #ffffff); color: #da1e28; border: 1px solid #da1e28; }
    .wcag-badge--aa-large { background: var(--paper, #ffffff); color: #f1c21b; border: 1px solid #f1c21b; }

    /* Loading state */
    .loading {
      text-align: center;
      padding: 80px 24px;
      color: var(--slate, #525252);
      font-family: var(--font-body, 'system-ui', sans-serif);
      font-size: 16px;
    }

    .loading::after {
      content: '';
      display: block;
      width: 32px;
      height: 32px;
      margin: 24px auto 0;
      border: 2px solid var(--slate, #525252);
      border-top-color: var(--signal, #0f62fe);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    /* Responsive */
    @media (max-width: 768px) {
      .page { padding: 48px 20px; }
      .header { padding-bottom: 24px; margin-bottom: 48px; }
      .header__title { font-size: 48px; }
      .swatch-grid { grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 16px; }
      .rule-of-one { grid-template-columns: 1fr; gap: 16px; }
      .usage-section { padding: 24px; }
    }
  </style>
</head>
<body>
  <div class="page" id="app">
    <div class="loading">Loading design tokens&hellip;</div>
  </div>

  <script>
    /* ───────────────────────────────────────────────────────────── */
    /* Contrast ratio calculation (WCAG 2.1 relative luminance)      */
    /* ───────────────────────────────────────────────────────────── */
    function hexToRgb(hex) {
      hex = hex.replace(/^#/, '');
      if (hex.length === 3) hex = hex.split('').map(c => c + c).join('');
      const n = parseInt(hex, 16);
      return [(n >> 16) & 255, (n >> 8) & 255, n & 255];
    }

    function luminance([r, g, b]) {
      const [rs, gs, bs] = [r, g, b].map(c => {
        c /= 255;
        return c <= 0.03928 ? c / 12.92 : Math.pow((c + 0.055) / 1.055, 2.4);
      });
      return 0.2126 * rs + 0.7152 * gs + 0.0722 * bs;
    }

    function contrastRatio(hex1, hex2) {
      const l1 = luminance(hexToRgb(hex1));
      const l2 = luminance(hexToRgb(hex2));
      const lighter = Math.max(l1, l2);
      const darker = Math.min(l1, l2);
      return (lighter + 0.05) / (darker + 0.05);
    }

    function wcagLevel(ratio) {
      if (ratio >= 7) return { label: 'AAA', cls: 'pass' };
      if (ratio >= 4.5) return { label: 'AA', cls: 'pass' };
      if (ratio >= 3) return { label: 'AA Large', cls: 'aa-large' };
      return { label: 'Fail', cls: 'fail' };
    }

    /* ───────────────────────────────────────────────────────────── */
    /* Core color roles and descriptions                             */
    /* ───────────────────────────────────────────────────────────── */
    const CORE_ROLES = {
      paper:  'Page background. Clean white canvas.',
      ink:    'Primary text, headings, dark UI chrome.',
      slate:  'Secondary text, helper text, descriptions.',
      signal: 'IBM Blue 60. Interactive elements, links, buttons, focus states.',
      bone:   'Secondary surface background, card fills, alternating rows.',
      border: 'Borders, divider lines, input bottom-borders.',
      surface: 'Card and container surfaces, equals paper in light theme.',
    };

    /* ───────────────────────────────────────────────────────────── */
    /* Render from tokens.json                                       */
    /* ───────────────────────────────────────────────────────────── */
    (window.__DESIGN_TOKENS__ 
      ? Promise.resolve({ ok: true, json: () => Promise.resolve(window.__DESIGN_TOKENS__) }) 
      : fetch('../tokens.json'))
      .then(r => {
        if (!r.ok) throw new Error('tokens.json not found (' + r.status + ')');
        return r.json();
      })
      .then(render)
      .catch(err => {
        document.getElementById('app').innerHTML =
          '<div class="loading" style="color:var(--signal,#0f62fe)">' +
          'Could not load tokens.json — ' + err.message + '</div>';
      });

    function render(tokens) {
      const app = document.getElementById('app');
      const rawColors = tokens.colors || {};
      const paperHex = rawColors.paper || '#ffffff';

      /* Flatten nested color structure */
      const colors = {};
      for (const [k, v] of Object.entries(rawColors)) {
        if (typeof v === 'string') {
          colors[k] = v;
        } else if (v && typeof v === 'object') {
          for (const [sk, sv] of Object.entries(v)) {
            if (typeof sv === 'string') colors[k + '-' + sk] = sv;
          }
        }
      }

      /* Split core and extended */
      const coreKeys = Object.keys(CORE_ROLES).filter(k => colors[k]);
      const extendedKeys = Object.keys(colors)
        .filter(k => !CORE_ROLES[k] && typeof colors[k] === 'string')
        .sort();

      let html = '';

      /* ─ Stage head header ─ */
      html += '<header class="header">';
      html += '  <div class="header__kicker">Color System</div>';
      html += '  <h1 class="header__title">White and<br>Blue 60</h1>';
      html += '  <p class="header__subtitle">IBM\'s enterprise palette. Stark duality of bright white canvas with near-black text, punctuated by a single unwavering accent—IBM Blue 60. No shadows, no decoration. Pure structure.</p>';
      html += '  <div class="header__meta">Core Palette + Extended Gray Scale + Semantic Status &mdash; ' + (coreKeys.length + extendedKeys.length) + ' Tokens</div>';
      html += '</header>';

      /* ─ Core Palette ─ */
      if (coreKeys.length) {
        html += '<div class="section-label">Core Palette</div>';
        html += '<div class="swatch-grid">';
        coreKeys.forEach(key => {
          html += swatchCard(key, colors[key], paperHex, CORE_ROLES[key]);
        });
        html += '</div>';
      }

      /* ─ Extended Palette ─ */
      if (extendedKeys.length) {
        html += '<div class="section-label">Extended Palette</div>';
        html += '<div class="swatch-grid">';
        extendedKeys.forEach(key => {
          const role = formatRole(key);
          html += swatchCard(key, colors[key], paperHex, role);
        });
        html += '</div>';
      }

      /* ─ One Accent Rule ─ */
      html += oneAccentSection(paperHex);

      /* ─ WCAG Summary ─ */
      html += wcagSummary(colors, paperHex);

      app.innerHTML = html;
    }

    /* ───────────────────────────────────────────────────────────── */
    /* Swatch card builder                                           */
    /* ───────────────────────────────────────────────────────────── */
    function swatchCard(key, hex, paperHex, role) {
      const ratio = contrastRatio(hex, paperHex);
      const level = wcagLevel(ratio);
      const lum = luminance(hexToRgb(hex));
      const chipTextColor = lum > 0.5 ? '#161616' : '#ffffff';
      const chipBadgeBg = lum > 0.5 ? 'rgba(22,22,22,0.15)' : 'rgba(255,255,255,0.25)';

      return '' +
        '<div class="swatch">' +
        '  <div class="swatch__chip" style="background:' + hex + '">' +
        '    <span class="swatch__chip-contrast chip-badge" style="color:' + chipTextColor +
             ';background:' + chipBadgeBg + '">' + ratio.toFixed(2) + ':1</span>' +
        '  </div>' +
        '  <div class="swatch__meta">' +
        '    <div class="swatch__var">--' + esc(key) + '</div>' +
        '    <div class="swatch__hex">' + esc(hex.toUpperCase()) + '</div>' +
        '    <div class="swatch__role">' + esc(role) + '</div>' +
        '    <div class="swatch__contrast-label contrast-' + level.cls + '">' +
             'WCAG ' + level.label + '</div>' +
        '  </div>' +
        '</div>';
    }

    /* ───────────────────────────────────────────────────────────── */
    /* One Accent Rule — Blue 60 as the singular interactive color   */
    /* ───────────────────────────────────────────────────────────── */
    function oneAccentSection(paperHex) {
      let html = '<section class="usage-section">';
      html += '<h2>Blue 60 as Singular Accent</h2>';
      html += '<p>IBM Blue 60 (#0f62fe) is the only chromatic hue in the core UI palette. Every interactive element—button, link, focus ring, active indicator—references this single blue. No secondary colors. No tinted accents. This constraint enforces clarity in enterprise interfaces where users must distinguish actionable elements from passive content at a glance.</p>';

      html += '<div class="rule-of-one">';

      /* Correct example */
      html += '<div class="rule-example correct">';
      html += '<h3>Monochromatic with Blue</h3>';
      html += '<p class="signal-demo">';
      html += '<span class="drop-cap">C</span>';
      html += 'arbon components layer white, grays, and blue. No red, no green—only the neutral scale supporting one signal accent. Links are <em>blue</em>. Focus rings are <em>blue</em>. Buttons are <em>blue</em>. The system is coherent.';
      html += '</p>';
      html += '</div>';

      /* Incorrect example */
      html += '<div class="rule-example incorrect">';
      html += '<h3>Multiple Chromatic Accents</h3>';
      html += '<p>';
      html += 'A red error badge, a green success indicator, an orange warning label, and blue links all competing for attention. In enterprise dashboards with real-time alerts, this chromatic scatter creates cognitive overload. Meaning diffuses. IBM\'s constraint prevents this visual chaos.';
      html += '</p>';
      html += '</div>';

      html += '</div>';
      html += '</section>';
      return html;
    }

    /* ───────────────────────────────────────────────────────────── */
    /* WCAG compliance summary                                       */
    /* ───────────────────────────────────────────────────────────── */
    function wcagSummary(colors, paperHex) {
      const keys = Object.keys(colors);
      let passAAA = 0, passAA = 0, passAALarge = 0, fail = 0;

      keys.forEach(k => {
        const ratio = contrastRatio(colors[k], paperHex);
        if (ratio >= 7) passAAA++;
        else if (ratio >= 4.5) passAA++;
        else if (ratio >= 3) passAALarge++;
        else fail++;
      });

      let html = '<div class="wcag-summary">';
      html += '<h2>WCAG 2.1 Compliance</h2>';
      html += '<p>Contrast ratios measured against the paper background (#FFFFFF). IBM\'s blue-and-white palette achieves AAA compliance for all body text and interactive elements. Signal accents like status colors (green, yellow, red) are supported by icon glyphs and supporting text to ensure meaning is not conveyed by color alone.</p>';
      html += row('AAA (7:1+)', passAAA, 'pass');
      html += row('AA (4.5:1+)', passAA, 'pass');
      html += row('AA Large Text (3:1+)', passAALarge, 'aa-large');
      html += row('Below threshold', fail, fail > 0 ? 'fail' : 'pass');
      html += '</div>';
      return html;

      function row(label, count, badge) {
        return '<div class="wcag-row">' +
               '<span class="wcag-badge wcag-badge--' + badge + '">' + count + '</span>' +
               '<span>' + label + '</span>' +
               '</div>';
      }
    }

    /* ───────────────────────────────────────────────────────────── */
    /* Utilities                                                      */
    /* ───────────────────────────────────────────────────────────── */
    function esc(s) {
      const d = document.createElement('div');
      d.textContent = String(s);
      return d.innerHTML;
    }

    function formatRole(key) {
      return key
        .replace(/([A-Z])/g, ' $1')
        .replace(/[-_]/g, ' ')
        .replace(/\b\w/g, c => c.toUpperCase())
        .trim();
    }
  </script>
</body>
</html>
