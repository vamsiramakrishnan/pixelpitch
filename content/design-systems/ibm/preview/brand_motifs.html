<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Brand Motifs — IBM</title>
  <link rel="stylesheet" href="../colors_and_type.css">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: var(--font-body, system-ui, sans-serif);
      background: var(--paper, #ffffff);
      color: var(--ink, #161616);
      line-height: 1.6;
    }

    .page {
      max-width: 1200px;
      margin: 0 auto;
      padding: 64px 32px;
    }

    /* ──── Header ──── */
    .header {
      margin-bottom: 80px;
    }

    .header__kicker {
      font-family: var(--font-mono, 'IBM Plex Mono', monospace);
      font-size: 13px;
      font-weight: 500;
      letter-spacing: 0.32px;
      text-transform: uppercase;
      color: var(--slate, #525252);
      margin-bottom: 12px;
    }

    .header__title {
      font-family: var(--font-display, system-ui, sans-serif);
      font-size: 60px;
      font-weight: 300;
      line-height: 1.17;
      letter-spacing: 0;
      color: var(--ink, #161616);
      margin-bottom: 16px;
    }

    .header__title span {
      color: var(--signal, #0f62fe);
    }

    .header__subtitle {
      font-family: var(--font-body, system-ui, sans-serif);
      font-size: 20px;
      font-weight: 400;
      line-height: 1.4;
      color: var(--slate, #525252);
      max-width: 720px;
      margin-bottom: 24px;
    }

    .header__rule {
      display: block;
      width: 80px;
      height: 2px;
      background: var(--ink, #161616);
      border: none;
      margin-top: 32px;
    }

    /* ──── Section ──── */
    .section {
      margin-bottom: 80px;
    }

    .section__label {
      font-family: var(--font-mono, 'IBM Plex Mono', monospace);
      font-size: 12px;
      font-weight: 500;
      letter-spacing: 0.32px;
      text-transform: uppercase;
      color: var(--slate, #525252);
      margin-bottom: 28px;
      padding-bottom: 12px;
      border-bottom: 2px solid var(--ink, #161616);
    }

    /* ──── Key Characteristics ──── */
    .traits-list {
      list-style: none;
      padding: 0;
    }

    .traits-list li {
      position: relative;
      padding: 16px 0 16px 24px;
      font-family: var(--font-body, system-ui, sans-serif);
      font-size: 16px;
      font-weight: 400;
      line-height: 1.5;
      color: var(--ink, #161616);
      border-bottom: 1px solid var(--bone, #f4f4f4);
    }

    .traits-list li:last-child {
      border-bottom: none;
    }

    .traits-list li::before {
      content: '';
      position: absolute;
      left: 0;
      top: 22px;
      width: 4px;
      height: 4px;
      border-radius: 0;
      background: var(--signal, #0f62fe);
    }

    /* ──── Do's and Don'ts ──── */
    .dd-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 32px;
    }

    @media (max-width: 768px) {
      .dd-grid {
        grid-template-columns: 1fr;
      }
    }

    .dd-card {
      background: var(--paper, #ffffff);
      border: 1px solid var(--border, #c6c6c6);
      border-radius: 0;
      padding: 32px;
    }

    .dd-card__heading {
      font-family: var(--font-mono, 'IBM Plex Mono', monospace);
      font-size: 12px;
      font-weight: 500;
      letter-spacing: 0.32px;
      text-transform: uppercase;
      margin-bottom: 20px;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .dd-card__heading--do {
      color: var(--ink, #161616);
    }

    .dd-card__heading--dont {
      color: var(--signal, #0f62fe);
    }

    .dd-card__icon {
      width: 18px;
      height: 18px;
      border-radius: 0;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-weight: 600;
      font-size: 11px;
      flex-shrink: 0;
      border: 2px solid currentColor;
    }

    .dd-card__icon--do {
      color: var(--ink, #161616);
    }

    .dd-card__icon--dont {
      color: var(--signal, #0f62fe);
    }

    .dd-list {
      list-style: none;
      padding: 0;
    }

    .dd-list li {
      font-family: var(--font-body, system-ui, sans-serif);
      font-size: 14px;
      font-weight: 400;
      letter-spacing: 0.16px;
      line-height: 1.29;
      color: var(--ink, #161616);
      padding: 12px 0;
      border-bottom: 1px solid var(--bone, #f4f4f4);
    }

    .dd-list li:last-child {
      border-bottom: none;
    }

    /* ──── Color Harmony Strip ──── */
    .harmony-strip {
      display: flex;
      border-radius: 0;
      overflow: hidden;
      height: 120px;
      border: 1px solid var(--border, #c6c6c6);
    }

    .harmony-strip__swatch {
      flex: 1;
      position: relative;
      transition: flex 0.3s ease;
      cursor: default;
      display: flex;
      align-items: flex-end;
      justify-content: center;
      padding-bottom: 12px;
    }

    .harmony-strip__swatch:hover {
      flex: 1.4;
    }

    .harmony-strip__label {
      font-family: var(--font-mono, 'IBM Plex Mono', monospace);
      font-size: 10px;
      font-weight: 500;
      letter-spacing: 0.16px;
      text-transform: uppercase;
      padding: 4px 8px;
      white-space: nowrap;
      opacity: 0.7;
      transition: opacity 0.2s ease;
    }

    .harmony-strip__swatch:hover .harmony-strip__label {
      opacity: 1;
    }

    /* ──── Type Pairing Demo ──── */
    .type-pairing {
      background: var(--bone, #f4f4f4);
      border: 1px solid var(--border, #c6c6c6);
      border-radius: 0;
      padding: 48px 40px;
    }

    .type-pairing__kicker {
      font-family: var(--font-mono, 'IBM Plex Mono', monospace);
      font-size: 12px;
      font-weight: 500;
      letter-spacing: 0.32px;
      text-transform: uppercase;
      color: var(--slate, #525252);
      margin-bottom: 12px;
    }

    .type-pairing__display {
      font-family: var(--font-display, system-ui, sans-serif);
      font-size: 48px;
      font-weight: 300;
      line-height: 1.17;
      letter-spacing: 0;
      color: var(--ink, #161616);
      margin-bottom: 20px;
    }

    .type-pairing__display span {
      color: var(--signal, #0f62fe);
    }

    .type-pairing__body {
      font-family: var(--font-body, system-ui, sans-serif);
      font-size: 16px;
      font-weight: 400;
      line-height: 1.5;
      color: var(--ink, #161616);
      max-width: 720px;
      margin-bottom: 28px;
    }

    .type-pairing__meta {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 24px;
      padding-top: 24px;
      border-top: 1px solid var(--border, #c6c6c6);
    }

    @media (max-width: 640px) {
      .type-pairing__meta {
        grid-template-columns: 1fr;
      }
    }

    .type-pairing__meta-item {
      font-family: var(--font-mono, 'IBM Plex Mono', monospace);
      font-size: 11px;
      font-weight: 500;
      letter-spacing: 0.16px;
      color: var(--slate, #525252);
    }

    .type-pairing__meta-label {
      font-weight: 600;
      color: var(--ink, #161616);
      display: block;
      margin-bottom: 4px;
      letter-spacing: 0;
    }

    /* ──── Atmosphere Card ──── */
    .atmosphere-card {
      background: var(--bone, #f4f4f4);
      border: 1px solid var(--border, #c6c6c6);
      border-radius: 0;
      padding: 32px;
      max-width: 840px;
    }

    .atmosphere-card p {
      font-family: var(--font-body, system-ui, sans-serif);
      font-size: 16px;
      font-weight: 400;
      line-height: 1.5;
      color: var(--ink, #161616);
    }

    /* ──── Carbon Grid Rule ──── */
    .grid-demo {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 32px;
      margin-top: 24px;
    }

    @media (max-width: 768px) {
      .grid-demo {
        grid-template-columns: 1fr;
      }
    }

    .grid-slide {
      border: 2px solid var(--border, #c6c6c6);
      border-radius: 0;
      aspect-ratio: 16 / 10;
      padding: 40px;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      background: var(--paper, #ffffff);
    }

    .grid-slide__kicker {
      font-family: var(--font-mono, 'IBM Plex Mono', monospace);
      font-size: 11px;
      font-weight: 500;
      letter-spacing: 0.32px;
      text-transform: uppercase;
      color: var(--slate, #525252);
      margin-bottom: 12px;
    }

    .grid-slide__headline {
      font-family: var(--font-display, system-ui, sans-serif);
      font-size: 36px;
      font-weight: 300;
      line-height: 1.19;
      letter-spacing: 0;
      color: var(--ink, #161616);
      margin-bottom: 0;
    }

    .grid-slide__accent {
      color: var(--signal, #0f62fe);
    }

    .grid-slide__label {
      font-family: var(--font-mono, 'IBM Plex Mono', monospace);
      font-size: 10px;
      font-weight: 500;
      letter-spacing: 0.16px;
      text-transform: uppercase;
      color: var(--slate, #525252);
      margin-top: 24px;
      padding-top: 16px;
      border-top: 1px solid var(--border, #c6c6c6);
    }

    /* ──── Token System Showcase ──── */
    .token-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 24px;
      margin-top: 24px;
    }

    .token-card {
      background: var(--bone, #f4f4f4);
      border: 1px solid var(--border, #c6c6c6);
      border-radius: 0;
      padding: 24px;
    }

    .token-card__label {
      font-family: var(--font-mono, 'IBM Plex Mono', monospace);
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.16px;
      text-transform: uppercase;
      color: var(--slate, #525252);
      margin-bottom: 12px;
      display: block;
    }

    .token-card__value {
      font-family: var(--font-mono, 'IBM Plex Mono', monospace);
      font-size: 12px;
      font-weight: 400;
      letter-spacing: 0;
      color: var(--ink, #161616);
      word-break: break-all;
      margin-bottom: 16px;
    }

    .token-card__swatch {
      width: 100%;
      height: 60px;
      border: 1px solid var(--border, #c6c6c6);
      border-radius: 0;
      margin-top: 16px;
    }

    /* ──── Component States ──── */
    .component-section {
      background: var(--bone, #f4f4f4);
      border: 1px solid var(--border, #c6c6c6);
      border-radius: 0;
      padding: 40px;
    }

    .component-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
      gap: 24px;
      margin-top: 24px;
    }

    .button-demo {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .button-demo__label {
      font-family: var(--font-mono, 'IBM Plex Mono', monospace);
      font-size: 11px;
      font-weight: 500;
      letter-spacing: 0.16px;
      text-transform: uppercase;
      color: var(--slate, #525252);
    }

    button {
      font-family: var(--font-body, system-ui, sans-serif);
      font-size: 14px;
      font-weight: 500;
      letter-spacing: 0.16px;
      padding: 10px 20px;
      border: none;
      border-radius: 12px;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .btn-primary {
      background: var(--signal, #0f62fe);
      color: var(--paper, #ffffff);
    }

    .btn-primary:hover {
      background: var(--color-blue-70, #0043ce);
    }

    .btn-primary:active {
      background: var(--color-blue-80, #002d9c);
    }

    .btn-secondary {
      background: transparent;
      color: var(--ink, #161616);
      border: 2px solid var(--ink, #161616);
    }

    .btn-secondary:hover {
      background: var(--bone, #f4f4f4);
    }

    .btn-ghost {
      background: transparent;
      color: var(--signal, #0f62fe);
      text-decoration: underline;
    }

    .btn-ghost:hover {
      color: var(--color-blue-70, #0043ce);
    }

    /* ──── Input Demo ──── */
    .input-demo {
      display: flex;
      flex-direction: column;
      gap: 20px;
      margin-top: 24px;
      max-width: 400px;
    }

    .input-group {
      position: relative;
    }

    .input-group label {
      display: block;
      font-family: var(--font-body, system-ui, sans-serif);
      font-size: 14px;
      font-weight: 500;
      letter-spacing: 0.16px;
      color: var(--ink, #161616);
      margin-bottom: 8px;
    }

    .input-group input {
      width: 100%;
      font-family: var(--font-body, system-ui, sans-serif);
      font-size: 14px;
      font-weight: 400;
      letter-spacing: 0.16px;
      padding: 12px 0;
      background: transparent;
      border: none;
      border-bottom: 2px solid var(--ink, #161616);
      transition: border-color 0.2s ease;
      color: var(--ink, #161616);
    }

    .input-group input:focus {
      outline: none;
      border-bottom-color: var(--signal, #0f62fe);
    }

    .input-group input::placeholder {
      color: var(--slate, #525252);
    }

    .input-group span {
      font-family: var(--font-mono, 'IBM Plex Mono', monospace);
      font-size: 11px;
      font-weight: 400;
      letter-spacing: 0.16px;
      color: var(--slate, #525252);
      display: block;
      margin-top: 6px;
    }

    /* ──── Type Ramp Table ──– */
    .type-table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 24px;
    }

    .type-table th,
    .type-table td {
      padding: 16px;
      text-align: left;
      border-bottom: 1px solid var(--bone, #f4f4f4);
    }

    .type-table th {
      background: var(--bone, #f4f4f4);
      font-family: var(--font-mono, 'IBM Plex Mono', monospace);
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.16px;
      text-transform: uppercase;
      color: var(--slate, #525252);
    }

    .type-table td {
      font-family: var(--font-body, system-ui, sans-serif);
      font-size: 14px;
      font-weight: 400;
      letter-spacing: 0.16px;
      color: var(--ink, #161616);
    }

    .type-table__demo {
      font-size: inherit;
    }

    /* ──── Loading ──── */
    .loading {
      text-align: center;
      padding: 120px 24px;
      color: var(--slate, #525252);
      font-size: 16px;
      font-family: var(--font-body, system-ui, sans-serif);
    }

    .loading::after {
      content: '';
      display: block;
      width: 32px;
      height: 32px;
      margin: 20px auto 0;
      border: 2px solid var(--bone, #f4f4f4);
      border-top-color: var(--signal, #0f62fe);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    /* ──── Utility ──── */
    .row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 32px;
      margin-top: 24px;
    }

    @media (max-width: 768px) {
      .row {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <div class="page" id="app">
    <div class="loading">Loading design tokens…</div>
  </div>

  <script>
    const CORE_COLOR_KEYS = ['paper', 'ink', 'slate', 'signal', 'bone', 'border'];

    (window.__DESIGN_TOKENS__ ? Promise.resolve({ ok: true, json: () => Promise.resolve(window.__DESIGN_TOKENS__) }) : fetch('../tokens.json'))
      .then(r => {
        if (!r.ok) throw new Error('tokens.json not found (' + r.status + ')');
        return r.json();
      })
      .then(render)
      .catch(err => {
        document.getElementById('app').innerHTML =
          '<div class="loading" style="color:#0f62fe">' +
          'Could not load tokens.json — ' + err.message + '</div>';
      });

    function render(tokens) {
      const app = document.getElementById('app');
      const colors = tokens.colors || {};
      const meta = tokens.meta || {};
      const extended = colors.extended || {};

      let html = '';

      /* ──── Header ──── */
      html += '<header class="header">';
      html += '  <div class="header__kicker">Brand Identity</div>';
      html += '  <h1 class="header__title">The <span>System</span> of IBM</h1>';
      html += '  <p class="header__subtitle">Enterprise precision through the Carbon Design System. A five-token palette, three-font hierarchy, and the methodical 8px grid. Every element is engineered, never arbitrary.</p>';
      html += '  <hr class="header__rule">';
      html += '</header>';

      /* ──── Atmosphere ──── */
      html += '<div class="section">';
      html += '  <div class="section__label">Atmosphere</div>';
      html += '  <div class="atmosphere-card">';
      html += '    <p>IBM operates on a stark duality: white canvas, near-black text, and a single unwavering accent — IBM Blue 60. This isn\'t playful minimalism; it\'s corporate precision rendered as code. Every element snaps to the 2x grid, every color maps to a semantic token (prefixed `--cds-`), every spacing value aligns to the 8px base unit. IBM Plex Sans at weight 300 creates unexpected airiness at display sizes, while weight 400 at 14px introduces micro-tracking (0.16px) that makes text feel engineered. Components are flat: no shadows on cards, no gradient backgrounds, no rounded buttons. Depth comes through background-color layering alone. Input fields use bottom-border only — never boxed. The system is uncompromising because enterprise requires it.</p>';
      html += '  </div>';
      html += '</div>';

      /* ──── Key Characteristics ──── */
      html += '<div class="section">';
      html += '  <div class="section__label">Key Characteristics</div>';
      html += '  <ul class="traits-list">';
      html += '    <li>White canvas (#FFFFFF) with near-black text (#161616) — maximum contrast, zero ambiguity</li>';
      html += '    <li>Five core tokens: paper, ink, slate, signal (Blue 60), bone (Gray 10) — nothing else in the core</li>';
      html += '    <li>IBM Plex Sans at weight 300 (Light) for display sizes 42px+ — intentional airiness</li>';
      html += '    <li>IBM Plex Sans at weight 400 for body sizes, weight 600 for emphasis — no weight 700</li>';
      html += '    <li>IBM Plex Mono for code, data, and technical labels — consistent 0.16px tracking at small sizes</li>';
      html += '    <li>Single accent color: IBM Blue 60 (#0F62FE) — every interactive element, every CTA</li>';
      html += '    <li>Carbon token system (`--cds-*`) naming convention — all semantic colors reference tokens</li>';
      html += '    <li>8px spacing grid with strict adherence — 2px and 4px for micro-adjustments only</li>';
      html += '    <li>Flat, borderless cards on Gray 10 (#F4F4F4) surface — depth via background layering, never shadows</li>';
      html += '    <li>Bottom-border inputs (not boxed) — the signature Carbon form pattern</li>';
      html += '    <li>0px border-radius on buttons and inputs — rectangles are the system identity</li>';
      html += '    <li>48px default button height with asymmetric padding — accommodates icons without distortion</li>';
      html += '  </ul>';
      html += '</div>';

      /* ──── Do's and Don'ts ──── */
      html += '<div class="section">';
      html += '  <div class="section__label">Do\'s and Don\'ts</div>';
      html += '  <div class="dd-grid">';

      html += '  <div class="dd-card">';
      html += '    <div class="dd-card__heading dd-card__heading--do">';
      html += '      <span class="dd-card__icon dd-card__icon--do">✓</span> Do';
      html += '    </div>';
      html += '    <ul class="dd-list">';
      html += '      <li>Use weight 300 (Light) on display sizes 42px+ — the lightness is intentional</li>';
      html += '      <li>Apply 0.16px letter-spacing on 14px body text and captions</li>';
      html += '      <li>Reference `--cds-*` token names when implementing components</li>';
      html += '      <li>Use background-color layering (white → gray 10 → gray 20) for depth</li>';
      html += '      <li>Use bottom-border (not box) for input field indicators</li>';
      html += '      <li>Keep buttons rectangular: 0px border-radius, 48px height standard</li>';
      html += '      <li>Use asymmetric padding on buttons to accommodate icons</li>';
      html += '      <li>Apply Blue 60 (#0F62FE) as the sole accent everywhere</li>';
      html += '      <li>Snap all spacing and sizing to the 8px grid base unit</li>';
      html += '    </ul>';
      html += '  </div>';

      html += '  <div class="dd-card">';
      html += '    <div class="dd-card__heading dd-card__heading--dont">';
      html += '      <span class="dd-card__icon dd-card__icon--dont">✕</span> Don\'t';
      html += '    </div>';
      html += '    <ul class="dd-list">';
      html += '      <li>Don\'t round button or input corners — 0px radius is the identity</li>';
      html += '      <li>Don\'t use box-shadow on cards or tiles — flatness is the point</li>';
      html += '      <li>Don\'t introduce accent colors beyond Blue 60 — IBM\'s system is monochromatic + one blue</li>';
      html += '      <li>Don\'t use weight 700 (Bold) — the scale stops at weight 600</li>';
      html += '      <li>Don\'t add letter-spacing to display-size text — tracking is only for 14px and below</li>';
      html += '      <li>Don\'t box inputs with full borders — Carbon inputs use bottom-border only</li>';
      html += '      <li>Don\'t use gradient backgrounds — IBM\'s surfaces are flat, solid colors</li>';
      html += '      <li>Don\'t deviate from the 8px spacing grid — all values should be divisible by 8 (or 2/4 for micro)</li>';
      html += '      <li>Don\'t use emoji, decorative icons, or hand-drawn elements — system design is geometric</li>';
      html += '    </ul>';
      html += '  </div>';

      html += '  </div>';
      html += '</div>';

      /* ──── The 8px Grid Rule ──── */
      html += '<div class="section">';
      html += '  <div class="section__label">The 8px Grid & Depth Model</div>';
      html += '  <p style="font-family: var(--font-body); font-size: 16px; line-height: 1.5; color: var(--slate); margin-bottom: 24px; max-width: 840px;">Carbon\'s foundation is the 2x 8px grid. Every margin, padding, and spacing value aligns to this base unit (or 2px/4px for micro-adjustments). Depth comes not from shadows, but from background-color layering: paper (#FFFFFF) → bone/Gray 10 (#F4F4F4) → Gray 20 (#E0E0E0). This layering creates visual hierarchy without atmospheric effects.</p>';
      html += '  <div class="grid-demo">';
