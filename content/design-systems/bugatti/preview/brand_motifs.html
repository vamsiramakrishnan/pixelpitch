<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Brand Motifs – Bugatti</title>
  <link rel="stylesheet" href="../colors_and_type.css">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: var(--font-body, system-ui, sans-serif);
      background: var(--paper, #000000);
      color: var(--signal, #ffffff);
      line-height: 1.6;
    }

    .page {
      max-width: 1200px;
      margin: 0 auto;
      padding: 96px 48px;
    }

    @media (max-width: 768px) {
      .page {
        padding: 64px 32px;
      }
    }

    /* Header */
    .header {
      margin-bottom: 96px;
    }

    .header__title {
      font-family: var(--font-display, system-ui, sans-serif);
      font-size: 144px;
      font-weight: 400;
      line-height: 1.0;
      letter-spacing: 0;
      color: var(--signal, #ffffff);
      margin-bottom: 24px;
      text-transform: uppercase;
    }

    .header__subtitle {
      font-family: var(--font-mono, ui-monospace, monospace);
      font-size: 14px;
      letter-spacing: 1.4px;
      text-transform: uppercase;
      color: var(--color-silver-mist, #999999);
      margin-bottom: 48px;
    }

    .header__rule {
      display: block;
      width: 64px;
      height: 1px;
      background: var(--signal, #ffffff);
      border: none;
      margin-top: 32px;
    }

    /* Section */
    .section {
      margin-bottom: 80px;
    }

    .section__label {
      font-family: var(--font-mono, ui-monospace, monospace);
      font-size: 12px;
      font-weight: 400;
      letter-spacing: 1.4px;
      text-transform: uppercase;
      color: var(--color-silver-mist, #999999);
      margin-bottom: 32px;
      padding-bottom: 16px;
      border-bottom: 1px solid var(--color-silver-mist, #999999);
    }

    /* Atmosphere card */
    .atmosphere-card {
      background: transparent;
      border: 1px solid var(--color-silver-mist, #999999);
      border-radius: 8px;
      padding: 48px 40px;
      max-width: 800px;
    }

    .atmosphere-card p {
      font-family: var(--font-body, system-ui, sans-serif);
      font-size: 18px;
      line-height: 1.6;
      color: var(--signal, #ffffff);
    }

    /* Key characteristics */
    .traits-list {
      list-style: none;
      padding: 0;
      max-width: 900px;
    }

    .traits-list li {
      position: relative;
      padding: 16px 0 16px 32px;
      font-family: var(--font-body, system-ui, sans-serif);
      font-size: 16px;
      line-height: 1.6;
      color: var(--signal, #ffffff);
      border-bottom: 1px solid var(--color-silver-mist, #999999);
    }

    .traits-list li:last-child {
      border-bottom: none;
    }

    .traits-list li::before {
      content: '';
      position: absolute;
      left: 0;
      top: 22px;
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--signal, #ffffff);
    }

    /* Do's and Don'ts */
    .dd-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 32px;
    }

    @media (max-width: 900px) {
      .dd-grid {
        grid-template-columns: 1fr;
      }
    }

    .dd-card {
      background: transparent;
      border: 1px solid var(--color-silver-mist, #999999);
      border-radius: 8px;
      padding: 40px;
      overflow: hidden;
    }

    .dd-card__heading {
      font-family: var(--font-mono, ui-monospace, monospace);
      font-size: 14px;
      font-weight: 400;
      letter-spacing: 1.4px;
      text-transform: uppercase;
      margin-bottom: 28px;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .dd-card__heading--do {
      color: var(--signal, #ffffff);
    }

    .dd-card__heading--dont {
      color: var(--signal, #ffffff);
    }

    .dd-card__icon {
      width: 20px;
      height: 20px;
      border-radius: 50%;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-weight: 400;
      font-size: 12px;
      flex-shrink: 0;
      border: 1px solid var(--signal, #ffffff);
    }

    .dd-card__icon--do {
      border-color: var(--signal, #ffffff);
      color: var(--signal, #ffffff);
    }

    .dd-card__icon--dont {
      border-color: var(--signal, #ffffff);
      color: var(--signal, #ffffff);
    }

    .dd-list {
      list-style: none;
      padding: 0;
    }

    .dd-list li {
      font-family: var(--font-body, system-ui, sans-serif);
      font-size: 15px;
      line-height: 1.7;
      color: var(--signal, #ffffff);
      padding: 12px 0;
      border-bottom: 1px solid var(--color-silver-mist, #999999);
    }

    .dd-list li:last-child {
      border-bottom: none;
    }

    /* Color harmony strip */
    .harmony-strip {
      display: flex;
      border-radius: 0;
      overflow: hidden;
      height: 120px;
      border: 1px solid var(--color-silver-mist, #999999);
      gap: 0;
    }

    .harmony-strip__swatch {
      flex: 1;
      position: relative;
      transition: flex 0.3s ease;
      cursor: default;
      border-right: 1px solid var(--paper, #000000);
    }

    .harmony-strip__swatch:last-child {
      border-right: none;
    }

    .harmony-strip__swatch:hover {
      flex: 1.5;
    }

    .harmony-strip__label {
      position: absolute;
      bottom: 12px;
      left: 50%;
      transform: translateX(-50%);
      font-family: var(--font-mono, ui-monospace, monospace);
      font-size: 11px;
      font-weight: 400;
      letter-spacing: 0.8px;
      padding: 4px 8px;
      border-radius: 2px;
      white-space: nowrap;
      opacity: 0;
      transition: opacity 0.2s ease;
      text-transform: uppercase;
    }

    .harmony-strip__swatch:hover .harmony-strip__label {
      opacity: 1;
    }

    /* Type pairing demo */
    .type-pairing {
      background: transparent;
      border: 1px solid var(--color-silver-mist, #999999);
      border-radius: 8px;
      padding: 64px 48px;
    }

    .type-pairing__display {
      font-family: var(--font-display, system-ui, sans-serif);
      font-size: 96px;
      font-weight: 400;
      line-height: 1.0;
      letter-spacing: 1.4px;
      color: var(--signal, #ffffff);
      margin-bottom: 32px;
      text-transform: uppercase;
    }

    .type-pairing__body {
      font-family: var(--font-body, system-ui, sans-serif);
      font-size: 18px;
      font-weight: 400;
      line-height: 1.6;
      color: var(--signal, #ffffff);
      max-width: 760px;
    }

    .type-pairing__meta {
      display: flex;
      gap: 48px;
      margin-top: 32px;
      padding-top: 24px;
      border-top: 1px solid var(--color-silver-mist, #999999);
    }

    .type-pairing__meta-item {
      font-family: var(--font-mono, ui-monospace, monospace);
      font-size: 12px;
      letter-spacing: 0.8px;
      color: var(--color-silver-mist, #999999);
    }

    .type-pairing__meta-label {
      font-weight: 400;
      color: var(--signal, #ffffff);
      text-transform: uppercase;
      letter-spacing: 1.2px;
    }

    /* Scale demonstration */
    .scale-demo {
      background: transparent;
      border: 1px solid var(--color-silver-mist, #999999);
      border-radius: 8px;
      padding: 48px;
      margin-bottom: 32px;
    }

    .scale-demo__item {
      margin-bottom: 56px;
    }

    .scale-demo__item:last-child {
      margin-bottom: 0;
    }

    .scale-demo__heading {
      font-family: var(--font-display, system-ui, sans-serif);
      font-weight: 400;
      line-height: 1.0;
      letter-spacing: 0;
      color: var(--signal, #ffffff);
      text-transform: uppercase;
      margin-bottom: 12px;
    }

    .scale-demo__label {
      font-family: var(--font-mono, ui-monospace, monospace);
      font-size: 11px;
      letter-spacing: 0.8px;
      text-transform: uppercase;
      color: var(--color-silver-mist, #999999);
    }

    .scale-demo--288 .scale-demo__heading {
      font-size: 288px;
    }

    .scale-demo--60 .scale-demo__heading {
      font-size: 60px;
    }

    .scale-demo--36 .scale-demo__heading {
      font-size: 36px;
    }

    /* Monospace showcase */
    .mono-showcase {
      background: transparent;
      border: 1px solid var(--color-silver-mist, #999999);
      border-radius: 8px;
      padding: 48px;
    }

    .mono-showcase__item {
      margin-bottom: 32px;
      padding-bottom: 24px;
      border-bottom: 1px solid var(--color-silver-mist, #999999);
    }

    .mono-showcase__item:last-child {
      margin-bottom: 0;
      padding-bottom: 0;
      border-bottom: none;
    }

    .mono-showcase__label {
      font-family: var(--font-mono, ui-monospace, monospace);
      font-size: 11px;
      letter-spacing: 0.8px;
      text-transform: uppercase;
      color: var(--color-silver-mist, #999999);
      margin-bottom: 8px;
    }

    .mono-showcase__example {
      font-family: var(--font-mono, ui-monospace, monospace);
      font-size: 14px;
      letter-spacing: 1.4px;
      text-transform: uppercase;
      color: var(--signal, #ffffff);
    }

    /* Color swatch detailed */
    .color-swatch {
      display: flex;
      gap: 20px;
      margin-bottom: 24px;
      align-items: center;
    }

    .color-swatch__box {
      width: 120px;
      height: 80px;
      border-radius: 8px;
      border: 1px solid var(--color-silver-mist, #999999);
      flex-shrink: 0;
    }

    .color-swatch__info {
      flex: 1;
    }

    .color-swatch__name {
      font-family: var(--font-mono, ui-monospace, monospace);
      font-size: 12px;
      font-weight: 400;
      letter-spacing: 1.2px;
      text-transform: uppercase;
      color: var(--signal, #ffffff);
      margin-bottom: 4px;
    }

    .color-swatch__value {
      font-family: var(--font-mono, ui-monospace, monospace);
      font-size: 12px;
      letter-spacing: 0;
      color: var(--color-silver-mist, #999999);
    }

    /* Loading state */
    .loading {
      text-align: center;
      padding: 120px 24px;
      color: var(--color-silver-mist, #999999);
      font-size: 14px;
      letter-spacing: 1.2px;
      text-transform: uppercase;
    }

    .loading::after {
      content: '';
      display: block;
      width: 32px;
      height: 32px;
      margin: 24px auto 0;
      border: 2px solid var(--color-silver-mist, #999999);
      border-top-color: var(--signal, #ffffff);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    /* Responsive */
    @media (max-width: 768px) {
      .header__title {
        font-size: 72px;
      }

      .scale-demo--288 .scale-demo__heading {
        font-size: 120px;
      }

      .type-pairing {
        padding: 40px 32px;
      }

      .type-pairing__display {
        font-size: 48px;
        margin-bottom: 24px;
      }

      .type-pairing__body {
        font-size: 16px;
      }

      .dd-grid {
        gap: 24px;
      }
    }
  </style>
</head>
<body>
  <div class="page" id="app">
    <div class="loading">Loading design tokens…</div>
  </div>

  <script>
    const CORE_COLOR_KEYS = ['paper', 'ink', 'slate', 'signal', 'bone', 'border', 'surface'];

    (window.__DESIGN_TOKENS__ ? Promise.resolve({ ok: true, json: () => Promise.resolve(window.__DESIGN_TOKENS__) }) : fetch('../tokens.json'))
      .then(r => {
        if (!r.ok) throw new Error('tokens.json not found (' + r.status + ')');
        return r.json();
      })
      .then(render)
      .catch(err => {
        document.getElementById('app').innerHTML =
          '<div class="loading" style="color:#ff6b6b">' +
          'Could not load tokens.json — ' + err.message + '</div>';
      });

    function render(tokens) {
      const app = document.getElementById('app');
      const meta = tokens.meta || {};
      const colors = tokens.colors || {};
      const fonts = tokens.typography || {};

      let html = '';

      /* Header */
      html += '<header class="header">';
      html += '  <h1 class="header__title">Brand Motifs</h1>';
      html += '  <p class="header__subtitle">Bugatti Design System</p>';
      html += '  <hr class="header__rule">';
      html += '</header>';

      /* Atmosphere */
      html += '<div class="section">';
      html += '  <div class="section__label">Atmosphere & Canvas</div>';
      html += '  <div class="atmosphere-card">';
      html += '    <p>Cinema-black canvas rendered at pure #000000. The entire page is a silent black velvet stage where product photography and video speak without distraction. No accent colors compete with the car. No gradient washes dilute the presentation. Only white typography, white outlines, and a single mid-gray (#999999) for disabled and tertiary states. This discipline creates a showroom experience where the vehicle itself becomes the only color in the room.</p>';
      html += '  </div>';
      html += '</div>';

      /* Key Characteristics */
      html += '<div class="section">';
      html += '  <div class="section__label">Key Characteristics</div>';
      html += '  <ul class="traits-list">';
      html += '    <li>Cinema-black #000000 canvas — pure black, never off-black or warm-tinted</li>';
      html += '    <li>Monumental 288px display headline at hero moments — architecture-scale typography</li>';
      html += '    <li>60px secondary display for major sections — feature-weight text</li>';
      html += '    <li>Monochromatic palette: black, white, and single #999999 gray for tertiary only</li>';
      html += '    <li>All-caps monospace UI labels with 1.2–1.4px letter-spacing on buttons, links, captions</li>';
      html += '    <li>Full-pill buttons (9999px radius) with 1px white border and transparent fill</li>';
      html += '    <li>Tight line-height (1.0–1.11) on display headlines for sculptural density</li>';
      html += '    <li>Full-bleed photography and video as primary UI — product speaks, chrome is silent</li>';
      html += '    <li>No drop shadows, no cards, no gradients, no glassmorphism anywhere</li>';
      html += '    <li>Generous cinematic whitespace — each block sits in its own silent room</li>';
      html += '  </ul>';
      html += '</div>';

      /* Do's and Don'ts */
      html += '<div class="section">';
      html += '  <div class="section__label">Do\'s and Don\'ts</div>';
      html += '  <div class="dd-grid">';

      html += '    <div class="dd-card">';
      html += '      <div class="dd-card__heading dd-card__heading--do">';
      html += '        <span class="dd-card__icon dd-card__icon--do">✓</span> Do';
      html += '      </div>';
      html += '      <ul class="dd-list">';
      html += '        <li>Keep canvas pure #000000 — no off-black, no warm tints</li>';
      html += '        <li>Use Bugatti Display at 36px minimum, 60px ideally, and one 200px+ hero moment</li>';
      html += '        <li>Use Bugatti Monospace ALL CAPS with 1.2–1.4px tracking for buttons and links</li>';
      html += '        <li>Render white text at rest; #999999 only for disabled and tertiary states</li>';
      html += '        <li>Use 9999px border-radius for pill buttons with 1px white outline</li>';
      html += '        <li>Lead with full-bleed video and photography — let the product be the hero</li>';
      html += '        <li>Maintain 1.0–1.11 line-height on display for tight, architectural feel</li>';
      html += '        <li>Treat whitespace as cinematic negative space — give blocks their own room</li>';
      html += '      </ul>';
      html += '    </div>';

      html += '    <div class="dd-card">';
      html += '      <div class="dd-card__heading dd-card__heading--dont">';
      html += '        <span class="dd-card__icon dd-card__icon--dont">✕</span> Don\'t';
      html += '      </div>';
      html += '      <ul class="dd-list">';
      html += '        <li>Introduce accent colors — no blue, no red, no commerce orange, no hover cyan</li>';
      html += '        <li>Use bold weights for hierarchy — scale is the only device, make it bigger</li>';
      html += '        <li>Add drop shadows to any element — Bugatti has zero box-shadow in chrome</li>';
      html += '        <li>Build card components or elevated surfaces — no depth fiction</li>';
      html += '        <li>Use radii between 6px and 9999px — stick to rectangle, utility-rounded, or full pill</li>';
      html += '        <li>Use Bugatti Display for body copy or UI labels — reserve for 36px+ headlines only</li>';
      html += '        <li>Write monospace in lowercase — buttons and nav are always ALL CAPS</li>';
      html += '        <li>Add gradients, glows, blurs, or glassmorphism — chrome must be silent</li>';
      html += '      </ul>';
      html += '    </div>';

      html += '  </div>';
      html += '</div>';

      /* Color Harmony */
      html += '<div class="section">';
      html += '  <div class="section__label">Color Palette</div>';
      html += '  <div class="harmony-strip">';
      const paletteKeys = ['paper', 'signal', 'bone'];
      paletteKeys.forEach(key => {
        const hex = colors[key];
        if (!hex) return;
        const labelColor = key === 'paper' ? '#ffffff' : '#000000';
        html += '    <div class="harmony-strip__swatch" style="background:' + esc(hex) + '">';
        html += '      <span class="harmony-strip__label" style="color:' + labelColor + '">' + esc(key) + '</span>';
        html += '    </div>';
      });
      html += '  </div>';
      html += '</div>';

      /* Detailed Color Swatches */
      html += '<div class="section">';
      html += '  <div class="section__label">Core Tokens</div>';
      html += '  <div class="color-swatch">';
      html += '    <div class="color-swatch__box" style="background: #000000; border: 1px solid #999999;"></div>';
      html += '    <div class="color-swatch__info">';
      html += '      <div class="color-swatch__name">Paper (Canvas)</div>';
      html += '      <div class="color-swatch__value">#000000</div>';
      html += '    </div>';
      html += '  </div>';
      html += '  <div class="color-swatch">';
      html += '    <div class="color-swatch__box" style="background: #ffffff; border: 1px solid #999999;"></div>';
      html += '    <div class="color-swatch__info">';
      html += '      <div class="color-swatch__name">Signal (Text, Border)</div>';
      html += '      <div class="color-swatch__value">#ffffff</div>';
      html += '    </div>';
      html += '  </div>';
      html += '  <div class="color-swatch">';
      html += '    <div class="color-swatch__box" style="background: #999999; border: 1px solid #999999;"></div>';
      html += '    <div class="color-swatch__info">';
      html += '      <div class="color-swatch__name">Silver Mist (Tertiary, Disabled)</div>';
      html += '      <div class="color-swatch__value">#999999</div>';
      html += '    </div>';
      html += '  </div>';
      html += '</div>';

      /* Typography Scale */
      html += '<div class="section">';
      html += '  <div class="section__label">Typography Scale</div>';
      html += '  <div class="scale-demo scale-demo--288">';
      html += '    <div class="scale-demo__item">';
      html += '      <div class="scale-demo__heading">Hero Display</div>';
      html += '      <div class="scale-demo__label">288px, Line Height 1.00, All Caps</div>';
      html += '    </div>';
      html += '  </div>';
      html += '  <div class="scale-demo scale-demo--60" style="margin-bottom: 32px;">';
      html += '    <div class="scale-demo__item">';
      html += '      <div class="scale-demo__heading">Feature Display</div>';
      html += '      <div class="scale-demo__label">60px, Line Height 1.00, All Caps</div>';
      html += '    </div>';
      html += '  </div>';
      html += '  <div class="scale-demo scale-demo--36">';
      html += '    <div class="scale-demo__item">';
      html += '      <div class="scale-demo__heading">Section Heading</div>';
      html += '      <div class="scale-demo__label">36px, Line Height 1.11</div>';
      html += '    </div>';
      html += '  </div>';
      html += '</div>';

      /* Type Pairing Demo */
      html += '<div class="section">';
      html += '  <div class="section__label">Typography Pairing</div>';
      html += '  <div class="type-pairing">';
      html += '    <div class="type-pairing__display">The Bugatti Way</div>';
      html += '    <div class="type-pairing__body">Typography is rendered at monumental scales. Display headlines at 288px sit like brand marks across the page, demanding space and silence. Body copy is set in a clean, legible sans-serif at 18px with generous line-height, letting white space breathe. Every monospace label is uppercase with tracked spacing, marking calls-to-action and navigation with architectural precision.</div>';
      html += '    <div class="type-pairing__meta">';
      html += '      <div class="type-pairing__meta-item"><span class="type-pairing__meta-label">Display:</span> Bugatti Display</div>';
      html += '      <div class="type-pairing__meta-item"><span class="type-pairing__meta-label">Body:</span> System Sans</div>';
      html += '      <div class="type-pairing__meta-item"><span class="type-pairing__meta-label">Mono:</span> UI Monospace</div>';
      html += '    </div>';
      html += '  </div>';
      html += '</div>';

      /* Monospace & UI */
      html += '<div class="section">';
      html += '  <div class="section__label">Monospace & UI Labels</div>';
      html += '  <div class="mono-showcase">';
      html += '    <div class="mono-showcase__item">';
      html += '      <div class="mono-showcase__label">Button Label – All Caps</div>';
      html += '      <div class="mono-showcase__example">Explore Our Opportunities</div>';
      html += '    </div>';
      html += '    <div class="mono-showcase__item">';
      html += '      <div class="mono-showcase__label">Navigation Link – Wide Tracking</div>';
      html += '      <div class="mono-showcase__example">Performance</div>';
      html += '    </div>';
      html += '    <div class="mono-showcase__item">';
      html += '      <div class="mono-showcase__label">Caption – Tracked</div>';
      html += '      <div class="mono-showcase__example">Top Speed: 270+ mph</div>';
      html += '    </div>';
      html += '    <div class="mono-showcase__item">';
      html += '      <div class="mono-showcase__label">Micro Label – Compact</div>';
      html += '      <div class="mono-showcase__example">Price on Request</div>';
      html += '    </div>';
      html += '  </div>';
      html += '</div>';

      app.innerHTML = html;
    }

    function esc(s) {
      const d = document.createElement('div');
      d.textContent = String(s);
      return d.innerHTML;
    }
  </script>
</body>
</html>
