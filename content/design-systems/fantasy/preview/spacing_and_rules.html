<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Spacing &amp; Rules — Fantasy</title>
  <link rel="stylesheet" href="../colors_and_type.css">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: var(--font-body, system-ui, sans-serif);
      background: var(--paper, #ffffff);
      color: var(--ink, #111111);
      line-height: 1.6;
    }

    .page {
      max-width: 1100px;
      margin: 0 auto;
      padding: 96px 64px;
    }

    /* Header / Stage head */
    .header {
      margin-bottom: 96px;
      position: relative;
    }

    .header__kicker {
      font-family: var(--font-mono, ui-monospace, monospace);
      font-size: 14px;
      font-weight: 500;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--slate, #666666);
      margin-bottom: 12px;
    }

    .header__title {
      font-family: var(--font-display, system-ui, sans-serif);
      font-size: 72px;
      font-weight: 700;
      line-height: 0.95;
      letter-spacing: -0.02em;
      color: var(--ink, #111111);
      margin-bottom: 8px;
      max-width: 90%;
    }

    .header__subtitle {
      font-family: var(--font-body, system-ui, sans-serif);
      font-size: 22px;
      font-weight: 400;
      line-height: 1.55;
      color: var(--slate, #666666);
      max-width: 70%;
      margin-bottom: 32px;
    }

    .header__rule {
      display: block;
      width: 96px;
      height: 3px;
      background: var(--signal, #3b82f6);
      border: none;
      margin-top: 24px;
    }

    /* Section */
    .section {
      margin-bottom: 96px;
    }

    .section__label {
      font-family: var(--font-mono, ui-monospace, monospace);
      font-size: 14px;
      font-weight: 500;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--slate, #666666);
      margin-bottom: 48px;
      padding-bottom: 16px;
      border-bottom: 1px solid var(--border, #e5e5e5);
    }

    /* Spacing scale */
    .spacing-row {
      display: grid;
      grid-template-columns: 120px 1fr 100px;
      gap: 24px;
      align-items: center;
      padding: 24px 0;
      border-bottom: 1px solid rgba(17, 17, 17, 0.08);
    }

    .spacing-row:last-child {
      border-bottom: none;
    }

    .spacing-row__name {
      font-family: var(--font-mono, ui-monospace, monospace);
      font-size: 14px;
      font-weight: 500;
      color: var(--ink, #111111);
    }

    .spacing-row__label {
      font-family: var(--font-body, system-ui, sans-serif);
      font-size: 13px;
      color: var(--slate, #666666);
      margin-top: 4px;
    }

    .spacing-row__bar-wrap {
      height: 32px;
      display: flex;
      align-items: center;
    }

    .spacing-row__bar {
      height: 3px;
      background: var(--signal, #3b82f6);
      min-width: 3px;
      transition: opacity 0.2s ease;
      border-radius: var(--radius-sm, 4px);
    }

    .spacing-row:hover .spacing-row__bar {
      opacity: 0.7;
    }

    .spacing-row__value {
      font-family: var(--font-mono, ui-monospace, monospace);
      font-size: 14px;
      font-weight: 500;
      color: var(--ink, #111111);
      text-align: right;
    }

    /* Depth demo */
    .depth-demo {
      padding: 32px 0;
      border-bottom: 1px solid rgba(17, 17, 17, 0.08);
    }

    .depth-demo:last-child {
      border-bottom: none;
    }

    .depth-demo__header {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      margin-bottom: 24px;
    }

    .depth-demo__name {
      font-family: var(--font-mono, ui-monospace, monospace);
      font-size: 14px;
      font-weight: 500;
      color: var(--ink, #111111);
    }

    .depth-demo__label {
      font-family: var(--font-body, system-ui, sans-serif);
      font-size: 13px;
      color: var(--slate, #666666);
    }

    .depth-demo__spec {
      font-family: var(--font-mono, ui-monospace, monospace);
      font-size: 13px;
      color: var(--slate, #666666);
    }

    .depth-demo__container {
      width: 100%;
      padding: 32px;
      background: var(--paper, #ffffff);
      border-radius: var(--radius-md, 8px);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .depth-demo__container--flat {
      background: var(--bone, #f5f5f5);
      border: 1px dashed var(--border, #e5e5e5);
    }

    .depth-demo__container--border {
      border: 1px solid var(--border, #e5e5e5);
    }

    .depth-demo__container--elevated {
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
      border: none;
    }

    .depth-demo__content {
      font-family: var(--font-body, system-ui, sans-serif);
      font-size: 14px;
      color: var(--slate, #666666);
      text-align: center;
    }

    /* Border radius */
    .radius-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 64px;
      margin-bottom: 48px;
    }

    .radius-item {
      display: grid;
      grid-template-columns: 160px 1fr;
      gap: 32px;
      align-items: flex-start;
    }

    .radius-item__demo {
      display: flex;
      gap: 16px;
      align-items: center;
      flex-wrap: wrap;
    }

    .radius-item__box {
      width: 120px;
      height: 120px;
      background: var(--bone, #f5f5f5);
      border: 2px solid var(--signal, #3b82f6);
      flex-shrink: 0;
    }

    .radius-item__info {
      flex: 1;
    }

    .radius-item__name {
      font-family: var(--font-mono, ui-monospace, monospace);
      font-size: 14px;
      font-weight: 500;
      color: var(--ink, #111111);
      margin-bottom: 4px;
    }

    .radius-item__value {
      font-family: var(--font-mono, ui-monospace, monospace);
      font-size: 13px;
      color: var(--slate, #666666);
      margin-bottom: 12px;
    }

    .radius-item__description {
      font-family: var(--font-body, system-ui, sans-serif);
      font-size: 13px;
      line-height: 1.55;
      color: var(--slate, #666666);
    }

    /* Philosophy block */
    .philosophy {
      background: var(--bone, #f5f5f5);
      padding: 48px;
      border: 1px solid var(--border, #e5e5e5);
      border-radius: var(--radius-md, 8px);
      margin-bottom: 64px;
    }

    .philosophy__title {
      font-family: var(--font-mono, ui-monospace, monospace);
      font-size: 13px;
      font-weight: 500;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--slate, #666666);
      margin-bottom: 16px;
    }

    .philosophy__text {
      font-family: var(--font-body, system-ui, sans-serif);
      font-size: 18px;
      line-height: 1.55;
      color: var(--ink, #111111);
    }

    .philosophy__text strong {
      font-weight: 600;
      color: var(--signal, #3b82f6);
    }

    .philosophy__text em {
      font-style: italic;
    }

    .philosophy__text code {
      font-family: var(--font-mono, ui-monospace, monospace);
      background: rgba(59, 130, 246, 0.08);
      padding: 2px 6px;
      font-size: 0.95em;
      color: var(--signal, #3b82f6);
    }

    /* Intro text */
    .intro-text {
      font-family: var(--font-body, system-ui, sans-serif);
      font-size: 18px;
      color: var(--slate, #666666);
      line-height: 1.55;
      margin-bottom: 48px;
      max-width: 800px;
    }

    .intro-text strong {
      font-weight: 600;
      color: var(--ink, #111111);
    }

    /* Loading */
    .loading {
      text-align: center;
      padding: 80px 24px;
      color: var(--slate, #666666);
      font-size: 16px;
    }

    .loading::after {
      content: '';
      display: block;
      width: 32px;
      height: 32px;
      margin: 16px auto 0;
      border: 2px solid rgba(59, 130, 246, 0.2);
      border-top-color: var(--signal, #3b82f6);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    @media (max-width: 900px) {
      .page {
        padding: 64px 32px;
      }

      .header {
        margin-bottom: 64px;
      }

      .header__title {
        font-size: 54px;
      }

      .section {
        margin-bottom: 64px;
      }

      .spacing-row {
        grid-template-columns: 100px 1fr 80px;
        gap: 16px;
      }

      .radius-grid {
        grid-template-columns: 1fr;
        gap: 32px;
      }

      .radius-item {
        grid-template-columns: 120px 1fr;
      }
    }
  </style>
</head>
<body>
  <div class="page" id="app">
    <div class="loading">Loading design tokens…</div>
  </div>

  <script>
    const DEFAULT_SPACING = {
      's-1': { value: '4px', label: 'xs' },
      's-2': { value: '8px', label: 'sm' },
      's-3': { value: '16px', label: 'md' },
      's-4': { value: '24px', label: 'lg' },
      's-5': { value: '32px', label: 'xl' },
      's-6': { value: '48px', label: '2xl' },
      's-7': { value: '64px', label: '3xl' },
      's-8': { value: '96px', label: '4xl' }
    };

    const DEFAULT_DEPTH = [
      { level: 0, name: 'Flat', treatment: 'none', use: 'Default background, no elevation' },
      { level: 1, name: 'Border', treatment: '1px solid var(--border)', use: 'Cards, containers, subtle separation' },
      { level: 2, name: 'Elevated', treatment: '0 2px 8px rgba(0,0,0,0.08)', use: 'Modals, popovers, floating elements' }
    ];

    const DEFAULT_RADIUS = {
      'none': { value: '0', use: 'Sharp corners. Not used in this system.' },
      'sm': { value: '4px', use: 'Reserved for future use.' },
      'md': { value: '8px', use: 'Buttons, cards, inputs, and most components.' },
      'lg': { value: '16px', use: 'Larger containers, modals, and feature blocks.' },
      'full': { value: '999px', use: 'Badges, pills, and circular avatars.' }
    };

    ( window.__DESIGN_TOKENS__ ? Promise.resolve({ ok: true, json: () => Promise.resolve(window.__DESIGN_TOKENS__) }) : fetch('../tokens.json') )
      .then(r => {
        if (!r.ok) throw new Error('tokens.json not found (' + r.status + ')');
        return r.json();
      })
      .then(render)
      .catch(err => {
        document.getElementById('app').innerHTML =
          '<div class="loading" style="color:#dc2626">' +
          'Could not load tokens.json — ' + err.message + '</div>';
      });

    function render(tokens) {
      const app = document.getElementById('app');
      
      const spacing = {};
      if (tokens.spacing?.scale) {
        Object.entries(tokens.spacing.scale).forEach(([k, v]) => {
          spacing[k] = { value: v, label: k };
        });
      } else {
        Object.assign(spacing, DEFAULT_SPACING);
      }

      const depth = tokens.depth || DEFAULT_DEPTH;
      const radius = DEFAULT_RADIUS;

      let html = '';

      /* Header / Stage head */
      html += '<header class="header">';
      html += '  <div class="header__kicker">Spacing &amp; Rules</div>';
      html += '  <h1 class="header__title">Scale &amp; Depth.<br>Built for fantasy.</h1>';
      html += '  <p class="header__subtitle">A modular spacing system paired with three levels of visual depth — from flat canvas to elevated floating elements. Every interval and shadow serves the bold, premium aesthetic.</p>';
      html += '  <hr class="header__rule">';
      html += '</header>';

      /* Philosophy block */
      html += '<div class="philosophy">';
      html += '  <div class="philosophy__title">Spacing Philosophy</div>';
      html += '  <div class="philosophy__text">';
      html += '    This system uses an <strong>8px base unit</strong> to create a predictable, modular scale. Every spacing token — from 4px microinteractions to 96px major section breaks — is a multiple of eight. This ensures <strong>pixel-perfect alignment</strong> and a cohesive visual rhythm. Prefer generous whitespace to separate concerns before reaching for borders or shadows. <em>Let the grid breathe.</em>';
      html += '  </div>';
      html += '</div>';

      /* Spacing scale */
      html += '<div class="section">';
      html += '  <div class="section__label">Spacing Scale</div>';

      const spacingEntries = Object.entries(spacing);
      const maxPx = Math.max(...spacingEntries.map(([, o]) => parseFloat(o.value) || 0), 1);

      spacingEntries.forEach(([key, obj]) => {
        const px = parseFloat(obj.value) || 0;
        const pct = Math.max((px / maxPx) * 100, 2);
        const label = obj.label || key;
        
        html += '<div class="spacing-row">';
        html += '  <div>';
        html += '    <div class="spacing-row__name">' + esc(key) + '</div>';
        html += '    <div class="spacing-row__label">' + esc(label) + '</div>';
        html += '  </div>';
        html += '  <div class="spacing-row__bar-wrap">';
        html += '    <div class="spacing-row__bar" style="width:' + pct + '%"></div>';
        html += '  </div>';
        html += '  <div class="spacing-row__value">' + esc(obj.value) + '</div>';
        html += '</div>';
      });

      html += '</div>';

      /* Depth levels */
      html += '<div class="section">';
      html += '  <div class="section__label">Depth Levels</div>';

      depth.forEach((d, idx) => {
        const name = d.name || 'Level ' + d.level;
        const treatment = d.treatment || 'none';
        const use = d.use || '';

        html += '<div class="depth-demo">';
        html += '  <div class="depth-demo__header">';
        html += '    <div>';
        html += '      <div class="depth-demo__name">' + esc(name) + '</div>';
        html += '      <div class="depth-demo__label">' + esc(use) + '</div>';
        html += '    </div>';
        html += '    <div class="depth-demo__spec">' + esc(treatment) + '</div>';
        html += '  </div>';
        
        let containerClass = 'depth-demo__container';
        if (idx === 0) containerClass += ' depth-demo__container--flat';
        else if (idx === 1) containerClass += ' depth-demo__container--border';
        else if (idx === 2) containerClass += ' depth-demo__container--elevated';

        html += '  <div class="' + containerClass + '">';
        html += '    <div class="depth-demo__content">';
        if (idx === 0) {
          html += 'Flat surface with no elevation';
        } else if (idx === 1) {
          html += 'Border-defined container';
        } else {
          html += 'Elevated with soft shadow';
        }
        html += '    </div>';
        html += '  </div>';
        html += '</div>';
      });

      html += '</div>';

      /* Border radius */
      html += '<div class="section">';
      html += '  <div class="section__label">Border Radius</div>';
      html += '  <p class="intro-text">Corners are <strong>intentional</strong>. Most components use 8px radius for a friendly, modern feel. Larger containers get 16px. Badges and pills use full roundness.</p>';

      html += '  <div class="radius-grid">';

      Object.entries(radius).forEach(([key, obj]) => {
        const radiusValue = obj.value;

        html += '    <div class="radius-item">';
        html += '      <div class="radius-item__demo">';
        html += '        <div class="radius-item__box" style="border-radius: ' + esc(radiusValue) + '"></div>';
        html += '      </div>';
        html += '      <div class="radius-item__info">';
        html += '        <div class="radius-item__name">--radius-' + esc(key) + '</div>';
        html += '        <div class="radius-item__value">' + esc(radiusValue) + '</div>';
        html += '        <div class="radius-item__description">' + esc(obj.use) + '</div>';
        html += '      </div>';
        html += '    </div>';
      });

      html += '  </div>';
      html += '</div>';

      /* Whitespace philosophy */
      html += '<div class="philosophy" style="margin-top: 96px; margin-bottom: 0;">';
      html += '  <div class="philosophy__title">Composition Principles</div>';
      html += '  <div class="philosophy__text">';
      html += '    <strong>Hierarchy through rhythm:</strong> Use larger spacing (s-6, s-7, s-8) to separate major sections. Smaller spacing (s-2, s-3) keeps related elements grouped. <strong>Depth creates focus:</strong> Flat (no border) for canvas and body areas. Borders for distinct cards and sections. Shadows for floating, interactive overlays like modals. <strong>Radius softens premium:</strong> Sharp corners (0px) would feel cold; soft 8px corners feel approachable. Larger 16px for feature prominence. Full roundness (999px) for badges and tags.';
      html += '  </div>';
      html += '</div>';

      app.innerHTML = html;
    }

    function esc(s) {
      const d = document.createElement('div');
      d.textContent = String(s);
      return d.innerHTML;
    }
  </script>
</body>
</html>
