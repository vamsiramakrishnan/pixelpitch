<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Type Specimen — Framer</title>
  <link rel="stylesheet" href="../colors_and_type.css">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: var(--font-body, 'GT Walsheim Framer Medium', system-ui);
      background: var(--paper, #000000);
      color: var(--ink, #ffffff);
      line-height: 1.6;
    }

    .page {
      max-width: 1200px;
      margin: 0 auto;
      padding: 120px 48px;
    }

    @media (max-width: 768px) {
      .page {
        padding: 80px 32px;
      }
    }

    @media (max-width: 480px) {
      .page {
        padding: 60px 24px;
      }
    }

    /* Header */
    .header {
      margin-bottom: 120px;
    }

    .header__kicker {
      font-family: var(--font-mono, 'Azeret Mono', monospace);
      font-size: 13px;
      font-weight: 500;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--slate, #a6a6a6);
      margin-bottom: 20px;
    }

    .header__title {
      font-family: var(--font-display, 'GT Walsheim Framer Medium', system-ui);
      font-size: 110px;
      font-weight: 500;
      line-height: 0.85;
      letter-spacing: -5.5px;
      color: var(--ink, #ffffff);
      margin-bottom: 28px;
      max-width: 1100px;
    }

    .header__subtitle {
      font-family: var(--font-body, 'GT Walsheim Framer Medium', system-ui);
      font-size: 18px;
      font-weight: 400;
      line-height: 1.5;
      color: var(--slate, #a6a6a6);
      max-width: 720px;
      margin-bottom: 40px;
    }

    .header__rule {
      display: block;
      width: 120px;
      height: 1px;
      background: var(--border, #0099ff);
      border: none;
      margin: 0;
    }

    /* Font families section */
    .font-families {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 32px;
      margin-bottom: 120px;
      margin-top: 80px;
    }

    .font-card {
      background: transparent;
      border: 1px solid var(--border, #0099ff);
      border-radius: var(--radius-md, 10px);
      padding: 32px;
    }

    .font-card__label {
      font-family: var(--font-mono, 'Azeret Mono', monospace);
      font-size: 11px;
      font-weight: 500;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--slate, #a6a6a6);
      margin-bottom: 12px;
    }

    .font-card__name {
      font-family: var(--font-display, 'GT Walsheim Framer Medium', system-ui);
      font-size: 32px;
      font-weight: 500;
      line-height: 1.1;
      letter-spacing: -1px;
      color: var(--ink, #ffffff);
      margin-bottom: 8px;
    }

    .font-card__fallback {
      font-family: var(--font-mono, 'Azeret Mono', monospace);
      font-size: 11px;
      color: var(--slate, #a6a6a6);
      word-break: break-word;
      line-height: 1.6;
    }

    /* Character set block */
    .charmap-block {
      background: transparent;
      border: 1px solid var(--border, #0099ff);
      border-radius: var(--radius-md, 10px);
      padding: 48px;
      margin-bottom: 120px;
    }

    .charmap-block__label {
      font-family: var(--font-mono, 'Azeret Mono', monospace);
      font-size: 11px;
      font-weight: 500;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--slate, #a6a6a6);
      margin-bottom: 28px;
    }

    .charmap-block__chars {
      font-family: var(--font-display, 'GT Walsheim Framer Medium', system-ui);
      font-size: 32px;
      font-weight: 500;
      line-height: 1.8;
      letter-spacing: -1px;
      color: var(--ink, #ffffff);
      word-break: break-word;
    }

    /* Section label */
    .section-label {
      font-family: var(--font-mono, 'Azeret Mono', monospace);
      font-size: 11px;
      font-weight: 500;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--slate, #a6a6a6);
      margin-bottom: 40px;
      padding-bottom: 20px;
      border-bottom: 1px solid var(--border, #0099ff);
    }

    /* Ramp row */
    .ramp-row {
      display: grid;
      grid-template-columns: 320px 1fr;
      gap: 48px;
      align-items: baseline;
      padding: 40px 0;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
    }

    .ramp-row:last-child {
      border-bottom: none;
    }

    @media (max-width: 900px) {
      .ramp-row {
        grid-template-columns: 1fr;
        gap: 20px;
      }
    }

    /* Left meta column */
    .ramp-meta__role {
      font-family: var(--font-display, 'GT Walsheim Framer Medium', system-ui);
      font-size: 18px;
      font-weight: 500;
      letter-spacing: -0.5px;
      color: var(--ink, #ffffff);
      margin-bottom: 12px;
    }

    .ramp-meta__detail {
      font-family: var(--font-mono, 'Azeret Mono', monospace);
      font-size: 10px;
      font-weight: 400;
      line-height: 1.8;
      color: var(--slate, #a6a6a6);
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }

    /* Right sample column */
    .ramp-sample {
      color: var(--ink, #ffffff);
      overflow-wrap: break-word;
      word-spacing: 0.1em;
    }

    /* Ramp section */
    .ramp-section {
      margin-bottom: 120px;
    }

    /* Drop cap demo */
    .dropcap-demo {
      margin-bottom: 120px;
    }

    .dropcap-demo__label {
      font-family: var(--font-mono, 'Azeret Mono', monospace);
      font-size: 11px;
      font-weight: 500;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--slate, #a6a6a6);
      margin-bottom: 40px;
      padding-bottom: 20px;
      border-bottom: 1px solid var(--border, #0099ff);
    }

    .dropcap-container {
      background: transparent;
      border: 1px solid var(--border, #0099ff);
      border-radius: var(--radius-md, 10px);
      padding: 48px;
      max-width: 800px;
    }

    .dropcap-para {
      font-family: var(--font-body, 'GT Walsheim Framer Medium', system-ui);
      font-size: 18px;
      font-weight: 400;
      line-height: 1.6;
      color: var(--ink, #ffffff);
      margin: 0;
      text-align: left;
    }

    .dropcap {
      float: left;
      font-family: var(--font-display, 'GT Walsheim Framer Medium', system-ui);
      font-size: 140px;
      font-weight: 500;
      line-height: 0.8;
      letter-spacing: -6px;
      color: var(--border, #0099ff);
      margin-right: 12px;
      margin-top: -12px;
    }

    /* Loading */
    .loading {
      text-align: center;
      padding: 200px 48px;
      color: var(--slate, #a6a6a6);
      font-family: var(--font-body, 'GT Walsheim Framer Medium', system-ui);
      font-size: 16px;
    }

    .loading::after {
      content: '';
      display: block;
      width: 32px;
      height: 32px;
      margin: 28px auto 0;
      border: 2px solid var(--border, #0099ff);
      border-top-color: var(--slate, #a6a6a6);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div class="page" id="app">
    <div class="loading">Loading design tokens&hellip;</div>
  </div>

  <script>
    const EDITORIAL_SAMPLES = [
      'Design tools should feel like an extension of your hand.',
      'Motion is the language of interaction design.',
      'Every pixel matters in the pursuit of craft.',
      'Compression creates visual intensity.',
      'The interface is the product itself.',
      'Type under pressure feels spring-loaded.',
      'Blue electricity against absolute void.',
      'Designers build for designers.',
      'Speed and precision are non-negotiable.',
      'The product is the proof of concept.',
    ];

    const DROPCAP_TEXT = 'Design tools built by designers demand a visual language as precise and uncompromising as the craft itself. Framer\'s website is a cinematic void — pure black canvas that makes every element float like it\'s suspended in deep space. Typography is the signature move: GT Walsheim Framer Medium compressed with aggressive negative letter-spacing creates headlines that feel spring-loaded, kinetic, almost breathless. At 110 pixels with -5.5px tracking, words are compressed under pressure that threatens to explode outward at any moment. The transition to Inter for body text is seamless, enriched with extensive OpenType features that refine even small text to gallery-quality precision. Framer Blue — #0099ff, cold and electric — cuts through the darkness as link color, border accents, and subtle ring shadows. Pill-shaped buttons with extreme border-radius complete the motion-forward aesthetic. Every section of the site showcases the tool in full fidelity, embedding product screenshots as hero art. The website itself serves as proof of concept. This is a nightclub for web designers: dark, precise, seductive, and unapologetically product-obsessed. The visual system trusts that craft speaks louder than decoration.';

    fetch('../tokens.json')
      .then(r => {
        if (!r.ok) throw new Error('tokens.json not found (' + r.status + ')');
        return r.json();
      })
      .then(render)
      .catch(err => {
        document.getElementById('app').innerHTML =
          '<div class="loading" style="color:#0099ff">' +
          'Could not load tokens.json — ' + err.message + '</div>';
      });

    function render(tokens) {
      const app = document.getElementById('app');
      const title = tokens.meta?.title || 'Design System';
      const summary = tokens.meta?.summary || '';

      const ramp = tokens.typography?.ramp || [];

      let html = '';

      /* Header */
      html += '<header class="header">';
      html += '  <div class="header__kicker">Type Specimen</div>';
      html += '  <h1 class="header__title">' + esc(title) + '</h1>';
      html += '  <p class="header__subtitle">' + esc(summary) + '</p>';
      html += '  <hr class="header__rule">';
      html += '</header>';

      /* Font families */
      const families = [
        { label: 'Display', name: 'GT Walsheim', fallback: 'GT Walsheim Framer Medium, system-ui, sans-serif', note: 'Weight 500, extreme negative tracking' },
        { label: 'UI & Body', name: 'Inter Variable', fallback: 'system-ui, -apple-system, Helvetica Neue, sans-serif', note: 'Variable weight, 6+ OpenType features' },
        { label: 'Monospace', name: 'Azeret Mono', fallback: 'IBM Plex Mono, ui-monospace, Menlo, monospace', note: 'Precision metadata & code' }
      ];

      html += '<div class="font-families">';
      families.forEach(f => {
        html += '<div class="font-card">';
        html += '  <div class="font-card__label">' + esc(f.label) + '</div>';
        html += '  <div class="font-card__name">' + esc(f.name) + '</div>';
        html += '  <div class="font-card__fallback">' + esc(f.fallback) + '</div>';
        html += '</div>';
      });
      html += '</div>';

      /* Character set */
      html += '<div class="charmap-block">';
      html += '  <div class="charmap-block__label">Character Set · GT Walsheim Medium</div>';
      html += '  <div class="charmap-block__chars" style="font-family:\'GT Walsheim Framer Medium\',system-ui">';
      html += '    AaBbCcDdEeFfGgHhIiJjKkLlMmNnOoPpQqRrSsTtUuVvWwXxYyZz<br>';
      html += '    0123456789 !@#$%&amp;*()–—\'""';
      html += '  </div>';
      html += '</div>';

      /* Type ramp */
      if (ramp.length) {
        html += '<div class="ramp-section">';
        html += '<div class="section-label">Type Ramp</div>';
        ramp.forEach((entry, i) => {
          html += rampRow(entry, i);
        });
        html += '</div>';
      }

      /* Drop cap demo */
      html += '<div class="dropcap-demo">';
      html += '<div class="dropcap-demo__label">Drop Cap — Framer Blue, Spring-Loaded Typography</div>';
      html += '<div class="dropcap-container">';
      const firstChar = DROPCAP_TEXT.charAt(0);
      const restText = DROPCAP_TEXT.substring(1);
      html += '<p class="dropcap-para">';
      html += '<span class="dropcap">' + esc(firstChar) + '</span>';
      html += esc(restText);
      html += '</p>';
      html += '</div>';
      html += '</div>';

      app.innerHTML = html;
    }

    function rampRow(entry, idx) {
      const role = entry.role || 'Role ' + (idx + 1);
      const size = entry.size || '16px';
      const weight = entry.weight || 400;
      const lh = entry.lineHeight || '1.5';
      const ls = entry.letterSpacing || '0';

      let fontFamily = 'var(--font-body)';
      if (entry.fontKey === 'display') fontFamily = 'var(--font-display)';
      else if (entry.fontKey === 'mono') fontFamily = 'var(--font-mono)';
      else if (entry.fontKey === 'ui') fontFamily = 'Inter, system-ui';

      const sizeNum = parseFloat(size);
      const sampleIdx = idx % EDITORIAL_SAMPLES.length;
      let sample = EDITORIAL_SAMPLES[sampleIdx];

      /* Truncate very large samples */
      if (sizeNum >= 61) {
        sample = sample.split('.')[0].slice(0, 45);
        if (!sample.endsWith('.')) sample += '.';
      }

      let fontStyle = 'font-size:' + size + ';font-weight:' + weight + ';line-height:' + lh + ';';
      fontStyle += 'font-family:' + fontFamily + ';';
      if (ls && ls !== '0' && ls !== 'normal') fontStyle += 'letter-spacing:' + ls + ';';

      let meta = esc(size) + ' / Weight ' + esc(String(weight));
      meta += '\n' + fontFamilyLabel(entry.fontKey);
      meta += '\nLine Height: ' + esc(String(lh));
      if (ls && ls !== '0' && ls !== 'normal') meta += '\nTracking: ' + esc(ls);

      return '' +
        '<div class="ramp-row">' +
        '  <div class="ramp-meta">' +
        '    <div class="ramp-meta__role">' + esc(role) + '</div>' +
        '    <pre class="ramp-meta__detail">' + meta + '</pre>' +
        '  </div>' +
        '  <div class="ramp-sample" style="' + fontStyle + '">' + esc(sample) + '</div>' +
        '</div>';
    }

    function fontFamilyLabel(key) {
      const map = {
        'display': 'GT Walsheim',
        'body': 'GT Walsheim',
        'mono': 'Azeret Mono',
        'ui': 'Inter'
      };
      return map[key] || 'Unknown';
    }

    function esc(s) {
      const d = document.createElement('div');
      d.textContent = String(s);
      return d.innerHTML;
    }
  </script>
</body>
</html>
