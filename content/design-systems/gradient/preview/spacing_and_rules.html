<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Spacing &amp; Rules — Gradient</title>
  <link rel="stylesheet" href="../colors_and_type.css">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: var(--font-body, system-ui, sans-serif);
      background: var(--paper, #ffffff);
      color: var(--ink, #111111);
      line-height: 1.6;
    }

    .page {
      max-width: 1100px;
      margin: 0 auto;
      padding: 96px 64px;
    }

    /* Header / Stage head */
    .header {
      margin-bottom: 96px;
      position: relative;
    }

    .header__kicker {
      font-family: var(--font-mono, ui-monospace, monospace);
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--slate, #666666);
      margin-bottom: 16px;
    }

    .header__title {
      font-family: var(--font-display, system-ui, sans-serif);
      font-size: 64px;
      font-weight: 700;
      line-height: 1.1;
      letter-spacing: -0.01em;
      color: var(--ink, #111111);
      margin-bottom: 12px;
      max-width: 90%;
    }

    .header__subtitle {
      font-family: var(--font-body, system-ui, sans-serif);
      font-size: 20px;
      font-weight: 400;
      line-height: 1.5;
      color: var(--slate, #666666);
      max-width: 75%;
      margin-bottom: 32px;
    }

    .header__rule {
      display: block;
      width: 80px;
      height: 3px;
      background: linear-gradient(90deg, var(--signal, #3b82f6) 0%, #8b5cf6 100%);
      border: none;
      margin-top: 24px;
      border-radius: var(--radius-full, 999px);
    }

    /* Section */
    .section {
      margin-bottom: 96px;
    }

    .section__label {
      font-family: var(--font-mono, ui-monospace, monospace);
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--slate, #666666);
      margin-bottom: 48px;
      padding-bottom: 16px;
      border-bottom: 1px solid var(--border, #e5e5e5);
    }

    /* Spacing scale */
    .spacing-row {
      display: grid;
      grid-template-columns: 120px 1fr 100px;
      gap: 24px;
      align-items: center;
      padding: 24px 0;
      border-bottom: 1px solid var(--border, #e5e5e5);
    }

    .spacing-row:last-child {
      border-bottom: none;
    }

    .spacing-row__name {
      font-family: var(--font-mono, ui-monospace, monospace);
      font-size: 13px;
      font-weight: 600;
      color: var(--ink, #111111);
    }

    .spacing-row__label {
      font-family: var(--font-body, system-ui, sans-serif);
      font-size: 12px;
      color: var(--slate, #666666);
      margin-top: 4px;
    }

    .spacing-row__bar-wrap {
      height: 32px;
      display: flex;
      align-items: center;
    }

    .spacing-row__bar {
      height: 3px;
      background: linear-gradient(90deg, var(--signal, #3b82f6) 0%, #8b5cf6 100%);
      min-width: 2px;
      transition: all 0.2s ease;
      border-radius: var(--radius-full, 999px);
    }

    .spacing-row:hover .spacing-row__bar {
      filter: brightness(1.1);
    }

    .spacing-row__value {
      font-family: var(--font-mono, ui-monospace, monospace);
      font-size: 13px;
      font-weight: 600;
      color: var(--ink, #111111);
      text-align: right;
    }

    /* Depth demo */
    .depth-demo {
      padding: 32px 0;
      border-bottom: 1px solid var(--border, #e5e5e5);
    }

    .depth-demo:last-child {
      border-bottom: none;
    }

    .depth-demo__header {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      margin-bottom: 16px;
    }

    .depth-demo__name {
      font-family: var(--font-mono, ui-monospace, monospace);
      font-size: 13px;
      font-weight: 600;
      color: var(--ink, #111111);
    }

    .depth-demo__label {
      font-family: var(--font-body, system-ui, sans-serif);
      font-size: 12px;
      color: var(--slate, #666666);
    }

    .depth-demo__spec {
      font-family: var(--font-mono, ui-monospace, monospace);
      font-size: 12px;
      color: var(--slate, #666666);
    }

    .depth-demo__container {
      width: 100%;
      height: 120px;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      background: var(--paper, #ffffff);
      border-radius: var(--radius-md, 8px);
      font-family: var(--font-body, system-ui, sans-serif);
      font-size: 14px;
      color: var(--slate, #666666);
    }

    /* Border radius */
    .radius-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 64px;
      margin-bottom: 48px;
    }

    .radius-item {
      display: grid;
      grid-template-columns: 160px 1fr;
      gap: 32px;
      align-items: flex-start;
    }

    .radius-item__demo {
      display: flex;
      gap: 12px;
      align-items: center;
      flex-wrap: wrap;
    }

    .radius-item__box {
      width: 100px;
      height: 100px;
      background: linear-gradient(135deg, var(--signal, #3b82f6) 0%, #8b5cf6 100%);
      border: none;
      flex-shrink: 0;
    }

    .radius-item__info {
      flex: 1;
    }

    .radius-item__name {
      font-family: var(--font-mono, ui-monospace, monospace);
      font-size: 13px;
      font-weight: 600;
      color: var(--ink, #111111);
      margin-bottom: 4px;
    }

    .radius-item__value {
      font-family: var(--font-mono, ui-monospace, monospace);
      font-size: 12px;
      color: var(--slate, #666666);
      margin-bottom: 12px;
    }

    .radius-item__description {
      font-family: var(--font-body, system-ui, sans-serif);
      font-size: 13px;
      line-height: 1.5;
      color: var(--slate, #666666);
    }

    /* Philosophy block */
    .philosophy {
      background: var(--bone, #f5f5f5);
      padding: 48px;
      border: 1px solid var(--border, #e5e5e5);
      border-radius: var(--radius-lg, 16px);
      margin-bottom: 64px;
    }

    .philosophy__title {
      font-family: var(--font-mono, ui-monospace, monospace);
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--slate, #666666);
      margin-bottom: 16px;
    }

    .philosophy__text {
      font-family: var(--font-body, system-ui, sans-serif);
      font-size: 16px;
      line-height: 1.6;
      color: var(--ink, #111111);
    }

    .philosophy__text strong {
      font-weight: 600;
    }

    .philosophy__text em {
      font-style: italic;
    }

    .philosophy__text code {
      font-family: var(--font-mono, ui-monospace, monospace);
      background: var(--paper, #ffffff);
      padding: 3px 8px;
      font-size: 0.9em;
      border-radius: var(--radius-sm, 4px);
      border: 1px solid var(--border, #e5e5e5);
    }

    /* Grid demo */
    .grid-demo {
      background: linear-gradient(135deg, rgba(59, 130, 246, 0.05) 0%, rgba(139, 92, 246, 0.05) 100%);
      padding: 48px;
      border: 1px solid var(--border, #e5e5e5);
      border-radius: var(--radius-lg, 16px);
      margin-bottom: 64px;
    }

    .grid-demo__title {
      font-family: var(--font-mono, ui-monospace, monospace);
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--slate, #666666);
      margin-bottom: 24px;
    }

    .grid-demo__visual {
      width: 100%;
      height: 200px;
      display: grid;
      grid-template-columns: repeat(12, 1fr);
      gap: 12px;
      padding: 24px;
      border: 1px dashed var(--border, #e5e5e5);
      border-radius: var(--radius-md, 8px);
      background: var(--paper, #ffffff);
    }

    .grid-demo__column {
      background: linear-gradient(135deg, var(--signal, #3b82f6) 0%, #8b5cf6 100%);
      border-radius: var(--radius-md, 8px);
      font-family: var(--font-mono, ui-monospace, monospace);
      font-size: 10px;
      font-weight: 600;
      color: var(--paper, #ffffff);
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0.8;
    }

    .grid-demo__info {
      margin-top: 24px;
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 24px;
    }

    .grid-demo__stat {
      font-family: var(--font-body, system-ui, sans-serif);
      font-size: 13px;
      color: var(--ink, #111111);
    }

    .grid-demo__stat-label {
      font-family: var(--font-mono, ui-monospace, monospace);
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--slate, #666666);
      margin-bottom: 6px;
    }

    /* Loading */
    .loading {
      text-align: center;
      padding: 80px 24px;
      color: var(--slate, #666666);
      font-size: 16px;
    }

    .loading::after {
      content: '';
      display: block;
      width: 32px;
      height: 32px;
      margin: 16px auto 0;
      border: 2px solid var(--border, #e5e5e5);
      border-top-color: var(--signal, #3b82f6);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    @media (max-width: 900px) {
      .page {
        padding: 64px 32px;
      }

      .header {
        margin-bottom: 64px;
      }

      .header__title {
        font-size: 48px;
      }

      .header__subtitle {
        font-size: 18px;
      }

      .section {
        margin-bottom: 64px;
      }

      .spacing-row {
        grid-template-columns: 100px 1fr 80px;
        gap: 16px;
      }

      .radius-grid {
        grid-template-columns: 1fr;
        gap: 32px;
      }

      .radius-item {
        grid-template-columns: 100px 1fr;
      }

      .grid-demo__info {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <div class="page" id="app">
    <div class="loading">Loading design tokens…</div>
  </div>

  <script>
    const DEFAULT_SPACING = {
      's-1': { value: '4px', label: 'xs' },
      's-2': { value: '8px', label: 'sm' },
      's-3': { value: '16px', label: 'md' },
      's-4': { value: '24px', label: 'lg' },
      's-5': { value: '32px', label: 'xl' },
      's-6': { value: '48px', label: '2xl' },
      's-7': { value: '64px', label: '3xl' },
      's-8': { value: '96px', label: '4xl' }
    };

    const DEFAULT_DEPTH = [
      { name: 'Flat', level: 0, treatment: 'none', use: 'Default surfaces, body backgrounds' },
      { name: 'Border', level: 1, treatment: '1px solid var(--border)', use: 'Card edges, input focus, subtle separation' },
      { name: 'Elevated', level: 2, treatment: '0 2px 8px rgba(0,0,0,0.08)', use: 'Floating panels, modals, dropdowns' }
    ];

    const DEFAULT_RADIUS = {
      'none': { value: '0', use: 'Unused in this system.' },
      'sm': { value: '4px', use: 'Small UI elements, input fields, tight components.' },
      'md': { value: '8px', use: 'Buttons, cards, standard components. System default.' },
      'lg': { value: '16px', use: 'Large cards, containers, major layout blocks.' },
      'full': { value: '999px', use: 'Badges, pills, avatars, circular elements.' }
    };

    ( window.__DESIGN_TOKENS__ ? Promise.resolve({ ok: true, json: () => Promise.resolve(window.__DESIGN_TOKENS__) }) : fetch('../tokens.json') )
      .then(r => {
        if (!r.ok) throw new Error('tokens.json not found (' + r.status + ')');
        return r.json();
      })
      .then(render)
      .catch(err => {
        document.getElementById('app').innerHTML =
          '<div class="loading" style="color:#ef4444">' +
          'Could not load tokens.json — ' + err.message + '</div>';
      });

    function render(tokens) {
      const app = document.getElementById('app');

      const spacing = {};
      if (tokens.spacing?.scale) {
        Object.entries(tokens.spacing.scale).forEach(([k, v]) => {
          spacing[k] = { value: v, label: k };
        });
      } else {
        Object.assign(spacing, DEFAULT_SPACING);
      }

      const depth = tokens.depth || DEFAULT_DEPTH;
      const radius = DEFAULT_RADIUS;

      let html = '';

      /* Header / Stage head */
      html += '<header class="header">';
      html += '  <div class="header__kicker">Spacing &amp; Rules</div>';
      html += '  <h1 class="header__title">Smooth surfaces.<br>Gradient depth.</h1>';
      html += '  <p class="header__subtitle">A modern spacing and elevation system for playful, gradient-rich interfaces. Consistent rhythms create visual harmony across all components.</p>';
      html += '  <hr class="header__rule">';
      html += '</header>';

      /* Philosophy block */
      html += '<div class="philosophy">';
      html += '  <div class="philosophy__title">Design Philosophy</div>';
      html += '  <div class="philosophy__text">';
      html += '    Gradient surfaces create visual depth through <strong>color transitions and elevation</strong>, not harsh shadows. The spacing scale breathes rhythm into layouts: tight internal padding within components, generous margins between content blocks. Every gradient should fade smoothly; every border should feel purposeful. Use <code>--radius-md</code> (8px) as your default—it balances modern playfulness with clarity. <em>Soft, approachable, and intentional.</em>';
      html += '  </div>';
      html += '</div>';

      /* Spacing scale */
      html += '<div class="section">';
      html += '  <div class="section__label">Spacing Scale</div>';

      const spacingEntries = Object.entries(spacing);
      const maxPx = Math.max(...spacingEntries.map(([, o]) => parseFloat(o.value) || 0), 1);

      spacingEntries.forEach(([key, obj]) => {
        const px = parseFloat(obj.value) || 0;
        const pct = Math.max((px / maxPx) * 100, 2);
        const label = obj.label || key;
        
        html += '<div class="spacing-row">';
        html += '  <div>';
        html += '    <div class="spacing-row__name">' + esc(key) + '</div>';
        html += '    <div class="spacing-row__label">' + esc(label) + '</div>';
        html += '  </div>';
        html += '  <div class="spacing-row__bar-wrap">';
        html += '    <div class="spacing-row__bar" style="width:' + pct + '%"></div>';
        html += '  </div>';
        html += '  <div class="spacing-row__value">' + esc(obj.value) + '</div>';
        html += '</div>';
      });

      html += '</div>';

      /* Grid visualization */
      html += '<div class="section">';
      html += '  <div class="section__label">Layout Grid</div>';
      html += '  <div class="grid-demo">';
      html += '    <div class="grid-demo__title">12-Column Responsive Grid</div>';
      html += '    <div class="grid-demo__visual">';
      for (let i = 1; i <= 12; i++) {
        html += '      <div class="grid-demo__column">' + i + '</div>';
      }
      html += '    </div>';
      html += '    <div class="grid-demo__info">';
      html += '      <div>';
      html += '        <div class="grid-demo__stat-label">Column Gutter</div>';
      html += '        <div class="grid-demo__stat">12px between columns for breathing room</div>';
      html += '      </div>';
      html += '      <div>';
      html += '        <div class="grid-demo__stat-label">Margin</div>';
      html += '        <div class="grid-demo__stat">Responsive: 16px mobile, 32px tablet, 64px desktop</div>';
      html += '      </div>';
      html += '      <div>';
      html += '        <div class="grid-demo__stat-label">Max Width</div>';
      html += '        <div class="grid-demo__stat">1200px for comfortable reading and interaction</div>';
      html += '      </div>';
      html += '      <div>';
      html += '        <div class="grid-demo__stat-label">Content Width</div>';
      html += '        <div class="grid-demo__stat">6 columns recommended for body text</div>';
      html += '      </div>';
      html += '    </div>';
      html += '  </div>';
      html += '</div>';

      /* Depth & elevation */
      html += '<div class="section">';
      html += '  <div class="section__label">Depth &amp; Elevation</div>';

      depth.forEach((d, idx) => {
        const isFlat = d.treatment === 'none';
        const isGradient = d.treatment.includes('gradient');

        html += '<div class="depth-demo">';
        html += '  <div class="depth-demo__header">';
        html += '    <div>';
        html += '      <div class="depth-demo__name">' + esc(d.name) + '</div>';
        html += '      <div class="depth-demo__label">' + esc(d.use) + '</div>';
        html += '    </div>';
        html += '    <div class="depth-demo__spec">' + esc(d.treatment) + '</div>';
        html += '  </div>';
        
        if (isFlat) {
          html += '  <div class="depth-demo__container" style="background: var(--paper); border: 1px solid var(--border);">';
          html += '    <span>No elevation or shadow</span>';
          html += '  </div>';
        } else {
          const style = d.treatment.includes('0 2px') 
            ? `box-shadow: ${d.treatment}; border: 1px solid var(--border);`
            : `border: ${d.treatment};`;
          html += '  <div class="depth-demo__container" style="' + style + '">';
          html += '    <span>Subtle depth</span>';
          html += '  </div>';
        }
        
        html += '</div>';
      });

      html += '</div>';

      /* Border radius */
      html += '<div class="section">';
      html += '  <div class="section__label">Border Radius</div>';

      Object.entries(radius).forEach(([key, obj]) => {
        const radiusValue = obj.value;

        html += '<div class="radius-item">';
        html += '  <div class="radius-item__demo">';
        html += '    <div class="radius-item__box" style="border-radius: ' + esc(radiusValue) + '"></div>';
        html += '  </div>';
        html += '  <div class="radius-item__info">';
        html += '    <div class="radius-item__name">--radius-' + esc(key) + '</div>';
        html += '    <div class="radius-item__value">' + esc(radiusValue) + '</div>';
        html += '    <div class="radius-item__description">' + esc(obj.use) + '</div>';
        html += '  </div>';
        html += '</div>';
      });

      html += '</div>';

      /* Whitespace philosophy */
      html += '<div class="philosophy" style="margin-top: 96px; margin-bottom: 0;">';
      html += '  <div class="philosophy__title">Whitespace Strategy</div>';
      html += '  <div class="philosophy__text">';
      html += '    <strong>Breathe between blocks:</strong> Use <code>--s-6</code> (48px) or <code>--s-7</code> (64px) between major content sections for visual clarity. <strong>Compress within:</strong> Internal padding uses <code>--s-3</code> (16px) to <code>--s-4</code> (24px)—dense enough for scannability, loose enough for comfort. <strong>Gradient as accent:</strong> Gradients add visual interest where solid colors feel flat. Use them on primary buttons, hero sections, and card backgrounds—never on text. The rounded corners (<code>--radius-md</code>) soften hard edges and invite interaction.';
      html += '  </div>';
      html += '</div>';

      app.innerHTML = html;
    }

    function esc(s) {
      const d = document.createElement('div');
      d.textContent = String(s);
      return d.innerHTML;
    }
  </script>
</body>
</html>
