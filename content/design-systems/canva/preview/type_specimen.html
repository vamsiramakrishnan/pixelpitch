<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Type Specimen — Canva</title>
  <link rel="stylesheet" href="../colors_and_type.css">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: var(--font-body, system-ui, sans-serif);
      background: var(--paper);
      color: var(--ink);
      line-height: 1.6;
    }

    .page {
      max-width: 1200px;
      margin: 0 auto;
      padding: var(--s-7) var(--s-5);
    }

    /* Header */
    .header {
      margin-bottom: var(--s-7);
    }

    .header__title {
      font-family: var(--font-body);
      font-size: 52px;
      font-weight: 800;
      line-height: 1.1;
      letter-spacing: -0.02em;
      color: var(--ink);
      margin-bottom: var(--s-3);
    }

    .header__subtitle {
      font-size: 18px;
      font-weight: 400;
      color: var(--slate);
      max-width: 700px;
      margin-bottom: var(--s-4);
    }

    .header__rule {
      display: block;
      width: 80px;
      height: 4px;
      background: linear-gradient(90deg, var(--color-purple-to-blue-gradient), var(--color-canva-cyan));
      border: none;
      border-radius: 2px;
      margin-top: var(--s-4);
    }

    /* Font families overview */
    .font-families {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
      gap: var(--s-4);
      margin-bottom: var(--s-7);
    }

    .font-card {
      background: var(--paper);
      border: var(--card-border);
      border-radius: var(--card-radius);
      padding: var(--s-5);
      box-shadow: var(--card-shadow);
    }

    .font-card__label {
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--slate);
      margin-bottom: var(--s-2);
    }

    .font-card__name {
      font-size: 28px;
      font-weight: 700;
      line-height: 1.2;
      margin-bottom: var(--s-2);
      color: var(--ink);
    }

    .font-card__fallback {
      font-family: var(--font-mono);
      font-size: 12px;
      color: var(--color-ink-muted);
      word-break: break-all;
      line-height: 1.5;
    }

    .font-card__note {
      font-size: 13px;
      color: var(--slate);
      margin-top: var(--s-2);
      font-weight: 400;
      line-height: 1.5;
    }

    /* Character set block */
    .character-set {
      background: var(--bone);
      border: var(--card-border);
      border-radius: var(--card-radius);
      padding: var(--s-6);
      margin-bottom: var(--s-7);
    }

    .character-set__label {
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--slate);
      margin-bottom: var(--s-3);
    }

    .character-set__chars {
      font-size: 32px;
      line-height: 1.6;
      letter-spacing: 0.02em;
      color: var(--ink);
      word-break: break-all;
      font-weight: 600;
    }

    /* Section label */
    .section-label {
      font-family: var(--font-body);
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--slate);
      margin-bottom: var(--s-4);
      padding-bottom: var(--s-3);
      border-bottom: 1px solid var(--border);
    }

    /* Ramp row */
    .ramp-row {
      display: grid;
      grid-template-columns: 280px 1fr;
      gap: var(--s-5);
      align-items: baseline;
      padding: var(--s-5) 0;
      border-bottom: 1px solid var(--border);
    }

    .ramp-row:last-child {
      border-bottom: none;
    }

    @media (max-width: 800px) {
      .ramp-row {
        grid-template-columns: 1fr;
        gap: var(--s-3);
        align-items: flex-start;
      }
    }

    /* Meta column */
    .ramp-meta__role {
      font-family: var(--font-body);
      font-size: 16px;
      font-weight: 700;
      color: var(--ink);
      margin-bottom: var(--s-2);
    }

    .ramp-meta__detail {
      font-family: var(--font-mono);
      font-size: 11px;
      line-height: 1.8;
      color: var(--color-ink-muted);
      white-space: pre;
    }

    /* Sample column */
    .ramp-sample {
      color: var(--ink);
      overflow-wrap: break-word;
    }

    /* Ramp section container */
    .ramp-section {
      margin-bottom: var(--s-7);
    }

    /* Drop cap demo */
    .drop-cap-demo {
      background: var(--surface);
      border: var(--card-border);
      border-radius: var(--card-radius);
      padding: var(--s-5);
      margin-top: var(--s-6);
    }

    .drop-cap-demo__label {
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--slate);
      margin-bottom: var(--s-3);
    }

    .drop-cap-demo__text {
      font-size: 16px;
      line-height: 1.7;
      color: var(--ink);
    }

    .drop-cap-demo__text::first-letter {
      font-size: 64px;
      font-weight: 800;
      float: left;
      line-height: 1;
      margin-right: 8px;
      margin-top: -2px;
      background: linear-gradient(135deg, var(--color-purple-to-blue-gradient), var(--color-canva-cyan));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    /* Loading */
    .loading {
      text-align: center;
      padding: 120px var(--s-5);
      color: var(--slate);
      font-size: 16px;
    }

    .loading::after {
      content: '';
      display: block;
      width: 40px;
      height: 40px;
      margin: var(--s-4) auto 0;
      border: 3px solid var(--border);
      border-top-color: var(--color-purple-to-blue-gradient);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .ramp-section {
      margin-bottom: var(--s-7);
    }
  </style>
</head>
<body>
  <div class="page" id="app">
    <div class="loading">Loading design tokens…</div>
  </div>

  <script>
    const EDITORIAL_SAMPLES = [
      'Design anything. Create anything. Share everything.',
      'Whether you're designing a poster, flyer, or social post—you've got the tools.',
      'Transform your ideas into stunning designs in minutes, not hours.',
      'Every template is professionally crafted and ready to customize.',
      'With millions of images, icons, and fonts at your fingertips, creativity has no limits.',
      'Collaborate in real time with team members across the globe.',
      'From startups to enterprises, millions of creators choose Canva.',
      'Your imagination is the only limit when you have the right design platform.',
    ];

    (window.__DESIGN_TOKENS__ ? Promise.resolve({ ok: true, json: () => Promise.resolve(window.__DESIGN_TOKENS__) }) : fetch('../tokens.json'))
      .then(r => {
        if (!r.ok) throw new Error('tokens.json not found (' + r.status + ')');
        return r.json();
      })
      .then(render)
      .catch(err => {
        document.getElementById('app').innerHTML =
          '<div class="loading" style="color:#ff5757">' +
          'Could not load tokens.json — ' + err.message + '</div>';
      });

    function render(tokens) {
      const app = document.getElementById('app');
      const name = tokens.meta?.title || tokens.name || 'Design System';
      const ramp = tokens.typography?.ramp || tokens.typeRamp || [];

      let html = '';

      /* Header */
      html += '<header class="header">';
      html += '  <h1 class="header__title">One typeface.<br>Every weight.</h1>';
      html += '  <p class="header__subtitle">Type Specimen — ' + ramp.length + ' typographic roles for ' + name + '</p>';
      html += '  <hr class="header__rule">';
      html += '</header>';

      /* Font families */
      html += '<div class="font-families">';
      html += '  <div class="font-card">';
      html += '    <div class="font-card__label">Primary</div>';
      html += '    <div class="font-card__name">Canva Sans</div>';
      html += '    <div class="font-card__fallback">\'YS Text\', system-ui, -apple-system, sans-serif</div>';
      html += '    <div class="font-card__note">Geometric sans-serif. UI, display, and body text. Weight-driven hierarchy. 400–800.</div>';
      html += '  </div>';
      html += '  <div class="font-card">';
      html += '    <div class="font-card__label">Code</div>';
      html += '    <div class="font-card__name">JetBrains Mono</div>';
      html += '    <div class="font-card__fallback">ui-monospace, Menlo, Consolas, monospace</div>';
      html += '    <div class="font-card__note">Monospace for code blocks, development tooling, and technical documentation only.</div>';
      html += '  </div>';
      html += '</div>';

      /* Character set */
      html += '<div class="character-set">';
      html += '  <div class="character-set__label">Character Set</div>';
      html += '  <div class="character-set__chars">AaBbCcDdEeFfGgHhIiJjKkLlMmNnOoPpQqRrSsTtUuVvWwXxYyZz<br>0123456789 !@#$%&amp;*()–—''"", </div>';
      html += '</div>';

      /* Type ramp */
      if (ramp.length) {
        html += '<div class="ramp-section">';
        html += '<div class="section-label">Type Ramp</div>';
        ramp.forEach((entry, i) => {
          html += rampRow(entry, i);
        });
        html += '</div>';
      }

      /* Drop cap demo */
      html += '<div class="drop-cap-demo">';
      html += '  <div class="drop-cap-demo__label">Drop Cap Demo</div>';
      html += '  <p class="drop-cap-demo__text">';
      html += 'Design is not just what it looks like and feels like. Design is how it works. At Canva, we believe everyone should be able to design. Our mission is to empower the world to design. Whether you\'re creating a business card, presentation, or social media graphic, we provide the tools and inspiration to bring your vision to life.';
      html += '  </p>';
      html += '</div>';

      app.innerHTML = html;
    }

    function rampRow(entry, idx) {
      const role = entry.role || 'Role ' + (idx + 1);
      const size = entry.size || '16px';
      const weight = entry.weight || 400;
      const lh = entry.lineHeight || '1.5';
      const ls = entry.letterSpacing || 'normal';
      const sampleIdx = idx % EDITORIAL_SAMPLES.length;
      const sample = EDITORIAL_SAMPLES[sampleIdx];

      const sizeNum = parseFloat(size);
      const displaySample = sizeNum >= 48
        ? sample.split('.')[0] + '.'
        : sample;

      let fontStyle = 'font-size:' + size + ';font-weight:' + weight + ';line-height:' + lh + ';';
      if (ls !== 'normal') fontStyle += 'letter-spacing:' + ls + ';';
      fontStyle += 'font-family:var(--font-body);';

      let meta = '';
      meta += esc(size) + ' / ' + esc(String(weight));
      meta += '\nline-height: ' + esc(String(lh));
      if (ls !== 'normal') meta += '\nletter-spacing: ' + esc(ls);

      return '' +
        '<div class="ramp-row">' +
        '  <div class="ramp-meta">' +
        '    <div class="ramp-meta__role">' + esc(role) + '</div>' +
        '    <pre class="ramp-meta__detail">' + meta + '</pre>' +
        '  </div>' +
        '  <div class="ramp-sample" style="' + fontStyle + '">' + esc(displaySample) + '</div>' +
        '</div>';
    }

    function esc(s) {
      const d = document.createElement('div');
      d.textContent = String(s);
      return d.innerHTML;
    }
  </script>
</body>
</html>
