<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Brand Motifs — D&A Force Multipliers</title>
  <link rel="stylesheet" href="../colors_and_type.css">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: var(--font-body, 'Source Serif 4', serif);
      background: var(--paper, #f4efe6);
      color: var(--ink, #111111);
      line-height: 1.6;
    }

    .page {
      max-width: 1100px;
      margin: 0 auto;
      padding: 64px 32px;
    }

    /* ──── Header ──── */
    .header {
      margin-bottom: 80px;
    }

    .header__kicker {
      font-family: var(--font-mono, 'JetBrains Mono', monospace);
      font-size: 13px;
      font-weight: 500;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--slate, #6b6862);
      margin-bottom: 12px;
    }

    .header__title {
      font-family: var(--font-display, 'Fraunces', serif);
      font-size: 72px;
      font-weight: 400;
      line-height: 0.95;
      letter-spacing: -0.02em;
      color: var(--ink, #111111);
      margin-bottom: 16px;
    }

    .header__title span {
      color: var(--signal, #d94f1b);
      font-style: italic;
    }

    .header__subtitle {
      font-family: var(--font-body, 'Source Serif 4', serif);
      font-size: 20px;
      font-weight: 400;
      line-height: 1.55;
      color: var(--slate, #6b6862);
      max-width: 680px;
      margin-bottom: 24px;
    }

    .header__rule {
      display: block;
      width: 80px;
      height: 1px;
      background: var(--ink, #111111);
      border: none;
      margin-top: 32px;
    }

    /* ──── Section ──── */
    .section {
      margin-bottom: 80px;
    }

    .section__label {
      font-family: var(--font-mono, 'JetBrains Mono', monospace);
      font-size: 13px;
      font-weight: 500;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--slate, #6b6862);
      margin-bottom: 28px;
      padding-bottom: 12px;
      border-bottom: 1px solid var(--ink, #111111);
    }

    /* ──── Key Characteristics ──── */
    .traits-list {
      list-style: none;
      padding: 0;
    }

    .traits-list li {
      position: relative;
      padding: 16px 0 16px 28px;
      font-family: var(--font-body, 'Source Serif 4', serif);
      font-size: 18px;
      font-weight: 400;
      line-height: 1.55;
      color: var(--ink, #111111);
      border-bottom: 1px solid var(--border, #e5e5e5);
    }

    .traits-list li:last-child {
      border-bottom: none;
    }

    .traits-list li::before {
      content: '';
      position: absolute;
      left: 0;
      top: 24px;
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--signal, #d94f1b);
    }

    /* ──── Do's and Don'ts ──── */
    .dd-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 32px;
    }

    @media (max-width: 768px) {
      .dd-grid {
        grid-template-columns: 1fr;
      }
    }

    .dd-card {
      background: var(--paper, #f4efe6);
      border: 1px solid var(--ink, #111111);
      border-radius: 0;
      padding: 32px;
    }

    .dd-card__heading {
      font-family: var(--font-mono, 'JetBrains Mono', monospace);
      font-size: 13px;
      font-weight: 500;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      margin-bottom: 20px;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .dd-card__heading--do {
      color: var(--ink, #111111);
    }

    .dd-card__heading--dont {
      color: var(--signal, #d94f1b);
    }

    .dd-card__icon {
      width: 20px;
      height: 20px;
      border-radius: 50%;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      font-size: 12px;
      flex-shrink: 0;
      border: 2px solid currentColor;
    }

    .dd-card__icon--do {
      color: var(--ink, #111111);
    }

    .dd-card__icon--dont {
      color: var(--signal, #d94f1b);
    }

    .dd-list {
      list-style: none;
      padding: 0;
    }

    .dd-list li {
      font-family: var(--font-body, 'Source Serif 4', serif);
      font-size: 16px;
      font-weight: 400;
      line-height: 1.55;
      color: var(--ink, #111111);
      padding: 12px 0;
      border-bottom: 1px solid var(--border, #e5e5e5);
    }

    .dd-list li:last-child {
      border-bottom: none;
    }

    /* ──── Color Harmony Strip ──── */
    .harmony-strip {
      display: flex;
      border-radius: 0;
      overflow: hidden;
      height: 120px;
      border: 1px solid var(--ink, #111111);
    }

    .harmony-strip__swatch {
      flex: 1;
      position: relative;
      transition: flex 0.3s ease;
      cursor: default;
      display: flex;
      align-items: flex-end;
      justify-content: center;
      padding-bottom: 12px;
    }

    .harmony-strip__swatch:hover {
      flex: 1.4;
    }

    .harmony-strip__label {
      font-family: var(--font-mono, 'JetBrains Mono', monospace);
      font-size: 11px;
      font-weight: 500;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      padding: 4px 8px;
      white-space: nowrap;
      opacity: 0.7;
      transition: opacity 0.2s ease;
    }

    .harmony-strip__swatch:hover .harmony-strip__label {
      opacity: 1;
    }

    /* ──── Type Pairing Demo ──── */
    .type-pairing {
      background: var(--paper, #f4efe6);
      border: 1px solid var(--ink, #111111);
      border-radius: 0;
      padding: 48px 40px;
    }

    .type-pairing__kicker {
      font-family: var(--font-mono, 'JetBrains Mono', monospace);
      font-size: 13px;
      font-weight: 500;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--slate, #6b6862);
      margin-bottom: 12px;
    }

    .type-pairing__display {
      font-family: var(--font-display, 'Fraunces', serif);
      font-size: 54px;
      font-weight: 400;
      line-height: 1.1;
      letter-spacing: -0.02em;
      color: var(--ink, #111111);
      margin-bottom: 20px;
    }

    .type-pairing__display span {
      color: var(--signal, #d94f1b);
      font-style: italic;
    }

    .type-pairing__body {
      font-family: var(--font-body, 'Source Serif 4', serif);
      font-size: 18px;
      font-weight: 400;
      line-height: 1.65;
      color: var(--ink, #111111);
      max-width: 720px;
      margin-bottom: 28px;
    }

    .type-pairing__meta {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 24px;
      padding-top: 16px;
      border-top: 1px solid var(--ink, #111111);
    }

    @media (max-width: 640px) {
      .type-pairing__meta {
        grid-template-columns: 1fr;
      }
    }

    .type-pairing__meta-item {
      font-family: var(--font-mono, 'JetBrains Mono', monospace);
      font-size: 12px;
      font-weight: 500;
      letter-spacing: 0.06em;
      color: var(--slate, #6b6862);
    }

    .type-pairing__meta-label {
      font-weight: 600;
      color: var(--ink, #111111);
      display: block;
      margin-bottom: 4px;
    }

    /* ──── Atmosphere Card ──── */
    .atmosphere-card {
      background: var(--paper, #f4efe6);
      border: 1px solid var(--ink, #111111);
      border-radius: 0;
      padding: 32px;
      max-width: 840px;
    }

    .atmosphere-card p {
      font-family: var(--font-body, 'Source Serif 4', serif);
      font-size: 18px;
      font-weight: 400;
      line-height: 1.65;
      color: var(--ink, #111111);
    }

    /* ──── Rule of One Visual ──── */
    .rule-of-one {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 32px;
      margin-top: 24px;
    }

    @media (max-width: 768px) {
      .rule-of-one {
        grid-template-columns: 1fr;
      }
    }

    .rule-slide {
      border: 2px solid var(--ink, #111111);
      border-radius: 0;
      aspect-ratio: 16 / 10;
      padding: 40px;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
    }

    .rule-slide--correct {
      background: var(--paper, #f4efe6);
    }

    .rule-slide--incorrect {
      background: var(--paper, #f4efe6);
    }

    .rule-slide__kicker {
      font-family: var(--font-mono, 'JetBrains Mono', monospace);
      font-size: 12px;
      font-weight: 500;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--slate, #6b6862);
      margin-bottom: 12px;
    }

    .rule-slide__headline {
      font-family: var(--font-display, 'Fraunces', serif);
      font-size: 40px;
      font-weight: 400;
      line-height: 1.1;
      letter-spacing: -0.02em;
      color: var(--ink, #111111);
      margin-bottom: 0;
    }

    .rule-slide__accent {
      color: var(--signal, #d94f1b);
      font-style: italic;
    }

    .rule-slide__label {
      font-family: var(--font-mono, 'JetBrains Mono', monospace);
      font-size: 11px;
      font-weight: 500;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--slate, #6b6862);
      margin-top: 24px;
      padding-top: 16px;
      border-top: 1px solid var(--ink, #111111);
    }

    /* ──── Loading ──── */
    .loading {
      text-align: center;
      padding: 120px 24px;
      color: var(--slate, #6b6862);
      font-size: 18px;
      font-family: var(--font-body, 'Source Serif 4', serif);
    }

    .loading::after {
      content: '';
      display: block;
      width: 32px;
      height: 32px;
      margin: 20px auto 0;
      border: 2px solid var(--border, #e5e5e5);
      border-top-color: var(--signal, #d94f1b);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div class="page" id="app">
    <div class="loading">Loading design tokens…</div>
  </div>

  <script>
    const CORE_COLOR_KEYS = ['paper', 'ink', 'slate', 'signal', 'bone'];

    (window.__DESIGN_TOKENS__ ? Promise.resolve({ ok: true, json: () => Promise.resolve(window.__DESIGN_TOKENS__) }) : fetch('../tokens.json'))
      .then(r => {
        if (!r.ok) throw new Error('tokens.json not found (' + r.status + ')');
        return r.json();
      })
      .then(render)
      .catch(err => {
        document.getElementById('app').innerHTML =
          '<div class="loading" style="color:#d94f1b">' +
          'Could not load tokens.json — ' + err.message + '</div>';
      });

    function render(tokens) {
      const app = document.getElementById('app');
      const colors = tokens.colors || {};
      const meta = tokens.meta || {};

      let html = '';

      /* ──── Header ──── */
      html += '<header class="header">';
      html += '  <div class="header__kicker">Brand Identity</div>';
      html += '  <h1 class="header__title">The <span>DNA</span> of D&A Force Multipliers</h1>';
      html += '  <p class="header__subtitle">Editorial restraint, typographic hierarchy, and the rule of one. Every pixel serves the story.</p>';
      html += '  <hr class="header__rule">';
      html += '</header>';

      /* ──── Atmosphere ──── */
      html += '<div class="section">';
      html += '  <div class="section__label">Atmosphere</div>';
      html += '  <div class="atmosphere-card">';
      html += '    <p>D&A Force Multipliers reads like a printed quarterly, not a SaaS pitch. The canvas is warm newsprint (#F4EFE6), the palette is exactly five tokens, and depth comes from hairline rules — never shadows. One orange accent appears per slide. Headlines set tight (0.95 line height) while body text opens to 1.55. Every headline carries a mono ALL-CAPS kicker. No marketing register. No gradients. No rounded corners. Confidence through restraint.</p>';
      html += '  </div>';
      html += '</div>';

      /* ──── Key Characteristics ──── */
      html += '<div class="section">';
      html += '  <div class="section__label">Key Characteristics</div>';
      html += '  <ul class="traits-list">';
      html += '    <li>Warm newsprint canvas (#F4EFE6) evoking printed editorial, not screens</li>';
      html += '    <li>Five-token palette: paper, bone, ink, slate, signal — nothing else in chrome</li>';
      html += '    <li>Four typefaces in four locked lanes — Fraunces, Source Serif 4, Geist, JetBrains Mono</li>';
      html += '    <li>One signal-orange element per slide maximum (the "rule of one")</li>';
      html += '    <li>Depth from hairline rule weight, never shadows or gradients</li>';
      html += '    <li>Square corners everywhere — border-radius: 0 is the default law</li>';
      html += '    <li>Mono ALL-CAPS kickers above every headline, 0.14em tracking</li>';
      html += '    <li>Tight headlines (0.95 line height) contrast with open body (1.55)</li>';
      html += '    <li>Editorial voice: sentences over fragments, specific over universal</li>';
      html += '  </ul>';
      html += '</div>';

      /* ──── Do's and Don'ts ──── */
      html += '<div class="section">';
      html += '  <div class="section__label">Do\'s and Don\'ts</div>';
      html += '  <div class="dd-grid">';

      html += '  <div class="dd-card">';
      html += '    <div class="dd-card__heading dd-card__heading--do">';
      html += '      <span class="dd-card__icon dd-card__icon--do">✓</span> Do';
      html += '    </div>';
      html += '    <ul class="dd-list">';
      html += '      <li>Use Paper (#F4EFE6) as the default canvas on every slide</li>';
      html += '      <li>Put a mono ALL-CAPS kicker above every headline</li>';
      html += '      <li>Use Source Serif 4 for paragraphs longer than two lines</li>';
      html += '      <li>Keep images square-cornered, edge-to-edge, grayscale</li>';
      html += '      <li>Separate content with hairline rules or whitespace</li>';
      html += '      <li>Scale headlines aggressively: 96–110px on hero, 44–56px on body</li>';
      html += '      <li>Underline one italic word per headline in Signal (#D94F1B)</li>';
      html += '      <li>Source every datum in mono caps: source, date, n</li>';
      html += '      <li>Write editorial sentences, never fragments or marketing speak</li>';
      html += '    </ul>';
      html += '  </div>';

      html += '  <div class="dd-card">';
      html += '    <div class="dd-card__heading dd-card__heading--dont">';
      html += '      <span class="dd-card__icon dd-card__icon--dont">✕</span> Don\'t';
      html += '    </div>';
      html += '    <ul class="dd-list">';
      html += '      <li>Add box-shadow — anywhere, ever, for any reason</li>';
      html += '      <li>Round corners on rectangular containers — border-radius: 0</li>';
      html += '      <li>Mix typeface roles or use them outside their locked lanes</li>';
      html += '      <li>Use color outside the five tokens — no green, blue, purple</li>';
      html += '      <li>Paint two things Signal on the same slide</li>';
      html += '      <li>Use gradients, blurs, glassmorphism, or atmospheric effects</li>';
      html += '      <li>Use emoji, Lucide, Heroicons, Inter, or Roboto</li>';
      html += '      <li>Write marketing register ("Solved.", "Reimagined.", "Powered by")</li>';
      html += '      <li>Use exclamation marks or question-mark headlines as design</li>';
      html += '    </ul>';
      html += '  </div>';

      html += '  </div>';
      html += '</div>';

      /* ──── The Rule of One Visual ──── */
      html += '<div class="section">';
      html += '  <div class="section__label">The Rule of One</div>';
      html += '  <p style="font-family: var(--font-body); font-size: 16px; line-height: 1.65; color: var(--slate); margin-bottom: 24px; max-width: 840px;">One signal-orange element per slide. Two is a bug. The accent appears in exactly one place — a kicker, an underline, a border, a single word. Never scattered. Never layered. This restraint is what makes it work.</p>';
      html += '  <div class="rule-of-one">';

      html += '    <div class="rule-slide rule-slide--correct">';
      html += '      <div class="rule-slide__kicker">Correct</div>';
      html += '      <div class="rule-slide__headline">One accent <span class="rule-slide__accent">anchors</span> the slide</div>';
      html += '      <div class="rule-slide__label">One signal element. Precise. Purposeful.</div>';
      html += '    </div>';

      html += '    <div class="rule-slide rule-slide--incorrect">';
      html += '      <div class="rule-slide__kicker">Incorrect</div>';
      html += '      <div style="font-size: 24px; font-family: var(--font-display); color: var(--signal); margin-bottom: 12px;">Multiple signals</div>';
      html += '      <div class="rule-slide__headline">Create <span class="rule-slide__accent">visual</span> chaos</div>';
      html += '      <div class="rule-slide__label">Competing accents dilute hierarchy and power.</div>';
      html += '    </div>';

      html += '  </div>';
      html += '</div>';

      /* ──── Color Harmony Strip ──── */
      const harmonyKeys = CORE_COLOR_KEYS.filter(k => colors[k]);
      if (harmonyKeys.length) {
        html += '<div class="section">';
        html += '  <div class="section__label">Color Harmony</div>';
        html += '  <div class="harmony-strip">';

        harmonyKeys.forEach(key => {
          const hex = colors[key];
          const lum = relativeLuminance(hex);
          const labelColor = lum > 0.5 ? '#111111' : '#f4efe6';
          html += '<div class="harmony-strip__swatch" style="background:' + esc(hex) + '">';
          html += '  <span class="harmony-strip__label" style="color:' + labelColor + '">' + esc(key.toUpperCase()) + '</span>';
          html += '</div>';
        });

        html += '  </div>';
        html += '</div>';
      }

      /* ──── Typography Pairing ──── */
      html += '<div class="section">';
      html += '  <div class="section__label">Typography Pairing</div>';
      html += '  <div class="type-pairing">';

      html += '    <div class="type-pairing__kicker">Display + Body</div>';
      html += '    <div class="type-pairing__display">Headlines set <span>tight</span>, body text opens wide</div>';

      html += '    <div class="type-pairing__body">Typography carries the entire hierarchy. Fraunces sets display headlines and hero numerals at 0.95 line height. Source Serif 4 carries all body reading at 1.55 line height. The contrast between tight and open is the editorial fingerprint. Headlines breathe differently than paragraphs. Every scale decision reinforces the information architecture.</div>';

      html += '    <div class="type-pairing__meta">';
      html += '      <div class="type-pairing__meta-item">';
      html += '        <span class="type-pairing__meta-label">Display Font</span>';
      html += '        Fraunces, 400 weight';
      html += '      </div>';
      html += '      <div class="type-pairing__meta-item">';
      html += '        <span class="type-pairing__meta-label">Body Font</span>';
      html += '        Source Serif 4, 400 weight';
      html += '      </div>';
      html += '      <div class="type-pairing__meta-item">';
      html += '        <span class="type-pairing__meta-label">Mono Font</span>';
      html += '        JetBrains Mono, 500 weight';
      html += '      </div>';
      html += '    </div>';
      html += '  </div>';
      html += '</div>';

      /* ──── Type Ramp Section ──── */
      html += '<div class="section">';
      html += '  <div class="section__label">Type Ramp & Roles</div>';
      html += '  <div style="border: 1px solid var(--ink); border-radius: 0; padding: 32px; background: var(--paper);">';

      const ramp = [
        { role: 'Hero', size: '96px', weight: '400', lineHeight: '0.95', font: 'Fraunces', example: 'Leading insight' },
        { role: 'Display', size: '72px', weight: '400', lineHeight: '0.95', font: 'Fraunces', example: 'Major headline' },
        { role: 'Headline', size: '54px', weight: '400', lineHeight: '1.10', font: 'Fraunces', example: 'Slide heading' },
        { role: 'Subhead', size: '36px', weight: '400', lineHeight: '1.10', font: 'Fraunces', example: 'Section title' },
        { role: 'Lead', size: '28px', weight: '400', lineHeight: '1.35', font: 'Fraunces', example: 'Deck intro' },
        { role: 'Body', size: '22px', weight: '400', lineHeight: '1.55', font: 'Source Serif 4', example: 'Main paragraph text for reading' },
        { role: 'Caption', size: '16px', weight: '500', lineHeight: '1.35', font: 'Geist', example: 'Image caption or label' },
        { role: 'Kicker', size: '14px', weight: '500', lineHeight: '1.00', font: 'JetBrains Mono', example: 'ABOVE EVERY HEADLINE' },
        { role: 'Meta', size: '13px', weight: '500', lineHeight: '1.00', font: 'JetBrains Mono', example: 'SOURCE · DATE · N' }
      ];

      ramp.forEach((item, i) => {
        const fontFamily = item.font === 'Fraunces' ? 'var(--font-display)' :
                          item.font === 'Source Serif 4' ? 'var(--font-body)' :
                          item.font === 'Geist' ? 'var(--font-body)' : 'var(--font-mono)';
        
        html += '<div style="margin-bottom: 28px; padding-bottom: 24px; border-bottom: 1px solid var(--border); display: flex; gap: 24px; align-items: flex-start;">';
        html += '  <div style="flex: 0 0 160px;">';
        html += '    <div style="font-family: var(--font-mono); font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--slate); font-weight: 500; margin-bottom: 4px;">' + esc(item.role) + '</div>';
        html += '    <div style="font-family: var(--font-mono); font-size: 12px; color: var(--slate); line-height: 1.5;">' + esc(item.size) + '<br>' + esc(item.font) + ' ' + esc(item.weight) + '<br>LH ' + esc(item.lineHeight) + '</div>';
        html += '  </div>';
        html += '  <div style="flex: 1;">';
        html += '    <div style="font-family: ' + fontFamily + '; font-size: ' + item.size + '; font-weight: ' + item.weight + '; line-height: ' + item.lineHeight + '; letter-spacing: ' + (item.role === 'Hero' || item.role === 'Display' || item.role === 'Headline' ? '-0.02em' : '0') + '; color: var(--ink); margin-bottom: 8px;">' + esc(item.example) + '</div>';
        html += '  </div>';
        html += '</div>';
      });

      html += '  </div>';
      html += '</div>';

      app.innerHTML = html;
    }

    /* ──── Utilities ──── */
    function esc(s) {
      const d = document.createElement('div');
      d.textContent = String(s);
      return d.innerHTML;
    }

    function hexToRgb(hex) {
      hex = hex.replace(/^#/, '');
      if (hex.length === 3) hex = hex.split('').map(c => c + c).join('');
      const n = parseInt(hex, 16);
      return [(n >> 16) & 255, (n >> 8) & 255, n & 255];
    }

    function relativeLuminance(hex) {
      try {
        const [r, g, b] = hexToRgb(hex).map(c => {
          c /= 255;
          return c <= 0.03928 ? c / 12.92 : Math.pow((c + 0.055) / 1.055, 2.4);
        });
        return 0.2126 * r + 0.7152 * g + 0.0722 * b;
      } catch { return 0.5; }
    }
  </script>
