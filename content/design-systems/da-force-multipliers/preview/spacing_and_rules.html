<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Spacing &amp; Rules — D&A Force Multipliers</title>
  <link rel="stylesheet" href="../colors_and_type.css">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: var(--font-body, 'Source Serif 4', serif);
      background: var(--paper, #f4efe6);
      color: var(--ink, #111111);
      line-height: 1.6;
    }

    .page {
      max-width: 1100px;
      margin: 0 auto;
      padding: 96px 64px;
    }

    /* Header / Stage head */
    .header {
      margin-bottom: 96px;
      position: relative;
    }

    .header__kicker {
      font-family: var(--font-mono, 'JetBrains Mono', monospace);
      font-size: 14px;
      font-weight: 500;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--slate, #6b6862);
      margin-bottom: 12px;
    }

    .header__title {
      font-family: var(--font-display, Fraunces);
      font-size: 72px;
      font-weight: 400;
      line-height: 0.95;
      letter-spacing: -0.02em;
      color: var(--ink, #111111);
      margin-bottom: 8px;
      max-width: 90%;
    }

    .header__subtitle {
      font-family: var(--font-body, 'Source Serif 4', serif);
      font-size: 22px;
      font-weight: 400;
      line-height: 1.55;
      color: var(--slate, #6b6862);
      max-width: 70%;
      margin-bottom: 32px;
    }

    .header__rule {
      display: block;
      width: 96px;
      height: 3px;
      background: var(--signal, #d94f1b);
      border: none;
      margin-top: 24px;
    }

    /* Section */
    .section {
      margin-bottom: 96px;
    }

    .section__label {
      font-family: var(--font-mono, 'JetBrains Mono', monospace);
      font-size: 14px;
      font-weight: 500;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--slate, #6b6862);
      margin-bottom: 48px;
      padding-bottom: 16px;
      border-bottom: 1px solid var(--ink, #111111);
    }

    /* Spacing scale */
    .spacing-row {
      display: grid;
      grid-template-columns: 120px 1fr 100px;
      gap: 24px;
      align-items: center;
      padding: 24px 0;
      border-bottom: 1px solid rgba(17, 17, 17, 0.12);
    }

    .spacing-row:last-child {
      border-bottom: none;
    }

    .spacing-row__name {
      font-family: var(--font-mono, 'JetBrains Mono', monospace);
      font-size: 14px;
      font-weight: 500;
      color: var(--ink, #111111);
    }

    .spacing-row__label {
      font-family: var(--font-body, 'Source Serif 4', serif);
      font-size: 13px;
      color: var(--slate, #6b6862);
      margin-top: 4px;
    }

    .spacing-row__bar-wrap {
      height: 32px;
      display: flex;
      align-items: center;
    }

    .spacing-row__bar {
      height: 2px;
      background: var(--ink, #111111);
      min-width: 2px;
      transition: opacity 0.2s ease;
    }

    .spacing-row:hover .spacing-row__bar {
      opacity: 0.5;
    }

    .spacing-row__value {
      font-family: var(--font-mono, 'JetBrains Mono', monospace);
      font-size: 14px;
      font-weight: 500;
      color: var(--ink, #111111);
      text-align: right;
    }

    /* Rule weights */
    .rule-demo {
      padding: 32px 0;
      border-bottom: 1px solid rgba(17, 17, 17, 0.12);
    }

    .rule-demo:last-child {
      border-bottom: none;
    }

    .rule-demo__header {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      margin-bottom: 16px;
    }

    .rule-demo__name {
      font-family: var(--font-mono, 'JetBrains Mono', monospace);
      font-size: 14px;
      font-weight: 500;
      color: var(--ink, #111111);
    }

    .rule-demo__label {
      font-family: var(--font-body, 'Source Serif 4', serif);
      font-size: 13px;
      color: var(--slate, #6b6862);
    }

    .rule-demo__spec {
      font-family: var(--font-mono, 'JetBrains Mono', monospace);
      font-size: 13px;
      color: var(--slate, #6b6862);
    }

    .rule-demo__container {
      width: 100%;
      height: 48px;
      display: flex;
      align-items: center;
      padding: 0;
    }

    .rule-demo__line {
      width: 100%;
      border: none;
      border-radius: 0;
      margin: 0;
    }

    /* Border radius */
    .radius-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 64px;
      margin-bottom: 48px;
    }

    .radius-item {
      display: grid;
      grid-template-columns: 160px 1fr;
      gap: 32px;
      align-items: center;
    }

    .radius-item__demo {
      display: flex;
      gap: 16px;
      align-items: center;
    }

    .radius-item__box {
      width: 120px;
      height: 120px;
      background: var(--paper, #f4efe6);
      border: 2px solid var(--ink, #111111);
      flex-shrink: 0;
    }

    .radius-item__info {
      flex: 1;
    }

    .radius-item__name {
      font-family: var(--font-mono, 'JetBrains Mono', monospace);
      font-size: 14px;
      font-weight: 500;
      color: var(--ink, #111111);
      margin-bottom: 4px;
    }

    .radius-item__value {
      font-family: var(--font-mono, 'JetBrains Mono', monospace);
      font-size: 13px;
      color: var(--slate, #6b6862);
      margin-bottom: 12px;
    }

    .radius-item__description {
      font-family: var(--font-body, 'Source Serif 4', serif);
      font-size: 13px;
      line-height: 1.55;
      color: var(--slate, #6b6862);
    }

    /* Depth philosophy block */
    .philosophy {
      background: var(--paper, #f4efe6);
      padding: 48px;
      border: 1px solid rgba(17, 17, 17, 0.12);
      margin-bottom: 64px;
    }

    .philosophy__title {
      font-family: var(--font-mono, 'JetBrains Mono', monospace);
      font-size: 13px;
      font-weight: 500;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--slate, #6b6862);
      margin-bottom: 16px;
    }

    .philosophy__text {
      font-family: var(--font-body, 'Source Serif 4', serif);
      font-size: 18px;
      line-height: 1.55;
      color: var(--ink, #111111);
    }

    .philosophy__text strong {
      font-weight: 600;
    }

    .philosophy__text em {
      font-style: italic;
    }

    .philosophy__text code {
      font-family: var(--font-mono, 'JetBrains Mono', monospace);
      background: rgba(17, 17, 17, 0.08);
      padding: 2px 6px;
      font-size: 0.95em;
    }

    /* Grid demo */
    .grid-demo {
      background: var(--paper, #f4efe6);
      padding: 48px;
      border: 1px solid rgba(17, 17, 17, 0.12);
      margin-bottom: 64px;
    }

    .grid-demo__title {
      font-family: var(--font-mono, 'JetBrains Mono', monospace);
      font-size: 13px;
      font-weight: 500;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--slate, #6b6862);
      margin-bottom: 24px;
    }

    .grid-demo__visual {
      width: 100%;
      height: 200px;
      display: grid;
      grid-template-columns: repeat(12, 1fr);
      gap: 16px;
      background-image: linear-gradient(90deg, rgba(217, 79, 27, 0.08) 1px, transparent 1px);
      background-size: calc(100% / 12) 100%;
      padding: 24px;
      border: 1px dashed rgba(17, 17, 17, 0.18);
    }

    .grid-demo__column {
      background: rgba(217, 79, 27, 0.12);
      border: 1px solid rgba(217, 79, 27, 0.25);
      font-family: var(--font-mono, 'JetBrains Mono', monospace);
      font-size: 11px;
      font-weight: 500;
      color: var(--signal, #d94f1b);
      display: flex;
      align-items: flex-end;
      justify-content: center;
      padding-bottom: 8px;
    }

    .grid-demo__info {
      margin-top: 16px;
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 24px;
    }

    .grid-demo__stat {
      font-family: var(--font-body, 'Source Serif 4', serif);
      font-size: 13px;
      color: var(--slate, #6b6862);
    }

    .grid-demo__stat-label {
      font-family: var(--font-mono, 'JetBrains Mono', monospace);
      font-size: 11px;
      font-weight: 500;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--slate, #6b6862);
      margin-bottom: 4px;
    }

    /* Loading */
    .loading {
      text-align: center;
      padding: 80px 24px;
      color: var(--slate, #6b6862);
      font-size: 16px;
    }

    .loading::after {
      content: '';
      display: block;
      width: 32px;
      height: 32px;
      margin: 16px auto 0;
      border: 2px solid rgba(17, 17, 17, 0.2);
      border-top-color: var(--signal, #d94f1b);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    @media (max-width: 900px) {
      .page {
        padding: 64px 32px;
      }

      .header {
        margin-bottom: 64px;
      }

      .header__title {
        font-size: 54px;
      }

      .section {
        margin-bottom: 64px;
      }

      .spacing-row {
        grid-template-columns: 100px 1fr 80px;
        gap: 16px;
      }

      .radius-grid {
        grid-template-columns: 1fr;
        gap: 32px;
      }

      .radius-item {
        grid-template-columns: 120px 1fr;
      }
    }
  </style>
</head>
<body>
  <div class="page" id="app">
    <div class="loading">Loading design tokens…</div>
  </div>

  <script>
    const DEFAULT_SPACING = {
      's-1': { value: '4px', label: 'xs' },
      's-2': { value: '8px', label: 'sm' },
      's-3': { value: '16px', label: 'md' },
      's-4': { value: '24px', label: 'lg' },
      's-5': { value: '32px', label: 'xl' },
      's-6': { value: '48px', label: '2xl' },
      's-7': { value: '64px', label: '3xl' },
      's-8': { value: '96px', label: '4xl' }
    };

    const DEFAULT_RULES = {
      'flat': { name: 'Flat', weight: 'none', color: 'transparent', use: 'Default canvas, body text' },
      'quiet': { name: 'Quiet', weight: '1px', color: 'rgba(17,17,17,0.18)', use: 'List item separators inside dense blocks' },
      'hairline': { name: 'Hairline', weight: '1px', color: '#111111', use: 'Editorial divider, story-to-story, folio strip' },
      'bold': { name: 'Bold', weight: '2px', color: '#111111', use: 'Slide chapter break, section header underline' },
      'display': { name: 'Display', weight: '3px', color: '#111111', use: 'Title-slide masthead rule. Used once per slide' }
    };

    const DEFAULT_RADIUS = {
      'none': { value: '0', use: 'Everything — every container, every image, every button, every table.' },
      'sm': { value: '8px', use: 'Reserved (not used in system).' },
      'md': { value: '16px', use: 'Reserved (not used in system).' },
      'lg': { value: '96px', use: 'Reserved (not used in system).' },
      'full': { value: '999px', use: 'Inline text spans only (LIVE, BREAKING). Never on containers.' }
    };

    ( window.__DESIGN_TOKENS__ ? Promise.resolve({ ok: true, json: () => Promise.resolve(window.__DESIGN_TOKENS__) }) : fetch('../tokens.json') )
      .then(r => {
        if (!r.ok) throw new Error('tokens.json not found (' + r.status + ')');
        return r.json();
      })
      .then(render)
      .catch(err => {
        document.getElementById('app').innerHTML =
          '<div class="loading" style="color:#dc2626">' +
          'Could not load tokens.json — ' + err.message + '</div>';
      });

    function render(tokens) {
      const app = document.getElementById('app');
      
      /* Load Google Fonts */
      const gfUrl = tokens.typography?.googleFontsUrl || tokens.googleFontsUrl;
      if (gfUrl) {
        const link = document.createElement('link');
        link.rel = 'stylesheet';
        link.href = gfUrl;
        document.head.appendChild(link);
      }

      const spacing = {};
      if (tokens.spacing?.scale) {
        Object.entries(tokens.spacing.scale).forEach(([k, v]) => {
          spacing[k] = { value: v, label: k };
        });
      } else {
        Object.assign(spacing, DEFAULT_SPACING);
      }

      const rules = DEFAULT_RULES;
      const radius = DEFAULT_RADIUS;

      let html = '';

      /* Header / Stage head */
      html += '<header class="header">';
      html += '  <div class="header__kicker">Spacing &amp; Rules</div>';
      html += '  <h1 class="header__title">Eight pixels.<br>One ruler.</h1>';
      html += '  <p class="header__subtitle">The spacing and depth system for D&amp;A Force Multipliers — a modular scale where every interval earns its whitespace through editorial pacing.</p>';
      html += '  <hr class="header__rule">';
      html += '</header>';

      /* Philosophy block */
      html += '<div class="philosophy">';
      html += '  <div class="philosophy__title">Depth Philosophy</div>';
      html += '  <div class="philosophy__text">';
      html += '    There are <strong>zero shadows</strong> in this system. Depth is communicated entirely through <strong>rule weight</strong> — a 1px hairline whispers, a 3px display rule shouts. The hierarchy is: quiet → hairline → bold → display. If a <code>box-shadow</code> appears anywhere, it is a bug. Replace it with a hairline rule or a bold border. <em>Newsprint, not digital.</em>';
      html += '  </div>';
      html += '</div>';

      /* Spacing scale */
      html += '<div class="section">';
      html += '  <div class="section__label">Spacing Scale</div>';

      const spacingEntries = Object.entries(spacing);
      const maxPx = Math.max(...spacingEntries.map(([, o]) => parseFloat(o.value) || 0), 1);

      spacingEntries.forEach(([key, obj]) => {
        const px = parseFloat(obj.value) || 0;
        const pct = Math.max((px / maxPx) * 100, 2);
        const label = obj.label || key;
        
        html += '<div class="spacing-row">';
        html += '  <div>';
        html += '    <div class="spacing-row__name">' + esc(key) + '</div>';
        html += '    <div class="spacing-row__label">' + esc(label) + '</div>';
        html += '  </div>';
        html += '  <div class="spacing-row__bar-wrap">';
        html += '    <div class="spacing-row__bar" style="width:' + pct + '%"></div>';
        html += '  </div>';
        html += '  <div class="spacing-row__value">' + esc(obj.value) + '</div>';
        html += '</div>';
      });

      html += '</div>';

      /* Grid visualization */
      html += '<div class="section">';
      html += '  <div class="section__label">Slide Grid</div>';
      html += '  <div class="grid-demo">';
      html += '    <div class="grid-demo__title">12-Column Grid (1920px canvas)</div>';
      html += '    <div class="grid-demo__visual">';
      for (let i = 1; i <= 12; i++) {
        html += '      <div class="grid-demo__column">' + i + '</div>';
      }
      html += '    </div>';
      html += '    <div class="grid-demo__info">';
      html += '      <div>';
      html += '        <div class="grid-demo__stat-label">Canvas width</div>';
      html += '        <div class="grid-demo__stat">1920px (fixed, not responsive)</div>';
      html += '      </div>';
      html += '      <div>';
      html += '        <div class="grid-demo__stat-label">Gutter &amp; Margins</div>';
      html += '        <div class="grid-demo__stat">32px gutters, 96px outer margins</div>';
      html += '      </div>';
      html += '      <div>';
      html += '        <div class="grid-demo__stat-label">Body copy measure</div>';
      html += '        <div class="grid-demo__stat">6 columns, capped at 62ch</div>';
      html += '      </div>';
      html += '      <div>';
      html += '        <div class="grid-demo__stat-label">Folio chrome</div>';
      html += '        <div class="grid-demo__stat">8% L/R margins, rules at 3% / 3.5%</div>';
      html += '      </div>';
      html += '    </div>';
      html += '  </div>';
      html += '</div>';

      /* Rule weights */
      html += '<div class="section">';
      html += '  <div class="section__label">Rule Weights</div>';

      Object.entries(rules).forEach(([key, rule]) => {
        const weight = rule.weight;
        const color = rule.color;
        const weightNum = parseFloat(weight) || 0;

        html += '<div class="rule-demo">';
        html += '  <div class="rule-demo__header">';
        html += '    <div>';
        html += '      <div class="rule-demo__name">' + esc(rule.name) + '</div>';
        html += '      <div class="rule-demo__label">' + esc(rule.use) + '</div>';
        html += '    </div>';
        html += '    <div class="rule-demo__spec">' + esc(weight) + '</div>';
        html += '  </div>';
        
        if (weight === 'none') {
          html += '  <div class="rule-demo__container" style="background: var(--paper); border: 1px dashed rgba(17,17,17,0.18);">';
          html += '    <div style="font-family: var(--font-mono); font-size: 12px; color: var(--slate);">No border or shadow</div>';
          html += '  </div>';
        } else {
          html += '  <div class="rule-demo__container">';
          html += '    <div class="rule-demo__line" style="height:' + weightNum + 'px; background:' + color + '"></div>';
          html += '  </div>';
        }
        
        html += '</div>';
      });

      html += '</div>';

      /* Border radius */
      html += '<div class="section">';
      html += '  <div class="section__label">Border Radius</div>';
      html += '  <p style="font-family: var(--font-body); font-size: 18px; color: var(--slate); line-height: 1.55; margin-bottom: 48px;">This system has <strong>no rounded corners by design</strong>. Everything is square (0). Only two exceptions exist:</p>';

      Object.entries(radius).forEach(([key, obj]) => {
        const radiusValue = obj.value;

        html += '<div class="radius-item">';
        html += '  <div class="radius-item__demo">';
        html += '    <div class="radius-item__box" style="border-radius: ' + esc(radiusValue) + '"></div>';
        html += '  </div>';
        html += '  <div class="radius-item__info">';
        html += '    <div class="radius-item__name">--radius-' + esc(key) + '</div>';
        html += '    <div class="radius-item__value">' + esc(radiusValue) + '</div>';
        html += '    <div class="radius-item__description">' + esc(obj.use) + '</div>';
        html += '  </div>';
        html += '</div>';
      });

      html += '</div>';

      /* Whitespace philosophy */
      html += '<div class="philosophy" style="margin-top: 96px; margin-bottom: 0;">';
      html += '  <div class="philosophy__title">Whitespace Philosophy</div>';
      html += '  <div class="philosophy__text">';
      html += '    <strong>Editorial pacing</strong>: Each slide is a spread in a printed quarterly. Generous vertical spacing (48–96px) between major blocks creates distinct reading zones. <strong>Density in content, void in structure</strong>: Body text is tight and information-dense (22px, 1.55 line-height, 62ch measure). But the space between sections is vast. The content earns its density by being surrounded by breathing room. <strong>The hairline is the space</strong>: Where other systems use cards and padding to separate content, this system uses a 1px ink rule and whitespace. The rule is the separator; the whitespace is the padding.';
      html += '  </div>';
      html += '</div>';

      app.innerHTML = html;
    }

    function esc(s) {
      const d = document.createElement('div');
      d.textContent = String(s);
      return d.innerHTML;
    }
  </script>
</body>
</html>
