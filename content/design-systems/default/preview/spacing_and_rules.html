<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Spacing &amp; Rules — Neutral Modern</title>
  <link rel="stylesheet" href="../colors_and_type.css">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: var(--font-body, system-ui, sans-serif);
      background: var(--paper, #ffffff);
      color: var(--ink, #111111);
      line-height: 1.6;
    }

    .page {
      max-width: 1200px;
      margin: 0 auto;
      padding: 96px 48px;
    }

    /* Header / Stage head */
    .header {
      margin-bottom: 96px;
      position: relative;
    }

    .header__kicker {
      font-family: var(--font-mono, ui-monospace, monospace);
      font-size: 12px;
      font-weight: 500;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--slate, #666666);
      margin-bottom: 16px;
    }

    .header__title {
      font-family: var(--font-display, system-ui, sans-serif);
      font-size: 64px;
      font-weight: 600;
      line-height: 1.2;
      letter-spacing: -0.01em;
      color: var(--ink, #111111);
      margin-bottom: 12px;
      max-width: 85%;
    }

    .header__subtitle {
      font-family: var(--font-body, system-ui, sans-serif);
      font-size: 20px;
      font-weight: 400;
      line-height: 1.5;
      color: var(--slate, #666666);
      max-width: 75%;
      margin-bottom: 32px;
    }

    .header__rule {
      display: block;
      width: 80px;
      height: 2px;
      background: var(--signal, #3b82f6);
      border: none;
      margin-top: 24px;
    }

    /* Section */
    .section {
      margin-bottom: 96px;
    }

    .section__label {
      font-family: var(--font-mono, ui-monospace, monospace);
      font-size: 12px;
      font-weight: 500;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--slate, #666666);
      margin-bottom: 48px;
      padding-bottom: 12px;
      border-bottom: 1px solid var(--border, #e5e5e5);
    }

    /* Spacing scale */
    .spacing-row {
      display: grid;
      grid-template-columns: 100px 1fr 80px;
      gap: 24px;
      align-items: center;
      padding: 20px 0;
      border-bottom: 1px solid var(--border, #e5e5e5);
    }

    .spacing-row:last-child {
      border-bottom: none;
    }

    .spacing-row__name {
      font-family: var(--font-mono, ui-monospace, monospace);
      font-size: 14px;
      font-weight: 500;
      color: var(--ink, #111111);
    }

    .spacing-row__label {
      font-family: var(--font-body, system-ui, sans-serif);
      font-size: 12px;
      color: var(--slate, #666666);
      margin-top: 4px;
    }

    .spacing-row__bar-wrap {
      height: 32px;
      display: flex;
      align-items: center;
    }

    .spacing-row__bar {
      height: 2px;
      background: var(--ink, #111111);
      min-width: 2px;
      transition: opacity 0.2s ease;
    }

    .spacing-row:hover .spacing-row__bar {
      opacity: 0.6;
    }

    .spacing-row__value {
      font-family: var(--font-mono, ui-monospace, monospace);
      font-size: 14px;
      font-weight: 500;
      color: var(--ink, #111111);
      text-align: right;
    }

    /* Rule weights */
    .rule-demo {
      padding: 32px 0;
      border-bottom: 1px solid var(--border, #e5e5e5);
    }

    .rule-demo:last-child {
      border-bottom: none;
    }

    .rule-demo__header {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      margin-bottom: 16px;
    }

    .rule-demo__name {
      font-family: var(--font-mono, ui-monospace, monospace);
      font-size: 14px;
      font-weight: 500;
      color: var(--ink, #111111);
    }

    .rule-demo__label {
      font-family: var(--font-body, system-ui, sans-serif);
      font-size: 12px;
      color: var(--slate, #666666);
    }

    .rule-demo__spec {
      font-family: var(--font-mono, ui-monospace, monospace);
      font-size: 12px;
      color: var(--slate, #666666);
    }

    .rule-demo__container {
      width: 100%;
      height: 48px;
      display: flex;
      align-items: center;
      padding: 0;
    }

    .rule-demo__line {
      width: 100%;
      border: none;
      border-radius: 0;
      margin: 0;
    }

    /* Border radius */
    .radius-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 64px;
      margin-bottom: 48px;
    }

    .radius-item {
      display: grid;
      grid-template-columns: 140px 1fr;
      gap: 32px;
      align-items: center;
    }

    .radius-item__demo {
      display: flex;
      gap: 16px;
      align-items: center;
    }

    .radius-item__box {
      width: 100px;
      height: 100px;
      background: var(--bone, #f5f5f5);
      border: 1px solid var(--border, #e5e5e5);
      flex-shrink: 0;
    }

    .radius-item__info {
      flex: 1;
    }

    .radius-item__name {
      font-family: var(--font-mono, ui-monospace, monospace);
      font-size: 14px;
      font-weight: 500;
      color: var(--ink, #111111);
      margin-bottom: 4px;
    }

    .radius-item__value {
      font-family: var(--font-mono, ui-monospace, monospace);
      font-size: 12px;
      color: var(--slate, #666666);
      margin-bottom: 12px;
    }

    .radius-item__description {
      font-family: var(--font-body, system-ui, sans-serif);
      font-size: 14px;
      line-height: 1.5;
      color: var(--slate, #666666);
    }

    /* Philosophy block */
    .philosophy {
      background: var(--bone, #f5f5f5);
      padding: 48px;
      border: 1px solid var(--border, #e5e5e5);
      border-radius: 8px;
      margin-bottom: 64px;
    }

    .philosophy__title {
      font-family: var(--font-mono, ui-monospace, monospace);
      font-size: 12px;
      font-weight: 500;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--slate, #666666);
      margin-bottom: 16px;
    }

    .philosophy__text {
      font-family: var(--font-body, system-ui, sans-serif);
      font-size: 16px;
      line-height: 1.5;
      color: var(--ink, #111111);
    }

    .philosophy__text strong {
      font-weight: 600;
    }

    .philosophy__text em {
      font-style: italic;
      color: var(--slate, #666666);
    }

    /* Grid demo */
    .grid-demo {
      background: var(--bone, #f5f5f5);
      padding: 48px;
      border: 1px solid var(--border, #e5e5e5);
      border-radius: 8px;
      margin-bottom: 64px;
    }

    .grid-demo__title {
      font-family: var(--font-mono, ui-monospace, monospace);
      font-size: 12px;
      font-weight: 500;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--slate, #666666);
      margin-bottom: 24px;
    }

    .grid-demo__visual {
      width: 100%;
      height: 200px;
      display: grid;
      grid-template-columns: repeat(12, 1fr);
      gap: 12px;
      background-image: linear-gradient(90deg, var(--signal, #3b82f6) 0%, var(--signal, #3b82f6) 1px, transparent 1px);
      background-size: calc(100% / 12) 100%;
      padding: 24px;
      border: 1px dashed var(--border, #e5e5e5);
      border-radius: 8px;
    }

    .grid-demo__column {
      background: rgba(59, 130, 246, 0.1);
      border: 1px solid rgba(59, 130, 246, 0.2);
      font-family: var(--font-mono, ui-monospace, monospace);
      font-size: 11px;
      font-weight: 500;
      color: var(--signal, #3b82f6);
      display: flex;
      align-items: flex-end;
      justify-content: center;
      padding-bottom: 8px;
    }

    .grid-demo__info {
      margin-top: 24px;
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 24px;
    }

    .grid-demo__stat {
      font-family: var(--font-body, system-ui, sans-serif);
      font-size: 14px;
      color: var(--ink, #111111);
    }

    .grid-demo__stat-label {
      font-family: var(--font-mono, ui-monospace, monospace);
      font-size: 11px;
      font-weight: 500;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--slate, #666666);
      margin-bottom: 4px;
    }

    /* Depth demos */
    .depth-demo {
      display: flex;
      gap: 32px;
      margin-top: 32px;
      flex-wrap: wrap;
    }

    .depth-item {
      flex: 1;
      min-width: 200px;
    }

    .depth-item__label {
      font-family: var(--font-mono, ui-monospace, monospace);
      font-size: 12px;
      font-weight: 500;
      color: var(--slate, #666666);
      margin-bottom: 12px;
    }

    .depth-item__box {
      width: 100%;
      height: 120px;
      background: var(--paper, #ffffff);
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: var(--font-body, system-ui, sans-serif);
      font-size: 12px;
      color: var(--slate, #666666);
    }

    .depth-item__box.flat {
      border: 1px solid var(--border, #e5e5e5);
    }

    .depth-item__box.border {
      border: 1px solid var(--border, #e5e5e5);
      border-radius: 8px;
    }

    .depth-item__box.elevated {
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
      border-radius: 8px;
    }

    /* Responsive */
    @media (max-width: 900px) {
      .page {
        padding: 64px 32px;
      }

      .header {
        margin-bottom: 64px;
      }

      .header__title {
        font-size: 48px;
      }

      .section {
        margin-bottom: 64px;
      }

      .spacing-row {
        grid-template-columns: 80px 1fr 70px;
        gap: 16px;
      }

      .radius-grid {
        grid-template-columns: 1fr;
        gap: 32px;
      }

      .radius-item {
        grid-template-columns: 100px 1fr;
      }

      .grid-demo__info {
        grid-template-columns: 1fr;
      }
    }

    @media (max-width: 640px) {
      .page {
        padding: 48px 24px;
      }

      .header__title {
        font-size: 36px;
      }

      .header__subtitle {
        font-size: 16px;
      }

      .spacing-row {
        grid-template-columns: 70px 1fr 60px;
        gap: 12px;
      }

      .depth-demo {
        gap: 16px;
      }

      .depth-item {
        min-width: 100%;
      }
    }
  </style>
</head>
<body>
  <div class="page" id="app">
    <div style="text-align: center; padding: 80px 24px; color: var(--slate);">
      <div style="font-family: var(--font-mono); font-size: 14px; margin-bottom: 16px;">Loading tokens…</div>
      <div style="width: 32px; height: 32px; margin: 0 auto; border: 2px solid var(--border); border-top-color: var(--signal); border-radius: 50%; animation: spin 0.8s linear infinite;"></div>
    </div>
  </div>

  <script>
    @keyframes spin { to { transform: rotate(360deg); } }

    const DEFAULT_SPACING = {
      's-1': { value: '4px', label: 'xs' },
      's-2': { value: '8px', label: 'sm' },
      's-3': { value: '16px', label: 'md' },
      's-4': { value: '24px', label: 'lg' },
      's-5': { value: '32px', label: 'xl' },
      's-6': { value: '48px', label: '2xl' },
      's-7': { value: '64px', label: '3xl' },
      's-8': { value: '96px', label: '4xl' }
    };

    const DEFAULT_DEPTH = [
      { level: 0, name: 'Flat', treatment: 'none', use: 'Default containers' },
      { level: 1, name: 'Border', treatment: '1px solid var(--border)', use: 'Cards, inputs, form elements' },
      { level: 2, name: 'Elevated', treatment: '0 2px 8px rgba(0,0,0,0.08)', use: 'Dropdowns, modals, floating actions' }
    ];

    const DEFAULT_RADIUS = {
      'none': { value: '0', use: 'No rounding — grid layouts, masonry' },
      'sm': { value: '4px', use: 'Reserved; not used in this system' },
      'md': { value: '8px', use: 'Buttons, inputs, cards, default component radius' },
      'lg': { value: '16px', use: 'Large modals, hero sections' },
      'full': { value: '999px', use: 'Badges, avatars, pill buttons' }
    };

    (window.__DESIGN_TOKENS__ ? Promise.resolve({ ok: true, json: () => Promise.resolve(window.__DESIGN_TOKENS__) }) : fetch('../tokens.json'))
      .then(r => {
        if (!r.ok) throw new Error('tokens.json not found (' + r.status + ')');
        return r.json();
      })
      .then(render)
      .catch(err => {
        document.getElementById('app').innerHTML = '<div style="padding:80px 24px; text-align:center; color:#dc2626; font-family:var(--font-mono);">Error: ' + esc(err.message) + '</div>';
      });

    function render(tokens) {
      const app = document.getElementById('app');
      
      const spacing = {};
      if (tokens.spacing?.scale) {
        Object.entries(tokens.spacing.scale).forEach(([k, v]) => {
          spacing[k] = { value: v, label: k };
        });
      } else {
        Object.assign(spacing, DEFAULT_SPACING);
      }

      const depth = (tokens.depth && Array.isArray(tokens.depth)) ? tokens.depth : DEFAULT_DEPTH;
      const radius = DEFAULT_RADIUS;

      let html = '';

      /* Header / Stage head */
      html += '<header class="header">';
      html += '  <div class="header__kicker">Spacing &amp; Rules</div>';
      html += '  <h1 class="header__title">Modular scale.<br>Functional depth.</h1>';
      html += '  <p class="header__subtitle">Clean rhythm through consistent spacing. Depth communicated through borders and shadows — minimal, purposeful, predictable.</p>';
      html += '  <hr class="header__rule">';
      html += '</header>';

      /* Philosophy block */
      html += '<div class="philosophy">';
      html += '  <div class="philosophy__title">Spacing Philosophy</div>';
      html += '  <div class="philosophy__text">';
      html += '    Neutral Modern uses <strong>whitespace as the primary separator</strong>. The spacing scale (4px base, 8-step progression) creates rhythm without ornament. Large vertical gaps (48–96px) between sections let content breathe. <em>Content is dense; structure is open.</em> Every pixel should serve a function: align text baselines, create proportion, establish hierarchy. If a gap exists without reason, remove it.';
      html += '  </div>';
      html += '</div>';

      /* Spacing scale */
      html += '<div class="section">';
      html += '  <div class="section__label">Spacing Scale</div>';

      const spacingEntries = Object.entries(spacing);
      const maxPx = Math.max(...spacingEntries.map(([, o]) => parseFloat(o.value) || 0), 1);

      spacingEntries.forEach(([key, obj]) => {
        const px = parseFloat(obj.value) || 0;
        const pct = Math.max((px / maxPx) * 100, 2);
        const label = obj.label || key;
        
        html += '<div class="spacing-row">';
        html += '  <div>';
        html += '    <div class="spacing-row__name">' + esc(key) + '</div>';
        html += '    <div class="spacing-row__label">' + esc(label) + '</div>';
        html += '  </div>';
        html += '  <div class="spacing-row__bar-wrap">';
        html += '    <div class="spacing-row__bar" style="width:' + pct + '%"></div>';
        html += '  </div>';
        html += '  <div class="spacing-row__value">' + esc(obj.value) + '</div>';
        html += '</div>';
      });

      html += '</div>';

      /* Grid visualization */
      html += '<div class="section">';
      html += '  <div class="section__label">Layout Grid</div>';
      html += '  <div class="grid-demo">';
      html += '    <div class="grid-demo__title">12-Column Grid (1200px max-width)</div>';
      html += '    <div class="grid-demo__visual">';
      for (let i = 1; i <= 12; i++) {
        html += '      <div class="grid-demo__column">' + i + '</div>';
      }
      html += '    </div>';
      html += '    <div class="grid-demo__info">';
      html += '      <div>';
      html += '        <div class="grid-demo__stat-label">Desktop</div>';
      html += '        <div class="grid-demo__stat">12 columns, 24px gutters, 48px margins</div>';
      html += '      </div>';
      html += '      <div>';
      html += '        <div class="grid-demo__stat-label">Tablet (640–1023px)</div>';
      html += '        <div class="grid-demo__stat">8 columns, 16px gutters, 32px margins</div>';
      html += '      </div>';
      html += '      <div>';
      html += '        <div class="grid-demo__stat-label">Phone (&lt;640px)</div>';
      html += '        <div class="grid-demo__stat">4 columns, 12px gutters, 24px margins</div>';
      html += '      </div>';
      html += '      <div>';
      html += '        <div class="grid-demo__stat-label">Measure (body text)</div>';
      html += '        <div class="grid-demo__stat">6–8 columns max; 50–65ch</div>';
      html += '      </div>';
      html += '    </div>';
      html += '  </div>';
      html += '</div>';

      /* Depth / Elevation */
      html += '<div class="section">';
      html += '  <div class="section__label">Depth Levels</div>';

      html += '  <div style="margin-bottom: 32px;">';
      html += '    <p style="font-family: var(--font-body); font-size: 16px; line-height: 1.5; color: var(--slate); margin-bottom: 24px;">';
      html += '      Two elevation levels only. <strong>Flat</strong> is the default. <strong>Border</strong> adds a container edge; <strong>Elevated</strong> adds shadow for floating elements (dropdowns, modals). No neumorphism.';
      html += '    </p>';
      html += '  </div>';

      html += '  <div class="depth-demo">';
      depth.forEach(d => {
        const boxClass = d.treatment === 'none' ? 'flat' : (d.name === 'Border' ? 'border' : 'elevated');
        html += '    <div class="depth-item">';
        html += '      <div class="depth-item__label">' + esc(d.name) + '</div>';
        html += '      <div class="depth-item__box ' + boxClass + '">' + esc(d.use || '') + '</div>';
        html += '    </div>';
      });
      html += '  </div>';

      html += '</div>';

      /* Border radius */
      html += '<div class="section">';
      html += '  <div class="section__label">Border Radius</div>';

      Object.entries(radius).forEach(([key, obj]) => {
        const radiusValue = obj.value;

        html += '<div class="radius-item">';
        html += '  <div class="radius-item__demo">';
        html += '    <div class="radius-item__box" style="border-radius: ' + esc(radiusValue) + '"></div>';
        html += '  </div>';
        html += '  <div class="radius-item__info">';
        html += '    <div class="radius-item__name">--radius-' + esc(key) + '</div>';
        html += '    <div class="radius-item__value">' + esc(radiusValue) + '</div>';
        html += '    <div class="radius-item__description">' + esc(obj.use) + '</div>';
        html += '  </div>';
        html += '</div>';
      });

      html += '</div>';

      /* Closing philosophy */
      html += '<div class="philosophy" style="margin-top: 96px; margin-bottom: 0;">';
      html += '  <div class="philosophy__title">Design Principle</div>';
      html += '  <div class="philosophy__text">';
      html += '    <strong>Subtract, don't add.</strong> When in doubt, use more whitespace. Remove borders before adding shadows. Use one accent color per screen. Let content density justify structure sparsity. This system wins through restraint.';
      html += '  </div>';
      html += '</div>';

      app.innerHTML = html;
    }

    function esc(s) {
      const d = document.createElement('div');
      d.textContent = String(s);
      return d.innerHTML;
    }
  </script>
</body>
</html>
