<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Type Specimen — Neutral Modern</title>
  <link rel="stylesheet" href="../colors_and_type.css">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: var(--font-body, system-ui, sans-serif);
      background: var(--paper, #ffffff);
      color: var(--ink, #111111);
      line-height: 1.6;
    }

    .page {
      max-width: 1100px;
      margin: 0 auto;
      padding: 96px 48px;
    }

    @media (max-width: 768px) {
      .page {
        padding: 64px 32px;
      }
    }

    @media (max-width: 480px) {
      .page {
        padding: 48px 24px;
      }
    }

    /* Header */
    .header {
      margin-bottom: 96px;
    }

    .header__kicker {
      font-family: var(--font-mono, ui-monospace, monospace);
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--slate, #666666);
      margin-bottom: 16px;
    }

    .header__title {
      font-family: var(--font-display, system-ui, sans-serif);
      font-size: 72px;
      font-weight: 600;
      line-height: 1.1;
      letter-spacing: -0.01em;
      color: var(--ink, #111111);
      margin-bottom: 24px;
    }

    .header__subtitle {
      font-family: var(--font-body, system-ui, sans-serif);
      font-size: 20px;
      font-weight: 400;
      line-height: 1.5;
      color: var(--slate, #666666);
      max-width: 680px;
      margin-bottom: 32px;
    }

    .header__rule {
      display: block;
      width: 80px;
      height: 1px;
      background: var(--ink, #111111);
      border: none;
      margin: 0;
    }

    /* Font families section */
    .font-families {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 32px;
      margin-bottom: 96px;
      margin-top: 64px;
    }

    .font-card {
      background: transparent;
      border: 1px solid var(--border, #e5e5e5);
      border-radius: 8px;
      padding: 32px;
    }

    .font-card__label {
      font-family: var(--font-mono, ui-monospace, monospace);
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--slate, #666666);
      margin-bottom: 12px;
    }

    .font-card__name {
      font-family: var(--font-display, system-ui, sans-serif);
      font-size: 32px;
      font-weight: 600;
      line-height: 1.2;
      color: var(--ink, #111111);
      margin-bottom: 8px;
    }

    .font-card__fallback {
      font-family: var(--font-mono, ui-monospace, monospace);
      font-size: 11px;
      color: var(--slate, #666666);
      word-break: break-word;
    }

    /* Character set block */
    .charmap-block {
      background: var(--surface, #f5f5f5);
      border: 1px solid var(--border, #e5e5e5);
      border-radius: 8px;
      padding: 48px;
      margin-bottom: 96px;
    }

    .charmap-block__label {
      font-family: var(--font-mono, ui-monospace, monospace);
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--slate, #666666);
      margin-bottom: 24px;
    }

    .charmap-block__chars {
      font-family: var(--font-display, system-ui, sans-serif);
      font-size: 28px;
      font-weight: 600;
      line-height: 1.8;
      letter-spacing: 0;
      color: var(--ink, #111111);
      word-break: break-word;
    }

    /* Section label */
    .section-label {
      font-family: var(--font-mono, ui-monospace, monospace);
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--slate, #666666);
      margin-bottom: 32px;
      padding-bottom: 16px;
      border-bottom: 1px solid var(--ink, #111111);
    }

    /* Ramp row */
    .ramp-row {
      display: grid;
      grid-template-columns: 240px 1fr;
      gap: 48px;
      align-items: baseline;
      padding: 32px 0;
      border-bottom: 1px solid var(--border, #e5e5e5);
    }

    .ramp-row:last-child {
      border-bottom: none;
    }

    @media (max-width: 800px) {
      .ramp-row {
        grid-template-columns: 1fr;
        gap: 16px;
      }
    }

    /* Left meta column */
    .ramp-meta__role {
      font-family: var(--font-display, system-ui, sans-serif);
      font-size: 16px;
      font-weight: 600;
      color: var(--ink, #111111);
      margin-bottom: 8px;
    }

    .ramp-meta__detail {
      font-family: var(--font-mono, ui-monospace, monospace);
      font-size: 10px;
      font-weight: 400;
      line-height: 1.8;
      color: var(--slate, #666666);
      letter-spacing: 0;
    }

    /* Right sample column */
    .ramp-sample {
      color: var(--ink, #111111);
      overflow-wrap: break-word;
      word-spacing: 0.1em;
      font-family: var(--font-body, system-ui, sans-serif);
    }

    /* Ramp section */
    .ramp-section {
      margin-bottom: 96px;
    }

    /* Drop cap demo */
    .dropcap-demo {
      margin-bottom: 96px;
    }

    .dropcap-demo__label {
      font-family: var(--font-mono, ui-monospace, monospace);
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--slate, #666666);
      margin-bottom: 32px;
      padding-bottom: 16px;
      border-bottom: 1px solid var(--ink, #111111);
    }

    .dropcap-container {
      background: var(--surface, #f5f5f5);
      border: 1px solid var(--border, #e5e5e5);
      border-radius: 8px;
      padding: 48px;
      max-width: 680px;
    }

    .dropcap-para {
      font-family: var(--font-body, system-ui, sans-serif);
      font-size: 18px;
      font-weight: 400;
      line-height: 1.6;
      color: var(--ink, #111111);
      margin: 0;
      text-align: left;
    }

    .dropcap {
      float: left;
      font-family: var(--font-display, system-ui, sans-serif);
      font-size: 96px;
      font-weight: 600;
      line-height: 0.85;
      color: var(--signal, #3b82f6);
      margin-right: 8px;
      margin-top: -2px;
    }

    /* Loading */
    .loading {
      text-align: center;
      padding: 160px 48px;
      color: var(--slate, #666666);
      font-family: var(--font-body, system-ui, sans-serif);
      font-size: 16px;
    }

    .loading::after {
      content: '';
      display: block;
      width: 32px;
      height: 32px;
      margin: 24px auto 0;
      border: 2px solid var(--border, #e5e5e5);
      border-top-color: var(--signal, #3b82f6);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div class="page" id="app">
    <div class="loading">Loading design tokens…</div>
  </div>

  <script>
    const EDITORIAL_SAMPLES = [
      'Simple, functional, and purposeful—designed for clarity.',
      'Every element earns its place on the screen.',
      'Whitespace is not emptiness; it is intentionality.',
      'A system built for products, not for decoration.',
      'Hierarchy emerges from restraint, not complexity.',
      'The best interfaces disappear from view.',
      'Content first, chrome second, always.',
      'One accent per screen. One voice per message.',
      'Neutral is not invisible; it is confident.',
      'Systems scale through consistency and discipline.',
    ];

    const DROPCAP_TEXT = 'A product-oriented default system built for clarity. Neutral Modern is designed to serve B2B tools, dashboards, and utility interfaces without ornament or distraction. Every typographic choice supports the hierarchy, every color serves a function, and every spacing decision reinforces the grid. Inter at two weights—400 for body, 600 for display—maintains visual clarity across sizes. System fonts ensure fast rendering and native familiarity. The accent blue draws attention to primary actions and critical information, deployed sparingly to maintain impact. This is a foundation built for focus.';

    fetch('../tokens.json')
      .then(r => {
        if (!r.ok) throw new Error('tokens.json not found (' + r.status + ')');
        return r.json();
      })
      .then(render)
      .catch(err => {
        document.getElementById('app').innerHTML =
          '<div class="loading" style="color:#dc2626">' +
          'Could not load tokens.json — ' + err.message + '</div>';
      });

    function render(tokens) {
      const app = document.getElementById('app');
      const title = tokens.meta?.title || 'Design System';
      const summary = tokens.meta?.summary || '';

      const colors = tokens.colors || {};
      const ramp = tokens.typography?.ramp || [];

      let html = '';

      /* Header */
      html += '<header class="header">';
      html += '  <div class="header__kicker">Type Specimen</div>';
      html += '  <h1 class="header__title">' + esc(title) + '</h1>';
      html += '  <p class="header__subtitle">' + esc(summary) + '</p>';
      html += '  <hr class="header__rule">';
      html += '</header>';

      /* Font families */
      const families = [
        { label: 'Display', name: 'Inter', fallback: 'system-ui, -apple-system, sans-serif', weight: '600' },
        { label: 'Body', name: 'Inter', fallback: 'system-ui, -apple-system, sans-serif', weight: '400' },
        { label: 'Monospace', name: 'ui-monospace', fallback: 'JetBrains Mono, Menlo, monospace', weight: '400' }
      ];

      html += '<div class="font-families">';
      families.forEach(f => {
        html += '<div class="font-card">';
        html += '  <div class="font-card__label">' + esc(f.label) + '</div>';
        html += '  <div class="font-card__name">' + esc(f.name) + '</div>';
        html += '  <div class="font-card__fallback">' + esc(f.fallback) + '<br>Weight: ' + esc(f.weight) + '</div>';
        html += '</div>';
      });
      html += '</div>';

      /* Character set */
      html += '<div class="charmap-block">';
      html += '  <div class="charmap-block__label">Character Set — Inter 600</div>';
      html += '  <div class="charmap-block__chars" style="font-family:system-ui,sans-serif;font-weight:600">';
      html += '    AaBbCcDdEeFfGgHhIiJjKkLlMmNnOoPpQqRrSsTtUuVvWwXxYyZz<br>';
      html += '    0123456789 !@#$%&amp;*()&ndash;&mdash;&lsquo;&rsquo;&ldquo;&rdquo;';
      html += '  </div>';
      html += '</div>';

      /* Type ramp */
      html += buildTypeRamp();

      /* Drop cap demo */
      html += '<div class="dropcap-demo">';
      html += '<div class="dropcap-demo__label">Drop Cap — Five-Line Accent Blue</div>';
      html += '<div class="dropcap-container">';
      const firstChar = DROPCAP_TEXT.charAt(0);
      const restText = DROPCAP_TEXT.substring(1);
      html += '<p class="dropcap-para">';
      html += '<span class="dropcap">' + esc(firstChar) + '</span>';
      html += esc(restText);
      html += '</p>';
      html += '</div>';
      html += '</div>';

      app.innerHTML = html;
    }

    function buildTypeRamp() {
      const rampData = [
        { role: 'Display 1', size: '64px', weight: 600, lineHeight: '1.2', font: 'display' },
        { role: 'Display 2', size: '48px', weight: 600, lineHeight: '1.2', font: 'display' },
        { role: 'Heading 1', size: '32px', weight: 600, lineHeight: '1.2', font: 'display' },
        { role: 'Heading 2', size: '24px', weight: 600, lineHeight: '1.2', font: 'display' },
        { role: 'Heading 3', size: '20px', weight: 600, lineHeight: '1.2', font: 'display' },
        { role: 'Body Large', size: '18px', weight: 400, lineHeight: '1.6', font: 'body' },
        { role: 'Body', size: '16px', weight: 400, lineHeight: '1.6', font: 'body' },
        { role: 'Body Small', size: '14px', weight: 400, lineHeight: '1.6', font: 'body' },
        { role: 'Label', size: '12px', weight: 600, lineHeight: '1.5', font: 'mono' },
      ];

      let html = '<div class="ramp-section">';
      html += '<div class="section-label">Type Ramp</div>';

      rampData.forEach((entry, idx) => {
        const fontFamily = entry.font === 'mono' 
          ? 'ui-monospace, monospace'
          : 'system-ui, sans-serif';
        
        const sizeNum = parseFloat(entry.size);
        const sampleIdx = idx % EDITORIAL_SAMPLES.length;
        let sample = EDITORIAL_SAMPLES[sampleIdx];

        if (sizeNum >= 48) {
          sample = sample.split('.')[0].slice(0, 35);
          if (!sample.endsWith('.')) sample += '.';
        }

        const fontStyle = `font-size:${entry.size};font-weight:${entry.weight};line-height:${entry.lineHeight};font-family:${fontFamily};`;
        const letterSpacing = sizeNum >= 32 ? '-0.01em' : '0';

        let meta = `${entry.size} / ${entry.weight}`;
        meta += '\nline-height: ' + entry.lineHeight;
        if (letterSpacing !== '0') meta += '\nletter-spacing: ' + letterSpacing;

        html += '' +
          '<div class="ramp-row">' +
          '  <div class="ramp-meta">' +
          '    <div class="ramp-meta__role">' + esc(entry.role) + '</div>' +
          '    <pre class="ramp-meta__detail">' + esc(meta) + '</pre>' +
          '  </div>' +
          '  <div class="ramp-sample" style="' + fontStyle + (letterSpacing !== '0' ? 'letter-spacing:' + letterSpacing + ';' : '') + '">' + esc(sample) + '</div>' +
          '</div>';
      });

      html += '</div>';
      return html;
    }

    function esc(s) {
      const d = document.createElement('div');
      d.textContent = String(s);
      return d.innerHTML;
    }
  </script>
</body>
</html>
