<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Color Palette — Cal.com Design System</title>
  <link rel="stylesheet" href="../colors_and_type.css">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: var(--font-body, 'Inter', system-ui, sans-serif);
      background: var(--paper, #ffffff);
      color: var(--bone, #111111);
      line-height: 1.6;
      padding: 0;
    }

    .page {
      max-width: 1200px;
      margin: 0 auto;
      padding: 80px 40px;
    }

    /* ── Header ── */
    .header {
      margin-bottom: 72px;
    }

    .header__title {
      font-family: var(--font-display, 'Cal Sans', system-ui, sans-serif);
      font-size: 64px;
      font-weight: 600;
      line-height: 1.10;
      letter-spacing: -0.02em;
      color: var(--bone, #111111);
      margin-bottom: 16px;
    }

    .header__subtitle {
      font-size: 18px;
      line-height: 1.30;
      color: var(--slate, #898989);
      max-width: 720px;
      font-weight: 300;
      letter-spacing: -0.2px;
    }

    .header__rule {
      display: block;
      width: 48px;
      height: 2px;
      background: var(--signal, #0000ee);
      border: none;
      margin-top: 32px;
      border-radius: 1px;
    }

    /* ── Section labels ── */
    .section-label {
      font-family: var(--font-body, 'Inter', system-ui, sans-serif);
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--slate, #898989);
      margin-bottom: 28px;
      padding-bottom: 16px;
      border-bottom: 1px solid var(--border, #e5e5e5);
    }

    /* ── Swatch grid ── */
    .swatch-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
      gap: 28px;
      margin-bottom: 72px;
    }

    .swatch {
      background: var(--surface, #ffffff);
      border: 1px solid var(--border, #e5e5e5);
      border-radius: var(--radius-md, 12px);
      overflow: hidden;
      transition: box-shadow 0.2s ease, transform 0.2s ease;
    }

    .swatch:hover {
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.10);
      transform: translateY(-2px);
    }

    .swatch__chip {
      width: 100%;
      aspect-ratio: 4 / 3;
      position: relative;
      display: flex;
      align-items: flex-end;
      justify-content: flex-end;
      padding: 12px;
    }

    .swatch__chip-contrast {
      font-size: 11px;
      font-weight: 600;
      padding: 4px 10px;
      border-radius: 4px;
      line-height: 1.4;
      backdrop-filter: blur(8px);
    }

    .swatch__meta {
      padding: 18px 20px 20px;
    }

    .swatch__var {
      font-family: var(--font-mono, 'Roboto Mono', ui-monospace, monospace);
      font-size: 13px;
      font-weight: 600;
      color: var(--bone, #111111);
      word-break: break-all;
      margin-bottom: 6px;
    }

    .swatch__hex {
      font-family: var(--font-mono, 'Roboto Mono', ui-monospace, monospace);
      font-size: 12px;
      color: var(--slate, #898989);
      margin-bottom: 8px;
    }

    .swatch__role {
      font-size: 13px;
      line-height: 1.45;
      color: var(--slate, #898989);
      margin-bottom: 8px;
    }

    .swatch__contrast-label {
      font-size: 11px;
      font-weight: 600;
      margin-top: 6px;
      letter-spacing: 0.04em;
    }

    .contrast-pass { color: #16a34a; }
    .contrast-fail { color: #dc2626; }
    .contrast-aa-large { color: #b45309; }

    /* ── Palette philosophy ── */
    .philosophy {
      margin: 80px 0;
      padding: 48px;
      background: linear-gradient(135deg, #fafafa 0%, #ffffff 100%);
      border: 1px solid var(--border, #e5e5e5);
      border-radius: var(--radius-md, 12px);
    }

    .philosophy h2 {
      font-family: var(--font-display, 'Cal Sans', system-ui, sans-serif);
      font-size: 32px;
      font-weight: 600;
      line-height: 1.20;
      color: var(--bone, #111111);
      margin-bottom: 20px;
    }

    .philosophy p {
      font-size: 16px;
      line-height: 1.60;
      color: var(--slate, #898989);
      margin-bottom: 14px;
    }

    .philosophy p:last-child {
      margin-bottom: 0;
    }

    /* ── Usage rules ── */
    .usage-rules {
      margin: 72px 0;
    }

    .usage-rules h2 {
      font-family: var(--font-display, 'Cal Sans', system-ui, sans-serif);
      font-size: 32px;
      font-weight: 600;
      line-height: 1.20;
      color: var(--bone, #111111);
      margin-bottom: 32px;
    }

    .rule {
      margin-bottom: 40px;
      padding: 32px;
      background: var(--surface, #ffffff);
      border: 1px solid var(--border, #e5e5e5);
      border-radius: var(--radius-md, 12px);
    }

    .rule h3 {
      font-family: var(--font-display, 'Cal Sans', system-ui, sans-serif);
      font-size: 20px;
      font-weight: 600;
      line-height: 1.20;
      color: var(--bone, #111111);
      margin-bottom: 14px;
    }

    .rule p {
      font-size: 15px;
      line-height: 1.60;
      color: var(--slate, #898989);
      margin-bottom: 12px;
    }

    .rule p:last-child {
      margin-bottom: 0;
    }

    .rule-example {
      display: flex;
      gap: 20px;
      margin-top: 18px;
      align-items: center;
    }

    .rule-swatch {
      width: 120px;
      height: 120px;
      border-radius: var(--radius-md, 12px);
      border: 1px solid var(--border, #e5e5e5);
      flex-shrink: 0;
    }

    /* ── WCAG summary ── */
    .wcag-summary {
      margin-top: 80px;
      padding: 40px;
      background: var(--surface, #ffffff);
      border: 1px solid var(--border, #e5e5e5);
      border-radius: var(--radius-md, 12px);
    }

    .wcag-summary h2 {
      font-family: var(--font-display, 'Cal Sans', system-ui, sans-serif);
      font-size: 28px;
      font-weight: 600;
      line-height: 1.20;
      margin-bottom: 12px;
      color: var(--bone, #111111);
    }

    .wcag-summary > p {
      font-size: 14px;
      color: var(--slate, #898989);
      margin-bottom: 24px;
    }

    .wcag-rows {
      display: grid;
      gap: 12px;
    }

    .wcag-row {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 12px 0;
      border-bottom: 1px solid var(--border, #e5e5e5);
      font-size: 15px;
    }

    .wcag-row:last-child { border-bottom: none; }

    .wcag-badge {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 48px;
      padding: 4px 12px;
      border-radius: 6px;
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      flex-shrink: 0;
    }

    .wcag-badge--pass { background: #dcfce7; color: #166534; }
    .wcag-badge--fail { background: #fee2e2; color: #991b1b; }
    .wcag-badge--aa-large { background: #fef9c3; color: #854d0e; }

    /* ── Loading ── */
    .loading {
      text-align: center;
      padding: 120px 24px;
      color: var(--slate, #898989);
      font-size: 16px;
    }

    .loading::after {
      content: '';
      display: block;
      width: 32px;
      height: 32px;
      margin: 20px auto 0;
      border: 3px solid var(--border, #e5e5e5);
      border-top-color: var(--signal, #0000ee);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    /* ── Responsive ── */
    @media (max-width: 768px) {
      .page { padding: 48px 24px; }
      .header__title { font-size: 48px; }
      .swatch-grid { grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 20px; }
      .philosophy, .rule { padding: 24px; }
      .rule-example { flex-direction: column; align-items: flex-start; }
      .rule-swatch { width: 100%; height: 120px; }
    }
  </style>
</head>
<body>
  <div class="page" id="app">
    <div class="loading">Loading design tokens&hellip;</div>
  </div>

  <script>
    /* ── Contrast-ratio helpers (WCAG 2.1 relative luminance) ── */
    function hexToRgb(hex) {
      hex = hex.replace(/^#/, '');
      if (hex.length === 3) hex = hex.split('').map(c => c + c).join('');
      const n = parseInt(hex, 16);
      return [(n >> 16) & 255, (n >> 8) & 255, n & 255];
    }

    function luminance([r, g, b]) {
      const [rs, gs, bs] = [r, g, b].map(c => {
        c /= 255;
        return c <= 0.03928 ? c / 12.92 : Math.pow((c + 0.055) / 1.055, 2.4);
      });
      return 0.2126 * rs + 0.7152 * gs + 0.0722 * bs;
    }

    function contrastRatio(hex1, hex2) {
      const l1 = luminance(hexToRgb(hex1));
      const l2 = luminance(hexToRgb(hex2));
      const lighter = Math.max(l1, l2);
      const darker = Math.min(l1, l2);
      return (lighter + 0.05) / (darker + 0.05);
    }

    function wcagLevel(ratio) {
      if (ratio >= 7) return { label: 'AAA', cls: 'pass' };
      if (ratio >= 4.5) return { label: 'AA', cls: 'pass' };
      if (ratio >= 3) return { label: 'AA Large', cls: 'aa-large' };
      return { label: 'Fail', cls: 'fail' };
    }

    /* ── Core token roles ── */
    const CORE_ROLES = {
      paper:   'Page background — pure white canvas',
      ink:     'Primary accent — link blue for hyperlinks',
      slate:   'Secondary text — descriptions and muted labels',
      signal:  'Signal color — browser default link color',
      bone:    'Deep black — body text and headings',
      border:  'Dividers and borders — subtle separation',
      surface: 'Card background — paper equivalent',
    };

    /* ── Build page from tokens.json ── */
    (window.__DESIGN_TOKENS__ ? Promise.resolve({ ok: true, json: () => Promise.resolve(window.__DESIGN_TOKENS__) }) : fetch('../tokens.json'))
      .then(r => {
        if (!r.ok) throw new Error('tokens.json not found (' + r.status + ')');
        return r.json();
      })
      .then(render)
      .catch(err => {
        document.getElementById('app').innerHTML =
          '<div class="loading" style="color:#dc2626">' +
          'Could not load tokens.json &mdash; ' + err.message + '</div>';
      });

    function render(tokens) {
      const app = document.getElementById('app');
      const rawColors = tokens.colors || {};
      const paperHex = rawColors.paper || '#ffffff';

      /* Flatten extended/semantic colors */
      const colors = {};
      for (const [k, v] of Object.entries(rawColors)) {
        if (typeof v === 'string') { colors[k] = v; }
        else if (v && typeof v === 'object') {
          for (const [sk, sv] of Object.entries(v)) {
            if (typeof sv === 'string') colors[k + '-' + sk] = sv;
          }
        }
      }

      /* Split into core and extended */
      const coreKeys = Object.keys(CORE_ROLES).filter(k => colors[k]);
      const extendedKeys = Object.keys(colors)
        .filter(k => !CORE_ROLES[k] && typeof colors[k] === 'string');

      let html = '';

      /* Header */
      html += '<header class="header">';
      html += '  <h1 class="header__title">The Cal.com Palette</h1>';
      html += '  <p class="header__subtitle">A grayscale foundation where boldness comes from confidence, not color. Every hue is intentional. Every neutrality purposeful.</p>';
      html += '  <hr class="header__rule">';
      html += '</header>';

      /* Core palette */
      if (coreKeys.length) {
        html += '<div class="section-label">Core Palette</div>';
        html += '<div class="swatch-grid">';
        coreKeys.forEach(key => {
          html += swatchCard(key, colors[key], paperHex, CORE_ROLES[key]);
        });
        html += '</div>';
      }

      /* Extended palette */
      if (extendedKeys.length) {
        html += '<div class="section-label">Extended Palette</div>';
        html += '<div class="swatch-grid">';
        extendedKeys.forEach(key => {
          const role = formatRole(key);
          html += swatchCard(key, colors[key], paperHex, role);
        });
        html += '</div>';
      }

      /* Philosophy */
      html += '<div class="philosophy">';
      html += '  <h2>The Philosophy Behind the Palette</h2>';
      html += '  <p>Cal.com\'s color system is deliberately monochromatic. Inspired by Uber\'s minimal aesthetic and refined through thousands of scheduling interactions, the palette treats color not as decoration but as a semantic tool.</p>';
      html += '  <p>The canvas is white. Text is bone (#111111). Links are blue (#0099ff)—not because blue is trendy, but because that\'s what users expect. The message: we don\'t waste your time with unnecessary color. Every pixel serves clarity.</p>';
      html += '  <p>This is a grayscale brand to emphasize boldness and professionalism. When you ship at scale, you earn the right to be boring. The design system doesn\'t need to shout.</p>';
      html += '</div>';

      /* Usage rules */
      html += '<div class="usage-rules">';
      html += '  <h2>Color Usage Rules</h2>';

      html += '  <div class="rule">';
      html += '    <h3>1. Bone for Text, Ink for Links</h3>';
      html += '    <p>Primary text is always bone (#111111). Links are always ink blue (#0099ff). This distinction is sacred—never reverse it. Exceptions don\'t exist.</p>';
      html += '    <div class="rule-example">';
      html += '      <div class="rule-swatch" style="background:#111111;"></div>';
      html += '      <div style="flex:1"><p style="margin:0;font-weight:600;color:#111111;">Bone: Headings & body text</p><p style="margin:4px 0 0;color:#898989;font-size:13px;">The dominant color—used in 95% of the interface.</p></div>';
      html += '    </div>';
      html += '  </div>';

      html += '  <div class="rule">';
      html += '    <h3>2. Slate for Secondary Information</h3>';
      html += '    <p>Descriptions, helper text, muted labels—all use slate (#898989). It\'s darker than most systems\' secondary text, ensuring accessibility without sacrifice.</p>';
      html += '    <div class="rule-example">';
      html += '      <div class="rule-swatch" style="background:#898989;"></div>';
      html += '      <div style="flex:1"><p style="margin:0;font-weight:600;color:#111111;">Slate: Muted & secondary</p><p style="margin:4px 0 0;color:#898989;font-size:13px;">Still readable at 14px, still professional.</p></div>';
      html += '    </div>';
      html += '  </div>';

      html += '  <div class="rule">';
      html += '    <h3>3. Ink Blue Only for Hyperlinks</h3>';
      html += '    <p>The only chromatic color in the system. Reserved exclusively for links in prose. No buttons, no badges, no accents—links only.</p>';
      html += '    <div class="rule-example">';
      html += '      <div class="rule-swatch" style="background:#0099ff;"></div>';
      html += '      <div style="flex:1"><p style="margin:0;font-weight:600;color:#111111;">Ink: Hyperlinks in context</p><p style="margin:4px 0 0;color:#898989;font-size:13px;">Users learn this color means "clickable".</p></div>';
      html += '    </div>';
      html += '  </div>';

      html += '  <div class="rule">';
      html += '    <h3>4. Paper & Surface Are Identical</h3>';
      html += '    <p>Both are white (#ffffff). Cards, modals, popovers—all use the same background as the page. Depth comes from shadows, not color.</p>';
      html += '    <div class="rule-example">';
      html += '      <div class="rule-swatch" style="background:#ffffff;border:2px solid #e5e5e5;"></div>';
      html += '      <div style="flex:1"><p style="margin:0;font-weight:600;color:#111111;">Paper & Surface: White canvas</p><p style="margin:4px 0 0;color:#898989;font-size:13px;">Shadows create hierarchy, not color.</p></div>';
      html += '    </div>';
      html += '  </div>';

      html += '</div>';

      /* WCAG summary */
      html += wcagSummary(colors, paperHex);

      app.innerHTML = html;
    }

    /* ── Swatch card builder ── */
    function swatchCard(key, hex, paperHex, role) {
      const ratio = contrastRatio(hex, paperHex);
      const level = wcagLevel(ratio);
      const chipTextColor = luminance(hexToRgb(hex)) > 0.5 ? '#111111' : '#ffffff';
      const chipBadgeBg = luminance(hexToRgb(hex)) > 0.5
        ? 'rgba(0,0,0,0.12)' : 'rgba(255,255,255,0.25)';

      return '' +
        '<div class="swatch">' +
        '  <div class="swatch__chip" style="background:' + hex + '">' +
        '    <span class="swatch__chip-contrast" style="color:' + chipTextColor +
             ';background:' + chipBadgeBg + '">' + ratio.toFixed(2) + ':1</span>' +
        '  </div>' +
        '  <div class="swatch__meta">' +
        '    <div class="swatch__var">--' + esc(key) + '</div>' +
        '    <div class="swatch__hex">' + esc(hex.toUpperCase()) + '</div>' +
        '    <div class="swatch__role">' + esc(role) + '</div>' +
        '    <div class="swatch__contrast-label contrast-' + level.cls + '">' +
             'WCAG ' + level.label + '</div>' +
        '  </div>' +
        '</div>';
    }

    /* ── WCAG summary ── */
    function wcagSummary(colors, paperHex) {
      const keys = Object.keys(colors);
      let passAAA = 0, passAA = 0, passAALarge = 0, fail = 0;

      keys.forEach(k => {
        const ratio = contrastRatio(colors[k], paperHex);
        if (ratio >= 7) passAAA++;
        else if (ratio >= 4.5) passAA++;
        else if (ratio >= 3) passAALarge++;
        else fail++;
      });

      let html = '<div class="wcag-summary">';
      html += '<h2>WCAG 2.1 Compliance</h2>';
      html += '<p>Contrast ratios measured against paper (#ffffff)</p>';
      html += '<div class="wcag-rows">';
      html += row('AAA (7:1+)', passAAA, 'pass');
      html += row('AA (4.5:1+)', passAA, 'pass');
      html += row('AA Large Text (3:1+)', passAALarge, 'aa-large');
      html += row('Below threshold', fail, fail > 0 ? 'fail' : 'pass');
      html += '</div>';
      html += '</div>';
      return html;

      function row(label, count, badge) {
        return '<div class="wcag-row">' +
               '<span class="wcag-badge wcag-badge--' + badge + '">' + count + '</span>' +
               '<span style="color:var(--bone,#111111)">' + label + '</span>' +
               '</div>';
      }
    }

    /* ── Utilities ── */
    function esc(s) {
      const d = document.createElement('div');
      d.textContent = String(s);
      return d.innerHTML;
    }

    function formatRole(key) {
      return key
        .replace(/([A-Z])/g, ' $1')
        .replace(/[-_]/g, ' ')
        .replace(/\b\w/g, c => c.toUpperCase())
        .trim();
    }
  </script>
</body>
</html>
