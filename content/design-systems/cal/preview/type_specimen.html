<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Type Specimen — Cal.com</title>
  <link rel="stylesheet" href="../colors_and_type.css">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: var(--font-body, 'Inter', system-ui, sans-serif);
      background: var(--paper, #ffffff);
      color: var(--bone, #111111);
      line-height: 1.6;
    }

    .page {
      max-width: 1100px;
      margin: 0 auto;
      padding: 64px 32px;
    }

    /* Header */
    .header {
      margin-bottom: 64px;
    }
    .header__title {
      font-family: var(--font-display, 'Cal Sans', system-ui, sans-serif);
      font-size: 56px;
      font-weight: 600;
      line-height: 1.10;
      letter-spacing: 0px;
      color: var(--bone, #111111);
      margin-bottom: 12px;
    }
    .header__subtitle {
      font-family: var(--font-display, 'Cal Sans', system-ui, sans-serif);
      font-size: 18px;
      font-weight: 300;
      line-height: 1.30;
      letter-spacing: -0.2px;
      color: var(--slate, #898989);
      max-width: 600px;
    }
    .header__rule {
      display: block;
      width: 64px;
      height: 2px;
      background: var(--bone, #111111);
      border: none;
      margin-top: 24px;
      border-radius: 1px;
    }

    /* Font family summary */
    .font-families {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 24px;
      margin-bottom: 56px;
    }
    .font-card {
      background: var(--paper, #ffffff);
      border: 1px solid var(--border, #e5e5e5);
      border-radius: 12px;
      padding: 28px 24px;
    }
    .font-card__label {
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--slate, #898989);
      margin-bottom: 8px;
    }
    .font-card__name {
      font-family: inherit;
      font-size: 24px;
      font-weight: 600;
      line-height: 1.3;
      margin-bottom: 4px;
      color: var(--bone, #111111);
    }
    .font-card__fallback {
      font-family: var(--font-mono, 'Roboto Mono', ui-monospace, monospace);
      font-size: 12px;
      color: var(--slate, #898989);
      word-break: break-all;
    }

    /* Section label */
    .section-label {
      font-family: var(--font-body, 'Inter', system-ui, sans-serif);
      font-size: 14px;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--slate, #898989);
      margin-bottom: 24px;
      padding-bottom: 12px;
      border-bottom: 1px solid var(--border, #e5e5e5);
    }

    /* Ramp row */
    .ramp-row {
      display: grid;
      grid-template-columns: 280px 1fr;
      gap: 40px;
      align-items: baseline;
      padding: 28px 0;
      border-bottom: 1px solid var(--border, #e5e5e5);
    }
    .ramp-row:last-child {
      border-bottom: none;
    }

    @media (max-width: 720px) {
      .ramp-row {
        grid-template-columns: 1fr;
        gap: 12px;
      }
    }

    /* Left meta column */
    .ramp-meta__role {
      font-family: var(--font-body, 'Inter', system-ui, sans-serif);
      font-size: 16px;
      font-weight: 600;
      color: var(--bone, #111111);
      margin-bottom: 8px;
      letter-spacing: 0px;
    }
    .ramp-meta__detail {
      font-family: var(--font-mono, 'Roboto Mono', ui-monospace, monospace);
      font-size: 11px;
      line-height: 1.7;
      color: var(--slate, #898989);
      font-weight: 500;
    }

    /* Right sample column */
    .ramp-sample {
      color: var(--bone, #111111);
      overflow-wrap: break-word;
    }

    /* Ramp section container */
    .ramp-section {
      margin-bottom: 56px;
    }

    /* Pangram block */
    .pangram-block {
      background: var(--paper, #ffffff);
      border: 1px solid var(--border, #e5e5e5);
      border-radius: 12px;
      padding: 40px 32px;
      margin-bottom: 56px;
    }
    .pangram-block__label {
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--slate, #898989);
      margin-bottom: 16px;
    }
    .pangram-block__chars {
      font-size: 24px;
      line-height: 1.6;
      letter-spacing: 0.02em;
      color: var(--bone, #111111);
      word-break: break-all;
      font-weight: 500;
    }

    /* Drop cap demo */
    .dropcap-demo {
      margin-top: 56px;
      padding: 40px 32px;
      background: var(--paper, #ffffff);
      border: 1px solid var(--border, #e5e5e5);
      border-radius: 12px;
    }
    .dropcap-demo__label {
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--slate, #898989);
      margin-bottom: 24px;
    }
    .dropcap-demo__text {
      font-family: var(--font-display, 'Cal Sans', system-ui, sans-serif);
      font-size: 18px;
      font-weight: 300;
      line-height: 1.6;
      color: var(--bone, #111111);
      max-width: 600px;
    }
    .dropcap-demo__text::first-letter {
      font-size: 4em;
      font-weight: 600;
      line-height: 0.8;
      float: left;
      margin-right: 0.1em;
      margin-top: 0.05em;
    }

    /* Loading */
    .loading {
      text-align: center;
      padding: 80px 24px;
      color: var(--slate, #898989);
      font-size: 16px;
    }
    .loading::after {
      content: '';
      display: block;
      width: 32px;
      height: 32px;
      margin: 16px auto 0;
      border: 3px solid var(--border, #e5e5e5);
      border-top-color: var(--bone, #111111);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div class="page" id="app">
    <div class="loading">Loading design tokens…</div>
  </div>

  <script>
    const EDITORIAL_SAMPLES = [
      'Open-source scheduling. Clean, minimal, developer-first.',
      'Beautiful calendars that work seamlessly across devices.',
      'Scheduling automation for modern teams.',
      'Connect with your calendar in seconds.',
      'Simple booking links that integrate everywhere.',
      'Transform the way you manage availability.',
      'Designed for teams that value their time.',
      'Meeting scheduling, finally solved.',
      'Synchronize across all your calendars.',
      'Take back your calendar. Take back your time.',
    ];

    (window.__DESIGN_TOKENS__ ? Promise.resolve({ ok: true, json: () => Promise.resolve(window.__DESIGN_TOKENS__) }) : fetch('../tokens.json'))
      .then(r => {
        if (!r.ok) throw new Error('tokens.json not found (' + r.status + ')');
        return r.json();
      })
      .then(render)
      .catch(err => {
        document.getElementById('app').innerHTML =
          '<div class="loading" style="color:#dc2626">' +
          'Could not load tokens.json — ' + err.message + '</div>';
      });

    function render(tokens) {
      const app = document.getElementById('app');
      const name = tokens.meta?.title || tokens.name || 'Design System';

      /* Load Google Fonts */
      if (tokens.typography?.googleFontsUrl) {
        const link = document.createElement('link');
        link.rel = 'stylesheet';
        link.href = tokens.typography.googleFontsUrl;
        document.head.appendChild(link);
      }

      /* Load Cal Sans from Google Fonts */
      const calSansLink = document.createElement('link');
      calSansLink.rel = 'stylesheet';
      calSansLink.href = 'https://fonts.googleapis.com/css2?family=Cal+Sans:wght@400;600&display=swap';
      document.head.appendChild(calSansLink);

      /* Load Roboto Mono */
      const monoLink = document.createElement('link');
      monoLink.rel = 'stylesheet';
      monoLink.href = 'https://fonts.googleapis.com/css2?family=Roboto+Mono:wght@400;500;600&display=swap';
      document.head.appendChild(monoLink);

      const fonts = tokens.typography || {};
      const ramp = fonts.ramp || [];

      let html = '';

      /* Header */
      html += '<header class="header">';
      html += '  <h1 class="header__title">Four faces. One voice.</h1>';
      html += '  <p class="header__subtitle">Type Specimen — ' + ramp.length + ' hierarchy levels for open-source scheduling</p>';
      html += '  <hr class="header__rule">';
      html += '</header>';

      /* Font families */
      const families = [
        { label: 'Display', name: 'Cal Sans', fallback: 'Fallback: sans-serif' },
        { label: 'Body', name: 'Inter', fallback: 'Fallback: sans-serif' },
        { label: 'Monospace', name: 'Roboto Mono', fallback: 'Fallback: monospace' },
      ];

      html += '<div class="font-families">';
      families.forEach(f => {
        html += '<div class="font-card">';
        html += '  <div class="font-card__label">' + esc(f.label) + '</div>';
        html += '  <div class="font-card__name"';
        if (f.name === 'Cal Sans') {
          html += ' style="font-family:\'Cal Sans\',sans-serif"';
        } else if (f.name === 'Roboto Mono') {
          html += ' style="font-family:\'Roboto Mono\',monospace"';
        }
        html += '>' + esc(f.name) + '</div>';
        html += '  <div class="font-card__fallback">' + esc(f.fallback) + '</div>';
        html += '</div>';
      });
      html += '</div>';

      /* Character set block */
      html += '<div class="pangram-block">';
      html += '  <div class="pangram-block__label">Character Set & Numerals</div>';
      html += '  <div class="pangram-block__chars" style="font-family:\'Cal Sans\',sans-serif">';
      html += 'AaBbCcDdEeFfGgHhIiJjKkLlMmNnOoPpQqRrSsTtUuVvWwXxYyZz<br>';
      html += '0123456789 !@#$%&amp;*()‐–—\'&quot;&lsquo;&rsquo;&ldquo;&rdquo;';
      html += '</div>';
      html += '</div>';

      /* Type ramp */
      if (ramp.length) {
        html += '<div class="ramp-section">';
        html += '<div class="section-label">Type Ramp</div>';
        ramp.forEach((entry, i) => {
          html += rampRow(entry, i);
        });
        html += '</div>';
      }

      /* Drop cap demo */
      html += '<div class="dropcap-demo">';
      html += '  <div class="dropcap-demo__label">Drop Cap with Display Font</div>';
      html += '  <p class="dropcap-demo__text">';
      html += 'Beautiful calendars that work seamlessly across devices and integrations. ';
      html += 'Cal.com brings the simplicity of open-source scheduling to teams everywhere.';
      html += '  </p>';
      html += '</div>';

      app.innerHTML = html;
    }

    function rampRow(entry, idx) {
      const role = entry.role || 'Role ' + (idx + 1);
      const size = entry.size || '16px';
      const weight = entry.weight || '400';
      const lh = entry.lineHeight || '1.5';
      const ls = entry.letterSpacing || 'normal';
      const fontKey = entry.fontKey || 'body';
      const sample = EDITORIAL_SAMPLES[idx % EDITORIAL_SAMPLES.length];

      const sizeNum = parseFloat(size);
      const displaySample = sizeNum >= 40
        ? sample.split('.')[0] + '.'
        : sample;

      let fontFamily = 'Inter';
      if (fontKey === 'display' || fontKey === 'display-light') {
        fontFamily = 'Cal Sans';
      } else if (fontKey === 'mono') {
        fontFamily = 'Roboto Mono';
      }

      let fontStyle = 'font-family:\'' + fontFamily + '\',';
      if (fontKey === 'mono') {
        fontStyle += 'monospace;';
      } else {
        fontStyle += 'sans-serif;';
      }
      fontStyle += 'font-size:' + size + ';font-weight:' + weight + ';line-height:' + lh + ';';
      if (ls !== 'normal') fontStyle += 'letter-spacing:' + ls + ';';

      let meta = '';
      meta += esc(role);
      meta += '\n' + esc(fontFamily);
      meta += '\n' + esc(size) + ' / ' + esc(String(weight));
      meta += '\nline-height: ' + esc(String(lh));
      if (ls !== 'normal') meta += '\nletter-spacing: ' + esc(String(ls));

      return '' +
        '<div class="ramp-row">' +
        '  <div class="ramp-meta">' +
        '    <div class="ramp-meta__role">' + esc(role) + '</div>' +
        '    <pre class="ramp-meta__detail">' + meta + '</pre>' +
        '  </div>' +
        '  <div class="ramp-sample" style="' + fontStyle + '">' + esc(displaySample) + '</div>' +
        '</div>';
    }

    function esc(s) {
      const d = document.createElement('div');
      d.textContent = String(s);
      return d.innerHTML;
    }
  </script>
</body>
</html>
