<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Spacing &amp; Rules — Ferrari</title>
  <link rel="stylesheet" href="../colors_and_type.css">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: var(--font-body, system-ui, sans-serif);
      background: var(--paper, #ffffff);
      color: var(--ink, #181818);
      line-height: 1.6;
    }

    .page {
      max-width: 1200px;
      margin: 0 auto;
      padding: 96px 64px;
    }

    /* Header / Stage head */
    .header {
      margin-bottom: 96px;
      position: relative;
    }

    .header__kicker {
      font-family: var(--font-display, system-ui, sans-serif);
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 0.65px;
      text-transform: uppercase;
      color: var(--slate, #666666);
      margin-bottom: 16px;
    }

    .header__title {
      font-family: var(--font-display, system-ui, sans-serif);
      font-size: 64px;
      font-weight: 500;
      line-height: 1.0;
      letter-spacing: -0.02em;
      color: var(--ink, #181818);
      margin-bottom: 12px;
      max-width: 85%;
    }

    .header__subtitle {
      font-family: var(--font-body, system-ui, sans-serif);
      font-size: 18px;
      font-weight: 400;
      line-height: 1.6;
      color: var(--slate, #666666);
      max-width: 75%;
      margin-bottom: 32px;
    }

    .header__rule {
      display: block;
      width: 120px;
      height: 3px;
      background: var(--signal, #da291c);
      border: none;
      margin-top: 24px;
    }

    /* Section */
    .section {
      margin-bottom: 96px;
    }

    .section__label {
      font-family: var(--font-display, system-ui, sans-serif);
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 0.65px;
      text-transform: uppercase;
      color: var(--slate, #666666);
      margin-bottom: 48px;
      padding-bottom: 16px;
      border-bottom: 1px solid var(--border, #d2d2d2);
    }

    /* Spacing scale */
    .spacing-row {
      display: grid;
      grid-template-columns: 120px 1fr 100px;
      gap: 32px;
      align-items: center;
      padding: 28px 0;
      border-bottom: 1px solid var(--border, #d2d2d2);
    }

    .spacing-row:last-child {
      border-bottom: none;
    }

    .spacing-row__name {
      font-family: var(--font-display, system-ui, sans-serif);
      font-size: 14px;
      font-weight: 600;
      color: var(--ink, #181818);
    }

    .spacing-row__label {
      font-family: var(--font-body, system-ui, sans-serif);
      font-size: 12px;
      color: var(--slate, #666666);
      margin-top: 6px;
      letter-spacing: 0.5px;
    }

    .spacing-row__bar-wrap {
      height: 40px;
      display: flex;
      align-items: center;
    }

    .spacing-row__bar {
      height: 3px;
      background: var(--ink, #181818);
      min-width: 3px;
      transition: opacity 0.2s ease;
    }

    .spacing-row:hover .spacing-row__bar {
      opacity: 0.6;
    }

    .spacing-row__value {
      font-family: var(--font-display, system-ui, sans-serif);
      font-size: 14px;
      font-weight: 600;
      color: var(--ink, #181818);
      text-align: right;
    }

    /* Rule weights */
    .rule-demo {
      padding: 40px 0;
      border-bottom: 1px solid var(--border, #d2d2d2);
    }

    .rule-demo:last-child {
      border-bottom: none;
    }

    .rule-demo__header {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      margin-bottom: 20px;
    }

    .rule-demo__name {
      font-family: var(--font-display, system-ui, sans-serif);
      font-size: 14px;
      font-weight: 600;
      color: var(--ink, #181818);
    }

    .rule-demo__label {
      font-family: var(--font-body, system-ui, sans-serif);
      font-size: 12px;
      color: var(--slate, #666666);
      letter-spacing: 0.5px;
    }

    .rule-demo__spec {
      font-family: var(--font-display, system-ui, sans-serif);
      font-size: 12px;
      font-weight: 600;
      color: var(--slate, #666666);
      text-align: right;
    }

    .rule-demo__container {
      width: 100%;
      height: 56px;
      display: flex;
      align-items: center;
      padding: 0;
      background: var(--surface, #ffffff);
    }

    .rule-demo__line {
      width: 100%;
      border: none;
      border-radius: 0;
      margin: 0;
    }

    /* Border radius */
    .radius-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 48px;
      margin-bottom: 48px;
    }

    .radius-item {
      display: grid;
      grid-template-columns: 160px 1fr;
      gap: 32px;
      align-items: flex-start;
    }

    .radius-item__demo {
      display: flex;
      gap: 20px;
      align-items: center;
      justify-content: flex-start;
    }

    .radius-item__box {
      width: 120px;
      height: 120px;
      background: var(--paper, #ffffff);
      border: 2px solid var(--ink, #181818);
      flex-shrink: 0;
    }

    .radius-item__info {
      flex: 1;
    }

    .radius-item__name {
      font-family: var(--font-display, system-ui, sans-serif);
      font-size: 14px;
      font-weight: 600;
      color: var(--ink, #181818);
      margin-bottom: 6px;
    }

    .radius-item__value {
      font-family: var(--font-display, system-ui, sans-serif);
      font-size: 12px;
      font-weight: 600;
      color: var(--slate, #666666);
      margin-bottom: 12px;
    }

    .radius-item__description {
      font-family: var(--font-body, system-ui, sans-serif);
      font-size: 13px;
      line-height: 1.6;
      color: var(--slate, #666666);
    }

    /* Philosophy block */
    .philosophy {
      background: var(--paper, #ffffff);
      padding: 48px;
      border: 1px solid var(--border, #d2d2d2);
      margin-bottom: 80px;
    }

    .philosophy__title {
      font-family: var(--font-display, system-ui, sans-serif);
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 0.65px;
      text-transform: uppercase;
      color: var(--slate, #666666);
      margin-bottom: 20px;
    }

    .philosophy__text {
      font-family: var(--font-body, system-ui, sans-serif);
      font-size: 18px;
      line-height: 1.65;
      color: var(--ink, #181818);
    }

    .philosophy__text strong {
      font-weight: 700;
    }

    .philosophy__text em {
      font-style: italic;
    }

    .philosophy__text code {
      font-family: var(--font-mono, ui-monospace, monospace);
      background: rgba(24, 24, 24, 0.08);
      padding: 3px 8px;
      font-size: 0.95em;
      border-radius: 2px;
    }

    /* Grid demo */
    .grid-demo {
      background: var(--paper, #ffffff);
      padding: 48px;
      border: 1px solid var(--border, #d2d2d2);
      margin-bottom: 80px;
    }

    .grid-demo__title {
      font-family: var(--font-display, system-ui, sans-serif);
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 0.65px;
      text-transform: uppercase;
      color: var(--slate, #666666);
      margin-bottom: 24px;
    }

    .grid-demo__visual {
      width: 100%;
      height: 220px;
      display: grid;
      grid-template-columns: repeat(12, 1fr);
      gap: 16px;
      background-image: linear-gradient(90deg, rgba(218, 41, 28, 0.08) 1px, transparent 1px);
      background-size: calc(100% / 12) 100%;
      padding: 24px;
      border: 1px dashed var(--bone, #d2d2d2);
    }

    .grid-demo__column {
      background: rgba(218, 41, 28, 0.12);
      border: 1px solid rgba(218, 41, 28, 0.25);
      font-family: var(--font-display, system-ui, sans-serif);
      font-size: 11px;
      font-weight: 600;
      color: var(--signal, #da291c);
      display: flex;
      align-items: flex-end;
      justify-content: center;
      padding-bottom: 8px;
    }

    .grid-demo__info {
      margin-top: 24px;
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 32px;
    }

    .grid-demo__stat {
      font-family: var(--font-body, system-ui, sans-serif);
      font-size: 13px;
      color: var(--slate, #666666);
      line-height: 1.6;
    }

    .grid-demo__stat-label {
      font-family: var(--font-display, system-ui, sans-serif);
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.55px;
      text-transform: uppercase;
      color: var(--slate, #666666);
      margin-bottom: 6px;
    }

    /* Loading */
    .loading {
      text-align: center;
      padding: 80px 24px;
      color: var(--slate, #666666);
      font-size: 16px;
    }

    .loading::after {
      content: '';
      display: block;
      width: 32px;
      height: 32px;
      margin: 16px auto 0;
      border: 2px solid rgba(24, 24, 24, 0.15);
      border-top-color: var(--signal, #da291c);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    @media (max-width: 1024px) {
      .page {
        padding: 64px 40px;
      }

      .header {
        margin-bottom: 64px;
      }

      .header__title {
        font-size: 48px;
        max-width: 100%;
      }

      .header__subtitle {
        max-width: 100%;
      }

      .section {
        margin-bottom: 64px;
      }

      .spacing-row {
        grid-template-columns: 100px 1fr 80px;
        gap: 20px;
      }

      .radius-grid {
        grid-template-columns: 1fr;
        gap: 32px;
      }

      .radius-item {
        grid-template-columns: 140px 1fr;
        gap: 24px;
      }

      .grid-demo__info {
        grid-template-columns: 1fr;
      }
    }

    @media (max-width: 640px) {
      .page {
        padding: 48px 24px;
      }

      .header {
        margin-bottom: 48px;
      }

      .header__title {
        font-size: 36px;
      }

      .header__subtitle {
        font-size: 16px;
      }

      .section {
        margin-bottom: 48px;
      }

      .spacing-row {
        grid-template-columns: 80px 1fr 70px;
        gap: 16px;
      }

      .spacing-row__name {
        font-size: 12px;
      }

      .spacing-row__value {
        font-size: 12px;
      }

      .philosophy {
        padding: 32px 24px;
      }

      .philosophy__text {
        font-size: 16px;
      }

      .grid-demo {
        padding: 32px 24px;
      }

      .grid-demo__visual {
        height: 180px;
      }
    }
  </style>
</head>
<body>
  <div class="page" id="app">
    <div class="loading">Loading design tokens…</div>
  </div>

  <script>
    const DEFAULT_SPACING = {
      's-1': { value: '4px', label: 'xs' },
      's-2': { value: '8px', label: 'sm' },
      's-3': { value: '16px', label: 'md' },
      's-4': { value: '24px', label: 'lg' },
      's-5': { value: '32px', label: 'xl' },
      's-6': { value: '48px', label: '2xl' },
      's-7': { value: '64px', label: '3xl' },
      's-8': { value: '96px', label: '4xl' }
    };

    const DEFAULT_RULES = {
      'flat': { name: 'Flat', weight: 'none', color: 'transparent', use: 'Default state for all content sections and cards' },
      'border': { name: 'Border', weight: '1px', color: '#d2d2d2', use: 'Input fields, form containers — depth through delineation' },
      'elevated': { name: 'Elevated', weight: '2px', color: '#000000', use: 'Modal overlays and card containers — rare usage' }
    };

    const DEFAULT_RADIUS = {
      'none': { value: '0', use: 'Default for all structural elements — buttons, cards, dialogs, inputs. Precision engineering aesthetic.' },
      'sm': { value: '5px', use: 'Reserved for future use.' },
      'md': { value: '8px', use: 'Subtle softening on modals and dropdowns — the system\'s softest corner.' },
      'lg': { value: '80px', use: 'Reserved for future use.' },
      'full': { value: '999px', use: 'Circular elements only: carousel dots, avatar thumbnails, slider handles.' }
    };

    ( window.__DESIGN_TOKENS__ ? Promise.resolve({ ok: true, json: () => Promise.resolve(window.__DESIGN_TOKENS__) }) : fetch('../tokens.json') )
      .then(r => {
        if (!r.ok) throw new Error('tokens.json not found (' + r.status + ')');
        return r.json();
      })
      .then(render)
      .catch(err => {
        document.getElementById('app').innerHTML =
          '<div class="loading" style="color:#dc2626">' +
          'Could not load tokens.json — ' + err.message + '</div>';
      });

    function render(tokens) {
      const app = document.getElementById('app');
      
      const spacing = {};
      if (tokens.spacing?.scale) {
        Object.entries(tokens.spacing.scale).forEach(([k, v]) => {
          spacing[k] = { value: v, label: k };
        });
      } else {
        Object.assign(spacing, DEFAULT_SPACING);
      }

      const rules = DEFAULT_RULES;
      const radius = DEFAULT_RADIUS;

      let html = '';

      /* Header / Stage head */
      html += '<header class="header">';
      html += '  <div class="header__kicker">Spacing &amp; Rules</div>';
      html += '  <h1 class="header__title">Precision Over Softness</h1>';
      html += '  <p class="header__subtitle">The spacing and border-radius system for Ferrari — built on an 8px base unit with razor-sharp corners and generous breathing room for editorial content.</p>';
      html += '  <hr class="header__rule">';
      html += '</header>';

      /* Philosophy block */
      html += '<div class="philosophy">';
      html += '  <div class="philosophy__title">Design Philosophy</div>';
      html += '  <div class="philosophy__text">';
      html += '    This system treats <strong>spacing as editorial pacing</strong> and <strong>borders as structural clarity</strong>. The layout alternates between immersive black sections and crisp white editorial panels — each section earns its own breathing room. Corners are <strong>razor-sharp</strong> (0px default) reflecting the precision of Italian coachwork. When softness is needed, it is <strong>extremely subtle</strong> (8px on modals only). Shadows are nearly absent; depth comes from <strong>rule weight and delineation</strong>, not atmospheric effects. The 8px base unit scales to 96px for major sectional spacing, creating a rich hierarchy from micro-interactions to page-level composition.';
      html += '  </div>';
      html += '</div>';

      /* Spacing scale */
      html += '<div class="section">';
      html += '  <div class="section__label">Spacing Scale</div>';

      const spacingEntries = Object.entries(spacing);
      const maxPx = Math.max(...spacingEntries.map(([, o]) => parseFloat(o.value) || 0), 1);

      spacingEntries.forEach(([key, obj]) => {
        const px = parseFloat(obj.value) || 0;
        const pct = Math.max((px / maxPx) * 100, 2);
        const label = obj.label || key;
        
        html += '<div class="spacing-row">';
        html += '  <div>';
        html += '    <div class="spacing-row__name">' + esc(key) + '</div>';
        html += '    <div class="spacing-row__label">' + esc(label) + '</div>';
        html += '  </div>';
        html += '  <div class="spacing-row__bar-wrap">';
        html += '    <div class="spacing-row__bar" style="width:' + pct + '%"></div>';
        html += '  </div>';
        html += '  <div class="spacing-row__value">' + esc(obj.value) + '</div>';
        html += '</div>';
      });

      html += '</div>';

      /* Grid visualization */
      html += '<div class="section">';
      html += '  <div class="section__label">Canvas Grid</div>';
      html += '  <div class="grid-demo">';
      html += '    <div class="grid-demo__title">12-Column Grid System</div>';
      html += '    <div class="grid-demo__visual">';
      for (let i = 1; i <= 12; i++) {
        html += '      <div class="grid-demo__column">' + i + '</div>';
      }
      html += '    </div>';
      html += '    <div class="grid-demo__info">';
      html += '      <div>';
      html += '        <div class="grid-demo__stat-label">Canvas Width</div>';
      html += '        <div class="grid-demo__stat">1920px at desktop, fluid below 1024px with 40px side padding</div>';
      html += '      </div>';
      html += '      <div>';
      html += '        <div class="grid-demo__stat-label">Gutter &amp; Margins</div>';
      html += '        <div class="grid-demo__stat">16px gutters, 64px outer margins on desktop</div>';
      html += '      </div>';
      html += '      <div>';
      html += '        <div class="grid-demo__stat-label">Editorial Sections</div>';
      html += '        <div class="grid-demo__stat">2-column alternating layouts with image + text. 40–80px vertical spacing between blocks.</div>';
      html += '      </div>';
      html += '      <div>';
      html += '        <div class="grid-demo__stat-label">Chiaroscuro Rhythm</div>';
      html += '        <div class="grid-demo__stat">Dark sections on absolute black, editorial content on white. Pacing like magazine spreads.</div>';
      html += '      </div>';
      html += '    </div>';
      html += '  </div>';
      html += '</div>';

      /* Rule weights */
      html += '<div class="section">';
      html += '  <div class="section__label">Rule Weights &amp; Elevation</div>';

      Object.entries(rules).forEach(([key, rule]) => {
        const weight = rule.weight;
        const color = rule.color;
        const weightNum = parseFloat(weight) || 0;

        html += '<div class="rule-demo">';
        html += '  <div class="rule-demo__header">';
        html += '    <div>';
        html += '      <div class="rule-demo__name">' + esc(rule.name) + '</div>';
        html += '      <div class="rule-demo__label">' + esc(rule.use) + '</div>';
        html += '    </div>';
        html += '    <div class="rule-demo__spec">' + esc(weight) + '</div>';
        html += '  </div>';
        
        if (weight === 'none') {
          html += '  <div class="rule-demo__container" style="background: var(--paper); border: 1px dashed rgba(24,24,24,0.18);">';
          html += '    <div style="font-family: var(--font-display); font-size: 12px; color: var(--slate); font-weight: 500;">No border, no shadow</div>';
          html += '  </div>';
        } else {
          html += '  <div class="rule-demo__container">';
          html += '    <div class="rule-demo__line" style="height:' + weightNum + 'px; background:' + color + '"></div>';
          html += '  </div>';
        }
        
        html += '</div>';
      });

      html += '</div>';

      /* Border radius */
      html += '<div class="section">';
      html += '  <div class="section__label">Border Radius</div>';
      html += '  <p style="font-family: var(--font-body); font-size: 16px; color: var(--slate); line-height: 1.6; margin-bottom: 48px;">This system defaults to <strong>sharp corners everywhere</strong> — buttons, cards, inputs, modals — reflecting precision engineering. Only two exceptions exist for softness.</p>';
      html += '  <div class="radius-grid">';

      Object.entries(radius).forEach(([key, obj]) => {
        const radiusValue = obj.value;

        html += '<div class="radius-item">';
        html += '  <div class="radius-item__demo">';
        html += '    <div class="radius-item__box" style="border-radius: ' + esc(radiusValue) + '"></div>';
        html += '  </div>';
        html += '  <div class="radius-item__info">';
        html += '    <div class="radius-item__name">--radius-' + esc(key) + '</div>';
        html += '    <div class="radius-item__value">' + esc(radiusValue) + '</div>';
        html += '    <div class="radius-item__description">' + esc(obj.use) + '</div>';
        html += '  </div>';
        html += '</div>';
      });

      html += '  </div>';
      html += '</div>';

      /* Whitespace philosophy */
      html += '<div class="philosophy" style="margin-bottom: 0;">';
      html += '  <div class="philosophy__title">Whitespace as Editorial Pacing</div>';
      html += '  <div class="philosophy__text">';
      html += '    Each section on a Ferrari page is a <strong>curated spread in a luxury publication</strong>. Generous vertical spacing (40–80px between major blocks) creates distinct reading zones. The layout alternates between <strong>immersive black sections</strong> (where photography lives in shadow) and <strong>crisp white editorial panels</strong> (where story text and metadata breathe). This chiaroscuro rhythm feels like turning pages in a yearbook. <strong>Density in content, void in structure</strong>: body copy is compact (16px, 1.3 line-height, tight measure), but surrounded by abundant empty space. When a hairline rule appears, it is the only separator needed — the whitespace does the rest.';
      html += '  </div>';
      html += '</div>';

      app.innerHTML = html;
    }

    function esc(s) {
      const d = document.createElement('div');
      d.textContent = String(s);
      return d.innerHTML;
    }
  </script>
</body>
</html>
