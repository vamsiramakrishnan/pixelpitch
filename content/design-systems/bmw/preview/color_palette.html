<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Color Palette — BMW</title>
  <link rel="stylesheet" href="../colors_and_type.css">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: var(--font-body, system-ui, sans-serif);
      background: var(--paper, #ffffff);
      color: var(--ink, #262626);
      line-height: 1.5;
      padding: 0;
    }

    .page {
      max-width: 1200px;
      margin: 0 auto;
      padding: 80px 40px;
    }

    /* Header / Stage head */
    .header {
      margin-bottom: 80px;
      border-bottom: 1px solid var(--border, #e5e5e5);
      padding-bottom: 48px;
    }

    .header__kicker {
      font-family: var(--font-body, system-ui, sans-serif);
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: var(--slate, #757575);
      margin-bottom: 16px;
    }

    .header__title {
      font-family: var(--font-body, system-ui, sans-serif);
      font-size: 60px;
      font-weight: 300;
      line-height: 1.15;
      letter-spacing: -0.01em;
      color: var(--ink, #262626);
      margin-bottom: 16px;
      text-transform: uppercase;
    }

    .header__subtitle {
      font-family: var(--font-body, system-ui, sans-serif);
      font-size: 18px;
      line-height: 1.4;
      color: var(--slate, #757575);
      max-width: 720px;
      margin-bottom: 20px;
      font-weight: 400;
    }

    .header__meta {
      font-family: var(--font-body, system-ui, sans-serif);
      font-size: 12px;
      font-weight: 500;
      letter-spacing: 0.08em;
      color: var(--slate, #757575);
      text-transform: uppercase;
    }

    /* Section labels */
    .section-label {
      font-family: var(--font-body, system-ui, sans-serif);
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: var(--slate, #757575);
      margin-bottom: 32px;
      padding-bottom: 16px;
      border-bottom: 1px solid var(--border, #e5e5e5);
    }

    /* Swatch grid */
    .swatch-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 24px;
      margin-bottom: 72px;
    }

    .swatch {
      background: var(--paper, #ffffff);
      border: 1px solid var(--border, #e5e5e5);
      border-radius: 0;
      overflow: hidden;
      transition: all 0.2s ease;
    }

    .swatch:hover {
      border-color: var(--signal, #1c69d4);
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
    }

    .swatch__chip {
      width: 100%;
      aspect-ratio: 4 / 3;
      position: relative;
    }

    .swatch__chip-contrast {
      position: absolute;
      bottom: 12px;
      right: 14px;
      font-family: var(--font-body, system-ui, sans-serif);
      font-size: 11px;
      font-weight: 700;
      padding: 4px 12px;
      border-radius: 0;
      line-height: 1.2;
      text-transform: uppercase;
      letter-spacing: 0.08em;
    }

    .swatch__meta {
      padding: 20px;
    }

    .swatch__var {
      font-family: var(--font-mono, ui-monospace, monospace);
      font-size: 11px;
      font-weight: 600;
      color: var(--ink, #262626);
      word-break: break-all;
      margin-bottom: 8px;
      letter-spacing: 0.02em;
    }

    .swatch__hex {
      font-family: var(--font-mono, ui-monospace, monospace);
      font-size: 11px;
      color: var(--slate, #757575);
      margin-bottom: 10px;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      font-weight: 500;
    }

    .swatch__role {
      font-family: var(--font-body, system-ui, sans-serif);
      font-size: 15px;
      line-height: 1.4;
      color: var(--ink, #262626);
      margin-bottom: 10px;
      font-weight: 400;
    }

    .swatch__contrast-label {
      font-family: var(--font-body, system-ui, sans-serif);
      font-size: 11px;
      font-weight: 700;
      margin-top: 10px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .contrast-pass { color: #0d5a3e; }
    .contrast-fail { color: #8b3a2f; }
    .contrast-aa-large { color: #6b5a1a; }

    /* Chip contrast badge styling */
    .chip-badge {
      border-radius: 0;
      font-weight: 700;
      display: inline-block;
    }

    /* Usage pattern section */
    .usage-section {
      margin-bottom: 72px;
      padding: 48px 40px;
      background: var(--bone, #f5f5f5);
      border: 1px solid var(--border, #e5e5e5);
      border-radius: 0;
    }

    .usage-section h2 {
      font-family: var(--font-body, system-ui, sans-serif);
      font-size: 36px;
      font-weight: 300;
      line-height: 1.2;
      letter-spacing: -0.01em;
      color: var(--ink, #262626);
      margin-bottom: 24px;
      text-transform: uppercase;
    }

    .usage-section p {
      font-family: var(--font-body, system-ui, sans-serif);
      font-size: 16px;
      line-height: 1.5;
      color: var(--ink, #262626);
      margin-bottom: 24px;
      max-width: 720px;
    }

    .rule-of-one {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 32px;
      margin-top: 32px;
      align-items: start;
    }

    .rule-example {
      padding: 32px;
      background: var(--paper, #ffffff);
      border: 1px solid var(--border, #e5e5e5);
      border-radius: 0;
    }

    .rule-example h3 {
      font-family: var(--font-body, system-ui, sans-serif);
      font-size: 22px;
      font-weight: 400;
      line-height: 1.3;
      color: var(--ink, #262626);
      margin-bottom: 16px;
    }

    .rule-example p {
      font-family: var(--font-body, system-ui, sans-serif);
      font-size: 15px;
      line-height: 1.5;
      color: var(--slate, #757575);
      margin-bottom: 0;
    }

    .correct {
      border: 2px solid #0d5a3e;
    }

    .correct::before {
      content: '✓ CORRECT';
      display: block;
      font-family: var(--font-body, system-ui, sans-serif);
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.15em;
      color: #0d5a3e;
      text-transform: uppercase;
      margin-bottom: 16px;
      padding-bottom: 16px;
      border-bottom: 1px solid #0d5a3e;
    }

    .incorrect {
      border: 2px solid #8b3a2f;
    }

    .incorrect::before {
      content: '✗ INCORRECT';
      display: block;
      font-family: var(--font-body, system-ui, sans-serif);
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.15em;
      color: #8b3a2f;
      text-transform: uppercase;
      margin-bottom: 16px;
      padding-bottom: 16px;
      border-bottom: 1px solid #8b3a2f;
    }

    .signal-demo {
      font-size: 16px;
      line-height: 1.5;
    }

    .signal-demo .drop-cap {
      font-family: var(--font-body, system-ui, sans-serif);
      font-size: 56px;
      font-weight: 300;
      color: var(--signal, #1c69d4);
      float: left;
      line-height: 0.8;
      padding-right: 8px;
      margin-top: 2px;
    }

    .signal-demo em {
      color: var(--signal, #1c69d4);
      font-style: italic;
    }

    /* WCAG summary */
    .wcag-summary {
      margin-top: 72px;
      padding: 48px 40px;
      background: var(--bone, #f5f5f5);
      border: 1px solid var(--border, #e5e5e5);
      border-radius: 0;
    }

    .wcag-summary h2 {
      font-family: var(--font-body, system-ui, sans-serif);
      font-size: 36px;
      font-weight: 300;
      line-height: 1.2;
      letter-spacing: -0.01em;
      margin-bottom: 24px;
      color: var(--ink, #262626);
      text-transform: uppercase;
    }

    .wcag-summary p {
      font-family: var(--font-body, system-ui, sans-serif);
      font-size: 15px;
      line-height: 1.5;
      color: var(--slate, #757575);
      margin-bottom: 32px;
      max-width: 720px;
    }

    .wcag-row {
      display: flex;
      align-items: center;
      gap: 20px;
      padding: 16px 0;
      border-bottom: 1px solid var(--border, #e5e5e5);
      font-family: var(--font-body, system-ui, sans-serif);
      font-size: 15px;
    }

    .wcag-row:last-child { border-bottom: none; }

    .wcag-badge {
      display: inline-block;
      padding: 6px 14px;
      border-radius: 0;
      font-family: var(--font-body, system-ui, sans-serif);
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      min-width: 100px;
      text-align: center;
    }

    .wcag-badge--pass { background: var(--paper, #ffffff); color: #0d5a3e; border: 1px solid #0d5a3e; }
    .wcag-badge--fail { background: var(--paper, #ffffff); color: #8b3a2f; border: 1px solid #8b3a2f; }
    .wcag-badge--aa-large { background: var(--paper, #ffffff); color: #6b5a1a; border: 1px solid #6b5a1a; }

    /* Loading state */
    .loading {
      text-align: center;
      padding: 120px 24px;
      color: var(--slate, #757575);
      font-family: var(--font-body, system-ui, sans-serif);
      font-size: 16px;
    }

    .loading::after {
      content: '';
      display: block;
      width: 32px;
      height: 32px;
      margin: 24px auto 0;
      border: 2px solid var(--slate, #757575);
      border-top-color: var(--signal, #1c69d4);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    /* Responsive */
    @media (max-width: 768px) {
      .page { padding: 48px 24px; }
      .header { padding-bottom: 32px; margin-bottom: 56px; }
      .header__title { font-size: 42px; }
      .swatch-grid { grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 16px; }
      .rule-of-one { grid-template-columns: 1fr; gap: 20px; }
      .usage-section { padding: 32px 24px; }
      .wcag-summary { padding: 32px 24px; }
    }
  </style>
</head>
<body>
  <div class="page" id="app">
    <div class="loading">Loading design tokens…</div>
  </div>

  <script>
    /* ───────────────────────────────────────────────────────────── */
    /* Contrast ratio calculation (WCAG 2.1 relative luminance)      */
    /* ───────────────────────────────────────────────────────────── */
    function hexToRgb(hex) {
      hex = hex.replace(/^#/, '');
      if (hex.length === 3) hex = hex.split('').map(c => c + c).join('');
      const n = parseInt(hex, 16);
      return [(n >> 16) & 255, (n >> 8) & 255, n & 255];
    }

    function luminance([r, g, b]) {
      const [rs, gs, bs] = [r, g, b].map(c => {
        c /= 255;
        return c <= 0.03928 ? c / 12.92 : Math.pow((c + 0.055) / 1.055, 2.4);
      });
      return 0.2126 * rs + 0.7152 * gs + 0.0722 * bs;
    }

    function contrastRatio(hex1, hex2) {
      const l1 = luminance(hexToRgb(hex1));
      const l2 = luminance(hexToRgb(hex2));
      const lighter = Math.max(l1, l2);
      const darker = Math.min(l1, l2);
      return (lighter + 0.05) / (darker + 0.05);
    }

    function wcagLevel(ratio) {
      if (ratio >= 7) return { label: 'AAA', cls: 'pass' };
      if (ratio >= 4.5) return { label: 'AA', cls: 'pass' };
      if (ratio >= 3) return { label: 'AA Large', cls: 'aa-large' };
      return { label: 'Fail', cls: 'fail' };
    }

    /* ───────────────────────────────────────────────────────────── */
    /* Core color roles and descriptions (BMW context)               */
    /* ───────────────────────────────────────────────────────────── */
    const CORE_ROLES = {
      paper:  'Primary canvas. Clean, precise white for luxury content display.',
      ink:    'Primary text. Dark charcoal for maximum readability and precision.',
      slate:  'Secondary text, metadata. Warm gray for subordinate information.',
      signal: 'BMW Blue accent. Interactive elements and focus states only.',
      bone:   'Subtle background zones. Nearly white for sidebar and quoted sections.',
    };

    /* ───────────────────────────────────────────────────────────── */
    /* Render from tokens.json                                       */
    /* ───────────────────────────────────────────────────────────── */
    (window.__DESIGN_TOKENS__ 
      ? Promise.resolve({ ok: true, json: () => Promise.resolve(window.__DESIGN_TOKENS__) }) 
      : fetch('../tokens.json'))
      .then(r => {
        if (!r.ok) throw new Error('tokens.json not found (' + r.status + ')');
        return r.json();
      })
      .then(render)
      .catch(err => {
        document.getElementById('app').innerHTML =
          '<div class="loading" style="color:var(--signal,#1c69d4)">' +
          'Could not load tokens.json — ' + err.message + '</div>';
      });

    function render(tokens) {
      const app = document.getElementById('app');
      const title = tokens.meta?.title || 'Design System';
      const summary = tokens.meta?.summary || '';
      const rawColors = tokens.colors || {};
      const paperHex = rawColors.paper || '#ffffff';

      /* Flatten nested color structure */
      const colors = {};
      for (const [k, v] of Object.entries(rawColors)) {
        if (typeof v === 'string') {
          colors[k] = v;
        } else if (v && typeof v === 'object') {
          for (const [sk, sv] of Object.entries(v)) {
            if (typeof sv === 'string') colors[k + '-' + sk] = sv;
          }
        }
      }

      /* Split core and extended */
      const coreKeys = Object.keys(CORE_ROLES).filter(k => colors[k]);
      const extendedKeys = Object.keys(colors).filter(k => !CORE_ROLES[k] && typeof colors[k] === 'string');

      let html = '';

      /* ─ Stage head header ─ */
      html += '<header class="header">';
      html += '  <div class="header__kicker">Design System</div>';
      html += '  <h1 class="header__title">' + esc(title) + '</h1>';
      html += '  <p class="header__subtitle">' + esc(summary) + '</p>';
      html += '  <div class="header__meta">Color Palette &mdash; ' + (coreKeys.length + extendedKeys.length) + ' Tokens</div>';
      html += '</header>';

      /* ─ Core Palette ─ */
      if (coreKeys.length) {
        html += '<div class="section-label">Core Palette</div>';
        html += '<div class="swatch-grid">';
        coreKeys.forEach(key => {
          html += swatchCard(key, colors[key], paperHex, CORE_ROLES[key]);
        });
        html += '</div>';
      }

      /* ─ Extended Palette ─ */
      if (extendedKeys.length) {
        html += '<div class="section-label">Extended Palette</div>';
        html += '<div class="swatch-grid">';
        extendedKeys.forEach(key => {
          const role = formatRole(key);
          html += swatchCard(key, colors[key], paperHex, role);
        });
        html += '</div>';
      }

      /* ─ Precision Focus System ─ */
      html += precisionFocusSection(paperHex);

      /* ─ WCAG Summary ─ */
      html += wcagSummary(colors, paperHex);

      app.innerHTML = html;
    }

    /* ───────────────────────────────────────────────────────────── */
    /* Swatch card builder                                           */
    /* ───────────────────────────────────────────────────────────── */
    function swatchCard(key, hex, paperHex, role) {
      const ratio = contrastRatio(hex, paperHex);
      const level = wcagLevel(ratio);
      const lum = luminance(hexToRgb(hex));
      const chipTextColor = lum > 0.5 ? '#262626' : '#ffffff';
      const chipBadgeBg = lum > 0.5 ? 'rgba(38,38,38,0.12)' : 'rgba(255,255,255,0.2)';

      return '' +
        '<div class="swatch">' +
        '  <div class="swatch__chip" style="background:' + hex + '">' +
        '    <span class="swatch__chip-contrast chip-badge" style="color:' + chipTextColor +
             ';background:' + chipBadgeBg + '">' + ratio.toFixed(2) + ':1</span>' +
        '  </div>' +
        '  <div class="swatch__meta">' +
        '    <div class="swatch__var">--' + esc(key) + '</div>' +
        '    <div class="swatch__hex">' + esc(hex.toUpperCase()) + '</div>' +
        '    <div class="swatch__role">' + esc(role) + '</div>' +
        '    <div class="swatch__contrast-label contrast-' + level.cls + '">' +
             'WCAG ' + level.label + '</div>' +
        '  </div>' +
        '</div>';
    }

    /* ───────────────────────────────────────────────────────────── */
    /* Precision Focus System (BMW-specific usage pattern)            */
    /* ───────────────────────────────────────────────────────────── */
    function precisionFocusSection(paperHex) {
      let html = '<section class="usage-section">';
      html += '<h2>Precision Focus System</h2>';
      html += '<p>BMW Blue is reserved exclusively for interactive elements: links, buttons, focus states. Never use signal as a decorative fill or pattern. The constraint creates hierarchy through interaction precision, not visual noise.</p>';

      html += '<div class="rule-of-one">';

      /* Correct example */
      html += '<div class="rule-example correct">';
      html += '<h3>Link Focus State</h3>';
      html += '<p class="signal-demo">';
      html += '<span class="drop-cap">T</span>';
      html += 'he new M440 xDrive redefines performance architecture. <em>Explore engineering details</em> with precision keyboard navigation.';
      html += '</p>';
      html += '</div>';

      /* Incorrect example */
      html += '<div class="rule-example incorrect">';
      html += '<h3>Decorative Signal Use</h3>';
      html += '<p>';
      html += 'This section header is <span style="color:var(--signal,#1c69d4)">highlighted in blue</span>, and so is this accent line, and even the background of this quote block uses signal color. Decorative use destroys focus clarity.';
      html += '</p>';
      html += '</div>';

      html += '</div>';
      html += '</section>';
      return html;
    }

    /* ───────────────────────────────────────────────────────────── */
    /* WCAG compliance summary                                       */
    /* ───────────────────────────────────────────────────────────── */
    function wcagSummary(colors, paperHex) {
      const keys = Object.keys(colors);
      let passAAA = 0, passAA = 0, passAALarge = 0, fail = 0;

      keys.forEach(k => {
        const ratio = contrastRatio(colors[k], paperHex);
        if (ratio >= 7) passAAA++;
        else if (ratio >= 4.5) passAA++;
        else if (ratio >= 3) passAALarge++;
        else fail++;
      });

      let html = '<div class="wcag-summary">';
      html += '<h2>WCAG 2.1 Compliance</h2>';
      html += '<p>Contrast ratios measured against paper background (#FFFFFF). BMW\'s palette emphasizes clarity and readability across dark hero sections and white content areas. All text colors meet WCAG AA standards for body text on light surfaces.</p>';
      html += row('AAA (7:1+)', passAAA, 'pass');
      html += row('AA (4.5:1+)', passAA, 'pass');
      html += row('AA Large Text (3:1+)', passAALarge, 'aa-large');
      html += row('Below threshold', fail, fail > 0 ? 'fail' : 'pass');
      html += '</div>';
      return html;

      function row(label, count, badge) {
        return '<div class="wcag-row">' +
               '<span class="wcag-badge wcag-badge--' + badge + '">' + count + '</span>' +
               '<span>' + label + '</span>' +
               '</div>';
      }
    }

    /* ───────────────────────────────────────────────────────────── */
    /* Utilities                                                      */
    /* ───────────────────────────────────────────────────────────── */
    function esc(s) {
      const d = document.createElement('div');
      d.textContent = String(s);
      return d.innerHTML;
    }

    function formatRole(key) {
      return key
        .replace(/([A-Z])/g, ' $1')
        .replace(/[-_]/g, ' ')
        .replace(/\b\w/g, c => c.toUpperCase())
        .trim();
    }
  </script>
</body>
</html>
