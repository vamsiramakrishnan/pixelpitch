<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Type Specimen — Doodle</title>
  <link rel="stylesheet" href="../colors_and_type.css">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: var(--font-body, 'system-ui', sans-serif);
      background: var(--paper, #ffffff);
      color: var(--ink, #111111);
      line-height: 1.6;
    }

    .page {
      max-width: 1100px;
      margin: 0 auto;
      padding: 96px 48px;
    }

    @media (max-width: 768px) {
      .page {
        padding: 64px 32px;
      }
    }

    @media (max-width: 480px) {
      .page {
        padding: 48px 24px;
      }
    }

    /* Header */
    .header {
      margin-bottom: 96px;
    }

    .header__kicker {
      font-family: var(--font-mono, 'ui-monospace', monospace);
      font-size: 14px;
      font-weight: 500;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--slate, #666666);
      margin-bottom: 16px;
    }

    .header__title {
      font-family: 'Delius Swash Caps', cursive;
      font-size: 96px;
      font-weight: 400;
      line-height: 0.95;
      letter-spacing: -0.02em;
      color: var(--ink, #111111);
      margin-bottom: 24px;
      transform: rotate(-1deg);
    }

    .header__subtitle {
      font-family: var(--font-body, 'system-ui', sans-serif);
      font-size: 22px;
      font-weight: 400;
      line-height: 1.55;
      color: var(--slate, #666666);
      max-width: 680px;
      margin-bottom: 32px;
    }

    .header__rule {
      display: block;
      width: 96px;
      height: 2px;
      background: var(--ink, #111111);
      border: none;
      margin: 0;
      border-radius: 1px;
    }

    /* Font families section */
    .font-families {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 32px;
      margin-bottom: 96px;
      margin-top: 64px;
    }

    .font-card {
      background: transparent;
      border: 2px dashed var(--border, #e5e5e5);
      border-radius: 12px;
      padding: 32px;
      transform: rotate(-0.5deg);
    }

    .font-card:nth-child(2n) {
      transform: rotate(0.5deg);
    }

    .font-card__label {
      font-family: var(--font-mono, 'ui-monospace', monospace);
      font-size: 12px;
      font-weight: 500;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--slate, #666666);
      margin-bottom: 12px;
    }

    .font-card__name {
      font-family: 'Delius Swash Caps', cursive;
      font-size: 36px;
      font-weight: 400;
      line-height: 1.1;
      color: var(--ink, #111111);
      margin-bottom: 8px;
    }

    .font-card__fallback {
      font-family: var(--font-mono, 'ui-monospace', monospace);
      font-size: 12px;
      color: var(--slate, #666666);
      word-break: break-word;
    }

    /* Character set block */
    .charmap-block {
      background: transparent;
      border: 2px solid var(--border, #e5e5e5);
      border-radius: 12px;
      padding: 48px;
      margin-bottom: 96px;
      position: relative;
    }

    .charmap-block::before {
      content: '✎';
      position: absolute;
      top: 16px;
      right: 16px;
      font-size: 24px;
      opacity: 0.3;
    }

    .charmap-block__label {
      font-family: var(--font-mono, 'ui-monospace', monospace);
      font-size: 12px;
      font-weight: 500;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--slate, #666666);
      margin-bottom: 24px;
    }

    .charmap-block__chars {
      font-family: 'Delius Swash Caps', cursive;
      font-size: 32px;
      font-weight: 400;
      line-height: 1.8;
      letter-spacing: 0.02em;
      color: var(--ink, #111111);
      word-break: break-word;
    }

    /* Section label */
    .section-label {
      font-family: var(--font-mono, 'ui-monospace', monospace);
      font-size: 12px;
      font-weight: 500;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--slate, #666666);
      margin-bottom: 32px;
      padding-bottom: 16px;
      border-bottom: 2px dashed var(--ink, #111111);
    }

    /* Ramp row */
    .ramp-row {
      display: grid;
      grid-template-columns: 280px 1fr;
      gap: 48px;
      align-items: baseline;
      padding: 32px 0;
      border-bottom: 1px solid var(--border, #e5e5e5);
    }

    .ramp-row:last-child {
      border-bottom: none;
    }

    @media (max-width: 800px) {
      .ramp-row {
        grid-template-columns: 1fr;
        gap: 16px;
      }
    }

    /* Left meta column */
    .ramp-meta__role {
      font-family: 'Delius Swash Caps', cursive;
      font-size: 18px;
      font-weight: 400;
      color: var(--ink, #111111);
      margin-bottom: 8px;
    }

    .ramp-meta__detail {
      font-family: var(--font-mono, 'ui-monospace', monospace);
      font-size: 11px;
      font-weight: 400;
      line-height: 1.8;
      color: var(--slate, #666666);
      letter-spacing: 0.02em;
    }

    /* Right sample column */
    .ramp-sample {
      color: var(--ink, #111111);
      overflow-wrap: break-word;
      word-spacing: 0.1em;
    }

    /* Ramp section */
    .ramp-section {
      margin-bottom: 96px;
    }

    /* Drop cap demo */
    .dropcap-demo {
      margin-bottom: 96px;
    }

    .dropcap-demo__label {
      font-family: var(--font-mono, 'ui-monospace', monospace);
      font-size: 12px;
      font-weight: 500;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--slate, #666666);
      margin-bottom: 32px;
      padding-bottom: 16px;
      border-bottom: 2px dashed var(--ink, #111111);
    }

    .dropcap-container {
      background: transparent;
      border: 2px solid var(--signal, #3b82f6);
      border-radius: 12px;
      padding: 48px;
      max-width: 680px;
      position: relative;
    }

    .dropcap-container::before {
      content: '🎨';
      position: absolute;
      top: -16px;
      left: 24px;
      font-size: 32px;
      background: var(--paper, #ffffff);
      padding: 0 8px;
    }

    .dropcap-para {
      font-family: var(--font-body, 'system-ui', sans-serif);
      font-size: 22px;
      font-weight: 400;
      line-height: 1.55;
      color: var(--ink, #111111);
      margin: 0;
      text-align: left;
    }

    .dropcap {
      float: left;
      font-family: 'Delius Swash Caps', cursive;
      font-size: 128px;
      font-weight: 400;
      line-height: 0.85;
      color: var(--signal, #3b82f6);
      margin-right: 8px;
      margin-top: -8px;
      font-style: italic;
    }

    /* Loading */
    .loading {
      text-align: center;
      padding: 160px 48px;
      color: var(--slate, #666666);
      font-family: var(--font-body, 'system-ui', sans-serif);
      font-size: 18px;
    }

    .loading::after {
      content: '';
      display: block;
      width: 32px;
      height: 32px;
      margin: 24px auto 0;
      border: 2px solid var(--border, #e5e5e5);
      border-top-color: var(--signal, #3b82f6);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    /* Doodle decorations */
    .doodle-accent {
      position: relative;
      display: inline-block;
    }

    .doodle-accent::after {
      content: '';
      position: absolute;
      bottom: -4px;
      left: 0;
      right: 0;
      height: 2px;
      background: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 4"><path d="M 0 2 Q 5 0 10 2 T 20 2 T 30 2 T 40 2 T 50 2 T 60 2 T 70 2 T 80 2 T 90 2 T 100 2" stroke="%233b82f6" stroke-width="2" fill="none"/></svg>') repeat-x;
      background-size: 100px 4px;
    }
  </style>
</head>
<body>
  <div class="page" id="app">
    <div class="loading">Loading design tokens&hellip;</div>
  </div>

  <script>
    const EDITORIAL_SAMPLES = [
      'Doodle away the ordinary.',
      'Playfulness is a feature, not a bug.',
      'Hand-drawn beats machine-perfect.',
      'Let imperfection be your guide.',
      'Sketch the story. Color fills in meaning.',
      'Every line tells a tiny tale.',
      'Messy edges, clear purpose.',
      'Draw first. Edit second. Ship with joy.',
      'Whimsy and usability can coexist.',
      'The margin notes are the real design.',
    ];

    const DROPCAP_TEXT = 'Doodle is where discipline meets play. Hand-drawn typography breathes life into interfaces that might otherwise feel sterile or corporate. Delius Swash Caps carries the personality—a typeface designed to look like genuine handwriting, complete with the slight variations and flourishes that make it human. The system refuses to apologize for its sketchy edges and imperfect curves. Instead, it celebrates them as features. In a world of pixel-perfect grids and algorithmic precision, a doodle says: "I made this for you, by hand, with care." That gesture matters. It builds connection. It says the designers didn\'t just automate the interface—they thought about how it would feel in the moment of use. Doodle systems work best when they balance playfulness with clarity. Too much whimsy becomes chaos. Too much constraint kills the joy.';

    fetch('../tokens.json')
      .then(r => {
        if (!r.ok) throw new Error('tokens.json not found (' + r.status + ')');
        return r.json();
      })
      .then(render)
      .catch(err => {
        document.getElementById('app').innerHTML =
          '<div class="loading" style="color:#3b82f6">' +
          'Could not load tokens.json — ' + err.message + '</div>';
      });

    function render(tokens) {
      const app = document.getElementById('app');
      const title = tokens.meta?.title || 'Design System';
      const summary = tokens.meta?.summary || '';

      const fonts = tokens.typography || {};
      const ramp = tokens.typography?.ramp || [];

      let html = '';

      /* Header */
      html += '<header class="header">';
      html += '  <div class="header__kicker">Type Specimen</div>';
      html += '  <h1 class="header__title">' + esc(title) + '</h1>';
      html += '  <p class="header__subtitle">' + esc(summary) + '</p>';
      html += '  <hr class="header__rule">';
      html += '</header>';

      /* Font families */
      const families = [
        { label: 'Display', name: 'Delius Swash Caps', fallback: 'cursive' },
        { label: 'Body', name: 'System UI', fallback: 'system-ui, -apple-system, sans-serif' },
        { label: 'Monospace', name: 'JetBrains Mono', fallback: 'ui-monospace, Menlo, monospace' }
      ];

      html += '<div class="font-families">';
      families.forEach(f => {
        html += '<div class="font-card">';
        html += '  <div class="font-card__label">' + esc(f.label) + '</div>';
        html += '  <div class="font-card__name" style="font-family:' + (f.name === 'Delius Swash Caps' ? "'Delius Swash Caps', cursive" : "inherit") + '">' + esc(f.name) + '</div>';
        html += '  <div class="font-card__fallback">' + esc(f.fallback) + '</div>';
        html += '</div>';
      });
      html += '</div>';

      /* Character set */
      html += '<div class="charmap-block">';
      html += '  <div class="charmap-block__label">Character Set</div>';
      html += '  <div class="charmap-block__chars" style="font-family:\'Delius Swash Caps\',cursive">';
      html += '    AaBbCcDdEeFfGgHhIiJjKkLlMmNnOoPpQqRrSsTtUuVvWwXxYyZz<br>';
      html += '    0123456789 !@#$%&amp;*()&ndash;&mdash;&lsquo;&rsquo;&ldquo;&rdquo;';
      html += '  </div>';
      html += '</div>';

      /* Type ramp with hardcoded scale */
      const hardcodedRamp = [
        { role: 'Micro', size: '14px', weight: 400, font: 'body', lh: '1.4', ls: '0.05em' },
        { role: 'Small', size: '16px', weight: 400, font: 'body', lh: '1.5', ls: '0' },
        { role: 'Base', size: '18px', weight: 400, font: 'body', lh: '1.6', ls: '0' },
        { role: 'Heading Level 3', size: '24px', weight: 500, font: 'display', lh: '1.2', ls: '-0.01em' },
        { role: 'Heading Level 2', size: '32px', weight: 500, font: 'display', lh: '1.15', ls: '-0.01em' },
        { role: 'Heading Level 1', size: '40px', weight: 500, font: 'display', lh: '1.1', ls: '-0.02em' },
      ];

      if (hardcodedRamp.length) {
        html += '<div class="ramp-section">';
        html += '<div class="section-label">Type Ramp</div>';
        hardcodedRamp.forEach((entry, i) => {
          html += rampRow(entry, i);
        });
        html += '</div>';
      }

      /* Drop cap demo */
      html += '<div class="dropcap-demo">';
      html += '<div class="dropcap-demo__label">Drop Cap — Delius Swash Caps, Signal Blue</div>';
      html += '<div class="dropcap-container">';
      const firstChar = DROPCAP_TEXT.charAt(0);
      const restText = DROPCAP_TEXT.substring(1);
      html += '<p class="dropcap-para">';
      html += '<span class="dropcap">' + esc(firstChar) + '</span>';
      html += esc(restText);
      html += '</p>';
      html += '</div>';
      html += '</div>';

      app.innerHTML = html;
    }

    function rampRow(entry, idx) {
      const role = entry.role || 'Role ' + (idx + 1);
      const size = entry.size || '16px';
      const weight = entry.weight || 400;
      const lh = entry.lh || '1.5';
      const ls = entry.ls || '0';

      let fontFamily = 'var(--font-body)';
      if (entry.font === 'display') fontFamily = "'Delius Swash Caps', cursive";

      const sizeNum = parseFloat(size);
      const sampleIdx = idx % EDITORIAL_SAMPLES.length;
      let sample = EDITORIAL_SAMPLES[sampleIdx];

      if (sizeNum >= 32) {
        sample = sample.split('.')[0].slice(0, 35);
        if (!sample.endsWith('.')) sample += '.';
      }

      let fontStyle = 'font-size:' + size + ';font-weight:' + weight + ';line-height:' + lh + ';';
      fontStyle += 'font-family:' + fontFamily + ';';
      if (ls && ls !== '0' && ls !== 'normal') fontStyle += 'letter-spacing:' + ls + ';';

      let meta = esc(size) + ' / ' + esc(String(weight));
      meta += '\n' + (entry.font === 'display' ? 'Delius Swash Caps' : (entry.font === 'mono' ? 'JetBrains Mono' : 'System UI'));
      meta += '\nline-height: ' + esc(String(lh));
      if (ls && ls !== '0' && ls !== 'normal') meta += '\nletter-spacing: ' + esc(ls);

      return '' +
        '<div class="ramp-row">' +
        '  <div class="ramp-meta">' +
        '    <div class="ramp-meta__role">' + esc(role) + '</div>' +
        '    <pre class="ramp-meta__detail">' + meta + '</pre>' +
        '  </div>' +
        '  <div class="ramp-sample" style="' + fontStyle + '">' + esc(sample) + '</div>' +
        '</div>';
    }

    function esc(s) {
      const d = document.createElement('div');
      d.textContent = String(s);
      return d.innerHTML;
    }
  </script>

  <link href="https://fonts.googleapis.com/css2?family=Delius+Swash+Caps&display=swap" rel="stylesheet">
</body>
</html>
