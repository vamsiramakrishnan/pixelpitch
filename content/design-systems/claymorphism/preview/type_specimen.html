<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Type Specimen — Claymorphism</title>
  <link rel="stylesheet" href="../colors_and_type.css">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: var(--font-body, 'Montserrat', system-ui, sans-serif);
      background: var(--paper, #ffffff);
      color: var(--ink, #111111);
      line-height: 1.6;
    }

    .page {
      max-width: 1100px;
      margin: 0 auto;
      padding: 96px 48px;
    }

    @media (max-width: 768px) {
      .page {
        padding: 64px 32px;
      }
    }

    @media (max-width: 480px) {
      .page {
        padding: 48px 24px;
      }
    }

    /* Header */
    .header {
      margin-bottom: 96px;
    }

    .header__kicker {
      font-family: var(--font-mono, 'JetBrains Mono', monospace);
      font-size: 14px;
      font-weight: 600;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--signal, #3b82f6);
      margin-bottom: 16px;
    }

    .header__title {
      font-family: var(--font-display, 'Poppins', system-ui, sans-serif);
      font-size: 96px;
      font-weight: 800;
      line-height: 0.95;
      letter-spacing: -0.02em;
      color: var(--ink, #111111);
      margin-bottom: 24px;
    }

    .header__subtitle {
      font-family: var(--font-body, 'Montserrat', system-ui, sans-serif);
      font-size: 22px;
      font-weight: 400;
      line-height: 1.55;
      color: var(--slate, #666666);
      max-width: 680px;
      margin-bottom: 32px;
    }

    .header__rule {
      display: block;
      width: 96px;
      height: 3px;
      background: var(--signal, #3b82f6);
      border: none;
      margin: 0;
      border-radius: var(--radius-sm, 4px);
    }

    /* Font families section */
    .font-families {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 32px;
      margin-bottom: 96px;
      margin-top: 64px;
    }

    .font-card {
      background: var(--bone, #f5f5f5);
      border: 1px solid var(--border, #e5e5e5);
      border-radius: var(--radius-lg, 16px);
      padding: 32px;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    .font-card:hover {
      transform: translateY(-4px);
      box-shadow: 0 8px 24px rgba(59, 130, 246, 0.12);
    }

    .font-card__label {
      font-family: var(--font-mono, 'JetBrains Mono', monospace);
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--signal, #3b82f6);
      margin-bottom: 12px;
    }

    .font-card__name {
      font-family: var(--font-display, 'Poppins', system-ui, sans-serif);
      font-size: 36px;
      font-weight: 700;
      line-height: 1.1;
      color: var(--ink, #111111);
      margin-bottom: 8px;
    }

    .font-card__fallback {
      font-family: var(--font-mono, 'JetBrains Mono', monospace);
      font-size: 12px;
      color: var(--slate, #666666);
      word-break: break-word;
    }

    /* Character set block */
    .charmap-block {
      background: var(--bone, #f5f5f5);
      border: 1px solid var(--border, #e5e5e5);
      border-radius: var(--radius-lg, 16px);
      padding: 48px;
      margin-bottom: 96px;
    }

    .charmap-block__label {
      font-family: var(--font-mono, 'JetBrains Mono', monospace);
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--signal, #3b82f6);
      margin-bottom: 24px;
    }

    .charmap-block__chars {
      font-family: var(--font-display, 'Poppins', system-ui, sans-serif);
      font-size: 32px;
      font-weight: 600;
      line-height: 1.8;
      letter-spacing: 0.02em;
      color: var(--ink, #111111);
      word-break: break-word;
    }

    /* Section label */
    .section-label {
      font-family: var(--font-mono, 'JetBrains Mono', monospace);
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--signal, #3b82f6);
      margin-bottom: 32px;
      padding-bottom: 16px;
      border-bottom: 3px solid var(--signal, #3b82f6);
    }

    /* Ramp row */
    .ramp-row {
      display: grid;
      grid-template-columns: 280px 1fr;
      gap: 48px;
      align-items: baseline;
      padding: 32px 0;
      border-bottom: 1px solid var(--border, #e5e5e5);
    }

    .ramp-row:last-child {
      border-bottom: none;
    }

    @media (max-width: 800px) {
      .ramp-row {
        grid-template-columns: 1fr;
        gap: 16px;
      }
    }

    /* Left meta column */
    .ramp-meta__role {
      font-family: var(--font-display, 'Poppins', system-ui, sans-serif);
      font-size: 18px;
      font-weight: 700;
      color: var(--ink, #111111);
      margin-bottom: 8px;
    }

    .ramp-meta__detail {
      font-family: var(--font-mono, 'JetBrains Mono', monospace);
      font-size: 11px;
      font-weight: 500;
      line-height: 1.8;
      color: var(--slate, #666666);
      letter-spacing: 0.02em;
    }

    /* Right sample column */
    .ramp-sample {
      color: var(--ink, #111111);
      overflow-wrap: break-word;
      word-spacing: 0.1em;
    }

    /* Ramp section */
    .ramp-section {
      margin-bottom: 96px;
    }

    /* Drop cap demo */
    .dropcap-demo {
      margin-bottom: 96px;
    }

    .dropcap-demo__label {
      font-family: var(--font-mono, 'JetBrains Mono', monospace);
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--signal, #3b82f6);
      margin-bottom: 32px;
      padding-bottom: 16px;
      border-bottom: 3px solid var(--signal, #3b82f6);
    }

    .dropcap-container {
      background: var(--bone, #f5f5f5);
      border: 1px solid var(--border, #e5e5e5);
      border-radius: var(--radius-lg, 16px);
      padding: 48px;
      max-width: 680px;
    }

    .dropcap-para {
      font-family: var(--font-body, 'Montserrat', system-ui, sans-serif);
      font-size: 20px;
      font-weight: 400;
      line-height: 1.6;
      color: var(--ink, #111111);
      margin: 0;
      text-align: left;
    }

    .dropcap {
      float: left;
      font-family: var(--font-display, 'Poppins', system-ui, sans-serif);
      font-size: 120px;
      font-weight: 800;
      line-height: 0.85;
      color: var(--signal, #3b82f6);
      margin-right: 8px;
      margin-top: 0px;
    }

    /* Loading */
    .loading {
      text-align: center;
      padding: 160px 48px;
      color: var(--slate, #666666);
      font-family: var(--font-body, 'Montserrat', system-ui, sans-serif);
      font-size: 18px;
    }

    .loading::after {
      content: '';
      display: block;
      width: 32px;
      height: 32px;
      margin: 24px auto 0;
      border: 3px solid var(--border, #e5e5e5);
      border-top-color: var(--signal, #3b82f6);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div class="page" id="app">
    <div class="loading">Loading design tokens&hellip;</div>
  </div>

  <script>
    const EDITORIAL_SAMPLES = [
      'Claymorphism brings a playful, approachable energy to digital design.',
      'Soft curves and rounded edges create a sense of warmth and familiarity.',
      'The three-dimensional quality draws viewers into the interface.',
      'Every element feels touchable, inviting interaction and exploration.',
      'Colorful surfaces and subtle depth make complex layouts feel simple.',
      'Playfulness does not mean lack of purpose or clarity.',
      'High contrast ensures readability while maintaining the soft aesthetic.',
      'The malleable quality suggests flexibility and adaptability.',
      'Puffy, rounded forms reduce visual harshness and increase approachability.',
      'Claymorphism balances personality with professionalism.',
    ];

    const DROPCAP_TEXT = 'Claymorphism is a modern design philosophy that embraces soft, rounded 3D-like shapes mimicking malleable clay with playful, puffy elements and colorful surfaces. Unlike flat or skeuomorphic designs, claymorphism occupies a delightful middle ground where interfaces feel tactile yet contemporary. The system uses Poppins as the display voice—bold, geometric, and instantly recognizable. Montserrat carries long-form content with clarity and warmth. JetBrains Mono handles metadata and code with precision. Together, these three fonts create a cohesive hierarchy where every typographic choice reinforces the soft, approachable personality of the claymorphism aesthetic. The playful color palette and generous use of white space allow typography to breathe and guide the reader\'s eye with confidence.';

    fetch('../tokens.json')
      .then(r => {
        if (!r.ok) throw new Error('tokens.json not found (' + r.status + ')');
        return r.json();
      })
      .then(render)
      .catch(err => {
        document.getElementById('app').innerHTML =
          '<div class="loading" style="color:#3b82f6">' +
          'Could not load tokens.json — ' + err.message + '</div>';
      });

    function render(tokens) {
      const app = document.getElementById('app');
      const title = tokens.meta?.title || 'Design System';
      const summary = tokens.meta?.summary || '';

      let html = '';

      /* Header */
      html += '<header class="header">';
      html += '  <div class="header__kicker">Type Specimen</div>';
      html += '  <h1 class="header__title">' + esc(title) + '</h1>';
      html += '  <p class="header__subtitle">' + esc(summary) + '</p>';
      html += '  <hr class="header__rule">';
      html += '</header>';

      /* Font families */
      const families = [
        { label: 'Display', name: 'Poppins', fallback: 'system-ui, sans-serif' },
        { label: 'Body', name: 'Montserrat', fallback: 'system-ui, sans-serif' },
        { label: 'Monospace', name: 'JetBrains Mono', fallback: 'ui-monospace, monospace' }
      ];

      html += '<div class="font-families">';
      families.forEach(f => {
        html += '<div class="font-card">';
        html += '  <div class="font-card__label">' + esc(f.label) + '</div>';
        html += '  <div class="font-card__name">' + esc(f.name) + '</div>';
        html += '  <div class="font-card__fallback">' + esc(f.fallback) + '</div>';
        html += '</div>';
      });
      html += '</div>';

      /* Character set */
      html += '<div class="charmap-block">';
      html += '  <div class="charmap-block__label">Character Set</div>';
      html += '  <div class="charmap-block__chars" style="font-family:\'Poppins\',system-ui,sans-serif">';
      html += '    AaBbCcDdEeFfGgHhIiJjKkLlMmNnOoPpQqRrSsTtUuVvWwXxYyZz<br>';
      html += '    0123456789 !@#$%&amp;*()&ndash;&mdash;&lsquo;&rsquo;&ldquo;&rdquo;';
      html += '  </div>';
      html += '</div>';

      /* Type ramp */
      html += '<div class="ramp-section">';
      html += '<div class="section-label">Type Ramp — Poppins Display Scale</div>';
      
      const displayRamp = [
        { role: 'Hero', size: '96px', weight: 800, lh: '0.95', font: 'display' },
        { role: 'Page Title', size: '72px', weight: 700, lh: '1.1', font: 'display' },
        { role: 'Section Head', size: '48px', weight: 700, lh: '1.2', font: 'display' },
        { role: 'Subhead', size: '32px', weight: 600, lh: '1.3', font: 'display' },
        { role: 'Card Title', size: '24px', weight: 600, lh: '1.3', font: 'display' },
      ];

      displayRamp.forEach((entry, i) => {
        html += rampRow(entry, i, 'display');
      });

      html += '</div>';

      /* Body ramp */
      html += '<div class="ramp-section">';
      html += '<div class="section-label">Type Ramp — Montserrat Body Scale</div>';
      
      const bodyRamp = [
        { role: 'Intro Text', size: '22px', weight: 400, lh: '1.55', font: 'body' },
        { role: 'Body Copy', size: '18px', weight: 400, lh: '1.6', font: 'body' },
        { role: 'Small Body', size: '16px', weight: 400, lh: '1.6', font: 'body' },
        { role: 'Caption', size: '14px', weight: 400, lh: '1.5', font: 'body' },
      ];

      bodyRamp.forEach((entry, i) => {
        html += rampRow(entry, i, 'body');
      });

      html += '</div>';

      /* Mono ramp */
      html += '<div class="ramp-section">';
      html += '<div class="section-label">Type Ramp — JetBrains Mono Technical Scale</div>';
      
      const monoRamp = [
        { role: 'Code Block', size: '16px', weight: 400, lh: '1.6', font: 'mono' },
        { role: 'Inline Code', size: '14px', weight: 500, lh: '1.5', font: 'mono' },
        { role: 'Label', size: '12px', weight: 600, lh: '1.5', font: 'mono' },
      ];

      monoRamp.forEach((entry, i) => {
        html += rampRow(entry, i, 'mono');
      });

      html += '</div>';

      /* Drop cap demo */
      html += '<div class="dropcap-demo">';
      html += '<div class="dropcap-demo__label">Drop Cap — Five-Line Poppins 800, Signal Blue</div>';
      html += '<div class="dropcap-container">';
      const firstChar = DROPCAP_TEXT.charAt(0);
      const restText = DROPCAP_TEXT.substring(1);
      html += '<p class="dropcap-para">';
      html += '<span class="dropcap">' + esc(firstChar) + '</span>';
      html += esc(restText);
      html += '</p>';
      html += '</div>';
      html += '</div>';

      app.innerHTML = html;
    }

    function rampRow(entry, idx, category) {
      const role = entry.role || 'Role ' + (idx + 1);
      const size = entry.size || '16px';
      const weight = entry.weight || 400;
      const lh = entry.lineHeight || entry.lh || '1.5';
      const ls = entry.letterSpacing || '0';

      let fontFamily = 'var(--font-body)';
      let fontName = 'Montserrat';
      if (entry.font === 'display') {
        fontFamily = 'var(--font-display)';
        fontName = 'Poppins';
      } else if (entry.font === 'mono') {
        fontFamily = 'var(--font-mono)';
        fontName = 'JetBrains Mono';
      }

      const sizeNum = parseFloat(size);
      const sampleIdx = idx % EDITORIAL_SAMPLES.length;
      let sample = EDITORIAL_SAMPLES[sampleIdx];

      /* Truncate very large samples */
      if (sizeNum >= 72) {
        sample = sample.split('.')[0].slice(0, 40);
        if (!sample.endsWith('.')) sample += '.';
      }

      let fontStyle = 'font-size:' + size + ';font-weight:' + weight + ';line-height:' + lh + ';';
      fontStyle += 'font-family:' + fontFamily + ';';
      if (ls && ls !== '0' && ls !== 'normal') fontStyle += 'letter-spacing:' + ls + ';';

      let meta = esc(size) + ' / ' + esc(String(weight));
      meta += '\n' + fontName;
      meta += '\nline-height: ' + esc(String(lh));
      if (ls && ls !== '0' && ls !== 'normal') meta += '\nletter-spacing: ' + esc(ls);

      return '' +
        '<div class="ramp-row">' +
        '  <div class="ramp-meta">' +
        '    <div class="ramp-meta__role">' + esc(role) + '</div>' +
        '    <pre class="ramp-meta__detail">' + meta + '</pre>' +
        '  </div>' +
        '  <div class="ramp-sample" style="' + fontStyle + '">' + esc(sample) + '</div>' +
        '</div>';
    }

    function esc(s) {
      const d = document.createElement('div');
      d.textContent = String(s);
      return d.innerHTML;
    }
  </script>
</body>
</html>
