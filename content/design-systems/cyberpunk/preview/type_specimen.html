<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Type Specimen — Cyberpunk</title>
  <link rel="stylesheet" href="../colors_and_type.css">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: var(--font-body, 'system-ui', sans-serif);
      background: linear-gradient(135deg, #0a0e27 0%, #1a1f3a 100%);
      color: #e0f0ff;
      line-height: 1.6;
      position: relative;
      overflow-x: hidden;
    }

    body::before {
      content: '';
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-image: 
        repeating-linear-gradient(
          0deg,
          rgba(0, 255, 150, 0.03) 0px,
          rgba(0, 255, 150, 0.03) 1px,
          transparent 1px,
          transparent 2px
        );
      pointer-events: none;
      z-index: 1;
    }

    .page {
      max-width: 1200px;
      margin: 0 auto;
      padding: 120px 48px;
      position: relative;
      z-index: 2;
    }

    @media (max-width: 768px) {
      .page {
        padding: 80px 32px;
      }
    }

    @media (max-width: 480px) {
      .page {
        padding: 64px 24px;
      }
    }

    /* ── Header ── */
    .header {
      margin-bottom: 120px;
      position: relative;
    }

    .header::after {
      content: '';
      position: absolute;
      bottom: -48px;
      left: 0;
      width: 120px;
      height: 2px;
      background: linear-gradient(90deg, #00ff96, rgba(0, 255, 150, 0));
      box-shadow: 0 0 12px rgba(0, 255, 150, 0.6);
    }

    .header__kicker {
      font-family: var(--font-mono, 'ui-monospace', monospace);
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: #00ff96;
      margin-bottom: 20px;
      text-shadow: 0 0 8px rgba(0, 255, 150, 0.4);
    }

    .header__title {
      font-family: var(--font-display, 'system-ui', sans-serif);
      font-size: 72px;
      font-weight: 700;
      line-height: 1.1;
      letter-spacing: -0.02em;
      text-transform: uppercase;
      color: #00ff96;
      margin-bottom: 24px;
      text-shadow: 0 0 20px rgba(0, 255, 150, 0.5), 0 0 40px rgba(0, 255, 150, 0.25);
      font-kerning: auto;
      word-spacing: -0.08em;
    }

    .header__subtitle {
      font-family: var(--font-body, 'system-ui', sans-serif);
      font-size: 18px;
      font-weight: 400;
      line-height: 1.6;
      color: #b0d0ff;
      max-width: 720px;
      margin-bottom: 32px;
      opacity: 0.95;
    }

    /* ── Font Families ── */
    .font-families {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 32px;
      margin-bottom: 120px;
      margin-top: 80px;
    }

    .font-card {
      background: rgba(15, 25, 55, 0.5);
      border: 1px solid rgba(0, 255, 150, 0.3);
      border-radius: 2px;
      padding: 32px;
      box-shadow: 
        inset 0 0 12px rgba(0, 255, 150, 0.08),
        0 0 20px rgba(0, 255, 150, 0.15);
      position: relative;
    }

    .font-card::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background-image: 
        repeating-linear-gradient(
          90deg,
          transparent,
          transparent 2px,
          rgba(0, 255, 150, 0.02) 2px,
          rgba(0, 255, 150, 0.02) 4px
        );
      pointer-events: none;
      border-radius: 2px;
    }

    .font-card__label {
      font-family: var(--font-mono, 'ui-monospace', monospace);
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: #00ff96;
      margin-bottom: 12px;
      text-shadow: 0 0 6px rgba(0, 255, 150, 0.3);
    }

    .font-card__name {
      font-family: var(--font-display, 'system-ui', sans-serif);
      font-size: 32px;
      font-weight: 700;
      line-height: 1.1;
      color: #e0f0ff;
      margin-bottom: 8px;
      text-transform: uppercase;
      letter-spacing: -0.01em;
    }

    .font-card__fallback {
      font-family: var(--font-mono, 'ui-monospace', monospace);
      font-size: 11px;
      color: #7fa0d0;
      word-break: break-word;
      opacity: 0.8;
    }

    /* ── Character Set ── */
    .charmap-block {
      background: rgba(15, 25, 55, 0.4);
      border: 1px solid rgba(0, 255, 150, 0.25);
      border-radius: 2px;
      padding: 48px;
      margin-bottom: 120px;
      box-shadow: inset 0 0 12px rgba(0, 255, 150, 0.06);
      position: relative;
    }

    .charmap-block__label {
      font-family: var(--font-mono, 'ui-monospace', monospace);
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: #00ff96;
      margin-bottom: 28px;
      padding-bottom: 16px;
      border-bottom: 1px solid rgba(0, 255, 150, 0.2);
      text-shadow: 0 0 6px rgba(0, 255, 150, 0.3);
    }

    .charmap-block__chars {
      font-family: var(--font-display, 'system-ui', sans-serif);
      font-size: 28px;
      font-weight: 700;
      line-height: 1.8;
      letter-spacing: 0.04em;
      color: #e0f0ff;
      word-break: break-word;
      text-transform: uppercase;
    }

    /* ── Section Label ── */
    .section-label {
      font-family: var(--font-mono, 'ui-monospace', monospace);
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: #00ff96;
      margin-bottom: 40px;
      padding-bottom: 16px;
      border-bottom: 1px solid rgba(0, 255, 150, 0.25);
      text-shadow: 0 0 6px rgba(0, 255, 150, 0.3);
    }

    /* ── Ramp Row ── */
    .ramp-row {
      display: grid;
      grid-template-columns: 280px 1fr;
      gap: 48px;
      align-items: baseline;
      padding: 40px 0;
      border-bottom: 1px solid rgba(0, 255, 150, 0.15);
    }

    .ramp-row:last-child {
      border-bottom: none;
    }

    @media (max-width: 900px) {
      .ramp-row {
        grid-template-columns: 1fr;
        gap: 20px;
      }
    }

    /* ── Ramp Meta ── */
    .ramp-meta__role {
      font-family: var(--font-display, 'system-ui', sans-serif);
      font-size: 18px;
      font-weight: 700;
      color: #00ff96;
      margin-bottom: 12px;
      text-transform: uppercase;
      text-shadow: 0 0 8px rgba(0, 255, 150, 0.3);
      letter-spacing: -0.01em;
    }

    .ramp-meta__detail {
      font-family: var(--font-mono, 'ui-monospace', monospace);
      font-size: 10px;
      font-weight: 400;
      line-height: 1.8;
      color: #7fa0d0;
      letter-spacing: 0.02em;
      white-space: pre-wrap;
      word-break: break-word;
    }

    /* ── Ramp Sample ── */
    .ramp-sample {
      color: #e0f0ff;
      overflow-wrap: break-word;
      word-spacing: -0.05em;
      text-transform: uppercase;
    }

    .ramp-section {
      margin-bottom: 120px;
    }

    /* ── Drop Cap Demo ── */
    .dropcap-demo {
      margin-bottom: 120px;
    }

    .dropcap-demo__label {
      font-family: var(--font-mono, 'ui-monospace', monospace);
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: #00ff96;
      margin-bottom: 32px;
      padding-bottom: 16px;
      border-bottom: 1px solid rgba(0, 255, 150, 0.25);
      text-shadow: 0 0 6px rgba(0, 255, 150, 0.3);
    }

    .dropcap-container {
      background: rgba(15, 25, 55, 0.4);
      border: 1px solid rgba(0, 255, 150, 0.25);
      border-radius: 2px;
      padding: 48px;
      max-width: 720px;
      box-shadow: inset 0 0 12px rgba(0, 255, 150, 0.06);
      position: relative;
    }

    .dropcap-container::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background-image: 
        repeating-linear-gradient(
          0deg,
          rgba(0, 255, 150, 0.02) 0px,
          rgba(0, 255, 150, 0.02) 1px,
          transparent 1px,
          transparent 2px
        );
      pointer-events: none;
      border-radius: 2px;
    }

    .dropcap-para {
      font-family: var(--font-body, 'system-ui', sans-serif);
      font-size: 16px;
      font-weight: 400;
      line-height: 1.7;
      color: #e0f0ff;
      margin: 0;
      text-align: left;
      position: relative;
      z-index: 1;
    }

    .dropcap {
      float: left;
      font-family: var(--font-display, 'system-ui', sans-serif);
      font-size: 96px;
      font-weight: 700;
      line-height: 0.9;
      color: #ff00ff;
      margin-right: 12px;
      margin-top: -4px;
      text-shadow: 0 0 16px rgba(255, 0, 255, 0.6), 0 0 32px rgba(255, 0, 255, 0.3);
      text-transform: uppercase;
    }

    /* ── Loading ── */
    .loading {
      text-align: center;
      padding: 240px 48px;
      color: #7fa0d0;
      font-family: var(--font-body, 'system-ui', sans-serif);
      font-size: 16px;
    }

    .loading::after {
      content: '';
      display: block;
      width: 32px;
      height: 32px;
      margin: 32px auto 0;
      border: 2px solid rgba(0, 255, 150, 0.3);
      border-top-color: #00ff96;
      border-radius: 50%;
      animation: spin 1s linear infinite;
      box-shadow: 0 0 12px rgba(0, 255, 150, 0.4);
    }

    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div class="page" id="app">
    <div class="loading">Initializing system interface&hellip;</div>
  </div>

  <script>
    const CYBERPUNK_SAMPLES = [
      'Neural interface connected. Awaiting command sequence.',
      'Data stream: 847 exabytes flowing through darknet corridor.',
      'Corporate firewall breached. Extraction protocol initiated.',
      'Synthetic consciousness detected. Recommend quarantine.',
      'Braindance recording active. Sensory bleed at critical levels.',
      'Holographic advertisement flickering. Signal loss imminent.',
      'Augmented reality overlay malfunction. Visual bleeding detected.',
      'Megacorp terminal logging unauthorized access attempt.',
      'Thermoptic camouflage offline. System rebooting in cascade.',
      'Liquid crystal display reaching critical temperature threshold.',
      'Neon rain cascading across the viewport. Atmospheric humidity rising.',
      'Cyberdeck fully operational. Ready for next deployment mission.',
    ];

    const DROPCAP_TEXT = 'Cybernetic warfare demands typography that screams through the gloom. Space Mono cuts like military-grade stencil paint, sharp and unforgiving. Space Grotesk carries data payloads through endless scrolling feeds. Every letterform is a command, every pixel a signal. No soft serifs. No warm curves. Only geometry, weight, and relentless contrast. Headings burn in neon green, bleeding halos into the black surrounding them. Body text floats in pale cyan, readable but never comfortable. This is a terminal, not a gallery. Information is the product. The interface is merely the weapon.';

    fetch('../tokens.json')
      .then(r => {
        if (!r.ok) throw new Error('tokens.json not found (' + r.status + ')');
        return r.json();
      })
      .then(render)
      .catch(err => {
        document.getElementById('app').innerHTML =
          '<div class="loading" style="color:#ff00ff">' +
          'SYSTEM FAILURE: ' + err.message + ' ▌' +
          '</div>';
      });

    function render(tokens) {
      const app = document.getElementById('app');
      const title = tokens.meta?.title || 'CYBERPUNK';
      const summary = tokens.meta?.summary || '';

      const ramp = tokens.typography?.ramp || [];

      let html = '';

      /* Header */
      html += '<header class="header">';
      html += '  <div class="header__kicker">▌ Type Specimen ▌</div>';
      html += '  <h1 class="header__title">' + esc(title) + '</h1>';
      html += '  <p class="header__subtitle">' + esc(summary) + '</p>';
      html += '</header>';

      /* Font families */
      const families = [
        { label: 'Display', name: 'Space Mono', fallback: 'Courier New, monospace' },
        { label: 'Body', name: 'Space Grotesk', fallback: 'Inter, system-ui, sans-serif' },
        { label: 'UI / Labels', name: 'Space Grotesk', fallback: 'Inter, system-ui, sans-serif' },
        { label: 'Code / Data', name: 'Space Mono', fallback: 'Courier New, monospace' }
      ];

      html += '<div class="font-families">';
      families.forEach(f => {
        html += '<div class="font-card">';
        html += '  <div class="font-card__label">' + esc(f.label) + '</div>';
        html += '  <div class="font-card__name">' + esc(f.name) + '</div>';
        html += '  <div class="font-card__fallback">' + esc(f.fallback) + '</div>';
        html += '</div>';
      });
      html += '</div>';

      /* Character set */
      html += '<div class="charmap-block">';
      html += '  <div class="charmap-block__label">▌ Character Set ▌</div>';
      html += '  <div class="charmap-block__chars">';
      html += '    ABCDEFGHIJKLMNOPQRSTUVWXYZ<br>';
      html += '    0123456789 !@#$%&amp;*()&ndash;&mdash;&lsquo;&rsquo;&ldquo;&rdquo;<br>';
      html += '    &lt;&gt;:;/?+=[]{}|\\&lt;&gt;';
      html += '  </div>';
      html += '</div>';

      /* Type ramp */
      if (ramp.length) {
        html += '<div class="ramp-section">';
        html += '<div class="section-label">▌ Type Ramp ▌</div>';
        ramp.forEach((entry, i) => {
          html += rampRow(entry, i);
        });
        html += '</div>';
      }

      /* Drop cap demo */
      html += '<div class="dropcap-demo">';
      html += '<div class="dropcap-demo__label">▌ Drop Cap — Magenta Neon Glow ▌</div>';
      html += '<div class="dropcap-container">';
      const firstChar = DROPCAP_TEXT.charAt(0);
      const restText = DROPCAP_TEXT.substring(1);
      html += '<p class="dropcap-para">';
      html += '<span class="dropcap">' + esc(firstChar) + '</span>';
      html += esc(restText);
      html += '</p>';
      html += '</div>';
      html += '</div>';

      app.innerHTML = html;
    }

    function rampRow(entry, idx) {
      const role = entry.role || 'role-' + (idx + 1);
      const size = entry.size || '16px';
      const weight = entry.weight || 400;
      const lh = entry.lineHeight || '1.5';
      const ls = entry.letterSpacing || '0';

      let fontFamily = 'var(--font-body)';
      if (entry.fontKey === 'display') fontFamily = 'var(--font-display)';
      else if (entry.fontKey === 'mono' || entry.fontKey === 'ui') fontFamily = 'var(--font-mono)';

      const sizeNum = parseFloat(size);
      const sampleIdx = idx % CYBERPUNK_SAMPLES.length;
      let sample = CYBERPUNK_SAMPLES[sampleIdx];

      if (sizeNum >= 48) {
        sample = sample.split('.')[0].slice(0, 45);
        if (!sample.endsWith('.')) sample += '.';
      }

      let fontStyle = 'font-size:' + size + ';font-weight:' + weight + ';line-height:' + lh + ';';
      fontStyle += 'font-family:' + fontFamily + ';';
      if (ls && ls !== '0' && ls !== 'normal') fontStyle += 'letter-spacing:' + ls + ';';

      let meta = esc(size) + ' / ' + esc(String(weight));
      meta += '\n' + fontFamilyLabel(entry.fontKey);
      meta += '\nline-height: ' + esc(String(lh));
      if (ls && ls !== '0' && ls !== 'normal') meta += '\nletter-spacing: ' + esc(ls);

      return '' +
        '<div class="ramp-row">' +
        '  <div class="ramp-meta">' +
        '    <div class="ramp-meta__role">▌ ' + esc(role.toUpperCase()) + ' ▌</div>' +
        '    <pre class="ramp-meta__detail">' + meta + '</pre>' +
        '  </div>' +
        '  <div class="ramp-sample" style="' + fontStyle + '">' + esc(sample) + '</div>' +
        '</div>';
    }

    function fontFamilyLabel(key) {
      const map = {
        'display': 'Space Mono',
        'body': 'Space Grotesk',
        'mono': 'Space Mono',
        'ui': 'Space Grotesk'
      };
      return map[key] || 'Unknown';
    }

    function esc(s) {
      const d = document.createElement('div');
      d.textContent = String(s);
      return d.innerHTML;
    }
  </script>
</body>
</html>
