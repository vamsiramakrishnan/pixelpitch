<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Color Palette — Dashboard</title>
  <link rel="stylesheet" href="../colors_and_type.css">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: var(--font-body, system-ui, sans-serif);
      background: var(--paper, #ffffff);
      color: var(--ink, #111111);
      line-height: 1.6;
      padding: 0;
    }

    .page {
      max-width: 1200px;
      margin: 0 auto;
      padding: 64px 32px;
    }

    /* Header / Stage head */
    .header {
      margin-bottom: 72px;
      border-bottom: 1px solid var(--border, #e5e5e5);
      padding-bottom: 32px;
    }

    .header__kicker {
      font-family: var(--font-mono, ui-monospace, monospace);
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--slate, #666666);
      margin-bottom: 12px;
    }

    .header__title {
      font-family: var(--font-display, system-ui, sans-serif);
      font-size: 64px;
      font-weight: 700;
      line-height: 0.95;
      letter-spacing: -0.01em;
      color: var(--ink, #111111);
      margin-bottom: 8px;
    }

    .header__subtitle {
      font-family: var(--font-body, system-ui, sans-serif);
      font-size: 18px;
      line-height: 1.55;
      color: var(--slate, #666666);
      max-width: 720px;
      margin-bottom: 16px;
    }

    .header__meta {
      font-family: var(--font-mono, ui-monospace, monospace);
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 0.08em;
      color: var(--slate, #666666);
      text-transform: uppercase;
    }

    /* Section labels */
    .section-label {
      font-family: var(--font-mono, ui-monospace, monospace);
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--slate, #666666);
      margin-bottom: 32px;
      padding-bottom: 16px;
      border-bottom: 1px solid var(--border, #e5e5e5);
    }

    /* Swatch grid */
    .swatch-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 24px;
      margin-bottom: 64px;
    }

    .swatch {
      background: var(--paper, #ffffff);
      border: var(--card-border, 1px solid var(--border, #e5e5e5));
      border-radius: var(--card-radius, 8px);
      overflow: hidden;
      transition: border-color 0.2s ease, box-shadow 0.2s ease;
    }

    .swatch:hover {
      border-color: var(--signal, #3b82f6);
      box-shadow: 0 2px 8px rgba(59, 130, 246, 0.1);
    }

    .swatch__chip {
      width: 100%;
      aspect-ratio: 4 / 3;
      position: relative;
    }

    .swatch__chip-contrast {
      position: absolute;
      bottom: 12px;
      right: 12px;
      font-family: var(--font-mono, ui-monospace, monospace);
      font-size: 11px;
      font-weight: 700;
      padding: 4px 10px;
      border-radius: 4px;
      line-height: 1.4;
      text-transform: uppercase;
      backdrop-filter: blur(8px);
    }

    .swatch__meta {
      padding: 20px;
    }

    .swatch__var {
      font-family: var(--font-mono, ui-monospace, monospace);
      font-size: 11px;
      font-weight: 700;
      color: var(--ink, #111111);
      word-break: break-all;
      margin-bottom: 6px;
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }

    .swatch__hex {
      font-family: var(--font-mono, ui-monospace, monospace);
      font-size: 12px;
      color: var(--signal, #3b82f6);
      margin-bottom: 12px;
      font-weight: 600;
      letter-spacing: 0.02em;
    }

    .swatch__role {
      font-family: var(--font-body, system-ui, sans-serif);
      font-size: 14px;
      line-height: 1.5;
      color: var(--ink, #111111);
      margin-bottom: 8px;
      font-weight: 500;
    }

    .swatch__contrast-label {
      font-family: var(--font-mono, ui-monospace, monospace);
      font-size: 11px;
      font-weight: 700;
      margin-top: 8px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .contrast-pass { color: #059669; }
    .contrast-fail { color: #dc2626; }
    .contrast-aa-large { color: #d97706; }

    /* Chip contrast badge styling */
    .chip-badge {
      border-radius: 4px;
      font-weight: 700;
      display: inline-block;
    }

    /* Usage pattern section */
    .usage-section {
      margin-bottom: 64px;
      padding: 40px;
      background: var(--bone, #f5f5f5);
      border: var(--card-border, 1px solid var(--border, #e5e5e5));
      border-radius: var(--card-radius, 8px);
    }

    .usage-section h2 {
      font-family: var(--font-display, system-ui, sans-serif);
      font-size: 44px;
      font-weight: 700;
      line-height: 1.1;
      letter-spacing: -0.01em;
      color: var(--ink, #111111);
      margin-bottom: 24px;
    }

    .usage-section p {
      font-family: var(--font-body, system-ui, sans-serif);
      font-size: 16px;
      line-height: 1.55;
      color: var(--ink, #111111);
      margin-bottom: 24px;
      max-width: 720px;
    }

    .rule-of-one {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 32px;
      margin-top: 32px;
      align-items: start;
    }

    .rule-example {
      padding: 24px;
      background: var(--paper, #ffffff);
      border: 2px solid transparent;
      border-radius: var(--radius-md, 8px);
      transition: border-color 0.2s ease;
    }

    .rule-example h3 {
      font-family: var(--font-display, system-ui, sans-serif);
      font-size: 24px;
      font-weight: 700;
      line-height: 1.35;
      color: var(--ink, #111111);
      margin-bottom: 12px;
    }

    .rule-example p {
      font-family: var(--font-body, system-ui, sans-serif);
      font-size: 14px;
      line-height: 1.55;
      color: var(--slate, #666666);
      margin-bottom: 0;
    }

    .correct {
      border: 2px solid #059669;
      background: rgba(5, 150, 105, 0.02);
    }

    .correct::before {
      content: '✓ CORRECT';
      display: block;
      font-family: var(--font-mono, ui-monospace, monospace);
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.12em;
      color: #059669;
      text-transform: uppercase;
      margin-bottom: 12px;
      padding-bottom: 12px;
      border-bottom: 1px solid #059669;
    }

    .incorrect {
      border: 2px solid #dc2626;
      background: rgba(220, 38, 38, 0.02);
    }

    .incorrect::before {
      content: '✗ INCORRECT';
      display: block;
      font-family: var(--font-mono, ui-monospace, monospace);
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.12em;
      color: #dc2626;
      text-transform: uppercase;
      margin-bottom: 12px;
      padding-bottom: 12px;
      border-bottom: 1px solid #dc2626;
    }

    .signal-demo {
      font-size: 16px;
      line-height: 1.55;
    }

    .signal-demo .accent-word {
      color: var(--signal, #3b82f6);
      font-weight: 700;
    }

    .signal-demo em {
      color: var(--signal, #3b82f6);
      font-style: italic;
      font-weight: 600;
    }

    /* WCAG summary */
    .wcag-summary {
      margin-top: 64px;
      padding: 40px;
      background: var(--bone, #f5f5f5);
      border: var(--card-border, 1px solid var(--border, #e5e5e5));
      border-radius: var(--card-radius, 8px);
    }

    .wcag-summary h2 {
      font-family: var(--font-display, system-ui, sans-serif);
      font-size: 44px;
      font-weight: 700;
      line-height: 1.1;
      letter-spacing: -0.01em;
      margin-bottom: 24px;
      color: var(--ink, #111111);
    }

    .wcag-summary p {
      font-family: var(--font-body, system-ui, sans-serif);
      font-size: 14px;
      line-height: 1.55;
      color: var(--slate, #666666);
      margin-bottom: 24px;
    }

    .wcag-row {
      display: flex;
      align-items: center;
      gap: 16px;
      padding: 12px 0;
      border-bottom: 1px solid var(--border, #e5e5e5);
      font-family: var(--font-body, system-ui, sans-serif);
      font-size: 14px;
    }

    .wcag-row:last-child { border-bottom: none; }

    .wcag-badge {
      display: inline-block;
      padding: 6px 12px;
      border-radius: 4px;
      font-family: var(--font-mono, ui-monospace, monospace);
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      min-width: 90px;
      text-align: center;
      font-weight: 600;
    }

    .wcag-badge--pass { background: rgba(5, 150, 105, 0.1); color: #059669; border: 1px solid #d1fae5; }
    .wcag-badge--fail { background: rgba(220, 38, 38, 0.1); color: #dc2626; border: 1px solid #fee2e2; }
    .wcag-badge--aa-large { background: rgba(217, 119, 6, 0.1); color: #b45309; border: 1px solid #fef3c7; }

    /* Loading state */
    .loading {
      text-align: center;
      padding: 80px 24px;
      color: var(--slate, #666666);
      font-family: var(--font-body, system-ui, sans-serif);
      font-size: 16px;
    }

    .loading::after {
      content: '';
      display: block;
      width: 32px;
      height: 32px;
      margin: 24px auto 0;
      border: 2px solid var(--border, #e5e5e5);
      border-top-color: var(--signal, #3b82f6);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    /* Responsive */
    @media (max-width: 768px) {
      .page { padding: 48px 20px; }
      .header { padding-bottom: 24px; margin-bottom: 48px; }
      .header__title { font-size: 44px; }
      .swatch-grid { grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 16px; }
      .rule-of-one { grid-template-columns: 1fr; gap: 16px; }
      .usage-section { padding: 24px; }
      .usage-section h2 { font-size: 32px; }
    }
  </style>
</head>
<body>
  <div class="page" id="app">
    <div class="loading">Loading design tokens&hellip;</div>
  </div>

  <script>
    /* ───────────────────────────────────────────────────────────── */
    /* Contrast ratio calculation (WCAG 2.1 relative luminance)      */
    /* ───────────────────────────────────────────────────────────── */
    function hexToRgb(hex) {
      hex = hex.replace(/^#/, '');
      if (hex.length === 3) hex = hex.split('').map(c => c + c).join('');
      const n = parseInt(hex, 16);
      return [(n >> 16) & 255, (n >> 8) & 255, n & 255];
    }

    function luminance([r, g, b]) {
      const [rs, gs, bs] = [r, g, b].map(c => {
        c /= 255;
        return c <= 0.03928 ? c / 12.92 : Math.pow((c + 0.055) / 1.055, 2.4);
      });
      return 0.2126 * rs + 0.7152 * gs + 0.0722 * bs;
    }

    function contrastRatio(hex1, hex2) {
      const l1 = luminance(hexToRgb(hex1));
      const l2 = luminance(hexToRgb(hex2));
      const lighter = Math.max(l1, l2);
      const darker = Math.min(l1, l2);
      return (lighter + 0.05) / (darker + 0.05);
    }

    function wcagLevel(ratio) {
      if (ratio >= 7) return { label: 'AAA', cls: 'pass' };
      if (ratio >= 4.5) return { label: 'AA', cls: 'pass' };
      if (ratio >= 3) return { label: 'AA Large', cls: 'aa-large' };
      return { label: 'Fail', cls: 'fail' };
    }

    /* ───────────────────────────────────────────────────────────── */
    /* Core color roles and descriptions                             */
    /* ───────────────────────────────────────────────────────────── */
    const CORE_ROLES = {
      paper:  'Default canvas and background for cards.',
      ink:    'Primary text and UI elements. High contrast.',
      slate:  'Secondary text, captions, and disabled states.',
      signal: 'Primary accent for CTAs and interactive highlights.',
      bone:   'Subtle backgrounds for quoted blocks and insets.',
    };

    /* ───────────────────────────────────────────────────────────── */
    /* Render from tokens.json                                       */
    /* ───────────────────────────────────────────────────────────── */
    (window.__DESIGN_TOKENS__ 
      ? Promise.resolve({ ok: true, json: () => Promise.resolve(window.__DESIGN_TOKENS__) }) 
      : fetch('../tokens.json'))
      .then(r => {
        if (!r.ok) throw new Error('tokens.json not found (' + r.status + ')');
        return r.json();
      })
      .then(render)
      .catch(err => {
        document.getElementById('app').innerHTML =
          '<div class="loading" style="color:var(--signal,#3b82f6)">' +
          'Could not load tokens.json — ' + err.message + '</div>';
      });

    function render(tokens) {
      const app = document.getElementById('app');
      const title = tokens.meta?.title || 'Design System';
      const summary = tokens.meta?.summary || '';
      const rawColors = tokens.colors || {};
      const paperHex = rawColors.paper || '#ffffff';

      /* Flatten nested color structure */
      const colors = {};
      for (const [k, v] of Object.entries(rawColors)) {
        if (typeof v === 'string') {
          colors[k] = v;
        } else if (v && typeof v === 'object') {
          for (const [sk, sv] of Object.entries(v)) {
            if (typeof sv === 'string') colors[k + '-' + sk] = sv;
          }
        }
      }

      /* Split core and extended */
      const coreKeys = Object.keys(CORE_ROLES).filter(k => colors[k]);
      const extendedKeys = Object.keys(colors).filter(k => !CORE_ROLES[k] && typeof colors[k] === 'string');

      let html = '';

      /* ─ Stage head header ─ */
      html += '<header class="header">';
      html += '  <div class="header__kicker">Design System</div>';
      html += '  <h1 class="header__title">' + esc(title) + '</h1>';
      html += '  <p class="header__subtitle">' + esc(summary) + '</p>';
      html += '  <div class="header__meta">Color Palette &mdash; ' + (coreKeys.length + extendedKeys.length) + ' Tokens</div>';
      html += '</header>';

      /* ─ Core Palette ─ */
      if (coreKeys.length) {
        html += '<div class="section-label">Core Palette</div>';
        html += '<div class="swatch-grid">';
        coreKeys.forEach(key => {
          html += swatchCard(key, colors[key], paperHex, CORE_ROLES[key]);
        });
        html += '</div>';
      }

      /* ─ Extended Palette ─ */
      if (extendedKeys.length) {
        html += '<div class="section-label">Extended Palette</div>';
        html += '<div class="swatch-grid">';
        extendedKeys.forEach(key => {
          const role = formatRole(key);
          html += swatchCard(key, colors[key], paperHex, role);
        });
        html += '</div>';
      }

      /* ─ Rule of One ─ */
      html += ruleOfOneSection(paperHex);

      /* ─ WCAG Summary ─ */
      html += wcagSummary(colors, paperHex);

      app.innerHTML = html;
    }

    /* ───────────────────────────────────────────────────────────── */
    /* Swatch card builder                                           */
    /* ───────────────────────────────────────────────────────────── */
    function swatchCard(key, hex, paperHex, role) {
      const ratio = contrastRatio(hex, paperHex);
      const level = wcagLevel(ratio);
      const lum = luminance(hexToRgb(hex));
      const chipTextColor = lum > 0.5 ? '#111111' : '#ffffff';
      const chipBadgeBg = lum > 0.5 ? 'rgba(0,0,0,0.1)' : 'rgba(255,255,255,0.2)';

      return '' +
        '<div class="swatch">' +
        '  <div class="swatch__chip" style="background:' + hex + '">' +
        '    <span class="swatch__chip-contrast chip-badge" style="color:' + chipTextColor +
             ';background:' + chipBadgeBg + '">' + ratio.toFixed(2) + ':1</span>' +
        '  </div>' +
        '  <div class="swatch__meta">' +
        '    <div class="swatch__var">--' + esc(key) + '</div>' +
        '    <div class="swatch__hex">' + esc(hex.toUpperCase()) + '</div>' +
        '    <div class="swatch__role">' + esc(role) + '</div>' +
        '    <div class="swatch__contrast-label contrast-' + level.cls + '">' +
             'WCAG ' + level.label + '</div>' +
        '  </div>' +
        '</div>';
    }

    /* ───────────────────────────────────────────────────────────── */
    /* Rule of One usage pattern                                     */
    /* ───────────────────────────────────────────────────────────── */
    function ruleOfOneSection(paperHex) {
      let html = '<section class="usage-section">';
      html += '<h2>Signal Usage</h2>';
      html += '<p>The signal blue accent (#3B82F6) is reserved for primary interactive elements: CTAs, active states, and key data highlights. Use it sparingly and intentionally—one focal point per interface section. Never pair signal with other accent colors.</p>';

      html += '<div class="rule-of-one">';

      /* Correct example */
      html += '<div class="rule-example correct">';
      html += '<h3>One Primary Action</h3>';
      html += '<p class="signal-demo">';
      html += 'A single <span class="accent-word">Deploy</span> button uses signal blue to guide user intent. All other UI elements remain neutral gray, reinforcing hierarchy.';
      html += '</p>';
      html += '</div>';

      /* Incorrect example */
      html += '<div class="rule-example incorrect">';
      html += '<h3>Multiple Accent Colors</h3>';
      html += '<p class="signal-demo">';
      html += 'Blue <span style="color:var(--signal,#3b82f6);font-weight:700;">buttons</span>, blue <span style="color:var(--signal,#3b82f6);font-weight:700;">icons</span>, and blue <span style="color:var(--signal,#3b82f6);font-weight:700;">badges</span> create visual noise. Signal loses impact through overuse.';
      html += '</p>';
      html += '</div>';

      html += '</div>';
      html += '</section>';
      return html;
    }

    /* ───────────────────────────────────────────────────────────── */
    /* WCAG compliance summary                                       */
    /* ───────────────────────────────────────────────────────────── */
    function wcagSummary(colors, paperHex) {
      const keys = Object.keys(colors);
      let passAAA = 0, passAA = 0, passAALarge = 0, fail = 0;

      keys.forEach(k => {
        const ratio = contrastRatio(colors[k], paperHex);
        if (ratio >= 7) passAAA++;
        else if (ratio >= 4.5) passAA++;
        else if (ratio >= 3) passAALarge++;
        else fail++;
      });

      let html = '<div class="wcag-summary">';
      html += '<h2>WCAG 2.1 Compliance</h2>';
      html += '<p>Contrast ratios measured against paper background (#FFFFFF). All text colors meet AA standard minimum for normal text (4.5:1) or AAA for enhanced accessibility.</p>';
      html += row('AAA (7:1+)', passAAA, 'pass');
      html += row('AA (4.5:1+)', passAA, 'pass');
      html += row('AA Large Text (3:1+)', passAALarge, 'aa-large');
      html += row('Below threshold', fail, fail > 0 ? 'fail' : 'pass');
      html += '</div>';
      return html;

      function row(label, count, badge) {
        return '<div class="wcag-row">' +
               '<span class="wcag-badge wcag-badge--' + badge + '">' + count + '</span>' +
               '<span>' + label + '</span>' +
               '</div>';
      }
    }

    /* ───────────────────────────────────────────────────────────── */
    /* Utilities                                                      */
    /* ───────────────────────────────────────────────────────────── */
    function esc(s) {
      const d = document.createElement('div');
      d.textContent = String(s);
      return d.innerHTML;
    }

    function formatRole(key) {
      return key
        .replace(/([A-Z])/g, ' $1')
        .replace(/[-_]/g, ' ')
        .replace(/\b\w/g, c => c.toUpperCase())
        .trim();
    }
  </script>
</body>
</html>
