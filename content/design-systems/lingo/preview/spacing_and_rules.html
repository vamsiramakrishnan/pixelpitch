<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Spacing &amp; Rules — Lingo</title>
  <link rel="stylesheet" href="../colors_and_type.css">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: var(--font-body, 'system-ui, sans-serif');
      background: var(--paper, #ffffff);
      color: var(--ink, #111111);
      line-height: 1.6;
    }

    .page {
      max-width: 1100px;
      margin: 0 auto;
      padding: 96px 64px;
    }

    /* Header / Stage head */
    .header {
      margin-bottom: 96px;
      position: relative;
    }

    .header__kicker {
      font-family: var(--font-mono, 'ui-monospace, monospace');
      font-size: 14px;
      font-weight: 500;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--slate, #666666);
      margin-bottom: 12px;
    }

    .header__title {
      font-family: var(--font-display, 'system-ui, sans-serif');
      font-size: 72px;
      font-weight: 700;
      line-height: 0.95;
      letter-spacing: -0.02em;
      color: var(--ink, #111111);
      margin-bottom: 8px;
      max-width: 90%;
    }

    .header__subtitle {
      font-family: var(--font-body, 'system-ui, sans-serif');
      font-size: 22px;
      font-weight: 400;
      line-height: 1.55;
      color: var(--slate, #666666);
      max-width: 70%;
      margin-bottom: 32px;
    }

    .header__rule {
      display: block;
      width: 96px;
      height: 4px;
      background: var(--signal, #3b82f6);
      border: none;
      border-radius: var(--radius-full);
      margin-top: 24px;
    }

    /* Section */
    .section {
      margin-bottom: 96px;
    }

    .section__label {
      font-family: var(--font-mono, 'ui-monospace, monospace');
      font-size: 14px;
      font-weight: 500;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--slate, #666666);
      margin-bottom: 48px;
      padding-bottom: 16px;
      border-bottom: 2px solid var(--signal, #3b82f6);
    }

    /* Spacing scale */
    .spacing-row {
      display: grid;
      grid-template-columns: 120px 1fr 100px;
      gap: 24px;
      align-items: center;
      padding: 24px 0;
      border-bottom: 1px solid var(--border, #e5e5e5);
    }

    .spacing-row:last-child {
      border-bottom: none;
    }

    .spacing-row__name {
      font-family: var(--font-mono, 'ui-monospace, monospace');
      font-size: 14px;
      font-weight: 600;
      color: var(--ink, #111111);
    }

    .spacing-row__label {
      font-family: var(--font-body, 'system-ui, sans-serif');
      font-size: 13px;
      color: var(--slate, #666666);
      margin-top: 4px;
    }

    .spacing-row__bar-wrap {
      height: 32px;
      display: flex;
      align-items: center;
    }

    .spacing-row__bar {
      height: 6px;
      background: var(--signal, #3b82f6);
      border-radius: var(--radius-full);
      min-width: 6px;
      transition: opacity 0.2s ease;
    }

    .spacing-row:hover .spacing-row__bar {
      opacity: 0.7;
    }

    .spacing-row__value {
      font-family: var(--font-mono, 'ui-monospace, monospace');
      font-size: 14px;
      font-weight: 600;
      color: var(--ink, #111111);
      text-align: right;
    }

    /* Rule weights */
    .rule-demo {
      padding: 32px 0;
      border-bottom: 1px solid var(--border, #e5e5e5);
    }

    .rule-demo:last-child {
      border-bottom: none;
    }

    .rule-demo__header {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      margin-bottom: 16px;
    }

    .rule-demo__name {
      font-family: var(--font-mono, 'ui-monospace, monospace');
      font-size: 14px;
      font-weight: 600;
      color: var(--ink, #111111);
    }

    .rule-demo__label {
      font-family: var(--font-body, 'system-ui, sans-serif');
      font-size: 13px;
      color: var(--slate, #666666);
    }

    .rule-demo__spec {
      font-family: var(--font-mono, 'ui-monospace, monospace');
      font-size: 13px;
      color: var(--slate, #666666);
    }

    .rule-demo__container {
      width: 100%;
      height: 48px;
      display: flex;
      align-items: center;
      padding: 0;
    }

    .rule-demo__line {
      width: 100%;
      border: none;
      border-radius: 0;
      margin: 0;
    }

    /* Border radius */
    .radius-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 64px;
      margin-bottom: 48px;
    }

    .radius-item {
      display: grid;
      grid-template-columns: 160px 1fr;
      gap: 32px;
      align-items: center;
    }

    .radius-item__demo {
      display: flex;
      gap: 16px;
      align-items: center;
    }

    .radius-item__box {
      width: 120px;
      height: 120px;
      background: var(--bone, #f5f5f5);
      border: 3px solid var(--signal, #3b82f6);
      flex-shrink: 0;
    }

    .radius-item__info {
      flex: 1;
    }

    .radius-item__name {
      font-family: var(--font-mono, 'ui-monospace, monospace');
      font-size: 14px;
      font-weight: 600;
      color: var(--ink, #111111);
      margin-bottom: 4px;
    }

    .radius-item__value {
      font-family: var(--font-mono, 'ui-monospace, monospace');
      font-size: 13px;
      color: var(--slate, #666666);
      margin-bottom: 12px;
    }

    .radius-item__description {
      font-family: var(--font-body, 'system-ui, sans-serif');
      font-size: 13px;
      line-height: 1.55;
      color: var(--slate, #666666);
    }

    /* Philosophy block */
    .philosophy {
      background: var(--bone, #f5f5f5);
      padding: 48px;
      border: 2px solid var(--signal, #3b82f6);
      border-radius: var(--radius-lg);
      margin-bottom: 64px;
    }

    .philosophy__title {
      font-family: var(--font-mono, 'ui-monospace, monospace');
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--signal, #3b82f6);
      margin-bottom: 16px;
    }

    .philosophy__text {
      font-family: var(--font-body, 'system-ui, sans-serif');
      font-size: 18px;
      line-height: 1.55;
      color: var(--ink, #111111);
    }

    .philosophy__text strong {
      font-weight: 700;
    }

    .philosophy__text em {
      font-style: italic;
    }

    .philosophy__text code {
      font-family: var(--font-mono, 'ui-monospace, monospace');
      background: rgba(17, 17, 17, 0.08);
      padding: 2px 6px;
      font-size: 0.95em;
      border-radius: var(--radius-sm);
    }

    /* Depth demo */
    .depth-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 32px;
      margin-bottom: 48px;
    }

    .depth-item {
      display: flex;
      flex-direction: column;
    }

    .depth-item__demo {
      width: 100%;
      height: 140px;
      border-radius: var(--radius-md);
      margin-bottom: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .depth-item__demo--flat {
      background: var(--paper);
      border: 2px dashed var(--border);
    }

    .depth-item__demo--border {
      background: var(--paper);
      border: 1px solid var(--border);
    }

    .depth-item__demo--elevated {
      background: var(--paper);
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
    }

    .depth-item__name {
      font-family: var(--font-mono, 'ui-monospace, monospace');
      font-size: 14px;
      font-weight: 600;
      color: var(--ink, #111111);
      margin-bottom: 4px;
    }

    .depth-item__label {
      font-family: var(--font-body, 'system-ui, sans-serif');
      font-size: 13px;
      color: var(--slate, #666666);
      line-height: 1.55;
    }

    /* Loading */
    .loading {
      text-align: center;
      padding: 80px 24px;
      color: var(--slate, #666666);
      font-size: 16px;
    }

    .loading::after {
      content: '';
      display: block;
      width: 32px;
      height: 32px;
      margin: 16px auto 0;
      border: 3px solid rgba(59, 130, 246, 0.2);
      border-top-color: var(--signal, #3b82f6);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    @media (max-width: 900px) {
      .page {
        padding: 64px 32px;
      }

      .header {
        margin-bottom: 64px;
      }

      .header__title {
        font-size: 54px;
      }

      .section {
        margin-bottom: 64px;
      }

      .spacing-row {
        grid-template-columns: 100px 1fr 80px;
        gap: 16px;
      }

      .radius-grid {
        grid-template-columns: 1fr;
        gap: 32px;
      }

      .radius-item {
        grid-template-columns: 120px 1fr;
      }

      .depth-grid {
        grid-template-columns: 1fr;
        gap: 24px;
      }
    }
  </style>
</head>
<body>
  <div class="page" id="app">
    <div class="loading">Loading design tokens…</div>
  </div>

  <script>
    const DEFAULT_SPACING = {
      's-1': { value: '4px', label: 'xs' },
      's-2': { value: '8px', label: 'sm' },
      's-3': { value: '16px', label: 'md' },
      's-4': { value: '24px', label: 'lg' },
      's-5': { value: '32px', label: 'xl' },
      's-6': { value: '48px', label: '2xl' },
      's-7': { value: '64px', label: '3xl' },
      's-8': { value: '96px', label: '4xl' }
    };

    const DEFAULT_RULES = {
      'flat': { name: 'Flat', treatment: 'none', use: 'Canvas, body, default state' },
      'border': { name: 'Border', treatment: '1px solid var(--border)', use: 'Card containers, form fields, subtle separation' },
      'elevated': { name: 'Elevated', treatment: '0 2px 8px rgba(0,0,0,0.08)', use: 'Modals, dropdowns, floating actions' }
    };

    const DEFAULT_RADIUS = {
      'none': { value: '0', use: 'Avoid—use for rare layout-critical elements.' },
      'sm': { value: '4px', use: 'Input fields, small UI elements.' },
      'md': { value: '8px', use: 'Default for buttons, cards, and most components.' },
      'lg': { value: '16px', use: 'Large containers, prominent cards.' },
      'full': { value: '999px', use: 'Pills, avatars, and circular shapes.' }
    };

    ( window.__DESIGN_TOKENS__ ? Promise.resolve({ ok: true, json: () => Promise.resolve(window.__DESIGN_TOKENS__) }) : fetch('../tokens.json') )
      .then(r => {
        if (!r.ok) throw new Error('tokens.json not found (' + r.status + ')');
        return r.json();
      })
      .then(render)
      .catch(err => {
        document.getElementById('app').innerHTML =
          '<div class="loading" style="color:#dc2626">' +
          'Could not load tokens.json — ' + err.message + '</div>';
      });

    function render(tokens) {
      const app = document.getElementById('app');

      const spacing = {};
      if (tokens.spacing?.scale) {
        Object.entries(tokens.spacing.scale).forEach(([k, v]) => {
          spacing[k] = { value: v, label: k };
        });
      } else {
        Object.assign(spacing, DEFAULT_SPACING);
      }

      const rules = DEFAULT_RULES;
      const radius = DEFAULT_RADIUS;

      let html = '';

      /* Header / Stage head */
      html += '<header class="header">';
      html += '  <div class="header__kicker">Spacing &amp; Rules</div>';
      html += '  <h1 class="header__title">Playful<br>Precision.</h1>';
      html += '  <p class="header__subtitle">The spacing and depth system for Lingo — a bright, friendly scale that keeps interfaces approachable while maintaining clear visual hierarchy.</p>';
      html += '  <hr class="header__rule">';
      html += '</header>';

      /* Philosophy block */
      html += '<div class="philosophy">';
      html += '  <div class="philosophy__title">Design Philosophy</div>';
      html += '  <div class="philosophy__text">';
      html += '    Lingo uses <strong>rounded corners and friendly borders</strong> to create an approachable, playful feel. The spacing scale emphasizes <strong>clarity and breathing room</strong>, never cramped. Depth is earned through <strong>subtle shadows and smart borders</strong>, not aggressive effects. Every pixel serves the goal of making interfaces feel like trustworthy friends, not corporate machines. <em>Playful, but never distracting.</em>';
      html += '  </div>';
      html += '</div>';

      /* Spacing scale */
      html += '<div class="section">';
      html += '  <div class="section__label">Spacing Scale</div>';

      const spacingEntries = Object.entries(spacing);
      const maxPx = Math.max(...spacingEntries.map(([, o]) => parseFloat(o.value) || 0), 1);

      spacingEntries.forEach(([key, obj]) => {
        const px = parseFloat(obj.value) || 0;
        const pct = Math.max((px / maxPx) * 100, 3);
        const label = obj.label || key;

        html += '<div class="spacing-row">';
        html += '  <div>';
        html += '    <div class="spacing-row__name">' + esc(key) + '</div>';
        html += '    <div class="spacing-row__label">' + esc(label) + '</div>';
        html += '  </div>';
        html += '  <div class="spacing-row__bar-wrap">';
        html += '    <div class="spacing-row__bar" style="width:' + pct + '%"></div>';
        html += '  </div>';
        html += '  <div class="spacing-row__value">' + esc(obj.value) + '</div>';
        html += '</div>';
      });

      html += '</div>';

      /* Depth levels */
      html += '<div class="section">';
      html += '  <div class="section__label">Depth Levels</div>';

      html += '<div class="depth-grid">';

      html += '<div class="depth-item">';
      html += '  <div class="depth-item__demo depth-item__demo--flat"></div>';
      html += '  <div class="depth-item__name">Flat</div>';
      html += '  <div class="depth-item__label">Canvas, body, default state</div>';
      html += '</div>';

      html += '<div class="depth-item">';
      html += '  <div class="depth-item__demo depth-item__demo--border"></div>';
      html += '  <div class="depth-item__name">Border</div>';
      html += '  <div class="depth-item__label">Card containers, form fields, subtle separation</div>';
      html += '</div>';

      html += '<div class="depth-item">';
      html += '  <div class="depth-item__demo depth-item__demo--elevated"></div>';
      html += '  <div class="depth-item__name">Elevated</div>';
      html += '  <div class="depth-item__label">Modals, dropdowns, floating actions</div>';
      html += '</div>';

      html += '</div>';

      html += '</div>';

      /* Border radius */
      html += '<div class="section">';
      html += '  <div class="section__label">Border Radius</div>';
      html += '  <p style="font-family: var(--font-body); font-size: 18px; color: var(--slate); line-height: 1.55; margin-bottom: 48px;">Lingo embraces <strong>rounded corners</strong> to create a friendly, approachable feel. Use radius intentionally to signal interactivity and warmth.</p>';

      Object.entries(radius).forEach(([key, obj]) => {
        const radiusValue = obj.value;

        html += '<div class="radius-item">';
        html += '  <div class="radius-item__demo">';
        html += '    <div class="radius-item__box" style="border-radius: ' + esc(radiusValue) + '"></div>';
        html += '  </div>';
        html += '  <div class="radius-item__info">';
        html += '    <div class="radius-item__name">--radius-' + esc(key) + '</div>';
        html += '    <div class="radius-item__value">' + esc(radiusValue) + '</div>';
        html += '    <div class="radius-item__description">' + esc(obj.use) + '</div>';
        html += '  </div>';
        html += '</div>';
      });

      html += '</div>';

      /* Whitespace philosophy */
      html += '<div class="philosophy">';
      html += '  <div class="philosophy__title">Whitespace Strategy</div>';
      html += '  <div class="philosophy__text">';
      html += '    <strong>Clarity first</strong>: Every block of content should feel distinct and breathable, never crammed. <strong>Rhythm and pacing</strong>: Use the spacing scale consistently to create predictable, musical layouts. <strong>Tactile borders</strong>: A 1px border in friendly colors (signal blue) beats heavy shadows every time. <strong>Friendly density</strong>: Content can be dense, but it must be surrounded by generous whitespace. The space is part of the design, not leftover.';
      html += '  </div>';
      html += '</div>';

      app.innerHTML = html;
    }

    function esc(s) {
      const d = document.createElement('div');
      d.textContent = String(s);
      return d.innerHTML;
    }
  </script>
</body>
</html>
