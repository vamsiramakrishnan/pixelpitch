<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Type Specimen — Composio</title>
  <link rel="stylesheet" href="../colors_and_type.css">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: var(--font-body, system-ui, sans-serif);
      background: var(--paper, #0f0f0f);
      color: var(--ink, #111111);
      line-height: 1.6;
    }

    .page {
      max-width: 1200px;
      margin: 0 auto;
      padding: 80px 48px;
    }

    @media (max-width: 768px) {
      .page {
        padding: 64px 32px;
      }
    }

    /* Header */
    .header {
      margin-bottom: 80px;
    }

    .header__title {
      font-family: var(--font-body, system-ui, sans-serif);
      font-size: 72px;
      font-weight: 400;
      line-height: 0.87;
      letter-spacing: -0.01em;
      color: var(--ink, #111111);
      margin-bottom: 16px;
    }

    .header__subtitle {
      font-size: 18px;
      font-weight: 400;
      line-height: 1.5;
      color: rgba(255, 255, 255, 0.6);
      max-width: 700px;
      margin-bottom: 32px;
    }

    .header__rule {
      display: block;
      width: 80px;
      height: 2px;
      background: var(--signal, #00ffff);
      border: none;
      margin: 0;
      border-radius: 1px;
    }

    /* Font families overview */
    .font-families {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
      gap: 24px;
      margin-bottom: 80px;
    }

    .font-card {
      background: rgba(255, 255, 255, 0.02);
      border: 1px solid rgba(0, 255, 255, 0.1);
      border-radius: 10px;
      padding: 32px 28px;
      backdrop-filter: blur(4px);
    }

    .font-card__label {
      font-family: var(--font-mono, 'JetBrains Mono', monospace);
      font-size: 11px;
      font-weight: 400;
      letter-spacing: 0.7px;
      text-transform: uppercase;
      color: rgba(255, 255, 255, 0.5);
      margin-bottom: 12px;
    }

    .font-card__name {
      font-size: 28px;
      font-weight: 500;
      line-height: 1.2;
      color: var(--ink, #111111);
      margin-bottom: 8px;
      word-break: break-word;
    }

    .font-card__fallback {
      font-family: var(--font-mono, 'JetBrains Mono', monospace);
      font-size: 12px;
      line-height: 1.5;
      color: rgba(255, 255, 255, 0.4);
      word-break: break-all;
    }

    /* Character set block */
    .pangram-block {
      background: rgba(0, 255, 255, 0.03);
      border: 1px solid rgba(0, 255, 255, 0.12);
      border-radius: 10px;
      padding: 48px 40px;
      margin-bottom: 80px;
    }

    .pangram-block__label {
      font-family: var(--font-mono, 'JetBrains Mono', monospace);
      font-size: 11px;
      font-weight: 400;
      letter-spacing: 0.7px;
      text-transform: uppercase;
      color: rgba(255, 255, 255, 0.5);
      margin-bottom: 20px;
    }

    .pangram-block__chars {
      font-size: 32px;
      line-height: 1.6;
      letter-spacing: 0.02em;
      color: rgba(255, 255, 255, 0.9);
      word-break: break-all;
      font-weight: 400;
    }

    /* Section label */
    .section-label {
      font-family: var(--font-mono, 'JetBrains Mono', monospace);
      font-size: 12px;
      font-weight: 400;
      letter-spacing: 0.7px;
      text-transform: uppercase;
      color: rgba(255, 255, 255, 0.5);
      margin-bottom: 32px;
      padding-bottom: 16px;
      border-bottom: 1px solid rgba(0, 255, 255, 0.08);
    }

    /* Ramp section */
    .ramp-section {
      margin-bottom: 80px;
    }

    /* Ramp row */
    .ramp-row {
      display: grid;
      grid-template-columns: 280px 1fr;
      gap: 48px;
      align-items: baseline;
      padding: 32px 0;
      border-bottom: 1px solid rgba(0, 255, 255, 0.06);
    }

    .ramp-row:last-child {
      border-bottom: none;
    }

    @media (max-width: 920px) {
      .ramp-row {
        grid-template-columns: 1fr;
        gap: 16px;
      }
    }

    /* Meta column (left) */
    .ramp-meta__role {
      font-family: var(--font-body, system-ui, sans-serif);
      font-size: 16px;
      font-weight: 500;
      color: var(--ink, #111111);
      margin-bottom: 10px;
    }

    .ramp-meta__detail {
      font-family: var(--font-mono, 'JetBrains Mono', monospace);
      font-size: 11px;
      line-height: 1.7;
      letter-spacing: 0.3px;
      color: rgba(255, 255, 255, 0.45);
      white-space: pre;
      margin: 0;
      padding: 0;
    }

    /* Sample column (right) */
    .ramp-sample {
      color: rgba(255, 255, 255, 0.95);
      overflow-wrap: break-word;
    }

    .ramp-sample--display {
      color: var(--ink, #111111);
    }

    /* Loading state */
    .loading {
      text-align: center;
      padding: 120px 24px;
      color: rgba(255, 255, 255, 0.6);
      font-size: 16px;
    }

    .loading::after {
      content: '';
      display: block;
      width: 32px;
      height: 32px;
      margin: 20px auto 0;
      border: 2px solid rgba(0, 255, 255, 0.2);
      border-top-color: var(--signal, #00ffff);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    /* Drop cap demo */
    .dropcap-demo {
      margin-bottom: 80px;
    }

    .dropcap-demo__label {
      font-family: var(--font-mono, 'JetBrains Mono', monospace);
      font-size: 12px;
      font-weight: 400;
      letter-spacing: 0.7px;
      text-transform: uppercase;
      color: rgba(255, 255, 255, 0.5);
      margin-bottom: 24px;
    }

    .dropcap-demo__text {
      font-size: 18px;
      line-height: 1.7;
      color: rgba(255, 255, 255, 0.8);
      max-width: 680px;
    }

    .dropcap {
      float: left;
      font-size: 72px;
      font-weight: 400;
      line-height: 0.87;
      padding-right: 8px;
      color: var(--signal, #00ffff);
      margin-top: -4px;
    }
  </style>
</head>
<body>
  <div class="page" id="app">
    <div class="loading">Loading design tokens…</div>
  </div>

  <script>
    const EDITORIAL_SAMPLES = [
      'The architecture of modern APIs demands precision at every layer. Composio integrates your tools with surgical accuracy.',
      'Build faster. Ship smarter. Connect anything to everything without friction or compromise.',
      'In the age of integration chaos, one platform emerges to bring order. This is command.',
      'Developer experience is not a feature—it is the foundation. We built Composio on that truth.',
      'Your toolkit is scattered. Your potential is not. Unify your integrations and unlock the developer within.',
      'Code moves fast. Integrations shouldn\'t slow you down. Composio meets you at the speed of development.',
    ];

    ( window.__DESIGN_TOKENS__ ? Promise.resolve({ ok: true, json: () => Promise.resolve(window.__DESIGN_TOKENS__) }) : fetch('../tokens.json') )
      .then(r => {
        if (!r.ok) throw new Error('tokens.json not found (' + r.status + ')');
        return r.json();
      })
      .then(render)
      .catch(err => {
        document.getElementById('app').innerHTML =
          '<div class="loading" style="color:#ff6b6b">' +
          'Could not load tokens.json — ' + err.message + '</div>';
      });

    function render(tokens) {
      const app = document.getElementById('app');
      const title = tokens.meta?.title || tokens.name || 'Design System';

      /* Load Google Fonts if present */
      if (tokens.googleFontsUrl) {
        const link = document.createElement('link');
        link.rel = 'stylesheet';
        link.href = tokens.googleFontsUrl;
        document.head.appendChild(link);
      }

      const ramp = tokens.typography?.ramp || tokens.typeRamp || [];

      let html = '';

      /* Header */
      html += '<header class="header">';
      html += '  <h1 class="header__title">Type Specimen</h1>';
      html += '  <p class="header__subtitle">Composio typographic scale — ' + ramp.length + ' roles across display and monospace families</p>';
      html += '  <hr class="header__rule">';
      html += '</header>';

      /* Font families */
      const fonts = tokens.typography || {};
      const families = [];

      if (fonts.fontDisplay || fonts.fontBody) {
        families.push({
          label: 'Primary Sans',
          name: 'System UI',
          description: fonts.fontDisplay || fonts.fontBody || 'system-ui, sans-serif',
          fallback: 'ui-sans-serif, system-ui, Apple Color Emoji, Segoe UI Emoji, Segoe UI Symbol, Noto Color Emoji'
        });
      }

      if (fonts.fontMono) {
        families.push({
          label: 'Monospace',
          name: 'JetBrains Mono',
          description: fonts.fontMono,
          fallback: 'ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, Liberation Mono, Courier New'
        });
      }

      if (families.length) {
        html += '<div class="font-families">';
        families.forEach(f => {
          html += '<div class="font-card">';
          html += '  <div class="font-card__label">' + esc(f.label) + '</div>';
          html += '  <div class="font-card__name">' + esc(f.name) + '</div>';
          html += '  <div class="font-card__fallback">' + esc(f.fallback) + '</div>';
          html += '</div>';
        });
        html += '</div>';
      }

      /* Character set block */
      html += '<div class="pangram-block">';
      html += '  <div class="pangram-block__label">Character Set</div>';
      html += '  <div class="pangram-block__chars">AaBbCcDdEeFfGgHhIiJjKkLlMmNnOoPpQqRrSsTtUuVvWwXxYyZz<br>0123456789 !@#$%&amp;*()&ndash;&mdash;&lsquo;&rsquo;&ldquo;&rdquo;</div>';
      html += '</div>';

      /* Type ramp */
      if (ramp.length) {
        html += '<div class="ramp-section">';
        html += '<div class="section-label">Type Ramp</div>';
        ramp.forEach((entry, i) => {
          html += rampRow(entry, i, fonts);
        });
        html += '</div>';
      }

      app.innerHTML = html;
    }

    function rampRow(entry, idx, fonts) {
      const role = entry.role || 'Role ' + (idx + 1);
      const size = entry.size || entry.fontSize || '16px';
      const weight = entry.weight || entry.fontWeight || '400';
      const lh = entry.lineHeight || entry.lh || '1.5';
      const ls = entry.letterSpacing || entry.ls || '0';
      const fontKey = entry.fontKey || 'body';

      /* Determine font family */
      let family = '';
      if (fontKey === 'mono') {
        family = 'JetBrains Mono';
      } else if (fontKey === 'display' || fontKey === 'body') {
        family = 'system-ui, sans-serif';
      }

      const sizeNum = parseFloat(size);
      const sampleIdx = idx % EDITORIAL_SAMPLES.length;
      const sample = EDITORIAL_SAMPLES[sampleIdx];

      /* Truncate very large samples */
      const displaySample = sizeNum >= 48
        ? sample.split('.')[0] + '.'
        : sizeNum >= 40
        ? sample.substring(0, 80) + '…'
        : sample;

      let fontStyle = 'font-size:' + size + ';font-weight:' + weight + ';line-height:' + lh + ';';
      if (ls !== '0' && ls !== 'normal') fontStyle += 'letter-spacing:' + ls + ';';
      if (family) fontStyle += 'font-family:\'' + family.split(',')[0] + '\',sans-serif;';

      const isDisplay = sizeNum >= 40;
      const sampleClass = isDisplay ? 'ramp-sample ramp-sample--display' : 'ramp-sample';

      let meta = '';
      meta += esc(size) + ' / weight ' + esc(String(weight));
      if (family) meta += '\n' + family;
      meta += '\nline-height: ' + esc(String(lh));
      if (ls !== '0' && ls !== 'normal') meta += '\nletter-spacing: ' + esc(ls);

      return '' +
        '<div class="ramp-row">' +
        '  <div class="ramp-meta">' +
        '    <div class="ramp-meta__role">' + esc(role) + '</div>' +
        '    <pre class="ramp-meta__detail">' + meta + '</pre>' +
        '  </div>' +
        '  <div class="' + sampleClass + '" style="' + fontStyle + '">' + esc(displaySample) + '</div>' +
        '</div>';
    }

    function esc(s) {
      const d = document.createElement('div');
      d.textContent = String(s);
      return d.innerHTML;
    }
  </script>
</body>
</html>
