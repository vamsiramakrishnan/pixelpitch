<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Color Palette — Composio</title>
  <link rel="stylesheet" href="../colors_and_type.css">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: var(--font-body, system-ui, sans-serif);
      background: var(--paper, #0f0f0f);
      color: var(--ink, #111111);
      line-height: 1.6;
      padding: 0;
    }

    .page {
      max-width: 1200px;
      margin: 0 auto;
      padding: 64px 32px;
    }

    /* ── Header / Stage Head ── */
    .header {
      margin-bottom: 64px;
      position: relative;
      z-index: 2;
    }

    .header__title {
      font-family: var(--font-body, system-ui, sans-serif);
      font-size: 56px;
      font-weight: 400;
      line-height: 0.95;
      letter-spacing: -0.01em;
      color: var(--color-pure-white, #ffffff);
      margin-bottom: 16px;
      max-width: 800px;
    }

    .header__subtitle {
      font-size: 18px;
      color: var(--slate, #666666);
      max-width: 640px;
      line-height: 1.5;
      margin-bottom: 8px;
    }

    .header__meta {
      font-size: 14px;
      color: var(--color-muted-smoke, #7b7b7b);
      text-transform: uppercase;
      letter-spacing: 0.08em;
      margin-top: 20px;
    }

    .header__rule {
      display: block;
      width: 48px;
      height: 2px;
      background: linear-gradient(90deg, var(--signal, #00ffff), transparent);
      border: none;
      margin-top: 28px;
      border-radius: 1px;
    }

    /* ── Section Labels ── */
    .section-label {
      font-family: var(--font-body, system-ui, sans-serif);
      font-size: 13px;
      font-weight: 500;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--color-muted-smoke, #7b7b7b);
      margin-bottom: 28px;
      padding-bottom: 12px;
      border-bottom: 1px solid rgba(255,255,255,0.06);
    }

    /* ── Swatch Grid ── */
    .swatch-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 20px;
      margin-bottom: 56px;
    }

    .swatch {
      background: var(--bone, #000000);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 10px;
      overflow: hidden;
      transition: all 0.3s ease;
      position: relative;
    }

    .swatch:hover {
      border-color: rgba(255,255,255,0.15);
      box-shadow: 0 0 32px rgba(0,255,255,0.1);
    }

    .swatch__chip {
      width: 100%;
      aspect-ratio: 4 / 3;
      position: relative;
      display: flex;
      align-items: flex-end;
      justify-content: flex-end;
      padding: 8px;
    }

    .swatch__chip-contrast {
      font-size: 11px;
      font-weight: 500;
      padding: 4px 10px;
      border-radius: 4px;
      line-height: 1.2;
      background: rgba(0,0,0,0.3);
      color: rgba(255,255,255,0.8);
      backdrop-filter: blur(8px);
    }

    .swatch__meta {
      padding: 16px;
    }

    .swatch__var {
      font-family: var(--font-mono, 'JetBrains Mono', monospace);
      font-size: 12px;
      color: var(--signal, #00ffff);
      word-break: break-all;
      margin-bottom: 6px;
      letter-spacing: -0.32px;
    }

    .swatch__hex {
      font-family: var(--font-mono, 'JetBrains Mono', monospace);
      font-size: 11px;
      color: var(--color-muted-smoke, #7b7b7b);
      margin-bottom: 8px;
      letter-spacing: -0.32px;
    }

    .swatch__role {
      font-size: 13px;
      line-height: 1.4;
      color: rgba(255,255,255,0.6);
      margin-bottom: 8px;
    }

    .swatch__contrast-label {
      font-size: 11px;
      font-weight: 500;
      margin-top: 0;
      letter-spacing: 0.03em;
    }

    .contrast-pass { color: #4ade80; }
    .contrast-fail { color: #ef4444; }
    .contrast-aa-large { color: #facc15; }

    /* ── Demo Section ── */
    .demo-section {
      margin: 64px 0;
      padding: 40px;
      background: var(--bone, #000000);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 10px;
    }

    .demo-section__title {
      font-size: 24px;
      font-weight: 500;
      color: var(--color-pure-white, #ffffff);
      margin-bottom: 24px;
      line-height: 1.2;
    }

    .demo-section__subtitle {
      font-size: 14px;
      color: rgba(255,255,255,0.6);
      margin-bottom: 28px;
    }

    .demo-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 20px;
    }

    .demo-card {
      background: linear-gradient(135deg, rgba(0,255,255,0.08), rgba(0,124,205,0.04));
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 10px;
      padding: 20px;
      text-align: center;
      transition: all 0.2s ease;
    }

    .demo-card:hover {
      border-color: rgba(0,255,255,0.3);
      box-shadow: 0 0 20px rgba(0,255,255,0.15);
    }

    .demo-card__label {
      font-size: 12px;
      color: rgba(255,255,255,0.5);
      text-transform: uppercase;
      letter-spacing: 0.08em;
      margin-bottom: 8px;
    }

    .demo-card__swatch {
      width: 100%;
      height: 80px;
      border-radius: 6px;
      margin-bottom: 12px;
      border: 1px solid rgba(255,255,255,0.1);
    }

    .demo-card__text {
      font-size: 13px;
      color: rgba(255,255,255,0.7);
      line-height: 1.4;
    }

    /* ── WCAG Summary ── */
    .wcag-summary {
      margin-top: 56px;
      padding: 32px;
      background: var(--bone, #000000);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 10px;
    }

    .wcag-summary h2 {
      font-family: var(--font-body, system-ui, sans-serif);
      font-size: 20px;
      font-weight: 500;
      margin-bottom: 12px;
      color: var(--color-pure-white, #ffffff);
      line-height: 1.2;
    }

    .wcag-summary p {
      font-size: 14px;
      color: rgba(255,255,255,0.6);
      margin-bottom: 20px;
      line-height: 1.5;
    }

    .wcag-row {
      display: flex;
      align-items: center;
      gap: 16px;
      padding: 12px 0;
      border-bottom: 1px solid rgba(255,255,255,0.04);
      font-size: 14px;
    }

    .wcag-row:last-child { border-bottom: none; }

    .wcag-badge {
      display: inline-block;
      padding: 4px 12px;
      border-radius: 4px;
      font-size: 10px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      min-width: 60px;
      text-align: center;
    }

    .wcag-badge--pass { background: rgba(74,222,128,0.15); color: #4ade80; }
    .wcag-badge--fail { background: rgba(239,68,68,0.15); color: #ef4444; }
    .wcag-badge--aa-large { background: rgba(250,204,21,0.15); color: #facc15; }

    .wcag-row span:last-child {
      color: rgba(255,255,255,0.7);
    }

    /* ── Loading ── */
    .loading {
      text-align: center;
      padding: 100px 24px;
      color: var(--slate, #666666);
      font-size: 16px;
    }

    .loading::after {
      content: '';
      display: block;
      width: 32px;
      height: 32px;
      margin: 20px auto 0;
      border: 2px solid rgba(255,255,255,0.08);
      border-top-color: var(--signal, #00ffff);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    /* ── Responsive ── */
    @media (max-width: 768px) {
      .page { padding: 40px 20px; }
      .header__title { font-size: 40px; }
      .swatch-grid { grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); }
      .demo-grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <div class="page" id="app">
    <div class="loading">Loading design tokens…</div>
  </div>

  <script>
    /* ─────────────────────────────────────────────────────────────── */
    /* WCAG 2.1 Contrast Ratio Calculation                             */
    /* ─────────────────────────────────────────────────────────────── */
    function hexToRgb(hex) {
      hex = hex.replace(/^#/, '');
      if (hex.length === 3) hex = hex.split('').map(c => c + c).join('');
      const n = parseInt(hex, 16);
      return [(n >> 16) & 255, (n >> 8) & 255, n & 255];
    }

    function luminance([r, g, b]) {
      const [rs, gs, bs] = [r, g, b].map(c => {
        c /= 255;
        return c <= 0.03928 ? c / 12.92 : Math.pow((c + 0.055) / 1.055, 2.4);
      });
      return 0.2126 * rs + 0.7152 * gs + 0.0722 * bs;
    }

    function contrastRatio(hex1, hex2) {
      const l1 = luminance(hexToRgb(hex1));
      const l2 = luminance(hexToRgb(hex2));
      const lighter = Math.max(l1, l2);
      const darker = Math.min(l1, l2);
      return (lighter + 0.05) / (darker + 0.05);
    }

    function wcagLevel(ratio) {
      if (ratio >= 7) return { label: 'AAA', cls: 'pass' };
      if (ratio >= 4.5) return { label: 'AA', cls: 'pass' };
      if (ratio >= 3) return { label: 'AA Large', cls: 'aa-large' };
      return { label: 'Fail', cls: 'fail' };
    }

    /* ─────────────────────────────────────────────────────────────── */
    /* Color Token Metadata                                            */
    /* ─────────────────────────────────────────────────────────────── */
    const CORE_ROLES = {
      paper:   'Primary background — the void',
      ink:     'Primary text (reserved)',
      slate:   'Secondary text and muted content',
      signal:  'Electric cyan accent — high energy signal',
      bone:    'Deep card background — nested depth',
      border:  'Ocean blue for interactive borders',
      surface: 'Cyan surface tint (reserved)',
    };

    const EXTENDED_ROLES = {
      'composio-cobalt':      'Core brand blue — high-priority interactive',
      'accessible-brand-blue': 'Brand blue variant — WCAG AA accessible',
      'ocean-blue':            'Accent border color for CTAs',
      'charcoal':              'Secondary button borders and dividers',
      'pure-white':            'Primary heading and high-emphasis text',
      'muted-smoke':           'De-emphasized body text and metadata',
      'light-border':          'Light surface context (rare)',
    };

    const SEMANTIC_ROLES = {
      danger: 'Void black — danger (semantic)',
      info:   'Cobalt blue — informational accent',
    };

    /* ─────────────────────────────────────────────────────────────── */
    /* Fetch and Render                                                */
    /* ─────────────────────────────────────────────────────────────── */
    (window.__DESIGN_TOKENS__ ? Promise.resolve({ ok: true, json: () => Promise.resolve(window.__DESIGN_TOKENS__) }) : fetch('../tokens.json'))
      .then(r => {
        if (!r.ok) throw new Error('tokens.json not found (' + r.status + ')');
        return r.json();
      })
      .then(render)
      .catch(err => {
        document.getElementById('app').innerHTML =
          '<div class="loading" style="color:#ef4444;">' +
          'Could not load tokens.json — ' + err.message + '</div>';
      });

    function render(tokens) {
      const app = document.getElementById('app');
      const systemName = tokens.meta?.title || 'Composio';
      const rawColors = tokens.colors || {};
      const paperHex = rawColors.paper || '#0f0f0f';

      /* Flatten colors */
      const colors = {};
      for (const [k, v] of Object.entries(rawColors)) {
        if (typeof v === 'string') { colors[k] = v; }
        else if (v && typeof v === 'object') {
          for (const [sk, sv] of Object.entries(v)) {
            if (typeof sv === 'string') colors[k + '-' + sk] = sv;
          }
        }
      }

      /* Separate core, extended, semantic */
      const coreKeys = Object.keys(CORE_ROLES).filter(k => colors[k]);
      const extendedKeys = Object.keys(EXTENDED_ROLES).filter(k => colors[k]);
      const semanticKeys = Object.keys(SEMANTIC_ROLES).filter(k => colors[k]);

      let html = '';

      /* ── Header ── */
      html += '<header class="header">';
      html += '  <h1 class="header__title">Color Palette</h1>';
      html += '  <p class="header__subtitle">A nocturnal command center — precision dark with electric signals</p>';
      html += '  <div class="header__meta">' + systemName + ' Design System</div>';
      html += '  <hr class="header__rule">';
      html += '</header>';

      /* ── Core Palette ── */
      if (coreKeys.length) {
        html += '<div class="section-label">Core Palette</div>';
        html += '<div class="swatch-grid">';
        coreKeys.forEach(key => {
          html += swatchCard(key, colors[key], paperHex, CORE_ROLES[key]);
        });
        html += '</div>';
      }

      /* ── Extended Palette ── */
      if (extendedKeys.length) {
        html += '<div class="section-label">Extended Palette</div>';
        html += '<div class="swatch-grid">';
        extendedKeys.forEach(key => {
          html += swatchCard(key, colors[key], paperHex, EXTENDED_ROLES[key]);
        });
        html += '</div>';
      }

      /* ── Semantic Palette ── */
      if (semanticKeys.length) {
        html += '<div class="section-label">Semantic Colors</div>';
        html += '<div class="swatch-grid">';
        semanticKeys.forEach(key => {
          html += swatchCard(key, colors[key], paperHex, SEMANTIC_ROLES[key]);
        });
        html += '</div>';
      }

      /* ── Color Usage Demo ── */
      html += demoSection(colors);

      /* ── WCAG Summary ── */
      html += wcagSummary(colors, paperHex);

      app.innerHTML = html;
    }

    /* ─────────────────────────────────────────────────────────────── */
    /* Swatch Card                                                     */
    /* ─────────────────────────────────────────────────────────────── */
    function swatchCard(key, hex, paperHex, role) {
      const ratio = contrastRatio(hex, paperHex);
      const level = wcagLevel(ratio);
      const chipTextColor = luminance(hexToRgb(hex)) > 0.35 ? '#111111' : '#ffffff';

      return '' +
        '<div class="swatch">' +
        '  <div class="swatch__chip" style="background:' + esc(hex) + '">' +
        '    <span class="swatch__chip-contrast">' + ratio.toFixed(2) + ':1</span>' +
        '  </div>' +
        '  <div class="swatch__meta">' +
        '    <div class="swatch__var">--color-' + esc(key) + '</div>' +
        '    <div class="swatch__hex">' + esc(hex) + '</div>' +
        '    <div class="swatch__role">' + esc(role) + '</div>' +
        '    <div class="swatch__contrast-label contrast-' + level.cls + '">' +
             'WCAG ' + level.label + '</div>' +
        '  </div>' +
        '</div>';
    }

    /* ─────────────────────────────────────────────────────────────── */
    /* Color Usage Demo                                                */
    /* ─────────────────────────────────────────────────────────────── */
    function demoSection(colors) {
      const paperHex = colors.paper || '#0f0f0f';
      const signalHex = colors.signal || '#00ffff';
      const cobaltHex = colors['composio-cobalt'] || '#0007cd';
      const borderHex = colors.border || '#0089ff';

      return '' +
        '<div class="demo-section">' +
        '  <div class="demo-section__title">Color System in Action</div>' +
        '  <div class="demo-section__subtitle">' +
        '    Composio's accent strategy: <strong>Signal by scarcity.</strong> Cyan and cobalt are rationed ' +
        '    for the highest-signal moments — glowing card halos, focus states, and CTAs. The rest of the ' +
        '    interface breathes dark, leaving color as a rare and precious resource.' +
        '  </div>' +
        '  <div class="demo-grid">' +
        '    <div class="demo-card">' +
        '      <div class="demo-card__label">Primary Background</div>' +
        '      <div class="demo-card__swatch" style="background:' + esc(paperHex) + '"></div>' +
        '      <div class="demo-card__text">Void black canvas — the foundation</div>' +
        '    </div>' +
        '    <div class="demo-card">' +
        '      <div class="demo-card__label">Electric Signal</div>' +
        '      <div class="demo-card__swatch" style="background:' + esc(signalHex) + '"></div>' +
        '      <div class="demo-card__text">Cyan glow at full saturation — the energy accent</div>' +
        '    </div>' +
        '    <div class="demo-card">' +
        '      <div class="demo-card__label">Brand Core</div>' +
        '      <div class="demo-card__swatch" style="background:' + esc(cobaltHex) + '"></div>' +
        '      <div class="demo-card__text">Composio cobalt — high-priority interactivity</div>' +
        '    </div>' +
        '    <div class="demo-card">' +
        '      <div class="demo-card__label">Interactive Border</div>' +
        '      <div class="demo-card__swatch" style="background:' + esc(borderHex) + '"></div>' +
        '      <div class="demo-card__text">Ocean blue — CTA borders and focus states</div>' +
        '    </div>' +
        '  </div>' +
        '</div>';
    }

    /* ─────────────────────────────────────────────────────────────── */
    /* WCAG Summary                                                     */
    /* ─────────────────────────────────────────────────────────────── */
    function wcagSummary(colors, paperHex) {
      const keys = Object.keys(colors);
      let passAAA = 0, passAA = 0, passAALarge = 0, fail = 0;

      keys.forEach(k => {
        const ratio = contrastRatio(colors[k], paperHex);
        if (ratio >= 7) passAAA++;
        else if (ratio >= 4.5) passAA++;
        else if (ratio >= 3) passAALarge++;
        else fail++;
      });

      let html = '<div class="wcag-summary">';
      html += '<h2>WCAG 2.1 Compliance</h2>';
      html += '<p>Contrast measured against paper background (' + esc(paperHex) + ')</p>';
      html += row('AAA (7.0+)', passAAA, 'pass');
      html += row('AA (4.5+)', passAA, 'pass');
      html += row('AA Large (3.0+)', passAALarge, 'aa-large');
      html += row('Below threshold', fail, fail > 0 ? 'fail' : 'pass');
      html += '</div>';
      return html;

      function row(label, count, badge) {
        return '<div class="wcag-row">' +
               '<span class="wcag-badge wcag-badge--' + badge + '">' + count + '</span>' +
               '<span>' + label + '</span>' +
               '</div>';
      }
    }

    /* ─────────────────────────────────────────────────────────────── */
    /* Utilities                                                       */
    /* ─────────────────────────────────────────────────────────────── */
    function esc(s) {
      const d = document.createElement('div');
      d.textContent = String(s);
      return d.innerHTML;
    }
  </script>
</body>
</html>
