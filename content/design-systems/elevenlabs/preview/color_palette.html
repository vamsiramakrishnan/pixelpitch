<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Color Palette — ElevenLabs</title>
  <link rel="stylesheet" href="../colors_and_type.css">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: var(--font-body, Waldenburg, sans-serif);
      background: var(--paper, #ffffff);
      color: var(--ink, #000000);
      line-height: 1.6;
      padding: 0;
    }

    .page {
      max-width: 1200px;
      margin: 0 auto;
      padding: 64px 32px;
    }

    /* Header / Stage head */
    .header {
      margin-bottom: 72px;
      border-bottom: 1px solid var(--border, #e5e5e5);
      padding-bottom: 32px;
    }

    .header__kicker {
      font-family: var(--font-body, Waldenburg, sans-serif);
      font-size: 13px;
      font-weight: 500;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--slate, #4e4e4e);
      margin-bottom: 12px;
    }

    .header__title {
      font-family: var(--font-display, Waldenburg, sans-serif);
      font-size: 72px;
      font-weight: 300;
      line-height: 0.95;
      letter-spacing: -0.02em;
      color: var(--ink, #000000);
      margin-bottom: 8px;
    }

    .header__subtitle {
      font-family: var(--font-body, Waldenburg, sans-serif);
      font-size: 20px;
      line-height: 1.5;
      color: var(--slate, #4e4e4e);
      max-width: 720px;
      margin-bottom: 16px;
      font-weight: 400;
    }

    .header__meta {
      font-family: var(--font-body, Waldenburg, sans-serif);
      font-size: 13px;
      font-weight: 500;
      letter-spacing: 0.06em;
      color: var(--slate, #4e4e4e);
      text-transform: uppercase;
    }

    /* Section labels */
    .section-label {
      font-family: var(--font-body, Waldenburg, sans-serif);
      font-size: 13px;
      font-weight: 500;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--slate, #4e4e4e);
      margin-bottom: 32px;
      padding-bottom: 16px;
      border-bottom: 1px solid var(--border, #e5e5e5);
    }

    /* Swatch grid */
    .swatch-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 24px;
      margin-bottom: 64px;
    }

    .swatch {
      background: var(--paper, #ffffff);
      border: 1px solid var(--border, #e5e5e5);
      border-radius: var(--radius-md, 10px);
      overflow: hidden;
      transition: border-color 0.2s ease, box-shadow 0.2s ease;
    }

    .swatch:hover {
      border-color: var(--slate, #4e4e4e);
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
    }

    .swatch__chip {
      width: 100%;
      aspect-ratio: 4 / 3;
      position: relative;
    }

    .swatch__chip-contrast {
      position: absolute;
      bottom: 10px;
      right: 12px;
      font-family: var(--font-body, Waldenburg, sans-serif);
      font-size: 11px;
      font-weight: 600;
      padding: 4px 10px;
      border-radius: 3px;
      line-height: 1.4;
      text-transform: uppercase;
      background: rgba(255, 255, 255, 0.15);
      color: #ffffff;
      letter-spacing: 0.04em;
    }

    .swatch__meta {
      padding: 18px 20px 20px;
    }

    .swatch__var {
      font-family: var(--font-mono, 'Geist Mono', monospace);
      font-size: 12px;
      font-weight: 500;
      color: var(--ink, #000000);
      word-break: break-all;
      margin-bottom: 6px;
      letter-spacing: 0.02em;
    }

    .swatch__hex {
      font-family: var(--font-mono, 'Geist Mono', monospace);
      font-size: 11px;
      color: var(--slate, #4e4e4e);
      margin-bottom: 8px;
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }

    .swatch__role {
      font-family: var(--font-body, Waldenburg, sans-serif);
      font-size: 14px;
      line-height: 1.5;
      color: var(--ink, #000000);
      margin-bottom: 8px;
      font-weight: 400;
    }

    .swatch__contrast-label {
      font-family: var(--font-body, Waldenburg, sans-serif);
      font-size: 11px;
      font-weight: 500;
      margin-top: 8px;
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }

    .contrast-pass { color: #1a5a3a; }
    .contrast-fail { color: #8b2a1f; }
    .contrast-aa-large { color: #7a5c1a; }

    /* Usage pattern section */
    .usage-section {
      margin-bottom: 64px;
      padding: 40px;
      background: var(--bone, #f5f5f5);
      border: 1px solid var(--border, #e5e5e5);
      border-radius: var(--radius-md, 10px);
    }

    .usage-section h2 {
      font-family: var(--font-display, Waldenburg, sans-serif);
      font-size: 48px;
      font-weight: 300;
      line-height: 1.1;
      letter-spacing: -0.02em;
      color: var(--ink, #000000);
      margin-bottom: 24px;
    }

    .usage-section p {
      font-family: var(--font-body, Waldenburg, sans-serif);
      font-size: 18px;
      line-height: 1.55;
      color: var(--ink, #000000);
      margin-bottom: 24px;
      max-width: 720px;
      font-weight: 400;
    }

    .rule-of-one {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 32px;
      margin-top: 32px;
      align-items: start;
    }

    .rule-example {
      padding: 24px;
      background: var(--paper, #ffffff);
      border: 1px solid var(--border, #e5e5e5);
      border-radius: var(--radius-md, 10px);
    }

    .rule-example h3 {
      font-family: var(--font-display, Waldenburg, sans-serif);
      font-size: 28px;
      font-weight: 300;
      line-height: 1.35;
      color: var(--ink, #000000);
      margin-bottom: 12px;
    }

    .rule-example p {
      font-family: var(--font-body, Waldenburg, sans-serif);
      font-size: 16px;
      line-height: 1.55;
      color: var(--slate, #4e4e4e);
      margin-bottom: 0;
      font-weight: 400;
    }

    .correct {
      border: 2px solid #1a5a3a;
    }

    .correct::before {
      content: '✓ CORRECT';
      display: block;
      font-family: var(--font-body, Waldenburg, sans-serif);
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.14em;
      color: #1a5a3a;
      text-transform: uppercase;
      margin-bottom: 12px;
      padding-bottom: 12px;
      border-bottom: 1px solid #1a5a3a;
    }

    .incorrect {
      border: 2px solid #8b2a1f;
    }

    .incorrect::before {
      content: '✗ INCORRECT';
      display: block;
      font-family: var(--font-body, Waldenburg, sans-serif);
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.14em;
      color: #8b2a1f;
      text-transform: uppercase;
      margin-bottom: 12px;
      padding-bottom: 12px;
      border-bottom: 1px solid #8b2a1f;
    }

    .mono-demo {
      font-family: var(--font-mono, 'Geist Mono', monospace);
      font-size: 16px;
      line-height: 1.6;
      background: var(--bone, #f5f5f5);
      padding: 16px;
      border-radius: 4px;
      margin: 16px 0;
      overflow-x: auto;
    }

    /* WCAG summary */
    .wcag-summary {
      margin-top: 64px;
      padding: 40px;
      background: var(--bone, #f5f5f5);
      border: 1px solid var(--border, #e5e5e5);
      border-radius: var(--radius-md, 10px);
    }

    .wcag-summary h2 {
      font-family: var(--font-display, Waldenburg, sans-serif);
      font-size: 48px;
      font-weight: 300;
      line-height: 1.1;
      letter-spacing: -0.02em;
      margin-bottom: 24px;
      color: var(--ink, #000000);
    }

    .wcag-summary p {
      font-family: var(--font-body, Waldenburg, sans-serif);
      font-size: 16px;
      line-height: 1.55;
      color: var(--slate, #4e4e4e);
      margin-bottom: 24px;
      font-weight: 400;
    }

    .wcag-row {
      display: flex;
      align-items: center;
      gap: 16px;
      padding: 12px 0;
      border-bottom: 1px solid var(--border, #e5e5e5);
      font-family: var(--font-body, Waldenburg, sans-serif);
      font-size: 16px;
      font-weight: 400;
    }

    .wcag-row:last-child { border-bottom: none; }

    .wcag-badge {
      display: inline-block;
      padding: 6px 12px;
      border-radius: 3px;
      font-family: var(--font-body, Waldenburg, sans-serif);
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      min-width: 80px;
      text-align: center;
    }

    .wcag-badge--pass { background: #e8f5e9; color: #1a5a3a; border: 1px solid #1a5a3a; }
    .wcag-badge--fail { background: #ffebee; color: #8b2a1f; border: 1px solid #8b2a1f; }
    .wcag-badge--aa-large { background: #fff8e1; color: #7a5c1a; border: 1px solid #7a5c1a; }

    /* Loading state */
    .loading {
      text-align: center;
      padding: 80px 24px;
      color: var(--slate, #4e4e4e);
      font-family: var(--font-body, Waldenburg, sans-serif);
      font-size: 18px;
      font-weight: 400;
    }

    .loading::after {
      content: '';
      display: block;
      width: 32px;
      height: 32px;
      margin: 24px auto 0;
      border: 2px solid var(--slate, #4e4e4e);
      border-top-color: var(--signal, #4e4e4e);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    /* Responsive */
    @media (max-width: 768px) {
      .page { padding: 48px 20px; }
      .header { padding-bottom: 24px; margin-bottom: 48px; }
      .header__title { font-size: 48px; }
      .swatch-grid { grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 16px; }
      .rule-of-one { grid-template-columns: 1fr; gap: 16px; }
      .usage-section { padding: 24px; }
      .usage-section h2 { font-size: 36px; }
    }
  </style>
</head>
<body>
  <div class="page" id="app">
    <div class="loading">Loading design tokens…</div>
  </div>

  <script>
    /* ───────────────────────────────────────────────────────────── */
    /* Contrast ratio calculation (WCAG 2.1 relative luminance)      */
    /* ───────────────────────────────────────────────────────────── */
    function hexToRgb(hex) {
      hex = hex.replace(/^#/, '');
      if (hex.length === 3) hex = hex.split('').map(c => c + c).join('');
      const n = parseInt(hex, 16);
      return [(n >> 16) & 255, (n >> 8) & 255, n & 255];
    }

    function luminance([r, g, b]) {
      const [rs, gs, bs] = [r, g, b].map(c => {
        c /= 255;
        return c <= 0.03928 ? c / 12.92 : Math.pow((c + 0.055) / 1.055, 2.4);
      });
      return 0.2126 * rs + 0.7152 * gs + 0.0722 * bs;
    }

    function contrastRatio(hex1, hex2) {
      const l1 = luminance(hexToRgb(hex1));
      const l2 = luminance(hexToRgb(hex2));
      const lighter = Math.max(l1, l2);
      const darker = Math.min(l1, l2);
      return (lighter + 0.05) / (darker + 0.05);
    }

    function wcagLevel(ratio) {
      if (ratio >= 7) return { label: 'AAA', cls: 'pass' };
      if (ratio >= 4.5) return { label: 'AA', cls: 'pass' };
      if (ratio >= 3) return { label: 'AA Large', cls: 'aa-large' };
      return { label: 'Fail', cls: 'fail' };
    }

    /* ───────────────────────────────────────────────────────────── */
    /* Core color roles and descriptions                             */
    /* ───────────────────────────────────────────────────────────── */
    const CORE_ROLES = {
      paper:  'Primary canvas. Pure white background for all surfaces.',
      ink:    'Primary text, headings, and UI elements. Near-black.',
      slate:  'Secondary text, descriptions, and muted UI.',
      signal: 'Signal color for accents and interactive states.',
      bone:   'Secondary surface for subtle differentiation.',
      border: 'Explicit borders and hairline dividers.',
      surface: 'Surface color for cards and elevated elements.',
    };

    /* ───────────────────────────────────────────────────────────── */
    /* Render from tokens.json                                       */
    /* ───────────────────────────────────────────────────────────── */
    (window.__DESIGN_TOKENS__ 
      ? Promise.resolve({ ok: true, json: () => Promise.resolve(window.__DESIGN_TOKENS__) }) 
      : fetch('../tokens.json'))
      .then(r => {
        if (!r.ok) throw new Error('tokens.json not found (' + r.status + ')');
        return r.json();
      })
      .then(render)
      .catch(err => {
        document.getElementById('app').innerHTML =
          '<div class="loading" style="color:var(--slate,#4e4e4e)">' +
          'Could not load tokens.json — ' + err.message + '</div>';
      });

    function render(tokens) {
      const app = document.getElementById('app');
      const title = tokens.meta?.title || 'Design System';
      const summary = tokens.meta?.summary || '';
      const rawColors = tokens.colors || {};
      const paperHex = rawColors.paper || '#ffffff';

      /* Flatten nested color structure */
      const colors = {};
      for (const [k, v] of Object.entries(rawColors)) {
        if (typeof v === 'string') {
          colors[k] = v;
        } else if (v && typeof v === 'object') {
          for (const [sk, sv] of Object.entries(v)) {
            if (typeof sv === 'string') colors[k + '-' + sk] = sv;
          }
        }
      }

      /* Split core and extended */
      const coreKeys = Object.keys(CORE_ROLES).filter(k => colors[k]);
      const extendedKeys = Object.keys(colors)
        .filter(k => !CORE_ROLES[k] && typeof colors[k] === 'string')
        .sort();

      let html = '';

      /* ─ Stage head header ─ */
      html += '<header class="header">';
      html += '  <div class="header__kicker">Design System</div>';
      html += '  <h1 class="header__title">' + esc(title) + '</h1>';
      html += '  <p class="header__subtitle">' + esc(summary) + '</p>';
      html += '  <div class="header__meta">Color Palette · ' + (coreKeys.length + extendedKeys.length) + ' Tokens</div>';
      html += '</header>';

      /* ─ Core Palette ─ */
      if (coreKeys.length) {
        html += '<div class="section-label">Core Palette</div>';
        html += '<div class="swatch-grid">';
        coreKeys.forEach(key => {
          html += swatchCard(key, colors[key], paperHex, CORE_ROLES[key]);
        });
        html += '</div>';
      }

      /* ─ Extended Palette ─ */
      if (extendedKeys.length) {
        html += '<div class="section-label">Extended Palette</div>';
        html += '<div class="swatch-grid">';
        extendedKeys.forEach(key => {
          const role = formatRole(key);
          html += swatchCard(key, colors[key], paperHex, role);
        });
        html += '</div>';
      }

      /* ─ Color Philosophy ─ */
      html += colorPhilosopySection();

      /* ─ WCAG Summary ─ */
      html += wcagSummary(colors, paperHex);

      app.innerHTML = html;
    }

    /* ───────────────────────────────────────────────────────────── */
    /* Swatch card builder                                           */
    /* ───────────────────────────────────────────────────────────── */
    function swatchCard(key, hex, paperHex, role) {
      const ratio = contrastRatio(hex, paperHex);
      const level = wcagLevel(ratio);
      const lum = luminance(hexToRgb(hex));
      const chipTextColor = lum > 0.5 ? '#000000' : '#ffffff';
      const chipBadgeBg = lum > 0.5 ? 'rgba(0,0,0,0.15)' : 'rgba(255,255,255,0.25)';

      return '' +
        '<div class="swatch">' +
        '  <div class="swatch__chip" style="background:' + hex + '">' +
        '    <span class="swatch__chip-contrast" style="color:' + chipTextColor +
             ';background:' + chipBadgeBg + '">' + ratio.toFixed(2) + ':1</span>' +
        '  </div>' +
        '  <div class="swatch__meta">' +
        '    <div class="swatch__var">--' + esc(key) + '</div>' +
        '    <div class="swatch__hex">' + esc(hex.toUpperCase()) + '</div>' +
        '    <div class="swatch__role">' + esc(role) + '</div>' +
        '    <div class="swatch__contrast-label contrast-' + level.cls + '">' +
             'WCAG ' + level.label + '</div>' +
        '  </div>' +
        '</div>';
    }

    /* ───────────────────────────────────────────────────────────── */
    /* Color philosophy section                                      */
    /* ───────────────────────────────────────────────────────────── */
    function colorPhilosopySection() {
      let html = '<section class="usage-section">';
      html += '<h2>Luminance & Contrast</h2>';
      html += '<p>ElevenLabs uses a near-white canvas (#FFFFFF) with warm stone undertones (#F5F2EF) for button backgrounds. The palette prioritizes minimal contrast ratios to maintain the aesthetic lightness while ensuring accessibility for body copy and interactive elements. Warm-tinted shadows (rgba(78, 50, 23, 0.04)) replace traditional black shadows, giving the interface a tactile, slightly aged quality.</p>';
      
      html += '<div class="rule-of-one">';
      
      /* Correct example */
      html += '<div class="rule-example correct">';
      html += '<h3>Color Hierarchy</h3>';
      html += '<p>Use <strong>ink</strong> (#000000) for primary headings and body text. <strong>Slate</strong> (#4E4E4E) for secondary content. Keep surfaces minimal — let negative space breathe. Accent sparingly with warm stone on button backgrounds.</p>';
      html += '</div>';

      /* Incorrect example */
      html += '<div class="rule-example incorrect">';
      html += '<h3>Anti-Pattern</h3>';
      html += '<p>Avoid using multiple accent colors. Don\'t apply signal colors to decorative elements. Never use harsh black shadows — always use warm-tinted rgba(78,50,23,0.04). Resist the urge to fill surfaces with color.</p>';
      html += '</div>';

      html += '</div>';
      html += '</section>';
      return html;
    }

    /* ───────────────────────────────────────────────────────────── */
    /* WCAG compliance summary                                       */
    /* ───────────────────────────────────────────────────────────── */
    function wcagSummary(colors, paperHex) {
      const keys = Object.keys(colors);
      let passAAA = 0, passAA = 0, passAALarge = 0, fail = 0;

      keys.forEach(k => {
        const ratio = contrastRatio(colors[k], paperHex);
        if (ratio >= 7) passAAA++;
        else if (ratio >= 4.5) passAA++;
        else if (ratio >= 3) passAALarge++;
        else fail++;
      });

      let html = '<div class="wcag-summary">';
      html += '<h2>WCAG 2.1 Compliance</h2>';
      html += '<p>Contrast ratios measured against the paper background (#FFFFFF). ElevenLabs prioritizes a restrained, premium aesthetic — reserve high-contrast text for critical UI elements. Extended palette colors are primarily used as surface and background elements, not foreground text.</p>';
      html += row('AAA (7:1+)', passAAA, 'pass');
      html += row('AA (4.5:1+)', passAA, 'pass');
      html += row('AA Large Text (3:1+)', passAALarge, 'aa-large');
      html += row('Below Threshold', fail, fail > 0 ? 'fail' : 'pass');
      html += '</div>';
      return html;

      function row(label, count, badge) {
        return '<div class="wcag-row">' +
               '<span class="wcag-badge wcag-badge--' + badge + '">' + count + '</span>' +
               '<span>' + label + '</span>' +
               '</div>';
      }
    }

    /* ───────────────────────────────────────────────────────────── */
    /* Utilities                                                      */
    /* ───────────────────────────────────────────────────────────── */
    function esc(s) {
      const d = document.createElement('div');
      d.textContent = String(s);
      return d.innerHTML;
    }

    function formatRole(key) {
      return key
        .replace(/([A-Z])/g, ' $1')
        .replace(/[-_]/g, ' ')
        .replace(/\b\w/g, c => c.toUpperCase())
        .trim();
    }
  </script>
</body>
</html>
