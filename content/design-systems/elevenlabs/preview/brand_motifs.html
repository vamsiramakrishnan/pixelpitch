<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Brand Motifs — ElevenLabs</title>
  <link rel="stylesheet" href="../colors_and_type.css">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: var(--font-body, 'Waldenburg', sans-serif);
      background: var(--paper, #ffffff);
      color: var(--ink, #000000);
      line-height: 1.6;
      -webkit-font-smoothing: antialiased;
    }

    .page {
      max-width: 1200px;
      margin: 0 auto;
      padding: 80px 40px;
    }

    @media (max-width: 768px) {
      .page {
        padding: 48px 24px;
      }
    }

    /* ──── Header ──── */
    .header {
      margin-bottom: 120px;
    }

    .header__kicker {
      font-family: var(--font-mono, 'Geist Mono', monospace);
      font-size: 13px;
      font-weight: 500;
      letter-spacing: 0.5px;
      text-transform: uppercase;
      color: var(--slate, #4e4e4e);
      margin-bottom: 16px;
    }

    .header__title {
      font-family: var(--font-display, 'Waldenburg', sans-serif);
      font-size: 56px;
      font-weight: 300;
      line-height: 1.08;
      letter-spacing: -1.12px;
      color: var(--ink, #000000);
      margin-bottom: 20px;
      max-width: 900px;
    }

    .header__title span {
      color: var(--signal, #4e4e4e);
      font-weight: 400;
    }

    .header__subtitle {
      font-family: var(--font-body, 'Waldenburg', sans-serif);
      font-size: 18px;
      font-weight: 400;
      line-height: 1.44;
      letter-spacing: 0.18px;
      color: var(--slate, #4e4e4e);
      max-width: 760px;
      margin-bottom: 32px;
    }

    .header__rule {
      display: block;
      width: 120px;
      height: 1px;
      background: var(--border, #e5e5e5);
      border: none;
      margin-top: 40px;
    }

    /* ──── Section ──── */
    .section {
      margin-bottom: 100px;
    }

    .section__label {
      font-family: var(--font-mono, 'Geist Mono', monospace);
      font-size: 12px;
      font-weight: 500;
      letter-spacing: 0.5px;
      text-transform: uppercase;
      color: var(--slate, #4e4e4e);
      margin-bottom: 32px;
      padding-bottom: 16px;
      border-bottom: 1px solid var(--border, #e5e5e5);
    }

    /* ──── Key Characteristics ──── */
    .traits-list {
      list-style: none;
      padding: 0;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 32px;
    }

    @media (max-width: 768px) {
      .traits-list {
        grid-template-columns: 1fr;
      }
    }

    .traits-list li {
      position: relative;
      padding: 20px 0 20px 28px;
      font-family: var(--font-body, 'Waldenburg', sans-serif);
      font-size: 16px;
      font-weight: 400;
      line-height: 1.50;
      letter-spacing: 0.16px;
      color: var(--ink, #000000);
      border-bottom: 1px solid var(--border, #e5e5e5);
    }

    .traits-list li:last-child {
      border-bottom: none;
    }

    .traits-list li::before {
      content: '';
      position: absolute;
      left: 0;
      top: 28px;
      width: 4px;
      height: 4px;
      border-radius: 50%;
      background: var(--slate, #4e4e4e);
    }

    /* ──── Do's and Don'ts ──── */
    .dd-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 40px;
    }

    @media (max-width: 768px) {
      .dd-grid {
        grid-template-columns: 1fr;
      }
    }

    .dd-card {
      background: var(--bone, #f5f5f5);
      border: 1px solid var(--border, #e5e5e5);
      border-radius: 10px;
      padding: 40px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    }

    .dd-card__heading {
      font-family: var(--font-body, 'Waldenburg', sans-serif);
      font-size: 15px;
      font-weight: 500;
      letter-spacing: 0.15px;
      text-transform: uppercase;
      margin-bottom: 28px;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .dd-card__heading--do {
      color: var(--ink, #000000);
    }

    .dd-card__heading--dont {
      color: var(--slate, #4e4e4e);
    }

    .dd-card__icon {
      width: 20px;
      height: 20px;
      border-radius: 50%;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-weight: 600;
      font-size: 12px;
      flex-shrink: 0;
      border: 1.5px solid currentColor;
    }

    .dd-card__icon--do {
      color: var(--ink, #000000);
    }

    .dd-card__icon--dont {
      color: var(--slate, #4e4e4e);
    }

    .dd-list {
      list-style: none;
      padding: 0;
    }

    .dd-list li {
      font-family: var(--font-body, 'Waldenburg', sans-serif);
      font-size: 15px;
      font-weight: 400;
      line-height: 1.47;
      letter-spacing: 0;
      color: var(--ink, #000000);
      padding: 14px 0;
      border-bottom: 1px solid rgba(0,0,0,0.05);
    }

    .dd-list li:last-child {
      border-bottom: none;
    }

    /* ──── Color Harmony Strip ──── */
    .harmony-strip {
      display: flex;
      border-radius: 10px;
      overflow: hidden;
      height: 140px;
      border: 1px solid var(--border, #e5e5e5);
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    }

    .harmony-strip__swatch {
      flex: 1;
      position: relative;
      transition: flex 0.3s ease;
      cursor: default;
      display: flex;
      align-items: flex-end;
      justify-content: center;
      padding-bottom: 16px;
    }

    .harmony-strip__swatch:hover {
      flex: 1.3;
    }

    .harmony-strip__label {
      font-family: var(--font-mono, 'Geist Mono', monospace);
      font-size: 11px;
      font-weight: 500;
      letter-spacing: 0.4px;
      text-transform: uppercase;
      padding: 6px 10px;
      white-space: nowrap;
      opacity: 0.6;
      transition: opacity 0.2s ease;
    }

    .harmony-strip__swatch:hover .harmony-strip__label {
      opacity: 1;
    }

    /* ──── Type Pairing Demo ──── */
    .type-pairing {
      background: var(--bone, #f5f5f5);
      border: 1px solid var(--border, #e5e5e5);
      border-radius: 10px;
      padding: 56px 48px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    }

    .type-pairing__kicker {
      font-family: var(--font-mono, 'Geist Mono', monospace);
      font-size: 12px;
      font-weight: 500;
      letter-spacing: 0.5px;
      text-transform: uppercase;
      color: var(--slate, #4e4e4e);
      margin-bottom: 16px;
    }

    .type-pairing__display {
      font-family: var(--font-display, 'Waldenburg', sans-serif);
      font-size: 44px;
      font-weight: 300;
      line-height: 1.08;
      letter-spacing: -0.88px;
      color: var(--ink, #000000);
      margin-bottom: 28px;
    }

    .type-pairing__display span {
      color: var(--signal, #4e4e4e);
      font-weight: 400;
    }

    .type-pairing__body {
      font-family: var(--font-body, 'Waldenburg', sans-serif);
      font-size: 18px;
      font-weight: 400;
      line-height: 1.44;
      letter-spacing: 0.18px;
      color: var(--ink, #000000);
      max-width: 780px;
      margin-bottom: 32px;
    }

    .type-pairing__meta {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 28px;
      padding-top: 28px;
      border-top: 1px solid var(--border, #e5e5e5);
    }

    @media (max-width: 640px) {
      .type-pairing__meta {
        grid-template-columns: 1fr;
      }
    }

    .type-pairing__meta-item {
      font-family: var(--font-body, 'Waldenburg', sans-serif);
      font-size: 14px;
      font-weight: 400;
      line-height: 1.43;
      letter-spacing: 0.14px;
      color: var(--slate, #4e4e4e);
    }

    .type-pairing__meta-label {
      font-weight: 500;
      color: var(--ink, #000000);
      display: block;
      margin-bottom: 6px;
      font-size: 13px;
      letter-spacing: 0;
    }

    /* ──── Atmosphere Card ──── */
    .atmosphere-card {
      background: var(--bone, #f5f5f5);
      border: 1px solid var(--border, #e5e5e5);
      border-radius: 10px;
      padding: 40px;
      max-width: 920px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    }

    .atmosphere-card p {
      font-family: var(--font-body, 'Waldenburg', sans-serif);
      font-size: 18px;
      font-weight: 400;
      line-height: 1.44;
      letter-spacing: 0.18px;
      color: var(--ink, #000000);
    }

    /* ──── Shadow System Demo ──── */
    .shadow-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
      gap: 32px;
      margin-top: 24px;
    }

    .shadow-demo {
      background: var(--paper, #ffffff);
      padding: 32px;
      border-radius: 10px;
      min-height: 180px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
    }

    .shadow-demo__label {
      font-family: var(--font-mono, 'Geist Mono', monospace);
      font-size: 12px;
      font-weight: 500;
      letter-spacing: 0.5px;
      text-transform: uppercase;
      color: var(--slate, #4e4e4e);
      margin-bottom: 16px;
    }

    .shadow-demo__box {
      width: 100px;
      height: 100px;
      background: var(--color-warm-stone, #f5f2ef);
      border-radius: 10px;
      margin-bottom: 16px;
    }

    .shadow-demo__code {
      font-family: var(--font-mono, 'Geist Mono', monospace);
      font-size: 10px;
      line-height: 1.60;
      letter-spacing: 0;
      color: var(--slate, #4e4e4e);
      font-weight: 400;
      word-break: break-all;
    }

    .shadow-demo--inset .shadow-demo__box {
      box-shadow: rgba(0,0,0,0.075) 0px 0px 0px 0.5px inset;
    }

    .shadow-demo--outline .shadow-demo__box {
      box-shadow: rgba(0,0,0,0.06) 0px 0px 0px 1px;
    }

    .shadow-demo--elevation .shadow-demo__box {
      box-shadow: rgba(0,0,0,0.04) 0px 4px 4px;
    }

    .shadow-demo--warm .shadow-demo__box {
      box-shadow: rgba(78,50,23,0.04) 0px 4px 8px;
    }

    .shadow-demo--multi .shadow-demo__box {
      box-shadow: 
        rgba(0,0,0,0.075) 0px 0px 0px 0.5px inset,
        rgba(0,0,0,0.06) 0px 0px 0px 1px,
        rgba(0,0,0,0.04) 0px 4px 4px;
    }

    /* ──── Button Demos ──── */
    .button-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 24px;
      margin-top: 24px;
    }

    .button-demo {
      display: flex;
      flex-direction: column;
      gap: 12px;
      align-items: center;
    }

    .button {
      font-family: var(--font-body, 'Waldenburg', sans-serif);
      font-size: 15px;
      font-weight: 500;
      line-height: 1.47;
      letter-spacing: 0;
      padding: 10px 20px;
      border-radius: 9999px;
      border: none;
      cursor: pointer;
      transition: all 0.2s ease;
      text-transform: none;
    }

    .button--warm {
      background: rgba(245,242,239,0.8);
      color: var(--ink, #000000);
      box-shadow: rgba(78,50,23,0.04) 0px 4px 8px;
    }

    .button--warm:hover {
      background: rgba(245,242,239,1);
      box-shadow: rgba(78,50,23,0.06) 0px 6px 12px;
    }

    .button--white {
      background: var(--paper, #ffffff);
      color: var(--ink, #000000);
      border: 1px solid var(--border, #e5e5e5);
      box-shadow: rgba(0,0,0,0.04) 0px 2px 4px;
    }

    .button--white:hover {
      background: var(--bone, #f5f5f5);
      box-shadow: rgba(0,0,0,0.06) 0px 4px 8px;
    }

    .button--uppercase {
      font-family: var(--font-display, 'Waldenburg', sans-serif);
      font-size: 14px;
      font-weight: 700;
      line-height: 1.10;
      letter-spacing: 0.7px;
      text-transform: uppercase;
      background: rgba(245,242,239,0.8);
      color: var(--ink, #000000);
      box-shadow: rgba(78,50,23,0.04) 0px 4px 8px;
    }

    .button--uppercase:hover {
      background: rgba(245,242,239,1);
      box-shadow: rgba(78,50,23,0.06) 0px 6px 12px;
    }

    .button-label {
      font-family: var(--font-mono, 'Geist Mono', monospace);
      font-size: 11px;
      font-weight: 500;
      letter-spacing: 0.4px;
      text-transform: uppercase;
      color: var(--slate, #4e4e4e);
    }

    /* ──── Pill Treatment Demo ──── */
    .pill-demo {
      background: var(--bone, #f5f5f5);
      border: 1px solid var(--border, #e5e5e5);
      border-radius: 10px;
      padding: 40px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
      max-width: 920px;
    }

    .pill-demo__items {
      display: flex;
      flex-wrap: wrap;
      gap: 16px;
      align-items: center;
    }

    .pill {
      padding: 8px 20px;
      border-radius: 9999px;
      font-family: var(--font-body, 'Waldenburg', sans-serif);
      font-size: 14px;
      font-weight: 400;
      line-height: 1.43;
      letter-spacing: 0.14px;
      background: rgba(245,242,239,0.8);
      color: var(--ink, #000000);
      box-shadow: rgba(78,50,23,0.04) 0px 2px 4px;
      border: none;
      cursor: default;
    }

    .pill-label {
      font-family: var(--font-mono, 'Geist Mono', monospace);
      font-size: 11px;
      font-weight: 500;
      letter-spacing: 0.4px;
      text-transform: uppercase;
      color: var(--slate, #4e4e4e);
      width: 100%;
      margin-bottom: 8px;
    }

    /* ──── Type Ramp ──── */
    .ramp-section {
      background: var(--bone, #f5f5f5);
      border: 1px solid var(--border, #e5e5e5);
      border-radius: 10px;
      padding: 40px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    }

    .ramp-item {
      margin-bottom: 40px;
      padding-bottom: 32px;
      border-bottom: 1px solid var(--border, #e5e5e5);
      display: grid;
      grid-template-columns: 200px 1fr;
      gap: 40px;
    }

    .ramp-item:last-child {
      margin-bottom: 0;
      padding-bottom: 0;
      border-bottom: none;
    }

    @media (max-width: 768px) {
      .ramp-item {
        grid-template-columns: 1fr;
        gap: 16px;
      }
    }

    .ramp-item__label {
      font-family: var(--font-mono, 'Geist Mono', monospace);
      font-size: 11px;
      font-weight: 500;
      letter-spacing: 0.4px;
      text-transform: uppercase;
      color: var(--slate, #4e4e4e);
    }

    .ramp-item__spec {
      font-family: var(--font-mono, 'Geist Mono', monospace);
      font-size: 11px;
      font-weight: 500;
      letter-spacing: 0.4px;
      text-transform: uppercase;
      color: var(--slate, #4e4e4e);
      margin-bottom: 12px;
      line-height: 1.6;
      display: block;
    }

    .ramp-item__example {
      color: var(--ink, #000000);
      margin-bottom: 8px;
    }

    /* ──── Loading ──── */
    .loading {
      text-align: center;
      padding: 160px 24px;
      color: var(--slate, #4e4e4e);
      font-size: 16px;
      font-family: var(--font-body, 'Waldenburg', sans-serif);
      font-weight: 400;
      letter-spacing: 0.16px;
    }

    .loading::after {
      content: '';
      display: block;
      width: 32px;
      height: 32px;
      margin: 24px auto 0;
      border: 2px solid var(--border, #e5e5e5);
      border-top-color: var(--slate, #4e4e4e);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div class="page" id="app">
    <div class="loading">Loading design tokens…</div>
  </div>

  <script>
    const CORE_COLOR_KEYS = ['paper', 'ink', 'slate', 'signal', 'bone', 'border'];

    (window.__DESIGN_TOKENS__ ? Promise.resolve({ ok: true, json: () => Promise.resolve(window.__DESIGN_TOKENS__) }) : fetch('../tokens.json'))
      .then(r => {
        if (!r.ok) throw new Error('tokens.json not found (' + r.status + ')');
        return r.json();
      })
      .then(render)
      .catch(err => {
        document.getElementById('app').innerHTML =
          '<div class="loading" style="color:#4e4e4e">' +
          'Could not load tokens.json — ' + err.message + '</div>';
      });

    function render(tokens) {
      const app = document.getElementById('app');
      const colors = tokens.colors || {};
      const meta = tokens.meta || {};

      let html = '';

      /* ──── Header ──── */
      html += '<header class="header">';
      html += '  <div class="header__kicker">Brand Identity</div>';
      html += '  <h1 class="header__title">The <span>Whisper</span> is the Signal</h1>';
      html += '  <p class="header__subtitle">Waldenburg at weight 300, multi-layered shadows at sub-0.1 opacity, warm stone pill buttons. ElevenLabs is restraint rendered in pixels.</p>';
      html += '  <hr class="header__rule">';
      html += '</header>';

      /* ──── Atmosphere ──── */
      html += '<div class="section">';
      html += '  <div class="section__label">Atmosphere</div>';
      html += '  <div class="atmosphere-card">';
      html += '    <p>ElevenLabs reads like a premium audio product brochure rendered for the web. The canvas is near-white (#ffffff, #f5f5f5) with warm stone undertones (#f5f2ef). Waldenburg at weight 300 sets all display headings — ethereal, whisper-thin, delicate at scale. Inter body text carries 0.14–0.18px positive letter-spacing for airiness. The signature is the shadow stack: inset half-pixel borders, outline shadows at 0.06 opacity, and elevation shadows at 0.04 opacity combine to make surfaces barely exist. Pill-shaped buttons (9999px radius) use warm-tinted stone backgrounds with warm-colored shadows (rgba(78,50,23,0.04)). There is no bold color. There is no visual noise. Only the text, the whitespace, and the softest possible depth.</p>';
      html += '  </div>';
      html += '</div>';

      /* ──── Key Characteristics ──── */
      html += '<div class="section">';
      html += '  <div class="section__label">Key Characteristics</div>';
      html += '  <ul class="traits-list">';
      html += '    <li>Waldenburg weight 300 for all display — the lightness IS the brand</li>';
      html += '    <li>Near-white canvas (#ffffff, #f5f5f5) with warm stone accents</li>';
      html += '    <li>Multi-layered shadow stack: inset + outline + elevation at sub-0.1 opacity</li>';
      html += '    <li>Positive letter-spacing on Inter body (0.14–0.18px) for air</li>';
      html += '    <li>Pill buttons (9999px) with warm stone translucent backgrounds</li>';
      html += '    <li>Warm-tinted shadows: rgba(78,50,23,0.04) — color in darkness</li>';
      html += '    <li>Geist Mono for code and metadata — clean, workhorse reliability</li>';
      html += '    <li>WaldenburgFH bold uppercase ONLY for specific CTA labels</li>';
      html += '    <li>No bold headings. No heavy shadows. No brand color. Only restraint.</li>';
      html += '  </ul>';
      html += '</div>';

      /* ──── Do's and Don'ts ──── */
      html += '<div class="section">';
      html += '  <div class="section__label">Do\'s and Don\'ts</div>';
      html += '  <div class="dd-grid">';

      html += '  <div class="dd-card">';
      html += '    <div class="dd-card__heading dd-card__heading--do">';
      html += '      <span class="dd-card__icon dd-card__icon--do">✓</span> Do';
      html += '    </div>';
      html += '    <ul class="dd-list">';
      html += '      <li>Use Waldenburg weight 300 for all display headings</li>';
      html += '      <li>Apply multi-layer shadows: inset + outline + elevation stack</li>';
      html += '      <li>Use warm stone (#f5f2ef) for featured elements and button backgrounds</li>';
      html += '      <li>Apply positive letter-spacing (+0.14px–0.18px) on body text</li>';
      html += '      <li>Use 9999px radius for primary buttons — pill is standard</li>';
      html += '      <li>Tint shadows warm: rgba(78,50,23,0.04) on featured CTAs</li>';
      html += '      <li>Keep the page predominantly white with subtle gray sections</li>';
      html += '      <li>Use Geist Mono for code, metadata, timestamps</li>';
      html += '      <li>Use WaldenburgFH bold uppercase only for specific labels</li>';
      html += '    </ul>';
      html += '  </div>';

      html += '  <div class="dd-card">';
      html += '    <div class="dd-card__heading dd-card__heading--dont">';
      html += '      <span class="dd-card__icon dd-card__icon--dont">✕</span> Don\'t';
      html += '    </div>';
      html += '    <ul class="dd-list">';
      html += '      <li>Don\'t use bold (700) Waldenburg for headings — weight 300 is non-negotiable</li>';
      html += '      <li>Don\'t use heavy shadows (>0.1 opacity) — the ethereal quality requires whisper-level depth</li>';
      html += '      <li>Don\'t use cool gray borders — the system is warm-tinted throughout</li>';
      html += '      <li>Don\'t skip the inset shadow component — half-pixel insets define edges</li>';
      html += '      <li>Don\'t apply negative letter-spacing to body text</li>';
      html += '      <li>Don\'t use sharp corners (<10px) on cards — 10px is the minimum radius</li>';
      html += '      <li>Don\'t introduce brand accent colors — the palette is intentionally achromatic</li>';
      html += '      <li>Don\'t make buttons opaque and heavy — warm translucent is the signature</li>';
      html += '      <li>Don\'t use emoji, Lucide, or icon libraries — only typography and geometry</li>';
      html += '    </ul>';
      html += '  </div>';

      html += '  </div>';
      html += '</div>';
