<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Spacing &amp; Rules — Discord</title>
  <link rel="stylesheet" href="../colors_and_type.css">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: var(--font-body, 'system-ui', sans-serif);
      background: var(--color-background-primary, #313338);
      color: var(--color-text-normal, #dbdee1);
      line-height: 1.6;
    }

    .page {
      max-width: 1200px;
      margin: 0 auto;
      padding: 96px 64px;
    }

    /* Header / Stage head */
    .header {
      margin-bottom: 96px;
      position: relative;
    }

    .header__kicker {
      font-family: var(--font-mono, 'ui-monospace', monospace);
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--color-channels-default, #80848e);
      margin-bottom: 16px;
    }

    .header__title {
      font-family: var(--font-display, 'system-ui', sans-serif);
      font-size: 64px;
      font-weight: 800;
      line-height: 1.1;
      letter-spacing: -0.02em;
      color: var(--color-text-normal, #dbdee1);
      margin-bottom: 12px;
      max-width: 90%;
    }

    .header__subtitle {
      font-family: var(--font-body, 'system-ui', sans-serif);
      font-size: 18px;
      font-weight: 400;
      line-height: 1.5;
      color: var(--color-text-muted, #949ba4);
      max-width: 75%;
      margin-bottom: 32px;
    }

    .header__rule {
      display: block;
      width: 80px;
      height: 4px;
      background: var(--paper, #5865f2);
      border: none;
      margin-top: 24px;
    }

    /* Section */
    .section {
      margin-bottom: 96px;
    }

    .section__label {
      font-family: var(--font-mono, 'ui-monospace', monospace);
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--color-channels-default, #80848e);
      margin-bottom: 40px;
      padding-bottom: 16px;
      border-bottom: 1px solid var(--color-background-secondary, #2b2d31);
    }

    /* Spacing scale */
    .spacing-row {
      display: grid;
      grid-template-columns: 100px 1fr 80px;
      gap: 24px;
      align-items: center;
      padding: 20px 0;
      border-bottom: 1px solid var(--color-background-secondary, #2b2d31);
    }

    .spacing-row:last-child {
      border-bottom: none;
    }

    .spacing-row__name {
      font-family: var(--font-mono, 'ui-monospace', monospace);
      font-size: 13px;
      font-weight: 600;
      color: var(--color-text-normal, #dbdee1);
    }

    .spacing-row__label {
      font-family: var(--font-body, 'system-ui', sans-serif);
      font-size: 12px;
      color: var(--color-text-muted, #949ba4);
      margin-top: 4px;
    }

    .spacing-row__bar-wrap {
      height: 32px;
      display: flex;
      align-items: center;
    }

    .spacing-row__bar {
      height: 3px;
      background: var(--paper, #5865f2);
      min-width: 3px;
      transition: opacity 0.2s ease;
      border-radius: 2px;
    }

    .spacing-row:hover .spacing-row__bar {
      opacity: 0.7;
    }

    .spacing-row__value {
      font-family: var(--font-mono, 'ui-monospace', monospace);
      font-size: 13px;
      font-weight: 600;
      color: var(--color-text-normal, #dbdee1);
      text-align: right;
    }

    /* Rule weights */
    .rule-demo {
      padding: 32px 0;
      border-bottom: 1px solid var(--color-background-secondary, #2b2d31);
    }

    .rule-demo:last-child {
      border-bottom: none;
    }

    .rule-demo__header {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      margin-bottom: 20px;
    }

    .rule-demo__name {
      font-family: var(--font-mono, 'ui-monospace', monospace);
      font-size: 13px;
      font-weight: 600;
      color: var(--color-text-normal, #dbdee1);
    }

    .rule-demo__label {
      font-family: var(--font-body, 'system-ui', sans-serif);
      font-size: 12px;
      color: var(--color-text-muted, #949ba4);
    }

    .rule-demo__spec {
      font-family: var(--font-mono, 'ui-monospace', monospace);
      font-size: 12px;
      color: var(--color-channels-default, #80848e);
    }

    .rule-demo__container {
      width: 100%;
      height: 48px;
      display: flex;
      align-items: center;
      padding: 0;
      background: var(--color-background-secondary, #2b2d31);
      border-radius: 4px;
      position: relative;
    }

    .rule-demo__line {
      width: 100%;
      border: none;
      border-radius: 0;
      margin: 0;
    }

    .rule-demo__line-label {
      position: absolute;
      left: 16px;
      top: 50%;
      transform: translateY(-50%);
      font-family: var(--font-mono, 'ui-monospace', monospace);
      font-size: 11px;
      color: var(--color-text-muted, #949ba4);
      pointer-events: none;
    }

    /* Border radius */
    .radius-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 64px;
      margin-bottom: 48px;
    }

    .radius-item {
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .radius-item__demo {
      display: flex;
      gap: 24px;
      align-items: flex-start;
    }

    .radius-item__box {
      width: 120px;
      height: 120px;
      background: var(--color-background-secondary, #2b2d31);
      border: 2px solid var(--paper, #5865f2);
      flex-shrink: 0;
      transition: all 0.2s ease;
    }

    .radius-item__box:hover {
      border-color: var(--color-text-normal, #dbdee1);
    }

    .radius-item__info {
      flex: 1;
    }

    .radius-item__name {
      font-family: var(--font-mono, 'ui-monospace', monospace);
      font-size: 13px;
      font-weight: 600;
      color: var(--color-text-normal, #dbdee1);
      margin-bottom: 6px;
    }

    .radius-item__value {
      font-family: var(--font-mono, 'ui-monospace', monospace);
      font-size: 12px;
      color: var(--paper, #5865f2);
      margin-bottom: 12px;
    }

    .radius-item__description {
      font-family: var(--font-body, 'system-ui', sans-serif);
      font-size: 14px;
      line-height: 1.5;
      color: var(--color-text-muted, #949ba4);
    }

    /* Depth philosophy block */
    .philosophy {
      background: var(--color-background-secondary, #2b2d31);
      padding: 48px;
      border: 1px solid var(--color-background-tertiary, #1e1f22);
      border-radius: 8px;
      margin-bottom: 64px;
    }

    .philosophy__title {
      font-family: var(--font-mono, 'ui-monospace', monospace);
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--color-channels-default, #80848e);
      margin-bottom: 16px;
    }

    .philosophy__text {
      font-family: var(--font-body, 'system-ui', sans-serif);
      font-size: 16px;
      line-height: 1.6;
      color: var(--color-text-normal, #dbdee1);
    }

    .philosophy__text strong {
      font-weight: 600;
      color: var(--paper, #5865f2);
    }

    .philosophy__text code {
      font-family: var(--font-mono, 'ui-monospace', monospace);
      background: rgba(88, 101, 242, 0.15);
      padding: 2px 6px;
      border-radius: 4px;
      color: var(--color-text-normal, #dbdee1);
      font-size: 14px;
    }

    /* Layout grid */
    .layout-grid {
      background: var(--color-background-secondary, #2b2d31);
      padding: 48px;
      border: 1px solid var(--color-background-tertiary, #1e1f22);
      border-radius: 8px;
      margin-bottom: 64px;
    }

    .layout-grid__title {
      font-family: var(--font-mono, 'ui-monospace', monospace);
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--color-channels-default, #80848e);
      margin-bottom: 24px;
    }

    .layout-grid__visual {
      display: grid;
      grid-template-columns: 72px 240px 1fr 240px;
      gap: 0;
      background: var(--color-background-tertiary, #1e1f22);
      border: 1px solid var(--color-background-floating, #111214);
      border-radius: 8px;
      overflow: hidden;
      margin-bottom: 24px;
      min-height: 300px;
    }

    .layout-grid__column {
      border-right: 1px solid var(--color-background-floating, #111214);
      padding: 24px 16px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      background: linear-gradient(180deg, rgba(88, 101, 242, 0.08) 0%, transparent 100%);
    }

    .layout-grid__column:last-child {
      border-right: none;
    }

    .layout-grid__label {
      font-family: var(--font-mono, 'ui-monospace', monospace);
      font-size: 11px;
      font-weight: 600;
      color: var(--color-channels-default, #80848e);
      text-transform: uppercase;
      letter-spacing: 0.06em;
      margin-bottom: 8px;
    }

    .layout-grid__value {
      font-family: var(--font-body, 'system-ui', sans-serif);
      font-size: 13px;
      color: var(--color-text-muted, #949ba4);
      text-align: center;
    }

    .layout-grid__info {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 24px;
    }

    .layout-grid__stat {
      font-family: var(--font-body, 'system-ui', sans-serif);
      font-size: 13px;
      color: var(--color-text-muted, #949ba4);
    }

    .layout-grid__stat-label {
      font-family: var(--font-mono, 'ui-monospace', monospace);
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--color-channels-default, #80848e);
      margin-bottom: 6px;
    }

    /* Status indicators */
    .status-demo {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 32px;
      margin-bottom: 48px;
    }

    .status-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
    }

    .status-item__avatar {
      width: 64px;
      height: 64px;
      border-radius: 16px;
      background: var(--paper, #5865f2);
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      border: 2px solid var(--color-background-primary, #313338);
    }

    .status-item__indicator {
      width: 20px;
      height: 20px;
      border-radius: 50%;
      position: absolute;
      bottom: -4px;
      right: -4px;
      border: 4px solid var(--color-background-primary, #313338);
    }

    .status-item__label {
      font-family: var(--font-body, 'system-ui', sans-serif);
      font-size: 13px;
      font-weight: 500;
      color: var(--color-text-normal, #dbdee1);
      text-align: center;
    }

    .status-item__description {
      font-family: var(--font-body, 'system-ui', sans-serif);
      font-size: 11px;
      color: var(--color-text-muted, #949ba4);
      text-align: center;
    }

    /* Loading */
    .loading {
      text-align: center;
      padding: 80px 24px;
      color: var(--color-text-muted, #949ba4);
      font-size: 16px;
    }

    .loading::after {
      content: '';
      display: block;
      width: 32px;
      height: 32px;
      margin: 16px auto 0;
      border: 2px solid rgba(88, 101, 242, 0.2);
      border-top-color: var(--paper, #5865f2);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    /* Responsive */
    @media (max-width: 1024px) {
      .page {
        padding: 64px 32px;
      }

      .header {
        margin-bottom: 64px;
      }

      .header__title {
        font-size: 48px;
        max-width: 100%;
      }

      .header__subtitle {
        max-width: 100%;
      }

      .section {
        margin-bottom: 64px;
      }

      .spacing-row {
        grid-template-columns: 90px 1fr 70px;
        gap: 16px;
      }

      .radius-grid {
        grid-template-columns: 1fr;
        gap: 40px;
      }

      .radius-item {
        flex-direction: row;
      }

      .layout-grid__visual {
        grid-template-columns: 60px 1fr;
      }

      .layout-grid__column:nth-child(n+3) {
        display: none;
      }

      .status-demo {
        grid-template-columns: repeat(2, 1fr);
      }
    }

    @media (max-width: 640px) {
      .page {
        padding: 48px 20px;
      }

      .header__title {
        font-size: 36px;
      }

      .header__subtitle {
        font-size: 16px;
      }

      .spacing-row {
        grid-template-columns: 80px 1fr 60px;
      }

      .layout-grid__info {
        grid-template-columns: 1fr;
      }

      .status-demo {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <div class="page" id="app">
    <div class="loading">Loading design tokens…</div>
  </div>

  <script>
    const DEFAULT_SPACING = {
      's-1': { value: '4px', label: 'xs' },
      's-2': { value: '8px', label: 'sm' },
      's-3': { value: '16px', label: 'md' },
      's-4': { value: '24px', label: 'lg' },
      's-5': { value: '32px', label: 'xl' },
      's-6': { value: '48px', label: '2xl' },
      's-7': { value: '64px', label: '3xl' },
      's-8': { value: '96px', label: '4xl' }
    };

    const DEFAULT_RULES = {
      'flat': { name: 'Flat', weight: 'none', treatment: 'none', use: 'Default canvas' },
      'border': { name: 'Border', weight: '1px', treatment: '1px solid var(--border)', use: 'Card, input, divider' },
      'elevated': { name: 'Elevated', weight: '0 2px 8px', treatment: '0 2px 8px rgba(0,0,0,0.08)', use: 'Popup, dropdown (soft)' }
    };

    const DEFAULT_RADIUS = {
      'none': { value: '0', label: '--radius-none', use: 'Not used; reserve for future' },
      'sm': { value: '4px', label: '--radius-sm', use: 'Input fields, small interactive elements' },
      'md': { value: '8px', label: '--radius-md', use: 'Cards, buttons, common UI' },
      'lg': { value: '16px', label: '--radius-lg', use: 'Server avatars, large panels' },
      'full': { value: '999px', label: '--radius-full', use: 'Status badges, pill buttons' }
    };

    ( window.__DESIGN_TOKENS__ ? Promise.resolve({ ok: true, json: () => Promise.resolve(window.__DESIGN_TOKENS__) }) : fetch('../tokens.json') )
      .then(r => {
        if (!r.ok) throw new Error('tokens.json not found (' + r.status + ')');
        return r.json();
      })
      .then(render)
      .catch(err => {
        document.getElementById('app').innerHTML =
          '<div class="loading" style="color:#f23f43">' +
          'Could not load tokens.json — ' + err.message + '</div>';
      });

    function render(tokens) {
      const app = document.getElementById('app');

      const spacing = {};
      if (tokens.spacing?.scale) {
        Object.entries(tokens.spacing.scale).forEach(([k, v]) => {
          spacing[k] = { value: v, label: k };
        });
      } else {
        Object.assign(spacing, DEFAULT_SPACING);
      }

      const rules = DEFAULT_RULES;
      const radius = DEFAULT_RADIUS;

      let html = '';

      /* Header / Stage head */
      html += '<header class="header">';
      html += '  <div class="header__kicker">Spacing &amp; Rules</div>';
      html += '  <h1 class="header__title">Tight chat rows.<br>Generous panels.</h1>';
      html += '  <p class="header__subtitle">The rhythm of Discord's UI — from 4px message padding to 240px sidebars — creates a density where information flows but never overwhelms.</p>';
      html += '  <hr class="header__rule">';
      html += '</header>';

      /* Philosophy block */
      html += '<div class="philosophy">';
      html += '  <div class="philosophy__title">Spacing Philosophy</div>';
      html += '  <div class="philosophy__text">';
      html += '    Discord's spacing is <strong>context-sensitive</strong>. Chat messages nest tight (4–8px between groups) to make hours of scrollback feel quick and scannable. But side panels (server rail, channels, members) breathe generous padding (16–24px) so they never feel cramped. The base unit is <strong>4px</strong>. All spacing is a multiple of 4 — 4, 8, 12, 16, 20, 24, 32, 40 — so layouts snap to a clean grid. <strong>Whitespace is motion</strong>: The space between elements isn't wasted; it's where the eye rests before the next data point. Tight where users focus (chat), open where they navigate (sidebar).';
      html += '  </div>';
      html += '</div>';

      /* Spacing scale */
      html += '<div class="section">';
      html += '  <div class="section__label">Spacing Scale</div>';

      const spacingEntries = Object.entries(spacing);
      const maxPx = Math.max(...spacingEntries.map(([, o]) => parseFloat(o.value) || 0), 1);

      spacingEntries.forEach(([key, obj]) => {
        const px = parseFloat(obj.value) || 0;
        const pct = Math.max((px / maxPx) * 100, 3);
        const label = obj.label || key;

        html += '<div class="spacing-row">';
        html += '  <div>';
        html += '    <div class="spacing-row__name">' + esc(key) + '</div>';
        html += '    <div class="spacing-row__label">' + esc(label) + '</div>';
        html += '  </div>';
        html += '  <div class="spacing-row__bar-wrap">';
        html += '    <div class="spacing-row__bar" style="width:' + pct + '%"></div>';
        html += '  </div>';
        html += '  <div class="spacing-row__value">' + esc(obj.value) + '</div>';
        html += '</div>';
      });

      html += '</div>';

      /* Layout diagram */
      html += '<div class="section">';
      html += '  <div class="section__label">Layout System</div>';
      html += '  <div class="layout-grid">';
      html += '    <div class="layout-grid__title">Discord Desktop Layout</div>';
      html += '    <div class="layout-grid__visual">';
      html += '      <div class="layout-grid__column">';
      html += '        <div class="layout-grid__label">Rail</div>';
      html += '        <div class="layout-grid__value">72px</div>';
      html += '      </div>';
      html += '      <div class="layout-grid__column">';
      html += '        <div class="layout-grid__label">Sidebar</div>';
      html += '        <div class="layout-grid__value">240px</div>';
      html += '      </div>';
      html += '      <div class="layout-grid__column">';
      html += '        <div class="layout-grid__label">Chat</div>';
      html += '        <div class="layout-grid__value">Fluid (min 380px)</div>';
      html += '      </div>';
      html += '      <div class="layout-grid__column">';
      html += '        <div class="layout-grid__label">Members</div>';
      html += '        <div class="layout-grid__value">240px</div>';
      html += '      </div>';
      html += '    </div>';
      html += '    <div class="layout-grid__info">';
      html += '      <div>';
      html += '        <div class="layout-grid__stat-label">Server Rail</div>';
      html += '        <div class="layout-grid__stat">72px fixed width. Rounded-square server avatars at 48px, hovering to circles via 350ms morph.</div>';
      html += '      </div>';
      html += '      <div>';
      html += '        <div class="layout-grid__stat-label">Channel Sidebar</div>';
      html += '        <div class="layout-grid__stat">240px. Nested channels, categories, direct messages. 16px top/bottom padding.</div>';
      html += '      </div>';
      html += '      <div>';
      html += '        <div class="layout-grid__stat-label">Chat Column</div>';
      html += '        <div class="layout-grid__stat">Fluid, minimum 380px. Message density (4–8px row gaps). 16px horizontal gutters.</div>';
      html += '      </div>';
      html += '      <div>';
      html += '        <div class="layout-grid__stat-label">Member List</div>';
      html += '        <div class="layout-grid__stat">240px. Scrollable user roster with presence indicators. Toggle-able on mobile.</div>';
      html += '      </div>';
      html += '    </div>';
      html += '  </div>';
      html += '</div>';

      /* Rule weights / Depth */
      html += '<div class="section">';
      html += '  <div class="section__label">Depth &amp; Borders</div>';

      Object.entries(rules).forEach(([key, rule]) => {
        const weight = rule.weight;

        html += '<div class="rule-demo">';
        html += '  <div class="rule-demo__header">';
        html += '    <div>';
        html += '      <div class="rule-demo__name">' + esc(rule.name) + '</div>';
        html += '      <div class="rule-demo__label">' + esc(rule.use) + '</div>';
        html += '    </div>';
        html += '    <div class="rule-demo__spec">' + esc(rule.treatment) + '</div>';
        html += '  </div>';

        if (weight === 'none') {
          html += '  <div class="rule-demo__container" style="background: var(--color-background-primary, #313338);">';
          html += '    <div class="rule-demo__line-label">Flat (no border or shadow)</div>';
          html += '  </div>';
        } else if (weight.includes('px')) {
          html += '  <div class="rule-demo__container">';
          html += '    <div class="rule-demo__line" style="height:' + parseFloat(weight) + 'px; background:var(--color-background-floating, #111214); border: ' + esc(rule.treatment.replace('0 2px 8px', '')) + '"></div>';
          html += '  </div>';
        } else {
          html += '  <div class="rule-demo__container" style="box-shadow: ' + esc(rule.treatment) + ';">';
          html += '    <div class="rule-demo__line-label">Soft shadow (80–350ms fade)</div>';
          html += '  </div>';
        }

        html += '</div>';
      });

      html += '</div>';

      /* Border radius */
      html += '<div class="section">';
      html += '  <div class="section__label">Border Radius</div>';
      html += '  <p style="font-family: var(--font-body); font-size: 15px; color: var(--color-text-muted); line-height: 1.6; margin-bottom: 40px;">Rounded-square corners define Discord's friendliness. Cards and buttons at 8px; server avatars morph from 16px rounded-square to full circles (radius-full) on hover via a snappy 350ms easing.</p>';

      Object.entries(radius).forEach(([key, obj]) => {
        const radiusValue = obj.value;

        html += '<div class="radius-item">';
        html += '  <div class="radius-item__demo">';
        html += '    <div class="radius-item__box" style="border-radius: ' + esc(radiusValue) + '"></div>';
        html += '  </div>';
        html += '  <div class="radius-item__info">';
        html += '    <div class="radius-item__name">' + esc(obj.label) + '</div>';
        html += '    <div class="radius-item__value">' + esc(radiusValue) + '</div>';
        html += '    <div class="radius-item__description">' + esc(obj.use) + '</div>';
        html += '  </div>';
        html += '</div>';
      });
