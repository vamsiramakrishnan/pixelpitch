<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Spacing &amp; Rules</title>
  <link rel="stylesheet" href="../colors_and_type.css">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: var(--font-body, system-ui, sans-serif);
      background: var(--paper, #ffffff);
      color: var(--ink, #111111);
      line-height: 1.6;
    }

    .page {
      max-width: 1100px;
      margin: 0 auto;
      padding: 64px 32px;
    }

    /* Header */
    .header {
      margin-bottom: 64px;
    }
    .header__title {
      font-family: var(--font-display, system-ui, sans-serif);
      font-size: 48px;
      font-weight: 700;
      line-height: 1.15;
      letter-spacing: -0.02em;
      color: var(--ink, #111111);
      margin-bottom: 12px;
    }
    .header__subtitle {
      font-size: 18px;
      color: var(--slate, #666666);
      font-weight: 400;
    }
    .header__rule {
      display: block;
      width: 80px;
      height: 3px;
      background: var(--signal, #3b82f6);
      border: none;
      margin-top: 24px;
      border-radius: 2px;
    }

    /* Section */
    .section {
      margin-bottom: 56px;
    }
    .section__label {
      font-family: var(--font-display, system-ui, sans-serif);
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--slate, #666666);
      margin-bottom: 24px;
      padding-bottom: 12px;
      border-bottom: 1px solid var(--border, #e5e5e5);
    }

    /* Spacing scale */
    .spacing-row {
      display: grid;
      grid-template-columns: 100px 1fr 80px;
      gap: 16px;
      align-items: center;
      padding: 12px 0;
      border-bottom: 1px solid var(--border, #e5e5e5);
    }
    .spacing-row:last-child {
      border-bottom: none;
    }

    .spacing-row__name {
      font-family: var(--font-mono, ui-monospace, monospace);
      font-size: 13px;
      color: var(--ink, #111111);
      font-weight: 600;
    }

    .spacing-row__bar-wrap {
      height: 32px;
      display: flex;
      align-items: center;
    }
    .spacing-row__bar {
      height: 100%;
      background: var(--signal, #3b82f6);
      border-radius: 4px;
      opacity: 0.2;
      min-width: 2px;
      transition: opacity 0.15s ease;
    }
    .spacing-row:hover .spacing-row__bar {
      opacity: 0.4;
    }

    .spacing-row__value {
      font-family: var(--font-mono, ui-monospace, monospace);
      font-size: 13px;
      color: var(--slate, #666666);
      text-align: right;
      font-weight: 500;
    }

    /* Rule weights */
    .rule-demo {
      padding: 20px 0;
      border-bottom: 1px solid var(--border, #e5e5e5);
    }
    .rule-demo:last-child {
      border-bottom: none;
    }
    .rule-demo__header {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      margin-bottom: 12px;
    }
    .rule-demo__name {
      font-family: var(--font-mono, ui-monospace, monospace);
      font-size: 14px;
      font-weight: 600;
      color: var(--ink, #111111);
    }
    .rule-demo__spec {
      font-family: var(--font-mono, ui-monospace, monospace);
      font-size: 12px;
      color: var(--slate, #666666);
    }
    .rule-demo__line {
      width: 100%;
      border: none;
      border-radius: 1px;
    }

    /* Border radius */
    .radius-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
      gap: 24px;
    }
    .radius-item {
      text-align: center;
    }
    .radius-item__box {
      width: 100%;
      aspect-ratio: 1 / 1;
      max-width: 120px;
      margin: 0 auto 12px;
      background: var(--surface, #f5f5f5);
      border: 2px solid var(--signal, #3b82f6);
      opacity: 0.6;
      transition: opacity 0.15s ease;
    }
    .radius-item:hover .radius-item__box {
      opacity: 1;
    }
    .radius-item__name {
      font-family: var(--font-mono, ui-monospace, monospace);
      font-size: 13px;
      font-weight: 600;
      color: var(--ink, #111111);
      margin-bottom: 2px;
    }
    .radius-item__value {
      font-family: var(--font-mono, ui-monospace, monospace);
      font-size: 12px;
      color: var(--slate, #666666);
    }

    /* Depth/elevation demos */
    .depth-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
      gap: 24px;
    }
    .depth-item {
      padding: 32px 24px;
      background: var(--paper, #ffffff);
      border-radius: var(--radius-md, 8px);
      text-align: center;
      transition: transform 0.15s ease;
    }
    .depth-item:hover {
      transform: translateY(-2px);
    }
    .depth-item__name {
      font-family: var(--font-mono, ui-monospace, monospace);
      font-size: 13px;
      font-weight: 600;
      color: var(--ink, #111111);
      margin-bottom: 8px;
    }
    .depth-item__spec {
      font-family: var(--font-mono, ui-monospace, monospace);
      font-size: 11px;
      color: var(--slate, #666666);
      word-break: break-all;
      line-height: 1.4;
    }

    /* Loading */
    .loading {
      text-align: center;
      padding: 80px 24px;
      color: var(--slate, #666666);
      font-size: 16px;
    }
    .loading::after {
      content: '';
      display: block;
      width: 32px;
      height: 32px;
      margin: 16px auto 0;
      border: 3px solid var(--border, #e5e5e5);
      border-top-color: var(--signal, #3b82f6);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    @media (max-width: 600px) {
      .page {
        padding: 48px 20px;
      }
      .header__title {
        font-size: 36px;
      }
      .spacing-row {
        grid-template-columns: 80px 1fr 60px;
        gap: 8px;
      }
    }
  </style>
</head>
<body>
  <div class="page" id="app">
    <div class="loading">Loading design tokens&hellip;</div>
  </div>

  <script>
    /* Default spacing scale */
    const DEFAULT_SPACING = {
      's-1': '4px',
      's-2': '8px',
      's-3': '16px',
      's-4': '24px',
      's-5': '32px',
      's-6': '48px',
      's-7': '64px',
      's-8': '96px',
    };

    /* Default depth levels */
    const DEFAULT_DEPTH = {
      'Flat': { weight: '0px', color: 'transparent' },
      'Border': { weight: '1px', color: 'var(--border, #e5e5e5)' },
      'Elevated': { weight: '2px', color: 'var(--signal, #3b82f6)' },
    };

    /* Default border radius */
    const DEFAULT_RADIUS = {
      'none': '0',
      'sm': '4px',
      'md': '8px',
      'lg': '16px',
      'full': '999px',
    };

    ( window.__DESIGN_TOKENS__ ? Promise.resolve({ ok: true, json: () => Promise.resolve(window.__DESIGN_TOKENS__) }) : fetch('../tokens.json') )
      .then(r => {
        if (!r.ok) throw new Error('tokens.json not found (' + r.status + ')');
        return r.json();
      })
      .then(render)
      .catch(err => {
        document.getElementById('app').innerHTML =
          '<div class="loading" style="color:#dc2626">' +
          'Could not load tokens.json &mdash; ' + err.message + '</div>';
      });

    function render(tokens) {
      const app = document.getElementById('app');
      const name = tokens.meta?.title || tokens.meta?.name || tokens.name || 'Artistic';

      /* Load Google Fonts if available */
      const gfUrl = tokens.googleFontsUrl || (tokens.fonts && tokens.fonts.googleUrl);
      if (gfUrl) {
        const link = document.createElement('link');
        link.rel = 'stylesheet';
        link.href = gfUrl;
        document.head.appendChild(link);
      }

      /* Extract spacing scale */
      const spacing = tokens.spacing?.scale || DEFAULT_SPACING;
      
      /* Build depth from tokens */
      let depth = {};
      if (tokens.depth && Array.isArray(tokens.depth)) {
        tokens.depth.forEach(d => {
          const name = d.name || 'Depth ' + d.level;
          depth[name] = { weight: '1px', color: 'var(--border, #e5e5e5)' };
          
          if (d.treatment === 'none') {
            depth[name] = { weight: '0px', color: 'transparent' };
          } else if (d.treatment && d.treatment.includes('shadow')) {
            depth[name] = { weight: '2px', color: 'var(--signal, #3b82f6)' };
          } else if (d.treatment && d.treatment.includes('solid')) {
            depth[name] = { weight: '1px', color: 'var(--border, #e5e5e5)' };
          }
        });
      }
      if (Object.keys(depth).length === 0) {
        depth = DEFAULT_DEPTH;
      }

      const radius = tokens.radii || DEFAULT_RADIUS;
      const shadows = tokens.shadows || tokens.elevation || null;

      let html = '';

      /* Header */
      html += '<header class="header">';
      html += '  <h1 class="header__title">Spacing &amp; Rules</h1>';
      html += '  <p class="header__subtitle">The structural foundation of ' + esc(name) + '.</p>';
      html += '  <hr class="header__rule">';
      html += '</header>';

      /* ---- Spacing scale ---- */
      html += '<div class="section">';
      html += '  <div class="section__label">Spacing Scale</div>';

      const spacingEntries = Object.entries(spacing);
      const maxPx = Math.max(...spacingEntries.map(([, v]) => parseFloat(v) || 0), 1);

      spacingEntries.forEach(([key, value]) => {
        const px = parseFloat(value) || 0;
        const pct = Math.max((px / maxPx) * 100, 1);
        html += '<div class="spacing-row">';
        html += '  <div class="spacing-row__name">--' + esc(key) + '</div>';
        html += '  <div class="spacing-row__bar-wrap">';
        html += '    <div class="spacing-row__bar" style="width:' + pct + '%"></div>';
        html += '  </div>';
        html += '  <div class="spacing-row__value">' + esc(value) + '</div>';
        html += '</div>';
      });

      html += '</div>';

      /* ---- Rule weights ---- */
      html += '<div class="section">';
      html += '  <div class="section__label">Depth Levels</div>';

      const depthEntries = Object.entries(depth);
      depthEntries.forEach(([key, val]) => {
        const weight = (typeof val === 'object' ? val.weight : val) || '1px';
        const color  = (typeof val === 'object' ? val.color  : null) || 'var(--border, #e5e5e5)';
        const weightNum = parseFloat(weight) || 1;

        html += '<div class="rule-demo">';
        html += '  <div class="rule-demo__header">';
        html += '    <span class="rule-demo__name">' + esc(key) + '</span>';
        html += '    <span class="rule-demo__spec">' + esc(weight) + '</span>';
        html += '  </div>';
        
        if (weight === '0px') {
          html += '  <div style="height:2px;background:var(--bone, #f5f5f5);border-radius:1px;border:1px dashed var(--border, #e5e5e5)"></div>';
        } else {
          html += '  <hr class="rule-demo__line" style="height:' + weightNum + 'px;background:' + color + '">';
        }
        
        html += '</div>';
      });

      html += '</div>';

      /* ---- Border radius ---- */
      html += '<div class="section">';
      html += '  <div class="section__label">Border Radius</div>';
      html += '  <div class="radius-grid">';

      Object.entries(radius).forEach(([key, value]) => {
        html += '<div class="radius-item">';
        html += '  <div class="radius-item__box" style="border-radius:' + esc(value) + '"></div>';
        html += '  <div class="radius-item__name">--radius-' + esc(key) + '</div>';
        html += '  <div class="radius-item__value">' + esc(value) + '</div>';
        html += '</div>';
      });

      html += '  </div>';
      html += '</div>';

      /* ---- Shadows / elevation (if present) ---- */
      if (shadows && Object.keys(shadows).length > 0) {
        html += '<div class="section">';
        html += '  <div class="section__label">Elevation</div>';
        html += '  <div class="depth-grid">';

        Object.entries(shadows).forEach(([key, value]) => {
          const shadowVal = typeof value === 'object' ? value.value || value.shadow : value;
          html += '<div class="depth-item" style="box-shadow:' + shadowVal + '">';
          html += '  <div class="depth-item__name">' + esc(key) + '</div>';
          html += '  <div class="depth-item__spec">' + esc(String(shadowVal).substring(0, 80)) + '</div>';
          html += '</div>';
        });

        html += '  </div>';
        html += '</div>';
      }

      app.innerHTML = html;
    }

    function esc(s) {
      const d = document.createElement('div');
      d.textContent = String(s);
      return d.innerHTML;
    }
  </script>
</body>
</html>
