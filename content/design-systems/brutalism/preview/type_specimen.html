<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Type Specimen — Brutalism</title>
  <link rel="stylesheet" href="../colors_and_type.css">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: var(--font-body, system-ui, sans-serif);
      background: var(--paper, #ffffff);
      color: var(--ink, #111111);
      line-height: 1.6;
    }

    .page {
      max-width: 1100px;
      margin: 0 auto;
      padding: 96px 48px;
    }

    @media (max-width: 768px) {
      .page {
        padding: 64px 32px;
      }
    }

    @media (max-width: 480px) {
      .page {
        padding: 48px 24px;
      }
    }

    /* Header */
    .header {
      margin-bottom: 96px;
    }

    .header__kicker {
      font-family: var(--font-mono, ui-monospace, monospace);
      font-size: 14px;
      font-weight: 700;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--signal, #3b82f6);
      margin-bottom: 16px;
    }

    .header__title {
      font-family: var(--font-display, system-ui, sans-serif);
      font-size: 96px;
      font-weight: 900;
      line-height: 0.95;
      letter-spacing: -0.02em;
      color: var(--ink, #111111);
      margin-bottom: 24px;
    }

    .header__subtitle {
      font-family: var(--font-body, system-ui, sans-serif);
      font-size: 22px;
      font-weight: 400;
      line-height: 1.55;
      color: var(--slate, #666666);
      max-width: 680px;
      margin-bottom: 32px;
    }

    .header__rule {
      display: block;
      width: 96px;
      height: 2px;
      background: var(--ink, #111111);
      border: none;
      margin: 0;
    }

    /* Font families section */
    .font-families {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 32px;
      margin-bottom: 96px;
      margin-top: 64px;
    }

    .font-card {
      background: transparent;
      border: 2px solid var(--ink, #111111);
      border-radius: 0;
      padding: 32px;
    }

    .font-card__label {
      font-family: var(--font-mono, ui-monospace, monospace);
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--signal, #3b82f6);
      margin-bottom: 12px;
    }

    .font-card__name {
      font-family: var(--font-display, system-ui, sans-serif);
      font-size: 36px;
      font-weight: 900;
      line-height: 1.1;
      color: var(--ink, #111111);
      margin-bottom: 8px;
    }

    .font-card__fallback {
      font-family: var(--font-mono, ui-monospace, monospace);
      font-size: 12px;
      color: var(--slate, #666666);
      word-break: break-word;
      font-weight: 400;
    }

    /* Character set block */
    .charmap-block {
      background: var(--bone, #f5f5f5);
      border: 2px solid var(--ink, #111111);
      border-radius: 0;
      padding: 48px;
      margin-bottom: 96px;
    }

    .charmap-block__label {
      font-family: var(--font-mono, ui-monospace, monospace);
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--signal, #3b82f6);
      margin-bottom: 24px;
    }

    .charmap-block__chars {
      font-family: var(--font-display, system-ui, sans-serif);
      font-size: 32px;
      font-weight: 900;
      line-height: 1.8;
      letter-spacing: 0.02em;
      color: var(--ink, #111111);
      word-break: break-word;
    }

    /* Section label */
    .section-label {
      font-family: var(--font-mono, ui-monospace, monospace);
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--signal, #3b82f6);
      margin-bottom: 32px;
      padding-bottom: 16px;
      border-bottom: 2px solid var(--ink, #111111);
    }

    /* Ramp row */
    .ramp-row {
      display: grid;
      grid-template-columns: 280px 1fr;
      gap: 48px;
      align-items: baseline;
      padding: 32px 0;
      border-bottom: 1px solid var(--border, #e5e5e5);
    }

    .ramp-row:last-child {
      border-bottom: none;
    }

    @media (max-width: 800px) {
      .ramp-row {
        grid-template-columns: 1fr;
        gap: 16px;
      }
    }

    /* Left meta column */
    .ramp-meta__role {
      font-family: var(--font-display, system-ui, sans-serif);
      font-size: 18px;
      font-weight: 700;
      color: var(--ink, #111111);
      margin-bottom: 8px;
    }

    .ramp-meta__detail {
      font-family: var(--font-mono, ui-monospace, monospace);
      font-size: 11px;
      font-weight: 600;
      line-height: 1.8;
      color: var(--slate, #666666);
      letter-spacing: 0.02em;
    }

    /* Right sample column */
    .ramp-sample {
      color: var(--ink, #111111);
      overflow-wrap: break-word;
      word-spacing: 0.1em;
    }

    /* Ramp section */
    .ramp-section {
      margin-bottom: 96px;
    }

    /* Weight spectrum */
    .weight-spectrum {
      margin-bottom: 96px;
    }

    .weight-spectrum__label {
      font-family: var(--font-mono, ui-monospace, monospace);
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--signal, #3b82f6);
      margin-bottom: 32px;
      padding-bottom: 16px;
      border-bottom: 2px solid var(--ink, #111111);
    }

    .weight-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 24px;
    }

    .weight-card {
      background: var(--bone, #f5f5f5);
      border: 1px solid var(--border, #e5e5e5);
      padding: 24px;
    }

    .weight-card__value {
      font-family: var(--font-mono, ui-monospace, monospace);
      font-size: 11px;
      font-weight: 700;
      color: var(--signal, #3b82f6);
      margin-bottom: 12px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .weight-card__sample {
      font-family: var(--font-display, system-ui, sans-serif);
      font-size: 32px;
      line-height: 1.2;
      color: var(--ink, #111111);
    }

    /* Drop cap demo */
    .dropcap-demo {
      margin-bottom: 96px;
    }

    .dropcap-demo__label {
      font-family: var(--font-mono, ui-monospace, monospace);
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--signal, #3b82f6);
      margin-bottom: 32px;
      padding-bottom: 16px;
      border-bottom: 2px solid var(--ink, #111111);
    }

    .dropcap-container {
      background: var(--bone, #f5f5f5);
      border: 2px solid var(--ink, #111111);
      padding: 48px;
      max-width: 680px;
    }

    .dropcap-para {
      font-family: var(--font-body, system-ui, sans-serif);
      font-size: 18px;
      font-weight: 400;
      line-height: 1.7;
      color: var(--ink, #111111);
      margin: 0;
      text-align: left;
    }

    .dropcap {
      float: left;
      font-family: var(--font-display, system-ui, sans-serif);
      font-size: 96px;
      font-weight: 900;
      line-height: 0.8;
      color: var(--signal, #3b82f6);
      margin-right: 8px;
      margin-top: 0;
    }

    /* Loading */
    .loading {
      text-align: center;
      padding: 160px 48px;
      color: var(--slate, #666666);
      font-family: var(--font-body, system-ui, sans-serif);
      font-size: 18px;
    }

    .loading::after {
      content: '';
      display: block;
      width: 32px;
      height: 32px;
      margin: 24px auto 0;
      border: 2px solid var(--border, #e5e5e5);
      border-top-color: var(--signal, #3b82f6);
      border-radius: 0;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div class="page" id="app">
    <div class="loading">Loading design tokens&hellip;</div>
  </div>

  <script>
    const EDITORIAL_SAMPLES = [
      'Raw forms demand raw typography.',
      'Brutalism strips away the ornamental.',
      'Every pixel serves a structural purpose.',
      'Constraint breeds clarity and confidence.',
      'Weight carries meaning through deliberation.',
      'Anti-design is design made visible.',
      'Concrete never apologizes for its form.',
      'Bold systems require bold choices.',
      'Function precedes and follows all aesthetics.',
      'Reduce to essentials. Then reduce again.',
    ];

    const DROPCAP_TEXT = 'Brutalism rejects ornamentation. In typography, this means weight becomes the primary tool of expression. A nine-weight system—from Thin to Black—allows designers to build hierarchy through mass and presence rather than color or decorative effects. This is ruthlessly functional. Display faces carry maximum weight. Body text breathes at lighter weights. Monospace handles metadata with mechanical precision. There are no roundings, no flourishes, no soft edges. The typeface itself is the design statement. System interfaces should reflect this philosophy: bold, direct, and unapologetic about their structural decisions.';

    fetch('../tokens.json')
      .then(r => {
        if (!r.ok) throw new Error('tokens.json not found (' + r.status + ')');
        return r.json();
      })
      .then(render)
      .catch(err => {
        document.getElementById('app').innerHTML =
          '<div class="loading" style="color:#3b82f6">' +
          'Could not load tokens.json — ' + err.message + '</div>';
      });

    function render(tokens) {
      const app = document.getElementById('app');
      const title = tokens.meta?.title || 'Design System';
      const summary = tokens.meta?.summary || '';

      const fonts = tokens.typography || {};
      const ramp = tokens.typography?.ramp || [];

      let html = '';

      /* Header */
      html += '<header class="header">';
      html += '  <div class="header__kicker">Type Specimen</div>';
      html += '  <h1 class="header__title">' + esc(title) + '</h1>';
      html += '  <p class="header__subtitle">' + esc(summary) + '</p>';
      html += '  <hr class="header__rule">';
      html += '</header>';

      /* Font families */
      const families = [
        { label: 'Display & Heading', name: 'Darker Grotesque', fallback: 'system-ui, sans-serif' },
        { label: 'Body', name: 'Darker Grotesque', fallback: 'system-ui, sans-serif' },
        { label: 'Monospace', name: 'JetBrains Mono', fallback: 'ui-monospace, monospace' }
      ];

      html += '<div class="font-families">';
      families.forEach(f => {
        html += '<div class="font-card">';
        html += '  <div class="font-card__label">' + esc(f.label) + '</div>';
        html += '  <div class="font-card__name">' + esc(f.name) + '</div>';
        html += '  <div class="font-card__fallback">' + esc(f.fallback) + '</div>';
        html += '</div>';
      });
      html += '</div>';

      /* Character set */
      html += '<div class="charmap-block">';
      html += '  <div class="charmap-block__label">Character Set — Weight 900</div>';
      html += '  <div class="charmap-block__chars" style="font-family:var(--font-display);font-weight:900">';
      html += '    ABCDEFGHIJKLMNOPQRSTUVWXYZ<br>';
      html += '    abcdefghijklmnopqrstuvwxyz<br>';
      html += '    0123456789 !@#$%&amp;*()&ndash;&mdash;&lsquo;&rsquo;&ldquo;&rdquo;';
      html += '  </div>';
      html += '</div>';

      /* Weight spectrum */
      html += '<div class="weight-spectrum">';
      html += '<div class="weight-spectrum__label">Nine-Weight System</div>';
      html += '<div class="weight-grid">';
      const weights = [100, 200, 300, 400, 500, 600, 700, 800, 900];
      const weightNames = ['Thin', 'Extra Light', 'Light', 'Regular', 'Medium', 'Semi Bold', 'Bold', 'Extra Bold', 'Black'];
      weights.forEach((w, i) => {
        html += '<div class="weight-card">';
        html += '  <div class="weight-card__value">' + weightNames[i] + ' / ' + w + '</div>';
        html += '  <div class="weight-card__sample" style="font-family:var(--font-display);font-weight:' + w + '">System</div>';
        html += '</div>';
      });
      html += '</div>';
      html += '</div>';

      /* Type ramp */
      if (ramp.length) {
        html += '<div class="ramp-section">';
        html += '<div class="section-label">Type Ramp</div>';
        ramp.forEach((entry, i) => {
          html += rampRow(entry, i);
        });
        html += '</div>';
      } else {
        /* Fallback ramp if tokens don't define one */
        html += '<div class="ramp-section">';
        html += '<div class="section-label">Responsive Type Scale</div>';
        const fallbackRamp = [
          { role: 'Hero', size: '96px', weight: 900, fontKey: 'display', lh: '0.95' },
          { role: 'Display 1', size: '72px', weight: 800, fontKey: 'display', lh: '1.1' },
          { role: 'Display 2', size: '56px', weight: 700, fontKey: 'display', lh: '1.15' },
          { role: 'Headline', size: '48px', weight: 700, fontKey: 'display', lh: '1.2' },
          { role: 'Subheading', size: '32px', weight: 600, fontKey: 'display', lh: '1.3' },
          { role: 'Title', size: '24px', weight: 600, fontKey: 'display', lh: '1.35' },
          { role: 'Body Large', size: '20px', weight: 400, fontKey: 'body', lh: '1.6' },
          { role: 'Body', size: '16px', weight: 400, fontKey: 'body', lh: '1.6' },
          { role: 'Body Small', size: '14px', weight: 400, fontKey: 'body', lh: '1.65' },
          { role: 'Label', size: '12px', weight: 600, fontKey: 'mono', lh: '1.5' },
          { role: 'Caption', size: '12px', weight: 400, fontKey: 'body', lh: '1.5' },
        ];
        fallbackRamp.forEach((entry, i) => {
          html += rampRow(entry, i);
        });
        html += '</div>';
      }

      /* Drop cap demo */
      html += '<div class="dropcap-demo">';
      html += '<div class="dropcap-demo__label">Drop Cap — 96px Weight 900, Signal Blue</div>';
      html += '<div class="dropcap-container">';
      const firstChar = DROPCAP_TEXT.charAt(0);
      const restText = DROPCAP_TEXT.substring(1);
      html += '<p class="dropcap-para">';
      html += '<span class="dropcap">' + esc(firstChar) + '</span>';
      html += esc(restText);
      html += '</p>';
      html += '</div>';
      html += '</div>';

      app.innerHTML = html;
    }

    function rampRow(entry, idx) {
      const role = entry.role || 'Role ' + (idx + 1);
      const size = entry.size || '16px';
      const weight = entry.weight || 400;
      const lh = entry.lineHeight || entry.lh || '1.5';
      const ls = entry.letterSpacing || '0';

      let fontFamily = 'var(--font-body)';
      if (entry.fontKey === 'display') fontFamily = 'var(--font-display)';
      else if (entry.fontKey === 'mono') fontFamily = 'var(--font-mono)';

      const sizeNum = parseFloat(size);
      const sampleIdx = idx % EDITORIAL_SAMPLES.length;
      let sample = EDITORIAL_SAMPLES[sampleIdx];

      /* Truncate very large samples */
      if (sizeNum >= 72) {
        sample = sample.split('.')[0].slice(0, 40);
        if (!sample.endsWith('.')) sample += '.';
      }

      let fontStyle = 'font-size:' + size + ';font-weight:' + weight + ';line-height:' + lh + ';';
      fontStyle += 'font-family:' + fontFamily + ';';
      if (ls && ls !== '0' && ls !== 'normal') fontStyle += 'letter-spacing:' + ls + ';';

      let meta = esc(size) + ' / ' + esc(String(weight));
      meta += '\n' + fontFamilyLabel(entry.fontKey);
      meta += '\nline-height: ' + esc(String(lh));
      if (ls && ls !== '0' && ls !== 'normal') meta += '\nletter-spacing: ' + esc(ls);

      return '' +
        '<div class="ramp-row">' +
        '  <div class="ramp-meta">' +
        '    <div class="ramp-meta__role">' + esc(role) + '</div>' +
        '    <pre class="ramp-meta__detail">' + meta + '</pre>' +
        '  </div>' +
        '  <div class="ramp-sample" style="' + fontStyle + '">' + esc(sample) + '</div>' +
        '</div>';
    }

    function fontFamilyLabel(key) {
      const map = {
        'display': 'Darker Grotesque',
        'body': 'Darker Grotesque',
        'mono': 'JetBrains Mono'
      };
      return map[key] || 'System UI';
    }

    function esc(s) {
      const d = document.createElement('div');
      d.textContent = String(s);
      return d.innerHTML;
    }
  </script>
</body>
</html>
