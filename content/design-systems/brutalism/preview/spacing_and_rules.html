<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Spacing &amp; Rules — Brutalism</title>
  <link rel="stylesheet" href="../colors_and_type.css">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: var(--font-body);
      background: var(--paper);
      color: var(--ink);
      line-height: 1.6;
    }

    .page {
      max-width: 1100px;
      margin: 0 auto;
      padding: var(--s-7) var(--s-5);
    }

    /* Header */
    .header {
      margin-bottom: var(--s-7);
    }

    .header__title {
      font-family: var(--font-display);
      font-size: 52px;
      font-weight: 700;
      line-height: 1.1;
      letter-spacing: -0.01em;
      color: var(--ink);
      margin-bottom: var(--s-2);
      text-transform: uppercase;
    }

    .header__subtitle {
      font-size: 16px;
      color: var(--slate);
      font-weight: 400;
      margin-bottom: var(--s-3);
    }

    .header__rule {
      display: block;
      width: 100%;
      height: 2px;
      background: var(--ink);
      border: none;
      margin-top: var(--s-4);
    }

    /* Section */
    .section {
      margin-bottom: var(--s-7);
    }

    .section__label {
      font-family: var(--font-display);
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--ink);
      margin-bottom: var(--s-4);
      padding-bottom: var(--s-3);
      border-bottom: 2px solid var(--ink);
    }

    /* Spacing scale */
    .spacing-row {
      display: grid;
      grid-template-columns: 120px 1fr 100px;
      gap: var(--s-3);
      align-items: center;
      padding: var(--s-3) 0;
      border-bottom: 1px solid var(--border);
    }

    .spacing-row:last-child {
      border-bottom: none;
    }

    .spacing-row__name {
      font-family: var(--font-mono);
      font-size: 14px;
      color: var(--ink);
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .spacing-row__bar-wrap {
      height: 32px;
      display: flex;
      align-items: center;
      background: var(--bone);
      border: 1px solid var(--border);
      padding: var(--s-2);
    }

    .spacing-row__bar {
      height: 100%;
      background: var(--signal);
      opacity: 0.8;
      min-width: 1px;
      transition: opacity 0.2s ease;
    }

    .spacing-row:hover .spacing-row__bar {
      opacity: 1;
    }

    .spacing-row__value {
      font-family: var(--font-mono);
      font-size: 13px;
      color: var(--slate);
      text-align: right;
      font-weight: 600;
    }

    /* Rule weights */
    .rule-demo {
      padding: var(--s-4) 0;
      border-bottom: 1px solid var(--border);
    }

    .rule-demo:last-child {
      border-bottom: none;
    }

    .rule-demo__header {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      margin-bottom: var(--s-3);
      gap: var(--s-3);
    }

    .rule-demo__name {
      font-family: var(--font-mono);
      font-size: 14px;
      font-weight: 700;
      color: var(--ink);
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .rule-demo__spec {
      font-family: var(--font-mono);
      font-size: 12px;
      color: var(--slate);
    }

    .rule-demo__line {
      width: 100%;
      border: none;
      border-radius: 0;
    }

    /* Border radius */
    .radius-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
      gap: var(--s-5);
    }

    .radius-item {
      text-align: center;
    }

    .radius-item__box {
      width: 100%;
      aspect-ratio: 1 / 1;
      max-width: 140px;
      margin: 0 auto var(--s-3);
      background: var(--bone);
      border: 2px solid var(--ink);
      opacity: 0.7;
      transition: opacity 0.2s ease, background 0.2s ease;
    }

    .radius-item:hover .radius-item__box {
      opacity: 1;
      background: var(--signal);
      border-color: var(--signal);
    }

    .radius-item__name {
      font-family: var(--font-mono);
      font-size: 13px;
      font-weight: 700;
      color: var(--ink);
      margin-bottom: var(--s-1);
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .radius-item__value {
      font-family: var(--font-mono);
      font-size: 12px;
      color: var(--slate);
    }

    /* Depth levels */
    .depth-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: var(--s-5);
    }

    .depth-item {
      padding: var(--s-5);
      background: var(--paper);
      border: 2px solid var(--border);
      transition: transform 0.2s ease, border-color 0.2s ease;
    }

    .depth-item:hover {
      transform: translateY(-2px);
      border-color: var(--signal);
    }

    .depth-item__name {
      font-family: var(--font-mono);
      font-size: 13px;
      font-weight: 700;
      color: var(--ink);
      margin-bottom: var(--s-2);
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .depth-item__spec {
      font-family: var(--font-mono);
      font-size: 11px;
      color: var(--slate);
      word-break: break-all;
      line-height: 1.4;
    }

    .depth-flat {
      border: none;
      background: var(--bone);
    }

    .depth-border {
      border: 1px solid var(--border);
    }

    .depth-elevated {
      border: none;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
    }

    /* Loading */
    .loading {
      text-align: center;
      padding: 80px 24px;
      color: var(--slate);
      font-size: 16px;
    }

    .loading::after {
      content: '';
      display: block;
      width: 32px;
      height: 32px;
      margin: 16px auto 0;
      border: 3px solid var(--border);
      border-top-color: var(--signal);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    @media (max-width: 768px) {
      .page {
        padding: var(--s-5) var(--s-3);
      }

      .header__title {
        font-size: 40px;
      }

      .spacing-row {
        grid-template-columns: 100px 1fr 80px;
        gap: var(--s-2);
      }

      .radius-grid {
        grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
        gap: var(--s-4);
      }

      .depth-grid {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <div class="page" id="app">
    <div class="loading">Loading design tokens…</div>
  </div>

  <script>
    const DEFAULT_SPACING = {
      's-1': '4px',
      's-2': '8px',
      's-3': '16px',
      's-4': '24px',
      's-5': '32px',
      's-6': '48px',
      's-7': '64px',
      's-8': '96px',
    };

    const DEFAULT_DEPTH = {
      'Flat': { weight: 'none', color: 'transparent' },
      'Border': { weight: '1px solid', color: 'var(--border)' },
      'Elevated': { weight: '0 2px 8px', color: 'rgba(0,0,0,0.08)' },
    };

    const DEFAULT_RADIUS = {
      'none': '0',
      'sm': '4px',
      'md': '8px',
      'lg': '16px',
      'full': '999px',
    };

    (window.__DESIGN_TOKENS__ ? Promise.resolve({ ok: true, json: () => Promise.resolve(window.__DESIGN_TOKENS__) }) : fetch('../tokens.json'))
      .then(r => {
        if (!r.ok) throw new Error('tokens.json not found (' + r.status + ')');
        return r.json();
      })
      .then(render)
      .catch(err => {
        document.getElementById('app').innerHTML =
          '<div class="loading" style="color:#dc2626">' +
          'Could not load tokens.json — ' + err.message + '</div>';
      });

    function render(tokens) {
      const app = document.getElementById('app');
      const name = tokens.meta?.title || tokens.meta?.id || tokens.name || 'Design System';

      const spacing = tokens.spacing?.scale || DEFAULT_SPACING;
      const depth = tokens.depth || DEFAULT_DEPTH;
      const radius = tokens.radii || DEFAULT_RADIUS;

      let html = '';

      /* Header */
      html += '<header class="header">';
      html += '  <h1 class="header__title">Eight Pixels.<br>One System.</h1>';
      html += '  <p class="header__subtitle">Spacing, rules, and depth hierarchy for raw, unadorned surfaces.</p>';
      html += '  <hr class="header__rule">';
      html += '</header>';

      /* ---- Spacing scale ---- */
      html += '<div class="section">';
      html += '  <div class="section__label">Spacing Scale</div>';

      const spacingEntries = Object.entries(spacing);
      const maxPx = Math.max(...spacingEntries.map(([, v]) => parseFloat(v) || 0), 1);

      spacingEntries.forEach(([key, value]) => {
        const px = parseFloat(value) || 0;
        const pct = Math.max((px / maxPx) * 100, 2);
        html += '<div class="spacing-row">';
        html += '  <div class="spacing-row__name">' + esc(key) + '</div>';
        html += '  <div class="spacing-row__bar-wrap">';
        html += '    <div class="spacing-row__bar" style="width:' + pct + '%"></div>';
        html += '  </div>';
        html += '  <div class="spacing-row__value">' + esc(value) + '</div>';
        html += '</div>';
      });

      html += '</div>';

      /* ---- Rule weights ---- */
      html += '<div class="section">';
      html += '  <div class="section__label">Depth Levels</div>';

      Object.entries(depth).forEach(([key, val]) => {
        const name = typeof val === 'object' ? val.name || key : key;
        const treatment = typeof val === 'object' ? val.treatment : val;
        const display = typeof val === 'object' ? val.display || treatment : treatment;

        html += '<div class="rule-demo">';
        html += '  <div class="rule-demo__header">';
        html += '    <span class="rule-demo__name">' + esc(name) + '</span>';
        html += '    <span class="rule-demo__spec">' + esc(display) + '</span>';
        html += '  </div>';
        html += '  <div style="height:100px;background:var(--bone);border:1px solid var(--border);display:flex;align-items:center;justify-content:center">';
        if (treatment === 'none') {
          html += '    <div style="width:80%;height:60px;background:var(--paper);border:2px solid var(--ink)"></div>';
        } else if (treatment && treatment.includes('solid')) {
          html += '    <div style="width:80%;height:60px;background:var(--paper);border:' + treatment + ' var(--border)"></div>';
        } else if (treatment && treatment.includes('2px')) {
          html += '    <div style="width:80%;height:60px;background:var(--paper);box-shadow:' + treatment + ' rgba(0,0,0,0.08)"></div>';
        } else {
          html += '    <div style="width:80%;height:60px;background:var(--paper)"></div>';
        }
        html += '  </div>';
        html += '</div>';
      });

      html += '</div>';

      /* ---- Border radius ---- */
      html += '<div class="section">';
      html += '  <div class="section__label">Border Radius</div>';
      html += '  <div class="radius-grid">';

      Object.entries(radius).forEach(([key, value]) => {
        html += '<div class="radius-item">';
        html += '  <div class="radius-item__box" style="border-radius:' + esc(value) + '"></div>';
        html += '  <div class="radius-item__name">' + esc(key) + '</div>';
        html += '  <div class="radius-item__value">' + esc(value) + '</div>';
        html += '</div>';
      });

      html += '  </div>';
      html += '</div>';

      app.innerHTML = html;
    }

    function esc(s) {
      const d = document.createElement('div');
      d.textContent = String(s);
      return d.innerHTML;
    }
  </script>
</body>
</html>
