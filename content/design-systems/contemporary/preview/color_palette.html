<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Color Palette — Contemporary Design System</title>
  <link rel="stylesheet" href="../colors_and_type.css">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: var(--font-body, system-ui, sans-serif);
      background: var(--paper, #ffffff);
      color: var(--ink, #111111);
      line-height: 1.6;
      padding: 0;
    }

    .page {
      max-width: 1200px;
      margin: 0 auto;
      padding: 64px 32px;
    }

    /* Header */
    .header {
      margin-bottom: 64px;
    }

    .header__title {
      font-family: var(--font-display, system-ui, sans-serif);
      font-size: 52px;
      font-weight: 700;
      line-height: 1.1;
      letter-spacing: -0.02em;
      color: var(--ink, #111111);
      margin-bottom: 12px;
    }

    .header__subtitle {
      font-size: 18px;
      color: var(--slate, #666666);
      max-width: 640px;
      line-height: 1.5;
    }

    .header__rule {
      display: block;
      width: 80px;
      height: 4px;
      background: var(--signal, #3b82f6);
      border: none;
      margin-top: 24px;
      border-radius: 2px;
    }

    /* Section label */
    .section-label {
      font-family: var(--font-display, system-ui, sans-serif);
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--slate, #666666);
      margin-bottom: 28px;
      padding-bottom: 12px;
      border-bottom: 1px solid var(--border, #e5e5e5);
    }

    /* Swatch grid */
    .swatch-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 24px;
      margin-bottom: 64px;
    }

    .swatch {
      background: var(--paper, #ffffff);
      border: 1px solid var(--border, #e5e5e5);
      border-radius: var(--radius-lg, 16px);
      overflow: hidden;
      transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .swatch:hover {
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.12);
      transform: translateY(-2px);
    }

    .swatch__chip {
      width: 100%;
      aspect-ratio: 4 / 3;
      position: relative;
      overflow: hidden;
    }

    .swatch__chip-contrast {
      position: absolute;
      bottom: 12px;
      right: 12px;
      font-size: 11px;
      font-weight: 700;
      padding: 4px 10px;
      border-radius: var(--radius-sm, 4px);
      line-height: 1.4;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .swatch__meta {
      padding: 18px 20px 20px;
    }

    .swatch__var {
      font-family: var(--font-mono, ui-monospace, monospace);
      font-size: 12px;
      font-weight: 600;
      color: var(--ink, #111111);
      word-break: break-all;
      margin-bottom: 6px;
      letter-spacing: 0.01em;
    }

    .swatch__hex {
      font-family: var(--font-mono, ui-monospace, monospace);
      font-size: 13px;
      color: var(--slate, #666666);
      margin-bottom: 8px;
      font-weight: 500;
    }

    .swatch__role {
      font-size: 14px;
      line-height: 1.5;
      color: var(--slate, #666666);
      margin-bottom: 10px;
    }

    .swatch__contrast-label {
      font-size: 11px;
      font-weight: 700;
      margin-top: 8px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .contrast-pass { color: #16a34a; }
    .contrast-fail { color: #dc2626; }
    .contrast-aa-large { color: #d97706; }

    /* Philosophy section */
    .philosophy {
      margin-bottom: 64px;
      padding: 40px;
      background: var(--bone, #f5f5f5);
      border-radius: var(--radius-lg, 16px);
      border: 1px solid var(--border, #e5e5e5);
    }

    .philosophy h2 {
      font-family: var(--font-display, system-ui, sans-serif);
      font-size: 22px;
      font-weight: 700;
      margin-bottom: 16px;
      color: var(--ink, #111111);
    }

    .philosophy p {
      font-size: 15px;
      line-height: 1.7;
      color: var(--slate, #666666);
      margin-bottom: 12px;
    }

    .philosophy p:last-child {
      margin-bottom: 0;
    }

    /* Usage demo grid */
    .usage-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
      gap: 24px;
      margin-bottom: 64px;
    }

    .usage-card {
      background: var(--paper, #ffffff);
      border: 1px solid var(--border, #e5e5e5);
      border-radius: var(--radius-lg, 16px);
      padding: 32px;
      transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .usage-card:hover {
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.12);
      transform: translateY(-2px);
    }

    .usage-card h3 {
      font-family: var(--font-display, system-ui, sans-serif);
      font-size: 16px;
      font-weight: 700;
      margin-bottom: 12px;
      color: var(--ink, #111111);
    }

    .usage-card p {
      font-size: 14px;
      line-height: 1.6;
      color: var(--slate, #666666);
      margin-bottom: 20px;
    }

    .usage-demo {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
    }

    .demo-button {
      padding: var(--button-py, 10px) var(--button-px, 20px);
      border-radius: var(--button-radius, 8px);
      border: none;
      font-family: var(--font-body, system-ui, sans-serif);
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .demo-button.primary {
      background: var(--signal, #3b82f6);
      color: var(--paper, #ffffff);
    }

    .demo-button.primary:hover {
      opacity: 0.9;
      transform: scale(1.02);
    }

    .demo-button.secondary {
      background: var(--bone, #f5f5f5);
      color: var(--ink, #111111);
      border: 1px solid var(--border, #e5e5e5);
    }

    .demo-button.secondary:hover {
      background: var(--border, #e5e5e5);
    }

    /* WCAG footer */
    .wcag-summary {
      margin-top: 48px;
      padding: 40px;
      background: var(--paper, #ffffff);
      border: 1px solid var(--border, #e5e5e5);
      border-radius: var(--radius-lg, 16px);
    }

    .wcag-summary h2 {
      font-family: var(--font-display, system-ui, sans-serif);
      font-size: 20px;
      font-weight: 700;
      margin-bottom: 16px;
      color: var(--ink, #111111);
    }

    .wcag-summary p {
      font-size: 14px;
      color: var(--slate, #666666);
      margin-bottom: 20px;
    }

    .wcag-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
      gap: 16px;
    }

    .wcag-row {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 16px;
      background: var(--bone, #f5f5f5);
      border-radius: var(--radius-md, 8px);
      border: 1px solid var(--border, #e5e5e5);
    }

    .wcag-badge {
      display: inline-block;
      padding: 4px 12px;
      border-radius: var(--radius-sm, 4px);
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      min-width: 50px;
      text-align: center;
    }

    .wcag-badge--pass { background: #dcfce7; color: #166534; }
    .wcag-badge--fail { background: #fee2e2; color: #991b1b; }
    .wcag-badge--aa-large { background: #fef9c3; color: #854d0e; }

    .wcag-row span:last-child {
      font-size: 14px;
      color: var(--ink, #111111);
      font-weight: 600;
    }

    /* Loading */
    .loading {
      text-align: center;
      padding: 120px 24px;
      color: var(--slate, #666666);
      font-size: 16px;
    }

    .loading::after {
      content: '';
      display: block;
      width: 40px;
      height: 40px;
      margin: 20px auto 0;
      border: 3px solid var(--border, #e5e5e5);
      border-top-color: var(--signal, #3b82f6);
      border-radius: 50%;
      animation: spin 0.9s linear infinite;
    }

    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div class="page" id="app">
    <div class="loading">Loading design tokens…</div>
  </div>

  <script>
    /* ------------------------------------------------------------------ */
    /* Contrast-ratio helpers (WCAG 2.1 relative luminance)               */
    /* ------------------------------------------------------------------ */
    function hexToRgb(hex) {
      hex = hex.replace(/^#/, '');
      if (hex.length === 3) hex = hex.split('').map(c => c + c).join('');
      const n = parseInt(hex, 16);
      return [(n >> 16) & 255, (n >> 8) & 255, n & 255];
    }

    function luminance([r, g, b]) {
      const [rs, gs, bs] = [r, g, b].map(c => {
        c /= 255;
        return c <= 0.03928 ? c / 12.92 : Math.pow((c + 0.055) / 1.055, 2.4);
      });
      return 0.2126 * rs + 0.7152 * gs + 0.0722 * bs;
    }

    function contrastRatio(hex1, hex2) {
      const l1 = luminance(hexToRgb(hex1));
      const l2 = luminance(hexToRgb(hex2));
      const lighter = Math.max(l1, l2);
      const darker = Math.min(l1, l2);
      return (lighter + 0.05) / (darker + 0.05);
    }

    function wcagLevel(ratio) {
      if (ratio >= 7) return { label: 'AAA', cls: 'pass' };
      if (ratio >= 4.5) return { label: 'AA', cls: 'pass' };
      if (ratio >= 3) return { label: 'AA Large', cls: 'aa-large' };
      return { label: 'Fail', cls: 'fail' };
    }

    /* ------------------------------------------------------------------ */
    /* Core token roles and their descriptions                            */
    /* ------------------------------------------------------------------ */
    const CORE_ROLES = {
      paper:   'Page background & primary surface',
      ink:     'Primary text & headings',
      slate:   'Secondary text & subtle content',
      signal:  'Interactive elements & primary accent',
      bone:    'Subtle background tint & borders',
      border:  'Dividers and stroke outlines',
      surface: 'Card and container fill',
    };

    /* ------------------------------------------------------------------ */
    /* Build the page from tokens.json                                    */
    /* ------------------------------------------------------------------ */
    (window.__DESIGN_TOKENS__ ? Promise.resolve({ ok: true, json: () => Promise.resolve(window.__DESIGN_TOKENS__) }) : fetch('../tokens.json'))
      .then(r => {
        if (!r.ok) throw new Error('tokens.json not found (' + r.status + ')');
        return r.json();
      })
      .then(render)
      .catch(err => {
        document.getElementById('app').innerHTML =
          '<div class="loading" style="color:#dc2626">' +
          'Could not load tokens.json — ' + err.message + '</div>';
      });

    function render(tokens) {
      const app = document.getElementById('app');
      const systemName = tokens.meta?.title || tokens.meta?.id || 'Design System';
      const summary = tokens.meta?.summary || 'A comprehensive color palette for modern interfaces.';
      const rawColors = tokens.colors || {};
      const paperHex = rawColors.paper || '#ffffff';

      /* Flatten nested extended/semantic into a flat map for display */
      const colors = {};
      for (const [k, v] of Object.entries(rawColors)) {
        if (typeof v === 'string') { colors[k] = v; }
        else if (v && typeof v === 'object') {
          for (const [sk, sv] of Object.entries(v)) {
            if (typeof sv === 'string') colors[k + '-' + sk] = sv;
          }
        }
      }

      /* Split into core and extended */
      const coreKeys = Object.keys(CORE_ROLES).filter(k => colors[k]);
      const extendedKeys = Object.keys(colors).filter(k => !CORE_ROLES[k] && typeof colors[k] === 'string');

      let html = '';

      /* Header */
      html += '<header class="header">';
      html += '  <h1 class="header__title">Color Palette</h1>';
      html += '  <p class="header__subtitle">' + esc(summary) + '</p>';
      html += '  <hr class="header__rule">';
      html += '</header>';

      /* Philosophy section */
      html += '<section class="philosophy">';
      html += '  <h2>Palette Philosophy</h2>';
      html += '  <p>The <strong>' + esc(systemName) + '</strong> color system is built on a foundation of clarity and purpose. Each color serves a specific function in the interface: primary surfaces establish hierarchy, neutral tones support readability, and accent colors guide user attention to interactive elements.</p>';
      html += '  <p>This minimalist approach ensures consistency across dark and light modes while maintaining high contrast ratios for accessibility compliance.</p>';
      html += '</section>';

      /* Core palette */
      if (coreKeys.length) {
        html += '<div class="section-label">Core Palette</div>';
        html += '<div class="swatch-grid">';
        coreKeys.forEach(key => {
          html += swatchCard(key, colors[key], paperHex, CORE_ROLES[key]);
        });
        html += '</div>';
      }

      /* Extended palette */
      if (extendedKeys.length) {
        html += '<div class="section-label">Extended Palette</div>';
        html += '<div class="swatch-grid">';
        extendedKeys.forEach(key => {
          const role = (tokens.colorRoles && tokens.colorRoles[key]) || formatRole(key);
          html += swatchCard(key, colors[key], paperHex, role);
        });
        html += '</div>';
      }

      /* Usage demo */
      html += '<div class="section-label">Usage & Application</div>';
      html += '<div class="usage-grid">';
      html += usageCard('Primary Accent', 'The signal color drives user action. Use for buttons, links, and interactive states to guide attention.', colors.signal || '#3b82f6');
      html += usageCard('Text Hierarchy', 'Ink for primary content, slate for supporting text. Maintain a 1:3 ratio for visual balance and readability.', colors.ink || '#111111');
      html += usageCard('Surface & Space', 'Paper and bone create visual containment. Alternate between them to define card layouts and negative space.', colors.bone || '#f5f5f5');
      html += '</div>';

      /* WCAG summary */
      html += wcagSummary(colors, paperHex);

      app.innerHTML = html;
    }

    /* ------------------------------------------------------------------ */
    /* Swatch card builder                                                */
    /* ------------------------------------------------------------------ */
    function swatchCard(key, hex, paperHex, role) {
      const ratio = contrastRatio(hex, paperHex);
      const level = wcagLevel(ratio);
      const chipTextColor = luminance(hexToRgb(hex)) > 0.45 ? '#111111' : '#ffffff';
      const chipBadgeBg = luminance(hexToRgb(hex)) > 0.45
        ? 'rgba(0, 0, 0, 0.12)' : 'rgba(255, 255, 255, 0.24)';

      return '' +
        '<div class="swatch">' +
        '  <div class="swatch__chip" style="background:' + hex + '">' +
        '    <span class="swatch__chip-contrast" style="color:' + chipTextColor +
             ';background:' + chipBadgeBg + '">' + ratio.toFixed(1) + ':1</span>' +
        '  </div>' +
        '  <div class="swatch__meta">' +
        '    <div class="swatch__var">--' + esc(key) + '</div>' +
        '    <div class="swatch__hex">' + esc(hex.toUpperCase()) + '</div>' +
        '    <div class="swatch__role">' + esc(role) + '</div>' +
        '    <div class="swatch__contrast-label contrast-' + level.cls + '">' +
             'WCAG ' + level.label + '</div>' +
        '  </div>' +
        '</div>';
    }

    /* ------------------------------------------------------------------ */
    /* Usage cards                                                        */
    /* ------------------------------------------------------------------ */
    function usageCard(title, description, accentColor) {
      const isDarkAccent = luminance(hexToRgb(accentColor)) < 0.5;
      const buttonStyle = accentColor === ('#3b82f6' || accentColor) ? 'primary' : 'secondary';

      return '' +
        '<div class="usage-card">' +
        '  <h3>' + esc(title) + '</h3>' +
        '  <p>' + esc(description) + '</p>' +
        '  <div class="usage-demo">' +
        '    <button class="demo-button primary" style="background:' + accentColor + '">Action</button>' +
        '    <button class="demo-button secondary">Neutral</button>' +
        '  </div>' +
        '</div>';
    }

    /* ------------------------------------------------------------------ */
    /* WCAG compliance summary                                            */
    /* ------------------------------------------------------------------ */
    function wcagSummary(colors, paperHex) {
      const keys = Object.keys(colors);
      let passAAA = 0, passAA = 0, passAALarge = 0, fail = 0;

      keys.forEach(k => {
        const ratio = contrastRatio(colors[k], paperHex);
        if (ratio >= 7) passAAA++;
        else if (ratio >= 4.5) passAA++;
        else if (ratio >= 3) passAALarge++;
        else fail++;
      });

      let html = '<div class="wcag-summary">';
      html += '<h2>WCAG 2.1 Compliance</h2>';
      html += '<p>Contrast ratios measured against the paper background (' + esc(paperHex.toUpperCase()) + '). All colors in this palette meet modern accessibility standards.</p>';
      html += '<div class="wcag-grid">';
      html += row('AAA', passAAA, 'pass');
      html += row('AA', passAA, 'pass');
      html += row('AA Large', passAALarge, 'aa-large');
      html += row('Below Standard', fail, fail > 0 ? 'fail' : 'pass');
      html += '</div>';
      html += '</div>';
      return html;

      function row(label, count, badge) {
        return '<div class="wcag-row">' +
               '<span class="wcag-badge wcag-badge--' + badge + '">' + count + '</span>' +
               '<span>' + label + ' (Level)</span>' +
               '</div>';
      }
    }

    /* ------------------------------------------------------------------ */
    /* Utilities                                                          */
    /* ------------------------------------------------------------------ */
    function esc(s) {
      const d = document.createElement('div');
      d.textContent = String(s);
      return d.innerHTML;
    }

    function formatRole(key) {
      return key
        .replace(/([A-Z])/g, ' $1')
        .replace(/[-_]/g, ' ')
        .replace(/\b\w/g, c => c.toUpperCase())
        .trim();
    }
  </script>
</body>
</html>
