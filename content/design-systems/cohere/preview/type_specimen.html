<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Type Specimen — Cohere</title>
  <link rel="stylesheet" href="../colors_and_type.css">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: var(--font-body, 'CohereText', serif);
      background: var(--paper, #ffffff);
      color: var(--ink, #212121);
      line-height: 1.6;
    }

    .page {
      max-width: 1100px;
      margin: 0 auto;
      padding: 96px 48px;
    }

    @media (max-width: 768px) {
      .page {
        padding: 64px 32px;
      }
    }

    @media (max-width: 480px) {
      .page {
        padding: 48px 24px;
      }
    }

    /* Header */
    .header {
      margin-bottom: 96px;
    }

    .header__kicker {
      font-family: var(--font-mono, 'CohereMono', monospace);
      font-size: 14px;
      font-weight: 400;
      letter-spacing: 0.28em;
      text-transform: uppercase;
      color: var(--slate, #93939f);
      margin-bottom: 16px;
    }

    .header__title {
      font-family: var(--font-display, 'CohereText', serif);
      font-size: 96px;
      font-weight: 400;
      line-height: 0.95;
      letter-spacing: -0.02em;
      color: var(--ink, #212121);
      margin-bottom: 24px;
    }

    .header__subtitle {
      font-family: var(--font-body, 'CohereText', serif);
      font-size: 22px;
      font-weight: 400;
      line-height: 1.55;
      color: var(--slate, #93939f);
      max-width: 680px;
      margin-bottom: 32px;
    }

    .header__rule {
      display: block;
      width: 96px;
      height: 1px;
      background: var(--ink, #212121);
      border: none;
      margin: 0;
    }

    /* Font families section */
    .font-families {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 32px;
      margin-bottom: 96px;
      margin-top: 64px;
    }

    .font-card {
      background: var(--paper, #ffffff);
      border: 1px solid var(--color-border-light, #e5e7eb);
      border-radius: var(--radius-md, 8px);
      padding: 32px;
    }

    .font-card__label {
      font-family: var(--font-mono, 'CohereMono', monospace);
      font-size: 12px;
      font-weight: 400;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--slate, #93939f);
      margin-bottom: 12px;
    }

    .font-card__name {
      font-family: var(--font-display, 'CohereText', serif);
      font-size: 36px;
      font-weight: 400;
      line-height: 1.1;
      color: var(--ink, #212121);
      margin-bottom: 8px;
    }

    .font-card__fallback {
      font-family: var(--font-mono, 'CohereMono', monospace);
      font-size: 12px;
      color: var(--slate, #93939f);
      word-break: break-word;
    }

    /* Character set block */
    .charmap-block {
      background: var(--paper, #ffffff);
      border: 1px solid var(--color-border-light, #e5e7eb);
      border-radius: var(--radius-md, 8px);
      padding: 48px;
      margin-bottom: 96px;
    }

    .charmap-block__label {
      font-family: var(--font-mono, 'CohereMono', monospace);
      font-size: 12px;
      font-weight: 400;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--slate, #93939f);
      margin-bottom: 24px;
    }

    .charmap-block__chars {
      font-family: var(--font-display, 'CohereText', serif);
      font-size: 32px;
      font-weight: 400;
      line-height: 1.8;
      letter-spacing: 0.02em;
      color: var(--ink, #212121);
      word-break: break-word;
    }

    /* Section label */
    .section-label {
      font-family: var(--font-mono, 'CohereMono', monospace);
      font-size: 12px;
      font-weight: 400;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--slate, #93939f);
      margin-bottom: 32px;
      padding-bottom: 16px;
      border-bottom: 1px solid var(--ink, #212121);
    }

    /* Ramp row */
    .ramp-row {
      display: grid;
      grid-template-columns: 280px 1fr;
      gap: 48px;
      align-items: baseline;
      padding: 32px 0;
      border-bottom: 1px solid var(--color-border-light, #e5e7eb);
    }

    .ramp-row:last-child {
      border-bottom: none;
    }

    @media (max-width: 800px) {
      .ramp-row {
        grid-template-columns: 1fr;
        gap: 16px;
      }
    }

    /* Left meta column */
    .ramp-meta__role {
      font-family: var(--font-display, 'CohereText', serif);
      font-size: 18px;
      font-weight: 400;
      color: var(--ink, #212121);
      margin-bottom: 8px;
    }

    .ramp-meta__detail {
      font-family: var(--font-mono, 'CohereMono', monospace);
      font-size: 11px;
      font-weight: 400;
      line-height: 1.8;
      color: var(--slate, #93939f);
      letter-spacing: 0.02em;
    }

    /* Right sample column */
    .ramp-sample {
      color: var(--ink, #212121);
      overflow-wrap: break-word;
      word-spacing: 0.1em;
    }

    /* Ramp section */
    .ramp-section {
      margin-bottom: 96px;
    }

    /* Drop cap demo */
    .dropcap-demo {
      margin-bottom: 96px;
    }

    .dropcap-demo__label {
      font-family: var(--font-mono, 'CohereMono', monospace);
      font-size: 12px;
      font-weight: 400;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--slate, #93939f);
      margin-bottom: 32px;
      padding-bottom: 16px;
      border-bottom: 1px solid var(--ink, #212121);
    }

    .dropcap-container {
      background: var(--paper, #ffffff);
      border: 1px solid var(--color-border-light, #e5e7eb);
      border-radius: var(--radius-md, 8px);
      padding: 48px;
      max-width: 680px;
    }

    .dropcap-para {
      font-family: var(--font-body, 'CohereText', serif);
      font-size: 22px;
      font-weight: 400;
      line-height: 1.55;
      color: var(--ink, #212121);
      margin: 0;
      text-align: left;
    }

    .dropcap {
      float: left;
      font-family: var(--font-display, 'CohereText', serif);
      font-size: 128px;
      font-weight: 400;
      line-height: 0.85;
      color: var(--signal, #1863dc);
      margin-right: 8px;
      margin-top: -8px;
    }

    /* Loading */
    .loading {
      text-align: center;
      padding: 160px 48px;
      color: var(--slate, #93939f);
      font-family: var(--font-body, 'CohereText', serif);
      font-size: 18px;
    }

    .loading::after {
      content: '';
      display: block;
      width: 32px;
      height: 32px;
      margin: 24px auto 0;
      border: 2px solid var(--color-border-light, #e5e7eb);
      border-top-color: var(--signal, #1863dc);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div class="page" id="app">
    <div class="loading">Loading design tokens&hellip;</div>
  </div>

  <script>
    const EDITORIAL_SAMPLES = [
      'Enterprise AI infrastructure demands clarity without compromise.',
      'Semantic understanding at scale requires precision in every interface.',
      'The best AI tools disappear. The system should whisper, not shout.',
      'Commanding language models means commanding clarity first.',
      'Authentication is not friction. It is trust made visible.',
      'The command deck aesthetic reflects the rigor of production systems.',
      'Every card, every border, every token carries intentional weight.',
      'Generative AI needs guardrails. Design is guardrails made tangible.',
      'White space is thinking space. Density is for dashboards, not declarations.',
      'Enterprise software deserves serif headlines. Authority earned through craft.',
    ];

    const DROPCAP_TEXT = 'Cohere's typographic system speaks in two distinct voices. CohereText—a custom display serif with tight negative tracking—commands attention with the gravitas of published research and technical authority. It announces features, declares capabilities, establishes hierarchy through form. Unica77 Cohere Web, conversely, operates as the system's utility layer: geometric, neutral, relentlessly functional. It carries users through long-form documentation, labels interactive controls, manages the granular metadata that enterprise dashboards require. The pairing is intentional: serif for declaration, sans for execution. Display sizes push tracking into negative territory—negative 1.44px at the headline scale—creating dense, impactful text blocks that demand attention. Body copy relaxes into generous line heights (1.4 to 1.55) and opens tracking, prioritizing sustained reading over impact. This is typography designed not for novelty but for production systems where users arrive with intent and leave with answers.';

    fetch('../tokens.json')
      .then(r => {
        if (!r.ok) throw new Error('tokens.json not found (' + r.status + ')');
        return r.json();
      })
      .then(render)
      .catch(err => {
        document.getElementById('app').innerHTML =
          '<div class="loading" style="color:#1863dc">' +
          'Could not load tokens.json — ' + err.message + '</div>';
      });

    function render(tokens) {
      const app = document.getElementById('app');
      const title = tokens.meta?.title || 'Design System';
      const summary = tokens.meta?.summary || '';

      const fonts = tokens.typography || {};
      const ramp = tokens.typography?.ramp || [];

      let html = '';

      /* Header */
      html += '<header class="header">';
      html += '  <div class="header__kicker">Type Specimen</div>';
      html += '  <h1 class="header__title">' + esc(title) + '</h1>';
      html += '  <p class="header__subtitle">' + esc(summary) + '</p>';
      html += '  <hr class="header__rule">';
      html += '</header>';

      /* Font families */
      const families = [
        { label: 'Display', name: 'CohereText', fallback: 'Space Grotesk, Inter, ui-sans-serif, system-ui' },
        { label: 'Body / UI', name: 'Unica77 Cohere Web', fallback: 'Inter, Arial, ui-sans-serif, system-ui' },
        { label: 'Code', name: 'CohereMono', fallback: 'Arial, ui-sans-serif, system-ui' },
        { label: 'Icons', name: 'CohereIconDefault', fallback: 'system-ui' }
      ];

      html += '<div class="font-families">';
      families.forEach(f => {
        html += '<div class="font-card">';
        html += '  <div class="font-card__label">' + esc(f.label) + '</div>';
        html += '  <div class="font-card__name">' + esc(f.name) + '</div>';
        html += '  <div class="font-card__fallback">' + esc(f.fallback) + '</div>';
        html += '</div>';
      });
      html += '</div>';

      /* Character set */
      html += '<div class="charmap-block">';
      html += '  <div class="charmap-block__label">Character Set — CohereText Display Serif</div>';
      html += '  <div class="charmap-block__chars" style="font-family:\'CohereText\',serif">';
      html += '    AaBbCcDdEeFfGgHhIiJjKkLlMmNnOoPpQqRrSsTtUuVvWwXxYyZz<br>';
      html += '    0123456789 !@#$%&amp;*()&ndash;&mdash;&lsquo;&rsquo;&ldquo;&rdquo;';
      html += '  </div>';
      html += '</div>';

      /* Type ramp */
      if (ramp.length) {
        html += '<div class="ramp-section">';
        html += '<div class="section-label">Type Ramp</div>';
        ramp.forEach((entry, i) => {
          html += rampRow(entry, i);
        });
        html += '</div>';
      }

      /* Drop cap demo */
      html += '<div class="dropcap-demo">';
      html += '<div class="dropcap-demo__label">Drop Cap — Five-Line CohereText, Signal Blue</div>';
      html += '<div class="dropcap-container">';
      const firstChar = DROPCAP_TEXT.charAt(0);
      const restText = DROPCAP_TEXT.substring(1);
      html += '<p class="dropcap-para">';
      html += '<span class="dropcap">' + esc(firstChar) + '</span>';
      html += esc(restText);
      html += '</p>';
      html += '</div>';
      html += '</div>';

      app.innerHTML = html;
    }

    function rampRow(entry, idx) {
      const role = entry.role || 'Role ' + (idx + 1);
      const size = entry.size || '16px';
      const weight = entry.weight || 400;
      const lh = entry.lineHeight || '1.5';
      const ls = entry.letterSpacing || '0';

      let fontFamily = 'var(--font-body)';
      if (entry.fontKey === 'display') fontFamily = 'var(--font-display)';
      else if (entry.fontKey === 'mono') fontFamily = 'var(--font-mono)';

      const sizeNum = parseFloat(size);
      const sampleIdx = idx % EDITORIAL_SAMPLES.length;
      let sample = EDITORIAL_SAMPLES[sampleIdx];

      /* Truncate very large samples */
      if (sizeNum >= 72) {
        sample = sample.split('.')[0].slice(0, 40);
        if (!sample.endsWith('.')) sample += '.';
      }

      let fontStyle = 'font-size:' + size + ';font-weight:' + weight + ';line-height:' + lh + ';';
      fontStyle += 'font-family:' + fontFamily + ';';
      if (ls && ls !== '0' && ls !== 'normal') fontStyle += 'letter-spacing:' + ls + ';';

      let meta = esc(size) + ' / ' + esc(String(weight));
      meta += '\n' + fontFamilyLabel(entry.fontKey);
      meta += '\nline-height: ' + esc(String(lh));
      if (ls && ls !== '0' && ls !== 'normal') meta += '\nletter-spacing: ' + esc(ls);

      return '' +
        '<div class="ramp-row">' +
        '  <div class="ramp-meta">' +
        '    <div class="ramp-meta__role">' + esc(role) + '</div>' +
        '    <pre class="ramp-meta__detail">' + meta + '</pre>' +
        '  </div>' +
        '  <div class="ramp-sample" style="' + fontStyle + '">' + esc(sample) + '</div>' +
        '</div>';
    }

    function fontFamilyLabel(key) {
      const map = {
        'display': 'CohereText',
        'body': 'Unica77 Cohere Web',
        'mono': 'CohereMono'
      };
      return map[key] || 'Unknown';
    }

    function esc(s) {
      const d = document.createElement('div');
      d.textContent = String(s);
      return d.innerHTML;
    }
  </script>
</body>
</html>
