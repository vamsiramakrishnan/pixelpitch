<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Color Palette — Cohere</title>
  <link rel="stylesheet" href="../colors_and_type.css">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: var(--font-body, 'CohereText', serif);
      background: var(--paper, #ffffff);
      color: var(--ink, #212121);
      line-height: 1.6;
      padding: 0;
    }

    .page {
      max-width: 1200px;
      margin: 0 auto;
      padding: 64px 32px;
    }

    /* Header / Stage head */
    .header {
      margin-bottom: 72px;
      border-bottom: 1px solid var(--border-cool, #d9d9dd);
      padding-bottom: 32px;
    }

    .header__kicker {
      font-family: var(--font-mono, 'CohereMono', monospace);
      font-size: 12px;
      font-weight: 400;
      letter-spacing: 0.28px;
      text-transform: uppercase;
      color: var(--slate, #93939f);
      margin-bottom: 12px;
    }

    .header__title {
      font-family: var(--font-display, 'CohereText', serif);
      font-size: 72px;
      font-weight: 400;
      line-height: 1.0;
      letter-spacing: -1.44px;
      color: var(--ink, #212121);
      margin-bottom: 8px;
    }

    .header__subtitle {
      font-family: var(--font-body, 'CohereText', serif);
      font-size: 18px;
      line-height: 1.4;
      color: var(--slate, #93939f);
      max-width: 720px;
      margin-bottom: 16px;
    }

    .header__meta {
      font-family: var(--font-mono, 'CohereMono', monospace);
      font-size: 12px;
      font-weight: 400;
      letter-spacing: 0.28px;
      color: var(--slate, #93939f);
      text-transform: uppercase;
    }

    /* Section labels */
    .section-label {
      font-family: var(--font-mono, 'CohereMono', monospace);
      font-size: 12px;
      font-weight: 400;
      letter-spacing: 0.28px;
      text-transform: uppercase;
      color: var(--slate, #93939f);
      margin-bottom: 32px;
      padding-bottom: 16px;
      border-bottom: 1px solid var(--border-light, #e5e7eb);
    }

    /* Swatch grid */
    .swatch-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 24px;
      margin-bottom: 64px;
    }

    .swatch {
      background: var(--paper, #ffffff);
      border: 1px solid var(--border-cool, #d9d9dd);
      border-radius: 8px;
      overflow: hidden;
      transition: border-color 0.2s ease, box-shadow 0.2s ease;
    }

    .swatch:hover {
      border-color: var(--signal, #1863dc);
      box-shadow: 0 2px 8px rgba(24, 99, 220, 0.12);
    }

    .swatch__chip {
      width: 100%;
      aspect-ratio: 4 / 3;
      position: relative;
    }

    .swatch__chip-contrast {
      position: absolute;
      bottom: 10px;
      right: 12px;
      font-family: var(--font-mono, 'CohereMono', monospace);
      font-size: 11px;
      font-weight: 500;
      padding: 4px 10px;
      border-radius: 4px;
      line-height: 1.4;
      text-transform: uppercase;
      letter-spacing: 0.22px;
      font-weight: 500;
    }

    .swatch__meta {
      padding: 18px 20px 20px;
    }

    .swatch__var {
      font-family: var(--font-mono, 'CohereMono', monospace);
      font-size: 11px;
      font-weight: 500;
      color: var(--ink, #212121);
      word-break: break-all;
      margin-bottom: 6px;
      letter-spacing: 0.22px;
    }

    .swatch__hex {
      font-family: var(--font-mono, 'CohereMono', monospace);
      font-size: 11px;
      color: var(--slate, #93939f);
      margin-bottom: 8px;
      text-transform: uppercase;
      letter-spacing: 0.22px;
      font-weight: 400;
    }

    .swatch__role {
      font-family: var(--font-body, 'CohereText', serif);
      font-size: 14px;
      line-height: 1.4;
      color: var(--ink, #212121);
      margin-bottom: 8px;
    }

    .swatch__contrast-label {
      font-family: var(--font-mono, 'CohereMono', monospace);
      font-size: 10px;
      font-weight: 500;
      margin-top: 8px;
      letter-spacing: 0.2px;
      text-transform: uppercase;
    }

    .contrast-pass { color: #1a6e3a; }
    .contrast-fail { color: #8b2a1f; }
    .contrast-aa-large { color: #6b4423; }

    /* Chip contrast badge styling */
    .chip-badge {
      border-radius: 4px;
      font-weight: 500;
      display: inline-block;
      font-size: 10px;
    }

    /* Usage pattern section */
    .usage-section {
      margin-bottom: 64px;
      padding: 40px;
      background: var(--snow, #fafafa);
      border: 1px solid var(--border-light, #e5e7eb);
      border-radius: 8px;
    }

    .usage-section h2 {
      font-family: var(--font-display, 'CohereText', serif);
      font-size: 48px;
      font-weight: 400;
      line-height: 1.2;
      letter-spacing: -0.48px;
      color: var(--ink, #212121);
      margin-bottom: 24px;
    }

    .usage-section p {
      font-family: var(--font-body, 'CohereText', serif);
      font-size: 16px;
      line-height: 1.5;
      color: var(--ink, #212121);
      margin-bottom: 24px;
      max-width: 720px;
    }

    .rule-of-one {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 32px;
      margin-top: 32px;
      align-items: start;
    }

    .rule-example {
      padding: 24px;
      background: var(--paper, #ffffff);
      border: 1px solid var(--border-cool, #d9d9dd);
      border-radius: 8px;
    }

    .rule-example h3 {
      font-family: var(--font-display, 'CohereText', serif);
      font-size: 24px;
      font-weight: 400;
      line-height: 1.3;
      color: var(--ink, #212121);
      margin-bottom: 12px;
    }

    .rule-example p {
      font-family: var(--font-body, 'CohereText', serif);
      font-size: 14px;
      line-height: 1.5;
      color: var(--slate, #93939f);
      margin-bottom: 0;
    }

    .correct {
      border: 2px solid #1a6e3a;
      border-radius: 8px;
    }

    .correct::before {
      content: '✓ CORRECT';
      display: block;
      font-family: var(--font-mono, 'CohereMono', monospace);
      font-size: 10px;
      font-weight: 500;
      letter-spacing: 0.2px;
      color: #1a6e3a;
      text-transform: uppercase;
      margin-bottom: 12px;
      padding-bottom: 12px;
      border-bottom: 1px solid #1a6e3a;
    }

    .incorrect {
      border: 2px solid #8b2a1f;
      border-radius: 8px;
    }

    .incorrect::before {
      content: '✗ INCORRECT';
      display: block;
      font-family: var(--font-mono, 'CohereMono', monospace);
      font-size: 10px;
      font-weight: 500;
      letter-spacing: 0.2px;
      color: #8b2a1f;
      text-transform: uppercase;
      margin-bottom: 12px;
      padding-bottom: 12px;
      border-bottom: 1px solid #8b2a1f;
    }

    .signal-demo {
      font-size: 16px;
      line-height: 1.5;
    }

    .signal-demo .drop-cap {
      font-family: var(--font-display, 'CohereText', serif);
      font-size: 56px;
      font-weight: 400;
      color: var(--signal, #1863dc);
      float: left;
      line-height: 0.85;
      padding-right: 6px;
      margin-top: 2px;
    }

    .signal-demo em {
      color: var(--signal, #1863dc);
      font-style: italic;
    }

    /* WCAG summary */
    .wcag-summary {
      margin-top: 64px;
      padding: 40px;
      background: var(--snow, #fafafa);
      border: 1px solid var(--border-light, #e5e7eb);
      border-radius: 8px;
    }

    .wcag-summary h2 {
      font-family: var(--font-display, 'CohereText', serif);
      font-size: 48px;
      font-weight: 400;
      line-height: 1.2;
      letter-spacing: -0.48px;
      margin-bottom: 24px;
      color: var(--ink, #212121);
    }

    .wcag-summary p {
      font-family: var(--font-body, 'CohereText', serif);
      font-size: 14px;
      line-height: 1.5;
      color: var(--slate, #93939f);
      margin-bottom: 24px;
    }

    .wcag-row {
      display: flex;
      align-items: center;
      gap: 16px;
      padding: 12px 0;
      border-bottom: 1px solid var(--border-light, #e5e7eb);
      font-family: var(--font-body, 'CohereText', serif);
      font-size: 14px;
    }

    .wcag-row:last-child { border-bottom: none; }

    .wcag-badge {
      display: inline-block;
      padding: 5px 12px;
      border-radius: 4px;
      font-family: var(--font-mono, 'CohereMono', monospace);
      font-size: 10px;
      font-weight: 500;
      text-transform: uppercase;
      letter-spacing: 0.2px;
      min-width: 80px;
      text-align: center;
    }

    .wcag-badge--pass { background: #e8f4f0; color: #1a6e3a; border: 1px solid #1a6e3a; }
    .wcag-badge--fail { background: #fae8e6; color: #8b2a1f; border: 1px solid #8b2a1f; }
    .wcag-badge--aa-large { background: #f5ede3; color: #6b4423; border: 1px solid #6b4423; }

    /* Loading state */
    .loading {
      text-align: center;
      padding: 80px 24px;
      color: var(--slate, #93939f);
      font-family: var(--font-body, 'CohereText', serif);
      font-size: 16px;
    }

    .loading::after {
      content: '';
      display: block;
      width: 32px;
      height: 32px;
      margin: 24px auto 0;
      border: 2px solid var(--border-cool, #d9d9dd);
      border-top-color: var(--signal, #1863dc);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    /* Responsive */
    @media (max-width: 768px) {
      .page { padding: 48px 20px; }
      .header { padding-bottom: 24px; margin-bottom: 48px; }
      .header__title { font-size: 48px; letter-spacing: -0.96px; }
      .swatch-grid { grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 16px; }
      .rule-of-one { grid-template-columns: 1fr; gap: 16px; }
      .usage-section { padding: 24px; }
      .usage-section h2 { font-size: 36px; letter-spacing: -0.36px; }
      .wcag-summary h2 { font-size: 36px; letter-spacing: -0.36px; }
    }
  </style>
</head>
<body>
  <div class="page" id="app">
    <div class="loading">Loading design tokens&hellip;</div>
  </div>

  <script>
    /* ───────────────────────────────────────────────────────────── */
    /* Contrast ratio calculation (WCAG 2.1 relative luminance)      */
    /* ───────────────────────────────────────────────────────────── */
    function hexToRgb(hex) {
      hex = hex.replace(/^#/, '');
      if (hex.length === 3) hex = hex.split('').map(c => c + c).join('');
      const n = parseInt(hex, 16);
      return [(n >> 16) & 255, (n >> 8) & 255, n & 255];
    }

    function luminance([r, g, b]) {
      const [rs, gs, bs] = [r, g, b].map(c => {
        c /= 255;
        return c <= 0.03928 ? c / 12.92 : Math.pow((c + 0.055) / 1.055, 2.4);
      });
      return 0.2126 * rs + 0.7152 * gs + 0.0722 * bs;
    }

    function contrastRatio(hex1, hex2) {
      const l1 = luminance(hexToRgb(hex1));
      const l2 = luminance(hexToRgb(hex2));
      const lighter = Math.max(l1, l2);
      const darker = Math.min(l1, l2);
      return (lighter + 0.05) / (darker + 0.05);
    }

    function wcagLevel(ratio) {
      if (ratio >= 7) return { label: 'AAA', cls: 'pass' };
      if (ratio >= 4.5) return { label: 'AA', cls: 'pass' };
      if (ratio >= 3) return { label: 'AA Large', cls: 'aa-large' };
      return { label: 'Fail', cls: 'fail' };
    }

    /* ───────────────────────────────────────────────────────────── */
    /* Core color roles and descriptions                             */
    /* ───────────────────────────────────────────────────────────── */
    const CORE_ROLES = {
      paper:  'Primary canvas. Bright white background for all content.',
      ink:    'Primary text color. Used for headlines, body copy, and standard UI elements.',
      slate:  'Secondary text. Footer links, captions, de-emphasized metadata.',
      signal: 'Interactive accent. Button hover, focus states, active links, and key CTAs.',
      bone:   'Elevated surface. Quoted blocks and subtle inset background zones.',
      border: 'Focus and input border. Muted violet accent for form interaction states.',
    };

    /* ───────────────────────────────────────────────────────────── */
    /* Render from tokens.json                                       */
    /* ───────────────────────────────────────────────────────────── */
    (window.__DESIGN_TOKENS__ 
      ? Promise.resolve({ ok: true, json: () => Promise.resolve(window.__DESIGN_TOKENS__) }) 
      : fetch('../tokens.json'))
      .then(r => {
        if (!r.ok) throw new Error('tokens.json not found (' + r.status + ')');
        return r.json();
      })
      .then(render)
      .catch(err => {
        document.getElementById('app').innerHTML =
          '<div class="loading" style="color:var(--signal,#1863dc)">' +
          'Could not load tokens.json — ' + err.message + '</div>';
      });

    function render(tokens) {
      const app = document.getElementById('app');
      const title = tokens.meta?.title || 'Design System';
      const summary = tokens.meta?.summary || '';
      const rawColors = tokens.colors || {};
      const paperHex = rawColors.paper || '#ffffff';

      /* Flatten nested color structure */
      const colors = {};
      for (const [k, v] of Object.entries(rawColors)) {
        if (typeof v === 'string') {
          colors[k] = v;
        } else if (v && typeof v === 'object') {
          for (const [sk, sv] of Object.entries(v)) {
            if (typeof sv === 'string') colors[k + '-' + sk] = sv;
          }
        }
      }

      /* Split core and extended */
      const coreKeys = Object.keys(CORE_ROLES).filter(k => colors[k]);
      const extendedKeys = Object.keys(colors).filter(k => !CORE_ROLES[k] && typeof colors[k] === 'string');

      let html = '';

      /* ─ Stage head header ─ */
      html += '<header class="header">';
      html += '  <div class="header__kicker">Design System</div>';
      html += '  <h1 class="header__title">' + esc(title) + '</h1>';
      html += '  <p class="header__subtitle">' + esc(summary) + '</p>';
      html += '  <div class="header__meta">Color Palette &mdash; ' + (coreKeys.length + extendedKeys.length) + ' Tokens</div>';
      html += '</header>';

      /* ─ Core Palette ─ */
      if (coreKeys.length) {
        html += '<div class="section-label">Core Palette</div>';
        html += '<div class="swatch-grid">';
        coreKeys.forEach(key => {
          html += swatchCard(key, colors[key], paperHex, CORE_ROLES[key]);
        });
        html += '</div>';
      }

      /* ─ Extended Palette ─ */
      if (extendedKeys.length) {
        html += '<div class="section-label">Extended Palette</div>';
        html += '<div class="swatch-grid">';
        extendedKeys.forEach(key => {
          const role = formatRole(key);
          html += swatchCard(key, colors[key], paperHex, role);
        });
        html += '</div>';
      }

      /* ─ Rule of One ─ */
      html += ruleOfOneSection(paperHex);

      /* ─ WCAG Summary ─ */
      html += wcagSummary(colors, paperHex);

      app.innerHTML = html;
    }

    /* ───────────────────────────────────────────────────────────── */
    /* Swatch card builder                                           */
    /* ───────────────────────────────────────────────────────────── */
    function swatchCard(key, hex, paperHex, role) {
      const ratio = contrastRatio(hex, paperHex);
      const level = wcagLevel(ratio);
      const lum = luminance(hexToRgb(hex));
      const chipTextColor = lum > 0.5 ? '#212121' : '#ffffff';
      const chipBadgeBg = lum > 0.5 ? 'rgba(33,33,33,0.12)' : 'rgba(255,255,255,0.2)';

      return '' +
        '<div class="swatch">' +
        '  <div class="swatch__chip" style="background:' + hex + '">' +
        '    <span class="swatch__chip-contrast chip-badge" style="color:' + chipTextColor +
             ';background:' + chipBadgeBg + '">' + ratio.toFixed(2) + ':1</span>' +
        '  </div>' +
        '  <div class="swatch__meta">' +
        '    <div class="swatch__var">--' + esc(key) + '</div>' +
        '    <div class="swatch__hex">' + esc(hex.toUpperCase()) + '</div>' +
        '    <div class="swatch__role">' + esc(role) + '</div>' +
        '    <div class="swatch__contrast-label contrast-' + level.cls + '">' +
             'WCAG ' + level.label + '</div>' +
        '  </div>' +
        '</div>';
    }

    /* ───────────────────────────────────────────────────────────── */
    /* Rule of One usage pattern                                     */
    /* ───────────────────────────────────────────────────────────── */
    function ruleOfOneSection(paperHex) {
      let html = '<section class="usage-section">';
      html += '<h2>Signal Blue: One per Interface</h2>';
      html += '<p>Cohere\'s interaction blue (#1863DC) appears as a single focal point — a button hover state, a single active link, or one highlighted data point in a dashboard. This chromatic restraint makes every accent count. Never multiple signals; never decorative blue elements. The color carries the full weight of user intent.</p>';

      html += '<div class="rule-of-one">';

      /* Correct example */
      html += '<div class="rule-example correct">';
      html += '<h3>Single Signal Button</h3>';
      html += '<p class="signal-demo">';
      html += '<span class="drop-cap">T</span>';
      html += 'he primary CTA stands alone, highlighted in blue. This is the user\'s path forward—one clear action in a quiet field of neutral grays and whites.';
      html += '</p>';
      html += '</div>';

      /* Incorrect example */
      html += '<div class="rule-example incorrect">';
      html += '<h3>Multiple Signal Colors</h3>';
      html += '<p>';
      html += '<span style="color:var(--signal,#1863dc)">This button is blue</span>, but so is <span style="color:var(--signal,#1863dc)">this link</span>, and <span style="color:var(--signal,#1863dc)">this accent</span>. The noise destroys hierarchy. Three signals mean no signal.';
      html += '</p>';
      html += '</div>';

      html += '</div>';
      html += '</section>';
      return html;
    }

    /* ───────────────────────────────────────────────────────────── */
    /* WCAG compliance summary                                       */
    /* ───────────────────────────────────────────────────────────── */
    function wcagSummary(colors, paperHex) {
      const keys = Object.keys(colors);
      let passAAA = 0, passAA = 0, passAALarge = 0, fail = 0;

      keys.forEach(k => {
        const ratio = contrastRatio(colors[k], paperHex);
        if (ratio >= 7) passAAA++;
        else if (ratio >= 4.5) passAA++;
        else if (ratio >= 3) passAALarge++;
        else fail++;
      });

      let html = '<div class="wcag-summary">';
      html += '<h2>WCAG 2.1 Compliance</h2>';
      html += '<p>All contrast ratios measured against the bright white paper background (#FFFFFF). Enterprise readability standards meet modern accessibility guidelines.</p>';
      html += row('AAA (7:1+)', passAAA, 'pass');
      html += row('AA (4.5:1+)', passAA, 'pass');
      html += row('AA Large Text (3:1+)', passAALarge, 'aa-large');
      html += row('Below threshold', fail, fail > 0 ? 'fail' : 'pass');
      html += '</div>';
      return html;

      function row(label, count, badge) {
        return '<div class="wcag-row">' +
               '<span class="wcag-badge wcag-badge--' + badge + '">' + count + '</span>' +
               '<span>' + label + '</span>' +
               '</div>';
      }
    }

    /* ───────────────────────────────────────────────────────────── */
    /* Utilities                                                      */
    /* ───────────────────────────────────────────────────────────── */
    function esc(s) {
      const d = document.createElement('div');
      d.textContent = String(s);
      return d.innerHTML;
    }

    function formatRole(key) {
      return key
        .replace(/([A-Z])/g, ' $1')
        .replace(/[-_]/g, ' ')
        .replace(/\b\w/g, c => c.toUpperCase())
        .trim();
    }
  </script>
</body>
</html>
