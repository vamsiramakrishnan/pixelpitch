<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Color Palette — Duolingo</title>
  <link rel="stylesheet" href="../colors_and_type.css">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: var(--font-body, system-ui, sans-serif);
      background: var(--paper, #ffffff);
      color: var(--ink, #3c3c3c);
      line-height: 1.6;
      padding: 0;
    }

    .page {
      max-width: 1200px;
      margin: 0 auto;
      padding: 64px 32px;
    }

    /* Header / Stage head */
    .header {
      margin-bottom: 72px;
      border-bottom: 3px solid var(--signal, #58cc02);
      padding-bottom: 32px;
    }

    .header__kicker {
      font-family: var(--font-body, system-ui, sans-serif);
      font-size: 14px;
      font-weight: 800;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--slate, #777777);
      margin-bottom: 12px;
    }

    .header__title {
      font-family: var(--font-body, system-ui, sans-serif);
      font-size: 72px;
      font-weight: 800;
      line-height: 0.95;
      letter-spacing: -0.02em;
      color: var(--ink, #3c3c3c);
      margin-bottom: 8px;
      position: relative;
      display: inline-block;
    }

    .header__title::after {
      content: '';
      position: absolute;
      bottom: -8px;
      left: 0;
      width: 100%;
      height: 8px;
      background: var(--signal, #58cc02);
      border-radius: 4px;
    }

    .header__subtitle {
      font-family: var(--font-body, system-ui, sans-serif);
      font-size: 22px;
      font-weight: 500;
      line-height: 1.55;
      color: var(--slate, #777777);
      max-width: 720px;
      margin-bottom: 16px;
      margin-top: 24px;
    }

    .header__meta {
      font-family: var(--font-body, system-ui, sans-serif);
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 0.08em;
      color: var(--slate, #777777);
      text-transform: uppercase;
    }

    /* Section labels */
    .section-label {
      font-family: var(--font-body, system-ui, sans-serif);
      font-size: 14px;
      font-weight: 800;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--slate, #777777);
      margin-bottom: 32px;
      padding-bottom: 16px;
      border-bottom: 2px solid var(--signal, #58cc02);
    }

    /* Swatch grid */
    .swatch-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 24px;
      margin-bottom: 64px;
    }

    .swatch {
      background: var(--paper, #ffffff);
      border: 2px solid var(--color-swan, #e5e5e5);
      border-radius: 12px;
      overflow: hidden;
      transition: all 0.2s ease;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
    }

    .swatch:hover {
      border-color: var(--signal, #58cc02);
      box-shadow: 0 4px 16px rgba(88, 204, 2, 0.15);
      transform: translateY(-2px);
    }

    .swatch__chip {
      width: 100%;
      aspect-ratio: 4 / 3;
      position: relative;
    }

    .swatch__chip-contrast {
      position: absolute;
      bottom: 12px;
      right: 12px;
      font-family: var(--font-body, system-ui, sans-serif);
      font-size: 11px;
      font-weight: 800;
      padding: 4px 12px;
      border-radius: 999px;
      line-height: 1.4;
      text-transform: uppercase;
      letter-spacing: 0.08em;
    }

    .swatch__meta {
      padding: 20px 20px 20px;
    }

    .swatch__var {
      font-family: var(--font-body, system-ui, sans-serif);
      font-size: 12px;
      font-weight: 800;
      color: var(--ink, #3c3c3c);
      word-break: break-all;
      margin-bottom: 6px;
      letter-spacing: 0.04em;
    }

    .swatch__hex {
      font-family: var(--font-mono, ui-monospace, monospace);
      font-size: 11px;
      color: var(--slate, #777777);
      margin-bottom: 8px;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      font-weight: 600;
    }

    .swatch__role {
      font-family: var(--font-body, system-ui, sans-serif);
      font-size: 14px;
      font-weight: 500;
      line-height: 1.5;
      color: var(--ink, #3c3c3c);
      margin-bottom: 8px;
    }

    .swatch__contrast-label {
      font-family: var(--font-body, system-ui, sans-serif);
      font-size: 11px;
      font-weight: 800;
      margin-top: 8px;
      letter-spacing: 0.06em;
      text-transform: uppercase;
    }

    .contrast-pass { color: var(--ink, #3c3c3c); }
    .contrast-fail { color: #ff4b4b; }
    .contrast-aa-large { color: #ff9600; }

    /* Chip contrast badge styling */
    .chip-badge {
      border-radius: 999px;
      font-weight: 800;
      display: inline-block;
    }

    /* Usage pattern section */
    .usage-section {
      margin-bottom: 64px;
      padding: 40px;
      background: var(--bone, #f7f7f7);
      border: 2px solid var(--signal, #58cc02);
      border-radius: 16px;
      box-shadow: 0 4px 12px rgba(88, 204, 2, 0.1);
    }

    .usage-section h2 {
      font-family: var(--font-body, system-ui, sans-serif);
      font-size: 48px;
      font-weight: 800;
      line-height: 1.1;
      letter-spacing: -0.01em;
      color: var(--ink, #3c3c3c);
      margin-bottom: 24px;
    }

    .usage-section p {
      font-family: var(--font-body, system-ui, sans-serif);
      font-size: 18px;
      font-weight: 500;
      line-height: 1.55;
      color: var(--ink, #3c3c3c);
      margin-bottom: 24px;
      max-width: 720px;
    }

    .rule-of-one {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 32px;
      margin-top: 32px;
      align-items: start;
    }

    .rule-example {
      padding: 28px;
      background: var(--paper, #ffffff);
      border: 2px solid var(--color-swan, #e5e5e5);
      border-radius: 12px;
      transition: all 0.2s ease;
    }

    .rule-example h3 {
      font-family: var(--font-body, system-ui, sans-serif);
      font-size: 28px;
      font-weight: 800;
      line-height: 1.2;
      color: var(--ink, #3c3c3c);
      margin-bottom: 12px;
    }

    .rule-example p {
      font-family: var(--font-body, system-ui, sans-serif);
      font-size: 16px;
      font-weight: 500;
      line-height: 1.55;
      color: var(--slate, #777777);
      margin-bottom: 0;
    }

    .correct {
      border: 3px solid var(--signal, #58cc02);
      background: linear-gradient(135deg, rgba(88, 204, 2, 0.04) 0%, transparent 100%);
    }

    .correct::before {
      content: '✓ CORRECT';
      display: block;
      font-family: var(--font-body, system-ui, sans-serif);
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 0.1em;
      color: var(--signal, #58cc02);
      text-transform: uppercase;
      margin-bottom: 12px;
      padding-bottom: 12px;
      border-bottom: 2px solid var(--signal, #58cc02);
    }

    .incorrect {
      border: 3px solid #ff4b4b;
      background: linear-gradient(135deg, rgba(255, 75, 75, 0.04) 0%, transparent 100%);
    }

    .incorrect::before {
      content: '✗ INCORRECT';
      display: block;
      font-family: var(--font-body, system-ui, sans-serif);
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 0.1em;
      color: #ff4b4b;
      text-transform: uppercase;
      margin-bottom: 12px;
      padding-bottom: 12px;
      border-bottom: 2px solid #ff4b4b;
    }

    .signal-demo {
      font-size: 18px;
      line-height: 1.55;
      font-weight: 500;
    }

    .signal-demo .drop-cap {
      font-family: var(--font-body, system-ui, sans-serif);
      font-size: 64px;
      font-weight: 800;
      color: var(--signal, #58cc02);
      float: left;
      line-height: 0.75;
      padding-right: 8px;
      margin-top: 2px;
    }

    .signal-demo em {
      color: var(--signal, #58cc02);
      font-style: italic;
      font-weight: 700;
    }

    /* WCAG summary */
    .wcag-summary {
      margin-top: 64px;
      padding: 40px;
      background: var(--bone, #f7f7f7);
      border: 2px solid var(--color-swan, #e5e5e5);
      border-radius: 16px;
    }

    .wcag-summary h2 {
      font-family: var(--font-body, system-ui, sans-serif);
      font-size: 48px;
      font-weight: 800;
      line-height: 1.1;
      letter-spacing: -0.01em;
      margin-bottom: 24px;
      color: var(--ink, #3c3c3c);
    }

    .wcag-summary p {
      font-family: var(--font-body, system-ui, sans-serif);
      font-size: 16px;
      font-weight: 500;
      line-height: 1.55;
      color: var(--slate, #777777);
      margin-bottom: 24px;
    }

    .wcag-row {
      display: flex;
      align-items: center;
      gap: 16px;
      padding: 12px 0;
      border-bottom: 1px solid var(--color-swan, #e5e5e5);
      font-family: var(--font-body, system-ui, sans-serif);
      font-size: 16px;
      font-weight: 500;
    }

    .wcag-row:last-child { border-bottom: none; }

    .wcag-badge {
      display: inline-block;
      padding: 6px 14px;
      border-radius: 999px;
      font-family: var(--font-body, system-ui, sans-serif);
      font-size: 11px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      min-width: 90px;
      text-align: center;
    }

    .wcag-badge--pass { background: var(--signal, #58cc02); color: var(--paper, #ffffff); }
    .wcag-badge--fail { background: #ff4b4b; color: var(--paper, #ffffff); }
    .wcag-badge--aa-large { background: #ff9600; color: var(--paper, #ffffff); }

    /* Loading state */
    .loading {
      text-align: center;
      padding: 80px 24px;
      color: var(--slate, #777777);
      font-family: var(--font-body, system-ui, sans-serif);
      font-size: 18px;
      font-weight: 500;
    }

    .loading::after {
      content: '';
      display: block;
      width: 32px;
      height: 32px;
      margin: 24px auto 0;
      border: 3px solid var(--signal, #58cc02);
      border-top-color: transparent;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    /* Responsive */
    @media (max-width: 768px) {
      .page { padding: 48px 20px; }
      .header { padding-bottom: 24px; margin-bottom: 48px; }
      .header__title { font-size: 48px; }
      .swatch-grid { grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 16px; }
      .rule-of-one { grid-template-columns: 1fr; gap: 16px; }
      .usage-section { padding: 24px; }
    }
  </style>
</head>
<body>
  <div class="page" id="app">
    <div class="loading">Loading design tokens…</div>
  </div>

  <script>
    /* ───────────────────────────────────────────────────────────── */
    /* Contrast ratio calculation (WCAG 2.1 relative luminance)      */
    /* ───────────────────────────────────────────────────────────── */
    function hexToRgb(hex) {
      hex = hex.replace(/^#/, '');
      if (hex.length === 3) hex = hex.split('').map(c => c + c).join('');
      const n = parseInt(hex, 16);
      return [(n >> 16) & 255, (n >> 8) & 255, n & 255];
    }

    function luminance([r, g, b]) {
      const [rs, gs, bs] = [r, g, b].map(c => {
        c /= 255;
        return c <= 0.03928 ? c / 12.92 : Math.pow((c + 0.055) / 1.055, 2.4);
      });
      return 0.2126 * rs + 0.7152 * gs + 0.0722 * bs;
    }

    function contrastRatio(hex1, hex2) {
      const l1 = luminance(hexToRgb(hex1));
      const l2 = luminance(hexToRgb(hex2));
      const lighter = Math.max(l1, l2);
      const darker = Math.min(l1, l2);
      return (lighter + 0.05) / (darker + 0.05);
    }

    function wcagLevel(ratio) {
      if (ratio >= 7) return { label: 'AAA', cls: 'pass' };
      if (ratio >= 4.5) return { label: 'AA', cls: 'pass' };
      if (ratio >= 3) return { label: 'AA Large', cls: 'aa-large' };
      return { label: 'Fail', cls: 'fail' };
    }

    /* ───────────────────────────────────────────────────────────── */
    /* Core color roles and descriptions                             */
    /* ───────────────────────────────────────────────────────────── */
    const CORE_ROLES = {
      paper:   'Primary background. Bright white canvas for lessons and interaction.',
      ink:     'Primary text color. Deep charcoal for readable body copy and headlines.',
      slate:   'Secondary text, captions, metadata. Warm gray for muted information.',
      signal:  'Brand primary. Owl green for CTAs, success states, and active elements.',
      bone:    'Secondary surface. Warm light gray for section breaks and sidebar fills.',
    };

    /* ───────────────────────────────────────────────────────────── */
    /* Render from tokens.json                                       */
    /* ───────────────────────────────────────────────────────────── */
    (window.__DESIGN_TOKENS__ 
      ? Promise.resolve({ ok: true, json: () => Promise.resolve(window.__DESIGN_TOKENS__) }) 
      : fetch('../tokens.json'))
      .then(r => {
        if (!r.ok) throw new Error('tokens.json not found (' + r.status + ')');
        return r.json();
      })
      .then(render)
      .catch(err => {
        document.getElementById('app').innerHTML =
          '<div class="loading" style="color:var(--signal,#58cc02)">' +
          'Could not load tokens.json — ' + err.message + '</div>';
      });

    function render(tokens) {
      const app = document.getElementById('app');
      const title = tokens.meta?.title || 'Design System';
      const summary = tokens.meta?.summary || '';
      const rawColors = tokens.colors || {};
      const paperHex = rawColors.paper || '#ffffff';

      /* Flatten nested color structure */
      const colors = {};
      for (const [k, v] of Object.entries(rawColors)) {
        if (typeof v === 'string') {
          colors[k] = v;
        } else if (v && typeof v === 'object') {
          for (const [sk, sv] of Object.entries(v)) {
            if (typeof sv === 'string') colors[k + '-' + sk] = sv;
          }
        }
      }

      /* Split core and extended */
      const coreKeys = Object.keys(CORE_ROLES).filter(k => colors[k]);
      const extendedKeys = Object.keys(colors).filter(k => !CORE_ROLES[k] && typeof colors[k] === 'string');

      let html = '';

      /* ─ Stage head header ─ */
      html += '<header class="header">';
      html += '  <div class="header__kicker">Color System</div>';
      html += '  <h1 class="header__title">Gamified<br>Palette</h1>';
      html += '  <p class="header__subtitle">Bright owl green with chunky shadows and vibrant secondary accents. One signal per surface—every button press earns visual feedback. Joy through color.</p>';
      html += '  <div class="header__meta">Core Palette + Extended Values &mdash; ' + (coreKeys.length + extendedKeys.length) + ' Tokens</div>';
      html += '</header>';

      /* ─ Core Palette ─ */
      if (coreKeys.length) {
        html += '<div class="section-label">Core Palette</div>';
        html += '<div class="swatch-grid">';
        coreKeys.forEach(key => {
          html += swatchCard(key, colors[key], paperHex, CORE_ROLES[key]);
        });
        html += '</div>';
      }

      /* ─ Extended Palette ─ */
      if (extendedKeys.length) {
        html += '<div class="section-label">Extended Palette</div>';
        html += '<div class="swatch-grid">';
        extendedKeys.forEach(key => {
          const role = formatRole(key);
          html += swatchCard(key, colors[key], paperHex, role);
        });
        html += '</div>';
      }

      /* ─ Rule of One ─ */
      html += ruleOfOneSection(paperHex);

      /* ─ WCAG Summary ─ */
      html += wcagSummary(colors, paperHex);

      app.innerHTML = html;
    }

    /* ───────────────────────────────────────────────────────────── */
    /* Swatch card builder                                           */
    /* ───────────────────────────────────────────────────────────── */
    function swatchCard(key, hex, paperHex, role) {
      const ratio = contrastRatio(hex, paperHex);
      const level = wcagLevel(ratio);
      const lum = luminance(hexToRgb(hex));
      const chipTextColor = lum > 0.5 ? '#3c3c3c' : '#ffffff';
      const chipBadgeBg = lum > 0.5 ? 'rgba(60,60,60,0.12)' : 'rgba(255,255,255,0.25)';

      return '' +
        '<div class="swatch">' +
        '  <div class="swatch__chip" style="background:' + hex + '">' +
        '    <span class="swatch__chip-contrast chip-badge" style="color:' + chipTextColor +
             ';background:' + chipBadgeBg + '">' + ratio.toFixed(2) + ':1</span>' +
        '  </div>' +
        '  <div class="swatch__meta">' +
        '    <div class="swatch__var">--' + esc(key) + '</div>' +
        '    <div class="swatch__hex">' + esc(hex.toUpperCase()) + '</div>' +
        '    <div class="swatch__role">' + esc(role) + '</div>' +
        '    <div class="swatch__contrast-label contrast-' + level.cls + '">' +
             'WCAG ' + level.label + '</div>' +
        '  </div>' +
        '</div>';
    }

    /* ───────────────────────────────────────────────────────────── */
    /* Rule of One usage pattern                                     */
    /* ───────────────────────────────────────────────────────────── */
    function ruleOfOneSection(paperHex) {
      let html = '<section class="usage-section">';
      html += '<h2>The Green Signal</h2>';
      html += '<p>Owl green is the dominant brand presence—appearing in primary buttons, success states, streak counters, and the mascot Duo. <em>Use signal green for every interactive moment</em> that celebrates user progress. Secondary accents (orange for streaks, pink for gems, red for loss) add emotional specificity without competing for attention.</p>';

      html += '<div class="rule-of-one">';

      /* Correct example */
      html += '<div class="rule-example correct">';
      html += '<h3>Strategic Signal Use</h3>';
      html += '<p class="signal-demo">';
      html += '<span class="drop-cap">C</span>';
      html += 'orrect answers glow green. Streak fire burns orange. Gems sparkle pink. Each color communicates a distinct emotional reward. The green CTA button sits heavy with a 4px shadow, ready to be pressed.';
      html += '</p>';
      html += '</div>';

      /* Incorrect example */
      html += '<div class="rule-example incorrect">';
      html += '<h3>Accent Overload</h3>';
      html += '<p>';
      html += 'Using signal green for <span style="color:var(--color-streak-orange,#ff9600)">headlines</span>, buttons, <span style="color:var(--color-gem-pink,#ce82ff)">badges</span>, and <span style="color:var(--eel-blue,#1cb0f6)">links</span> at once dilutes the brand and confuses hierarchy. Each accent has a specific, intentional role.';
      html += '</p>';
      html += '</div>';

      html += '</div>';
      html += '</section>';
      return html;
    }

    /* ───────────────────────────────────────────────────────────── */
    /* WCAG compliance summary                                       */
    /* ───────────────────────────────────────────────────────────── */
    function wcagSummary(colors, paperHex) {
      const keys = Object.keys(colors);
      let passAAA = 0, passAA = 0, passAALarge = 0, fail = 0;

      keys.forEach(k => {
        const ratio = contrastRatio(colors[k], paperHex);
        if (ratio >= 7) passAAA++;
        else if (ratio >= 4.5) passAA++;
        else if (ratio >= 3) passAALarge++;
        else fail++;
      });

      let html = '<div class="wcag-summary">';
      html += '<h2>WCAG 2.1 Compliance</h2>';
      html += '<p>Contrast ratios measured against the paper background (#FFFFFF). Duolingo prioritizes accessible text pairs for body copy and interactive labels. Display-only accents (like signal green on light surfaces) are reserved for decorative or short-duration highlights where context ensures legibility.</p>';
      html += row('AAA (7:1+)', passAAA, 'pass');
      html += row('AA (4.5:1+)', passAA, 'pass');
      html += row('AA Large Text (3:1+)', passAALarge, 'aa-large');
      html += row('Below threshold', fail, fail > 0 ? 'fail' : 'pass');
      html += '</div>';
      return html;

      function row(label, count, badge) {
        return '<div class="wcag-row">' +
               '<span class="wcag-badge wcag-badge--' + badge + '">' + count + '</span>' +
               '<span>' + label + '</span>' +
               '</div>';
      }
    }

    /* ───────────────────────────────────────────────────────────── */
    /* Utilities                                                      */
    /* ───────────────────────────────────────────────────────────── */
    function esc(s) {
      const d = document.createElement('div');
      d.textContent = String(s);
      return d.innerHTML;
    }

    function formatRole(key) {
      return key
        .replace(/([A-Z])/g, ' $1')
        .replace(/[-_]/g, ' ')
        .replace(/\b\w/g, c => c.toUpperCase())
        .trim();
    }
  </script>
</body>
</html>
