<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Type Specimen — Duolingo</title>
  <link rel="stylesheet" href="../colors_and_type.css">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: var(--font-body, system-ui, sans-serif);
      background: var(--paper, #ffffff);
      color: var(--ink, #3c3c3c);
      line-height: 1.6;
    }

    .page {
      max-width: 1100px;
      margin: 0 auto;
      padding: 96px 48px;
    }

    @media (max-width: 768px) {
      .page {
        padding: 64px 32px;
      }
    }

    @media (max-width: 480px) {
      .page {
        padding: 48px 24px;
      }
    }

    /* Header */
    .header {
      margin-bottom: 96px;
    }

    .header__kicker {
      font-family: var(--font-body, system-ui, sans-serif);
      font-size: 14px;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--slate, #777777);
      margin-bottom: 16px;
    }

    .header__title {
      font-family: var(--font-body, system-ui, sans-serif);
      font-size: 96px;
      font-weight: 800;
      line-height: 0.95;
      letter-spacing: -0.02em;
      color: var(--ink, #3c3c3c);
      margin-bottom: 24px;
    }

    .header__subtitle {
      font-family: var(--font-body, system-ui, sans-serif);
      font-size: 22px;
      font-weight: 500;
      line-height: 1.55;
      color: var(--slate, #777777);
      max-width: 680px;
      margin-bottom: 32px;
    }

    .header__rule {
      display: block;
      width: 96px;
      height: 4px;
      background: var(--signal, #58cc02);
      border: none;
      margin: 0;
      border-radius: 2px;
    }

    /* Font families section */
    .font-families {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 32px;
      margin-bottom: 96px;
      margin-top: 64px;
    }

    .font-card {
      background: var(--bone, #f7f7f7);
      border: 2px solid var(--signal, #58cc02);
      border-radius: 12px;
      padding: 32px;
      box-shadow: 0 4px 0 rgba(88, 204, 2, 0.3);
    }

    .font-card__label {
      font-family: var(--font-body, system-ui, sans-serif);
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--signal, #58cc02);
      margin-bottom: 12px;
    }

    .font-card__name {
      font-family: var(--font-body, system-ui, sans-serif);
      font-size: 36px;
      font-weight: 800;
      line-height: 1.1;
      color: var(--ink, #3c3c3c);
      margin-bottom: 8px;
    }

    .font-card__fallback {
      font-family: var(--font-mono, ui-monospace, monospace);
      font-size: 12px;
      color: var(--slate, #777777);
      word-break: break-word;
      font-weight: 500;
    }

    /* Character set block */
    .charmap-block {
      background: var(--bone, #f7f7f7);
      border: 2px solid var(--signal, #58cc02);
      border-radius: 12px;
      padding: 48px;
      margin-bottom: 96px;
      box-shadow: 0 4px 0 rgba(88, 204, 2, 0.2);
    }

    .charmap-block__label {
      font-family: var(--font-body, system-ui, sans-serif);
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--signal, #58cc02);
      margin-bottom: 24px;
    }

    .charmap-block__chars {
      font-family: var(--font-body, system-ui, sans-serif);
      font-size: 32px;
      font-weight: 800;
      line-height: 1.8;
      letter-spacing: 0.02em;
      color: var(--ink, #3c3c3c);
      word-break: break-word;
    }

    /* Section label */
    .section-label {
      font-family: var(--font-body, system-ui, sans-serif);
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--signal, #58cc02);
      margin-bottom: 32px;
      padding-bottom: 16px;
      border-bottom: 3px solid var(--signal, #58cc02);
    }

    /* Ramp row */
    .ramp-row {
      display: grid;
      grid-template-columns: 280px 1fr;
      gap: 48px;
      align-items: baseline;
      padding: 32px 0;
      border-bottom: 2px solid var(--bone, #f7f7f7);
    }

    .ramp-row:last-child {
      border-bottom: none;
    }

    @media (max-width: 800px) {
      .ramp-row {
        grid-template-columns: 1fr;
        gap: 16px;
      }
    }

    /* Left meta column */
    .ramp-meta__role {
      font-family: var(--font-body, system-ui, sans-serif);
      font-size: 18px;
      font-weight: 800;
      color: var(--ink, #3c3c3c);
      margin-bottom: 8px;
    }

    .ramp-meta__detail {
      font-family: var(--font-mono, ui-monospace, monospace);
      font-size: 11px;
      font-weight: 500;
      line-height: 1.8;
      color: var(--slate, #777777);
      letter-spacing: 0.02em;
    }

    /* Right sample column */
    .ramp-sample {
      color: var(--ink, #3c3c3c);
      overflow-wrap: break-word;
      word-spacing: 0.1em;
    }

    /* Ramp section */
    .ramp-section {
      margin-bottom: 96px;
    }

    /* Drop cap demo */
    .dropcap-demo {
      margin-bottom: 96px;
    }

    .dropcap-demo__label {
      font-family: var(--font-body, system-ui, sans-serif);
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--signal, #58cc02);
      margin-bottom: 32px;
      padding-bottom: 16px;
      border-bottom: 3px solid var(--signal, #58cc02);
    }

    .dropcap-container {
      background: var(--bone, #f7f7f7);
      border: 2px solid var(--signal, #58cc02);
      border-radius: 12px;
      padding: 48px;
      max-width: 680px;
      box-shadow: 0 4px 0 rgba(88, 204, 2, 0.2);
    }

    .dropcap-para {
      font-family: var(--font-body, system-ui, sans-serif);
      font-size: 17px;
      font-weight: 500;
      line-height: 1.55;
      color: var(--ink, #3c3c3c);
      margin: 0;
      text-align: left;
    }

    .dropcap {
      float: left;
      font-family: var(--font-body, system-ui, sans-serif);
      font-size: 128px;
      font-weight: 800;
      line-height: 0.85;
      color: var(--signal, #58cc02);
      margin-right: 8px;
      margin-top: -12px;
    }

    /* Loading */
    .loading {
      text-align: center;
      padding: 160px 48px;
      color: var(--slate, #777777);
      font-family: var(--font-body, system-ui, sans-serif);
      font-size: 18px;
      font-weight: 500;
    }

    .loading::after {
      content: '';
      display: block;
      width: 32px;
      height: 32px;
      margin: 24px auto 0;
      border: 3px solid var(--bone, #f7f7f7);
      border-top-color: var(--signal, #58cc02);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div class="page" id="app">
    <div class="loading">Loading design tokens&hellip;</div>
  </div>

  <script>
    const EDITORIAL_SAMPLES = [
      'Learn any language, build real skills.',
      'Every lesson unlocks a streak.',
      'Owl green means celebrate.',
      'Chunky shadows on every button.',
      'Big type conveys confidence.',
      'Rounded letterforms feel friendly.',
      'Gamification is intrinsic design.',
      'Duo appears when you need them.',
      'Bright surfaces, darker moments too.',
      'Four pixels of shadow on interaction.',
    ];

    const DROPCAP_TEXT = 'Duolingo is gamification rendered as visual language. The interface is unapologetically bright, with owl green as the brand primary and a chunky 4px bottom-shadow on every interactive element that reads like a 3D button waiting to be pressed. The page is white with thick 2–3px borders in a deep gray and the entire system reads like an iOS app from 2015 reborn with better hierarchy. Typography uses Feather Bold, a custom rounded sans, for chrome and Mona Sans for body. Display sizes are big and confident—Duolingo never whispers. Headings often carry the green underline or sit on a green pill. The mascot Duo, a green owl, appears as an active illustration character throughout. Shape language is friendly: 16–20px radii on cards, 12px on buttons, and 9999px on chips. Iconography is filled, rounded, and color-coded by skill. Every lesson surface has an instantly identifiable color pairing. Eight is the default weight for display faces. Body runs at five-hundred. When a user gets it right, the entire screen pulses green. When they miss, Duo tilts and Orange appears. This is a system designed for joy.';

    fetch('../tokens.json')
      .then(r => {
        if (!r.ok) throw new Error('tokens.json not found (' + r.status + ')');
        return r.json();
      })
      .then(render)
      .catch(err => {
        document.getElementById('app').innerHTML =
          '<div class="loading" style="color:#ff4b4b">' +
          'Could not load tokens.json — ' + err.message + '</div>';
      });

    function render(tokens) {
      const app = document.getElementById('app');
      const title = tokens.meta?.title || 'Design System';
      const summary = tokens.meta?.summary || '';

      const ramp = tokens.typography?.ramp || [];

      let html = '';

      /* Header */
      html += '<header class="header">';
      html += '  <div class="header__kicker">Type Specimen</div>';
      html += '  <h1 class="header__title">' + esc(title) + '</h1>';
      html += '  <p class="header__subtitle">' + esc(summary) + '</p>';
      html += '  <hr class="header__rule">';
      html += '</header>';

      /* Font families */
      const families = [
        { label: 'Display & UI', name: 'Feather Bold', fallback: "'DIN Round Pro', 'Helvetica Neue', sans-serif", note: 'Rounded sans, 800 weight' },
        { label: 'Body', name: 'Mona Sans', fallback: "'Helvetica Neue', system-ui, sans-serif", note: 'Friendly humanist sans' },
        { label: 'Monospace', name: 'JetBrains Mono', fallback: 'ui-monospace, Menlo, monospace', note: 'Schools & admin only' }
      ];

      html += '<div class="font-families">';
      families.forEach(f => {
        html += '<div class="font-card">';
        html += '  <div class="font-card__label">' + esc(f.label) + '</div>';
        html += '  <div class="font-card__name">' + esc(f.name) + '</div>';
        html += '  <div class="font-card__fallback">' + esc(f.fallback) + '</div>';
        html += '</div>';
      });
      html += '</div>';

      /* Character set */
      html += '<div class="charmap-block">';
      html += '  <div class="charmap-block__label">Character Set · Feather Bold Display</div>';
      html += '  <div class="charmap-block__chars" style="font-family:\'Feather Bold\',\'DIN Round Pro\',sans-serif">';
      html += '    AaBbCcDdEeFfGgHhIiJjKkLlMmNnOoPpQqRrSsTtUuVvWwXxYyZz<br>';
      html += '    0123456789 !@#$%&amp;*()–—\'""';
      html += '  </div>';
      html += '</div>';

      /* Type ramp */
      if (ramp.length) {
        html += '<div class="ramp-section">';
        html += '<div class="section-label">Type Ramp</div>';
        ramp.forEach((entry, i) => {
          html += rampRow(entry, i);
        });
        html += '</div>';
      }

      /* Drop cap demo */
      html += '<div class="dropcap-demo">';
      html += '<div class="dropcap-demo__label">Drop Cap — Feather Bold, Owl Green</div>';
      html += '<div class="dropcap-container">';
      const firstChar = DROPCAP_TEXT.charAt(0);
      const restText = DROPCAP_TEXT.substring(1);
      html += '<p class="dropcap-para">';
      html += '<span class="dropcap">' + esc(firstChar) + '</span>';
      html += esc(restText);
      html += '</p>';
      html += '</div>';
      html += '</div>';

      app.innerHTML = html;
    }

    function rampRow(entry, idx) {
      const role = entry.role || 'Role ' + (idx + 1);
      const size = entry.size || '16px';
      const weight = entry.weight || 400;
      const lh = entry.lineHeight || '1.5';
      const ls = entry.letterSpacing || '0';

      let fontFamily = 'var(--font-body)';
      if (entry.fontKey === 'display') fontFamily = 'var(--font-body)';
      else if (entry.fontKey === 'mono') fontFamily = 'var(--font-mono)';
      else if (entry.fontKey === 'ui') fontFamily = 'var(--font-body)';

      const sizeNum = parseFloat(size);
      const sampleIdx = idx % EDITORIAL_SAMPLES.length;
      let sample = EDITORIAL_SAMPLES[sampleIdx];

      /* Truncate very large samples */
      if (sizeNum >= 48) {
        sample = sample.split('.')[0].slice(0, 40);
        if (!sample.endsWith('.')) sample += '.';
      }

      let fontStyle = 'font-size:' + size + ';font-weight:' + weight + ';line-height:' + lh + ';';
      fontStyle += 'font-family:' + fontFamily + ';';
      if (ls && ls !== '0' && ls !== 'normal') fontStyle += 'letter-spacing:' + ls + ';';

      let meta = esc(size) + ' / ' + esc(String(weight));
      meta += '\n' + fontFamilyLabel(entry.fontKey);
      meta += '\nline-height: ' + esc(String(lh));
      if (ls && ls !== '0' && ls !== 'normal') meta += '\nletter-spacing: ' + esc(ls);

      return '' +
        '<div class="ramp-row">' +
        '  <div class="ramp-meta">' +
        '    <div class="ramp-meta__role">' + esc(role) + '</div>' +
        '    <pre class="ramp-meta__detail">' + meta + '</pre>' +
        '  </div>' +
        '  <div class="ramp-sample" style="' + fontStyle + '">' + esc(sample) + '</div>' +
        '</div>';
    }

    function fontFamilyLabel(key) {
      const map = {
        'display': 'Feather Bold',
        'body': 'Feather Bold / Mona Sans',
        'mono': 'JetBrains Mono',
        'ui': 'Mona Sans'
      };
      return map[key] || 'Feather Bold';
    }

    function esc(s) {
      const d = document.createElement('div');
      d.textContent = String(s);
      return d.innerHTML;
    }
  </script>
</body>
</html>
