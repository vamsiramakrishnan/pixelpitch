<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Brand Motifs — Luxury</title>
  <link rel="stylesheet" href="../colors_and_type.css">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: var(--font-body, system-ui, sans-serif);
      background: var(--paper, #ffffff);
      color: var(--ink, #111111);
      line-height: 1.6;
    }

    .page {
      max-width: 1100px;
      margin: 0 auto;
      padding: 64px 32px;
    }

    /* ──── Header ──── */
    .header {
      margin-bottom: 80px;
    }

    .header__kicker {
      font-family: var(--font-mono, ui-monospace, monospace);
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--slate, #666666);
      margin-bottom: 12px;
    }

    .header__title {
      font-family: var(--font-display, system-ui, sans-serif);
      font-size: 72px;
      font-weight: 700;
      line-height: 0.95;
      letter-spacing: -0.02em;
      color: var(--ink, #111111);
      margin-bottom: 16px;
    }

    .header__title span {
      color: var(--signal, #3b82f6);
    }

    .header__subtitle {
      font-family: var(--font-body, system-ui, sans-serif);
      font-size: 20px;
      font-weight: 400;
      line-height: 1.55;
      color: var(--slate, #666666);
      max-width: 680px;
      margin-bottom: 24px;
    }

    .header__rule {
      display: block;
      width: 80px;
      height: 2px;
      background: var(--ink, #111111);
      border: none;
      margin-top: 32px;
    }

    /* ──── Section ──── */
    .section {
      margin-bottom: 80px;
    }

    .section__label {
      font-family: var(--font-mono, ui-monospace, monospace);
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--slate, #666666);
      margin-bottom: 28px;
      padding-bottom: 12px;
      border-bottom: 2px solid var(--ink, #111111);
    }

    /* ──── Key Characteristics ──── */
    .traits-list {
      list-style: none;
      padding: 0;
    }

    .traits-list li {
      position: relative;
      padding: 16px 0 16px 28px;
      font-family: var(--font-body, system-ui, sans-serif);
      font-size: 18px;
      font-weight: 400;
      line-height: 1.55;
      color: var(--ink, #111111);
      border-bottom: 1px solid var(--border, #e5e5e5);
    }

    .traits-list li:last-child {
      border-bottom: none;
    }

    .traits-list li::before {
      content: '';
      position: absolute;
      left: 0;
      top: 24px;
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--signal, #3b82f6);
    }

    /* ──── Do's and Don'ts ──── */
    .dd-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 32px;
    }

    @media (max-width: 768px) {
      .dd-grid {
        grid-template-columns: 1fr;
      }
    }

    .dd-card {
      background: var(--paper, #ffffff);
      border: 1px solid var(--border, #e5e5e5);
      border-radius: var(--radius-md, 8px);
      padding: 32px;
    }

    .dd-card__heading {
      font-family: var(--font-mono, ui-monospace, monospace);
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      margin-bottom: 20px;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .dd-card__heading--do {
      color: var(--ink, #111111);
    }

    .dd-card__heading--dont {
      color: var(--signal, #3b82f6);
    }

    .dd-card__icon {
      width: 20px;
      height: 20px;
      border-radius: 50%;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      font-size: 12px;
      flex-shrink: 0;
      border: 2px solid currentColor;
    }

    .dd-card__icon--do {
      color: var(--ink, #111111);
    }

    .dd-card__icon--dont {
      color: var(--signal, #3b82f6);
    }

    .dd-list {
      list-style: none;
      padding: 0;
    }

    .dd-list li {
      font-family: var(--font-body, system-ui, sans-serif);
      font-size: 16px;
      font-weight: 400;
      line-height: 1.55;
      color: var(--ink, #111111);
      padding: 12px 0;
      border-bottom: 1px solid var(--border, #e5e5e5);
    }

    .dd-list li:last-child {
      border-bottom: none;
    }

    /* ──── Color Harmony Strip ──── */
    .harmony-strip {
      display: flex;
      border-radius: var(--radius-md, 8px);
      overflow: hidden;
      height: 120px;
      border: 1px solid var(--border, #e5e5e5);
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    }

    .harmony-strip__swatch {
      flex: 1;
      position: relative;
      transition: flex 0.3s ease;
      cursor: default;
      display: flex;
      align-items: flex-end;
      justify-content: center;
      padding-bottom: 12px;
    }

    .harmony-strip__swatch:hover {
      flex: 1.4;
    }

    .harmony-strip__label {
      font-family: var(--font-mono, ui-monospace, monospace);
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      padding: 4px 8px;
      white-space: nowrap;
      opacity: 0.7;
      transition: opacity 0.2s ease;
      color: var(--ink, #111111);
    }

    .harmony-strip__swatch:hover .harmony-strip__label {
      opacity: 1;
    }

    /* ──── Type Pairing Demo ──── */
    .type-pairing {
      background: var(--bone, #f5f5f5);
      border: 1px solid var(--border, #e5e5e5);
      border-radius: var(--radius-md, 8px);
      padding: 48px 40px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    }

    .type-pairing__kicker {
      font-family: var(--font-mono, ui-monospace, monospace);
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--slate, #666666);
      margin-bottom: 12px;
    }

    .type-pairing__display {
      font-family: var(--font-display, system-ui, sans-serif);
      font-size: 54px;
      font-weight: 700;
      line-height: 1.1;
      letter-spacing: -0.02em;
      color: var(--ink, #111111);
      margin-bottom: 20px;
    }

    .type-pairing__display span {
      color: var(--signal, #3b82f6);
    }

    .type-pairing__body {
      font-family: var(--font-body, system-ui, sans-serif);
      font-size: 18px;
      font-weight: 400;
      line-height: 1.65;
      color: var(--ink, #111111);
      max-width: 720px;
      margin-bottom: 28px;
    }

    .type-pairing__meta {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 24px;
      padding-top: 16px;
      border-top: 1px solid var(--border, #e5e5e5);
    }

    @media (max-width: 640px) {
      .type-pairing__meta {
        grid-template-columns: 1fr;
      }
    }

    .type-pairing__meta-item {
      font-family: var(--font-mono, ui-monospace, monospace);
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 0.06em;
      color: var(--slate, #666666);
    }

    .type-pairing__meta-label {
      font-weight: 700;
      color: var(--ink, #111111);
      display: block;
      margin-bottom: 4px;
    }

    /* ──── Atmosphere Card ──── */
    .atmosphere-card {
      background: var(--bone, #f5f5f5);
      border: 1px solid var(--border, #e5e5e5);
      border-radius: var(--radius-md, 8px);
      padding: 32px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    }

    .atmosphere-card p {
      font-family: var(--font-body, system-ui, sans-serif);
      font-size: 18px;
      font-weight: 400;
      line-height: 1.65;
      color: var(--ink, #111111);
    }

    /* ──── Premium Principle Visual ──── */
    .principle-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 32px;
      margin-top: 24px;
    }

    @media (max-width: 768px) {
      .principle-grid {
        grid-template-columns: 1fr;
      }
    }

    .principle-card {
      border: 1px solid var(--border, #e5e5e5);
      border-radius: var(--radius-md, 8px);
      aspect-ratio: 16 / 10;
      padding: 40px;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
      transition: box-shadow 0.3s ease;
    }

    .principle-card:hover {
      box-shadow: 0 8px 24px rgba(0,0,0,0.12);
    }

    .principle-card--correct {
      background: var(--paper, #ffffff);
    }

    .principle-card--incorrect {
      background: var(--bone, #f5f5f5);
    }

    .principle-card__kicker {
      font-family: var(--font-mono, ui-monospace, monospace);
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--slate, #666666);
      margin-bottom: 12px;
    }

    .principle-card__headline {
      font-family: var(--font-display, system-ui, sans-serif);
      font-size: 40px;
      font-weight: 700;
      line-height: 1.1;
      letter-spacing: -0.02em;
      color: var(--ink, #111111);
      margin-bottom: 0;
    }

    .principle-card__accent {
      color: var(--signal, #3b82f6);
    }

    .principle-card__label {
      font-family: var(--font-mono, ui-monospace, monospace);
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--slate, #666666);
      margin-top: 24px;
      padding-top: 16px;
      border-top: 1px solid var(--border, #e5e5e5);
    }

    /* ──── Loading ──── */
    .loading {
      text-align: center;
      padding: 120px 24px;
      color: var(--slate, #666666);
      font-size: 18px;
      font-family: var(--font-body, system-ui, sans-serif);
    }

    .loading::after {
      content: '';
      display: block;
      width: 32px;
      height: 32px;
      margin: 20px auto 0;
      border: 2px solid var(--border, #e5e5e5);
      border-top-color: var(--signal, #3b82f6);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div class="page" id="app">
    <div class="loading">Loading design tokens…</div>
  </div>

  <script>
    const CORE_COLOR_KEYS = ['paper', 'bone', 'ink', 'slate', 'signal'];

    (window.__DESIGN_TOKENS__ ? Promise.resolve({ ok: true, json: () => Promise.resolve(window.__DESIGN_TOKENS__) }) : fetch('../tokens.json'))
      .then(r => {
        if (!r.ok) throw new Error('tokens.json not found (' + r.status + ')');
        return r.json();
      })
      .then(render)
      .catch(err => {
        document.getElementById('app').innerHTML =
          '<div class="loading" style="color:#3b82f6">' +
          'Could not load tokens.json — ' + err.message + '</div>';
      });

    function render(tokens) {
      const app = document.getElementById('app');
      const colors = tokens.colors || {};
      const meta = tokens.meta || {};

      let html = '';

      /* ──── Header ──── */
      html += '<header class="header">';
      html += '  <div class="header__kicker">Brand Identity</div>';
      html += '  <h1 class="header__title">The <span>Premium</span> Design Language</h1>';
      html += '  <p class="header__subtitle">Bold typography, monochromatic sophistication, and deliberate hierarchy. Luxury through clarity and confident restraint.</p>';
      html += '  <hr class="header__rule">';
      html += '</header>';

      /* ──── Atmosphere ──── */
      html += '<div class="section">';
      html += '  <div class="section__label">Atmosphere</div>';
      html += '  <div class="atmosphere-card">';
      html += '    <p>This system breathes with white space and settles on a pure monochromatic foundation. The palette is white paper, neutral grays, and a single signal blue accent. Bold sans-serif headlines command every composition. Subtle shadows lift premium content. Consistent 8px spacing creates rhythm. Typography scales aggressively—headlines leap; body text stays measured. Every interaction transitions smoothly (150–250ms). This is not minimalism. This is clarity with conviction.</p>';
      html += '  </div>';
      html += '</div>';

      /* ──── Key Characteristics ──── */
      html += '<div class="section">';
      html += '  <div class="section__label">Key Characteristics</div>';
      html += '  <ul class="traits-list">';
      html += '    <li>Monochromatic palette: white paper, neutral grays, signal blue accent only</li>';
      html += '    <li>Bold sans-serif display font (700 weight) for all headlines</li>';
      html += '    <li>Clean system-ui/sans-serif stack for body and UI text</li>';
      html += '    <li>Generous whitespace and 8px spacing grid throughout</li>';
      html += '    <li>Subtle elevation shadows (0 2px 8px, 0 8px 24px) for depth, never harsh</li>';
      html += '    <li>Rounded corners (8px, 16px) on cards, inputs, buttons — soften without fussiness</li>';
      html += '    <li>Blue signal accent (#3b82f6) for interaction, focus, and emphasis only</li>';
      html += '    <li>Typography locked to three roles: display (700), body (400), mono (600)</li>';
      html += '    <li>All-caps uppercase mono labels above primary content sections</li>';
      html += '    <li>Smooth transitions (150–250ms) on hover, focus, and state changes</li>';
      html += '  </ul>';
      html += '</div>';

      /* ──── Do's and Don'ts ──── */
      html += '<div class="section">';
      html += '  <div class="section__label">Do\'s and Don\'ts</div>';
      html += '  <div class="dd-grid">';

      html += '  <div class="dd-card">';
      html += '    <div class="dd-card__heading dd-card__heading--do">';
      html += '      <span class="dd-card__icon dd-card__icon--do">✓</span> Do';
      html += '    </div>';
      html += '    <ul class="dd-list">';
      html += '      <li>Use bold (700 weight) sans-serif for all display headlines</li>';
      html += '      <li>Pair white (#FFFFFF) paper with light gray (#F5F5F5) for subtle contrast</li>';
      html += '      <li>Add subtle shadows (0 2px 8px rgba(0,0,0,0.08)) for elevation</li>';
      html += '      <li>Round corners at 8px (buttons, cards) or 16px (larger containers)</li>';
      html += '      <li>Use signal blue (#3B82F6) for links, focus states, and primary actions</li>';
      html += '      <li>Scale headlines aggressively: 54–72px for major, 28–40px for sub</li>';
      html += '      <li>Maintain 1.55–1.65 line height on body text for reading comfort</li>';
      html += '      <li>Apply 8px base spacing consistently across all layouts</li>';
      html += '      <li>Use monospace uppercase labels for section headers and metadata</li>';
      html += '      <li>Transition all interactive states smoothly (150–250ms)</li>';
      html += '    </ul>';
      html += '  </div>';

      html += '  <div class="dd-card">';
      html += '    <div class="dd-card__heading dd-card__heading--dont">';
      html += '      <span class="dd-card__icon dd-card__icon--dont">✕</span> Don\'t';
      html += '    </div>';
      html += '    <ul class="dd-list">';
      html += '      <li>Mix heavy serifs with sans-serif in the same composition</li>';
      html += '      <li>Introduce colors outside the core palette (no green, red, purple)</li>';
      html += '      <li>Use harsh, dark shadows (box-shadow: 0 10px 40px) for elevation</li>';
      html += '      <li>Round corners more than 16px unless intentionally playful</li>';
      html += '      <li>Apply multiple signal-blue accents on a single surface</li>';
      html += '      <li>Scale body text below 16px or above 22px without reason</li>';
      html += '      <li>Reduce line height below 1.5 on readable text blocks</li>';
      html += '      <li>Break the 8px spacing grid for alignment or rhythm</li>';
      html += '      <li>Use animated gradients, blurs, or glassmorphism effects</li>';
      html += '      <li>Skip transition easing — always use purposeful motion</li>';
      html += '    </ul>';
      html += '  </div>';

      html += '  </div>';
      html += '</div>';

      /* ──── Premium Principles ──── */
      html += '<div class="section">';
      html += '  <div class="section__label">Premium Principles</div>';
      html += '  <p style="font-family: var(--font-body); font-size: 16px; line-height: 1.65; color: var(--slate); margin-bottom: 24px; max-width: 840px;">Luxury is clarity, not decoration. Every pixel has purpose. Typography carries meaning. Shadows create dimension, not distraction. The blue accent appears where action matters—nowhere else.</p>';
      html += '  <div class="principle-grid">';

      html += '    <div class="principle-card principle-card--correct">';
      html += '      <div class="principle-card__kicker">Correct</div>';
      html += '      <div class="principle-card__headline">Bold words <span class="principle-card__accent">command</span> clarity</div>';
      html += '      <div class="principle-card__label">Typography is the primary visual element. Color accents secondary.</div>';
      html += '    </div>';

      html += '    <div class="principle-card principle-card--incorrect">';
      html += '      <div class="principle-card__kicker">Incorrect</div>';
      html += '      <div style="font-size: 24px; font-family: var(--font-display); color: var(--signal); margin-bottom: 12px;">Too many colors</div>';
      html += '      <div class="principle-card__headline">Dilutes the <span class="principle-card__accent">premium</span> feel</div>';
      html += '      <div class="principle-card__label">Multiple competing accents fracture the visual hierarchy.</div>';
      html += '    </div>';

      html += '  </div>';
      html += '</div>';

      /* ──── Color Harmony Strip ──── */
      const harmonyKeys = CORE_COLOR_KEYS.filter(k => colors[k]);
      if (harmonyKeys.length) {
        html += '<div class="section">';
        html += '  <div class="section__label">Color Harmony</div>';
        html += '  <div class="harmony-strip">';

        harmonyKeys.forEach(key => {
          const hex = colors[key];
          const lum = relativeLuminance(hex);
          const labelColor = lum > 0.5 ? '#111111' : '#f5f5f5';
          html += '<div class="harmony-strip__swatch" style="background:' + esc(hex) + '">';
          html += '  <span class="harmony-strip__label" style="color:' + labelColor + '">' + esc(key.toUpperCase()) + '</span>';
          html += '</div>';
        });

        html += '  </div>';
        html += '</div>';
      }

      /* ──── Typography Pairing ──── */
      html += '<div class="section">';
      html += '  <div class="section__label">Typography Pairing</div>';
      html += '  <div class="type-pairing">';

      html += '    <div class="type-pairing__kicker">Display + Body</div>';
      html += '    <div class="type-pairing__display">Bold headlines. <span>Clear</span> hierarchy.</div>';

      html += '    <div class="type-pairing__body">System-ui sans-serif unites the entire palette. Display headlines arrive at 700 weight, commanding 54–72px scale. Body text settles at 400 weight with generous line height (1.55–1.65) for comfortable reading. Monospace metadata (600 weight) anchors sections with uppercase labels. This three-tier system creates instant recognition and structural clarity without stylistic flourish.</div>';

      html += '    <div class="type-pairing__meta">';
      html += '      <div class="type-pairing__meta-item">';
      html += '        <span class="type-pairing__meta-label">Display Font</span>';
      html += '        system-ui, 700 weight';
      html += '      </div>';
      html += '      <div class="type-pairing__meta-item">';
      html += '        <span class="type-pairing__meta-label">Body Font</span>';
      html += '        system-ui, 400 weight';
      html += '      </div>';
      html += '      <div class="type-pairing__meta-item">';
      html += '        <span class="type-pairing__meta-label">Mono Font</span>';
      html += '        ui-monospace, 600 weight';
      html += '      </div>';
      html += '    </div>';
      html += '  </div>';
      html += '</div>';

      /* ──── Type Ramp ──── */
      html += '<div class="section">';
      html += '  <div class="section__label">Type Ramp & Roles</div>';
      html += '  <div style="border: 1px solid var(--border); border-radius: var(--radius-md); padding: 32px; background: var(--bone); box-shadow: 0 2px 8px rgba(0,0,0,0.08);">';

      const ramp = [
        { role: 'Hero', size: '72px', weight: '700', lineHeight: '0.95', font: 'Display', example: 'The future is bold' },
        { role: 'Display', size: '54px', weight: '700', lineHeight: '1.10', font: 'Display', example: 'Premium clarity' },
        { role: 'Headline', size: '40px', weight: '700', lineHeight: '1.10', font: 'Display', example: 'Section title' },
        { role: 'Subhead', size: '28px', weight: '700', lineHeight: '1.20', font: 'Display', example: 'Deck intro' },
        { role: 'Lead', size: '22px', weight: '600', lineHeight: '1.40', font: 'Display', example: 'Introductory paragraph lead' },
        { role: 'Body', size: '18px', weight: '400', lineHeight: '1.65', font: 'Body', example: 'Main paragraph text for comfortable reading and comprehension' },
        { role: 'Small', size: '16px', weight: '400', lineHeight: '1.55', font: 'Body', example: 'Secondary body copy and descriptions' },
        { role: 'Label', size: '14px', weight: '600', lineHeight: '1.40', font: 'Mono', example: 'Form labels and captions' },
        { role: 'Meta', size: '13px', weight: '600', lineHeight: '1.30', font: 'Mono', example: 'SOURCE · DATE · TIMESTAMP' }
      ];

      ramp.forEach((item, i) => {
        const fontFamily = item.font === 'Display' ? 'var(--font-display)' :
                          item.font === 'Body' ? 'var(--font-body)' : 'var(--font-mono)';
        const fontWeight = item.weight;

        html += '<div style="margin-bottom: 28px; padding-bottom: 24px; border-bottom: 1px solid var(--border); display: flex; gap: 24px; align-items: flex-start;">';
        html += '  <div style="flex: 0 0 160px;">';
        html += '    <div style="font-family: var(--font-mono); font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--slate); font-weight: 600; margin-bottom: 4px;">' + esc(item.role) + '</div>';
        html += '    <div style="font-family: var(--font-mono); font-size: 12px; color: var(--slate); line-height: 1.5;">' + esc(item.size) + '<br>' + esc(item.font) + ' ' + esc(item.weight) + '<br>LH ' + esc(item.lineHeight) + '</div>';
        html += '  </div>';
        html += '  <div style="flex: 1;">';
        html += '    <div style="font-family: ' + fontFamily + '; font-size: ' + item.size + '; font-weight: ' + fontWeight + '; line-height: ' + item.lineHeight + '; letter-spacing: ' + (item.role === 'Hero' || item.role === 'Display' ? '-0.02em' : '0') + '; color: var(--ink); margin-bottom: 8px;">' + esc(item.example) + '</div>';
        html += '  </div>';
        html += '</div>';
      });

      html += '  </div>';
      html += '</div>';

      app.innerHTML = html;
    }

    /* ──── Utilities ──── */
    function esc(s) {
      const d = document.createElement('div');
      d.textContent = String(s);
      return d.innerHTML;
    }

    function hexToRgb(hex) {
      hex = hex.replace(/^#/, '');
      if (hex.length === 3) hex = hex.split('').map(c => c + c).join('');
      const n = parseInt(hex, 16);
      return [(n >> 16) & 255, (n >> 8) & 255, n & 255];
    }

    function relativeLuminance(hex) {
      try {
        const [r, g, b] = hexToRgb(hex).map(c => {
          c /= 255;
          return c <= 0.03928 ? c / 12.92 : Math.pow((c + 0.055) / 1.055, 2.4);
        });
        return 0.2126 * r + 0.7152 * g + 0.0722 * b;
      } catch { return 0.5; }
    }
  </script>
</body>
