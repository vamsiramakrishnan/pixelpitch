<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Type Specimen — HashiCorp</title>
  <link rel="stylesheet" href="../colors_and_type.css">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: var(--font-body, system-ui, sans-serif);
      background: var(--paper, #15181e);
      color: var(--ink, #efeff1);
      line-height: 1.6;
    }

    .page {
      max-width: 1200px;
      margin: 0 auto;
      padding: 96px 48px;
    }

    @media (max-width: 768px) {
      .page {
        padding: 64px 32px;
      }
    }

    @media (max-width: 480px) {
      .page {
        padding: 48px 24px;
      }
    }

    /* Header */
    .header {
      margin-bottom: 96px;
      border-bottom: 1px solid var(--slate, #3b3d45);
      padding-bottom: 48px;
    }

    .header__kicker {
      font-family: var(--font-body, system-ui, sans-serif);
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 1.3px;
      text-transform: uppercase;
      color: var(--signal, #b2b6bd);
      margin-bottom: 24px;
    }

    .header__title {
      font-family: var(--font-body, system-ui, sans-serif);
      font-size: 82px;
      font-weight: 600;
      line-height: 1.17;
      letter-spacing: 0;
      color: var(--ink, #efeff1);
      margin-bottom: 24px;
      font-feature-settings: "kern" on;
    }

    .header__subtitle {
      font-family: var(--font-body, system-ui, sans-serif);
      font-size: 20px;
      font-weight: 400;
      line-height: 1.50;
      color: var(--signal, #b2b6bd);
      max-width: 800px;
      margin-bottom: 0;
    }

    /* Font families section */
    .font-families {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
      gap: 32px;
      margin-bottom: 96px;
      margin-top: 64px;
    }

    .font-card {
      background: transparent;
      border: 1px solid var(--slate, #3b3d45);
      border-radius: 5px;
      padding: 32px;
    }

    .font-card__label {
      font-family: var(--font-body, system-ui, sans-serif);
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 1.3px;
      text-transform: uppercase;
      color: var(--signal, #b2b6bd);
      margin-bottom: 16px;
    }

    .font-card__name {
      font-family: var(--font-body, system-ui, sans-serif);
      font-size: 34px;
      font-weight: 600;
      line-height: 1.18;
      color: var(--ink, #efeff1);
      margin-bottom: 12px;
      font-feature-settings: "kern" on;
    }

    .font-card__fallback {
      font-family: ui-monospace, monospace;
      font-size: 12px;
      color: var(--slate, #3b3d45);
      word-break: break-word;
      line-height: 1.6;
    }

    /* Character set block */
    .charmap-block {
      background: transparent;
      border: 1px solid var(--slate, #3b3d45);
      border-radius: 5px;
      padding: 48px;
      margin-bottom: 96px;
    }

    .charmap-block__label {
      font-family: var(--font-body, system-ui, sans-serif);
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 1.3px;
      text-transform: uppercase;
      color: var(--signal, #b2b6bd);
      margin-bottom: 32px;
    }

    .charmap-block__chars {
      font-family: var(--font-body, system-ui, sans-serif);
      font-size: 28px;
      font-weight: 600;
      line-height: 1.8;
      letter-spacing: 0.02em;
      color: var(--ink, #efeff1);
      word-break: break-word;
      font-feature-settings: "kern" on;
    }

    /* Section label */
    .section-label {
      font-family: var(--font-body, system-ui, sans-serif);
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 1.3px;
      text-transform: uppercase;
      color: var(--signal, #b2b6bd);
      margin-bottom: 32px;
      padding-bottom: 16px;
      border-bottom: 1px solid var(--slate, #3b3d45);
    }

    /* Ramp row */
    .ramp-row {
      display: grid;
      grid-template-columns: 320px 1fr;
      gap: 48px;
      align-items: baseline;
      padding: 40px 0;
      border-bottom: 1px solid var(--slate, #3b3d45);
    }

    .ramp-row:last-child {
      border-bottom: none;
    }

    @media (max-width: 900px) {
      .ramp-row {
        grid-template-columns: 1fr;
        gap: 24px;
      }
    }

    /* Left meta column */
    .ramp-meta__role {
      font-family: var(--font-body, system-ui, sans-serif);
      font-size: 19px;
      font-weight: 700;
      color: var(--ink, #efeff1);
      margin-bottom: 12px;
      line-height: 1.21;
    }

    .ramp-meta__detail {
      font-family: ui-monospace, monospace;
      font-size: 11px;
      font-weight: 400;
      line-height: 1.8;
      color: var(--slate, #3b3d45);
      letter-spacing: 0.02em;
      white-space: pre-line;
    }

    /* Right sample column */
    .ramp-sample {
      color: var(--ink, #efeff1);
      overflow-wrap: break-word;
      word-spacing: 0.1em;
      font-feature-settings: "kern" on;
    }

    /* Ramp section */
    .ramp-section {
      margin-bottom: 96px;
    }

    /* Drop cap demo */
    .dropcap-demo {
      margin-bottom: 96px;
    }

    .dropcap-demo__label {
      font-family: var(--font-body, system-ui, sans-serif);
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 1.3px;
      text-transform: uppercase;
      color: var(--signal, #b2b6bd);
      margin-bottom: 32px;
      padding-bottom: 16px;
      border-bottom: 1px solid var(--slate, #3b3d45);
    }

    .dropcap-container {
      background: transparent;
      border: 1px solid var(--slate, #3b3d45);
      border-radius: 5px;
      padding: 48px;
      max-width: 800px;
    }

    .dropcap-para {
      font-family: var(--font-body, system-ui, sans-serif);
      font-size: 20px;
      font-weight: 400;
      line-height: 1.50;
      color: var(--ink, #efeff1);
      margin: 0;
      text-align: left;
    }

    .dropcap {
      float: left;
      font-family: var(--font-body, system-ui, sans-serif);
      font-size: 96px;
      font-weight: 600;
      line-height: 0.75;
      color: var(--color-vagrant-blue, #1868f2);
      margin-right: 8px;
      margin-top: -6px;
      font-feature-settings: "kern" on;
    }

    /* Product color grid */
    .product-colors {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 24px;
      margin: 96px 0;
    }

    .product-color-swatch {
      border: 1px solid var(--slate, #3b3d45);
      border-radius: 5px;
      padding: 24px;
    }

    .product-color-swatch__color {
      width: 100%;
      height: 80px;
      border-radius: 3px;
      margin-bottom: 16px;
      border: 1px solid var(--slate, #3b3d45);
    }

    .product-color-swatch__label {
      font-family: var(--font-body, system-ui, sans-serif);
      font-size: 14px;
      font-weight: 600;
      color: var(--ink, #efeff1);
      margin-bottom: 6px;
    }

    .product-color-swatch__hex {
      font-family: ui-monospace, monospace;
      font-size: 12px;
      color: var(--slate, #3b3d45);
    }

    /* Loading */
    .loading {
      text-align: center;
      padding: 160px 48px;
      color: var(--slate, #3b3d45);
      font-family: var(--font-body, system-ui, sans-serif);
      font-size: 16px;
    }

    .loading::after {
      content: '';
      display: block;
      width: 32px;
      height: 32px;
      margin: 24px auto 0;
      border: 2px solid var(--slate, #3b3d45);
      border-top-color: var(--color-vagrant-blue, #1868f2);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div class="page" id="app">
    <div class="loading">Loading design tokens&hellip;</div>
  </div>

  <script>
    const EDITORIAL_SAMPLES = [
      'Infrastructure as code, readable as prose.',
      'Terraform brings the cloud into version control.',
      'Vault encrypts secrets across any infrastructure.',
      'Waypoint unifies deployment workflows.',
      'Enterprise-grade automation, not vendor lock-in.',
      'HashiCorp solves the complexity problem.',
      'Every cloud, one unified platform.',
      'Secure, consistent, scalable operations.',
      'The infrastructure you can reason about.',
      'Enterprise workflows demand enterprise typography.',
      'Kern on, always, infrastructure-grade letterforms.',
      'Dual-mode design: light for information, dark for production.',
    ];

    const DROPCAP_TEXT = 'HashiCorp demands a typography system as architecturally sound as the infrastructure platforms it powers. The brand font carries substantial weight—literally, through 600–700 font-weights—creating dense, load-bearing headline blocks that communicate enterprise confidence without decoration. System UI handles the body text, keeping prose readable beneath the authoritative headings. Every heading uses tight line-heights of 1.17–1.21, stacking text with infrastructural solidity. Body text expands to 1.50–1.69 line-height, creating breathing room for comfortable reading rhythm. OpenType kern features are enabled on all brand typography—letterfitting is non-negotiable in an infrastructure platform. The uppercase label with 1.3px letter-spacing serves as the systematic wayfinding marker. Product color tokens—Terraform purple, Vault yellow, Waypoint teal, Vagrant blue—inject chromatic identity into a black-and-white parent system. This is not decorative thinking. This is structural typography for structural systems. Dark mode by default, because infrastructure runs in the background.';

    fetch('../tokens.json')
      .then(r => {
        if (!r.ok) throw new Error('tokens.json not found (' + r.status + ')');
        return r.json();
      })
      .then(render)
      .catch(err => {
        document.getElementById('app').innerHTML =
          '<div class="loading" style="color:#1868f2">' +
          'Could not load tokens.json — ' + err.message + '</div>';
      });

    function render(tokens) {
      const app = document.getElementById('app');
      const title = tokens.meta?.title || 'Design System';
      const summary = tokens.meta?.summary || '';

      const ramp = tokens.typography?.ramp || [];
      const colors = tokens.colors?.extended || {};

      let html = '';

      /* Header */
      html += '<header class="header">';
      html += '  <div class="header__kicker">Type Specimen</div>';
      html += '  <h1 class="header__title">' + esc(title) + '</h1>';
      html += '  <p class="header__subtitle">' + esc(summary) + '</p>';
      html += '</header>';

      /* Font families */
      const families = [
        { label: 'Brand & UI', name: 'System UI', fallback: 'system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial', note: 'All weights 400–700' },
        { label: 'Body & Nav', name: 'System UI', fallback: 'system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial', note: 'Weights 400–500' },
        { label: 'Monospace', name: 'UI Monospace', fallback: 'ui-monospace, monospace, Monaco, Menlo', note: 'Metadata & tokens' }
      ];

      html += '<div class="font-families">';
      families.forEach(f => {
        html += '<div class="font-card">';
        html += '  <div class="font-card__label">' + esc(f.label) + '</div>';
        html += '  <div class="font-card__name">' + esc(f.name) + '</div>';
        html += '  <div class="font-card__fallback">' + esc(f.fallback) + '</div>';
        html += '</div>';
      });
      html += '</div>';

      /* Character set */
      html += '<div class="charmap-block">';
      html += '  <div class="charmap-block__label">Character Set · System UI 600</div>';
      html += '  <div class="charmap-block__chars">';
      html += '    AaBbCcDdEeFfGgHhIiJjKkLlMmNnOoPpQqRrSsTtUuVvWwXxYyZz<br>';
      html += '    0123456789 !@#$%&amp;*()&ndash;&mdash;&lsquo;&rsquo;&ldquo;&rdquo;';
      html += '  </div>';
      html += '</div>';

      /* Product colors */
      html += '<div class="section-label">Product Brand Colors</div>';
      html += '<div class="product-colors">';
      const productColors = [
        { name: 'Terraform Purple', hex: '#7b42bc' },
        { name: 'Vault Yellow', hex: '#ffcf25' },
        { name: 'Waypoint Teal', hex: '#14c6cb' },
        { name: 'Vagrant Blue', hex: '#1868f2' },
      ];
      productColors.forEach(pc => {
        html += '<div class="product-color-swatch">';
        html += '  <div class="product-color-swatch__color" style="background:' + esc(pc.hex) + '"></div>';
        html += '  <div class="product-color-swatch__label">' + esc(pc.name) + '</div>';
        html += '  <div class="product-color-swatch__hex">' + esc(pc.hex) + '</div>';
        html += '</div>';
      });
      html += '</div>';

      /* Type ramp */
      if (ramp.length) {
        html += '<div class="ramp-section">';
        html += '<div class="section-label">Type Ramp</div>';
        ramp.forEach((entry, i) => {
          html += rampRow(entry, i);
        });
        html += '</div>';
      }

      /* Drop cap demo */
      html += '<div class="dropcap-demo">';
      html += '<div class="dropcap-demo__label">Drop Cap — Vagrant Blue, System UI 600</div>';
      html += '<div class="dropcap-container">';
      const firstChar = DROPCAP_TEXT.charAt(0);
      const restText = DROPCAP_TEXT.substring(1);
      html += '<p class="dropcap-para">';
      html += '<span class="dropcap">' + esc(firstChar) + '</span>';
      html += esc(restText);
      html += '</p>';
      html += '</div>';
      html += '</div>';

      app.innerHTML = html;
    }

    function rampRow(entry, idx) {
      const role = entry.role || 'Role ' + (idx + 1);
      const size = entry.size || '16px';
      const weight = entry.weight || 400;
      const lh = entry.lineHeight || '1.5';
      const ls = entry.letterSpacing || '0';

      let fontFamily = 'var(--font-body)';
      if (entry.fontKey === 'ui') fontFamily = 'system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial';
      else if (entry.fontKey === 'mono') fontFamily = 'ui-monospace, monospace';

      const sizeNum = parseFloat(size);
      const sampleIdx = idx % EDITORIAL_SAMPLES.length;
      let sample = EDITORIAL_SAMPLES[sampleIdx];

      /* Truncate very large samples */
      if (sizeNum >= 70) {
        sample = sample.split('.')[0].slice(0, 45);
        if (!sample.endsWith('.')) sample += '.';
      }

      let fontStyle = 'font-size:' + size + ';font-weight:' + weight + ';line-height:' + lh + ';';
      fontStyle += 'font-family:' + fontFamily + ';';
      if (ls && ls !== '0' && ls !== 'normal') fontStyle += 'letter-spacing:' + ls + ';';
      fontStyle += 'font-feature-settings:"kern" on;';

      let meta = esc(size) + ' / ' + esc(String(weight));
      meta += '\n' + fontFamilyLabel(entry.fontKey);
      meta += '\nline-height: ' + esc(String(lh));
      if (ls && ls !== '0' && ls !== 'normal') meta += '\nletter-spacing: ' + esc(ls);

      return '' +
        '<div class="ramp-row">' +
        '  <div class="ramp-meta">' +
        '    <div class="ramp-meta__role">' + esc(role) + '</div>' +
        '    <pre class="ramp-meta__detail">' + meta + '</pre>' +
        '  </div>' +
        '  <div class="ramp-sample" style="' + fontStyle + '">' + esc(sample) + '</div>' +
        '</div>';
    }

    function fontFamilyLabel(key) {
      const map = {
        'ui': 'System UI',
        'display': 'System UI',
        'mono': 'UI Monospace'
      };
      return map[key] || 'System UI';
    }

    function esc(s) {
      const d = document.createElement('div');
      d.textContent = String(s);
      return d.innerHTML;
    }
  </script>
</body>
</html>
