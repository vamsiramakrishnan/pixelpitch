<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Color Palette — Arc Browser</title>
  <link rel="stylesheet" href="../colors_and_type.css">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: var(--font-body, system-ui, sans-serif);
      background: linear-gradient(135deg, #ff7e5f 0%, #feb47b 100%);
      color: var(--ink);
      line-height: 1.6;
      padding: 0;
      min-height: 100vh;
    }

    .page {
      max-width: 1280px;
      margin: 0 auto;
      padding: 64px 32px;
    }

    /* Header with gradient backdrop */
    .header {
      margin-bottom: 64px;
      padding: 48px;
      background: rgba(255, 255, 255, 0.85);
      backdrop-filter: blur(20px);
      border-radius: 16px;
      border: 1px solid rgba(255, 255, 255, 0.4);
    }

    .header__eyebrow {
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--slate);
      margin-bottom: 12px;
    }

    .header__title {
      font-family: var(--font-display, system-ui, sans-serif);
      font-size: 48px;
      font-weight: 700;
      line-height: 1.15;
      letter-spacing: -0.02em;
      color: var(--ink);
      margin-bottom: 16px;
    }

    .header__subtitle {
      font-size: 18px;
      color: var(--slate);
      max-width: 640px;
      line-height: 1.5;
    }

    .header__rule {
      display: block;
      width: 60px;
      height: 3px;
      background: linear-gradient(90deg, #b794f4, #ff5f5f);
      border: none;
      margin-top: 24px;
      border-radius: 2px;
    }

    /* Section structure */
    .section {
      margin-bottom: 72px;
    }

    .section-label {
      font-family: var(--font-display, system-ui, sans-serif);
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--slate);
      margin-bottom: 24px;
      padding-bottom: 12px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.3);
    }

    /* Swatch grid */
    .swatch-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: 20px;
      margin-bottom: 48px;
    }

    .swatch {
      background: rgba(255, 255, 255, 0.7);
      backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.4);
      border-radius: 12px;
      overflow: hidden;
      transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .swatch:hover {
      background: rgba(255, 255, 255, 0.85);
      transform: translateY(-4px);
      box-shadow: 0 12px 32px rgba(0, 0, 0, 0.12);
      border-color: rgba(255, 255, 255, 0.6);
    }

    .swatch__chip {
      width: 100%;
      aspect-ratio: 4 / 3;
      position: relative;
      overflow: hidden;
    }

    .swatch__chip-contrast {
      position: absolute;
      bottom: 10px;
      right: 12px;
      font-size: 10px;
      font-weight: 700;
      padding: 3px 10px;
      border-radius: 4px;
      line-height: 1.3;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .swatch__meta {
      padding: 16px;
    }

    .swatch__var {
      font-family: var(--font-mono, ui-monospace, monospace);
      font-size: 12px;
      color: var(--ink);
      word-break: break-all;
      margin-bottom: 4px;
      font-weight: 500;
    }

    .swatch__hex {
      font-family: var(--font-mono, ui-monospace, monospace);
      font-size: 11px;
      color: var(--slate);
      margin-bottom: 8px;
      letter-spacing: 0.02em;
    }

    .swatch__role {
      font-size: 12px;
      line-height: 1.45;
      color: var(--slate);
      margin-bottom: 8px;
    }

    .swatch__contrast-label {
      font-size: 11px;
      font-weight: 700;
      margin-top: 4px;
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }

    .contrast-pass { color: #22863a; }
    .contrast-fail { color: #cb2431; }
    .contrast-aa-large { color: #bf8700; }

    /* Glass surface demo */
    .glass-demo {
      margin-bottom: 72px;
      padding: 48px;
      background: rgba(255, 255, 255, 0.85);
      backdrop-filter: blur(20px);
      border-radius: 16px;
      border: 1px solid rgba(255, 255, 255, 0.4);
    }

    .glass-demo h3 {
      font-size: 18px;
      font-weight: 600;
      margin-bottom: 24px;
      color: var(--ink);
    }

    .glass-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 16px;
    }

    .glass-swatch {
      padding: 24px;
      border-radius: 12px;
      text-align: center;
      border: 1px solid rgba(255, 255, 255, 0.4);
    }

    .glass-swatch-light {
      background: rgba(255, 255, 255, 0.7);
      backdrop-filter: blur(20px);
      color: var(--ink);
    }

    .glass-swatch-medium {
      background: rgba(255, 255, 255, 0.5);
      backdrop-filter: blur(20px);
      color: var(--ink);
    }

    .glass-swatch-heavy {
      background: rgba(255, 255, 255, 0.85);
      backdrop-filter: blur(20px);
      color: var(--ink);
    }

    .glass-swatch-dark {
      background: rgba(20, 20, 25, 0.6);
      backdrop-filter: blur(20px);
      color: #fafafa;
    }

    .glass-label {
      font-family: var(--font-mono, ui-monospace, monospace);
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      margin-top: 12px;
    }

    .glass-desc {
      font-size: 12px;
      margin-top: 4px;
      opacity: 0.7;
    }

    /* Gradient showcase */
    .gradient-showcase {
      margin-bottom: 72px;
      padding: 48px;
      background: rgba(255, 255, 255, 0.85);
      backdrop-filter: blur(20px);
      border-radius: 16px;
      border: 1px solid rgba(255, 255, 255, 0.4);
    }

    .gradient-showcase h3 {
      font-size: 18px;
      font-weight: 600;
      margin-bottom: 24px;
      color: var(--ink);
    }

    .gradient-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
      gap: 20px;
    }

    .gradient-card {
      border-radius: 12px;
      overflow: hidden;
      border: 1px solid rgba(255, 255, 255, 0.4);
    }

    .gradient-card__preview {
      width: 100%;
      height: 120px;
      position: relative;
    }

    .gradient-card__meta {
      padding: 16px;
      background: rgba(255, 255, 255, 0.7);
      backdrop-filter: blur(20px);
    }

    .gradient-card__name {
      font-size: 13px;
      font-weight: 600;
      color: var(--ink);
      margin-bottom: 6px;
    }

    .gradient-card__vars {
      font-family: var(--font-mono, ui-monospace, monospace);
      font-size: 10px;
      color: var(--slate);
      line-height: 1.5;
    }

    /* WCAG summary */
    .wcag-summary {
      margin-top: 72px;
      padding: 48px;
      background: rgba(255, 255, 255, 0.85);
      backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.4);
      border-radius: 16px;
    }

    .wcag-summary h2 {
      font-family: var(--font-display, system-ui, sans-serif);
      font-size: 22px;
      font-weight: 600;
      margin-bottom: 12px;
      color: var(--ink);
    }

    .wcag-summary p {
      font-size: 13px;
      color: var(--slate);
      margin-bottom: 24px;
    }

    .wcag-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 16px;
    }

    .wcag-card {
      padding: 20px;
      background: rgba(255, 255, 255, 0.5);
      border-radius: 8px;
      border: 1px solid rgba(255, 255, 255, 0.3);
      text-align: center;
    }

    .wcag-number {
      font-size: 32px;
      font-weight: 700;
      color: var(--ink);
      margin-bottom: 8px;
    }

    .wcag-label {
      font-size: 12px;
      font-weight: 600;
      color: var(--slate);
      text-transform: uppercase;
      letter-spacing: 0.08em;
    }

    /* Loading state */
    .loading {
      text-align: center;
      padding: 120px 24px;
      color: var(--slate);
      font-size: 16px;
    }

    .loading::after {
      content: '';
      display: block;
      width: 40px;
      height: 40px;
      margin: 20px auto 0;
      border: 3px solid rgba(255, 255, 255, 0.3);
      border-top-color: rgba(255, 255, 255, 0.8);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    /* Utility: text on colored backgrounds */
    .color-text-light { color: var(--ink); }
    .color-text-dark { color: #fafafa; }
  </style>
</head>
<body>
  <div class="page" id="app">
    <div class="loading">Loading design tokens…</div>
  </div>

  <script>
    /* ─────────────────────────────────────────────────────────────────── */
    /* WCAG 2.1 Contrast Ratio Calculation                                 */
    /* ─────────────────────────────────────────────────────────────────── */
    function hexToRgb(hex) {
      hex = hex.replace(/^#/, '');
      if (hex.length === 3) hex = hex.split('').map(c => c + c).join('');
      const n = parseInt(hex, 16);
      return [(n >> 16) & 255, (n >> 8) & 255, n & 255];
    }

    function luminance([r, g, b]) {
      const [rs, gs, bs] = [r, g, b].map(c => {
        c /= 255;
        return c <= 0.03928 ? c / 12.92 : Math.pow((c + 0.055) / 1.055, 2.4);
      });
      return 0.2126 * rs + 0.7152 * gs + 0.0722 * bs;
    }

    function contrastRatio(hex1, hex2) {
      const l1 = luminance(hexToRgb(hex1));
      const l2 = luminance(hexToRgb(hex2));
      const lighter = Math.max(l1, l2);
      const darker = Math.min(l1, l2);
      return (lighter + 0.05) / (darker + 0.05);
    }

    function wcagLevel(ratio) {
      if (ratio >= 7) return { label: 'AAA', cls: 'pass' };
      if (ratio >= 4.5) return { label: 'AA', cls: 'pass' };
      if (ratio >= 3) return { label: 'AA Large', cls: 'aa-large' };
      return { label: 'Fail', cls: 'fail' };
    }

    /* ─────────────────────────────────────────────────────────────────── */
    /* Core Token Roles & Descriptions                                     */
    /* ─────────────────────────────────────────────────────────────────── */
    const CORE_ROLES = {
      paper:    'Page background & canvas',
      ink:      'Primary text',
      slate:    'Secondary & muted text',
      signal:   'Primary accent (Arc Lavender)',
      bone:     'Subtle background tint',
      border:   'Dividers and hairlines',
      surface:  'Dark surface & chrome'
    };

    const EXTENDED_ROLES = {
      'sunset-start':   'Sunset gradient origin (peach)',
      'sunset-end':     'Sunset gradient terminus (coral)',
      'twilight-start': 'Twilight gradient origin (violet)',
      'twilight-end':   'Twilight gradient terminus (fuchsia)',
      'aurora-start':   'Aurora gradient origin (mint)',
      'aurora-end':     'Aurora gradient terminus (cyan)',
      'ink-muted':      'Tertiary text & captions',
      'ink-inverse':    'Text on dark surfaces',
      'arc-coral':      'Brand coral accent',
      'success':        'Confirmation & positive state',
      'warning':        'Permission & alert state',
      'error':          'Error & destructive state'
    };

    /* ─────────────────────────────────────────────────────────────────── */
    /* Fetch and Render                                                    */
    /* ─────────────────────────────────────────────────────────────────── */
    (window.__DESIGN_TOKENS__ 
      ? Promise.resolve({ ok: true, json: () => Promise.resolve(window.__DESIGN_TOKENS__) }) 
      : fetch('../tokens.json'))
      .then(r => {
        if (!r.ok) throw new Error('tokens.json not found (' + r.status + ')');
        return r.json();
      })
      .then(render)
      .catch(err => {
        document.getElementById('app').innerHTML =
          '<div class="loading" style="color:#cb2431">' +
          'Could not load tokens.json — ' + esc(err.message) + '</div>';
      });

    function render(tokens) {
      const app = document.getElementById('app');
      const rawColors = tokens.colors || {};
      const paperHex = rawColors.paper || '#ffffff';

      /* Flatten nested structure */
      const colors = {};
      for (const [k, v] of Object.entries(rawColors)) {
        if (typeof v === 'string') { colors[k] = v; }
        else if (v && typeof v === 'object') {
          for (const [sk, sv] of Object.entries(v)) {
            if (typeof sv === 'string') colors[k + '-' + sk] = sv;
          }
        }
      }

      /* Partition core vs extended */
      const coreKeys = Object.keys(CORE_ROLES).filter(k => colors[k]);
      const extendedKeys = Object.keys(colors).filter(k => !CORE_ROLES[k] && typeof colors[k] === 'string');

      let html = '';

      /* ─ Header ─ */
      html += '<header class="header">';
      html += '  <div class="header__eyebrow">Color Palette</div>';
      html += '  <h1 class="header__title">Frosted Glass & Gradient</h1>';
      html += '  <p class="header__subtitle">Arc\'s translucent surfaces and theme-driven color gradients. ' + (coreKeys.length + extendedKeys.length) + ' tokens total.</p>';
      html += '  <hr class="header__rule">';
      html += '</header>';

      /* ─ Gradient Showcase ─ */
      html += gradientShowcase(colors);

      /* ─ Glass Surface Demo ─ */
      html += glassSurfaceDemo();

      /* ─ Core Palette ─ */
      if (coreKeys.length) {
        html += '<section class="section">';
        html += '<div class="section-label">Core Palette</div>';
        html += '<div class="swatch-grid">';
        coreKeys.forEach(key => {
          html += swatchCard(key, colors[key], paperHex, CORE_ROLES[key]);
        });
        html += '</div>';
        html += '</section>';
      }

      /* ─ Extended Palette ─ */
      if (extendedKeys.length) {
        html += '<section class="section">';
        html += '<div class="section-label">Extended & Semantic Palette</div>';
        html += '<div class="swatch-grid">';
        extendedKeys.forEach(key => {
          const role = EXTENDED_ROLES[key] || formatRole(key);
          html += swatchCard(key, colors[key], paperHex, role);
        });
        html += '</div>';
        html += '</section>';
      }

      /* ─ WCAG Summary ─ */
      html += wcagSummary(colors, paperHex);

      app.innerHTML = html;
    }

    /* ─────────────────────────────────────────────────────────────────── */
    /* Gradient Showcase                                                   */
    /* ─────────────────────────────────────────────────────────────────── */
    function gradientShowcase(colors) {
      const gradients = [
        {
          name: 'Sunset',
          start: 'sunset-start',
          end: 'sunset-end',
          desc: 'Default theme: peach to coral warmth'
        },
        {
          name: 'Twilight',
          start: 'twilight-start',
          end: 'twilight-end',
          desc: 'Violet to fuchsia mood'
        },
        {
          name: 'Aurora',
          start: 'aurora-start',
          end: 'aurora-end',
          desc: 'Mint to cyan freshness'
        }
      ];

      let html = '<section class="gradient-showcase">';
      html += '<h3>Theme Gradients</h3>';
      html += '<div class="gradient-grid">';

      gradients.forEach(g => {
        if (colors[g.start] && colors[g.end]) {
          html += '<div class="gradient-card">';
          html += '<div class="gradient-card__preview" style="background:linear-gradient(135deg,' + colors[g.start] + ',' + colors[g.end] + ')"></div>';
          html += '<div class="gradient-card__meta">';
          html += '  <div class="gradient-card__name">' + esc(g.name) + '</div>';
          html += '  <div class="gradient-card__vars">';
          html += '    --color-' + g.start + '<br>';
          html += '    --color-' + g.end;
          html += '  </div>';
          html += '  <div style="font-size:11px;margin-top:8px;color:var(--slate)">' + esc(g.desc) + '</div>';
          html += '</div>';
          html += '</div>';
        }
      });

      html += '</div>';
      html += '</section>';
      return html;
    }

    /* ─────────────────────────────────────────────────────────────────── */
    /* Glass Surface Demo                                                  */
    /* ─────────────────────────────────────────────────────────────────── */
    function glassSurfaceDemo() {
      const surfaces = [
        { name: 'Glass Light', css: 'rgba(255, 255, 255, 0.7)', desc: 'Standard pane' },
        { name: 'Glass Medium', css: 'rgba(255, 255, 255, 0.5)', desc: 'Hover state' },
        { name: 'Glass Heavy', css: 'rgba(255, 255, 255, 0.85)', desc: 'Active pane' },
        { name: 'Glass Dark', css: 'rgba(20, 20, 25, 0.6)', desc: 'Dark chrome' }
      ];

      let html = '<section class="glass-demo">';
      html += '<h3>Frosted Glass Surfaces</h3>';
      html += '<div class="glass-grid">';

      surfaces.forEach(s => {
        const cls = s.name === 'Glass Light' ? 'glass-swatch-light' : 
                    s.name === 'Glass Medium' ? 'glass-swatch-medium' : 
                    s.name === 'Glass Heavy' ? 'glass-swatch-heavy' : 
                    'glass-swatch-dark';
        html += '<div class="glass-swatch ' + cls + '" style="background:' + s.css + ';backdrop-filter:blur(20px)">';
        html += '  <div class="glass-label">' + esc(s.name) + '</div>';
        html += '  <div class="glass-desc">' + esc(s.desc) + '</div>';
        html += '  <div style="font-family:var(--font-mono);font-size:9px;margin-top:10px;opacity:0.6;word-break:break-all">' + esc(s.css) + '</div>';
        html += '</div>';
      });

      html += '</div>';
      html += '</section>';
      return html;
    }

    /* ─────────────────────────────────────────────────────────────────── */
    /* Swatch Card Builder                                                 */
    /* ─────────────────────────────────────────────────────────────────── */
    function swatchCard(key, hex, paperHex, role) {
      const ratio = contrastRatio(hex, paperHex);
      const level = wcagLevel(ratio);
      const chipTextColor = luminance(hexToRgb(hex)) > 0.4 ? '#1a1a1f' : '#fafafa';
      const chipBadgeBg = luminance(hexToRgb(hex)) > 0.4
        ? 'rgba(0,0,0,0.08)' : 'rgba(255,255,255,0.2)';

      return '' +
        '<div class="swatch">' +
        '  <div class="swatch__chip" style="background:' + hex + '">' +
        '    <span class="swatch__chip-contrast" style="color:' + chipTextColor +
             ';background:' + chipBadgeBg + '">' + ratio.toFixed(2) + ':1</span>' +
        '  </div>' +
        '  <div class="swatch__meta">' +
        '    <div class="swatch__var">--color-' + esc(key) + '</div>' +
        '    <div class="swatch__hex">' + esc(hex) + '</div>' +
        '    <div class="swatch__role">' + esc(role) + '</div>' +
        '    <div class="swatch__contrast-label contrast-' + level.cls + '">' +
             'WCAG ' + level.label + '</div>' +
        '  </div>' +
        '</div>';
    }

    /* ─────────────────────────────────────────────────────────────────── */
    /* WCAG Compliance Summary                                             */
    /* ─────────────────────────────────────────────────────────────────── */
    function wcagSummary(colors, paperHex) {
      const keys = Object.keys(colors);
      let passAAA = 0, passAA = 0, passAALarge = 0, fail = 0;

      keys.forEach(k => {
        const ratio = contrastRatio(colors[k], paperHex);
        if (ratio >= 7) passAAA++;
        else if (ratio >= 4.5) passAA++;
        else if (ratio >= 3) passAALarge++;
        else fail++;
      });

      let html = '<section class="wcag-summary">';
      html += '<h2>WCAG 2.1 Compliance</h2>';
      html += '<p>Contrast ratios measured against paper (' + esc(paperHex) + ')</p>';
      html += '<div class="wcag-grid">';
      html += '<div class="wcag-card"><div class="wcag-number">' + passAAA + '</div><div class="wcag-label">AAA (7:1+)</div></div>';
      html += '<div class="wcag-card"><div class="wcag-number">' + passAA + '</div><div class="wcag-label">AA (4.5:1+)</div></div>';
      html += '<div class="wcag-card"><div class="wcag-number">' + passAALarge + '</div><div class="wcag-label">AA Large (3:1+)</div></div>';
      html += '<div class="wcag-card"><div class="wcag-number">' + fail + '</div><div class="wcag-label">Below Threshold</div></div>';
      html += '</div>';
      html += '</section>';
      return html;
    }

    /* ─────────────────────────────────────────────────────────────────── */
    /* Utilities                                                           */
    /* ─────────────────────────────────────────────────────────────────── */
    function esc(s) {
      const d = document.createElement('div');
      d.textContent = String(s);
      return d.innerHTML;
    }

    function formatRole(key) {
      return key
        .replace(/([A-Z])/g, ' $1')
        .replace(/[-_]/g, ' ')
        .replace(/\b\w/g, c => c.toUpperCase())
        .trim();
    }
  </script>
</body>
</html>
