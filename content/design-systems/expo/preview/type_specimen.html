<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Type Specimen — Expo</title>
  <link rel="stylesheet" href="../colors_and_type.css">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: var(--font-body, system-ui, sans-serif);
      background: var(--paper, #f0f0f3);
      color: var(--ink, #1c2024);
      line-height: 1.6;
    }

    .page {
      max-width: 1200px;
      margin: 0 auto;
      padding: 96px 48px;
    }

    @media (max-width: 768px) {
      .page {
        padding: 64px 32px;
      }
    }

    @media (max-width: 480px) {
      .page {
        padding: 48px 24px;
      }
    }

    /* Header */
    .header {
      margin-bottom: 96px;
    }

    .header__kicker {
      font-family: var(--font-mono, 'JetBrains Mono', monospace);
      font-size: 14px;
      font-weight: 500;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--slate, #60646c);
      margin-bottom: 16px;
    }

    .header__title {
      font-family: var(--font-body, system-ui, sans-serif);
      font-size: 96px;
      font-weight: 900;
      line-height: 0.95;
      letter-spacing: -3px;
      color: var(--color-expo-black, #000000);
      margin-bottom: 24px;
    }

    .header__subtitle {
      font-family: var(--font-body, system-ui, sans-serif);
      font-size: 20px;
      font-weight: 400;
      line-height: 1.5;
      color: var(--slate, #60646c);
      max-width: 720px;
      margin-bottom: 32px;
    }

    .header__rule {
      display: block;
      width: 80px;
      height: 2px;
      background: var(--color-expo-black, #000000);
      border: none;
      margin: 0;
    }

    /* Font families section */
    .font-families {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
      gap: 32px;
      margin-bottom: 96px;
      margin-top: 80px;
    }

    .font-card {
      background: var(--surface, #ffffff);
      border: 1px solid var(--border, #7e8288);
      border-radius: var(--radius-lg, 16px);
      padding: 40px;
    }

    .font-card__label {
      font-family: var(--font-mono, 'JetBrains Mono', monospace);
      font-size: 12px;
      font-weight: 500;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--slate, #60646c);
      margin-bottom: 12px;
    }

    .font-card__name {
      font-family: var(--font-body, system-ui, sans-serif);
      font-size: 36px;
      font-weight: 700;
      line-height: 1.1;
      letter-spacing: -0.5px;
      color: var(--color-expo-black, #000000);
      margin-bottom: 8px;
    }

    .font-card__fallback {
      font-family: var(--font-mono, 'JetBrains Mono', monospace);
      font-size: 12px;
      color: var(--slate, #60646c);
      word-break: break-word;
      line-height: 1.5;
    }

    /* Character set block */
    .charmap-block {
      background: var(--surface, #ffffff);
      border: 1px solid var(--border, #7e8288);
      border-radius: var(--radius-lg, 16px);
      padding: 56px;
      margin-bottom: 96px;
    }

    .charmap-block__label {
      font-family: var(--font-mono, 'JetBrains Mono', monospace);
      font-size: 12px;
      font-weight: 500;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--slate, #60646c);
      margin-bottom: 32px;
    }

    .charmap-block__chars {
      font-family: var(--font-body, system-ui, sans-serif);
      font-size: 36px;
      font-weight: 400;
      line-height: 2;
      letter-spacing: 0.04em;
      color: var(--color-expo-black, #000000);
      word-break: break-word;
    }

    .charmap-block__chars-mono {
      font-family: var(--font-mono, 'JetBrains Mono', monospace);
      font-size: 28px;
      font-weight: 400;
      line-height: 2;
      letter-spacing: 0;
      color: var(--color-expo-black, #000000);
      word-break: break-word;
      margin-top: 48px;
    }

    /* Section label */
    .section-label {
      font-family: var(--font-mono, 'JetBrains Mono', monospace);
      font-size: 12px;
      font-weight: 500;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--slate, #60646c);
      margin-bottom: 40px;
      padding-bottom: 20px;
      border-bottom: 1px solid var(--border, #7e8288);
    }

    /* Ramp row */
    .ramp-row {
      display: grid;
      grid-template-columns: 320px 1fr;
      gap: 56px;
      align-items: baseline;
      padding: 40px 0;
      border-bottom: 1px solid var(--border, #7e8288);
    }

    .ramp-row:last-child {
      border-bottom: none;
    }

    @media (max-width: 900px) {
      .ramp-row {
        grid-template-columns: 1fr;
        gap: 20px;
      }
    }

    /* Left meta column */
    .ramp-meta__role {
      font-family: var(--font-body, system-ui, sans-serif);
      font-size: 20px;
      font-weight: 600;
      letter-spacing: -0.25px;
      color: var(--color-expo-black, #000000);
      margin-bottom: 12px;
    }

    .ramp-meta__detail {
      font-family: var(--font-mono, 'JetBrains Mono', monospace);
      font-size: 11px;
      font-weight: 400;
      line-height: 1.8;
      color: var(--slate, #60646c);
      letter-spacing: 0;
      white-space: pre-wrap;
    }

    /* Right sample column */
    .ramp-sample {
      color: var(--color-expo-black, #000000);
      overflow-wrap: break-word;
      word-spacing: 0.1em;
    }

    /* Ramp section */
    .ramp-section {
      margin-bottom: 96px;
    }

    /* Developer quote section */
    .developer-quote {
      margin-bottom: 96px;
    }

    .developer-quote__label {
      font-family: var(--font-mono, 'JetBrains Mono', monospace);
      font-size: 12px;
      font-weight: 500;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--slate, #60646c);
      margin-bottom: 40px;
      padding-bottom: 20px;
      border-bottom: 1px solid var(--border, #7e8288);
    }

    .quote-container {
      background: var(--surface, #ffffff);
      border: 1px solid var(--border, #7e8288);
      border-radius: var(--radius-lg, 16px);
      padding: 56px;
      max-width: 840px;
    }

    .quote-text {
      font-family: var(--font-body, system-ui, sans-serif);
      font-size: 24px;
      font-weight: 600;
      line-height: 1.4;
      letter-spacing: -0.4px;
      color: var(--color-expo-black, #000000);
      margin: 0 0 24px 0;
    }

    .quote-author {
      font-family: var(--font-body, system-ui, sans-serif);
      font-size: 16px;
      font-weight: 400;
      line-height: 1.5;
      color: var(--slate, #60646c);
      margin: 0;
    }

    /* Code example */
    .code-example {
      margin-bottom: 96px;
    }

    .code-example__label {
      font-family: var(--font-mono, 'JetBrains Mono', monospace);
      font-size: 12px;
      font-weight: 500;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--slate, #60646c);
      margin-bottom: 40px;
      padding-bottom: 20px;
      border-bottom: 1px solid var(--border, #7e8288);
    }

    .code-block {
      background: var(--color-widget-dark, #1a1a1a);
      border: 1px solid var(--color-banner-dark, #171717);
      border-radius: var(--radius-lg, 16px);
      padding: 40px;
      max-width: 840px;
      overflow-x: auto;
    }

    .code-line {
      font-family: var(--font-mono, 'JetBrains Mono', monospace);
      font-size: 14px;
      font-weight: 400;
      line-height: 1.6;
      color: #e0e0e0;
      margin: 0;
      padding: 4px 0;
    }

    .code-keyword {
      color: #47c2ff;
    }

    .code-string {
      color: #a8e6ff;
    }

    .code-comment {
      color: #999999;
    }

    /* Loading */
    .loading {
      text-align: center;
      padding: 160px 48px;
      color: var(--slate, #60646c);
      font-family: var(--font-body, system-ui, sans-serif);
      font-size: 18px;
    }

    .loading::after {
      content: '';
      display: block;
      width: 32px;
      height: 32px;
      margin: 24px auto 0;
      border: 2px solid var(--border, #7e8288);
      border-top-color: var(--signal, #47c2ff);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div class="page" id="app">
    <div class="loading">Loading design tokens…</div>
  </div>

  <script>
    const EDITORIAL_SAMPLES = [
      'One typeface. Full expression.',
      'Extreme tracking at scale.',
      'Developer tools deserve polish.',
      'React Native, refined.',
      'Clarity through constraint.',
      'Every pixel earns its place.',
      'Build faster. Ship better.',
      'Design systems scale intent.',
      'The best tool is invisible.',
      'Confidence radiates inward.',
    ];

    const CODE_SAMPLE = `import { StatusBar } from 'expo-status-bar';
import { View, Text } from 'react-native';

export default function App() {
  return (
    <View style={styles.container}>
      <Text>Hello Expo!</Text>
      <StatusBar barStyle="light-content" />
    </View>
  );
}`;

    fetch('../tokens.json')
      .then(r => {
        if (!r.ok) throw new Error('tokens.json not found (' + r.status + ')');
        return r.json();
      })
      .then(render)
      .catch(err => {
        document.getElementById('app').innerHTML =
          '<div class="loading" style="color:#eb8e90">' +
          'Could not load tokens.json — ' + err.message + '</div>';
      });

    function render(tokens) {
      const app = document.getElementById('app');
      const title = tokens.meta?.title || 'Design System';
      const summary = tokens.meta?.summary || '';

      const ramp = tokens.typography?.ramp || [];

      let html = '';

      /* Header */
      html += '<header class="header">';
      html += '  <div class="header__kicker">Type Specimen</div>';
      html += '  <h1 class="header__title">' + esc(title) + '</h1>';
      html += '  <p class="header__subtitle">' + esc(summary) + '</p>';
      html += '  <hr class="header__rule">';
      html += '</header>';

      /* Font families */
      const families = [
        { label: 'Display & Body', name: 'Inter', fallback: 'system-ui, -apple-system, Helvetica Neue, Arial, sans-serif' },
        { label: 'Monospace', name: 'JetBrains Mono', fallback: 'ui-monospace, Menlo, Monaco, Consolas, monospace' }
      ];

      html += '<div class="font-families">';
      families.forEach(f => {
        html += '<div class="font-card">';
        html += '  <div class="font-card__label">' + esc(f.label) + '</div>';
        html += '  <div class="font-card__name">' + esc(f.name) + '</div>';
        html += '  <div class="font-card__fallback">' + esc(f.fallback) + '</div>';
        html += '</div>';
      });
      html += '</div>';

      /* Character set */
      html += '<div class="charmap-block">';
      html += '  <div class="charmap-block__label">Character Set</div>';
      html += '  <div class="charmap-block__chars">';
      html += '    AaBbCcDdEeFfGgHhIiJjKkLlMmNnOoPpQqRrSsTtUuVvWwXxYyZz<br>';
      html += '    0123456789 !@#$%&amp;*()&ndash;&mdash;&lsquo;&rsquo;&ldquo;&rdquo;';
      html += '  </div>';
      html += '  <div class="charmap-block__chars-mono">';
      html += '    function() { const x = await fetch(); return x; }';
      html += '  </div>';
      html += '</div>';

      /* Type ramp */
      if (ramp.length) {
        html += '<div class="ramp-section">';
        html += '<div class="section-label">Type Ramp</div>';
        ramp.forEach((entry, i) => {
          html += rampRow(entry, i);
        });
        html += '</div>';
      }

      /* Developer quote */
      html += '<div class="developer-quote">';
      html += '<div class="developer-quote__label">Design for Developers</div>';
      html += '<div class="quote-container">';
      html += '<p class="quote-text">Tools for building apps should feel as polished as the apps themselves.</p>';
      html += '<p class="quote-author">— The Expo Design Principle</p>';
      html += '</div>';
      html += '</div>';

      /* Code example */
      html += '<div class="code-example">';
      html += '<div class="code-example__label">Code Example — JetBrains Mono, 14px / 1.6</div>';
      html += '<div class="code-block">';
      CODE_SAMPLE.split('\n').forEach(line => {
        html += '<p class="code-line">' + escapeCode(line) + '</p>';
      });
      html += '</div>';
      html += '</div>';

      app.innerHTML = html;
    }

    function rampRow(entry, idx) {
      const role = entry.role || 'Role ' + (idx + 1);
      const size = entry.size || '16px';
      const weight = entry.weight || 400;
      const lh = entry.lineHeight || '1.5';
      const ls = entry.letterSpacing || '0';

      let fontFamily = 'var(--font-body)';
      if (entry.fontKey === 'mono') fontFamily = 'var(--font-mono)';

      const sizeNum = parseFloat(size);
      const sampleIdx = idx % EDITORIAL_SAMPLES.length;
      let sample = EDITORIAL_SAMPLES[sampleIdx];

      /* Truncate very large samples */
      if (sizeNum >= 64) {
        sample = sample.split('.')[0];
        if (!sample.endsWith('.')) sample += '.';
      }

      let fontStyle = 'font-size:' + size + ';font-weight:' + weight + ';line-height:' + lh + ';';
      fontStyle += 'font-family:' + fontFamily + ';';
      if (ls && ls !== '0' && ls !== 'normal') fontStyle += 'letter-spacing:' + ls + ';';

      let meta = esc(size) + ' / ' + esc(String(weight));
      meta += '\n' + fontFamilyLabel(entry.fontKey);
      meta += '\nline-height: ' + esc(String(lh));
      if (ls && ls !== '0' && ls !== 'normal') meta += '\nletter-spacing: ' + esc(ls);

      return '' +
        '<div class="ramp-row">' +
        '  <div class="ramp-meta">' +
        '    <div class="ramp-meta__role">' + esc(role) + '</div>' +
        '    <pre class="ramp-meta__detail">' + meta + '</pre>' +
        '  </div>' +
        '  <div class="ramp-sample" style="' + fontStyle + '">' + esc(sample) + '</div>' +
        '</div>';
    }

    function fontFamilyLabel(key) {
      const map = {
        'body': 'Inter',
        'display': 'Inter',
        'mono': 'JetBrains Mono'
      };
      return map[key] || 'Inter';
    }

    function esc(s) {
      const d = document.createElement('div');
      d.textContent = String(s);
      return d.innerHTML;
    }

    function escapeCode(s) {
      return s
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/(import|export|from|function|const|await|return|async)\b/g, '<span class="code-keyword">$1</span>')
        .replace(/(['"])(.*?)\1/g, '<span class="code-string">$1$2$1</span>')
        .replace(/(\/\/.*?)$/gm, '<span class="code-comment">$1</span>');
    }
  </script>
</body>
</html>
