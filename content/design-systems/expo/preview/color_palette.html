<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Color Palette — Expo</title>
  <link rel="stylesheet" href="../colors_and_type.css">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: var(--font-body, system-ui, sans-serif);
      background: var(--paper, #f0f0f3);
      color: var(--ink, #1c2024);
      line-height: 1.6;
      padding: 0;
    }

    .page {
      max-width: 1200px;
      margin: 0 auto;
      padding: 80px 40px;
    }

    /* Header / Stage head */
    .header {
      margin-bottom: 80px;
      border-bottom: 1px solid var(--border, #7e8288);
      padding-bottom: 40px;
    }

    .header__kicker {
      font-family: var(--font-mono, 'JetBrains Mono', monospace);
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: var(--slate, #60646c);
      margin-bottom: 16px;
    }

    .header__title {
      font-family: var(--font-body, system-ui, sans-serif);
      font-size: 64px;
      font-weight: 700;
      line-height: 1.1;
      letter-spacing: -1.6px;
      color: var(--ink, #1c2024);
      margin-bottom: 12px;
    }

    .header__subtitle {
      font-family: var(--font-body, system-ui, sans-serif);
      font-size: 18px;
      line-height: 1.4;
      color: var(--slate, #60646c);
      max-width: 680px;
      margin-bottom: 20px;
    }

    .header__meta {
      font-family: var(--font-mono, 'JetBrains Mono', monospace);
      font-size: 12px;
      font-weight: 500;
      letter-spacing: 0.08em;
      color: var(--slate, #60646c);
      text-transform: uppercase;
    }

    /* Section labels */
    .section-label {
      font-family: var(--font-mono, 'JetBrains Mono', monospace);
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: var(--slate, #60646c);
      margin-bottom: 32px;
      padding-bottom: 16px;
      border-bottom: 1px solid var(--border-lavender, #e0e1e6);
    }

    /* Swatch grid */
    .swatch-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
      gap: 24px;
      margin-bottom: 80px;
    }

    .swatch {
      background: var(--surface, #ffffff);
      border: var(--card-border, 1px solid #7e8288);
      border-radius: var(--card-radius, 24px);
      overflow: hidden;
      transition: box-shadow 0.2s ease, border-color 0.2s ease;
    }

    .swatch:hover {
      box-shadow: var(--card-shadow, 0 2px 8px rgba(0,0,0,0.08));
      border-color: var(--signal, #47c2ff);
    }

    .swatch__chip {
      width: 100%;
      aspect-ratio: 4 / 3;
      position: relative;
    }

    .swatch__chip-contrast {
      position: absolute;
      bottom: 12px;
      right: 14px;
      font-family: var(--font-mono, 'JetBrains Mono', monospace);
      font-size: 11px;
      font-weight: 600;
      padding: 4px 10px;
      border-radius: var(--radius-sm, 8px);
      line-height: 1.3;
      text-transform: uppercase;
    }

    .swatch__meta {
      padding: 20px 20px 24px;
    }

    .swatch__var {
      font-family: var(--font-mono, 'JetBrains Mono', monospace);
      font-size: 12px;
      font-weight: 600;
      color: var(--ink, #1c2024);
      word-break: break-all;
      margin-bottom: 8px;
      letter-spacing: 0.02em;
    }

    .swatch__hex {
      font-family: var(--font-mono, 'JetBrains Mono', monospace);
      font-size: 11px;
      color: var(--slate, #60646c);
      margin-bottom: 10px;
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }

    .swatch__role {
      font-family: var(--font-body, system-ui, sans-serif);
      font-size: 14px;
      line-height: 1.4;
      color: var(--ink, #1c2024);
      margin-bottom: 10px;
    }

    .swatch__contrast-label {
      font-family: var(--font-mono, 'JetBrains Mono', monospace);
      font-size: 11px;
      font-weight: 600;
      margin-top: 10px;
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }

    .contrast-pass { color: #1a5a3a; }
    .contrast-fail { color: #8b2a1f; }
    .contrast-aa-large { color: #7a5c1a; }

    /* Chip contrast badge styling */
    .chip-badge {
      border-radius: var(--radius-sm, 8px);
      font-weight: 600;
      display: inline-block;
    }

    /* Usage pattern section */
    .usage-section {
      margin-bottom: 80px;
      padding: 48px 40px;
      background: var(--surface, #ffffff);
      border: var(--card-border, 1px solid #7e8288);
      border-radius: var(--card-radius, 24px);
    }

    .usage-section h2 {
      font-family: var(--font-body, system-ui, sans-serif);
      font-size: 48px;
      font-weight: 600;
      line-height: 1.1;
      letter-spacing: -2px;
      color: var(--ink, #1c2024);
      margin-bottom: 24px;
    }

    .usage-section p {
      font-family: var(--font-body, system-ui, sans-serif);
      font-size: 18px;
      line-height: 1.4;
      color: var(--slate, #60646c);
      margin-bottom: 24px;
      max-width: 720px;
    }

    .rule-of-one {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 32px;
      margin-top: 32px;
      align-items: start;
    }

    .rule-example {
      padding: 28px;
      background: var(--paper, #f0f0f3);
      border: 1px solid var(--border-lavender, #e0e1e6);
      border-radius: var(--radius-lg, 16px);
    }

    .rule-example h3 {
      font-family: var(--font-body, system-ui, sans-serif);
      font-size: 20px;
      font-weight: 600;
      line-height: 1.2;
      letter-spacing: -0.25px;
      color: var(--ink, #1c2024);
      margin-bottom: 12px;
    }

    .rule-example p {
      font-family: var(--font-body, system-ui, sans-serif);
      font-size: 16px;
      line-height: 1.25;
      color: var(--slate, #60646c);
      margin-bottom: 0;
    }

    .correct {
      border: 2px solid #1a5a3a;
    }

    .correct::before {
      content: '✓ CORRECT';
      display: block;
      font-family: var(--font-mono, 'JetBrains Mono', monospace);
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.15em;
      color: #1a5a3a;
      text-transform: uppercase;
      margin-bottom: 14px;
      padding-bottom: 14px;
      border-bottom: 1px solid #1a5a3a;
    }

    .incorrect {
      border: 2px solid #8b2a1f;
    }

    .incorrect::before {
      content: '✗ INCORRECT';
      display: block;
      font-family: var(--font-mono, 'JetBrains Mono', monospace);
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.15em;
      color: #8b2a1f;
      text-transform: uppercase;
      margin-bottom: 14px;
      padding-bottom: 14px;
      border-bottom: 1px solid #8b2a1f;
    }

    .signal-demo {
      font-size: 16px;
      line-height: 1.25;
    }

    .signal-demo .drop-cap {
      font-family: var(--font-body, system-ui, sans-serif);
      font-size: 56px;
      font-weight: 700;
      color: var(--signal, #47c2ff);
      float: left;
      line-height: 0.75;
      padding-right: 6px;
      margin-top: 2px;
    }

    .signal-demo em {
      color: var(--signal, #47c2ff);
      font-style: italic;
    }

    /* WCAG summary */
    .wcag-summary {
      margin-top: 80px;
      padding: 48px 40px;
      background: var(--surface, #ffffff);
      border: var(--card-border, 1px solid #7e8288);
      border-radius: var(--card-radius, 24px);
    }

    .wcag-summary h2 {
      font-family: var(--font-body, system-ui, sans-serif);
      font-size: 48px;
      font-weight: 600;
      line-height: 1.1;
      letter-spacing: -2px;
      margin-bottom: 24px;
      color: var(--ink, #1c2024);
    }

    .wcag-summary p {
      font-family: var(--font-body, system-ui, sans-serif);
      font-size: 16px;
      line-height: 1.25;
      color: var(--slate, #60646c);
      margin-bottom: 28px;
    }

    .wcag-row {
      display: flex;
      align-items: center;
      gap: 20px;
      padding: 14px 0;
      border-bottom: 1px solid var(--border-lavender, #e0e1e6);
      font-family: var(--font-body, system-ui, sans-serif);
      font-size: 16px;
    }

    .wcag-row:last-child { border-bottom: none; }

    .wcag-badge {
      display: inline-block;
      padding: 6px 14px;
      border-radius: var(--radius-sm, 8px);
      font-family: var(--font-mono, 'JetBrains Mono', monospace);
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      min-width: 90px;
      text-align: center;
    }

    .wcag-badge--pass { background: var(--paper, #f0f0f3); color: #1a5a3a; border: 1px solid #1a5a3a; }
    .wcag-badge--fail { background: var(--paper, #f0f0f3); color: #8b2a1f; border: 1px solid #8b2a1f; }
    .wcag-badge--aa-large { background: var(--paper, #f0f0f3); color: #7a5c1a; border: 1px solid #7a5c1a; }

    /* Loading state */
    .loading {
      text-align: center;
      padding: 120px 24px;
      color: var(--slate, #60646c);
      font-family: var(--font-body, system-ui, sans-serif);
      font-size: 16px;
    }

    .loading::after {
      content: '';
      display: block;
      width: 32px;
      height: 32px;
      margin: 24px auto 0;
      border: 2px solid var(--slate, #60646c);
      border-top-color: var(--signal, #47c2ff);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    /* Responsive */
    @media (max-width: 768px) {
      .page { padding: 48px 24px; }
      .header { padding-bottom: 24px; margin-bottom: 48px; }
      .header__title { font-size: 42px; letter-spacing: -1.2px; }
      .header__subtitle { font-size: 16px; }
      .swatch-grid { grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 16px; }
      .rule-of-one { grid-template-columns: 1fr; gap: 20px; }
      .usage-section { padding: 32px 24px; }
      .wcag-summary { padding: 32px 24px; }
      .usage-section h2, .wcag-summary h2 { font-size: 36px; letter-spacing: -1.2px; }
    }
  </style>
</head>
<body>
  <div class="page" id="app">
    <div class="loading">Loading design tokens&hellip;</div>
  </div>

  <script>
    /* ───────────────────────────────────────────────────────────── */
    /* Contrast ratio calculation (WCAG 2.1 relative luminance)      */
    /* ───────────────────────────────────────────────────────────── */
    function hexToRgb(hex) {
      hex = hex.replace(/^#/, '');
      if (hex.length === 3) hex = hex.split('').map(c => c + c).join('');
      const n = parseInt(hex, 16);
      return [(n >> 16) & 255, (n >> 8) & 255, n & 255];
    }

    function luminance([r, g, b]) {
      const [rs, gs, bs] = [r, g, b].map(c => {
        c /= 255;
        return c <= 0.03928 ? c / 12.92 : Math.pow((c + 0.055) / 1.055, 2.4);
      });
      return 0.2126 * rs + 0.7152 * gs + 0.0722 * bs;
    }

    function contrastRatio(hex1, hex2) {
      const l1 = luminance(hexToRgb(hex1));
      const l2 = luminance(hexToRgb(hex2));
      const lighter = Math.max(l1, l2);
      const darker = Math.min(l1, l2);
      return (lighter + 0.05) / (darker + 0.05);
    }

    function wcagLevel(ratio) {
      if (ratio >= 7) return { label: 'AAA', cls: 'pass' };
      if (ratio >= 4.5) return { label: 'AA', cls: 'pass' };
      if (ratio >= 3) return { label: 'AA Large', cls: 'aa-large' };
      return { label: 'Fail', cls: 'fail' };
    }

    /* ───────────────────────────────────────────────────────────── */
    /* Core color roles and descriptions                             */
    /* ───────────────────────────────────────────────────────────── */
    const CORE_ROLES = {
      paper:   'Primary page background. Cool off-white canvas.',
      ink:     'Primary headline and text color. Warm near-black.',
      slate:   'Secondary text and metadata. Cool blue-gray.',
      signal:  'Accent accent color. Bright cyan-blue for key actions.',
      bone:    'Dark surface for widgets and overlays.',
      border:  'Border and divider color. Cool gray.',
      surface: 'Card and elevated surface color. Pure white.'
    };

    /* ───────────────────────────────────────────────────────────── */
    /* Render from tokens.json                                       */
    /* ───────────────────────────────────────────────────────────── */
    (window.__DESIGN_TOKENS__ 
      ? Promise.resolve({ ok: true, json: () => Promise.resolve(window.__DESIGN_TOKENS__) }) 
      : fetch('../tokens.json'))
      .then(r => {
        if (!r.ok) throw new Error('tokens.json not found (' + r.status + ')');
        return r.json();
      })
      .then(render)
      .catch(err => {
        document.getElementById('app').innerHTML =
          '<div class="loading" style="color:var(--signal,#47c2ff)">' +
          'Could not load tokens.json — ' + err.message + '</div>';
      });

    function render(tokens) {
      const app = document.getElementById('app');
      const title = tokens.meta?.title || 'Design System';
      const summary = tokens.meta?.summary || '';
      const rawColors = tokens.colors || {};
      const paperHex = rawColors.paper || '#f0f0f3';

      /* Flatten nested color structure */
      const colors = {};
      for (const [k, v] of Object.entries(rawColors)) {
        if (typeof v === 'string') {
          colors[k] = v;
        } else if (v && typeof v === 'object') {
          for (const [sk, sv] of Object.entries(v)) {
            if (typeof sv === 'string') colors[k + '-' + sk] = sv;
          }
        }
      }

      /* Split core and extended */
      const coreKeys = Object.keys(CORE_ROLES).filter(k => colors[k]);
      const extendedKeys = Object.keys(colors).filter(k => !CORE_ROLES[k] && typeof colors[k] === 'string');

      let html = '';

      /* ─ Stage head header ─ */
      html += '<header class="header">';
      html += '  <div class="header__kicker">Design System</div>';
      html += '  <h1 class="header__title">' + esc(title) + '</h1>';
      html += '  <p class="header__subtitle">' + esc(summary) + '</p>';
      html += '  <div class="header__meta">Color Palette — ' + (coreKeys.length + extendedKeys.length) + ' Tokens</div>';
      html += '</header>';

      /* ─ Core Palette ─ */
      if (coreKeys.length) {
        html += '<div class="section-label">Core Palette</div>';
        html += '<div class="swatch-grid">';
        coreKeys.forEach(key => {
          html += swatchCard(key, colors[key], paperHex, CORE_ROLES[key]);
        });
        html += '</div>';
      }

      /* ─ Extended Palette ─ */
      if (extendedKeys.length) {
        html += '<div class="section-label">Extended Palette</div>';
        html += '<div class="swatch-grid">';
        extendedKeys.forEach(key => {
          const role = formatRole(key);
          html += swatchCard(key, colors[key], paperHex, role);
        });
        html += '</div>';
      }

      /* ─ Rule of One ─ */
      html += ruleOfOneSection(paperHex);

      /* ─ WCAG Summary ─ */
      html += wcagSummary(colors, paperHex);

      app.innerHTML = html;
    }

    /* ───────────────────────────────────────────────────────────── */
    /* Swatch card builder                                           */
    /* ───────────────────────────────────────────────────────────── */
    function swatchCard(key, hex, paperHex, role) {
      const ratio = contrastRatio(hex, paperHex);
      const level = wcagLevel(ratio);
      const lum = luminance(hexToRgb(hex));
      const chipTextColor = lum > 0.5 ? '#1c2024' : '#f0f0f3';
      const chipBadgeBg = lum > 0.5 ? 'rgba(28,32,36,0.12)' : 'rgba(240,240,243,0.2)';

      return '' +
        '<div class="swatch">' +
        '  <div class="swatch__chip" style="background:' + hex + '">' +
        '    <span class="swatch__chip-contrast chip-badge" style="color:' + chipTextColor +
             ';background:' + chipBadgeBg + '">' + ratio.toFixed(2) + ':1</span>' +
        '  </div>' +
        '  <div class="swatch__meta">' +
        '    <div class="swatch__var">--' + esc(key) + '</div>' +
        '    <div class="swatch__hex">' + esc(hex.toUpperCase()) + '</div>' +
        '    <div class="swatch__role">' + esc(role) + '</div>' +
        '    <div class="swatch__contrast-label contrast-' + level.cls + '">' +
             'WCAG ' + level.label + '</div>' +
        '  </div>' +
        '</div>';
    }

    /* ───────────────────────────────────────────────────────────── */
    /* Rule of One usage pattern                                     */
    /* ───────────────────────────────────────────────────────────── */
    function ruleOfOneSection(paperHex) {
      let html = '<section class="usage-section">';
      html += '<h2>Signal Accent Usage</h2>';
      html += '<p>Widget Sky cyan (#47c2ff) is reserved for high-priority interactive elements. Use sparingly—one accent per interface region maintains clarity in technical, code-heavy contexts.</p>';

      html += '<div class="rule-of-one">';

      /* Correct example */
      html += '<div class="rule-example correct">';
      html += '<h3>Single CTA Button</h3>';
      html += '<p class="signal-demo">';
      html += '<span class="drop-cap">C</span>';
      html += 'all-to-action button in Widget Sky draws focus without overwhelming the monochromatic interface. Perfect for "Start Build," "Connect Device," or "Deploy."';
      html += '</p>';
      html += '</div>';

      /* Incorrect example */
      html += '<div class="rule-example incorrect">';
      html += '<h3>Multiple Accents</h3>';
      html += '<p>';
      html += '<span style="color:var(--signal,#47c2ff)">Cyan text</span> alongside <span style="color:var(--signal,#47c2ff)">another accent link</span> and a <span style="color:var(--signal,#47c2ff)">third highlighted element</span> creates visual chaos. The strength of the monochrome system lies in restraint.';
      html += '</p>';
      html += '</div>';

      html += '</div>';
      html += '</section>';
      return html;
    }

    /* ───────────────────────────────────────────────────────────── */
    /* WCAG compliance summary                                       */
    /* ───────────────────────────────────────────────────────────── */
    function wcagSummary(colors, paperHex) {
      const keys = Object.keys(colors);
      let passAAA = 0, passAA = 0, passAALarge = 0, fail = 0;

      keys.forEach(k => {
        const ratio = contrastRatio(colors[k], paperHex);
        if (ratio >= 7) passAAA++;
        else if (ratio >= 4.5) passAA++;
        else if (ratio >= 3) passAALarge++;
        else fail++;
      });

      let html = '<div class="wcag-summary">';
      html += '<h2>WCAG 2.1 Compliance</h2>';
      html += '<p>Contrast ratios measured against the cool off-white paper background (#F0F0F3). The luminous canvas ensures readability for code editors and technical documentation.</p>';
      html += row('AAA (7:1+)', passAAA, 'pass');
      html += row('AA (4.5:1+)', passAA, 'pass');
      html += row('AA Large Text (3:1+)', passAALarge, 'aa-large');
      html += row('Below threshold', fail, fail > 0 ? 'fail' : 'pass');
      html += '</div>';
      return html;

      function row(label, count, badge) {
        return '<div class="wcag-row">' +
               '<span class="wcag-badge wcag-badge--' + badge + '">' + count + '</span>' +
               '<span>' + label + '</span>' +
               '</div>';
      }
    }

    /* ───────────────────────────────────────────────────────────── */
    /* Utilities                                                      */
    /* ───────────────────────────────────────────────────────────── */
    function esc(s) {
      const d = document.createElement('div');
      d.textContent = String(s);
      return d.innerHTML;
    }

    function formatRole(key) {
      return key
        .replace(/([A-Z])/g, ' $1')
        .replace(/[-_]/g, ' ')
        .replace(/\b\w/g, c => c.toUpperCase())
        .trim();
    }
  </script>
</body>
</html>
