<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cafe — Type Specimen</title>
  <link rel="stylesheet" href="../colors_and_type.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@100;200;300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: var(--font-body, system-ui, sans-serif);
      background: var(--paper);
      color: var(--ink);
      line-height: 1.6;
    }

    .page {
      max-width: 1100px;
      margin: 0 auto;
      padding: 64px 32px;
    }

    /* Header */
    .header {
      margin-bottom: 64px;
    }
    .header__title {
      font-family: Poppins, var(--font-display, system-ui, sans-serif);
      font-size: 56px;
      font-weight: 700;
      line-height: 1.1;
      letter-spacing: -0.01em;
      color: var(--ink);
      margin-bottom: 16px;
    }
    .header__subtitle {
      font-family: Poppins, var(--font-display, system-ui, sans-serif);
      font-size: 20px;
      font-weight: 300;
      color: var(--slate);
      max-width: 680px;
      margin-bottom: 24px;
    }
    .header__rule {
      display: block;
      width: 80px;
      height: 3px;
      background: var(--signal);
      border: none;
      margin-top: 32px;
      border-radius: var(--radius-sm);
    }

    /* Font family summary */
    .font-families {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
      gap: 32px;
      margin-bottom: 64px;
    }
    .font-card {
      background: var(--bone);
      border: var(--card-border);
      border-radius: var(--card-radius);
      padding: 32px;
    }
    .font-card__label {
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--slate);
      margin-bottom: 12px;
    }
    .font-card__name {
      font-family: Poppins, var(--font-display, system-ui, sans-serif);
      font-size: 32px;
      font-weight: 600;
      line-height: 1.2;
      color: var(--ink);
      margin-bottom: 8px;
    }
    .font-card__fallback {
      font-family: JetBrains Mono, var(--font-mono, ui-monospace, monospace);
      font-size: 12px;
      color: var(--slate);
      word-break: break-all;
      line-height: 1.6;
    }

    /* Character set block */
    .charset-block {
      background: var(--bone);
      border: var(--card-border);
      border-radius: var(--card-radius);
      padding: 48px 40px;
      margin-bottom: 64px;
    }
    .charset-block__label {
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--slate);
      margin-bottom: 20px;
    }
    .charset-block__content {
      font-family: Poppins, var(--font-display, system-ui, sans-serif);
      font-size: 28px;
      font-weight: 400;
      line-height: 1.8;
      letter-spacing: 0.01em;
      color: var(--ink);
      word-break: break-all;
    }

    /* Section label */
    .section-label {
      font-family: Poppins, var(--font-display, system-ui, sans-serif);
      font-size: 14px;
      font-weight: 600;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--slate);
      margin-bottom: 32px;
      padding-bottom: 16px;
      border-bottom: 1px solid var(--border);
    }

    /* Ramp row */
    .ramp-row {
      display: grid;
      grid-template-columns: 280px 1fr;
      gap: 48px;
      align-items: baseline;
      padding: 32px 0;
      border-bottom: 1px solid var(--border);
    }
    .ramp-row:last-child {
      border-bottom: none;
    }

    @media (max-width: 800px) {
      .ramp-row {
        grid-template-columns: 1fr;
        gap: 16px;
        align-items: flex-start;
      }
    }

    /* Left meta column */
    .ramp-meta__role {
      font-family: Poppins, var(--font-display, system-ui, sans-serif);
      font-size: 16px;
      font-weight: 600;
      color: var(--ink);
      margin-bottom: 8px;
    }
    .ramp-meta__detail {
      font-family: JetBrains Mono, var(--font-mono, ui-monospace, monospace);
      font-size: 11px;
      font-weight: 500;
      line-height: 1.8;
      color: var(--slate);
      white-space: pre-wrap;
    }

    /* Right sample column */
    .ramp-sample {
      font-family: Poppins, var(--font-body, system-ui, sans-serif);
      color: var(--ink);
      overflow-wrap: break-word;
    }

    /* Ramp section container */
    .ramp-section {
      margin-bottom: 64px;
    }

    /* Loading state */
    .loading {
      text-align: center;
      padding: 100px 24px;
      color: var(--slate);
      font-size: 16px;
      font-family: Poppins, var(--font-display, system-ui, sans-serif);
    }
    .loading::after {
      content: '';
      display: block;
      width: 32px;
      height: 32px;
      margin: 20px auto 0;
      border: 3px solid var(--border);
      border-top-color: var(--signal);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* Drop cap */
    .dropcap {
      font-family: Poppins, var(--font-display, system-ui, sans-serif);
      font-size: 3.5em;
      font-weight: 700;
      float: left;
      line-height: 0.8;
      padding-right: 8px;
      margin-bottom: -4px;
      color: var(--signal);
    }
  </style>
</head>
<body>
  <div class="page" id="app">
    <div class="loading">Loading type specimen&hellip;</div>
  </div>

  <script>
    const EDITORIAL_SAMPLES = [
      'A perfect cup requires patience, precision, and the right beans.',
      'Design, like coffee, is about balance and harmony in every detail.',
      'The warmth of a cafe comes not from walls but from thoughtful moments.',
      'Every sip tells a story of craft, care, and creativity.',
      'Simplicity is the ultimate sophistication in typography and taste.',
      'Good design fades into the background, like the aroma of fresh brew.',
      'Typography shapes how words taste, just as brewing shapes flavor.',
      'Comfort in clarity: that is the philosophy of modern cafe design.',
    ];

    const TYPE_RAMP = [
      { role: 'Hero', fontSize: '96px', fontWeight: '700', lineHeight: '1.0', letterSpacing: '-0.02em', font: 'Poppins' },
      { role: 'Display / Large', fontSize: '56px', fontWeight: '700', lineHeight: '1.1', letterSpacing: '-0.01em', font: 'Poppins' },
      { role: 'Display / Medium', fontSize: '40px', fontWeight: '600', lineHeight: '1.2', letterSpacing: '0em', font: 'Poppins' },
      { role: 'Display / Small', fontSize: '32px', fontWeight: '600', lineHeight: '1.25', letterSpacing: '0em', font: 'Poppins' },
      { role: 'Headline / Large', fontSize: '28px', fontWeight: '600', lineHeight: '1.3', letterSpacing: '0em', font: 'Poppins' },
      { role: 'Headline / Medium', fontSize: '24px', fontWeight: '600', lineHeight: '1.4', letterSpacing: '0em', font: 'Poppins' },
      { role: 'Headline / Small', fontSize: '20px', fontWeight: '600', lineHeight: '1.4', letterSpacing: '0em', font: 'Poppins' },
      { role: 'Subheading / Large', fontSize: '18px', fontWeight: '500', lineHeight: '1.5', letterSpacing: '0.01em', font: 'Poppins' },
      { role: 'Subheading / Medium', fontSize: '16px', fontWeight: '500', lineHeight: '1.5', letterSpacing: '0.01em', font: 'Poppins' },
      { role: 'Body / Large', fontSize: '18px', fontWeight: '400', lineHeight: '1.6', letterSpacing: '0em', font: 'Poppins' },
      { role: 'Body / Regular', fontSize: '16px', fontWeight: '400', lineHeight: '1.6', letterSpacing: '0em', font: 'Poppins' },
      { role: 'Body / Small', fontSize: '14px', fontWeight: '400', lineHeight: '1.6', letterSpacing: '0em', font: 'Poppins' },
      { role: 'Caption / Large', fontSize: '13px', fontWeight: '500', lineHeight: '1.5', letterSpacing: '0.02em', font: 'Poppins' },
      { role: 'Caption / Regular', fontSize: '12px', fontWeight: '400', lineHeight: '1.5', letterSpacing: '0.02em', font: 'Poppins' },
      { role: 'Overline', fontSize: '11px', fontWeight: '600', lineHeight: '1.5', letterSpacing: '0.08em', font: 'Poppins' },
      { role: 'Code / Large', fontSize: '14px', fontWeight: '500', lineHeight: '1.6', letterSpacing: '0em', font: 'JetBrains Mono' },
      { role: 'Code / Regular', fontSize: '12px', fontWeight: '400', lineHeight: '1.6', letterSpacing: '0em', font: 'JetBrains Mono' },
    ];

    fetch('../tokens.json')
      .then(r => {
        if (!r.ok) throw new Error('tokens.json not found');
        return r.json();
      })
      .then(render)
      .catch(err => {
        document.getElementById('app').innerHTML =
          '<div class="loading" style="color:#ef4444">' +
          'Could not load tokens — ' + err.message + '</div>';
      });

    function render(tokens) {
      const app = document.getElementById('app');
      const name = tokens.meta?.title || 'Cafe';
      const summary = tokens.meta?.summary || 'A design system inspired by cafe culture.';

      let html = '';

      /* Header */
      html += '<header class="header">';
      html += '  <h1 class="header__title">' + esc(name) + '</h1>';
      html += '  <p class="header__subtitle">' + esc(summary) + '</p>';
      html += '  <hr class="header__rule">';
      html += '</header>';

      /* Font families */
      html += '<div class="font-families">';
      html += '  <div class="font-card">';
      html += '    <div class="font-card__label">Display & Headings</div>';
      html += '    <div class="font-card__name" style="font-family: Poppins, sans-serif;">Poppins</div>';
      html += '    <div class="font-card__fallback">Weights: 100–900<br>Expressive, warm, and friendly</div>';
      html += '  </div>';
      html += '  <div class="font-card">';
      html += '    <div class="font-card__label">Body & Prose</div>';
      html += '    <div class="font-card__name" style="font-family: Poppins, sans-serif;">Poppins</div>';
      html += '    <div class="font-card__fallback">Optimized for 16px+<br>Clean, readable, balanced</div>';
      html += '  </div>';
      html += '  <div class="font-card">';
      html += '    <div class="font-card__label">Code & Technical</div>';
      html += '    <div class="font-card__name" style="font-family: \'JetBrains Mono\', monospace;">JetBrains Mono</div>';
      html += '    <div class="font-card__fallback">Monospace, 400 & 600 weight<br>Clear distinction for code blocks</div>';
      html += '  </div>';
      html += '</div>';

      /* Character set */
      html += '<div class="charset-block">';
      html += '  <div class="charset-block__label">Character Set</div>';
      html += '  <div class="charset-block__content">';
      html += '    AaBbCcDdEeFfGgHhIiJjKkLlMmNn<br>';
      html += '    OoPpQqRrSsTtUuVvWwXxYyZz<br>';
      html += '    0123456789 !@#$%&amp;*()–—\'""';
      html += '  </div>';
      html += '</div>';

      /* Type ramp */
      if (TYPE_RAMP.length) {
        html += '<div class="ramp-section">';
        html += '<div class="section-label">Type Ramp</div>';
        TYPE_RAMP.forEach((entry, i) => {
          html += rampRow(entry, i);
        });
        html += '</div>';
      }

      app.innerHTML = html;
    }

    function rampRow(entry, idx) {
      const role = entry.role || 'Role ' + (idx + 1);
      const size = entry.fontSize || '16px';
      const weight = entry.fontWeight || '400';
      const lh = entry.lineHeight || '1.5';
      const ls = entry.letterSpacing || 'normal';
      const family = entry.font || 'Poppins';

      const sizeNum = parseFloat(size);
      const sampleIdx = idx % EDITORIAL_SAMPLES.length;
      let sample = EDITORIAL_SAMPLES[sampleIdx];

      /* Truncate very large samples */
      if (sizeNum >= 56) {
        sample = sample.split(/[.!?]/)[0] + '.';
      }

      let fontStyle = 'font-size:' + size + ';font-weight:' + weight + ';line-height:' + lh + ';';
      if (ls !== 'normal') fontStyle += 'letter-spacing:' + ls + ';';
      if (family) fontStyle += 'font-family:\'' + esc(family) + '\',var(--font-body, system-ui, sans-serif);';

      let meta = '';
      meta += esc(size) + ' / ' + esc(weight);
      meta += '\n' + esc(family);
      meta += '\nline-height: ' + esc(String(lh));
      if (ls !== 'normal') meta += '\nletters: ' + esc(ls);

      return '' +
        '<div class="ramp-row">' +
        '  <div class="ramp-meta">' +
        '    <div class="ramp-meta__role">' + esc(role) + '</div>' +
        '    <pre class="ramp-meta__detail">' + meta + '</pre>' +
        '  </div>' +
        '  <div class="ramp-sample" style="' + fontStyle + '">' + esc(sample) + '</div>' +
        '</div>';
    }

    function esc(s) {
      const d = document.createElement('div');
      d.textContent = String(s);
      return d.innerHTML;
    }
  </script>
</body>
</html>
