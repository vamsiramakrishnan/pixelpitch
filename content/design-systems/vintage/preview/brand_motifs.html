<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Brand Motifs</title>
  <link rel="stylesheet" href="../colors_and_type.css">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: var(--font-body, 'Inter', system-ui, sans-serif);
      background: var(--color-paper, #fafafa);
      color: var(--color-ink, #111);
      line-height: 1.6;
    }

    .page {
      max-width: 1100px;
      margin: 0 auto;
      padding: 64px 32px;
    }

    /* Header */
    .header {
      margin-bottom: 64px;
    }
    .header__title {
      font-family: var(--font-display, var(--font-body, 'Inter', system-ui, sans-serif));
      font-size: 48px;
      font-weight: 600;
      line-height: 1.15;
      letter-spacing: -0.02em;
      color: var(--color-ink, #111);
      margin-bottom: 12px;
    }
    .header__subtitle {
      font-size: 18px;
      color: var(--color-slate, #6b6b6b);
      max-width: 600px;
    }
    .header__rule {
      display: block;
      width: 64px;
      height: 3px;
      background: var(--color-signal, #2f6feb);
      border: none;
      margin-top: 24px;
      border-radius: 2px;
    }

    /* Section */
    .section {
      margin-bottom: 56px;
    }
    .section__label {
      font-family: var(--font-display, var(--font-body, 'Inter', system-ui, sans-serif));
      font-size: 14px;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--color-slate, #6b6b6b);
      margin-bottom: 24px;
      padding-bottom: 12px;
      border-bottom: 1px solid var(--color-border, #e5e5e5);
    }

    /* Key characteristics */
    .traits-list {
      list-style: none;
      padding: 0;
    }
    .traits-list li {
      position: relative;
      padding: 12px 0 12px 28px;
      font-size: 15px;
      line-height: 1.6;
      color: var(--color-ink, #111);
      border-bottom: 1px solid var(--color-border, #e5e5e5);
    }
    .traits-list li:last-child {
      border-bottom: none;
    }
    .traits-list li::before {
      content: '';
      position: absolute;
      left: 0;
      top: 18px;
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--color-signal, #2f6feb);
      opacity: 0.6;
    }

    /* Do's and Don'ts */
    .dd-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 24px;
    }
    @media (max-width: 640px) {
      .dd-grid {
        grid-template-columns: 1fr;
      }
    }
    .dd-card {
      background: var(--color-surface, #fff);
      border: 1px solid var(--color-border, #e5e5e5);
      border-radius: 12px;
      padding: 24px;
      overflow: hidden;
    }
    .dd-card__heading {
      font-family: var(--font-display, var(--font-body, 'Inter', system-ui, sans-serif));
      font-size: 18px;
      font-weight: 600;
      margin-bottom: 16px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .dd-card__heading--do { color: #166534; }
    .dd-card__heading--dont { color: #991b1b; }

    .dd-card__icon {
      width: 22px;
      height: 22px;
      border-radius: 50%;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      font-size: 14px;
      flex-shrink: 0;
    }
    .dd-card__icon--do {
      background: #dcfce7;
      color: #166534;
    }
    .dd-card__icon--dont {
      background: #fee2e2;
      color: #991b1b;
    }

    .dd-list {
      list-style: none;
      padding: 0;
    }
    .dd-list li {
      font-size: 14px;
      line-height: 1.6;
      color: var(--color-ink, #111);
      padding: 6px 0;
      border-bottom: 1px solid var(--color-border, #e5e5e5);
    }
    .dd-list li:last-child {
      border-bottom: none;
    }

    /* Color harmony strip */
    .harmony-strip {
      display: flex;
      border-radius: 12px;
      overflow: hidden;
      height: 80px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.06);
    }
    .harmony-strip__swatch {
      flex: 1;
      position: relative;
      transition: flex 0.3s ease;
      cursor: default;
    }
    .harmony-strip__swatch:hover {
      flex: 1.8;
    }
    .harmony-strip__label {
      position: absolute;
      bottom: 8px;
      left: 50%;
      transform: translateX(-50%);
      font-family: var(--font-mono, 'JetBrains Mono', ui-monospace, monospace);
      font-size: 10px;
      font-weight: 600;
      padding: 2px 6px;
      border-radius: 3px;
      white-space: nowrap;
      opacity: 0;
      transition: opacity 0.2s ease;
    }
    .harmony-strip__swatch:hover .harmony-strip__label {
      opacity: 1;
    }

    /* Type pairing demo */
    .type-pairing {
      background: var(--color-surface, #fff);
      border: 1px solid var(--color-border, #e5e5e5);
      border-radius: 12px;
      padding: 40px 32px;
    }
    .type-pairing__display {
      font-family: var(--font-display, var(--font-body, 'Inter', system-ui, sans-serif));
      font-size: 36px;
      font-weight: 600;
      line-height: 1.2;
      letter-spacing: -0.01em;
      color: var(--color-ink, #111);
      margin-bottom: 16px;
    }
    .type-pairing__body {
      font-family: var(--font-body, 'Inter', system-ui, sans-serif);
      font-size: 16px;
      font-weight: 400;
      line-height: 1.65;
      color: var(--color-slate, #6b6b6b);
      max-width: 640px;
    }
    .type-pairing__meta {
      display: flex;
      gap: 24px;
      margin-top: 20px;
      padding-top: 16px;
      border-top: 1px solid var(--color-border, #e5e5e5);
    }
    .type-pairing__meta-item {
      font-family: var(--font-mono, 'JetBrains Mono', ui-monospace, monospace);
      font-size: 12px;
      color: var(--color-slate, #6b6b6b);
    }
    .type-pairing__meta-label {
      font-weight: 600;
      color: var(--color-ink, #111);
    }

    /* Atmosphere card */
    .atmosphere-card {
      background: var(--color-surface, #fff);
      border: 1px solid var(--color-border, #e5e5e5);
      border-radius: 12px;
      padding: 28px 24px;
    }
    .atmosphere-card p {
      font-size: 15px;
      line-height: 1.7;
      color: var(--color-ink, #111);
    }

    /* Loading */
    .loading {
      text-align: center;
      padding: 80px 24px;
      color: var(--color-slate, #6b6b6b);
      font-size: 16px;
    }
    .loading::after {
      content: '';
      display: block;
      width: 32px;
      height: 32px;
      margin: 16px auto 0;
      border: 3px solid var(--color-border, #e5e5e5);
      border-top-color: var(--color-signal, #2f6feb);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div class="page" id="app">
    <div class="loading">Loading design tokens&hellip;</div>
  </div>

  <script>
    const CORE_COLOR_KEYS = ['paper', 'ink', 'slate', 'signal', 'bone', 'border', 'surface'];

    ( window.__DESIGN_TOKENS__ ? Promise.resolve({ ok: true, json: () => Promise.resolve(window.__DESIGN_TOKENS__) }) : fetch('../tokens.json') )
      .then(r => {
        if (!r.ok) throw new Error('tokens.json not found (' + r.status + ')');
        return r.json();
      })
      .then(render)
      .catch(err => {
        document.getElementById('app').innerHTML =
          '<div class="loading" style="color:#dc2626">' +
          'Could not load tokens.json &mdash; ' + err.message + '</div>';
      });

    function render(tokens) {
      const app = document.getElementById('app');
      const name = tokens.meta?.name || tokens.name || 'Design System';
      const colors = tokens.colors || {};
      const fonts = tokens.fonts || {};
      const meta = tokens.meta || {};

      /* Load Google Fonts */
      const gfUrl = tokens.googleFontsUrl || (fonts.googleUrl);
      if (gfUrl) {
        const link = document.createElement('link');
        link.rel = 'stylesheet';
        link.href = gfUrl;
        document.head.appendChild(link);
      }

      let html = '';

      /* Header */
      html += '<header class="header">';
      html += '  <h1 class="header__title">' + esc(name) + '</h1>';
      html += '  <p class="header__subtitle">Brand motifs, personality, and guidelines.</p>';
      html += '  <hr class="header__rule">';
      html += '</header>';

      /* ---- Atmosphere / Description ---- */
      if (meta.atmosphere || meta.description) {
        html += '<div class="section">';
        html += '  <div class="section__label">Atmosphere</div>';
        html += '  <div class="atmosphere-card"><p>' + esc(meta.atmosphere || meta.description) + '</p></div>';
        html += '</div>';
      }

      /* ---- Key Characteristics ---- */
      const traits = meta.keyCharacteristics || meta.traits || tokens.keyCharacteristics || [];
      if (traits.length) {
        html += '<div class="section">';
        html += '  <div class="section__label">Key Characteristics</div>';
        html += '  <ul class="traits-list">';
        traits.forEach(t => {
          html += '<li>' + esc(t) + '</li>';
        });
        html += '  </ul>';
        html += '</div>';
      }

      /* ---- Do's and Don'ts ---- */
      const dos = meta.dos || tokens.dos || [];
      const donts = meta.donts || tokens.donts || [];
      if (dos.length || donts.length) {
        html += '<div class="section">';
        html += '  <div class="section__label">Do\'s and Don\'ts</div>';
        html += '  <div class="dd-grid">';

        if (dos.length) {
          html += '<div class="dd-card">';
          html += '  <div class="dd-card__heading dd-card__heading--do">';
          html += '    <span class="dd-card__icon dd-card__icon--do">&#10003;</span> Do';
          html += '  </div>';
          html += '  <ul class="dd-list">';
          dos.forEach(d => { html += '<li>' + esc(d) + '</li>'; });
          html += '  </ul></div>';
        }

        if (donts.length) {
          html += '<div class="dd-card">';
          html += '  <div class="dd-card__heading dd-card__heading--dont">';
          html += '    <span class="dd-card__icon dd-card__icon--dont">&#10007;</span> Don\'t';
          html += '  </div>';
          html += '  <ul class="dd-list">';
          donts.forEach(d => { html += '<li>' + esc(d) + '</li>'; });
          html += '  </ul></div>';
        }

        html += '  </div>';
        html += '</div>';
      }

      /* ---- Color Harmony Strip ---- */
      const harmonyKeys = CORE_COLOR_KEYS.filter(k => colors[k]);
      if (harmonyKeys.length) {
        html += '<div class="section">';
        html += '  <div class="section__label">Color Harmony</div>';
        html += '  <div class="harmony-strip">';

        harmonyKeys.forEach(key => {
          const hex = colors[key];
          const lum = relativeLuminance(hex);
          const labelColor = lum > 0.4 ? '#111' : '#fff';
          const labelBg = lum > 0.4 ? 'rgba(0,0,0,0.06)' : 'rgba(255,255,255,0.18)';
          html += '<div class="harmony-strip__swatch" style="background:' + esc(hex) + '">';
          html += '  <span class="harmony-strip__label" style="color:' + labelColor + ';background:' + labelBg + '">' + esc(key) + '</span>';
          html += '</div>';
        });

        html += '  </div>';
        html += '</div>';
      }

      /* ---- Typography Pairing Demo ---- */
      const displayFont = fonts.display || meta.displayFont || '';
      const bodyFont = fonts.body || meta.bodyFont || '';

      html += '<div class="section">';
      html += '  <div class="section__label">Typography Pairing</div>';
      html += '  <div class="type-pairing">';

      html += '    <div class="type-pairing__display"';
      if (displayFont) html += ' style="font-family:\'' + esc(displayFont) + '\',var(--font-display,serif)"';
      html += '>The quick brown fox jumps over the lazy dog</div>';

      html += '    <div class="type-pairing__body"';
      if (bodyFont) html += ' style="font-family:\'' + esc(bodyFont) + '\',var(--font-body,sans-serif)"';
      html += '>Typography is the craft of endowing human language with a durable visual form. ' +
              'Good type choices create hierarchy, establish rhythm, and carry the voice of a brand ' +
              'across every surface it touches &mdash; from a 10px footnote to a 64px hero headline.</div>';

      html += '    <div class="type-pairing__meta">';
      if (displayFont) {
        html += '<div class="type-pairing__meta-item"><span class="type-pairing__meta-label">Display:</span> ' + esc(displayFont) + '</div>';
      }
      if (bodyFont) {
        html += '<div class="type-pairing__meta-item"><span class="type-pairing__meta-label">Body:</span> ' + esc(bodyFont) + '</div>';
      }
      if (!displayFont && !bodyFont) {
        html += '<div class="type-pairing__meta-item">Font families loaded from CSS custom properties.</div>';
      }
      html += '    </div>';
      html += '  </div>';
      html += '</div>';

      app.innerHTML = html;
    }

    /* ---- Utilities ---- */
    function esc(s) {
      const d = document.createElement('div');
      d.textContent = String(s);
      return d.innerHTML;
    }

    function hexToRgb(hex) {
      hex = hex.replace(/^#/, '');
      if (hex.length === 3) hex = hex.split('').map(c => c + c).join('');
      const n = parseInt(hex, 16);
      return [(n >> 16) & 255, (n >> 8) & 255, n & 255];
    }

    function relativeLuminance(hex) {
      try {
        const [r, g, b] = hexToRgb(hex).map(c => {
          c /= 255;
          return c <= 0.03928 ? c / 12.92 : Math.pow((c + 0.055) / 1.055, 2.4);
        });
        return 0.2126 * r + 0.7152 * g + 0.0722 * b;
      } catch { return 0.5; }
    }
  </script>
</body>
</html>
