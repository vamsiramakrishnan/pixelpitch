<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Color Palette — Corporate Design System</title>
  <link rel="stylesheet" href="../colors_and_type.css">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: var(--font-body, 'system-ui', sans-serif);
      background: var(--paper, #ffffff);
      color: var(--ink, #111111);
      line-height: 1.6;
      padding: 0;
    }

    .page {
      max-width: 1200px;
      margin: 0 auto;
      padding: 64px 32px;
    }

    /* Header */
    .header {
      margin-bottom: 64px;
    }

    .header__title {
      font-family: var(--font-display, 'system-ui', sans-serif);
      font-size: 48px;
      font-weight: 600;
      line-height: 1.15;
      letter-spacing: -0.02em;
      color: var(--ink, #111111);
      margin-bottom: 12px;
    }

    .header__subtitle {
      font-size: 18px;
      color: var(--slate, #666666);
      max-width: 640px;
      line-height: 1.5;
    }

    .header__rule {
      display: block;
      width: 80px;
      height: 4px;
      background: var(--signal, #3b82f6);
      border: none;
      margin-top: 24px;
      border-radius: 2px;
    }

    /* Section labels */
    .section-label {
      font-family: var(--font-display, 'system-ui', sans-serif);
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--slate, #666666);
      margin-bottom: 32px;
      padding-bottom: 16px;
      border-bottom: 1px solid var(--border, #e5e5e5);
    }

    /* Swatch grid */
    .swatch-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
      gap: 24px;
      margin-bottom: 64px;
    }

    .swatch {
      background: var(--paper, #ffffff);
      border: 1px solid var(--border, #e5e5e5);
      border-radius: 8px;
      overflow: hidden;
      transition: all 0.2s ease;
    }

    .swatch:hover {
      border-color: var(--signal, #3b82f6);
      box-shadow: 0 4px 16px rgba(59, 130, 246, 0.1);
    }

    .swatch__chip {
      width: 100%;
      aspect-ratio: 4 / 3;
      position: relative;
      display: flex;
      align-items: flex-end;
      justify-content: flex-end;
      padding: 12px;
    }

    .swatch__chip-contrast {
      font-size: 11px;
      font-weight: 700;
      padding: 4px 10px;
      border-radius: 4px;
      line-height: 1.4;
      letter-spacing: 0.02em;
    }

    .swatch__meta {
      padding: 16px;
    }

    .swatch__var {
      font-family: var(--font-mono, 'ui-monospace', monospace);
      font-size: 12px;
      font-weight: 600;
      color: var(--ink, #111111);
      word-break: break-all;
      margin-bottom: 6px;
      letter-spacing: -0.01em;
    }

    .swatch__hex {
      font-family: var(--font-mono, 'ui-monospace', monospace);
      font-size: 11px;
      color: var(--slate, #666666);
      margin-bottom: 8px;
      letter-spacing: -0.01em;
    }

    .swatch__role {
      font-size: 13px;
      line-height: 1.5;
      color: var(--slate, #666666);
      margin-bottom: 8px;
    }

    .swatch__contrast-label {
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }

    .contrast-pass {
      color: #16a34a;
    }

    .contrast-fail {
      color: #dc2626;
    }

    .contrast-aa-large {
      color: #d97706;
    }

    /* Philosophy section */
    .philosophy {
      background: var(--bone, #f5f5f5);
      border: 1px solid var(--border, #e5e5e5);
      border-radius: 8px;
      padding: 40px 32px;
      margin-bottom: 64px;
    }

    .philosophy h2 {
      font-family: var(--font-display, 'system-ui', sans-serif);
      font-size: 20px;
      font-weight: 700;
      color: var(--ink, #111111);
      margin-bottom: 16px;
      letter-spacing: -0.01em;
    }

    .philosophy p {
      font-size: 15px;
      line-height: 1.7;
      color: var(--slate, #666666);
      margin-bottom: 12px;
    }

    .philosophy p:last-child {
      margin-bottom: 0;
    }

    /* WCAG summary */
    .wcag-summary {
      margin-top: 48px;
      padding: 32px;
      background: var(--paper, #ffffff);
      border: 1px solid var(--border, #e5e5e5);
      border-radius: 8px;
    }

    .wcag-summary h2 {
      font-family: var(--font-display, 'system-ui', sans-serif);
      font-size: 18px;
      font-weight: 700;
      margin-bottom: 12px;
      color: var(--ink, #111111);
      letter-spacing: -0.01em;
    }

    .wcag-summary > p {
      font-size: 13px;
      color: var(--slate, #666666);
      margin-bottom: 20px;
      line-height: 1.6;
    }

    .wcag-row {
      display: flex;
      align-items: center;
      gap: 16px;
      padding: 12px 0;
      border-bottom: 1px solid var(--border, #e5e5e5);
      font-size: 14px;
    }

    .wcag-row:last-child {
      border-bottom: none;
    }

    .wcag-badge {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 48px;
      padding: 4px 12px;
      border-radius: 4px;
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .wcag-badge--pass {
      background: #dcfce7;
      color: #166534;
    }

    .wcag-badge--fail {
      background: #fee2e2;
      color: #991b1b;
    }

    .wcag-badge--aa-large {
      background: #fef3c7;
      color: #92400e;
    }

    /* Loading state */
    .loading {
      text-align: center;
      padding: 80px 24px;
      color: var(--slate, #666666);
      font-size: 16px;
    }

    .loading::after {
      content: '';
      display: block;
      width: 32px;
      height: 32px;
      margin: 16px auto 0;
      border: 3px solid var(--border, #e5e5e5);
      border-top-color: var(--signal, #3b82f6);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    /* Accent rule demo */
    .accent-demo {
      margin-bottom: 64px;
      padding: 32px;
      background: var(--bone, #f5f5f5);
      border-radius: 8px;
      border: 1px solid var(--border, #e5e5e5);
    }

    .accent-demo h2 {
      font-family: var(--font-display, 'system-ui', sans-serif);
      font-size: 18px;
      font-weight: 700;
      color: var(--ink, #111111);
      margin-bottom: 20px;
      letter-spacing: -0.01em;
    }

    .accent-demo-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 24px;
    }

    .accent-demo-card {
      background: var(--paper, #ffffff);
      border: 1px solid var(--border, #e5e5e5);
      border-radius: 8px;
      padding: 20px;
      border-left: 4px solid var(--signal, #3b82f6);
    }

    .accent-demo-card h3 {
      font-size: 14px;
      font-weight: 700;
      color: var(--ink, #111111);
      margin-bottom: 8px;
      letter-spacing: 0.02em;
    }

    .accent-demo-card p {
      font-size: 13px;
      color: var(--slate, #666666);
      line-height: 1.6;
    }
  </style>
</head>
<body>
  <div class="page" id="app">
    <div class="loading">Loading design tokens…</div>
  </div>

  <script>
    /* ────────────────────────────────────────────────────────────────── */
    /* Contrast ratio helpers (WCAG 2.1 relative luminance)               */
    /* ────────────────────────────────────────────────────────────────── */
    function hexToRgb(hex) {
      hex = hex.replace(/^#/, '');
      if (hex.length === 3) hex = hex.split('').map(c => c + c).join('');
      const n = parseInt(hex, 16);
      return [(n >> 16) & 255, (n >> 8) & 255, n & 255];
    }

    function luminance([r, g, b]) {
      const [rs, gs, bs] = [r, g, b].map(c => {
        c /= 255;
        return c <= 0.03928 ? c / 12.92 : Math.pow((c + 0.055) / 1.055, 2.4);
      });
      return 0.2126 * rs + 0.7152 * gs + 0.0722 * bs;
    }

    function contrastRatio(hex1, hex2) {
      const l1 = luminance(hexToRgb(hex1));
      const l2 = luminance(hexToRgb(hex2));
      const lighter = Math.max(l1, l2);
      const darker = Math.min(l1, l2);
      return (lighter + 0.05) / (darker + 0.05);
    }

    function wcagLevel(ratio) {
      if (ratio >= 7) return { label: 'AAA', cls: 'pass' };
      if (ratio >= 4.5) return { label: 'AA', cls: 'pass' };
      if (ratio >= 3) return { label: 'AA Large', cls: 'aa-large' };
      return { label: 'Fail', cls: 'fail' };
    }

    /* ────────────────────────────────────────────────────────────────── */
    /* Core token roles and their descriptions                            */
    /* ────────────────────────────────────────────────────────────────── */
    const CORE_ROLES = {
      paper:   'Primary page background',
      ink:     'Primary body text',
      slate:   'Secondary & muted text',
      signal:  'Primary accent & CTA',
      bone:    'Subtle background tint',
      border:  'Dividers & outlines',
      surface: 'Card & container fill',
    };

    /* ────────────────────────────────────────────────────────────────── */
    /* Load and render                                                    */
    /* ────────────────────────────────────────────────────────────────── */
    (window.__DESIGN_TOKENS__ ? Promise.resolve({ ok: true, json: () => Promise.resolve(window.__DESIGN_TOKENS__) }) : fetch('../tokens.json'))
      .then(r => {
        if (!r.ok) throw new Error('tokens.json not found (' + r.status + ')');
        return r.json();
      })
      .then(render)
      .catch(err => {
        document.getElementById('app').innerHTML =
          '<div class="loading" style="color:#dc2626">' +
          'Could not load tokens.json — ' + err.message + '</div>';
      });

    function render(tokens) {
      const app = document.getElementById('app');
      const name = tokens.meta?.title || 'Corporate Design System';
      const summary = tokens.meta?.summary || 'Professional, brand-aligned design system for enterprise applications.';
      const rawColors = tokens.colors || {};
      const paperHex = rawColors.paper || '#ffffff';

      /* Flatten nested color structure */
      const colors = {};
      for (const [k, v] of Object.entries(rawColors)) {
        if (typeof v === 'string') {
          colors[k] = v;
        } else if (v && typeof v === 'object') {
          for (const [sk, sv] of Object.entries(v)) {
            if (typeof sv === 'string') colors[k + '-' + sk] = sv;
          }
        }
      }

      /* Split into core and extended */
      const coreKeys = Object.keys(CORE_ROLES).filter(k => colors[k]);
      const extendedKeys = Object.keys(colors).filter(k => !CORE_ROLES[k] && typeof colors[k] === 'string');

      let html = '';

      /* Header */
      html += '<header class="header">';
      html += '  <h1 class="header__title">Color Palette</h1>';
      html += '  <p class="header__subtitle">' + esc(summary) + '</p>';
      html += '  <hr class="header__rule">';
      html += '</header>';

      /* Palette philosophy */
      html += '<section class="philosophy">';
      html += '  <h2>Palette Philosophy</h2>';
      html += '  <p>The Corporate palette is built on a foundation of professional neutrals and a single primary accent. This constrained approach ensures clarity and focus across enterprise interfaces, with the signal color reserved for primary actions and critical states.</p>';
      html += '  <p><strong>Key principle:</strong> Use the signal color sparingly for CTAs and primary navigation. Keep secondary actions neutral. This hierarchy prevents interface bloat and maintains professional appearance.</p>';
      html += '</section>';

      /* Core palette */
      if (coreKeys.length) {
        html += '<div class="section-label">Core Palette</div>';
        html += '<div class="swatch-grid">';
        coreKeys.forEach(key => {
          html += swatchCard(key, colors[key], paperHex, CORE_ROLES[key]);
        });
        html += '</div>';
      }

      /* Extended palette */
      if (extendedKeys.length) {
        html += '<div class="section-label">Extended Palette</div>';
        html += '<div class="swatch-grid">';
        extendedKeys.forEach(key => {
          const role = formatRole(key);
          html += swatchCard(key, colors[key], paperHex, role);
        });
        html += '</div>';
      }

      /* Accent rule demo */
      html += '<section class="accent-demo">';
      html += '  <h2>Rule of One: Accent Usage</h2>';
      html += '  <div class="accent-demo-grid">';
      html += '    <div class="accent-demo-card">';
      html += '      <h3>✓ Correct</h3>';
      html += '      <p>Single signal color for primary button. Secondary action remains neutral gray.</p>';
      html += '    </div>';
      html += '    <div class="accent-demo-card">';
      html += '      <h3>Common Pattern</h3>';
      html += '      <p>Link text and hover states use the signal color for interactive affordance.</p>';
      html += '    </div>';
      html += '    <div class="accent-demo-card">';
      html += '      <h3>Layout Guidance</h3>';
      html += '      <p>Use bone (#f5f5f5) for subtle section breaks. Reserve signal for actions only.</p>';
      html += '    </div>';
      html += '  </div>';
      html += '</section>';

      /* WCAG summary */
      html += wcagSummary(colors, paperHex);

      app.innerHTML = html;
    }

    /* ────────────────────────────────────────────────────────────────── */
    /* Swatch card builder                                                */
    /* ────────────────────────────────────────────────────────────────── */
    function swatchCard(key, hex, paperHex, role) {
      const ratio = contrastRatio(hex, paperHex);
      const level = wcagLevel(ratio);
      const chipTextColor = luminance(hexToRgb(hex)) > 0.4 ? '#111111' : '#ffffff';
      const chipBadgeBg = luminance(hexToRgb(hex)) > 0.4
        ? 'rgba(0, 0, 0, 0.12)'
        : 'rgba(255, 255, 255, 0.25)';

      return '' +
        '<div class="swatch">' +
        '  <div class="swatch__chip" style="background:' + hex + '">' +
        '    <span class="swatch__chip-contrast" style="color:' + chipTextColor +
             ';background:' + chipBadgeBg + '">' + ratio.toFixed(1) + ':1</span>' +
        '  </div>' +
        '  <div class="swatch__meta">' +
        '    <div class="swatch__var">--' + esc(key) + '</div>' +
        '    <div class="swatch__hex">' + esc(hex) + '</div>' +
        '    <div class="swatch__role">' + esc(role) + '</div>' +
        '    <div class="swatch__contrast-label contrast-' + level.cls + '">' +
             'WCAG ' + level.label + '</div>' +
        '  </div>' +
        '</div>';
    }

    /* ────────────────────────────────────────────────────────────────── */
    /* WCAG compliance summary                                            */
    /* ────────────────────────────────────────────────────────────────── */
    function wcagSummary(colors, paperHex) {
      const keys = Object.keys(colors);
      let passAAA = 0, passAA = 0, passAALarge = 0, fail = 0;

      keys.forEach(k => {
        const ratio = contrastRatio(colors[k], paperHex);
        if (ratio >= 7) passAAA++;
        else if (ratio >= 4.5) passAA++;
        else if (ratio >= 3) passAALarge++;
        else fail++;
      });

      let html = '<div class="wcag-summary">';
      html += '<h2>WCAG 2.1 Compliance</h2>';
      html += '<p>All tokens tested against paper background (' + esc(paperHex) + ') for text legibility and color contrast.</p>';
      html += row('AAA (7:1+)', passAAA, 'pass');
      html += row('AA (4.5:1+)', passAA, 'pass');
      html += row('AA Large Text (3:1+)', passAALarge, 'aa-large');
      html += row('Below threshold', fail, fail > 0 ? 'fail' : 'pass');
      html += '</div>';
      return html;

      function row(label, count, badge) {
        return '<div class="wcag-row">' +
               '<span class="wcag-badge wcag-badge--' + badge + '">' + count + '</span>' +
               '<span>' + label + '</span>' +
               '</div>';
      }
    }

    /* ────────────────────────────────────────────────────────────────── */
    /* Utilities                                                          */
    /* ────────────────────────────────────────────────────────────────── */
    function esc(s) {
      const d = document.createElement('div');
      d.textContent = String(s);
      return d.innerHTML;
    }

    function formatRole(key) {
      return key
        .replace(/([A-Z])/g, ' $1')
        .replace(/[-_]/g, ' ')
        .replace(/\b\w/g, c => c.toUpperCase())
        .trim();
    }
  </script>
</body>
</html>
