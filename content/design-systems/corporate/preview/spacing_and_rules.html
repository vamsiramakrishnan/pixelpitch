<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Spacing &amp; Rules</title>
  <link rel="stylesheet" href="../colors_and_type.css">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: var(--font-body, 'system-ui', sans-serif);
      background: var(--paper, #ffffff);
      color: var(--ink, #111111);
      line-height: 1.6;
    }

    .page {
      max-width: 1100px;
      margin: 0 auto;
      padding: var(--s-7, 64px) var(--s-5, 32px);
    }

    /* Header */
    .header {
      margin-bottom: var(--s-7, 64px);
    }
    .header__title {
      font-family: var(--font-display, 'system-ui', sans-serif);
      font-size: 48px;
      font-weight: 600;
      line-height: 1.15;
      letter-spacing: -0.02em;
      color: var(--ink, #111111);
      margin-bottom: var(--s-2, 8px);
    }
    .header__subtitle {
      font-size: 18px;
      color: var(--slate, #666666);
      margin-bottom: var(--s-5, 32px);
    }
    .header__rule {
      display: block;
      width: 64px;
      height: 3px;
      background: var(--signal, #3b82f6);
      border: none;
      border-radius: 2px;
    }

    /* Section */
    .section {
      margin-bottom: var(--s-6, 48px);
    }
    .section__label {
      font-family: var(--font-display, 'system-ui', sans-serif);
      font-size: 14px;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--slate, #666666);
      margin-bottom: var(--s-4, 24px);
      padding-bottom: var(--s-3, 16px);
      border-bottom: 1px solid var(--border, #e5e5e5);
    }

    /* Spacing scale */
    .spacing-row {
      display: grid;
      grid-template-columns: 100px 1fr 80px;
      gap: var(--s-3, 16px);
      align-items: center;
      padding: var(--s-2, 8px) 0;
      border-bottom: 1px solid var(--border, #e5e5e5);
    }
    .spacing-row:last-child {
      border-bottom: none;
    }

    .spacing-row__name {
      font-family: var(--font-mono, 'ui-monospace', monospace);
      font-size: 13px;
      color: var(--ink, #111111);
      font-weight: 500;
    }

    .spacing-row__bar-wrap {
      height: 28px;
      display: flex;
      align-items: center;
    }
    .spacing-row__bar {
      height: 100%;
      background: var(--signal, #3b82f6);
      border-radius: 4px;
      opacity: 0.18;
      min-width: 2px;
      transition: opacity 0.15s ease;
    }
    .spacing-row:hover .spacing-row__bar {
      opacity: 0.35;
    }

    .spacing-row__value {
      font-family: var(--font-mono, 'ui-monospace', monospace);
      font-size: 13px;
      color: var(--slate, #666666);
      text-align: right;
    }

    /* Rule weights */
    .rule-demo {
      padding: var(--s-4, 24px) 0;
      border-bottom: 1px solid var(--border, #e5e5e5);
    }
    .rule-demo:last-child {
      border-bottom: none;
    }
    .rule-demo__header {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      margin-bottom: var(--s-3, 16px);
    }
    .rule-demo__name {
      font-family: var(--font-mono, 'ui-monospace', monospace);
      font-size: 14px;
      font-weight: 500;
      color: var(--ink, #111111);
    }
    .rule-demo__spec {
      font-family: var(--font-mono, 'ui-monospace', monospace);
      font-size: 12px;
      color: var(--slate, #666666);
    }
    .rule-demo__line {
      width: 100%;
      border: none;
      border-radius: 1px;
    }

    /* Border radius */
    .radius-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
      gap: var(--s-5, 32px);
    }
    .radius-item {
      text-align: center;
    }
    .radius-item__box {
      width: 100%;
      aspect-ratio: 1 / 1;
      max-width: 120px;
      margin: 0 auto var(--s-3, 16px);
      background: var(--surface, #f5f5f5);
      border: 2px solid var(--signal, #3b82f6);
      opacity: 0.6;
      transition: opacity 0.15s ease;
    }
    .radius-item:hover .radius-item__box {
      opacity: 1;
    }
    .radius-item__name {
      font-family: var(--font-mono, 'ui-monospace', monospace);
      font-size: 13px;
      font-weight: 500;
      color: var(--ink, #111111);
      margin-bottom: var(--s-1, 4px);
    }
    .radius-item__value {
      font-family: var(--font-mono, 'ui-monospace', monospace);
      font-size: 12px;
      color: var(--slate, #666666);
    }

    /* Depth/elevation demos */
    .depth-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
      gap: var(--s-5, 32px);
    }
    .depth-item {
      padding: var(--s-4, 24px);
      background: var(--paper, #ffffff);
      border-radius: var(--radius-md, 8px);
      text-align: center;
      border: 1px solid var(--border, #e5e5e5);
      transition: transform 0.15s ease;
    }
    .depth-item--elevated {
      border: none;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
    }
    .depth-item:hover {
      transform: translateY(-2px);
    }
    .depth-item__name {
      font-family: var(--font-mono, 'ui-monospace', monospace);
      font-size: 13px;
      font-weight: 500;
      color: var(--ink, #111111);
      margin-bottom: var(--s-2, 8px);
    }
    .depth-item__spec {
      font-family: var(--font-mono, 'ui-monospace', monospace);
      font-size: 11px;
      color: var(--slate, #666666);
      word-break: break-all;
    }

    /* Loading */
    .loading {
      text-align: center;
      padding: 80px 24px;
      color: var(--slate, #666666);
      font-size: 16px;
    }
    .loading::after {
      content: '';
      display: block;
      width: 32px;
      height: 32px;
      margin: 16px auto 0;
      border: 3px solid var(--border, #e5e5e5);
      border-top-color: var(--signal, #3b82f6);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* Grid visualization */
    .grid-demo {
      display: grid;
      grid-template-columns: repeat(12, 1fr);
      gap: var(--s-2, 8px);
      padding: var(--s-4, 24px);
      background: var(--bone, #f5f5f5);
      border-radius: var(--radius-md, 8px);
      margin-bottom: var(--s-5, 32px);
    }
    .grid-col {
      padding: var(--s-3, 16px);
      background: var(--signal, #3b82f6);
      border-radius: var(--radius-sm, 4px);
      color: var(--paper, #ffffff);
      font-size: 11px;
      font-weight: 600;
      text-align: center;
      opacity: 0.7;
    }

    @media (max-width: 600px) {
      .spacing-row {
        grid-template-columns: 70px 1fr 50px;
        gap: var(--s-2, 8px);
      }
      .page {
        padding: var(--s-5, 32px) var(--s-3, 16px);
      }
    }
  </style>
</head>
<body>
  <div class="page" id="app">
    <div class="loading">Loading design tokens&hellip;</div>
  </div>

  <script>
    const DEFAULT_SPACING = {
      's-1': '4px',
      's-2': '8px',
      's-3': '16px',
      's-4': '24px',
      's-5': '32px',
      's-6': '48px',
      's-7': '64px',
      's-8': '96px',
    };

    const DEFAULT_DEPTH = [
      { name: 'Flat', level: 0, treatment: 'none' },
      { name: 'Border', level: 1, treatment: '1px solid var(--border)' },
      { name: 'Elevated', level: 2, treatment: '0 2px 8px rgba(0,0,0,0.08)' },
    ];

    const DEFAULT_RADIUS = {
      none: '0',
      sm:   '4px',
      md:   '8px',
      lg:   '16px',
      full: '999px',
    };

    ( window.__DESIGN_TOKENS__ ? Promise.resolve({ ok: true, json: () => Promise.resolve(window.__DESIGN_TOKENS__) }) : fetch('../tokens.json') )
      .then(r => {
        if (!r.ok) throw new Error('tokens.json not found (' + r.status + ')');
        return r.json();
      })
      .then(render)
      .catch(err => {
        document.getElementById('app').innerHTML =
          '<div class="loading" style="color:#dc2626">' +
          'Could not load tokens.json &mdash; ' + err.message + '</div>';
      });

    function render(tokens) {
      const app = document.getElementById('app');
      const name = tokens.meta?.title || tokens.meta?.id || 'Design System';

      const spacing = tokens.spacing?.scale || DEFAULT_SPACING;
      const depth   = tokens.depth || DEFAULT_DEPTH;
      const radius  = tokens.radii || DEFAULT_RADIUS;

      let html = '';

      /* Header */
      html += '<header class="header">';
      html += '  <h1 class="header__title">Eight pixels.<br>One ruler.</h1>';
      html += '  <p class="header__subtitle">Structural spacing, rule weights, and depth treatments for ' + esc(name) + '.</p>';
      html += '  <hr class="header__rule">';
      html += '</header>';

      /* ---- Spacing scale ---- */
      html += '<div class="section">';
      html += '  <div class="section__label">Spacing Scale</div>';

      const spacingEntries = Object.entries(spacing);
      const maxPx = Math.max(...spacingEntries.map(([, v]) => parseFloat(v) || 0), 1);

      spacingEntries.forEach(([key, value]) => {
        const px = parseFloat(value) || 0;
        const pct = Math.max((px / maxPx) * 100, 2);
        html += '<div class="spacing-row">';
        html += '  <div class="spacing-row__name">' + esc(key) + '</div>';
        html += '  <div class="spacing-row__bar-wrap">';
        html += '    <div class="spacing-row__bar" style="width:' + pct + '%"></div>';
        html += '  </div>';
        html += '  <div class="spacing-row__value">' + esc(value) + '</div>';
        html += '</div>';
      });

      html += '</div>';

      /* ---- Grid system ---- */
      html += '<div class="section">';
      html += '  <div class="section__label">Grid System</div>';
      html += '  <p style="color:var(--slate,#666666);margin-bottom:var(--s-4,24px);font-size:14px">12-column grid with 8px base unit and consistent gutter.</p>';
      html += '  <div class="grid-demo">';
      for (let i = 0; i < 12; i++) {
        html += '<div class="grid-col">' + (i + 1) + '</div>';
      }
      html += '  </div>';
      html += '</div>';

      /* ---- Rule weights / Depth ---- */
      html += '<div class="section">';
      html += '  <div class="section__label">Depth &amp; Elevation</div>';

      const depthEntries = Array.isArray(depth) ? depth : Object.entries(depth).map(([key, val]) => ({
        name: typeof val === 'object' ? val.name || key : key,
        treatment: typeof val === 'object' ? val.treatment : val,
      }));

      depthEntries.forEach((item, idx) => {
        const name = item.name || 'Level ' + idx;
        const treatment = item.treatment || 'none';
        
        html += '<div class="rule-demo">';
        html += '  <div class="rule-demo__header">';
        html += '    <span class="rule-demo__name">' + esc(name) + '</span>';
        html += '    <span class="rule-demo__spec">' + esc(treatment).substring(0, 60) + '</span>';
        html += '  </div>';
        html += '</div>';
      });

      html += '</div>';

      /* ---- Elevation demo cards ---- */
      html += '<div class="section">';
      html += '  <div class="section__label">Elevation Preview</div>';
      html += '  <div class="depth-grid">';

      depthEntries.forEach((item, idx) => {
        const name = item.name || 'Level ' + idx;
        const isElevated = name.toLowerCase().includes('elevated');
        const classes = 'depth-item' + (isElevated ? ' depth-item--elevated' : '');
        
        html += '<div class="' + classes + '">';
        html += '  <div class="depth-item__name">' + esc(name) + '</div>';
        html += '  <div class="depth-item__spec">' + esc(item.treatment).substring(0, 50) + '</div>';
        html += '</div>';
      });

      html += '  </div>';
      html += '</div>';

      /* ---- Border radius ---- */
      html += '<div class="section">';
      html += '  <div class="section__label">Border Radius</div>';
      html += '  <div class="radius-grid">';

      Object.entries(radius).forEach(([key, value]) => {
        html += '<div class="radius-item">';
        html += '  <div class="radius-item__box" style="border-radius:' + esc(value) + '"></div>';
        html += '  <div class="radius-item__name">' + esc(key) + '</div>';
        html += '  <div class="radius-item__value">' + esc(value) + '</div>';
        html += '</div>';
      });

      html += '  </div>';
      html += '</div>';

      app.innerHTML = html;
    }

    function esc(s) {
      const d = document.createElement('div');
      d.textContent = String(s);
      return d.innerHTML;
    }
  </script>
</body>
</html>
