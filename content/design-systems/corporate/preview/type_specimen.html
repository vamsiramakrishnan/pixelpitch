<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Type Specimen — Corporate</title>
  <link rel="stylesheet" href="../colors_and_type.css">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: var(--font-body, system-ui, sans-serif);
      background: var(--paper, #ffffff);
      color: var(--ink, #111111);
      line-height: 1.6;
    }

    .page {
      max-width: 1100px;
      margin: 0 auto;
      padding: 64px 32px;
    }

    /* Header */
    .header {
      margin-bottom: 64px;
    }
    .header__title {
      font-family: var(--font-display, system-ui, sans-serif);
      font-size: 56px;
      font-weight: 700;
      line-height: 1.15;
      letter-spacing: -0.015em;
      color: var(--ink, #111111);
      margin-bottom: 12px;
    }
    .header__subtitle {
      font-size: 18px;
      color: var(--slate, #666666);
      max-width: 600px;
      line-height: 1.5;
    }
    .header__rule {
      display: block;
      width: 64px;
      height: 3px;
      background: var(--signal, #3b82f6);
      border: none;
      margin-top: 24px;
      border-radius: 2px;
    }

    /* Font family summary */
    .font-families {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 24px;
      margin-bottom: 56px;
    }
    .font-card {
      background: var(--paper, #ffffff);
      border: var(--card-border, 1px solid var(--border, #e5e5e5));
      border-radius: var(--card-radius, 8px);
      padding: 28px 24px;
    }
    .font-card__label {
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--slate, #666666);
      margin-bottom: 8px;
    }
    .font-card__name {
      font-size: 24px;
      font-weight: 500;
      line-height: 1.3;
      margin-bottom: 4px;
      color: var(--ink, #111111);
    }
    .font-card__fallback {
      font-family: var(--font-mono, ui-monospace, monospace);
      font-size: 12px;
      color: var(--slate, #666666);
      word-break: break-all;
    }

    /* Section label */
    .section-label {
      font-family: var(--font-display, system-ui, sans-serif);
      font-size: 14px;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--slate, #666666);
      margin-bottom: 24px;
      padding-bottom: 12px;
      border-bottom: 1px solid var(--border, #e5e5e5);
    }

    /* Ramp row */
    .ramp-row {
      display: grid;
      grid-template-columns: 260px 1fr;
      gap: 32px;
      align-items: baseline;
      padding: 24px 0;
      border-bottom: 1px solid var(--border, #e5e5e5);
    }
    .ramp-row:last-child {
      border-bottom: none;
    }

    @media (max-width: 720px) {
      .ramp-row {
        grid-template-columns: 1fr;
        gap: 12px;
      }
    }

    /* Left meta column */
    .ramp-meta__role {
      font-family: var(--font-display, system-ui, sans-serif);
      font-size: 16px;
      font-weight: 600;
      color: var(--ink, #111111);
      margin-bottom: 8px;
    }
    .ramp-meta__detail {
      font-family: var(--font-mono, ui-monospace, monospace);
      font-size: 12px;
      line-height: 1.7;
      color: var(--slate, #666666);
      white-space: pre-wrap;
    }

    /* Right sample column */
    .ramp-sample {
      color: var(--ink, #111111);
      overflow-wrap: break-word;
    }

    /* Ramp section container */
    .ramp-section {
      margin-bottom: 56px;
    }

    /* Pangram block */
    .pangram-block {
      background: var(--paper, #ffffff);
      border: var(--card-border, 1px solid var(--border, #e5e5e5));
      border-radius: var(--card-radius, 8px);
      padding: 40px 32px;
      margin-bottom: 56px;
    }
    .pangram-block__label {
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--slate, #666666);
      margin-bottom: 16px;
    }
    .pangram-block__chars {
      font-size: 28px;
      line-height: 1.5;
      letter-spacing: 0.02em;
      color: var(--ink, #111111);
      word-break: break-all;
    }

    /* Loading */
    .loading {
      text-align: center;
      padding: 80px 24px;
      color: var(--slate, #666666);
      font-size: 16px;
    }
    .loading::after {
      content: '';
      display: block;
      width: 32px;
      height: 32px;
      margin: 16px auto 0;
      border: 3px solid var(--border, #e5e5e5);
      border-top-color: var(--signal, #3b82f6);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div class="page" id="app">
    <div class="loading">Loading design tokens&hellip;</div>
  </div>

  <script>
    const EDITORIAL_SAMPLES = [
      'Enterprise design systems scale across teams and products while maintaining visual coherence.',
      'Consistency in typography builds trust and improves readability across interfaces.',
      'Professional layouts rely on structured grids and considered whitespace.',
      'Type hierarchy guides users through information architecture with clarity.',
      'Bold headlines set the tone; legible body text sustains engagement.',
      'Strategic use of weight and scale creates visual rhythm and emphasis.',
      'Accessible typography ensures readability for all users and contexts.',
      'Corporate systems balance personality with professional restraint.',
      'Careful kerning and spacing elevate the quality of digital communication.',
      'Type is the backbone of brand identity in digital products.',
    ];

    ( window.__DESIGN_TOKENS__ ? Promise.resolve({ ok: true, json: () => Promise.resolve(window.__DESIGN_TOKENS__) }) : fetch('../tokens.json') )
      .then(r => {
        if (!r.ok) throw new Error('tokens.json not found (' + r.status + ')');
        return r.json();
      })
      .then(render)
      .catch(err => {
        document.getElementById('app').innerHTML =
          '<div class="loading" style="color:#dc2626">' +
          'Could not load tokens.json &mdash; ' + err.message + '</div>';
      });

    function render(tokens) {
      const app = document.getElementById('app');
      const name = tokens.meta?.title || tokens.meta?.name || 'Corporate';

      /* Load Google Fonts if present */
      if (tokens.googleFontsUrl) {
        const link = document.createElement('link');
        link.rel = 'stylesheet';
        link.href = tokens.googleFontsUrl;
        document.head.appendChild(link);
      }
      if (tokens.fonts?.googleUrl) {
        const link = document.createElement('link');
        link.rel = 'stylesheet';
        link.href = tokens.fonts.googleUrl;
        document.head.appendChild(link);
      }

      const fonts = tokens.fonts || {
        display: 'Poppins',
        body: 'Open Sans',
        mono: 'IBM Plex Mono'
      };

      const ramp = buildTypeRamp();

      let html = '';

      /* Header */
      html += '<header class="header">';
      html += '  <h1 class="header__title">System in Type</h1>';
      html += '  <p class="header__subtitle">Enterprise typography designed for clarity, consistency, and scale across products and platforms.</p>';
      html += '  <hr class="header__rule">';
      html += '</header>';

      /* Font families */
      const families = [
        { label: 'Display', name: 'Poppins', fallback: 'system-ui, sans-serif' },
        { label: 'Body', name: 'Open Sans', fallback: 'system-ui, sans-serif' },
        { label: 'Monospace', name: 'IBM Plex Mono', fallback: 'ui-monospace, monospace' }
      ];

      html += '<div class="font-families">';
      families.forEach(f => {
        html += '<div class="font-card">';
        html += '  <div class="font-card__label">' + esc(f.label) + '</div>';
        html += '  <div class="font-card__name">' + esc(f.name) + '</div>';
        html += '  <div class="font-card__fallback">' + esc(f.fallback) + '</div>';
        html += '</div>';
      });
      html += '</div>';

      /* Character set block */
      html += '<div class="pangram-block">';
      html += '  <div class="pangram-block__label">Character Set</div>';
      html += '  <div class="pangram-block__chars">AaBbCcDdEeFfGgHhIiJjKkLlMmNnOoPpQqRrSsTtUuVvWwXxYyZz<br>0123456789 !@#$%&amp;*()&ndash;&mdash;&lsquo;&rsquo;&ldquo;&rdquo;</div>';
      html += '</div>';

      /* Type ramp */
      if (ramp.length) {
        html += '<div class="ramp-section">';
        html += '<div class="section-label">Type Ramp</div>';
        ramp.forEach((entry, i) => {
          html += rampRow(entry, i);
        });
        html += '</div>';
      }

      app.innerHTML = html;
    }

    function buildTypeRamp() {
      return [
        { role: 'Display · Hero', size: '64px', weight: 700, lineHeight: 1.1, letterSpacing: '-0.015em', font: 'Poppins' },
        { role: 'Display · XL', size: '48px', weight: 700, lineHeight: 1.15, letterSpacing: '-0.01em', font: 'Poppins' },
        { role: 'Display · LG', size: '40px', weight: 600, lineHeight: 1.2, letterSpacing: '-0.005em', font: 'Poppins' },
        { role: 'Headline · XL', size: '32px', weight: 600, lineHeight: 1.25, letterSpacing: '0em', font: 'Poppins' },
        { role: 'Headline · LG', size: '28px', weight: 600, lineHeight: 1.3, letterSpacing: '0em', font: 'Poppins' },
        { role: 'Headline · MD', size: '24px', weight: 600, lineHeight: 1.35, letterSpacing: '0em', font: 'Poppins' },
        { role: 'Headline · SM', size: '20px', weight: 600, lineHeight: 1.4, letterSpacing: '0em', font: 'Poppins' },
        { role: 'Subhead · LG', size: '18px', weight: 500, lineHeight: 1.44, letterSpacing: '0em', font: 'Open Sans' },
        { role: 'Body · LG', size: '18px', weight: 400, lineHeight: 1.56, letterSpacing: '0em', font: 'Open Sans' },
        { role: 'Body · MD', size: '16px', weight: 400, lineHeight: 1.5, letterSpacing: '0em', font: 'Open Sans' },
        { role: 'Body · SM', size: '14px', weight: 400, lineHeight: 1.57, letterSpacing: '0em', font: 'Open Sans' },
        { role: 'Caption · LG', size: '13px', weight: 500, lineHeight: 1.54, letterSpacing: '0.005em', font: 'Open Sans' },
        { role: 'Caption · SM', size: '12px', weight: 400, lineHeight: 1.5, letterSpacing: '0.01em', font: 'Open Sans' },
        { role: 'Label · SM', size: '11px', weight: 600, lineHeight: 1.45, letterSpacing: '0.08em', font: 'Open Sans' },
        { role: 'Mono · Code', size: '13px', weight: 400, lineHeight: 1.6, letterSpacing: '0em', font: 'IBM Plex Mono' },
      ];
    }

    function rampRow(entry, idx) {
      const role = entry.role || 'Role ' + (idx + 1);
      const size = entry.size || '16px';
      const weight = entry.weight || 400;
      const lh = entry.lineHeight || 1.5;
      const ls = entry.letterSpacing || '0em';
      const family = entry.font || 'Open Sans';
      const sampleIdx = idx % EDITORIAL_SAMPLES.length;
      const sample = EDITORIAL_SAMPLES[sampleIdx];

      const sizeNum = parseFloat(size);
      const displaySample = sizeNum >= 40
        ? sample.split('.')[0] + '.'
        : sample;

      let fontStyle = 'font-size:' + size + ';font-weight:' + weight + ';line-height:' + lh + ';';
      if (ls !== '0em' && ls !== '0') fontStyle += 'letter-spacing:' + ls + ';';
      fontStyle += 'font-family:\'' + esc(family) + '\',var(--font-body,system-ui,sans-serif);';

      let meta = '';
      meta += esc(size) + ' / ' + esc(weight);
      meta += '\n' + esc(family);
      meta += '\nline-height: ' + esc(String(lh));
      if (ls !== '0em' && ls !== '0') meta += '\nletter-spacing: ' + esc(ls);

      return '' +
        '<div class="ramp-row">' +
        '  <div class="ramp-meta">' +
        '    <div class="ramp-meta__role">' + esc(role) + '</div>' +
        '    <div class="ramp-meta__detail">' + meta + '</div>' +
        '  </div>' +
        '  <div class="ramp-sample" style="' + fontStyle + '">' + esc(displaySample) + '</div>' +
        '</div>';
    }

    function esc(s) {
      const d = document.createElement('div');
      d.textContent = String(s);
      return d.innerHTML;
    }
  </script>
</body>
</html>
