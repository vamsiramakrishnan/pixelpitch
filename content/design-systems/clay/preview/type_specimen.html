<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Type Specimen — Clay</title>
  <link rel="stylesheet" href="../colors_and_type.css">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: var(--font-body, system-ui, sans-serif);
      background: var(--paper, #faf9f7);
      color: var(--ink, #fc7981);
      line-height: 1.6;
    }

    .page {
      max-width: 1200px;
      margin: 0 auto;
      padding: 96px 48px;
    }

    @media (max-width: 768px) {
      .page {
        padding: 64px 32px;
      }
    }

    @media (max-width: 480px) {
      .page {
        padding: 48px 24px;
      }
    }

    /* Header */
    .header {
      margin-bottom: 96px;
    }

    .header__kicker {
      font-family: var(--font-mono, 'Space Mono', monospace);
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 1.08px;
      text-transform: uppercase;
      color: var(--slate, #77736b);
      margin-bottom: 24px;
    }

    .header__title {
      font-family: var(--font-body, system-ui, sans-serif);
      font-size: 80px;
      font-weight: 600;
      line-height: 1.0;
      letter-spacing: -3.2px;
      color: var(--ink, #fc7981);
      margin-bottom: 24px;
    }

    .header__subtitle {
      font-family: var(--font-body, system-ui, sans-serif);
      font-size: 20px;
      font-weight: 400;
      line-height: 1.6;
      color: var(--slate, #77736b);
      max-width: 720px;
      margin-bottom: 32px;
    }

    .header__rule {
      display: block;
      width: 120px;
      height: 2px;
      background: var(--ink, #fc7981);
      border: none;
      margin: 0;
    }

    /* Font families section */
    .font-families {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 32px;
      margin-bottom: 96px;
      margin-top: 64px;
    }

    .font-card {
      background: var(--paper, #faf9f7);
      border: 1px solid var(--border, #dad4c8);
      border-radius: 24px;
      padding: 32px;
    }

    .font-card__label {
      font-family: var(--font-mono, 'Space Mono', monospace);
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.99px;
      text-transform: uppercase;
      color: var(--slate, #77736b);
      margin-bottom: 12px;
    }

    .font-card__name {
      font-family: var(--font-body, system-ui, sans-serif);
      font-size: 32px;
      font-weight: 600;
      line-height: 1.1;
      letter-spacing: -0.64px;
      color: var(--ink, #fc7981);
      margin-bottom: 8px;
    }

    .font-card__fallback {
      font-family: var(--font-mono, 'Space Mono', monospace);
      font-size: 11px;
      font-weight: 400;
      color: var(--slate, #77736b);
      word-break: break-word;
      line-height: 1.5;
    }

    /* Character set block */
    .charmap-block {
      background: var(--bone, #eff1f3);
      border: 1px dashed var(--border, #dad4c8);
      border-radius: 24px;
      padding: 48px;
      margin-bottom: 96px;
    }

    .charmap-block__label {
      font-family: var(--font-mono, 'Space Mono', monospace);
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.99px;
      text-transform: uppercase;
      color: var(--slate, #77736b);
      margin-bottom: 24px;
    }

    .charmap-block__chars {
      font-family: var(--font-body, system-ui, sans-serif);
      font-size: 28px;
      font-weight: 500;
      line-height: 1.8;
      letter-spacing: -0.28px;
      color: var(--ink, #fc7981);
      word-break: break-word;
    }

    /* Section label */
    .section-label {
      font-family: var(--font-mono, 'Space Mono', monospace);
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.99px;
      text-transform: uppercase;
      color: var(--slate, #77736b);
      margin-bottom: 32px;
      padding-bottom: 16px;
      border-bottom: 1px solid var(--border, #dad4c8);
    }

    /* Ramp row */
    .ramp-row {
      display: grid;
      grid-template-columns: 280px 1fr;
      gap: 48px;
      align-items: baseline;
      padding: 32px 0;
      border-bottom: 1px solid var(--border, #dad4c8);
    }

    .ramp-row:last-child {
      border-bottom: none;
    }

    @media (max-width: 800px) {
      .ramp-row {
        grid-template-columns: 1fr;
        gap: 16px;
      }
    }

    /* Left meta column */
    .ramp-meta__role {
      font-family: var(--font-body, system-ui, sans-serif);
      font-size: 16px;
      font-weight: 500;
      color: var(--ink, #fc7981);
      margin-bottom: 8px;
      letter-spacing: -0.16px;
    }

    .ramp-meta__detail {
      font-family: var(--font-mono, 'Space Mono', monospace);
      font-size: 10px;
      font-weight: 400;
      line-height: 1.8;
      color: var(--slate, #77736b);
      letter-spacing: 0.2px;
    }

    /* Right sample column */
    .ramp-sample {
      color: var(--ink, #fc7981);
      overflow-wrap: break-word;
      word-spacing: 0.1em;
      font-family: var(--font-body, system-ui, sans-serif);
    }

    /* Ramp section */
    .ramp-section {
      margin-bottom: 96px;
    }

    /* Stylistic set demo */
    .stylistic-sets {
      margin-bottom: 96px;
    }

    .stylistic-sets__label {
      font-family: var(--font-mono, 'Space Mono', monospace);
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.99px;
      text-transform: uppercase;
      color: var(--slate, #77736b);
      margin-bottom: 32px;
      padding-bottom: 16px;
      border-bottom: 1px solid var(--border, #dad4c8);
    }

    .stylistic-set-demo {
      background: var(--bone, #eff1f3);
      border: 1px dashed var(--border, #dad4c8);
      border-radius: 24px;
      padding: 40px;
      margin-bottom: 24px;
    }

    .stylistic-set-demo__name {
      font-family: var(--font-mono, 'Space Mono', monospace);
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 0.9px;
      text-transform: uppercase;
      color: var(--slate, #77736b);
      margin-bottom: 12px;
    }

    .stylistic-set-demo__sample {
      font-family: var(--font-body, system-ui, sans-serif);
      font-size: 44px;
      font-weight: 600;
      line-height: 1.1;
      letter-spacing: -0.88px;
      color: var(--ink, #fc7981);
    }

    /* Loading */
    .loading {
      text-align: center;
      padding: 160px 48px;
      color: var(--slate, #77736b);
      font-family: var(--font-body, system-ui, sans-serif);
      font-size: 18px;
    }

    .loading::after {
      content: '';
      display: block;
      width: 32px;
      height: 32px;
      margin: 24px auto 0;
      border: 2px solid var(--border, #dad4c8);
      border-top-color: var(--ink, #fc7981);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    /* Ornament */
    .ornament {
      display: inline-block;
      margin: 0 8px;
      font-size: 14px;
      color: var(--signal, #84e7a5);
    }
  </style>
</head>
<body>
  <div class="page" id="app">
    <div class="loading">Loading design tokens&hellip;</div>
  </div>

  <script>
    const EDITORIAL_SAMPLES = [
      'Design makes the complex feel effortless.',
      'Geometry meets warmth in every detail.',
      'Typography is the most intimate interface.',
      'Playful precision beats sterile perfection.',
      'Color names shape perception before use.',
      'Margins and breathing room matter more than features.',
      'Consistency is the foundation of craft.',
      'Systems scale through restraint, not addition.',
      'Every interaction should delight, not confuse.',
      'The best design disappears into utility.',
      'Roobert gives personality to utilitarian grids.',
      'Creative work requires structural thinking.',
    ];

    const DROPCAP_TEXT = 'Roobert's geometric skeleton and distinctive stylistic sets transform what could be a neutral sans-serif into a character-rich display face. Combined with Space Mono for technical labels, the pairing creates a craft-meets-code aesthetic. The aggressive negative tracking at display sizes—compressing 80px headlines to -3.2px—creates a punchy, art-directed energy. Yet body text breathes at 1.6 line-height, ensuring readability across page-length content. This tension between display compression and body generosity mirrors Clay\'s design philosophy: playful, precise, and never precious. The five stylistic sets (ss01, ss03, ss10, ss11, ss12) layered across all text create a subtle typographic vocabulary that feels handcrafted, not automated. Warmth, personality, and editorial craft distinguish this system from every other geometric sans on the market.';

    fetch('../tokens.json')
      .then(r => {
        if (!r.ok) throw new Error('tokens.json not found (' + r.status + ')');
        return r.json();
      })
      .then(render)
      .catch(err => {
        document.getElementById('app').innerHTML =
          '<div class="loading" style="color:#fc7981">' +
          'Could not load tokens.json — ' + err.message + '</div>';
      });

    function render(tokens) {
      const app = document.getElementById('app');
      const title = tokens.meta?.title || 'Design System';
      const summary = tokens.meta?.summary || '';

      const ramp = tokens.typography?.ramp || [];

      let html = '';

      /* Header */
      html += '<header class="header">';
      html += '  <div class="header__kicker">Type Specimen</div>';
      html += '  <h1 class="header__title">' + esc(title) + '</h1>';
      html += '  <p class="header__subtitle">' + esc(summary) + '</p>';
      html += '  <hr class="header__rule">';
      html += '</header>';

      /* Font families */
      const families = [
        { label: 'Display & Body', name: 'Roobert', fallback: 'system-ui, -apple-system, Helvetica Neue, sans-serif' },
        { label: 'Monospace', name: 'Space Mono', fallback: 'ui-monospace, Menlo, IBM Plex Mono, monospace' }
      ];

      html += '<div class="font-families">';
      families.forEach(f => {
        html += '<div class="font-card">';
        html += '  <div class="font-card__label">' + esc(f.label) + '</div>';
        html += '  <div class="font-card__name">' + esc(f.name) + '</div>';
        html += '  <div class="font-card__fallback">' + esc(f.fallback) + '</div>';
        html += '</div>';
      });
      html += '</div>';

      /* Character set */
      html += '<div class="charmap-block">';
      html += '  <div class="charmap-block__label">Character Set — Roobert</div>';
      html += '  <div class="charmap-block__chars">';
      html += '    AaBbCcDdEeFfGgHhIiJjKkLlMmNnOoPpQqRrSsTtUuVvWwXxYyZz<br>';
      html += '    0123456789 !@#$%&amp;*()&ndash;&mdash;&lsquo;&rsquo;&ldquo;&rdquo;';
      html += '  </div>';
      html += '</div>';

      /* Type ramp */
      if (ramp.length) {
        html += '<div class="ramp-section">';
        html += '<div class="section-label">Type Ramp</div>';
        ramp.forEach((entry, i) => {
          html += rampRow(entry, i);
        });
        html += '</div>';
      }

      /* Stylistic sets */
      html += '<div class="stylistic-sets">';
      html += '<div class="stylistic-sets__label">OpenType Stylistic Sets — Roobert Identity</div>';
      
      const ssVariations = [
        { name: 'Default (all 5: ss01, ss03, ss10, ss11, ss12)', sample: 'ROOBERT' },
        { name: 'Display Only (ss01 reserved for headings)', sample: 'DESIGNER' },
        { name: 'Body & UI (4 sets: ss03, ss10, ss11, ss12)', sample: 'Experience' }
      ];

      ssVariations.forEach(ss => {
        html += '<div class="stylistic-set-demo">';
        html += '  <div class="stylistic-set-demo__name">' + esc(ss.name) + '</div>';
        html += '  <div class="stylistic-set-demo__sample">' + esc(ss.sample) + '</div>';
        html += '</div>';
      });
      
      html += '</div>';

      /* Drop cap demo */
      html += '<div class="stylistic-sets">';
      html += '<div class="stylistic-sets__label">Drop Cap — Five-Line Roobert, Signal Green</div>';
      html += '<div class="stylistic-set-demo" style="border-style:solid">';
      const firstChar = DROPCAP_TEXT.charAt(0);
      const restText = DROPCAP_TEXT.substring(1);
      html += '<p style="font-family:var(--font-body);font-size:20px;font-weight:400;line-height:1.6;color:var(--ink);margin:0">';
      html += '<span style="float:left;font-family:var(--font-body);font-size:120px;font-weight:600;line-height:0.9;color:var(--signal);margin-right:8px;margin-top:-8px">' + esc(firstChar) + '</span>';
      html += esc(restText);
      html += '</p>';
      html += '</div>';
      html += '</div>';

      app.innerHTML = html;
    }

    function rampRow(entry, idx) {
      const role = entry.role || 'Role ' + (idx + 1);
      const size = entry.size || '16px';
      const weight = entry.weight || 400;
      const lh = entry.lineHeight || '1.5';
      const ls = entry.letterSpacing || '0';

      const fontFamily = 'var(--font-body)';

      const sizeNum = parseFloat(size);
      const sampleIdx = idx % EDITORIAL_SAMPLES.length;
      let sample = EDITORIAL_SAMPLES[sampleIdx];

      /* Truncate very large samples */
      if (sizeNum >= 72) {
        sample = sample.split('.')[0].slice(0, 45);
        if (!sample.endsWith('.')) sample += '.';
      }

      let fontStyle = 'font-size:' + size + ';font-weight:' + weight + ';line-height:' + lh + ';';
      fontStyle += 'font-family:' + fontFamily + ';';
      if (ls && ls !== '0' && ls !== 'normal') fontStyle += 'letter-spacing:' + ls + ';';

      let meta = esc(size) + ' / ' + esc(String(weight));
      meta += '\nRoobert';
      meta += '\nline-height: ' + esc(String(lh));
      if (ls && ls !== '0' && ls !== 'normal') meta += '\nletter-spacing: ' + esc(ls);

      return '' +
        '<div class="ramp-row">' +
        '  <div class="ramp-meta">' +
        '    <div class="ramp-meta__role">' + esc(role) + '</div>' +
        '    <pre class="ramp-meta__detail">' + meta + '</pre>' +
        '  </div>' +
        '  <div class="ramp-sample" style="' + fontStyle + '">' + esc(sample) + '</div>' +
        '</div>';
    }

    function esc(s) {
      const d = document.createElement('div');
      d.textContent = String(s);
      return d.innerHTML;
    }
  </script>
</body>
</html>
