<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Color Palette — Clay</title>
  <link rel="stylesheet" href="../colors_and_type.css">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: var(--font-body, system-ui, sans-serif);
      background: var(--paper, #faf9f7);
      color: var(--ink, #fc7981);
      line-height: 1.6;
      padding: 0;
    }

    .page {
      max-width: 1200px;
      margin: 0 auto;
      padding: 64px 32px;
    }

    /* Header / Stage head */
    .header {
      margin-bottom: 72px;
      border-bottom: 2px solid var(--ink, #fc7981);
      padding-bottom: 32px;
    }

    .header__kicker {
      font-family: var(--font-mono, 'Space Mono', monospace);
      font-size: 14px;
      font-weight: 600;
      letter-spacing: 1.08px;
      text-transform: uppercase;
      color: var(--slate, #77736b);
      margin-bottom: 12px;
    }

    .header__title {
      font-family: var(--font-display, system-ui, sans-serif);
      font-size: 72px;
      font-weight: 600;
      line-height: 0.95;
      letter-spacing: -2.88px;
      color: var(--surface, #000000);
      margin-bottom: 8px;
    }

    .header__subtitle {
      font-family: var(--font-body, system-ui, sans-serif);
      font-size: 22px;
      line-height: 1.55;
      color: var(--slate, #77736b);
      max-width: 720px;
      margin-bottom: 16px;
    }

    .header__meta {
      font-family: var(--font-mono, 'Space Mono', monospace);
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 1.08px;
      color: var(--slate, #77736b);
      text-transform: uppercase;
    }

    /* Section labels */
    .section-label {
      font-family: var(--font-mono, 'Space Mono', monospace);
      font-size: 14px;
      font-weight: 600;
      letter-spacing: 1.08px;
      text-transform: uppercase;
      color: var(--slate, #77736b);
      margin-bottom: 32px;
      padding-bottom: 16px;
      border-bottom: 2px dashed var(--border, #dad4c8);
    }

    /* Swatch grid */
    .swatch-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 24px;
      margin-bottom: 64px;
    }

    .swatch {
      background: var(--color-pure-white, #ffffff);
      border: 1px solid var(--border, #dad4c8);
      border-radius: 24px;
      overflow: hidden;
      transition: all 0.2s ease;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    }

    .swatch:hover {
      border-color: var(--signal, #84e7a5);
      transform: translateY(-4px);
      box-shadow: 0 4px 16px rgba(0,0,0,0.12);
    }

    .swatch__chip {
      width: 100%;
      aspect-ratio: 4 / 3;
      position: relative;
    }

    .swatch__chip-contrast {
      position: absolute;
      bottom: 10px;
      right: 12px;
      font-family: var(--font-mono, 'Space Mono', monospace);
      font-size: 11px;
      font-weight: 600;
      padding: 3px 10px;
      border-radius: 4px;
      line-height: 1.4;
      text-transform: uppercase;
      background: rgba(255, 255, 255, 0.9);
      color: var(--surface, #000000);
      letter-spacing: 0.5px;
    }

    .swatch__meta {
      padding: 18px 20px 20px;
    }

    .swatch__var {
      font-family: var(--font-mono, 'Space Mono', monospace);
      font-size: 12px;
      font-weight: 600;
      color: var(--surface, #000000);
      word-break: break-all;
      margin-bottom: 6px;
      letter-spacing: 0.5px;
    }

    .swatch__hex {
      font-family: var(--font-mono, 'Space Mono', monospace);
      font-size: 11px;
      color: var(--slate, #77736b);
      margin-bottom: 8px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .swatch__role {
      font-family: var(--font-body, system-ui, sans-serif);
      font-size: 14px;
      line-height: 1.5;
      color: var(--surface, #000000);
      margin-bottom: 8px;
    }

    .swatch__contrast-label {
      font-family: var(--font-mono, 'Space Mono', monospace);
      font-size: 11px;
      font-weight: 600;
      margin-top: 8px;
      letter-spacing: 0.5px;
      text-transform: uppercase;
    }

    .contrast-pass { color: #078a52; }
    .contrast-fail { color: #fc7981; }
    .contrast-aa-large { color: #d08a11; }

    /* Usage pattern section */
    .usage-section {
      margin-bottom: 64px;
      padding: 40px;
      background: var(--color-pure-white, #ffffff);
      border: 1px solid var(--border, #dad4c8);
      border-radius: 40px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    }

    .usage-section h2 {
      font-family: var(--font-display, system-ui, sans-serif);
      font-size: 48px;
      font-weight: 600;
      line-height: 1.1;
      letter-spacing: -1.92px;
      color: var(--surface, #000000);
      margin-bottom: 24px;
    }

    .usage-section p {
      font-family: var(--font-body, system-ui, sans-serif);
      font-size: 18px;
      line-height: 1.55;
      color: var(--surface, #000000);
      margin-bottom: 24px;
      max-width: 720px;
    }

    .rule-of-one {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 32px;
      margin-top: 32px;
      align-items: start;
    }

    .rule-example {
      padding: 24px;
      background: var(--paper, #faf9f7);
      border: 1px solid var(--border, #dad4c8);
      border-radius: 24px;
    }

    .rule-example h3 {
      font-family: var(--font-display, system-ui, sans-serif);
      font-size: 28px;
      font-weight: 600;
      line-height: 1.35;
      letter-spacing: -1.12px;
      color: var(--surface, #000000);
      margin-bottom: 12px;
    }

    .rule-example p {
      font-family: var(--font-body, system-ui, sans-serif);
      font-size: 16px;
      line-height: 1.55;
      color: var(--slate, #77736b);
      margin-bottom: 0;
    }

    .correct {
      border: 2px solid #078a52;
    }

    .correct::before {
      content: '✓ CORRECT';
      display: block;
      font-family: var(--font-mono, 'Space Mono', monospace);
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.5px;
      color: #078a52;
      text-transform: uppercase;
      margin-bottom: 12px;
      padding-bottom: 12px;
      border-bottom: 1px solid #078a52;
    }

    .incorrect {
      border: 2px solid #fc7981;
    }

    .incorrect::before {
      content: '✗ INCORRECT';
      display: block;
      font-family: var(--font-mono, 'Space Mono', monospace);
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.5px;
      color: #fc7981;
      text-transform: uppercase;
      margin-bottom: 12px;
      padding-bottom: 12px;
      border-bottom: 1px solid #fc7981;
    }

    .signal-demo {
      font-size: 18px;
      line-height: 1.55;
    }

    .signal-demo .drop-cap {
      font-family: var(--font-display, system-ui, sans-serif);
      font-size: 64px;
      font-weight: 600;
      color: var(--signal, #84e7a5);
      float: left;
      line-height: 0.75;
      padding-right: 8px;
      margin-top: 2px;
      letter-spacing: -2.56px;
    }

    .signal-demo em {
      color: var(--signal, #84e7a5);
      font-style: italic;
      font-weight: 600;
    }

    /* WCAG summary */
    .wcag-summary {
      margin-top: 64px;
      padding: 40px;
      background: var(--color-pure-white, #ffffff);
      border: 1px solid var(--border, #dad4c8);
      border-radius: 40px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    }

    .wcag-summary h2 {
      font-family: var(--font-display, system-ui, sans-serif);
      font-size: 48px;
      font-weight: 600;
      line-height: 1.1;
      letter-spacing: -1.92px;
      margin-bottom: 24px;
      color: var(--surface, #000000);
    }

    .wcag-summary p {
      font-family: var(--font-body, system-ui, sans-serif);
      font-size: 16px;
      line-height: 1.55;
      color: var(--slate, #77736b);
      margin-bottom: 24px;
    }

    .wcag-row {
      display: flex;
      align-items: center;
      gap: 16px;
      padding: 12px 0;
      border-bottom: 1px solid var(--border, #dad4c8);
      font-family: var(--font-body, system-ui, sans-serif);
      font-size: 16px;
    }

    .wcag-row:last-child { border-bottom: none; }

    .wcag-badge {
      display: inline-block;
      padding: 4px 12px;
      border-radius: 8px;
      font-family: var(--font-mono, 'Space Mono', monospace);
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      min-width: 80px;
      text-align: center;
    }

    .wcag-badge--pass { background: #e8f7f0; color: #078a52; }
    .wcag-badge--fail { background: #ffe8eb; color: #fc7981; }
    .wcag-badge--aa-large { background: #fff4e6; color: #d08a11; }

    /* Loading state */
    .loading {
      text-align: center;
      padding: 80px 24px;
      color: var(--slate, #77736b);
      font-family: var(--font-body, system-ui, sans-serif);
      font-size: 18px;
    }

    .loading::after {
      content: '';
      display: block;
      width: 32px;
      height: 32px;
      margin: 24px auto 0;
      border: 2px solid var(--slate, #77736b);
      border-top-color: var(--signal, #84e7a5);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    /* Responsive */
    @media (max-width: 768px) {
      .page { padding: 48px 20px; }
      .header { padding-bottom: 24px; margin-bottom: 48px; }
      .header__title { font-size: 48px; letter-spacing: -1.92px; }
      .swatch-grid { grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 16px; }
      .rule-of-one { grid-template-columns: 1fr; gap: 16px; }
      .usage-section { padding: 24px; }
    }
  </style>
</head>
<body>
  <div class="page" id="app">
    <div class="loading">Loading design tokens&hellip;</div>
  </div>

  <script>
    /* ───────────────────────────────────────────────────────────── */
    /* Contrast ratio calculation (WCAG 2.1 relative luminance)      */
    /* ───────────────────────────────────────────────────────────── */
    function hexToRgb(hex) {
      hex = hex.replace(/^#/, '');
      if (hex.length === 3) hex = hex.split('').map(c => c + c).join('');
      const n = parseInt(hex, 16);
      return [(n >> 16) & 255, (n >> 8) & 255, n & 255];
    }

    function luminance([r, g, b]) {
      const [rs, gs, bs] = [r, g, b].map(c => {
        c /= 255;
        return c <= 0.03928 ? c / 12.92 : Math.pow((c + 0.055) / 1.055, 2.4);
      });
      return 0.2126 * rs + 0.7152 * gs + 0.0722 * bs;
    }

    function contrastRatio(hex1, hex2) {
      const l1 = luminance(hexToRgb(hex1));
      const l2 = luminance(hexToRgb(hex2));
      const lighter = Math.max(l1, l2);
      const darker = Math.min(l1, l2);
      return (lighter + 0.05) / (darker + 0.05);
    }

    function wcagLevel(ratio) {
      if (ratio >= 7) return { label: 'AAA', cls: 'pass' };
      if (ratio >= 4.5) return { label: 'AA', cls: 'pass' };
      if (ratio >= 3) return { label: 'AA Large', cls: 'aa-large' };
      return { label: 'Fail', cls: 'fail' };
    }

    /* ───────────────────────────────────────────────────────────── */
    /* Core color roles and descriptions                             */
    /* ───────────────────────────────────────────────────────────── */
    const CORE_ROLES = {
      paper:   'Warm cream canvas. Artisanal paper-like surface.',
      ink:     'Pomegranate pink accent and primary text emphasis.',
      slate:   'Secondary text. Warm gray with muted personality.',
      signal:  'Matcha green. The accent for success and vitality.',
      bone:    'Subtle background tint. Cool frost for contrast areas.',
      border:  'Oat-toned structural borders. Warm, not clinical.',
      surface: 'Clay Black. Text, headings, strong statements.'
    };

    /* ───────────────────────────────────────────────────────────── */
    /* Render from tokens.json                                       */
    /* ───────────────────────────────────────────────────────────── */
    (window.__DESIGN_TOKENS__ 
      ? Promise.resolve({ ok: true, json: () => Promise.resolve(window.__DESIGN_TOKENS__) }) 
      : fetch('../tokens.json'))
      .then(r => {
        if (!r.ok) throw new Error('tokens.json not found (' + r.status + ')');
        return r.json();
      })
      .then(render)
      .catch(err => {
        document.getElementById('app').innerHTML =
          '<div class="loading" style="color:var(--signal,#84e7a5)">' +
          'Could not load tokens.json — ' + err.message + '</div>';
      });

    function render(tokens) {
      const app = document.getElementById('app');
      const title = tokens.meta?.title || 'Design System';
      const summary = tokens.meta?.summary || '';
      const rawColors = tokens.colors || {};
      const paperHex = rawColors.paper || '#faf9f7';

      /* Flatten nested color structure */
      const colors = {};
      for (const [k, v] of Object.entries(rawColors)) {
        if (typeof v === 'string') {
          colors[k] = v;
        } else if (v && typeof v === 'object') {
          for (const [sk, sv] of Object.entries(v)) {
            if (typeof sv === 'string') colors[k + '-' + sk] = sv;
          }
        }
      }

      /* Split core and extended */
      const coreKeys = Object.keys(CORE_ROLES).filter(k => colors[k]);
      const extendedKeys = Object.keys(colors)
        .filter(k => !CORE_ROLES[k] && typeof colors[k] === 'string')
        .sort((a, b) => {
          // Group by swatch family: matcha, slushie, lemon, ube, pomegranate, blueberry, etc.
          const familyA = a.split('-')[0];
          const familyB = b.split('-')[0];
          if (familyA !== familyB) return familyA.localeCompare(familyB);
          // Within family, sort by numeric suffix
          const numA = parseInt(a.split('-').pop()) || 0;
          const numB = parseInt(b.split('-').pop()) || 0;
          return numA - numB;
        });

      let html = '';

      /* ─ Stage head header ─ */
      html += '<header class="header">';
      html += '  <div class="header__kicker">Design System</div>';
      html += '  <h1 class="header__title">' + esc(title) + '</h1>';
      html += '  <p class="header__subtitle">' + esc(summary) + '</p>';
      html += '  <div class="header__meta">Color Palette &mdash; ' + (coreKeys.length + extendedKeys.length) + ' Tokens</div>';
      html += '</header>';

      /* ─ Core Palette ─ */
      if (coreKeys.length) {
        html += '<div class="section-label">Core Palette</div>';
        html += '<div class="swatch-grid">';
        coreKeys.forEach(key => {
          html += swatchCard(key, colors[key], paperHex, CORE_ROLES[key]);
        });
        html += '</div>';
      }

      /* ─ Extended Palette ─ */
      if (extendedKeys.length) {
        html += '<div class="section-label">Swatch Palette — Named Colors</div>';
        html += '<div class="swatch-grid">';
        extendedKeys.forEach(key => {
          const role = formatRole(key);
          html += swatchCard(key, colors[key], paperHex, role);
        });
        html += '</div>';
      }

      /* ─ Rule of One ─ */
      html += ruleOfOneSection(paperHex);

      /* ─ WCAG Summary ─ */
      html += wcagSummary(colors, paperHex);

      app.innerHTML = html;
    }

    /* ───────────────────────────────────────────────────────────── */
    /* Swatch card builder                                           */
    /* ───────────────────────────────────────────────────────────── */
    function swatchCard(key, hex, paperHex, role) {
      const ratio = contrastRatio(hex, paperHex);
      const level = wcagLevel(ratio);
      const lum = luminance(hexToRgb(hex));
      const chipTextColor = lum > 0.5 ? '#000000' : '#ffffff';

      return '' +
        '<div class="swatch">' +
        '  <div class="swatch__chip" style="background:' + hex + '">' +
        '    <span class="swatch__chip-contrast" style="color:' + chipTextColor + '">' + ratio.toFixed(2) + ':1</span>' +
        '  </div>' +
        '  <div class="swatch__meta">' +
        '    <div class="swatch__var">--' + esc(key) + '</div>' +
        '    <div class="swatch__hex">' + esc(hex.toUpperCase()) + '</div>' +
        '    <div class="swatch__role">' + esc(role) + '</div>' +
        '    <div class="swatch__contrast-label contrast-' + level.cls + '">' +
             'WCAG ' + level.label + '</div>' +
        '  </div>' +
        '</div>';
    }

    /* ───────────────────────────────────────────────────────────── */
    /* Rule of One usage pattern                                     */
    /* ───────────────────────────────────────────────────────────── */
    function ruleOfOneSection(paperHex) {
      let html = '<section class="usage-section">';
      html += '<h2>The Rule of One</h2>';
      html += '<p>Signal Matcha green appears in <em>exactly one element per interface</em>. Never two. Use it as a drop cap, an underlined italic word, a single button highlight, or one chart accent. This constraint forces every green accent to land with intention and joy.</p>';

      html += '<div class="rule-of-one">';

      /* Correct example */
      html += '<div class="rule-example correct">';
      html += '<h3>One Accent</h3>';
      html += '<p class="signal-demo">';
      html += '<span class="drop-cap">M</span>';
      html += 'atcha green marks a single moment of focus. This drop cap draws the eye and establishes hierarchy with playful intention.';
      html += '</p>';
      html += '</div>';

      /* Incorrect example */
      html += '<div class="rule-example incorrect">';
      html += '<h3>Multiple Signal Colors</h3>';
      html += '<p>';
      html += '<span style="color:var(--signal,#84e7a5)">This button</span> uses signal, and so does <span style="color:var(--signal,#84e7a5)">this link</span>, and here\'s another <span style="color:var(--signal,#84e7a5)">colored element</span>. Multiple signals fragment focus and dilute delight.';
      html += '</p>';
      html += '</div>';

      html += '</div>';
      html += '</section>';
      return html;
    }

    /* ───────────────────────────────────────────────────────────── */
    /* WCAG compliance summary                                       */
    /* ───────────────────────────────────────────────────────────── */
    function wcagSummary(colors, paperHex) {
      const keys = Object.keys(colors);
      let passAAA = 0, passAA = 0, passAALarge = 0, fail = 0;

      keys.forEach(k => {
        const ratio = contrastRatio(colors[k], paperHex);
        if (ratio >= 7) passAAA++;
        else if (ratio >= 4.5) passAA++;
        else if (ratio >= 3) passAALarge++;
        else fail++;
      });

      let html = '<div class="wcag-summary">';
      html += '<h2>WCAG 2.1 Compliance</h2>';
      html += '<p>Contrast ratios measured against the Warm Cream canvas (#FAF9F7). Clay prioritizes playful communication on warm, artisanal surfaces.</p>';
      html += row('AAA (7:1+)', passAAA, 'pass');
      html += row('AA (4.5:1+)', passAA, 'pass');
      html += row('AA Large Text (3:1+)', passAALarge, 'aa-large');
      html += row('Below threshold', fail, fail > 0 ? 'fail' : 'pass');
      html += '</div>';
      return html;

      function row(label, count, badge) {
        return '<div class="wcag-row">' +
               '<span class="wcag-badge wcag-badge--' + badge + '">' + count + '</span>' +
               '<span>' + label + '</span>' +
               '</div>';
      }
    }

    /* ───────────────────────────────────────────────────────────── */
    /* Utilities                                                      */
    /* ───────────────────────────────────────────────────────────── */
    function esc(s) {
      const d = document.createElement('div');
      d.textContent = String(s);
      return d.innerHTML;
    }

    function formatRole(key) {
      return key
        .replace(/([A-Z])/g, ' $1')
        .replace(/[-_]/g, ' ')
        .replace(/\b\w/g, c => c.toUpperCase())
        .trim();
    }
  </script>
</body>
</html>
