<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Type Specimen — Elegant</title>
  <link rel="stylesheet" href="../colors_and_type.css">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: var(--font-body, system-ui, sans-serif);
      background: var(--paper, #ffffff);
      color: var(--ink, #111111);
      line-height: 1.6;
    }

    .page {
      max-width: 1100px;
      margin: 0 auto;
      padding: 96px 48px;
    }

    @media (max-width: 768px) {
      .page {
        padding: 64px 32px;
      }
    }

    @media (max-width: 480px) {
      .page {
        padding: 48px 24px;
      }
    }

    /* Header */
    .header {
      margin-bottom: 96px;
    }

    .header__kicker {
      font-family: var(--font-mono, ui-monospace, monospace);
      font-size: 12px;
      font-weight: 500;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--slate, #666666);
      margin-bottom: 16px;
    }

    .header__title {
      font-family: var(--font-display, system-ui, sans-serif);
      font-size: 96px;
      font-weight: 300;
      line-height: 0.95;
      letter-spacing: -0.015em;
      color: var(--ink, #111111);
      margin-bottom: 24px;
    }

    .header__subtitle {
      font-family: var(--font-body, system-ui, sans-serif);
      font-size: 20px;
      font-weight: 300;
      line-height: 1.6;
      color: var(--slate, #666666);
      max-width: 680px;
      margin-bottom: 32px;
    }

    .header__rule {
      display: block;
      width: 80px;
      height: 1px;
      background: var(--ink, #111111);
      border: none;
      margin: 0;
    }

    /* Font families section */
    .font-families {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      gap: 24px;
      margin-bottom: 96px;
      margin-top: 64px;
    }

    .font-card {
      background: transparent;
      border: 1px solid var(--border, #e5e5e5);
      border-radius: var(--radius-md, 8px);
      padding: 32px;
    }

    .font-card__label {
      font-family: var(--font-mono, ui-monospace, monospace);
      font-size: 11px;
      font-weight: 500;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--slate, #666666);
      margin-bottom: 12px;
    }

    .font-card__name {
      font-family: var(--font-display, system-ui, sans-serif);
      font-size: 32px;
      font-weight: 400;
      line-height: 1.1;
      color: var(--ink, #111111);
      margin-bottom: 8px;
    }

    .font-card__fallback {
      font-family: var(--font-mono, ui-monospace, monospace);
      font-size: 11px;
      color: var(--slate, #666666);
      word-break: break-word;
      line-height: 1.4;
    }

    /* Character set block */
    .charmap-block {
      background: transparent;
      border: 1px solid var(--border, #e5e5e5);
      border-radius: var(--radius-md, 8px);
      padding: 48px;
      margin-bottom: 96px;
    }

    .charmap-block__label {
      font-family: var(--font-mono, ui-monospace, monospace);
      font-size: 11px;
      font-weight: 500;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--slate, #666666);
      margin-bottom: 24px;
    }

    .charmap-block__chars {
      font-family: var(--font-display, system-ui, sans-serif);
      font-size: 28px;
      font-weight: 400;
      line-height: 1.8;
      letter-spacing: 0.01em;
      color: var(--ink, #111111);
      word-break: break-word;
    }

    /* Section label */
    .section-label {
      font-family: var(--font-mono, ui-monospace, monospace);
      font-size: 11px;
      font-weight: 500;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--slate, #666666);
      margin-bottom: 32px;
      padding-bottom: 16px;
      border-bottom: 1px solid var(--border, #e5e5e5);
    }

    /* Ramp row */
    .ramp-row {
      display: grid;
      grid-template-columns: 240px 1fr;
      gap: 48px;
      align-items: baseline;
      padding: 32px 0;
      border-bottom: 1px solid var(--border, #e5e5e5);
    }

    .ramp-row:last-child {
      border-bottom: none;
    }

    @media (max-width: 800px) {
      .ramp-row {
        grid-template-columns: 1fr;
        gap: 16px;
      }
    }

    /* Left meta column */
    .ramp-meta__role {
      font-family: var(--font-display, system-ui, sans-serif);
      font-size: 16px;
      font-weight: 500;
      color: var(--ink, #111111);
      margin-bottom: 8px;
    }

    .ramp-meta__detail {
      font-family: var(--font-mono, ui-monospace, monospace);
      font-size: 10px;
      font-weight: 400;
      line-height: 1.8;
      color: var(--slate, #666666);
      letter-spacing: 0.01em;
    }

    /* Right sample column */
    .ramp-sample {
      color: var(--ink, #111111);
      overflow-wrap: break-word;
      word-spacing: 0.1em;
    }

    /* Ramp section */
    .ramp-section {
      margin-bottom: 96px;
    }

    /* Drop cap demo */
    .dropcap-demo {
      margin-bottom: 96px;
    }

    .dropcap-demo__label {
      font-family: var(--font-mono, ui-monospace, monospace);
      font-size: 11px;
      font-weight: 500;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--slate, #666666);
      margin-bottom: 32px;
      padding-bottom: 16px;
      border-bottom: 1px solid var(--border, #e5e5e5);
    }

    .dropcap-container {
      background: transparent;
      border: 1px solid var(--border, #e5e5e5);
      border-radius: var(--radius-md, 8px);
      padding: 48px;
      max-width: 680px;
    }

    .dropcap-para {
      font-family: var(--font-body, system-ui, sans-serif);
      font-size: 18px;
      font-weight: 400;
      line-height: 1.7;
      color: var(--ink, #111111);
      margin: 0;
      text-align: left;
    }

    .dropcap {
      float: left;
      font-family: var(--font-display, system-ui, sans-serif);
      font-size: 96px;
      font-weight: 300;
      line-height: 0.85;
      color: var(--signal, #3b82f6);
      margin-right: 6px;
      margin-top: -4px;
    }

    /* Loading */
    .loading {
      text-align: center;
      padding: 160px 48px;
      color: var(--slate, #666666);
      font-family: var(--font-body, system-ui, sans-serif);
      font-size: 16px;
    }

    .loading::after {
      content: '';
      display: block;
      width: 32px;
      height: 32px;
      margin: 24px auto 0;
      border: 2px solid var(--border, #e5e5e5);
      border-top-color: var(--signal, #3b82f6);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div class="page" id="app">
    <div class="loading">Loading design tokens&hellip;</div>
  </div>

  <script>
    const EDITORIAL_SAMPLES = [
      'Graceful typography sets the tone for refined interfaces.',
      'Delicate details convey sophistication without excess.',
      'Minimal palettes create breathing room in every layout.',
      'Clarity emerges from constraint, not complexity.',
      'Every character deserves careful consideration.',
      'Whitespace is structure, not emptiness.',
      'Professional design whispers rather than shouts.',
      'Elegance lives in the negative space between elements.',
      'System consistency builds trust through repetition.',
      'Restraint is the hallmark of true refinement.',
    ];

    const DROPCAP_TEXT = 'Elegant design emerges from a marriage of intention and restraint. In professional contexts, typography must carry authority without arrogance, clarity without coldness. The Elegant system honors this principle through carefully calibrated weights, generous spacing, and a palette that prioritizes legibility above decoration. Google Sans provides a contemporary voice that feels approachable yet authoritative. Anonymous Pro enforces consistency in technical and interface contexts. The scale from fourteen to forty points accommodates everything from footnotes to dramatic headlines. Weights from one hundred to six hundred permit subtle emphasis without visual chaos. This is not minimalism for its own sake, but rather the result of disciplined choice-making. Every color exists in service of readability. Every spacing decision improves navigation. Every corner radius—whether sharp or rounded—serves a functional purpose. The result is a system that feels both controlled and generous, professional yet human. Sophisticated design is invisible in its success but impossible to ignore in its impact.';

    fetch('../tokens.json')
      .then(r => {
        if (!r.ok) throw new Error('tokens.json not found (' + r.status + ')');
        return r.json();
      })
      .then(render)
      .catch(err => {
        document.getElementById('app').innerHTML =
          '<div class="loading" style="color:#3b82f6">' +
          'Could not load tokens.json — ' + err.message + '</div>';
      });

    function render(tokens) {
      const app = document.getElementById('app');
      const title = tokens.meta?.title || 'Design System';
      const summary = tokens.meta?.summary || '';

      const ramp = buildRamp(tokens.typography);

      let html = '';

      /* Header */
      html += '<header class="header">';
      html += '  <div class="header__kicker">Type Specimen</div>';
      html += '  <h1 class="header__title">' + esc(title) + '</h1>';
      html += '  <p class="header__subtitle">' + esc(summary) + '</p>';
      html += '  <hr class="header__rule">';
      html += '</header>';

      /* Font families */
      const families = [
        { label: 'Display', name: 'Google Sans', fallback: 'system-ui, sans-serif', note: 'Headlines & UI' },
        { label: 'Body', name: 'Google Sans', fallback: 'system-ui, sans-serif', note: 'Reading & body text' },
        { label: 'Monospace', name: 'Anonymous Pro', fallback: 'ui-monospace, monospace', note: 'Code & metadata' }
      ];

      html += '<div class="font-families">';
      families.forEach(f => {
        html += '<div class="font-card">';
        html += '  <div class="font-card__label">' + esc(f.label) + '</div>';
        html += '  <div class="font-card__name">' + esc(f.name) + '</div>';
        html += '  <div class="font-card__fallback">' + esc(f.fallback) + '</div>';
        html += '</div>';
      });
      html += '</div>';

      /* Character set */
      html += '<div class="charmap-block">';
      html += '  <div class="charmap-block__label">Character Set · Google Sans Display</div>';
      html += '  <div class="charmap-block__chars" style="font-family:system-ui,sans-serif">';
      html += '    AaBbCcDdEeFfGgHhIiJjKkLlMmNnOoPpQqRrSsTtUuVvWwXxYyZz<br>';
      html += '    0123456789 !@#$%&amp;*()&ndash;&mdash;&lsquo;&rsquo;&ldquo;&rdquo;';
      html += '  </div>';
      html += '</div>';

      /* Type ramp */
      if (ramp.length) {
        html += '<div class="ramp-section">';
        html += '<div class="section-label">Type Ramp</div>';
        ramp.forEach((entry, i) => {
          html += rampRow(entry, i);
        });
        html += '</div>';
      }

      /* Drop cap demo */
      html += '<div class="dropcap-demo">';
      html += '<div class="dropcap-demo__label">Drop Cap — Five-Line Google Sans, Signal Blue</div>';
      html += '<div class="dropcap-container">';
      const firstChar = DROPCAP_TEXT.charAt(0);
      const restText = DROPCAP_TEXT.substring(1);
      html += '<p class="dropcap-para">';
      html += '<span class="dropcap">' + esc(firstChar) + '</span>';
      html += esc(restText);
      html += '</p>';
      html += '</div>';
      html += '</div>';

      app.innerHTML = html;
    }

    function buildRamp(typographyToken) {
      const scale = [14, 16, 18, 24, 32, 40];
      const weights = [300, 400, 500, 600];
      
      const entries = [];
      
      /* H1 - Display */
      entries.push({
        role: 'H1 · Display',
        size: '40px',
        weight: 300,
        lineHeight: '1.1',
        letterSpacing: '-0.015em',
        fontKey: 'display'
      });

      /* H2 - Display */
      entries.push({
        role: 'H2 · Display',
        size: '32px',
        weight: 400,
        lineHeight: '1.2',
        letterSpacing: '-0.01em',
        fontKey: 'display'
      });

      /* H3 - Display */
      entries.push({
        role: 'H3 · Display',
        size: '24px',
        weight: 500,
        lineHeight: '1.3',
        letterSpacing: '0',
        fontKey: 'display'
      });

      /* Body Large */
      entries.push({
        role: 'Body Large',
        size: '18px',
        weight: 400,
        lineHeight: '1.6',
        letterSpacing: '0',
        fontKey: 'body'
      });

      /* Body Regular */
      entries.push({
        role: 'Body Regular',
        size: '16px',
        weight: 400,
        lineHeight: '1.6',
        letterSpacing: '0',
        fontKey: 'body'
      });

      /* Body Small */
      entries.push({
        role: 'Body Small',
        size: '14px',
        weight: 400,
        lineHeight: '1.5',
        letterSpacing: '0',
        fontKey: 'body'
      });

      /* Caption */
      entries.push({
        role: 'Caption',
        size: '12px',
        weight: 500,
        lineHeight: '1.4',
        letterSpacing: '0.05em',
        fontKey: 'mono'
      });

      return entries;
    }

    function rampRow(entry, idx) {
      const role = entry.role || 'Role ' + (idx + 1);
      const size = entry.size || '16px';
      const weight = entry.weight || 400;
      const lh = entry.lineHeight || '1.5';
      const ls = entry.letterSpacing || '0';

      let fontFamily = 'var(--font-body)';
      if (entry.fontKey === 'display') fontFamily = 'var(--font-display)';
      else if (entry.fontKey === 'mono') fontFamily = 'var(--font-mono)';

      const sizeNum = parseFloat(size);
      const sampleIdx = idx % EDITORIAL_SAMPLES.length;
      let sample = EDITORIAL_SAMPLES[sampleIdx];

      /* Truncate very large samples */
      if (sizeNum >= 32) {
        sample = sample.split('.')[0].slice(0, 45);
        if (!sample.endsWith('.')) sample += '.';
      }

      let fontStyle = 'font-size:' + size + ';font-weight:' + weight + ';line-height:' + lh + ';';
      fontStyle += 'font-family:' + fontFamily + ';';
      if (ls && ls !== '0' && ls !== 'normal') fontStyle += 'letter-spacing:' + ls + ';';

      let meta = esc(size) + ' / ' + esc(String(weight));
      meta += '\n' + fontFamilyLabel(entry.fontKey);
      meta += '\nline-height: ' + esc(String(lh));
      if (ls && ls !== '0' && ls !== 'normal') meta += '\nletter-spacing: ' + esc(ls);

      return '' +
        '<div class="ramp-row">' +
        '  <div class="ramp-meta">' +
        '    <div class="ramp-meta__role">' + esc(role) + '</div>' +
        '    <pre class="ramp-meta__detail">' + meta + '</pre>' +
        '  </div>' +
        '  <div class="ramp-sample" style="' + fontStyle + '">' + esc(sample) + '</div>' +
        '</div>';
    }

    function fontFamilyLabel(key) {
      const map = {
        'display': 'Google Sans',
        'body': 'Google Sans',
        'mono': 'Anonymous Pro'
      };
      return map[key] || 'Unknown';
    }

    function esc(s) {
      const d = document.createElement('div');
      d.textContent = String(s);
      return d.innerHTML;
    }
  </script>
</body>
</html>
