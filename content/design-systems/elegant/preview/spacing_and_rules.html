<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Spacing &amp; Rules — Elegant</title>
  <link rel="stylesheet" href="../colors_and_type.css">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: var(--font-body, system-ui, sans-serif);
      background: var(--paper, #ffffff);
      color: var(--ink, #111111);
      line-height: 1.6;
    }

    .page {
      max-width: 1100px;
      margin: 0 auto;
      padding: 96px 64px;
    }

    /* Header / Stage head */
    .header {
      margin-bottom: 96px;
      position: relative;
    }

    .header__kicker {
      font-family: var(--font-mono, ui-monospace, monospace);
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--slate, #666666);
      margin-bottom: 12px;
    }

    .header__title {
      font-family: var(--font-display, system-ui, sans-serif);
      font-size: 64px;
      font-weight: 300;
      line-height: 1.1;
      letter-spacing: -0.01em;
      color: var(--ink, #111111);
      margin-bottom: 16px;
      max-width: 85%;
    }

    .header__subtitle {
      font-family: var(--font-body, system-ui, sans-serif);
      font-size: 18px;
      font-weight: 400;
      line-height: 1.6;
      color: var(--slate, #666666);
      max-width: 75%;
      margin-bottom: 32px;
    }

    .header__rule {
      display: block;
      width: 80px;
      height: 2px;
      background: var(--signal, #3b82f6);
      border: none;
      margin-top: 24px;
    }

    /* Section */
    .section {
      margin-bottom: 96px;
    }

    .section__label {
      font-family: var(--font-mono, ui-monospace, monospace);
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--slate, #666666);
      margin-bottom: 48px;
      padding-bottom: 12px;
      border-bottom: 1px solid var(--border, #e5e5e5);
    }

    /* Spacing scale */
    .spacing-row {
      display: grid;
      grid-template-columns: 100px 1fr 80px;
      gap: 32px;
      align-items: center;
      padding: 20px 0;
      border-bottom: 1px solid var(--border, #e5e5e5);
    }

    .spacing-row:last-child {
      border-bottom: none;
    }

    .spacing-row__name {
      font-family: var(--font-mono, ui-monospace, monospace);
      font-size: 13px;
      font-weight: 600;
      color: var(--ink, #111111);
      letter-spacing: 0.01em;
    }

    .spacing-row__label {
      font-family: var(--font-body, system-ui, sans-serif);
      font-size: 12px;
      color: var(--slate, #666666);
      margin-top: 4px;
      font-weight: 400;
    }

    .spacing-row__bar-wrap {
      height: 32px;
      display: flex;
      align-items: center;
    }

    .spacing-row__bar {
      height: 2px;
      background: var(--signal, #3b82f6);
      min-width: 2px;
      transition: opacity 0.2s ease;
      border-radius: var(--radius-sm, 4px);
    }

    .spacing-row:hover .spacing-row__bar {
      opacity: 0.7;
    }

    .spacing-row__value {
      font-family: var(--font-mono, ui-monospace, monospace);
      font-size: 13px;
      font-weight: 600;
      color: var(--ink, #111111);
      text-align: right;
      letter-spacing: 0.01em;
    }

    /* Depth / Rule weights */
    .depth-demo {
      padding: 32px 0;
      border-bottom: 1px solid var(--border, #e5e5e5);
    }

    .depth-demo:last-child {
      border-bottom: none;
    }

    .depth-demo__header {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      margin-bottom: 20px;
    }

    .depth-demo__name {
      font-family: var(--font-mono, ui-monospace, monospace);
      font-size: 13px;
      font-weight: 600;
      color: var(--ink, #111111);
      letter-spacing: 0.01em;
    }

    .depth-demo__label {
      font-family: var(--font-body, system-ui, sans-serif);
      font-size: 12px;
      color: var(--slate, #666666);
      font-weight: 400;
    }

    .depth-demo__spec {
      font-family: var(--font-mono, ui-monospace, monospace);
      font-size: 12px;
      color: var(--slate, #666666);
      font-weight: 400;
    }

    .depth-demo__container {
      width: 100%;
      min-height: 60px;
      display: flex;
      align-items: center;
      padding: 20px;
      background: var(--bone, #f5f5f5);
      border-radius: var(--radius-md, 8px);
      position: relative;
    }

    .depth-demo__box {
      width: 100%;
      height: 40px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--paper, #ffffff);
      border-radius: var(--radius-sm, 4px);
      font-family: var(--font-mono, ui-monospace, monospace);
      font-size: 12px;
      color: var(--slate, #666666);
      font-weight: 400;
    }

    /* Border radius */
    .radius-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 64px;
      margin-bottom: 48px;
    }

    .radius-item {
      display: grid;
      grid-template-columns: 140px 1fr;
      gap: 32px;
      align-items: center;
    }

    .radius-item__demo {
      display: flex;
      gap: 16px;
      align-items: center;
      justify-content: center;
    }

    .radius-item__box {
      width: 100px;
      height: 100px;
      background: var(--bone, #f5f5f5);
      border: 1px solid var(--border, #e5e5e5);
      flex-shrink: 0;
    }

    .radius-item__info {
      flex: 1;
    }

    .radius-item__name {
      font-family: var(--font-mono, ui-monospace, monospace);
      font-size: 13px;
      font-weight: 600;
      color: var(--ink, #111111);
      margin-bottom: 4px;
      letter-spacing: 0.01em;
    }

    .radius-item__value {
      font-family: var(--font-mono, ui-monospace, monospace);
      font-size: 12px;
      color: var(--slate, #666666);
      margin-bottom: 12px;
      font-weight: 400;
    }

    .radius-item__description {
      font-family: var(--font-body, system-ui, sans-serif);
      font-size: 13px;
      line-height: 1.6;
      color: var(--slate, #666666);
      font-weight: 400;
    }

    /* Philosophy block */
    .philosophy {
      background: var(--bone, #f5f5f5);
      padding: 48px;
      border: 1px solid var(--border, #e5e5e5);
      border-radius: var(--radius-md, 8px);
      margin-bottom: 64px;
    }

    .philosophy__title {
      font-family: var(--font-mono, ui-monospace, monospace);
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--slate, #666666);
      margin-bottom: 16px;
    }

    .philosophy__text {
      font-family: var(--font-body, system-ui, sans-serif);
      font-size: 16px;
      line-height: 1.7;
      color: var(--ink, #111111);
      font-weight: 400;
    }

    .philosophy__text strong {
      font-weight: 600;
      color: var(--ink, #111111);
    }

    .philosophy__text em {
      font-style: italic;
      color: var(--slate, #666666);
    }

    .philosophy__text code {
      font-family: var(--font-mono, ui-monospace, monospace);
      background: rgba(59, 130, 246, 0.08);
      color: var(--signal, #3b82f6);
      padding: 2px 6px;
      border-radius: var(--radius-sm, 4px);
      font-size: 0.92em;
    }

    /* Loading */
    .loading {
      text-align: center;
      padding: 80px 24px;
      color: var(--slate, #666666);
      font-size: 16px;
    }

    .loading::after {
      content: '';
      display: block;
      width: 32px;
      height: 32px;
      margin: 16px auto 0;
      border: 2px solid rgba(59, 130, 246, 0.2);
      border-top-color: var(--signal, #3b82f6);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    @media (max-width: 900px) {
      .page {
        padding: 64px 32px;
      }

      .header {
        margin-bottom: 64px;
      }

      .header__title {
        font-size: 48px;
      }

      .header__subtitle {
        max-width: 100%;
      }

      .section {
        margin-bottom: 64px;
      }

      .spacing-row {
        grid-template-columns: 90px 1fr 70px;
        gap: 20px;
      }

      .radius-grid {
        grid-template-columns: 1fr;
        gap: 32px;
      }

      .radius-item {
        grid-template-columns: 120px 1fr;
      }
    }
  </style>
</head>
<body>
  <div class="page" id="app">
    <div class="loading">Loading design tokens…</div>
  </div>

  <script>
    const DEFAULT_SPACING = {
      's-1': { value: '4px', label: 'xs' },
      's-2': { value: '8px', label: 'sm' },
      's-3': { value: '16px', label: 'md' },
      's-4': { value: '24px', label: 'lg' },
      's-5': { value: '32px', label: 'xl' },
      's-6': { value: '48px', label: '2xl' },
      's-7': { value: '64px', label: '3xl' },
      's-8': { value: '96px', label: '4xl' }
    };

    const DEFAULT_DEPTH = [
      { level: 0, name: 'Flat', treatment: 'none', use: 'Default canvas' },
      { level: 1, name: 'Border', treatment: '1px solid var(--border)', use: 'Card edges, separators' },
      { level: 2, name: 'Elevated', treatment: '0 2px 8px rgba(0,0,0,0.08)', use: 'Modals, dropdowns, popovers' }
    ];

    const DEFAULT_RADIUS = {
      'none': { value: '0', use: 'Base containers, full-width edges' },
      'sm': { value: '4px', use: 'Form inputs, small badges' },
      'md': { value: '8px', use: 'Buttons, cards, standard components' },
      'lg': { value: '16px', use: 'Large cards, emphasis blocks' },
      'full': { value: '999px', use: 'Pills, avatars' }
    };

    ( window.__DESIGN_TOKENS__ ? Promise.resolve({ ok: true, json: () => Promise.resolve(window.__DESIGN_TOKENS__) }) : fetch('../tokens.json') )
      .then(r => {
        if (!r.ok) throw new Error('tokens.json not found (' + r.status + ')');
        return r.json();
      })
      .then(render)
      .catch(err => {
        document.getElementById('app').innerHTML =
          '<div class="loading" style="color:#dc2626">' +
          'Could not load tokens.json — ' + err.message + '</div>';
      });

    function render(tokens) {
      const app = document.getElementById('app');
      
      const spacing = {};
      if (tokens.spacing?.scale) {
        Object.entries(tokens.spacing.scale).forEach(([k, v]) => {
          spacing[k] = { value: v, label: k };
        });
      } else {
        Object.assign(spacing, DEFAULT_SPACING);
      }

      const depth = tokens.depth || DEFAULT_DEPTH;
      const radius = tokens.radii ? Object.entries(tokens.radii).map(([k, v]) => ({ key: k, value: v, use: DEFAULT_RADIUS[k]?.use || '' })) : Object.entries(DEFAULT_RADIUS).map(([k, v]) => ({ key: k, ...v }));

      let html = '';

      /* Header / Stage head */
      html += '<header class="header">';
      html += '  <div class="header__kicker">Spacing &amp; Rules</div>';
      html += '  <h1 class="header__title">Precise spacing, refined depth.</h1>';
      html += '  <p class="header__subtitle">The spacing and depth system for Elegant — an 8px modular scale with subtle elevation through borders and shadows, designed for sophisticated, minimal interfaces.</p>';
      html += '  <hr class="header__rule">';
      html += '</header>';

      /* Philosophy block */
      html += '<div class="philosophy">';
      html += '  <div class="philosophy__title">Spacing Philosophy</div>';
      html += '  <div class="philosophy__text">';
      html += '    Elegant uses a <strong>base 8px modular scale</strong> that grows predictably: 4, 8, 16, 24, 32, 48, 64, 96px. Every spacing decision flows from this sequence, ensuring <em>harmony and consistency</em> across all layouts. Space is not padding—it is <strong>breathing room</strong>. Content blocks are separated by space before borders. Whitespace defines structure more than lines do. All padding and margins use multiples of 8 to create perfect grid alignment.';
      html += '  </div>';
      html += '</div>';

      /* Spacing scale */
      html += '<div class="section">';
      html += '  <div class="section__label">Spacing Scale</div>';

      const spacingEntries = Object.entries(spacing);
      const maxPx = Math.max(...spacingEntries.map(([, o]) => parseFloat(o.value) || 0), 1);

      spacingEntries.forEach(([key, obj]) => {
        const px = parseFloat(obj.value) || 0;
        const pct = Math.max((px / maxPx) * 100, 3);
        const label = obj.label || key;
        
        html += '<div class="spacing-row">';
        html += '  <div>';
        html += '    <div class="spacing-row__name">' + esc(key) + '</div>';
        html += '    <div class="spacing-row__label">' + esc(label) + '</div>';
        html += '  </div>';
        html += '  <div class="spacing-row__bar-wrap">';
        html += '    <div class="spacing-row__bar" style="width:' + pct + '%"></div>';
        html += '  </div>';
        html += '  <div class="spacing-row__value">' + esc(obj.value) + '</div>';
        html += '</div>';
      });

      html += '</div>';

      /* Depth / Elevation */
      html += '<div class="section">';
      html += '  <div class="section__label">Depth &amp; Elevation</div>';

      depth.forEach((d) => {
        const treatment = d.treatment || 'none';
        const name = d.name || 'Level ' + d.level;
        const use = d.use || '';
        
        html += '<div class="depth-demo">';
        html += '  <div class="depth-demo__header">';
        html += '    <div>';
        html += '      <div class="depth-demo__name">' + esc(name) + '</div>';
        html += '      <div class="depth-demo__label">' + esc(use) + '</div>';
        html += '    </div>';
        html += '    <div class="depth-demo__spec">' + esc(treatment === 'none' ? 'None' : treatment) + '</div>';
        html += '  </div>';
        
        html += '  <div class="depth-demo__container">';
        html += '    <div class="depth-demo__box" style="' + getDepthStyle(treatment) + '">';
        html += '      Depth Level ' + d.level;
        html += '    </div>';
        html += '  </div>';
        html += '</div>';
      });

      html += '</div>';

      /* Border radius */
      html += '<div class="section">';
      html += '  <div class="section__label">Border Radius</div>';
      html += '  <div class="radius-grid">';

      radius.forEach((r) => {
        const radiusValue = r.value || r.key;
        const key = r.key || 'unknown';
        const use = r.use || '';

        html += '<div class="radius-item">';
        html += '  <div class="radius-item__demo">';
        html += '    <div class="radius-item__box" style="border-radius: ' + esc(radiusValue) + '"></div>';
        html += '  </div>';
        html += '  <div class="radius-item__info">';
        html += '    <div class="radius-item__name">--radius-' + esc(key) + '</div>';
        html += '    <div class="radius-item__value">' + esc(radiusValue) + '</div>';
        html += '    <div class="radius-item__description">' + esc(use) + '</div>';
        html += '  </div>';
        html += '</div>';
      });

      html += '  </div>';
      html += '</div>';

      /* Component Spacing block */
      html += '<div class="philosophy" style="margin-top: 96px; margin-bottom: 0;">';
      html += '  <div class="philosophy__title">Component Spacing Guidelines</div>';
      html += '  <div class="philosophy__text">';
      html += '    <strong>Buttons:</strong> 10px vertical, 20px horizontal (from --button-py and --button-px). <strong>Cards:</strong> Use 24px (--s-4) padding internally, 8px border-radius, 1px border with --border color. <strong>Forms:</strong> 16px (--s-3) between label and input, 8px between input and error text. <strong>Sections:</strong> 48–96px (--s-6 to --s-8) vertical spacing between major blocks. <strong>Lists:</strong> 12px between items using quiet borders, or 16px with spacing alone. Every interaction state inherits the depth treatment: flat borders, elevated shadows.';
      html += '  </div>';
      html += '</div>';

      app.innerHTML = html;
    }

    function getDepthStyle(treatment) {
      if (treatment === 'none') {
        return 'border: 1px dashed var(--border); background: var(--paper);';
      } else if (treatment.includes('solid')) {
        return 'border: ' + treatment + '; background: var(--paper);';
      } else if (treatment.includes('rgba')) {
        return 'box-shadow: ' + treatment + '; background: var(--paper); border: none;';
      }
      return 'background: var(--paper);';
    }

    function esc(s) {
      const d = document.createElement('div');
      d.textContent = String(s);
      return d.innerHTML;
    }
  </script>
</body>
</html>
