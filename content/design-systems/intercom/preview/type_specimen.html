<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Type Specimen — Intercom</title>
  <link rel="stylesheet" href="../colors_and_type.css">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: var(--font-body, 'MediumLL', system-ui, sans-serif);
      background: var(--bone, #faf9f6);
      color: var(--ink, #111111);
      line-height: 1.5;
    }

    .page {
      max-width: 1100px;
      margin: 0 auto;
      padding: 96px 48px;
    }

    @media (max-width: 768px) {
      .page {
        padding: 64px 32px;
      }
    }

    @media (max-width: 480px) {
      .page {
        padding: 48px 24px;
      }
    }

    /* Header */
    .header {
      margin-bottom: 96px;
    }

    .header__kicker {
      font-family: var(--font-mono, 'SaansMono', monospace);
      font-size: 12px;
      font-weight: 500;
      letter-spacing: 0.6px;
      text-transform: uppercase;
      color: var(--slate, #7b7b78);
      margin-bottom: 16px;
    }

    .header__title {
      font-family: var(--font-body, 'MediumLL', system-ui, sans-serif);
      font-size: 80px;
      font-weight: 400;
      line-height: 1.00;
      letter-spacing: -2.4px;
      color: var(--ink, #111111);
      margin-bottom: 24px;
    }

    .header__subtitle {
      font-family: var(--font-body, 'MediumLL', system-ui, sans-serif);
      font-size: 20px;
      font-weight: 400;
      line-height: 1.50;
      color: var(--slate, #7b7b78);
      max-width: 680px;
      margin-bottom: 32px;
    }

    .header__rule {
      display: block;
      width: 96px;
      height: 1px;
      background: var(--ink, #111111);
      border: none;
      margin: 0;
    }

    /* Font families section */
    .font-families {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 32px;
      margin-bottom: 96px;
      margin-top: 64px;
    }

    .font-card {
      background: transparent;
      border: 1px solid var(--border, #dedbd6);
      border-radius: 10px;
      padding: 32px;
    }

    .font-card__label {
      font-family: var(--font-mono, 'SaansMono', monospace);
      font-size: 12px;
      font-weight: 500;
      letter-spacing: 0.6px;
      text-transform: uppercase;
      color: var(--slate, #7b7b78);
      margin-bottom: 12px;
    }

    .font-card__name {
      font-family: var(--font-body, 'MediumLL', system-ui, sans-serif);
      font-size: 36px;
      font-weight: 400;
      line-height: 1.00;
      letter-spacing: -0.86px;
      color: var(--ink, #111111);
      margin-bottom: 8px;
    }

    .font-card__fallback {
      font-family: var(--font-mono, 'SaansMono', monospace);
      font-size: 12px;
      color: var(--slate, #7b7b78);
      word-break: break-word;
      letter-spacing: 0.6px;
    }

    /* Character set block */
    .charmap-block {
      background: transparent;
      border: 1px solid var(--border, #dedbd6);
      border-radius: 10px;
      padding: 48px;
      margin-bottom: 96px;
    }

    .charmap-block__label {
      font-family: var(--font-mono, 'SaansMono', monospace);
      font-size: 12px;
      font-weight: 500;
      letter-spacing: 0.6px;
      text-transform: uppercase;
      color: var(--slate, #7b7b78);
      margin-bottom: 24px;
    }

    .charmap-block__chars {
      font-family: 'MediumLL', system-ui, sans-serif;
      font-size: 32px;
      font-weight: 400;
      line-height: 1.80;
      letter-spacing: -0.96px;
      color: var(--ink, #111111);
      word-break: break-word;
    }

    /* Section label */
    .section-label {
      font-family: var(--font-mono, 'SaansMono', monospace);
      font-size: 12px;
      font-weight: 500;
      letter-spacing: 0.6px;
      text-transform: uppercase;
      color: var(--slate, #7b7b78);
      margin-bottom: 32px;
      padding-bottom: 16px;
      border-bottom: 1px solid var(--ink, #111111);
    }

    /* Ramp row */
    .ramp-row {
      display: grid;
      grid-template-columns: 280px 1fr;
      gap: 48px;
      align-items: baseline;
      padding: 32px 0;
      border-bottom: 1px solid var(--border, #dedbd6);
    }

    .ramp-row:last-child {
      border-bottom: none;
    }

    @media (max-width: 800px) {
      .ramp-row {
        grid-template-columns: 1fr;
        gap: 16px;
      }
    }

    /* Left meta column */
    .ramp-meta__role {
      font-family: var(--font-body, 'MediumLL', system-ui, sans-serif);
      font-size: 18px;
      font-weight: 400;
      color: var(--ink, #111111);
      margin-bottom: 8px;
      line-height: 1.00;
    }

    .ramp-meta__detail {
      font-family: var(--font-mono, 'SaansMono', monospace);
      font-size: 11px;
      font-weight: 400;
      line-height: 1.80;
      color: var(--slate, #7b7b78);
      letter-spacing: 0.6px;
    }

    /* Right sample column */
    .ramp-sample {
      color: var(--ink, #111111);
      overflow-wrap: break-word;
      word-spacing: 0.05em;
    }

    /* Ramp section */
    .ramp-section {
      margin-bottom: 96px;
    }

    /* Drop cap demo */
    .dropcap-demo {
      margin-bottom: 96px;
    }

    .dropcap-demo__label {
      font-family: var(--font-mono, 'SaansMono', monospace);
      font-size: 12px;
      font-weight: 500;
      letter-spacing: 0.6px;
      text-transform: uppercase;
      color: var(--slate, #7b7b78);
      margin-bottom: 32px;
      padding-bottom: 16px;
      border-bottom: 1px solid var(--ink, #111111);
    }

    .dropcap-container {
      background: transparent;
      border: 1px solid var(--border, #dedbd6);
      border-radius: 10px;
      padding: 48px;
      max-width: 680px;
    }

    .dropcap-para {
      font-family: var(--font-body, 'MediumLL', system-ui, sans-serif);
      font-size: 20px;
      font-weight: 400;
      line-height: 1.60;
      color: var(--ink, #111111);
      margin: 0;
      text-align: left;
    }

    .dropcap {
      float: left;
      font-family: var(--font-body, 'MediumLL', system-ui, sans-serif);
      font-size: 120px;
      font-weight: 400;
      line-height: 0.85;
      color: var(--signal, #ff5600);
      margin-right: 8px;
      margin-top: -8px;
      letter-spacing: -2.4px;
    }

    /* Loading */
    .loading {
      text-align: center;
      padding: 160px 48px;
      color: var(--slate, #7b7b78);
      font-family: var(--font-body, 'MediumLL', system-ui, sans-serif);
      font-size: 18px;
    }

    .loading::after {
      content: '';
      display: block;
      width: 32px;
      height: 32px;
      margin: 24px auto 0;
      border: 2px solid var(--border, #dedbd6);
      border-top-color: var(--signal, #ff5600);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div class="page" id="app">
    <div class="loading">Loading design tokens&hellip;</div>
  </div>

  <script>
    const EDITORIAL_SAMPLES = [
      'Customer messaging platform that speaks the language of helpdesk.',
      'Fin Orange signals every interaction with purpose and precision.',
      'Negative letter-spacing compresses headlines into engineered shapes.',
      'Five fonts in one ecosystem: Saans, Serrif, SaansMono, MediumLL, LLMedium.',
      'Warm canvas meets sharp geometry—industrial precision with human warmth.',
      'Ultra-tight line height at one-point-zero for display impact.',
      'Scale 1.1 on hover transforms buttons into physical growing elements.',
      'Every label uppercase in monospace—metadata discipline across the system.',
      'SaansMono enforces precision in code blocks and technical documentation.',
      'Oat-toned borders create sophisticated depth without shadow complexity.',
    ];

    const DROPCAP_TEXT = 'Intercom is built on a principle of customer messaging precision. The typography system manifests that precision through extreme negative letter-spacing at display scales, creating headlines that feel engineered and inevitable. Saans at 80px with -2.4px tracking compresses four or five words into compact, bold statements. Serrif provides warmth in editorial moments, where human voice matters more than geometric purity. SaansMono, uppercase and widely tracked, enforces metadata discipline—every label, every kicker, every footnote becomes a structured data element. The color palette is deliberately restrained: warm bone background, deep black text, a single signal orange for interactive moments. Report colors—blue, green, red, pink, lime—appear only in data visualization, never in chrome. Button interaction uses scale-based physics: 1.1x on hover, 0.85x on active. This tactile feedback makes the interface feel responsive and grounded. Borders are thin oat-colored hairlines, never dark. Shadows are soft and minimal. Radius values are specific: 4px for ultra-tight buttons, 10px for cards, 20px for larger containers. This is a system designed for reliability and speed, where every visual decision supports the core mission of helpful, fast customer communication.';

    fetch('../tokens.json')
      .then(r => {
        if (!r.ok) throw new Error('tokens.json not found (' + r.status + ')');
        return r.json();
      })
      .then(render)
      .catch(err => {
        document.getElementById('app').innerHTML =
          '<div class="loading" style="color:#ff5600">' +
          'Could not load tokens.json — ' + err.message + '</div>';
      });

    function render(tokens) {
      const app = document.getElementById('app');
      const title = tokens.meta?.title || 'Design System';
      const summary = tokens.meta?.summary || '';

      const ramp = tokens.typography?.ramp || [];

      let html = '';

      /* Header */
      html += '<header class="header">';
      html += '  <div class="header__kicker">Type Specimen</div>';
      html += '  <h1 class="header__title">' + esc(title) + '</h1>';
      html += '  <p class="header__subtitle">' + esc(summary) + '</p>';
      html += '  <hr class="header__rule">';
      html += '</header>';

      /* Font families */
      const families = [
        { label: 'Primary', name: 'Saans', fallback: 'Saans Fallback, ui-sans-serif, system-ui', note: 'Display & body—aggressive negative tracking' },
        { label: 'Serif', name: 'Serrif', fallback: 'Serrif Fallback, ui-serif, Georgia', note: 'Editorial moments with warmth' },
        { label: 'Monospace', name: 'SaansMono', fallback: 'SaansMono Fallback, ui-monospace', note: 'Uppercase labels & metadata discipline' },
        { label: 'UI', name: 'MediumLL / LLMedium', fallback: 'system-ui, -apple-system, Helvetica Neue', note: 'Button text & interface elements' }
      ];

      html += '<div class="font-families">';
      families.forEach(f => {
        html += '<div class="font-card">';
        html += '  <div class="font-card__label">' + esc(f.label) + '</div>';
        html += '  <div class="font-card__name">' + esc(f.name) + '</div>';
        html += '  <div class="font-card__fallback">' + esc(f.fallback) + '</div>';
        html += '</div>';
      });
      html += '</div>';

      /* Character set */
      html += '<div class="charmap-block">';
      html += '  <div class="charmap-block__label">Character Set · Saans Primary</div>';
      html += '  <div class="charmap-block__chars" style="font-family:\'MediumLL\',system-ui,sans-serif">';
      html += '    AaBbCcDdEeFfGgHhIiJjKkLlMmNnOoPpQqRrSsTtUuVvWwXxYyZz<br>';
      html += '    0123456789 !@#$%&amp;*()&ndash;&mdash;&lsquo;&rsquo;&ldquo;&rdquo;.,:;?';
      html += '  </div>';
      html += '</div>';

      /* Type ramp */
      if (ramp.length) {
        html += '<div class="ramp-section">';
        html += '<div class="section-label">Type Ramp</div>';
        ramp.forEach((entry, i) => {
          html += rampRow(entry, i);
        });
        html += '</div>';
      }

      /* Drop cap demo */
      html += '<div class="dropcap-demo">';
      html += '<div class="dropcap-demo__label">Drop Cap — Five-Line Saans, Fin Orange</div>';
      html += '<div class="dropcap-container">';
      const firstChar = DROPCAP_TEXT.charAt(0);
      const restText = DROPCAP_TEXT.substring(1);
      html += '<p class="dropcap-para">';
      html += '<span class="dropcap">' + esc(firstChar) + '</span>';
      html += esc(restText);
      html += '</p>';
      html += '</div>';
      html += '</div>';

      app.innerHTML = html;
    }

    function rampRow(entry, idx) {
      const role = entry.role || 'Role ' + (idx + 1);
      const size = entry.size || '16px';
      const weight = entry.weight || 400;
      const lh = entry.lineHeight || '1.5';
      const ls = entry.letterSpacing || '0';

      let fontFamily = 'var(--font-body)';
      if (entry.fontKey === 'display') fontFamily = 'var(--font-body)';
      else if (entry.fontKey === 'mono') fontFamily = 'var(--font-mono)';

      const sizeNum = parseFloat(size);
      const sampleIdx = idx % EDITORIAL_SAMPLES.length;
      let sample = EDITORIAL_SAMPLES[sampleIdx];

      /* Truncate very large samples */
      if (sizeNum >= 72) {
        sample = sample.split('.')[0].slice(0, 35);
        if (!sample.endsWith('.')) sample += '.';
      }

      let fontStyle = 'font-size:' + size + ';font-weight:' + weight + ';line-height:' + lh + ';';
      fontStyle += 'font-family:' + fontFamily + ';';
      if (ls && ls !== '0' && ls !== 'normal') fontStyle += 'letter-spacing:' + ls + ';';

      let meta = esc(size) + ' / ' + esc(String(weight));
      meta += '\n' + fontFamilyLabel(entry.fontKey);
      meta += '\nline-height: ' + esc(String(lh));
      if (ls && ls !== '0' && ls !== 'normal') meta += '\nletter-spacing: ' + esc(ls);

      return '' +
        '<div class="ramp-row">' +
        '  <div class="ramp-meta">' +
        '    <div class="ramp-meta__role">' + esc(role) + '</div>' +
        '    <pre class="ramp-meta__detail">' + meta + '</pre>' +
        '  </div>' +
        '  <div class="ramp-sample" style="' + fontStyle + '">' + esc(sample) + '</div>' +
        '</div>';
    }

    function fontFamilyLabel(key) {
      const map = {
        'body': 'Saans / MediumLL',
        'mono': 'SaansMono',
        'serif': 'Serrif',
        'ui': 'MediumLL'
      };
      return map[key] || 'Saans';
    }

    function esc(s) {
      const d = document.createElement('div');
      d.textContent = String(s);
      return d.innerHTML;
    }
  </script>
</body>
</html>
