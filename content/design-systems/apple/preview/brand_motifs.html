<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Brand Motifs — Apple</title>
  <link rel="stylesheet" href="../colors_and_type.css">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: var(--font-body, system-ui, sans-serif);
      background: var(--paper, #fff);
      color: var(--ink, #1d1d1f);
      line-height: 1.6;
    }

    .page {
      max-width: 1100px;
      margin: 0 auto;
      padding: 64px 32px;
    }

    /* Header */
    .header {
      margin-bottom: 64px;
    }
    .header__title {
      font-family: var(--font-display, system-ui, sans-serif);
      font-size: 56px;
      font-weight: 600;
      line-height: 1.07;
      letter-spacing: -0.28px;
      color: var(--ink, #1d1d1f);
      margin-bottom: 12px;
    }
    .header__subtitle {
      font-size: 18px;
      color: var(--slate, #666);
      max-width: 600px;
      line-height: 1.5;
    }
    .header__rule {
      display: block;
      width: 48px;
      height: 3px;
      background: var(--signal, #0071e3);
      border: none;
      margin-top: 24px;
      border-radius: 2px;
    }

    /* Section */
    .section {
      margin-bottom: 56px;
    }
    .section__label {
      font-family: var(--font-display, system-ui, sans-serif);
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--slate, #666);
      margin-bottom: 24px;
      padding-bottom: 12px;
      border-bottom: 1px solid var(--bone, #d2d2d7);
    }

    /* Key characteristics */
    .traits-list {
      list-style: none;
      padding: 0;
    }
    .traits-list li {
      position: relative;
      padding: 14px 0 14px 24px;
      font-size: 16px;
      line-height: 1.6;
      color: var(--ink, #1d1d1f);
      border-bottom: 1px solid var(--bone, #d2d2d7);
    }
    .traits-list li:last-child {
      border-bottom: none;
    }
    .traits-list li::before {
      content: '';
      position: absolute;
      left: 4px;
      top: 20px;
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--signal, #0071e3);
    }

    /* Do's and Don'ts */
    .dd-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 24px;
    }
    @media (max-width: 768px) {
      .dd-grid {
        grid-template-columns: 1fr;
      }
    }
    .dd-card {
      background: var(--paper, #fff);
      border: 1px solid var(--bone, #d2d2d7);
      border-radius: 12px;
      padding: 28px;
      overflow: hidden;
    }
    .dd-card__heading {
      font-family: var(--font-display, system-ui, sans-serif);
      font-size: 18px;
      font-weight: 600;
      margin-bottom: 20px;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .dd-card__heading--do { color: #34c759; }
    .dd-card__heading--dont { color: #ff3b30; }

    .dd-card__icon {
      width: 24px;
      height: 24px;
      border-radius: 50%;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      font-size: 14px;
      flex-shrink: 0;
      color: #fff;
    }
    .dd-card__icon--do {
      background: #34c759;
    }
    .dd-card__icon--dont {
      background: #ff3b30;
    }

    .dd-list {
      list-style: none;
      padding: 0;
    }
    .dd-list li {
      font-size: 15px;
      line-height: 1.7;
      color: var(--ink, #1d1d1f);
      padding: 8px 0;
      border-bottom: 1px solid var(--bone, #d2d2d7);
    }
    .dd-list li:last-child {
      border-bottom: none;
    }

    /* Color harmony strip */
    .harmony-strip {
      display: flex;
      border-radius: 12px;
      overflow: hidden;
      height: 100px;
      box-shadow: 0 2px 12px rgba(0, 0, 0, 0.08);
    }
    .harmony-strip__swatch {
      flex: 1;
      position: relative;
      transition: flex 0.3s ease;
      cursor: default;
    }
    .harmony-strip__swatch:hover {
      flex: 2;
    }
    .harmony-strip__label {
      position: absolute;
      bottom: 12px;
      left: 50%;
      transform: translateX(-50%);
      font-family: var(--font-mono, ui-monospace, monospace);
      font-size: 11px;
      font-weight: 600;
      padding: 4px 8px;
      border-radius: 4px;
      white-space: nowrap;
      opacity: 0;
      transition: opacity 0.2s ease;
      max-width: 90%;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .harmony-strip__swatch:hover .harmony-strip__label {
      opacity: 1;
    }

    /* Type pairing demo */
    .type-pairing {
      background: var(--paper, #fff);
      border: 1px solid var(--bone, #d2d2d7);
      border-radius: 12px;
      padding: 48px 40px;
    }
    .type-pairing__display {
      font-family: var(--font-display, system-ui, sans-serif);
      font-size: 48px;
      font-weight: 500;
      line-height: 1.08;
      letter-spacing: -0.144px;
      color: var(--ink, #1d1d1f);
      margin-bottom: 20px;
    }
    .type-pairing__body {
      font-family: var(--font-body, system-ui, sans-serif);
      font-size: 17px;
      font-weight: 400;
      line-height: 1.47;
      letter-spacing: -0.374px;
      color: var(--ink, #1d1d1f);
      max-width: 660px;
    }
    .type-pairing__meta {
      display: flex;
      gap: 32px;
      margin-top: 28px;
      padding-top: 20px;
      border-top: 1px solid var(--bone, #d2d2d7);
    }
    .type-pairing__meta-item {
      font-family: var(--font-mono, ui-monospace, monospace);
      font-size: 12px;
      color: var(--slate, #666);
    }
    .type-pairing__meta-label {
      font-weight: 600;
      color: var(--ink, #1d1d1f);
    }

    /* Atmosphere card */
    .atmosphere-card {
      background: var(--paper, #fff);
      border: 1px solid var(--bone, #d2d2d7);
      border-radius: 12px;
      padding: 32px;
    }
    .atmosphere-card p {
      font-size: 16px;
      line-height: 1.75;
      color: var(--ink, #1d1d1f);
    }

    /* Rhythm Demo */
    .rhythm-demo {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
      margin-top: 24px;
    }
    @media (max-width: 768px) {
      .rhythm-demo {
        grid-template-columns: 1fr;
      }
    }
    .rhythm-block {
      border-radius: 12px;
      padding: 32px;
      text-align: center;
      border: 1px solid var(--bone, #d2d2d7);
    }
    .rhythm-block--dark {
      background: var(--color-absolute-black, #000);
      color: var(--paper, #fff);
      border: none;
    }
    .rhythm-block--light {
      background: var(--color-pale-apple-gray, #f5f5f7);
      color: var(--ink, #1d1d1f);
    }
    .rhythm-block__label {
      font-family: var(--font-display, system-ui, sans-serif);
      font-size: 14px;
      font-weight: 600;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      opacity: 0.6;
      margin-bottom: 12px;
    }
    .rhythm-block__value {
      font-family: var(--font-mono, ui-monospace, monospace);
      font-size: 12px;
      font-weight: 500;
      opacity: 0.7;
    }

    /* Geometry Demo */
    .geometry-demo {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
      gap: 20px;
      margin-top: 24px;
    }
    .geometry-item {
      text-align: center;
    }
    .geometry-sample {
      width: 100%;
      height: 80px;
      background: var(--signal, #0071e3);
      margin-bottom: 12px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
    }
    .geometry-sample--pill {
      border-radius: 40px;
    }
    .geometry-sample--circle {
      border-radius: 999px;
      width: 80px;
      height: 80px;
      margin-left: auto;
      margin-right: auto;
    }
    .geometry-sample--card {
      border-radius: 20px;
    }
    .geometry-sample--tight {
      border-radius: 4px;
    }
    .geometry-label {
      font-family: var(--font-display, system-ui, sans-serif);
      font-size: 13px;
      font-weight: 600;
      color: var(--slate, #666);
      text-transform: uppercase;
      letter-spacing: 0.08em;
    }

    /* Loading */
    .loading {
      text-align: center;
      padding: 80px 24px;
      color: var(--slate, #666);
      font-size: 16px;
    }
    .loading::after {
      content: '';
      display: block;
      width: 32px;
      height: 32px;
      margin: 16px auto 0;
      border: 3px solid var(--bone, #d2d2d7);
      border-top-color: var(--signal, #0071e3);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div class="page" id="app">
    <div class="loading">Loading design tokens&hellip;</div>
  </div>

  <script>
    const CORE_COLOR_KEYS = ['paper', 'ink', 'slate', 'signal', 'bone', 'surface'];
    const EXTENDED_COLOR_KEYS = {
      'absolute-black': '#000000',
      'pale-apple-gray': '#f5f5f7',
      'body-link-blue': '#0066cc',
      'high-luminance-link-blue': '#2997ff'
    };

    ( window.__DESIGN_TOKENS__ ? Promise.resolve({ ok: true, json: () => Promise.resolve(window.__DESIGN_TOKENS__) }) : fetch('../tokens.json') )
      .then(r => {
        if (!r.ok) throw new Error('tokens.json not found (' + r.status + ')');
        return r.json();
      })
      .then(render)
      .catch(err => {
        document.getElementById('app').innerHTML =
          '<div class="loading" style="color:#ff3b30">' +
          'Could not load tokens.json &mdash; ' + err.message + '</div>';
      });

    function render(tokens) {
      const app = document.getElementById('app');
      const name = tokens.meta?.title || tokens.name || 'Design System';
      const colors = tokens.colors || {};
      const fonts = tokens.typography || {};
      const meta = tokens.meta || {};

      let html = '';

      /* Header */
      html += '<header class="header">';
      html += '  <h1 class="header__title">Brand Motifs</h1>';
      html += '  <p class="header__subtitle">The DNA of ' + esc(name) + '. Visual language, signature moves, and core principles.</p>';
      html += '  <hr class="header__rule">';
      html += '</header>';

      /* ---- Atmosphere ---- */
      html += '<div class="section">';
      html += '  <div class="section__label">Atmosphere</div>';
      html += '  <div class="atmosphere-card"><p>Apple\'s web language is a precision editorial system that alternates between gallery-like calm and retail-density information blocks. The visual tone stays restrained: broad neutral canvases, quiet chrome, and product imagery given almost all of the expressive weight. The interface is engineered to disappear so hardware, materials, and finish options become the narrative foreground.</p></div>';
      html += '</div>';

      /* ---- Key Characteristics ---- */
      const traits = [
        'Binary section rhythm: deep black scenes alternating with pale neutral fields',
        'Single blue accent family for action and link semantics',
        'Dual operating modes: cinematic showcase modules and dense commerce configurators',
        'Heavy reliance on imagery and material finishes; UI chrome remains visually thin',
        'Tight headline metrics paired with compact body and link typography',
        'Pill and capsule geometry as signature action language',
        'Depth used sparingly; contrast and surface separation do most of the layering work',
        'Multi-page color-block rhythm: black hero chapters, pale merchandising fields, white retail surfaces'
      ];
      html += '<div class="section">';
      html += '  <div class="section__label">Key Characteristics</div>';
      html += '  <ul class="traits-list">';
      traits.forEach(t => {
        html += '<li>' + esc(t) + '</li>';
      });
      html += '  </ul>';
      html += '</div>';

      /* ---- Color Rhythm ---- */
      html += '<div class="section">';
      html += '  <div class="section__label">Color Rhythm</div>';
      html += '  <p style="font-size:15px;color:var(--slate);margin-bottom:20px;">Apple\'s palette is anchored by a neutral triad that structures every screen.</p>';
      html += '  <div class="rhythm-demo">';
      html += '    <div class="rhythm-block rhythm-block--dark"><div class="rhythm-block__label">Absolute Black</div><div class="rhythm-block__value">#000000</div></div>';
      html += '    <div class="rhythm-block rhythm-block--light"><div class="rhythm-block__label">Pale Apple Gray</div><div class="rhythm-block__value">#f5f5f7</div></div>';
      html += '    <div class="rhythm-block" style="background:var(--paper)"><div class="rhythm-block__label">Paper</div><div class="rhythm-block__value">#ffffff</div></div>';
      html += '    <div class="rhythm-block" style="background:var(--signal);color:#fff;border:none"><div class="rhythm-block__label">Signal Blue</div><div class="rhythm-block__value">#0071e3</div></div>';
      html += '  </div>';
      html += '</div>';

      /* ---- Geometry Language ---- */
      html += '<div class="section">';
      html += '  <div class="section__label">Geometry Language</div>';
      html += '  <p style="font-size:15px;color:var(--slate);margin-bottom:24px;">Apple uses purposeful radius tiers for different UI contexts, from tight utility controls to friendly action buttons.</p>';
      html += '  <div class="geometry-demo">';
      html += '    <div class="geometry-item"><div class="geometry-sample geometry-sample--tight"></div><div class="geometry-label">Tight (4px)</div></div>';
      html += '    <div class="geometry-item"><div class="geometry-sample geometry-sample--card"></div><div class="geometry-label">Card (20px)</div></div>';
      html += '    <div class="geometry-item"><div class="geometry-sample geometry-sample--pill"></div><div class="geometry-label">Pill (40px)</div></div>';
      html += '    <div class="geometry-item"><div class="geometry-sample geometry-sample--circle"></div><div class="geometry-label">Full Circle</div></div>';
      html += '  </div>';
      html += '</div>';

      /* ---- Do's and Don'ts ---- */
      const dos = [
        'Use the neutral triad (#000, #f5f5f7, #fff) as the structural foundation',
        'Reserve blue accents for genuine action and navigation semantics',
        'Keep typography tight and deliberate, especially at display scales',
        'Maintain the capsule/circle geometry language for controls',
        'Let product imagery carry visual drama; keep chrome understated',
        'Use border-led containment in dense retail contexts'
      ];
      const donts = [
        'Introduce broad secondary accent palettes that compete with Apple blue',
        'Overuse shadows, glow effects, or decorative gradients in core UI',
        'Mix unrelated font families or loosen tracking indiscriminately',
        'Flatten all corners to a single radius; use purposeful radius tiers',
        'Overload commerce modules with thick borders or loud visual effects',
        'Remove neutral contrast cadence between dark and light chapters'
      ];

      html += '<div class="section">';
      html += '  <div class="section__label">Do\'s and Don\'ts</div>';
      html += '  <div class="dd-grid">';

      html += '<div class="dd-card">';
      html += '  <div class="dd-card__heading dd-card__heading--do">';
      html += '    <span class="dd-card__icon dd-card__icon--do">✓</span> Do';
      html += '  </div>';
      html += '  <ul class="dd-list">';
      dos.forEach(d => { html += '<li>' + esc(d) + '</li>'; });
      html += '  </ul></div>';

      html += '<div class="dd-card">';
      html += '  <div class="dd-card__heading dd-card__heading--dont">';
      html += '    <span class="dd-card__icon dd-card__icon--dont">✕</span> Don\'t';
      html += '  </div>';
      html += '  <ul class="dd-list">';
      donts.forEach(d => { html += '<li>' + esc(d) + '</li>'; });
      html += '  </ul></div>';

      html += '  </div>';
      html += '</div>';

      /* ---- Color Harmony Strip ---- */
      html += '<div class="section">';
      html += '  <div class="section__label">Core Color Palette</div>';
      html += '  <div class="harmony-strip">';

      const harmonyColors = {
        'paper': colors.paper || '#ffffff',
        'pale gray': '#f5f5f7',
        'ink': colors.ink || '#1d1d1f',
        'absolute black': '#000000',
        'signal': colors.signal || '#0071e3'
      };

      Object.entries(harmonyColors).forEach(([key, hex]) => {
        const lum = relativeLuminance(hex);
        const labelColor = lum > 0.4 ? '#1d1d1f' : '#ffffff';
        const labelBg = lum > 0.4 ? 'rgba(0,0,0,0.06)' : 'rgba(255,255,255,0.16)';
        html += '<div class="harmony-strip__swatch" style="background:' + esc(hex) + '">';
        html += '  <span class="harmony-strip__label" style="color:' + labelColor + ';background:' + labelBg + '">' + esc(key) + '</span>';
        html += '</div>';
      });

      html += '  </div>';
      html += '</div>';

      /* ---- Typography Pairing Demo ---- */
      html += '<div class="section">';
      html += '  <div class="section__label">Typography Pairing</div>';
      html += '  <div class="type-pairing">';

      html += '    <div class="type-pairing__display">The future is made of glass</div>';

      html += '    <div class="type-pairing__body">Apple\'s typography system uses SF Pro Display for hero and merchandising hierarchy with compact line heights and controlled tracking, while SF Pro Text handles product metadata, navigation, filters, and dense selection UI. The typography stays understated, but the scale range is wide enough to support both billboard hero messaging and micro utility labels.</div>';

      html += '    <div class="type-pairing__meta">';
      html += '      <div class="type-pairing__meta-item"><span class="type-pairing__meta-label">Display:</span> SF Pro Display, Weight 500–600</div>';
      html += '      <div class="type-pairing__meta-item"><span class="type-pairing__meta-label">Body:</span> SF Pro Text, Weight 400–600</div>';
      html += '    </div>';
      html += '  </div>';
      html += '</div>';

      app.innerHTML = html;
    }

    /* ---- Utilities ---- */
    function esc(s) {
      const d = document.createElement('div');
      d.textContent = String(s);
      return d.innerHTML;
    }

    function hexToRgb(hex) {
      hex = hex.replace(/^#/, '');
      if (hex.length === 3) hex = hex.split('').map(c => c + c).join('');
      const n = parseInt(hex, 16);
      return [(n >> 16) & 255, (n >> 8) & 255, n & 255];
    }

    function relativeLuminance(hex) {
      try {
        const [r, g, b] = hexToRgb(hex).map(c => {
          c /= 255;
          return c <= 0.03928 ? c / 12.92 : Math.pow((c + 0.055) / 1.055, 2.4);
        });
        return 0.2126 * r + 0.7152 * g + 0.0722 * b;
      } catch { return 0.5; }
    }
  </script>
</body>
</html>
