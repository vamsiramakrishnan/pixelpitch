<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Color Palette — Dramatic</title>
  <link rel="stylesheet" href="../colors_and_type.css">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: var(--font-body, 'system-ui', sans-serif);
      background: var(--paper, #ffffff);
      color: var(--ink, #111111);
      line-height: 1.6;
      padding: 0;
    }

    .page {
      max-width: 1200px;
      margin: 0 auto;
      padding: 64px 32px;
    }

    /* Header / Stage head */
    .header {
      margin-bottom: 72px;
      border-bottom: 3px solid var(--ink, #111111);
      padding-bottom: 32px;
    }

    .header__kicker {
      font-family: var(--font-mono, 'ui-monospace', monospace);
      font-size: 14px;
      font-weight: 600;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--signal, #3b82f6);
      margin-bottom: 16px;
    }

    .header__title {
      font-family: var(--font-display, 'system-ui', sans-serif);
      font-size: 72px;
      font-weight: 900;
      line-height: 0.95;
      letter-spacing: -0.03em;
      color: var(--ink, #111111);
      margin-bottom: 12px;
    }

    .header__subtitle {
      font-family: var(--font-body, 'system-ui', sans-serif);
      font-size: 20px;
      line-height: 1.6;
      color: var(--slate, #666666);
      max-width: 760px;
      margin-bottom: 20px;
      font-weight: 500;
    }

    .header__meta {
      font-family: var(--font-mono, 'ui-monospace', monospace);
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 0.08em;
      color: var(--slate, #666666);
      text-transform: uppercase;
    }

    /* Section labels */
    .section-label {
      font-family: var(--font-mono, 'ui-monospace', monospace);
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--signal, #3b82f6);
      margin-bottom: 32px;
      padding-bottom: 16px;
      border-bottom: 2px solid var(--signal, #3b82f6);
    }

    /* Swatch grid */
    .swatch-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 24px;
      margin-bottom: 64px;
    }

    .swatch {
      background: var(--paper, #ffffff);
      border: 2px solid var(--signal, #3b82f6);
      border-radius: 12px;
      overflow: hidden;
      transition: all 0.2s ease;
    }

    .swatch:hover {
      border-color: var(--ink, #111111);
      transform: translateY(-4px);
      box-shadow: 0 8px 24px rgba(59, 130, 246, 0.15);
    }

    .swatch__chip {
      width: 100%;
      aspect-ratio: 16 / 10;
      position: relative;
      overflow: hidden;
    }

    .swatch__chip-contrast {
      position: absolute;
      bottom: 12px;
      right: 12px;
      font-family: var(--font-mono, 'ui-monospace', monospace);
      font-size: 11px;
      font-weight: 700;
      padding: 4px 12px;
      border-radius: 4px;
      line-height: 1.4;
      text-transform: uppercase;
      letter-spacing: 0.06em;
    }

    .swatch__meta {
      padding: 20px 20px 24px;
    }

    .swatch__var {
      font-family: var(--font-mono, 'ui-monospace', monospace);
      font-size: 11px;
      font-weight: 700;
      color: var(--ink, #111111);
      word-break: break-all;
      margin-bottom: 6px;
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }

    .swatch__hex {
      font-family: var(--font-mono, 'ui-monospace', monospace);
      font-size: 13px;
      color: var(--ink, #111111);
      margin-bottom: 10px;
      font-weight: 600;
      letter-spacing: 0.02em;
    }

    .swatch__role {
      font-family: var(--font-body, 'system-ui', sans-serif);
      font-size: 14px;
      line-height: 1.5;
      color: var(--slate, #666666);
      margin-bottom: 10px;
    }

    .swatch__contrast-label {
      font-family: var(--font-mono, 'ui-monospace', monospace);
      font-size: 10px;
      font-weight: 700;
      margin-top: 8px;
      letter-spacing: 0.06em;
      text-transform: uppercase;
    }

    .contrast-pass { color: #16a34a; }
    .contrast-fail { color: #dc2626; }
    .contrast-aa-large { color: #d97706; }

    /* Chip contrast badge styling */
    .chip-badge {
      border-radius: 4px;
      font-weight: 700;
      display: inline-block;
    }

    /* Usage pattern section */
    .usage-section {
      margin-bottom: 64px;
      padding: 48px;
      background: var(--bone, #f5f5f5);
      border: 2px solid var(--signal, #3b82f6);
      border-radius: 12px;
    }

    .usage-section h2 {
      font-family: var(--font-display, 'system-ui', sans-serif);
      font-size: 52px;
      font-weight: 900;
      line-height: 1.15;
      letter-spacing: -0.02em;
      color: var(--ink, #111111);
      margin-bottom: 24px;
    }

    .usage-section p {
      font-family: var(--font-body, 'system-ui', sans-serif);
      font-size: 16px;
      line-height: 1.65;
      color: var(--slate, #666666);
      margin-bottom: 24px;
      max-width: 760px;
    }

    .rule-of-one {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 32px;
      margin-top: 32px;
      align-items: stretch;
    }

    .rule-example {
      padding: 32px;
      background: var(--paper, #ffffff);
      border: 2px solid var(--signal, #3b82f6);
      border-radius: 12px;
    }

    .rule-example h3 {
      font-family: var(--font-display, 'system-ui', sans-serif);
      font-size: 32px;
      font-weight: 800;
      line-height: 1.3;
      color: var(--ink, #111111);
      margin-bottom: 16px;
    }

    .rule-example p {
      font-family: var(--font-body, 'system-ui', sans-serif);
      font-size: 15px;
      line-height: 1.6;
      color: var(--slate, #666666);
      margin-bottom: 0;
    }

    .correct {
      border-color: #16a34a;
      background: #f0fdf4;
    }

    .correct::before {
      content: '✓ CORRECT USAGE';
      display: block;
      font-family: var(--font-mono, 'ui-monospace', monospace);
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.08em;
      color: #16a34a;
      text-transform: uppercase;
      margin-bottom: 16px;
      padding-bottom: 16px;
      border-bottom: 2px solid #16a34a;
    }

    .incorrect {
      border-color: #dc2626;
      background: #fef2f2;
    }

    .incorrect::before {
      content: '✗ AVOID THIS';
      display: block;
      font-family: var(--font-mono, 'ui-monospace', monospace);
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.08em;
      color: #dc2626;
      text-transform: uppercase;
      margin-bottom: 16px;
      padding-bottom: 16px;
      border-bottom: 2px solid #dc2626;
    }

    .accent-demo {
      font-size: 16px;
      line-height: 1.65;
    }

    .accent-demo .accent-word {
      color: var(--signal, #3b82f6);
      font-weight: 700;
    }

    .accent-demo .accent-highlight {
      background: var(--signal, #3b82f6);
      color: var(--paper, #ffffff);
      font-weight: 700;
      padding: 0 4px;
      border-radius: 3px;
    }

    /* WCAG summary */
    .wcag-summary {
      margin-top: 64px;
      padding: 48px;
      background: var(--bone, #f5f5f5);
      border: 2px solid var(--signal, #3b82f6);
      border-radius: 12px;
    }

    .wcag-summary h2 {
      font-family: var(--font-display, 'system-ui', sans-serif);
      font-size: 52px;
      font-weight: 900;
      line-height: 1.15;
      letter-spacing: -0.02em;
      margin-bottom: 24px;
      color: var(--ink, #111111);
    }

    .wcag-summary p {
      font-family: var(--font-body, 'system-ui', sans-serif);
      font-size: 16px;
      line-height: 1.65;
      color: var(--slate, #666666);
      margin-bottom: 32px;
      max-width: 760px;
    }

    .wcag-row {
      display: flex;
      align-items: center;
      gap: 20px;
      padding: 16px 0;
      border-bottom: 1px solid var(--border, #e5e5e5);
      font-family: var(--font-body, 'system-ui', sans-serif);
      font-size: 15px;
      color: var(--ink, #111111);
    }

    .wcag-row:last-child { border-bottom: none; }

    .wcag-badge {
      display: inline-block;
      padding: 6px 16px;
      border-radius: 6px;
      font-family: var(--font-mono, 'ui-monospace', monospace);
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      min-width: 90px;
      text-align: center;
    }

    .wcag-badge--pass { background: #dbeafe; color: #1e40af; border: 1px solid #3b82f6; }
    .wcag-badge--fail { background: #fee2e2; color: #991b1b; border: 1px solid #dc2626; }
    .wcag-badge--aa-large { background: #fed7aa; color: #92400e; border: 1px solid #d97706; }

    /* Loading state */
    .loading {
      text-align: center;
      padding: 80px 24px;
      color: var(--slate, #666666);
      font-family: var(--font-body, 'system-ui', sans-serif);
      font-size: 18px;
    }

    .loading::after {
      content: '';
      display: block;
      width: 32px;
      height: 32px;
      margin: 24px auto 0;
      border: 3px solid var(--border, #e5e5e5);
      border-top-color: var(--signal, #3b82f6);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    /* Responsive */
    @media (max-width: 768px) {
      .page { padding: 48px 20px; }
      .header { padding-bottom: 24px; margin-bottom: 48px; }
      .header__title { font-size: 48px; }
      .swatch-grid { grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 16px; }
      .rule-of-one { grid-template-columns: 1fr; gap: 16px; }
      .usage-section { padding: 32px 24px; }
      .usage-section h2 { font-size: 40px; }
    }
  </style>
</head>
<body>
  <div class="page" id="app">
    <div class="loading">Loading design tokens&hellip;</div>
  </div>

  <script>
    /* ───────────────────────────────────────────────────────────── */
    /* Contrast ratio calculation (WCAG 2.1 relative luminance)      */
    /* ───────────────────────────────────────────────────────────── */
    function hexToRgb(hex) {
      hex = hex.replace(/^#/, '');
      if (hex.length === 3) hex = hex.split('').map(c => c + c).join('');
      const n = parseInt(hex, 16);
      return [(n >> 16) & 255, (n >> 8) & 255, n & 255];
    }

    function luminance([r, g, b]) {
      const [rs, gs, bs] = [r, g, b].map(c => {
        c /= 255;
        return c <= 0.03928 ? c / 12.92 : Math.pow((c + 0.055) / 1.055, 2.4);
      });
      return 0.2126 * rs + 0.7152 * gs + 0.0722 * bs;
    }

    function contrastRatio(hex1, hex2) {
      const l1 = luminance(hexToRgb(hex1));
      const l2 = luminance(hexToRgb(hex2));
      const lighter = Math.max(l1, l2);
      const darker = Math.min(l1, l2);
      return (lighter + 0.05) / (darker + 0.05);
    }

    function wcagLevel(ratio) {
      if (ratio >= 7) return { label: 'AAA', cls: 'pass' };
      if (ratio >= 4.5) return { label: 'AA', cls: 'pass' };
      if (ratio >= 3) return { label: 'AA Large', cls: 'aa-large' };
      return { label: 'Fail', cls: 'fail' };
    }

    /* ───────────────────────────────────────────────────────────── */
    /* Core color roles and descriptions                             */
    /* ───────────────────────────────────────────────────────────── */
    const CORE_ROLES = {
      paper:   'Default canvas. Clean white foundation for high-contrast layouts.',
      ink:     'Primary text and dominant visual elements. Deep black for authority.',
      slate:   'Secondary text, captions, and muted content. Neutral gray.',
      signal:  'Primary accent color. Blue for CTAs and emphasis—use sparingly.',
      bone:    'Subtle background tint. Off-white for cards and lifted surfaces.',
      border:  'Hairline rules and dividers. Soft gray for subtle structure.',
      surface: 'Card and container backgrounds. Light neutral tone.'
    };

    /* ───────────────────────────────────────────────────────────── */
    /* Render from tokens.json                                       */
    /* ───────────────────────────────────────────────────────────── */
    (window.__DESIGN_TOKENS__ 
      ? Promise.resolve({ ok: true, json: () => Promise.resolve(window.__DESIGN_TOKENS__) }) 
      : fetch('../tokens.json'))
      .then(r => {
        if (!r.ok) throw new Error('tokens.json not found (' + r.status + ')');
        return r.json();
      })
      .then(render)
      .catch(err => {
        document.getElementById('app').innerHTML =
          '<div class="loading" style="color:var(--signal,#3b82f6)">' +
          'Could not load tokens.json — ' + err.message + '</div>';
      });

    function render(tokens) {
      const app = document.getElementById('app');
      const title = tokens.meta?.title || 'Design System';
      const category = tokens.meta?.category || '';
      const summary = tokens.meta?.summary || '';
      const rawColors = tokens.colors || {};
      const paperHex = rawColors.paper || '#ffffff';

      /* Flatten nested color structure */
      const colors = {};
      for (const [k, v] of Object.entries(rawColors)) {
        if (typeof v === 'string') {
          colors[k] = v;
        } else if (v && typeof v === 'object') {
          for (const [sk, sv] of Object.entries(v)) {
            if (typeof sv === 'string') colors[k + '-' + sk] = sv;
          }
        }
      }

      /* Split core and extended */
      const coreKeys = Object.keys(CORE_ROLES).filter(k => colors[k]);
      const extendedKeys = Object.keys(colors).filter(k => !CORE_ROLES[k] && typeof colors[k] === 'string');

      let html = '';

      /* ─ Stage head header ─ */
      html += '<header class="header">';
      html += '  <div class="header__kicker">Color System</div>';
      html += '  <h1 class="header__title">Bold,<br>High-Contrast</h1>';
      html += '  <p class="header__subtitle">Theatrical palette built for visual impact. Bright blue signal accent drives attention. Clean white and deep black create maximum contrast and dramatic hierarchy.</p>';
      html += '  <div class="header__meta">' + category + ' &mdash; ' + (coreKeys.length + extendedKeys.length) + ' Color Tokens</div>';
      html += '</header>';

      /* ─ Core Palette ─ */
      if (coreKeys.length) {
        html += '<div class="section-label">Core Palette</div>';
        html += '<div class="swatch-grid">';
        coreKeys.forEach(key => {
          html += swatchCard(key, colors[key], paperHex, CORE_ROLES[key]);
        });
        html += '</div>';
      }

      /* ─ Extended Palette ─ */
      if (extendedKeys.length) {
        html += '<div class="section-label">Extended & Semantic</div>';
        html += '<div class="swatch-grid">';
        extendedKeys.forEach(key => {
          const role = formatRole(key);
          html += swatchCard(key, colors[key], paperHex, role);
        });
        html += '</div>';
      }

      /* ─ Signal Accent Pattern ─ */
      html += signalAccentSection(paperHex);

      /* ─ WCAG Summary ─ */
      html += wcagSummary(colors, paperHex);

      app.innerHTML = html;
    }

    /* ───────────────────────────────────────────────────────────── */
    /* Swatch card builder                                           */
    /* ───────────────────────────────────────────────────────────── */
    function swatchCard(key, hex, paperHex, role) {
      const ratio = contrastRatio(hex, paperHex);
      const level = wcagLevel(ratio);
      const lum = luminance(hexToRgb(hex));
      const chipTextColor = lum > 0.5 ? '#111111' : '#ffffff';
      const chipBadgeBg = lum > 0.5 ? 'rgba(17,17,17,0.12)' : 'rgba(255,255,255,0.2)';

      return '' +
        '<div class="swatch">' +
        '  <div class="swatch__chip" style="background:' + hex + '">' +
        '    <span class="swatch__chip-contrast chip-badge" style="color:' + chipTextColor +
             ';background:' + chipBadgeBg + '">' + ratio.toFixed(2) + ':1</span>' +
        '  </div>' +
        '  <div class="swatch__meta">' +
        '    <div class="swatch__var">--' + esc(key) + '</div>' +
        '    <div class="swatch__hex">' + esc(hex.toUpperCase()) + '</div>' +
        '    <div class="swatch__role">' + esc(role) + '</div>' +
        '    <div class="swatch__contrast-label contrast-' + level.cls + '">' +
             'WCAG ' + level.label + '</div>' +
        '  </div>' +
        '</div>';
    }

    /* ───────────────────────────────────────────────────────────── */
    /* Signal accent usage pattern                                   */
    /* ───────────────────────────────────────────────────────────── */
    function signalAccentSection(paperHex) {
      let html = '<section class="usage-section">';
      html += '<h2>Signal Accent Usage</h2>';
      html += '<p>Blue signal (#3B82F6) is the primary action color in Dramatic. Use it for interactive elements, CTAs, and focal points. Pair with white and deep black for maximum contrast and visual drama. Always ensure sufficient color space around accents for breathing room.</p>';

      html += '<div class="rule-of-one">';

      /* Correct example */
      html += '<div class="rule-example correct">';
      html += '<h3>Proper Accent Placement</h3>';
      html += '<p class="accent-demo">';
      html += 'The design system uses <span class="accent-word">bold, high-contrast</span> color combinations. Signal blue highlights important actions and <span class="accent-highlight">calls to action</span> against the white canvas, creating visual hierarchy and directing user focus.';
      html += '</p>';
      html += '</div>';

      /* Incorrect example */
      html += '<div class="rule-example incorrect">';
      html += '<h3>Avoid Overuse</h3>';
      html += '<p class="accent-demo">';
      html += '<span style="color:var(--signal,#3b82f6);font-weight:700;">Signal color</span> should not be applied excessively. Avoid using <span style="color:var(--signal,#3b82f6);font-weight:700;">blue for body copy</span> or <span style="color:var(--signal,#3b82f6);font-weight:700;">multiple accent elements</span> in the same section. Let signal stand out through restraint.';
      html += '</p>';
      html += '</div>';

      html += '</div>';
      html += '</section>';
      return html;
    }

    /* ───────────────────────────────────────────────────────────── */
    /* WCAG compliance summary                                       */
    /* ───────────────────────────────────────────────────────────── */
    function wcagSummary(colors, paperHex) {
      const keys = Object.keys(colors);
      let passAAA = 0, passAA = 0, passAALarge = 0, fail = 0;

      keys.forEach(k => {
        const ratio = contrastRatio(colors[k], paperHex);
        if (ratio >= 7) passAAA++;
        else if (ratio >= 4.5) passAA++;
        else if (ratio >= 3) passAALarge++;
        else fail++;
      });

      let html = '<div class="wcag-summary">';
      html += '<h2>Accessibility & Contrast</h2>';
      html += '<p>All colors meet WCAG 2.1 standards when paired with the paper background. The high-contrast palette ensures legibility across text sizes and contexts. Signal blue is approved for interactive UI elements and maintains 4.5:1 contrast with white surfaces.</p>';
      html += row('AAA (7:1+)', passAAA, 'pass');
      html += row('AA (4.5:1+)', passAA, 'pass');
      html += row('AA Large Text (3:1+)', passAALarge, 'aa-large');
      if (fail > 0) html += row('Below threshold', fail, 'fail');
      html += '</div>';
      return html;

      function row(label, count, badge) {
        return '<div class="wcag-row">' +
               '<span class="wcag-badge wcag-badge--' + badge + '">' + count + '</span>' +
               '<span>' + label + '</span>' +
               '</div>';
      }
    }

    /* ───────────────────────────────────────────────────────────── */
    /* Utilities                                                      */
    /* ───────────────────────────────────────────────────────────── */
    function esc(s) {
      const d = document.createElement('div');
      d.textContent = String(s);
      return d.innerHTML;
    }

    function formatRole(key) {
      return key
        .replace(/([A-Z])/g, ' $1')
        .replace(/[-_]/g, ' ')
        .replace(/\b\w/g, c => c.toUpperCase())
        .trim();
    }
  </script>
</body>
</html>
