<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Type Specimen — Dramatic</title>
  <link rel="stylesheet" href="../colors_and_type.css">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: var(--font-body, 'system-ui', sans-serif);
      background: var(--paper, #ffffff);
      color: var(--ink, #111111);
      line-height: 1.6;
    }

    .page {
      max-width: 1200px;
      margin: 0 auto;
      padding: 96px 48px;
    }

    @media (max-width: 768px) {
      .page {
        padding: 64px 32px;
      }
    }

    @media (max-width: 480px) {
      .page {
        padding: 48px 24px;
      }
    }

    /* Header */
    .header {
      margin-bottom: 96px;
    }

    .header__kicker {
      font-family: var(--font-mono, 'ui-monospace', monospace);
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--slate, #666666);
      margin-bottom: 16px;
    }

    .header__title {
      font-family: var(--font-display, 'system-ui', sans-serif);
      font-size: 96px;
      font-weight: 900;
      line-height: 0.95;
      letter-spacing: -0.02em;
      color: var(--ink, #111111);
      margin-bottom: 24px;
      text-transform: uppercase;
    }

    .header__subtitle {
      font-family: var(--font-body, 'system-ui', sans-serif);
      font-size: 20px;
      font-weight: 400;
      line-height: 1.55;
      color: var(--slate, #666666);
      max-width: 720px;
      margin-bottom: 32px;
    }

    .header__rule {
      display: block;
      width: 120px;
      height: 3px;
      background: var(--signal, #3b82f6);
      border: none;
      margin: 0;
    }

    /* Font families section */
    .font-families {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 32px;
      margin-bottom: 96px;
      margin-top: 64px;
    }

    .font-card {
      background: var(--bone, #f5f5f5);
      border: 2px solid var(--ink, #111111);
      border-radius: 0;
      padding: 32px;
    }

    .font-card__label {
      font-family: var(--font-mono, 'ui-monospace', monospace);
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--signal, #3b82f6);
      margin-bottom: 12px;
    }

    .font-card__name {
      font-family: var(--font-display, 'system-ui', sans-serif);
      font-size: 40px;
      font-weight: 900;
      line-height: 1.1;
      color: var(--ink, #111111);
      margin-bottom: 8px;
      text-transform: uppercase;
    }

    .font-card__fallback {
      font-family: var(--font-mono, 'ui-monospace', monospace);
      font-size: 12px;
      color: var(--slate, #666666);
      word-break: break-word;
    }

    /* Character set block */
    .charmap-block {
      background: var(--bone, #f5f5f5);
      border: 2px solid var(--ink, #111111);
      border-radius: 0;
      padding: 48px;
      margin-bottom: 96px;
    }

    .charmap-block__label {
      font-family: var(--font-mono, 'ui-monospace', monospace);
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--signal, #3b82f6);
      margin-bottom: 24px;
    }

    .charmap-block__chars {
      font-family: var(--font-display, 'system-ui', sans-serif);
      font-size: 40px;
      font-weight: 900;
      line-height: 1.8;
      letter-spacing: 0.04em;
      color: var(--ink, #111111);
      word-break: break-word;
      text-transform: uppercase;
    }

    /* Section label */
    .section-label {
      font-family: var(--font-mono, 'ui-monospace', monospace);
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--signal, #3b82f6);
      margin-bottom: 32px;
      padding-bottom: 16px;
      border-bottom: 3px solid var(--signal, #3b82f6);
    }

    /* Ramp row */
    .ramp-row {
      display: grid;
      grid-template-columns: 300px 1fr;
      gap: 48px;
      align-items: baseline;
      padding: 40px 0;
      border-bottom: 1px solid var(--border, #e5e5e5);
    }

    .ramp-row:last-child {
      border-bottom: none;
    }

    @media (max-width: 800px) {
      .ramp-row {
        grid-template-columns: 1fr;
        gap: 16px;
      }
    }

    /* Left meta column */
    .ramp-meta__role {
      font-family: var(--font-display, 'system-ui', sans-serif);
      font-size: 20px;
      font-weight: 900;
      color: var(--ink, #111111);
      margin-bottom: 12px;
      text-transform: uppercase;
    }

    .ramp-meta__detail {
      font-family: var(--font-mono, 'ui-monospace', monospace);
      font-size: 11px;
      font-weight: 600;
      line-height: 1.8;
      color: var(--slate, #666666);
      letter-spacing: 0.05em;
    }

    /* Right sample column */
    .ramp-sample {
      color: var(--ink, #111111);
      overflow-wrap: break-word;
      word-spacing: 0.1em;
      text-transform: uppercase;
    }

    /* Ramp section */
    .ramp-section {
      margin-bottom: 96px;
    }

    /* Drop cap demo */
    .dropcap-demo {
      margin-bottom: 96px;
    }

    .dropcap-demo__label {
      font-family: var(--font-mono, 'ui-monospace', monospace);
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--signal, #3b82f6);
      margin-bottom: 32px;
      padding-bottom: 16px;
      border-bottom: 3px solid var(--signal, #3b82f6);
    }

    .dropcap-container {
      background: var(--bone, #f5f5f5);
      border: 2px solid var(--ink, #111111);
      border-radius: 0;
      padding: 48px;
      max-width: 720px;
    }

    .dropcap-para {
      font-family: var(--font-body, 'system-ui', sans-serif);
      font-size: 20px;
      font-weight: 400;
      line-height: 1.65;
      color: var(--ink, #111111);
      margin: 0;
      text-align: left;
    }

    .dropcap {
      float: left;
      font-family: var(--font-display, 'system-ui', sans-serif);
      font-size: 140px;
      font-weight: 900;
      line-height: 0.8;
      color: var(--signal, #3b82f6);
      margin-right: 8px;
      margin-top: -4px;
      text-transform: uppercase;
    }

    /* Loading */
    .loading {
      text-align: center;
      padding: 160px 48px;
      color: var(--slate, #666666);
      font-family: var(--font-body, 'system-ui', sans-serif);
      font-size: 18px;
    }

    .loading::after {
      content: '';
      display: block;
      width: 32px;
      height: 32px;
      margin: 24px auto 0;
      border: 3px solid var(--border, #e5e5e5);
      border-top-color: var(--signal, #3b82f6);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div class="page" id="app">
    <div class="loading">Loading design tokens&hellip;</div>
  </div>

  <script>
    const EDITORIAL_SAMPLES = [
      'High contrast demands attention.',
      'Theatrical layouts break the grid.',
      'Bold weight carries the message.',
      'Unconventional is the convention here.',
      'Impact through simplicity and scale.',
      'Clean lines with maximum drama.',
      'Every letter commands the stage.',
      'Negative space as a design tool.',
      'Weight hierarchy makes meaning clear.',
      'Modern restraint with theatrical flair.',
    ];

    const DROPCAP_TEXT = 'Dramatic design challenges convention. Where others whisper, this system shouts. High-contrast layouts demand attention through deliberate composition, bold typography, and unconventional spatial arrangements. The type system is built on Outfit—a geometric sans-serif with extreme weight contrast that plays beautifully at headline scales. Two weights, 400 and 900, create theatrical hierarchy: the regular weight maintains readability in body copy, while the ultra-bold dominates as display. JetBrains Mono enforces metadata discipline in all-caps, introducing geometric precision to functional typography. The signal blue provides the only chromatic accent, deployed sparingly to punctuate the monochromatic palette. Clean, modern edges throughout—no rounded corners, no soft shadows. Every design decision serves intensity and clarity. This is a system for brands that refuse to blend in.';

    fetch('../tokens.json')
      .then(r => {
        if (!r.ok) throw new Error('tokens.json not found (' + r.status + ')');
        return r.json();
      })
      .then(render)
      .catch(err => {
        document.getElementById('app').innerHTML =
          '<div class="loading" style="color:#3b82f6">' +
          'Could not load tokens.json — ' + err.message + '</div>';
      });

    function render(tokens) {
      const app = document.getElementById('app');
      const title = tokens.meta?.title || 'Design System';
      const summary = tokens.meta?.summary || '';

      let html = '';

      /* Header */
      html += '<header class="header">';
      html += '  <div class="header__kicker">Type Specimen</div>';
      html += '  <h1 class="header__title">' + esc(title) + '</h1>';
      html += '  <p class="header__subtitle">' + esc(summary) + '</p>';
      html += '  <hr class="header__rule">';
      html += '</header>';

      /* Font families */
      const families = [
        { label: 'Display', name: 'Outfit', fallback: 'system-ui, sans-serif', note: 'Weights 400, 900. Geometric sans.' },
        { label: 'Body', name: 'Outfit', fallback: 'system-ui, sans-serif', note: 'Weight 400. Clean, readable.' },
        { label: 'Monospace', name: 'JetBrains Mono', fallback: 'ui-monospace, monospace', note: 'All-caps metadata & labels.' }
      ];

      html += '<div class="font-families">';
      families.forEach(f => {
        html += '<div class="font-card">';
        html += '  <div class="font-card__label">' + esc(f.label) + '</div>';
        html += '  <div class="font-card__name">' + esc(f.name) + '</div>';
        html += '  <div class="font-card__fallback">' + esc(f.fallback) + '</div>';
        html += '</div>';
      });
      html += '</div>';

      /* Character set */
      html += '<div class="charmap-block">';
      html += '  <div class="charmap-block__label">Character Set · Outfit 900</div>';
      html += '  <div class="charmap-block__chars" style="font-family:Outfit,system-ui,sans-serif;font-weight:900">';
      html += '    ABCDEFGHIJKLMNOPQRSTUVWXYZ<br>';
      html += '    0123456789 !@#$%&amp;*()–—'\''"';
      html += '  </div>';
      html += '</div>';

      /* Type ramp */
      const ramp = buildRamp();
      if (ramp.length) {
        html += '<div class="ramp-section">';
        html += '<div class="section-label">Type Ramp</div>';
        ramp.forEach((entry, i) => {
          html += rampRow(entry, i);
        });
        html += '</div>';
      }

      /* Drop cap demo */
      html += '<div class="dropcap-demo">';
      html += '<div class="dropcap-demo__label">Drop Cap — Seven-Line Outfit 900, Signal Blue</div>';
      html += '<div class="dropcap-container">';
      const firstChar = DROPCAP_TEXT.charAt(0);
      const restText = DROPCAP_TEXT.substring(1);
      html += '<p class="dropcap-para">';
      html += '<span class="dropcap">' + esc(firstChar) + '</span>';
      html += esc(restText);
      html += '</p>';
      html += '</div>';
      html += '</div>';

      app.innerHTML = html;
    }

    function buildRamp() {
      return [
        { role: 'Hero', size: '96px', weight: 900, lh: '0.95', ls: '-0.02em', fontKey: 'display' },
        { role: 'Display XL', size: '64px', weight: 900, lh: '1.0', ls: '-0.015em', fontKey: 'display' },
        { role: 'Display LG', size: '48px', weight: 900, lh: '1.1', ls: '-0.01em', fontKey: 'display' },
        { role: 'Display MD', size: '32px', weight: 900, lh: '1.15', ls: '0', fontKey: 'display' },
        { role: 'Heading XL', size: '28px', weight: 900, lh: '1.2', ls: '0', fontKey: 'display' },
        { role: 'Heading LG', size: '24px', weight: 900, lh: '1.25', ls: '0', fontKey: 'display' },
        { role: 'Heading MD', size: '20px', weight: 900, lh: '1.3', ls: '0', fontKey: 'display' },
        { role: 'Heading SM', size: '18px', weight: 900, lh: '1.35', ls: '0.01em', fontKey: 'display' },
        { role: 'Body XL', size: '20px', weight: 400, lh: '1.5', ls: '0', fontKey: 'body' },
        { role: 'Body LG', size: '18px', weight: 400, lh: '1.55', ls: '0', fontKey: 'body' },
        { role: 'Body MD', size: '16px', weight: 400, lh: '1.6', ls: '0', fontKey: 'body' },
        { role: 'Body SM', size: '14px', weight: 400, lh: '1.65', ls: '0.01em', fontKey: 'body' },
        { role: 'Meta', size: '12px', weight: 600, lh: '1.5', ls: '0.05em', fontKey: 'mono' },
      ];
    }

    function rampRow(entry, idx) {
      const role = entry.role || 'Role ' + (idx + 1);
      const size = entry.size || '16px';
      const weight = entry.weight || 400;
      const lh = entry.lh || '1.5';
      const ls = entry.ls || '0';

      let fontFamily = 'var(--font-body)';
      if (entry.fontKey === 'display') fontFamily = 'var(--font-display)';
      else if (entry.fontKey === 'mono') fontFamily = 'var(--font-mono)';

      const sizeNum = parseFloat(size);
      const sampleIdx = idx % EDITORIAL_SAMPLES.length;
      let sample = EDITORIAL_SAMPLES[sampleIdx];

      /* Truncate very large samples */
      if (sizeNum >= 72) {
        sample = sample.split('.')[0].slice(0, 35);
        if (!sample.endsWith('.')) sample += '.';
      }

      let fontStyle = 'font-size:' + size + ';font-weight:' + weight + ';line-height:' + lh + ';';
      fontStyle += 'font-family:' + fontFamily + ';';
      if (ls && ls !== '0' && ls !== 'normal') fontStyle += 'letter-spacing:' + ls + ';';

      let meta = esc(size) + ' / ' + esc(String(weight));
      meta += '\n' + fontFamilyLabel(entry.fontKey);
      meta += '\nline-height: ' + esc(String(lh));
      if (ls && ls !== '0' && ls !== 'normal') meta += '\nletter-spacing: ' + esc(ls);

      return '' +
        '<div class="ramp-row">' +
        '  <div class="ramp-meta">' +
        '    <div class="ramp-meta__role">' + esc(role) + '</div>' +
        '    <pre class="ramp-meta__detail">' + meta + '</pre>' +
        '  </div>' +
        '  <div class="ramp-sample" style="' + fontStyle + '">' + esc(sample) + '</div>' +
        '</div>';
    }

    function fontFamilyLabel(key) {
      const map = {
        'display': 'Outfit',
        'body': 'Outfit',
        'mono': 'JetBrains Mono'
      };
      return map[key] || 'Unknown';
    }

    function esc(s) {
      const d = document.createElement('div');
      d.textContent = String(s);
      return d.innerHTML;
    }
  </script>
</body>
</html>
