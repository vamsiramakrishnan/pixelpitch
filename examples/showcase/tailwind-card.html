<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Tailwind classes — pattern DB demo</title>
<script>
// Inline-resolved Tailwind values (no CDN needed; we encode the same defaults
// that slidify's pattern DB ships with) so the renderer doesn't need network.
const css = `
  html, body { margin:0; padding:0; width:1280px; height:720px; font-family: Inter, sans-serif; background:#0a0a0a; color:#f5f5f7; }
  .slide { width:1280px; height:720px; padding:96px; box-sizing:border-box; }

  /* hand-mapped Tailwind utilities just for this fixture */
  .text-xs { font-size:12px; line-height:16px; }
  .text-sm { font-size:14px; line-height:20px; }
  .text-base { font-size:16px; line-height:24px; }
  .text-2xl { font-size:24px; line-height:32px; }
  .text-4xl { font-size:36px; line-height:40px; }
  .text-6xl { font-size:60px; line-height:1; }
  .font-bold { font-weight:700; }
  .font-semibold { font-weight:600; }
  .uppercase { text-transform:uppercase; }
  .tracking-widest { letter-spacing:0.1em; }
  .tracking-wide { letter-spacing:0.025em; }

  .text-indigo-300 { color:#a5b4fc; }
  .text-zinc-400 { color:#a1a1aa; }
  .text-white { color:#fff; }

  .bg-zinc-900 { background-color:#18181b; }
  .bg-white\\/10 { background-color: rgba(255,255,255,0.1); }
  .bg-gradient-to-br { background-image: linear-gradient(135deg, var(--tw-from), var(--tw-to)); }
  .from-indigo-500 { --tw-from:#6366f1; }
  .to-pink-500 { --tw-to:#ec4899; }

  .rounded-full { border-radius: 9999px; }
  .rounded-2xl { border-radius: 16px; }
  .shadow-xl { box-shadow: 0 20px 25px -5px rgba(0,0,0,0.45), 0 8px 10px -6px rgba(0,0,0,0.35); }

  .px-3 { padding-left:12px; padding-right:12px; }
  .py-1 { padding-top:4px; padding-bottom:4px; }
  .p-8 { padding:32px; }
  .gap-6 { gap:24px; }
  .grid { display:grid; }
  .grid-cols-3 { grid-template-columns: repeat(3, minmax(0,1fr)); }
  .flex { display:flex; }
  .items-center { align-items:center; }
  .justify-between { justify-content:space-between; }
  .mb-12 { margin-bottom:48px; }
  .mt-2 { margin-top:8px; }

  .stack > * + * { margin-top:8px; }
`;
const style = document.createElement('style');
style.textContent = css;
document.head.appendChild(style);
</script>
</head>
<body>
<div class="slide">
  <div class="flex items-center justify-between mb-12">
    <div class="text-xs uppercase tracking-widest text-indigo-300">Q2 2026 · INVESTOR UPDATE</div>
    <div class="rounded-full bg-white/10 px-3 py-1 text-xs">LIVE</div>
  </div>

  <div class="grid grid-cols-3 gap-6">
    <div class="rounded-2xl bg-zinc-900 p-8 shadow-xl">
      <div class="text-6xl font-bold">87<span class="text-2xl text-indigo-300">%</span></div>
      <div class="mt-2 text-sm text-zinc-400">Native area ratio</div>
    </div>
    <div class="rounded-2xl bg-zinc-900 p-8 shadow-xl">
      <div class="text-6xl font-bold">23<span class="text-2xl text-indigo-300">s</span></div>
      <div class="mt-2 text-sm text-zinc-400">Per 10-slide deck</div>
    </div>
    <div class="rounded-2xl bg-gradient-to-br from-indigo-500 to-pink-500 p-8 shadow-xl">
      <div class="text-6xl font-bold">$0.04</div>
      <div class="mt-2 text-sm text-white">LLM cost per deck</div>
    </div>
  </div>
</div>
</body>
</html>
