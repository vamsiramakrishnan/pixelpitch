<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="slidify-capture-duration" content="3000">
<meta name="slidify-capture-fps" content="15">
<title>Stat cards (Framer Motion)</title>
<style>
  html, body { margin:0; padding:0; width:1280px; height:720px;
               font-family: Inter, sans-serif; background:#050510;
               color:#f5f5f7; -webkit-font-smoothing:antialiased; }
  .slide { width:1280px; height:720px; box-sizing:border-box;
           position:relative; overflow:hidden;
           background: radial-gradient(ellipse at 30% 20%, #1e1b4b 0%, #050510 70%); }
  .header { padding: 56px 64px 0; }
  .kicker { font-size:12px; letter-spacing:0.2em; text-transform:uppercase;
            color:#a1a1aa; }
  h1 { font-size:42px; line-height:1.05; margin:14px 0 0;
       letter-spacing:-0.02em; font-weight:600; }
  h1 .accent { background: linear-gradient(135deg, #818cf8, #ec4899);
               -webkit-background-clip:text; background-clip:text; color:transparent; }
  .grid { position:absolute; left:64px; right:64px; bottom:80px;
          display:grid; grid-template-columns:repeat(3, 1fr); gap:24px; }
  .card { background:#0f0f1f; border:1px solid rgba(255,255,255,0.08);
          border-radius:20px; padding:28px 32px;
          box-shadow: 0 10px 30px rgba(0,0,0,0.4), 0 0 0 1px rgba(255,255,255,0.03) inset; }
  .label { font-size:12px; letter-spacing:0.18em; text-transform:uppercase;
           color:#a1a1aa; }
  .num { font-size:88px; line-height:1; font-weight:700;
         letter-spacing:-0.04em; margin:18px 0 8px; font-variant-numeric: tabular-nums; }
  .delta { font-size:14px; color:#34d399; }
  .delta.down { color:#f87171; }
  .footer { position:absolute; left:64px; right:64px; bottom:32px;
            display:flex; justify-content:space-between;
            font-size:11px; color:#52525b; letter-spacing:0.18em; text-transform:uppercase; }
</style>
</head>
<body>
<div class="slide">
  <div class="header">
    <div class="kicker">Q4 results · 2026</div>
    <h1 data-pptx-role="title">Three numbers that <span class="accent">moved the line</span>.</h1>
  </div>

  <div class="grid">
    <div class="card" data-card>
      <div class="label">Active workspaces</div>
      <div class="num" data-num data-target="2487100" data-suffix="">0</div>
      <div class="delta">+18.4% vs Q3</div>
    </div>
    <div class="card" data-card>
      <div class="label">Net revenue retention</div>
      <div class="num" data-num data-target="142" data-suffix="%">0</div>
      <div class="delta">+6 pts vs Q3</div>
    </div>
    <div class="card" data-card>
      <div class="label">P95 latency</div>
      <div class="num" data-num data-target="38" data-suffix="ms">0</div>
      <div class="delta down">−12ms vs Q3</div>
    </div>
  </div>

  <div class="footer">
    <span>Pixelpitch · Investor brief</span>
    <span>Page 01</span>
  </div>
</div>

<script type="module">
  import { animate, stagger } from "https://cdn.jsdelivr.net/npm/framer-motion@11.11.17/+esm";

  // Card stagger-in from below.
  animate(
    "[data-card]",
    { opacity: [0, 1], y: [40, 0] },
    { duration: 0.6, delay: stagger(0.18, { startDelay: 0.2 }), ease: [0.22, 1, 0.36, 1] }
  );

  // Number count-up with proportional duration so big numbers don't tick faster.
  document.querySelectorAll("[data-num]").forEach((el, i) => {
    const target = Number(el.dataset.target);
    const suffix = el.dataset.suffix || "";
    const start = 0.2 + i * 0.18 + 0.25;
    animate(start, target, {
      duration: 1.6,
      delay: start,
      ease: [0.22, 1, 0.36, 1],
      onUpdate: v => {
        const n = Math.round(v);
        el.textContent = n.toLocaleString("en-US") + suffix;
      },
    });
  });
</script>
</body>
</html>
