<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Slide 10 — Spec sheet</title>
<style>
  html, body { margin:0; padding:0; width:1280px; height:720px;
               -webkit-font-smoothing:antialiased; background:#000; }
  .slide { width:1280px; height:720px; box-sizing:border-box;
           position:relative; overflow:hidden; background:#000;
           font-family:'SF Pro Display', -apple-system, Inter, sans-serif;
           color:#ffffff; }
  .kicker { position:absolute; top:64px; left:80px;
            font-size:11px; font-weight:600; letter-spacing:0.22em;
            text-transform:uppercase; color:#bf5af2; }
  .title { position:absolute; top:104px; left:80px;
           font-size:72px; font-weight:700; letter-spacing:-0.04em;
           line-height:0.92; }
  .silhouette { position:absolute; top:240px; left:80px;
                width:480px; height:360px; }
  .specs { position:absolute; top:240px; right:80px;
           width:520px; }
  .spec-row { display:flex; justify-content:space-between; align-items:baseline;
              padding:18px 0; border-bottom:1px solid rgba(255,255,255,0.12);
              font-family:'SF Mono', ui-monospace, Menlo, monospace; }
  .spec-row:last-child { border-bottom:none; }
  .spec-label { font-size:13px; font-weight:500; letter-spacing:0.08em;
                text-transform:uppercase; color:rgba(255,255,255,0.55);
                font-family:'SF Pro Display', -apple-system, Inter, sans-serif; }
  .spec-value { font-size:28px; font-weight:600;
                font-variant-numeric: tabular-nums;
                font-feature-settings: "tnum" 1;
                color:#ffffff; }
  .spec-value .u { font-size:18px; color:rgba(255,255,255,0.55); margin-left:4px; }
  .pageno { position:absolute; bottom:48px; right:80px;
            font-size:11px; font-weight:600; letter-spacing:0.22em;
            color:rgba(255,255,255,0.45);
            font-variant-numeric: tabular-nums; }
</style>
</head>
<body>
  <div class="slide">
    <div class="kicker">Hardware</div>
    <h1 data-pptx-role="title" class="title">Pro, in the smallest possible frame.</h1>

    <svg class="silhouette" viewBox="0 0 480 360" xmlns="http://www.w3.org/2000/svg" fill="none">
      <!-- abstract device silhouette: rounded rect via cubic beziers -->
      <path d="M 60 60
               C 60 40, 80 20, 120 20
               L 360 20
               C 400 20, 420 40, 420 60
               L 420 300
               C 420 320, 400 340, 360 340
               L 120 340
               C 80 340, 60 320, 60 300
               Z"
            stroke="#bf5af2" stroke-width="2.5"/>
      <!-- screen aperture -->
      <path d="M 110 90
               C 110 80, 120 70, 140 70
               L 340 70
               C 360 70, 370 80, 370 90
               L 370 270
               C 370 280, 360 290, 340 290
               L 140 290
               C 120 290, 110 280, 110 270
               Z"
            stroke="#bf5af2" stroke-width="1.5" opacity="0.5"/>
      <!-- callout: circle + line + label, exploded view -->
      <circle cx="240" cy="180" r="5" fill="#bf5af2"/>
      <line x1="245" y1="180" x2="430" y2="180" stroke="#bf5af2" stroke-width="1"/>
      <line x1="430" y1="180" x2="455" y2="155" stroke="#bf5af2" stroke-width="1"/>
    </svg>

    <div class="specs">
      <div class="spec-row">
        <span class="spec-label">Display</span>
        <span class="spec-value">12.9<span class="u">in</span></span>
      </div>
      <div class="spec-row">
        <span class="spec-label">Weight</span>
        <span class="spec-value">682<span class="u">g</span></span>
      </div>
      <div class="spec-row">
        <span class="spec-label">Battery</span>
        <span class="spec-value">18.0<span class="u">hr</span></span>
      </div>
      <div class="spec-row">
        <span class="spec-label">Performance</span>
        <span class="spec-value">3.4<span class="u">x</span></span>
      </div>
      <div class="spec-row">
        <span class="spec-label">Starting at</span>
        <span class="spec-value">$1,299</span>
      </div>
    </div>

    <div class="pageno">13 / 17</div>
  </div>
</body>
</html>
