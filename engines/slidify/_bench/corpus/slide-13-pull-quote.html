<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Slide 13 — Pull quote</title>
<style>
  html, body { margin:0; padding:0; width:1280px; height:720px;
               -webkit-font-smoothing:antialiased; background:#ffffff; }
  .slide { width:1280px; height:720px; box-sizing:border-box;
           position:relative; overflow:hidden; background:#ffffff;
           font-family:'SF Pro Display', -apple-system, Inter, sans-serif;
           color:#000000; }
  .kicker { position:absolute; top:64px; left:120px;
            font-size:11px; font-weight:600; letter-spacing:0.22em;
            text-transform:uppercase; color:#0a84ff; }
  .quote { position:absolute; top:152px; left:120px;
           font-size:64px; font-weight:600; letter-spacing:-0.03em;
           line-height:1.08; max-width:1040px;
           font-family:'New York', 'Source Serif Pro', Georgia, serif;
           color:#000000; }
  .quote em { font-style:italic; color:#0a84ff; font-weight:600; }
  .quote .mark { color:#0a84ff; font-weight:700; }
  .attribution { position:absolute; bottom:128px; left:120px;
                 display:flex; align-items:center; gap:16px; }
  .dot { width:10px; height:10px; border-radius:9999px; background:#0a84ff;
         display:inline-block; }
  .name { font-size:18px; font-weight:600; letter-spacing:-0.01em;
          color:#000000; }
  .role { font-size:14px; font-weight:400;
          color:rgba(0,0,0,0.55); margin-top:2px; }
  .att-text { display:flex; flex-direction:column; }
  .pageno { position:absolute; bottom:48px; right:120px;
            font-size:11px; font-weight:600; letter-spacing:0.22em;
            color:rgba(0,0,0,0.45);
            font-variant-numeric: tabular-nums; }
</style>
</head>
<body>
  <div class="slide">
    <div class="kicker">In their words</div>
    <blockquote data-pptx-role="title" class="quote">
      <span class="mark">&ldquo;</span>It is the <em>quietest</em> piece of hardware we have ever built &mdash; and somehow the most powerful.<span class="mark">&rdquo;</span>
    </blockquote>
    <div class="attribution">
      <span class="dot"></span>
      <div class="att-text">
        <span class="name">Maren Asplund</span>
        <span class="role">VP, Hardware Engineering</span>
      </div>
    </div>
    <div class="pageno">16 / 17</div>
  </div>
</body>
</html>
