<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Slide 11 — Was / Now</title>
<style>
  html, body { margin:0; padding:0; width:1280px; height:720px;
               -webkit-font-smoothing:antialiased; background:#ffffff; }
  .slide { width:1280px; height:720px; box-sizing:border-box;
           position:relative; overflow:hidden; background:#ffffff;
           font-family:'SF Pro Display', -apple-system, Inter, sans-serif;
           color:#000000; }
  .kicker { position:absolute; top:64px; left:96px;
            font-size:11px; font-weight:600; letter-spacing:0.22em;
            text-transform:uppercase; color:#30d158; }
  .title { position:absolute; top:104px; left:96px;
           font-size:60px; font-weight:700; letter-spacing:-0.04em;
           line-height:0.96; max-width:900px; }
  .col { position:absolute; top:308px; width:480px; }
  .col-was { left:96px; }
  .col-now { left:704px; }
  .col-label { font-size:11px; font-weight:600; letter-spacing:0.22em;
               text-transform:uppercase; color:rgba(0,0,0,0.5);
               margin-bottom:18px; }
  .col-now .col-label { color:#30d158; }
  .number { font-size:180px; font-weight:800; letter-spacing:-0.04em;
            line-height:0.92;
            font-variant-numeric: tabular-nums;
            font-feature-settings: "tnum" 1;
            font-family:'SF Mono', ui-monospace, Menlo, monospace; }
  .col-was .number { color:rgba(0,0,0,0.35); }
  .col-now .number { color:#000000; }
  .unit { font-size:48px; font-weight:600; letter-spacing:-0.02em;
          color:rgba(0,0,0,0.4); margin-left:6px; }
  .col-now .unit { color:#30d158; }
  .sub { margin-top:12px; font-size:18px; font-weight:400;
         line-height:1.3; color:rgba(0,0,0,0.6); max-width:420px; }
  .arrow { position:absolute; top:404px; left:592px; }
  .pageno { position:absolute; bottom:48px; right:96px;
            font-size:11px; font-weight:600; letter-spacing:0.22em;
            color:rgba(0,0,0,0.45);
            font-variant-numeric: tabular-nums; }
</style>
</head>
<body>
  <div class="slide">
    <div class="kicker">Generational leap</div>
    <h1 data-pptx-role="title" class="title">Render times, halved. And then halved again.</h1>

    <div class="col col-was">
      <div class="col-label">Was</div>
      <div class="number">12.4<span class="unit">s</span></div>
      <div class="sub">Previous generation, average frame.</div>
    </div>

    <svg class="arrow" width="96" height="48" viewBox="0 0 96 48" fill="none" xmlns="http://www.w3.org/2000/svg">
      <line x1="8" y1="24" x2="80" y2="24" stroke="#30d158" stroke-width="2"/>
      <polyline points="68,12 88,24 68,36" stroke="#30d158" stroke-width="2" fill="none"/>
    </svg>

    <div class="col col-now">
      <div class="col-label">Now</div>
      <div class="number">2.9<span class="unit">s</span></div>
      <div class="sub">Same frame, on the new silicon.</div>
    </div>

    <div class="pageno">14 / 17</div>
  </div>
</body>
</html>
