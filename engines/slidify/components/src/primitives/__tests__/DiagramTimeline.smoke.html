<!doctype html>
<html lang="en"><head><meta charset="utf-8" /><title>diagram.timeline</title>
<style>
  body { margin:0; background:#0a0a0f; font-family:Inter,sans-serif; color:#f5f5f7; }
  .slide { position:relative; width:1280px; height:720px; margin:24px auto; background:#070710; overflow:hidden; }
  .timeline { position:absolute; left:96px; top:300px; width:1088px; height:240px; }
  .rail { position:absolute; left:0; top:120px; width:1088px; height:1px; background:rgba(255,255,255,0.5); }
  .ev { position:absolute; top:0; }
  .tick { position:absolute; left:0; top:114px; width:1px; height:12px; background:#a78bfa; }
  .dot { position:absolute; left:-5px; top:115px; width:10px; height:10px; background:#a78bfa; border-radius:50%; }
  .date { position:absolute; left:-60px; top:140px; width:120px; font-size:13px; color:#a1a1aa; text-align:center; }
  .label { position:absolute; left:-80px; top:170px; width:160px; font-size:11px; font-weight:600; letter-spacing:0.42em; text-transform:uppercase; color:#f5f5f7; text-align:center; }
</style></head>
<body>
  <div class="slide">
    <div class="timeline">
      <div class="rail"></div>
      <div class="ev" style="left:54px;">  <div class="tick"></div><div class="dot"></div><div class="date">Q1 25</div><div class="label">Beta</div></div>
      <div class="ev" style="left:380px;"> <div class="tick"></div><div class="dot"></div><div class="date">Q2 25</div><div class="label">GA</div></div>
      <div class="ev" style="left:707px;"> <div class="tick"></div><div class="dot"></div><div class="date">Q3 25</div><div class="label">Scale</div></div>
      <div class="ev" style="left:1033px;"><div class="tick"></div><div class="dot"></div><div class="date">Q4 25</div><div class="label">Series A</div></div>
    </div>
  </div>
</body></html>
