<!doctype html>
<html lang="en"><head><meta charset="utf-8" /><title>annotation.badge</title>
<style>
  body { margin:0; background:#0a0a0f; font-family:Inter,sans-serif; color:#f5f5f7; }
  .slide { position:relative; width:1280px; height:720px; margin:24px auto; background:#070710; overflow:hidden; padding:96px; box-sizing:border-box; }
  .pill { display:inline-flex; align-items:center; padding:4px 12px; border-radius:9999px; background:rgba(99,102,241,0.16); color:#818cf8; font-size:12px; font-weight:600; }
  .stamp { display:inline-flex; align-items:center; padding:6px 12px; border:2px solid #ef4444; color:#ef4444; font-weight:700; font-size:14px; letter-spacing:0.08em; transform:rotate(-8deg); }
  .sticker { display:inline-flex; align-items:center; padding:8px 14px; border:2px solid #fbbf24; background:rgba(251,191,36,0.16); color:#fbbf24; font-weight:700; font-size:14px; border-radius:12px; box-shadow:2px 4px 0 #fbbf24; }
</style></head>
<body>
  <div class="slide">
    <span class="pill" style="position:absolute; left:80px; top:120px;">NEW</span>
    <span class="stamp" style="position:absolute; left:240px; top:120px;">DRAFT</span>
    <span class="sticker" style="position:absolute; left:400px; top:120px;">WOW</span>
  </div>
</body></html>
