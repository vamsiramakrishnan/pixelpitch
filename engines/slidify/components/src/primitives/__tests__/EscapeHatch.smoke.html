<!DOCTYPE html>
<!--
  Smoke preview for the EscapeHatch primitive.

  Open in a browser. The styled square below mirrors what `<EscapeHatch>`
  would render in React: the cssPayload is applied to an inner div, and the
  parent absolute box is positioned per the bbox prop.

  Keep this trivial — the goal is "does the visual escape look right?",
  not "does the React preview match perfectly". The Python compiler is the
  authority on what ships in the .pptx.
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>EscapeHatch — smoke preview</title>
    <style>
      body { margin: 0; background: #0a0a14; font-family: Inter, sans-serif; color: #fff; }
      .stage { position: relative; width: 1280px; height: 720px; margin: 0 auto; }
      .label { position: fixed; top: 8px; left: 8px; opacity: 0.65; font-size: 12px; }
    </style>
  </head>
  <body>
    <div class="label">EscapeHatch primitive · cssPayload = clip-path triangle + radial fill</div>
    <div class="stage">
      <!-- Mirrors: <EscapeHatch bbox={{x:240,y:160,w:800,h:400}}
                       cssPayload="background: radial-gradient(...); clip-path: polygon(...);"
                       intent="non-rect-clip"
                       attempted="surf.glass" /> -->
      <div
        data-atom="chrome.escape-hatch"
        data-intent="non-rect-clip"
        data-attempted="surf.glass"
        style="position: absolute; left: 240px; top: 160px; width: 800px; height: 400px;"
      >
        <div
          style="
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at 30% 30%, #a78bfa, #1e1b4b 70%);
            clip-path: polygon(50% 0%, 100% 100%, 0% 100%);
          "
        ></div>
      </div>
    </div>
  </body>
</html>
