<!doctype html>
<html lang="en"><head><meta charset="utf-8" /><title>data.bar</title>
<style>
  body { margin:0; background:#0a0a0f; font-family:Inter,sans-serif; color:#f5f5f7; }
  .slide { position:relative; width:1280px; height:720px; margin:24px auto; background:#070710; overflow:hidden; padding:96px; box-sizing:border-box; display:flex; gap:96px; }
  .col { flex:1; }
  .lab { font-size:11px; color:#a1a1aa; letter-spacing:0.18em; text-transform:uppercase; margin-bottom:16px; }
  .vbars { display:flex; align-items:flex-end; gap:12px; height:240px; }
  .vbar { background:#a78bfa; border-radius:4px; width:40px; }
  .hbars { display:flex; flex-direction:column; gap:12px; }
  .hbar { background:#a78bfa; border-radius:4px; height:24px; }
</style></head>
<body>
  <div class="slide">
    <div class="col">
      <div class="lab">orientation=vertical</div>
      <div class="vbars">
        <div class="vbar" style="height:50%"></div>
        <div class="vbar" style="height:80%"></div>
        <div class="vbar" style="height:35%"></div>
        <div class="vbar" style="height:95%"></div>
        <div class="vbar" style="height:62%"></div>
      </div>
    </div>
    <div class="col">
      <div class="lab">orientation=horizontal</div>
      <div class="hbars">
        <div class="hbar" style="width:50%"></div>
        <div class="hbar" style="width:80%"></div>
        <div class="hbar" style="width:35%"></div>
        <div class="hbar" style="width:95%"></div>
        <div class="hbar" style="width:62%"></div>
      </div>
    </div>
  </div>
</body></html>
