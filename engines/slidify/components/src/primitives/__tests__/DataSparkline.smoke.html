<!doctype html>
<html lang="en"><head><meta charset="utf-8" /><title>data.sparkline</title>
<style>
  body { margin:0; background:#0a0a0f; font-family:Inter,sans-serif; color:#f5f5f7; }
  .slide { position:relative; width:1280px; height:720px; margin:24px auto; background:#070710; overflow:hidden; padding:96px; box-sizing:border-box; display:flex; flex-direction:column; gap:48px; }
  .lab { font-size:11px; color:#a1a1aa; letter-spacing:0.18em; text-transform:uppercase; margin-bottom:8px; }
  .panel { background:#0e0e1a; border-radius:16px; padding:24px; }
</style></head>
<body>
  <div class="slide">
    <div class="panel">
      <div class="lab">data.sparkline · stroke + last marker</div>
      <svg width="320" height="80" viewBox="0 0 320 80">
        <polyline points="0,60 40,50 80,55 120,30 160,35 200,15 240,25 280,8 320,20" fill="none" stroke="#a78bfa" stroke-width="2" />
        <circle cx="320" cy="20" r="4" fill="#a78bfa" />
      </svg>
    </div>
    <div class="panel">
      <div class="lab">data.sparkline · fillUnder=true</div>
      <svg width="320" height="80" viewBox="0 0 320 80">
        <polygon points="0,80 0,60 40,50 80,55 120,30 160,35 200,15 240,25 280,8 320,20 320,80" fill="#a78bfa" fill-opacity="0.2" />
        <polyline points="0,60 40,50 80,55 120,30 160,35 200,15 240,25 280,8 320,20" fill="none" stroke="#a78bfa" stroke-width="2" />
        <circle cx="320" cy="20" r="4" fill="#a78bfa" />
      </svg>
    </div>
  </div>
</body></html>
