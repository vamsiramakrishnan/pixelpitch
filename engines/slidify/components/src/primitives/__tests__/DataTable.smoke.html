<!doctype html>
<html lang="en"><head><meta charset="utf-8" /><title>data.table</title>
<style>
  body { margin:0; background:#0a0a0f; font-family:Inter,sans-serif; color:#f5f5f7; }
  .slide { position:relative; width:1280px; height:720px; margin:24px auto; background:#070710; overflow:hidden; padding:96px; box-sizing:border-box; }
  table { width:100%; border-collapse:collapse; }
  th { background:#0e0e1a; padding:16px; text-align:left; font-size:11px; font-weight:600; color:#d4d4d8; letter-spacing:0.42em; text-transform:uppercase; border-bottom:1px solid rgba(255,255,255,0.18); }
  td { padding:16px; font-size:16px; color:#f5f5f7; }
  tr:nth-child(even) td { background:rgba(14,14,26,0.4); }
</style></head>
<body>
  <div class="slide">
    <table>
      <thead><tr><th>Name</th><th>Value</th><th>Delta</th></tr></thead>
      <tbody>
        <tr><td>Alpha</td><td>12</td><td>+1</td></tr>
        <tr><td>Beta</td><td>34</td><td>-2</td></tr>
        <tr><td>Gamma</td><td>56</td><td>+3</td></tr>
      </tbody>
    </table>
  </div>
</body></html>
