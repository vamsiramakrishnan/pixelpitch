name: components-ci

# Wave-2B-v2 / M5: renderer ↔ matcher consistency gate.
#
# Three layers (per engines/slidify/components/CI.md):
#   1. codegen-atoms-check  — atoms.yaml ↔ generated TSX drift gate (M2).
#   2. contract tests       — atom-recognition (M5.1) + atom-emit (M5.2) +
#                             helpers unit tests.
#   3. preset-matrix gate   — Tier-B recipes × 7 theme presets, native_area_
#                             ratio + per-cell summary snapshots (M5.3).

on:
  pull_request:
    paths:
      - 'engines/slidify/components/**'
      - 'engines/slidify/slidify/patterns/data/atoms.yaml'
      - 'engines/slidify/slidify/patterns/matcher.py'
      - 'engines/slidify/slidify/patterns/__main__.py'
  push:
    branches: [main]

jobs:
  contract-tests:
    name: components contract + matrix
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - uses: oven-sh/setup-bun@v2

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Install Python deps (slidify)
        run: uv sync

      - name: Install JS deps (components)
        run: bun ci

      - name: Codegen drift gate (M2)
        run: bun run --filter @slidify/components codegen-atoms-check

      - name: Contract tests — recognition + emit + helpers (M5.1, M5.2, M5.5)
        run: cd engines/slidify/components && bunx vitest run src/__tests__/contract/

      - name: Preset matrix gate (M5.3)
        run: cd engines/slidify/components && bunx vitest run src/__tests__/preset-matrix/
