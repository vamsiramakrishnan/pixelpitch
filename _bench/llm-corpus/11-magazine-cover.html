    <!DOCTYPE html>
    <html lang="en">
    <head>
    <meta charset="utf-8">
    <title>11 Magazine Cover</title>
    <style>*, *::before, *::after { box-sizing: border-box; }
html, body { margin:0; padding:0; width:1280px; height:720px;
             font-family: 'Playfair Display', 'Times New Roman', Georgia, serif;
             -webkit-font-smoothing:antialiased;
             color:#0a0a0a; background:#fde9ec; }
.slide { position:relative; width:1280px; height:720px; padding:80px;
         overflow:hidden; background:#fde9ec; }</style>
    </head>
    <body>
    <div class="slide" style="padding:0; background:#e11d48;">
      <!-- masthead -->
      <div style="position:absolute; top:36px; left:48px; right:48px;
                  display:flex; justify-content:space-between; align-items:flex-end;
                  border-bottom:2px solid #0a0a0a; padding-bottom:14px;">
        <div style="font-family:'Bebas Neue', 'Anton', Impact, sans-serif; font-size:64px; line-height:0.86;
                    letter-spacing:0.02em; color:#0a0a0a;">PITCH</div>
        <div style="font-family:'Playfair Display', 'Times New Roman', Georgia, serif; font-style:italic; font-size:14px;
                    color:#0a0a0a;">Issue No. 04 · Spring 2026 · $14</div>
      </div>

      <!-- diagonal photo block -->
      <div style="position:absolute; top:130px; right:48px; width:520px; height:520px;
                  background: linear-gradient(135deg,#0a0a0a 0%,#1a1a1a 60%,#3a3a3a 100%);
                  border:2px solid #0a0a0a;">
        <div style="position:absolute; inset:0;
                    background:radial-gradient(circle at 30% 35%, rgba(255,255,255,0.12) 0%,
                               transparent 55%);"></div>
        <div style="position:absolute; bottom:24px; left:24px; right:24px;
                    color:#fff; font-family:'Bebas Neue', 'Anton', Impact, sans-serif;
                    font-size:36px; line-height:0.95;">A NEW<br/>EDITORIAL ENGINE</div>
      </div>

      <!-- huge headline -->
      <div style="position:absolute; top:170px; left:48px; max-width:680px;">
        <div style="font-family:'Playfair Display', 'Times New Roman', Georgia, serif; font-style:italic; font-size:18px;
                    color:#0a0a0a; margin-bottom:16px;">The cover story</div>
        <h1 data-pptx-role="title"
            style="margin:0; font-family:'Bebas Neue', 'Anton', Impact, sans-serif;
                   font-size:184px; line-height:0.84; letter-spacing:-0.02em;
                   color:#0a0a0a;">
          DESIGNED<br/>FOR<br/><span style="color:#ffffff;
                                            background:#0a0a0a; padding:0 16px;">EDITORS</span>
        </h1>
      </div>

      <!-- footer dek -->
      <div style="position:absolute; bottom:48px; left:48px; right:48px;
                  display:flex; gap:32px; align-items:flex-end;
                  border-top:2px solid #0a0a0a; padding-top:14px;
                  font-family:'Playfair Display', 'Times New Roman', Georgia, serif; color:#0a0a0a;">
        <div style="flex:1; font-size:14px; line-height:1.45;">
          Inside: how slidify rewrote the rules of editable presentations,
          why every shape matters, and the case for typographic restraint.
        </div>
        <div style="font-family:'Bebas Neue', 'Anton', Impact, sans-serif; font-size:24px; line-height:0.9;">
          PP / 04
        </div>
      </div>
    </div>
    </body>
    </html>
