<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Slide 64 — Photo + Giant Pull-Quote</title>
<style>
  html, body { margin:0; padding:0; width:1280px; height:720px;
               -webkit-font-smoothing:antialiased; background:#0a0a0a; }
  .slide {
    width:1280px; height:720px; box-sizing:border-box;
    position:relative; overflow:hidden;
    font-family: 'Tiempos Headline', 'Source Serif Pro', Georgia, serif;
    background:#0a0a0a;
    color:#fff;
  }
  /* Faded photo overlay — opacity 0.35 */
  .photo {
    position:absolute; inset:0;
    width:100%; height:100%;
    object-fit:cover;
    opacity:0.35;
    filter: contrast(1.05) brightness(0.95);
  }
  .darken {
    position:absolute; inset:0;
    background: radial-gradient(ellipse at 50% 55%,
      rgba(0,0,0,0) 0%,
      rgba(0,0,0,0.35) 60%,
      rgba(0,0,0,0.78) 100%);
  }
  .nav {
    position:absolute; top:36px; left:64px; right:64px;
    display:flex; align-items:center; justify-content:space-between;
    font-family: 'Inter Display', 'Inter', sans-serif;
    font-size:11px; font-weight:600; letter-spacing:0.32em;
    text-transform:uppercase;
    color:rgba(255,255,255,0.78);
  }
  .nav .mark {
    font-family: 'Tiempos Headline', 'Source Serif Pro', Georgia, serif;
    font-size:18px; font-weight:900; letter-spacing:-0.02em;
    text-transform:none; color:#fff;
  }
  .open-quote {
    position:absolute; left:88px; top:140px;
    font-family: 'Tiempos Headline', 'Source Serif Pro', Georgia, serif;
    font-size:240px; line-height:0.7; font-weight:900;
    color:#1eff8c; /* neon green accent */
    opacity:0.9;
    letter-spacing:-0.04em;
  }
  .pullquote {
    position:absolute; left:120px; right:120px; top:208px;
    font-family: 'Tiempos Headline', 'Source Serif Pro', Georgia, serif;
    font-size:84px; line-height:1.04; font-weight:700;
    letter-spacing:-0.035em;
    color:#fff;
    margin:0;
  }
  .pullquote em {
    font-style:italic;
    color:#1eff8c;
  }
  .attribution {
    position:absolute; left:120px; bottom:120px;
    display:flex; align-items:center; gap:18px;
    font-family: 'Inter Display', 'Inter', sans-serif;
    font-size:13px; font-weight:500;
    color:rgba(255,255,255,0.92);
  }
  .attribution .rule {
    width:48px; height:1px; background:rgba(255,255,255,0.6);
  }
  .attribution .name {
    font-weight:700; letter-spacing:0.02em;
    color:#fff;
  }
  .attribution .role {
    font-style:italic; color:rgba(255,255,255,0.72);
  }
  .footer {
    position:absolute; left:64px; right:64px; bottom:36px;
    display:flex; align-items:center; justify-content:space-between;
    font-family: 'Inter Display', 'Inter', sans-serif;
    font-size:10px; font-weight:600; letter-spacing:0.32em;
    text-transform:uppercase;
    color:rgba(255,255,255,0.55);
  }
  .corner {
    position:absolute; right:64px; top:140px;
    width:1px; height:160px;
    background:linear-gradient(180deg, transparent, rgba(255,255,255,0.55), transparent);
  }
</style>
</head>
<body>
<div class="slide">
  <img class="photo"
       src="https://images.unsplash.com/photo-1518791841217-8f162f1e1131?w=1280"
       alt="Cat in monochrome — atmospheric backdrop">
  <div class="darken"></div>

  <div class="nav">
    <span class="mark">Real Life</span>
    <span>Conversations &middot; 03</span>
    <span>April 2026</span>
  </div>

  <div class="open-quote">&ldquo;</div>

  <h1 class="pullquote" data-pptx-role="title">
    The work was never about being <em>seen</em>.<br>
    It was about <em>seeing</em> &mdash; and learning,<br>
    finally, when to look away.
  </h1>

  <div class="corner"></div>

  <div class="attribution">
    <span class="rule"></span>
    <span class="name">JUNO ELIAS-MORI</span>
    <span class="role">photographer, in conversation</span>
  </div>

  <div class="footer">
    <span>Conversation No. 03 / Excerpt</span>
    <span>Photo &mdash; J. Elias-Mori, 2024</span>
    <span>P.&nbsp;028</span>
  </div>
</div>
</body>
</html>
