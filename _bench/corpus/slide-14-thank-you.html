<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Slide 14 — Thank you</title>
<style>
  html, body { margin:0; padding:0; width:1280px; height:720px;
               -webkit-font-smoothing:antialiased; background:#000; }
  .slide { width:1280px; height:720px; box-sizing:border-box;
           position:relative; overflow:hidden; background:#000;
           font-family:'SF Pro Display', -apple-system, Inter, sans-serif;
           color:#ffffff; }
  .kicker { position:absolute; top:64px; left:80px;
            font-size:11px; font-weight:600; letter-spacing:0.22em;
            text-transform:uppercase; color:#30d158; }
  .title { position:absolute; top:280px; left:80px;
           font-size:180px; font-weight:800; letter-spacing:-0.04em;
           line-height:0.92; color:#ffffff; }
  .accent-dot { position:absolute; top:392px; left:1108px;
                width:24px; height:24px; border-radius:9999px;
                background:#30d158; }
  .sub { position:absolute; top:512px; left:80px;
         font-size:24px; font-weight:400; line-height:1.3;
         color:rgba(255,255,255,0.65); max-width:760px; }
  .footer { position:absolute; bottom:48px; left:80px;
            font-size:11px; font-weight:600; letter-spacing:0.22em;
            text-transform:uppercase; color:rgba(255,255,255,0.45); }
  .pageno { position:absolute; bottom:48px; right:80px;
            font-size:11px; font-weight:600; letter-spacing:0.22em;
            color:rgba(255,255,255,0.45);
            font-variant-numeric: tabular-nums; }
</style>
</head>
<body>
  <div class="slide">
    <div class="kicker">Fin</div>
    <h1 data-pptx-role="title" class="title">Thank&nbsp;you.</h1>
    <div class="accent-dot"></div>
    <div class="sub">Available everywhere on <b style="color:#ffffff;font-weight:600">May 14</b>.</div>
    <div class="footer">Keynote &mdash; Spring 2026</div>
    <div class="pageno">17 / 17</div>
  </div>
</body>
</html>
