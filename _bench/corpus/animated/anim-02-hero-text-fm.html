<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="slidify-capture-duration" content="3500">
<meta name="slidify-capture-fps" content="15">
<title>Hero text reveal (Framer Motion)</title>
<style>
  html, body { margin:0; padding:0; width:1280px; height:720px;
               font-family: Inter, sans-serif; background:#0a0a0f;
               color:#f5f5f7; -webkit-font-smoothing:antialiased; }
  .slide { width:1280px; height:720px; box-sizing:border-box;
           position:relative; overflow:hidden;
           background: linear-gradient(135deg, #4338ca 0%, #7c3aed 50%, #ec4899 100%); }
  .blob { position:absolute; border-radius:50%; filter:none; opacity:0.6;
          mix-blend-mode:screen; }
  .blob.b1 { width:520px; height:520px; left:-180px; top:-180px;
             background: radial-gradient(circle, #818cf8 0%, transparent 70%); }
  .blob.b2 { width:640px; height:640px; right:-220px; bottom:-220px;
             background: radial-gradient(circle, #f472b6 0%, transparent 70%); }
  .stack { position:absolute; left:96px; right:96px; top:50%;
           transform: translateY(-50%); }
  .kicker { font-size:13px; letter-spacing:0.24em; text-transform:uppercase;
            color: rgba(255,255,255,0.8); margin-bottom:24px; }
  h1 { font-size:96px; line-height:0.98; letter-spacing:-0.035em;
       font-weight:700; margin:0; }
  .word { display:inline-block; overflow:hidden; padding:0 0.04em; }
  .word > span { display:inline-block; will-change: transform, opacity; }
  .lede { font-size:22px; line-height:1.45; max-width:780px;
          color: rgba(255,255,255,0.9); margin-top:36px;
          letter-spacing:-0.005em; }
  .footer { position:absolute; left:96px; right:96px; bottom:48px;
            display:flex; justify-content:space-between; font-size:12px;
            color: rgba(255,255,255,0.7); letter-spacing:0.18em;
            text-transform:uppercase; }
</style>
</head>
<body>
<div class="slide">
  <div class="blob b1"></div>
  <div class="blob b2"></div>
  <div class="stack">
    <div class="kicker" data-kicker>Keynote · Spring 2026</div>
    <h1 data-pptx-role="title">
      <span class="word"><span>Build</span></span>
      <span class="word"><span>decks</span></span>
      <span class="word"><span>that</span></span>
      <br>
      <span class="word"><span>think</span></span>
      <span class="word"><span>like</span></span>
      <span class="word"><span>you</span></span>
      <span class="word"><span>do.</span></span>
    </h1>
    <p class="lede" data-lede>
      Slidify turns animation-rich HTML into PowerPoint that plays the
      same story, frame for frame, on every renderer your audience uses.
    </p>
  </div>
  <div class="footer">
    <span data-footer>Pixelpitch · The motion-aware deck engine</span>
    <span data-footer>Page 02</span>
  </div>
</div>

<script type="module">
  import { animate, stagger } from "https://cdn.jsdelivr.net/npm/framer-motion@11.11.17/+esm";

  animate("[data-kicker]", { opacity: [0, 1], y: [12, 0] },
    { duration: 0.5, delay: 0.1, ease: "easeOut" });

  animate(".word > span",
    { y: ["100%", "0%"], opacity: [0, 1] },
    { duration: 0.7, delay: stagger(0.07, { startDelay: 0.35 }),
      ease: [0.22, 1, 0.36, 1] });

  animate("[data-lede]", { opacity: [0, 1], y: [16, 0] },
    { duration: 0.7, delay: 1.45, ease: "easeOut" });

  animate("[data-footer]", { opacity: [0, 1] },
    { duration: 0.5, delay: 1.85 });
</script>
</body>
</html>
