<!doctype html>
<html lang="en"><head><meta charset="utf-8" /><title>data.delta-badge</title>
<style>
  body { margin:0; background:#0a0a0f; font-family:Inter,sans-serif; color:#f5f5f7; }
  .slide { position:relative; width:1280px; height:720px; margin:24px auto; background:#070710; overflow:hidden; padding:96px; box-sizing:border-box; }
  .pill { display:inline-flex; align-items:center; gap:4px; padding:4px 10px; border-radius:9999px; font-size:13px; font-weight:600; }
</style></head>
<body>
  <div class="slide">
    <span class="pill" style="position:absolute; left:80px; top:120px; background:rgba(16,185,129,0.18); color:#86efac;">▲ +29.4%</span>
    <span class="pill" style="position:absolute; left:240px; top:120px; background:rgba(239,68,68,0.18); color:#fca5a5;">▼ -3.2%</span>
    <span class="pill" style="position:absolute; left:400px; top:120px; background:rgba(161,161,170,0.16); color:#d4d4d8;">◆ flat</span>
  </div>
</body></html>
