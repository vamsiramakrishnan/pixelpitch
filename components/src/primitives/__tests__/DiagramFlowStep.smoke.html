<!doctype html>
<html lang="en"><head><meta charset="utf-8" /><title>diagram.flow-step</title>
<style>
  body { margin:0; background:#0a0a0f; font-family:Inter,sans-serif; color:#f5f5f7; }
  .slide { position:relative; width:1280px; height:720px; margin:24px auto; background:#070710; overflow:hidden; padding:96px; box-sizing:border-box; }
  .step { display:flex; align-items:center; gap:12px; }
  .dot { width:36px; height:36px; background:#a78bfa; color:#070710; border-radius:9999px; display:inline-flex; align-items:center; justify-content:center; font-weight:700; font-size:14px; }
</style></head>
<body>
  <div class="slide">
    <div class="step" style="position:absolute; left:80px; top:120px;"><span class="dot">1</span><span>Discover</span></div>
    <div class="step" style="position:absolute; left:80px; top:180px;"><span class="dot">2</span><span>Design</span></div>
    <div class="step" style="position:absolute; left:80px; top:240px;"><span class="dot">3</span><span>Ship</span></div>
  </div>
</body></html>
