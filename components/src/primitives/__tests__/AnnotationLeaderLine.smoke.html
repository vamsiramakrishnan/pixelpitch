<!doctype html>
<html lang="en"><head><meta charset="utf-8" /><title>annotation.leader-line</title>
<style>
  body { margin:0; background:#0a0a0f; font-family:Inter,sans-serif; color:#f5f5f7; }
  .slide { position:relative; width:1280px; height:720px; margin:24px auto; background:#070710; overflow:hidden; padding:96px; box-sizing:border-box; }
</style></head>
<body>
  <div class="slide">
    <svg width="800" height="400" viewBox="0 0 800 400" style="position:absolute; left:80px; top:80px;">
      <defs>
        <marker id="arrowhead" markerWidth="6" markerHeight="6" refX="6" refY="3" orient="auto">
          <polygon points="0 0, 6 3, 0 6" fill="#a1a1aa" />
        </marker>
      </defs>
      <line x1="80" y1="80" x2="600" y2="280" stroke="#a1a1aa" stroke-width="1.5" marker-end="url(#arrowhead)" />
    </svg>
  </div>
</body></html>
