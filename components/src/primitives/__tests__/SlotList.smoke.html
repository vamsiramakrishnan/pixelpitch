<!doctype html>
<html lang="en"><head><meta charset="utf-8" /><title>slot.list</title>
<style>
  body { margin:0; background:#0a0a0f; font-family:Inter,sans-serif; color:#f5f5f7; }
  .slide { position:relative; width:1280px; height:720px; margin:24px auto; background:#070710; overflow:hidden; padding:96px; box-sizing:border-box; display:flex; gap:96px; }
  .col { flex:1; display:flex; flex-direction:column; gap:12px; font-size:16px; line-height:1.55; }
  .row { display:flex; gap:12px; }
  .marker { width:32px; flex:0 0 auto; text-align:right; }
  .lab { font-size:11px; color:#a78bfa; letter-spacing:0.18em; text-transform:uppercase; margin-bottom:8px; }
  .accent { color:#a78bfa; }
  .ink3 { color:#a1a1aa; }
</style></head>
<body>
  <div class="slide">
    <div class="col">
      <div class="lab">marker=bullet</div>
      <div class="row"><span class="marker ink3">•</span> One thing.</div>
      <div class="row"><span class="marker ink3">•</span> Another thing.</div>
      <div class="row"><span class="marker ink3">•</span> Three.</div>
    </div>
    <div class="col">
      <div class="lab">marker=check</div>
      <div class="row"><span class="marker accent">✓</span> Ship.</div>
      <div class="row"><span class="marker accent">✓</span> Iterate.</div>
      <div class="row"><span class="marker accent">✓</span> Repeat.</div>
    </div>
    <div class="col">
      <div class="lab">marker=numbered</div>
      <div class="row"><span class="marker accent">1.</span> Plan.</div>
      <div class="row"><span class="marker accent">2.</span> Build.</div>
      <div class="row"><span class="marker accent">3.</span> Measure.</div>
    </div>
  </div>
</body></html>
