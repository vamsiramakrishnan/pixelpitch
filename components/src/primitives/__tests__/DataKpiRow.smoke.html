<!doctype html>
<html lang="en"><head><meta charset="utf-8" /><title>data.kpi-row</title>
<style>
  body { margin:0; background:#0a0a0f; font-family:Inter,sans-serif; color:#f5f5f7; }
  .slide { position:relative; width:1280px; height:720px; margin:24px auto; background:#070710; overflow:hidden; padding:96px; box-sizing:border-box; }
  .row { display:flex; gap:24px; align-items:flex-end; }
  .cell { flex:1; }
  .label { font-size:11px; color:#a1a1aa; letter-spacing:0.18em; text-transform:uppercase; margin-bottom:8px; }
  .val { font-size:88px; font-weight:800; line-height:1.0; letter-spacing:-0.045em; }
  .delta { font-size:13px; color:#10b981; margin-top:8px; }
  .delta.down { color:#ef4444; }
</style></head>
<body>
  <div class="slide">
    <div class="row">
      <div class="cell"><div class="label">ARR</div><div class="val">$12.4M</div><div class="delta">+18%</div></div>
      <div class="cell"><div class="label">Churn</div><div class="val">2.1%</div><div class="delta down">-0.3%</div></div>
      <div class="cell"><div class="label">NPS</div><div class="val">67</div><div class="delta">+9</div></div>
    </div>
  </div>
</body></html>
