<!doctype html>
<html lang="en"><head><meta charset="utf-8" /><title>chrome.window-frame</title>
<style>
  body { margin:0; background:#0a0a0f; font-family:Inter,sans-serif; color:#f5f5f7; }
  .slide { position:relative; width:1280px; height:720px; margin:24px auto; background:#070710; overflow:hidden; padding:96px; box-sizing:border-box; }
  .win { position:absolute; background:#18181b; border-radius:12px; overflow:hidden; }
  .titlebar { height:28px; background:#27272a; display:flex; align-items:center; gap:6px; padding:0 10px; font-size:12px; color:#a1a1aa; }
  .dot { width:12px; height:12px; border-radius:50%; }
</style></head>
<body>
  <div class="slide">
    <div class="win" style="left:80px; top:80px; width:880px; height:480px;">
      <div class="titlebar">
        <span class="dot" style="background:#ef4444"></span>
        <span class="dot" style="background:#fbbf24"></span>
        <span class="dot" style="background:#10b981"></span>
        <span style="margin-left:12px;">https://linear.app</span>
      </div>
    </div>
  </div>
</body></html>
