<!doctype html>
<html lang="en"><head><meta charset="utf-8" /><title>surface.shape-fill</title>
<style>
  body { margin:0; background:#0a0a0f; font-family:Inter,sans-serif; color:#f5f5f7; }
  .slide { position:relative; width:1280px; height:720px; margin:24px auto; background:#070710; overflow:hidden; padding:96px; box-sizing:border-box; }
</style></head>
<body>
  <div class="slide">
    <!-- Three variants: rect, rounded-rect, oval -->
    <div style="position:absolute; left:80px; top:80px; width:320px; height:200px; background:#a78bfa;"></div>
    <div style="position:absolute; left:480px; top:80px; width:320px; height:200px; background:linear-gradient(135deg, #6366f1, #ec4899); border-radius:16px;"></div>
    <div style="position:absolute; left:880px; top:80px; width:240px; height:240px; background:#34d399; border-radius:9999px;"></div>
  </div>
