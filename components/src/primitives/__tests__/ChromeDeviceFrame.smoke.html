<!doctype html>
<html lang="en"><head><meta charset="utf-8" /><title>chrome.device-frame</title>
<style>
  body { margin:0; background:#0a0a0f; font-family:Inter,sans-serif; color:#f5f5f7; }
  .slide { position:relative; width:1280px; height:720px; margin:24px auto; background:#070710; overflow:hidden; padding:96px; box-sizing:border-box; }
</style></head>
<body>
  <div class="slide">
    <div style="position:absolute; left:80px; top:60px; width:280px; height:560px; background:#0a0a0f; border-radius:36px; padding:8px; box-sizing:border-box;">
      <div style="width:100%; height:100%; background:#3f3f46; border-radius:28px;"></div>
      <span style="position:absolute; top:64px; left:50%; transform:translateX(-50%); width:96px; height:18px; background:#0a0a0f; border-radius:9999px;"></span>
    </div>
    <div style="position:absolute; left:480px; top:120px; width:720px; height:480px; background:#0a0a0f; border-radius:12px; padding:14px; box-sizing:border-box;">
      <div style="width:100%; height:calc(100% - 18px); background:#3f3f46; border-radius:6px;"></div>
      <div style="position:absolute; left:0; bottom:0; width:100%; height:18px; background:#27272a;"></div>
    </div>
  </div>
</body></html>
