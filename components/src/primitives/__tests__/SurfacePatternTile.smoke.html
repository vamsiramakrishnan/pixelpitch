<!doctype html>
<html lang="en"><head><meta charset="utf-8" /><title>surface.pattern-tile</title>
<style>
  body { margin:0; background:#0a0a0f; font-family:Inter,sans-serif; color:#f5f5f7; }
  .slide { position:relative; width:1280px; height:720px; margin:24px auto; background:#070710; overflow:hidden; padding:96px; box-sizing:border-box; }
</style></head>
<body>
  <div class="slide">
    <!-- dots -->
    <div style="position:absolute; left:80px; top:80px; width:280px; height:280px; background:radial-gradient(#a78bfa 1.5px, transparent 2px) 0 0 / 24px 24px;"></div>
    <!-- diagonal lines -->
    <div style="position:absolute; left:480px; top:80px; width:280px; height:280px; background:repeating-linear-gradient(45deg, #6366f1 0 1px, transparent 1px 16px);"></div>
    <!-- crosshatch -->
    <div style="position:absolute; left:880px; top:80px; width:280px; height:280px; background:repeating-linear-gradient(45deg, #ffffff 0 1px, transparent 1px 16px), repeating-linear-gradient(135deg, #ffffff 0 1px, transparent 1px 16px);"></div>
  </div>
</body></html>
