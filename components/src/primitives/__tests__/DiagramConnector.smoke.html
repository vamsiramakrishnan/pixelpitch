<!doctype html>
<html lang="en"><head><meta charset="utf-8" /><title>diagram.connector</title>
<style>
  body { margin:0; background:#0a0a0f; font-family:Inter,sans-serif; color:#f5f5f7; }
  .slide { position:relative; width:1280px; height:720px; margin:24px auto; background:#070710; overflow:hidden; }
  .lab { font-size:11px; color:#a1a1aa; letter-spacing:0.18em; text-transform:uppercase; position:absolute; }
  .node { position:absolute; padding:16px 24px; background:#16162a; border-radius:12px; font-size:14px; color:#d4d4d8; }
</style></head>
<body>
  <div class="slide">
    <svg width="1280" height="720" style="position:absolute; left:0; top:0; pointer-events:none;">
      <defs>
        <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#a1a1aa"/></marker>
      </defs>
      <!-- straight -->
      <path d="M 200 200 L 460 200" stroke="#a1a1aa" stroke-width="2" fill="none" marker-end="url(#ah)" />
      <!-- orthogonal -->
      <path d="M 200 360 L 330 360 L 330 480 L 460 480" stroke="#a1a1aa" stroke-width="2" fill="none" marker-end="url(#ah)" />
      <!-- curved -->
      <path d="M 700 200 C 850 200 850 480 1000 480" stroke="#a1a1aa" stroke-width="2" fill="none" marker-end="url(#ah)" />
    </svg>
    <div class="node" style="left:120px; top:180px;">A</div>
    <div class="lab" style="left:280px; top:160px;">straight</div>
    <div class="node" style="left:480px; top:180px;">B</div>

    <div class="node" style="left:120px; top:340px;">A</div>
    <div class="lab" style="left:260px; top:300px;">orthogonal</div>
    <div class="node" style="left:480px; top:460px;">B</div>

    <div class="node" style="left:620px; top:180px;">A</div>
    <div class="lab" style="left:820px; top:340px;">curved</div>
    <div class="node" style="left:1020px; top:460px;">B</div>
  </div>
</body></html>
